[package]
name = "univ-api"
description = "The routes, handlers and HTTP contract of Univ Server, free of any runtime's I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
univ-model = { path = "../univ-model", features = ["openapi"] }
serde = "1.0.229"
serde_json = "1.0.154"
utoipa = "6.0.0"

[dev-dependencies]
rusqlite = { version = "0.32.1", features = ["bundled"] }
