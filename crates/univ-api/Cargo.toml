[package]
name = "univ-api"
description = "The routes, handlers and HTTP contract of Univ Server, free of any runtime's I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
univ-model = { path = "../univ-model", features = ["openapi"] }
base64 = "0.22.1"
futures-util = { version = "0.3.34", default-features = false }
form_urlencoded = "1.2.2"
humantime = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
subtle = "2.6.1"
utoipa = "6.0.0"

[dev-dependencies]
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
