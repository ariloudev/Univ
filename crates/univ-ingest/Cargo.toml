[package]
name = "univ-ingest"
description = "Downloads, normalizes and cross-matches public sky data, and publishes releases for Univ Server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
univ-model = { path = "../univ-model" }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
serde_path_to_error = "0.1.20"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
