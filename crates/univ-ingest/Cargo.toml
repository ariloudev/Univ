[package]
name = "univ-ingest"
description = "Downloads, normalizes and cross-matches public sky data, and publishes releases for Univ Server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
univ-model = { path = "../univ-model" }
serde = { version = "1.0.229", features = ["derive"] }
serde_norway = "0.9.42"
serde_path_to_error = "0.1.20"
thiserror = "2.0.21"
url = "2.5.8"
futures-util = "0.3.34"
humantime = "2.4.0"
indicatif = "0.18.6"
console = "0.16.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
