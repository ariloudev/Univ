[package]
name = "univ-ingest"
description = "Downloads, normalizes and cross-matches public sky data, and publishes releases for Univ Server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
univ-model = { path = "../univ-model" }
serde = { version = "1.0.229", features = ["derive"] }
serde_norway = "0.9.42"
serde_path_to_error = "0.1.20"
thiserror = "2.0.21"
url = "2.5.8"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
humantime = "2.4.0"
indicatif = "0.18.6"
console = "0.16.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
sha2 = "0.11.1"
zip = { version = "9.2.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "time"] }
flate2 = "1.1.10"
tar = "0.4.46"
rand_chacha = "0.10.0"
serde_json = "1.0.154"
cdshealpix = "=0.10.1"
# A heap profiler, only with the `dhat-heap` feature: `cargo run --release --features dhat-heap`
# writes dhat-heap.json, which DHAT's viewer reads.
dhat = { version = "0.3.3", optional = true }

[features]
dhat-heap = ["dep:dhat"]

[dev-dependencies]
rusqlite = { version = "0.32.1", features = ["bundled"] }
tempfile = "3.27.0"
wiremock = "0.6.5"
