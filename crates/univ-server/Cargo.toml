[package]
name = "univ-server"
description = "The Cloudflare Worker of Univ Server: binds D1, R2 and the rate limiters to univ-api."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
univ-api = { path = "../univ-api" }
univ-model = { path = "../univ-model" }
worker = { version = "=0.8.7", features = ["d1"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
serde_json = "1.0.154"
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[dev-dependencies]
sha2 = "0.11.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking"] }
