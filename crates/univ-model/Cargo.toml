[package]
name = "univ-model"
description = "The shared domain model of Univ Server and Univ Ingest."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
utoipa = { version = "6.0.0", optional = true }

[features]
# OpenAPI schemas of the types Univ Server answers with, generated from these types.
openapi = ["dep:utoipa"]

[dev-dependencies]
serde_norway = "0.9.42"
