[package]
name = "univ-model"
description = "The shared domain model of Univ Server and Univ Ingest."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive", "rc"] }
thin-vec = { version = "0.2.21", features = ["serde"] }
# Exact float parsing: a tile manifest reads back to the same bytes.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"
# The Galaxy model's seeded sampling, as the tiles' subsample is drawn; no OS randomness, so it
# builds for wasm32 too.
rand_chacha = { version = "0.10.0", default-features = false }
utoipa = { version = "6.0.0", optional = true }

[features]
# OpenAPI schemas of the types Univ Server answers with, generated from these types.
openapi = ["dep:utoipa"]

[dev-dependencies]
serde_norway = "0.9.42"
