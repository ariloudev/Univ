notes: >-
  Two bright Gaia sources lie within about an arcsecond of the Hipparcos position: the primary and a fainter
  companion. Gaia DR2 linked HIP 102589 to the companion, which has no DR2 parallax. The table
  gaiaedr3.hipparcos2_best_neighbour has no row for this star. The companion's EDR3 parallax has a good RUWE
  and is close to the primary's. Whether a companion's parallax may place the system is a question for the
  lead: it is the parallax of a different Gaia source, so it is left as a dispute. No orbital or group distance
  was found.
