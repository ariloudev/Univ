notes: >-
  SIMBAD resolves HIP 74750 to HD 135160, a Be star and the primary of the visual double WDS J15166-6054;
  its Gaia DR3 identifier is source 5875492519139336704, at the Hipparcos-2 position. The fainter
  source 5875492519159307392 next to it has only a two-parameter solution. The EDR3 RUWE is only just above
  the review threshold, but the rule is applied as written. The star is not in the de Zeeuw et al. lists of
  the nearby OB associations, and no other published distance was found.
