notes: >-
  The EDR3 source sits at the Hipparcos position and matches the star in brightness; neither hipparcos2_best_neighbour
  table has a row for HIP 76880, which is why the project's cross-match found no Gaia parallax. The EDR3
  and DR2 parallaxes disagree beyond their errors, and the EDR3 RUWE marks a poor single-star fit, so
  neither places the star. No other published distance was found.
