unplaced: 'No usable distance: the Hipparcos-2 parallax is the only other one, whose error is above a
  tenth of the parallax; the Gaia EDR3 parallax of the star has a RUWE above the limit for a reliable
  single-star solution, and Gaia DR2 disagrees with it; no cluster membership or modelling distance was
  found.'
