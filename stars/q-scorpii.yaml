notes: >-
  The Gaia DR3 identifier SIMBAD gives for HD 159433 is source 5961830948155839360. That source has a
  five-parameter EDR3 solution at the Hipparcos position, which DR3 republished unchanged. Its RUWE fails review
  rule B, and the DR2 and EDR3 parallaxes differ by more than their errors, so neither places the star. The
  table gaiaedr3.hipparcos2_best_neighbour has no row for this star. No other published distance was found.
