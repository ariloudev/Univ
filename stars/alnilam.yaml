notes: >-
  The error is the uncertainty of the median, not the depth of the subgroup: the paper's radial
  dispersion of OB1b is much larger, and is the better measure of how far an individual member
  may lie from the median. The paper also notes that "the single star ε Ori has a similar
  spectroscopic distance modulus", which supports the placement. The members' list behind the
  median is that of Brown et al., not read here.
