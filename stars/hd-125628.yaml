unplaced: No published distance other than the Hipparcos-2 parallax, whose error is above a tenth of the
  parallax; Gaia DR2 and EDR3 give the star (source 5891112112577938816) only a two-parameter solution,
  and no cluster membership or modelling distance was found.
disputes: []
notes: >-
  Gaia DR2 and DR3 publish a precise parallax for a fainter source about nine arcseconds away (source
  5891112112577932800), possibly the companion of the double-star entry DUN 159A, but it is not in the
  Multiple Star Catalog and no paper was found that shows it is physical or applies its parallax to HD
  125628; the brief forbids applying it ourselves. Its parallax is well above the Hipparcos-2 value of
  HD 125628, so the pair may be optical.
