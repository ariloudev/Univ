notes: >-
  The EDR3 source is the Gaia DR3 identifier SIMBAD gives for HD 40657 and lies at the Hipparcos position. The
  table gaiaedr3.hipparcos2_best_neighbour has no row for this star. The Hipparcos-2 parallax is smaller than
  either Gaia value. Its three trigonometric parallaxes disagree beyond their errors, and the EDR3 fit is poor.
  No other published distance was found.
