# Wezen, delta Canis Majoris, F8Ia supergiant: Hipparcos-2 parallax error above a tenth of the parallax, no Gaia parallax.
hip: 34444
name: Wezen
alternative_names: ["delta Canis Majoris", "del CMa", "25 CMa", "HD 54605"]
papers:
  - id: dezeeuw-1999
    reference: "de Zeeuw, Hoogerwerf, de Bruijne, Brown & Blaauw 1999, AJ 117, 354"
    title: "A Hipparcos census of the nearby OB associations"
    bibcode: 1999AJ....117..354D
    doi: 10.1086/300682
    arxiv: "astro-ph/9809227"
    read: "arXiv PDF of astro-ph/9809227v1, full text extracted with pypdf; Sect. 6.1 Collinder 121 (PDF page 21) read"
  - id: fleming-2023
    reference: "Fleming, Kirk & Ward-Thompson 2023, MNRAS, Stellar clustering and the kinematics of stars around Collinder 121 using Gaia DR3"
    title: "Stellar clustering and the kinematics of stars around Collinder 121 using Gaia DR3"
    doi: 10.1093/mnras/stad1817
    arxiv: "2306.08578"
    read: "arXiv PDF of 2306.08578v1, full text extracted with pypdf; abstract and introduction read"
  - id: davis-2007
    reference: "Davis, Booth, Ireland, Jacob, North, Owens, Robertson, Tango & Tuthill 2007, PASA 24, 151"
    title: "The Emergent Flux and Effective Temperature of Delta Canis Majoris"
