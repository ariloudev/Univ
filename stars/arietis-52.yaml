unplaced: No published distance for 52 Ari itself other than the Hipparcos-2 parallax, whose error is
  above a tenth of the parallax; Gaia DR2 has no source for the primary and Gaia EDR3 only a two-parameter
  solution (source 111968221155410560), and no cluster membership or modelling distance was found.
