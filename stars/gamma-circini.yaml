disputes: []
notes: >-
  The Gaia DR2 best neighbour of HIP 75323 is source 5876786743052644480. It is far too faint to be the primary,
  so its parallax is not this star's. EDR3 has the primary (source 5876786747391373696) without a parallax. The
  star is not in the Sco OB2 member lists of de Zeeuw et al. 1999 or Rizzuto et al. 2011. Tokovinin 2012
  lists only a speckle measure of HJ 4757, not an orbit. Hipparcos-2 misses the bar only narrowly, so a
  future orbital parallax could settle this star.
