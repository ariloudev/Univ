notes: >-
  The distance applies a companion's Gaia DR3 parallax to the bright system, so it is recorded as
  inferred. The authors argue that the pair is physical, from the small number of stars as bright
  as Ca+Cb near δ Ori, and that δ Ori B, by contrast, lies much nearer and is not related. The
  value agrees with their median Gaia DR3 distance of Orion OB1b, (382 ± 1) pc, to which δ Ori
  belongs.
