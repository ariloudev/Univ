  cell: "94"
disputes:
  - claim: "North et al. derive a dynamical parallax of 5.76 ± 0.68 mas from their interferometric orbit, with an error above a tenth of the value."
    cite:
      paper: north-2007
      page: 6
      sentence: "Combining these values of a1 and a2 with the angular semi-major axis of the relative orbit in Table 4, the dynamical parallax was found to be πd = 5.76 ± 0.68 mas."
  - claim: "North et al. put the system at 174^{+23}_{-18} pc, beyond the subgroup mean."
    cite:
      paper: north-2007
      page: 7
      sentence: "The distance to the system is therefore 174^{+23}_{-18} pc, which is consistent within uncertainties with the Hipparcos value of 225^{+50}_{-35} pc."
  - claim: "Gaia DR2 gives source 6048602103659567488 a parallax of 9.955620698290137 mas, nearer than the subgroup mean."
    cite: { paper: gaia-dr2-2018, table: "gaiadr2.gaia_source", row: "source 6048602103659567488", column: "parallax", cell: "9.955620698290137" }
  - claim: "Its Gaia DR2 parallax error is 1.0871674826492144 mas, above a tenth of the parallax."
    cite: { paper: gaia-dr2-2018, table: "gaiadr2.gaia_source", row: "source 6048602103659567488", column: "parallax_error", cell: "1.0871674826492144" }
notes: >-
  The star's own parallaxes all have errors above a tenth of their values and fall on both sides of the
  subgroup mean. North et al. 2007 combine a SUSI interferometric orbit of the spectroscopic pair with
  literature radial velocities. They read de Zeeuw et al. 1999 as making sigma Sco a secure Upper Scorpius
  member, with the probability in Table C1. Gaia EDR3/DR3 gives no parallax. Rizzuto et al. 2011 also list
  HIP 80112 in their Sco OB2 member table A1. The value used is the de Zeeuw et al. US mean, which rests on
  Hipparcos-1 parallaxes. Its formal error does not include the depth of the subgroup.
