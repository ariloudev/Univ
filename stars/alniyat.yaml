distance:
  value: 145
  unit: parsec
  kind: inferred
  uncertainty: { form: symmetric, sigma: 2 }
  cite:
    paper: dezeeuw-1999
    page: 12
    sentence: "The mean distance of US is 145±2 pc, where the error is the formal error on the mean, and the correction applied for the bias caused by exclusion of stars with negative parallaxes is negligible (§3.6)."
  distance_kind: geometric
  method: "mean Hipparcos parallax distance of the Upper Scorpius (US) subgroup of Sco OB2, applied to the member star"
membership:
  paper: dezeeuw-1999
  table: "Table C1 (Membership lists), Upper Scorpius block, page 50"
  row: "HIP 80112"
