notes: >-
  The Gaia source sits at the Hipparcos position and is in neither hipparcos2_best_neighbour table, which
  is why the project's cross-match found no Gaia parallax. The Hipparcos-2 parallax lies between the DR2
  and EDR3 values. The EDR3 parallax is the closest to usable of the star's determinations, but its RUWE
  is above the limit. No other published distance was found.
