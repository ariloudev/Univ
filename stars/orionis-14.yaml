notes: >-
  The DR2 source sits at the Hipparcos position and is not in gaiadr2.hipparcos2_best_neighbour. 14 Ori
  is a close visual binary with orbital motion, which can bias a single-star solution. The dynamical parallax
  rests on the visual orbit and assumed masses and has no stated error, and inverting it would be our
  own arithmetic.
