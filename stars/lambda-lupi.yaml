unplaced: "the Upper Centaurus Lupus distance cannot be applied: the star's own trigonometric parallaxes (Hipparcos-2 and Gaia DR2) put it well beyond the subgroup, and Rizzuto et al. leave it out of Sco OB2; no other published distance was found"
disputes:
  - claim: "de Zeeuw et al. give the Upper Centaurus Lupus subgroup a mean distance of 140±2 pc."
    cite:
      paper: dezeeuw-1999
      page: 14
      sentence: "Our member selection method identifies 221 members in this field, with a mean distance of 140±2 pc: 66 B, 68 A, 55 F, 25 G, 6 K, and 1 M-type star."
  - claim: "de Zeeuw et al. list HIP 74117 as an Upper Centaurus Lupus member with a membership probability of 60 per cent."
    cite:
      paper: dezeeuw-1999
      table: "C1"
      row: "HIP 74117, Upper Centaurus Lupus block"
      column: "P (membership probability, per cent)"
      cell: "60"
  - claim: "Tokovinin lists the Hipparcos-2 parallax of HIP 74117 as 4.20 ±0.66 mas, far smaller than a parallax at the subgroup's distance."
    cite:
      paper: tokovinin-2012
      table: "4"
      row: "15088−4517, HIP 74117"
      column: "πHIP (mas)"
      cell: "4.20 ±0.66"
  - claim: "Gaia DR2 gives source 5907202503153332224 a parallax of 3.540647335436756 mas, also far smaller than a parallax at the subgroup's distance."
    cite: { paper: gaia-dr2-2018, table: "gaiadr2.gaia_source", row: "source 5907202503153332224", column: "parallax", cell: "3.540647335436756" }
  - claim: "The Gaia DR2 parallax error of source 5907202503153332224 is 0.596086535382605 mas, above a tenth of the parallax."
    cite: { paper: gaia-dr2-2018, table: "gaiadr2.gaia_source", row: "source 5907202503153332224", column: "parallax_error", cell: "0.596086535382605" }
  - claim: "Tokovinin's dynamical parallax from the visual orbit and a standard mass-luminosity relation is 6.3 mas, given without an error; it fits the subgroup."
    cite:
      paper: tokovinin-2012
      table: "4"
      row: "15088−4517, HIP 74117"
      column: "πdyn (mas)"
      cell: "6.3"
  - claim: "Tokovinin judges that the true parallax should be around 6 mas, matching the association."
    cite:
      paper: tokovinin-2012
      page: 8
      sentence: "The Hipparcos parallax corresponds to an uncomfortably large mass sum. The true parallax should be around 6 mas, matching the distance to the association."
  - claim: "Rizzuto et al. select 436 Sco OB2 members, listed in their Table A1, and HIP 74117 is not among them."
    cite:
      paper: rizzuto-2011
      page: 1
      sentence: "We select 436 members, 88 of which are new members not included in previous membership selections."
notes: >-
  Unplaced under review rule C. The membership rests on de Zeeuw et al. 1999, with a low membership probability,
  and on Tokovinin 2012, who calls lambda Lup "a B3V binary belonging to the Sco-Cen association" from its orbit.
  Against it, the two trigonometric parallaxes agree with each other and put the star well behind the subgroup,
  and Rizzuto et al. 2011 drop it. Tokovinin's dynamical parallax rests on standard mass-luminosity relations,
  which he says "should not be mistaken for direct measurements". Orbital motion of the pair could bias the
  trigonometric parallaxes. That would settle the question in favour of the association, but no paper read
  here shows it. Gaia EDR3/DR3 gives no parallax.
