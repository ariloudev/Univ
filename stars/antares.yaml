distance:
  value: 145
  unit: parsec
  kind: inferred
  uncertainty: { form: symmetric, sigma: 2 }
  cite:
    paper: dezeeuw-1999
    page: 12
    sentence: "The mean distance of US is 145 ±2 pc, where the error is the formal error on the mean, and the correction applied for the bias caused by exclusion of stars with negative parallaxes is negligible (§3.6)."
  distance_kind: geometric
  method: "mean Hipparcos parallax distance of the Upper Scorpius (US) association applied to a confirmed member"
membership:
  paper: dezeeuw-1999
  page: 12
  sentence: "We confirm the evolved supergiant Antares (α Sco, HIP80763, M1Ib), as well as the stars ρ Oph (HIP80473, B2V), χ Oph (HIP80569, B2Vne), and 48 Lib (HIP78207, B8Ia/Iab), as members."
disputes: []
notes: >-
  The error is the formal error on the association's mean distance, not the depth of Upper
  Scorpius, so the star's own distance is less certain than that. The group distance rests on
  original Hipparcos parallaxes of the members. Miret-Roig et al. found no Gaia DR3 counterpart for
  Antares ("except for α Sco (Antares) and δ Sco") and define a Gaia DR3 group named α Sco, but
  they give its median Galactic position, not a distance, so it is not used here (a distance
  would need arithmetic). No dedicated distance determination for Antares itself was found.
