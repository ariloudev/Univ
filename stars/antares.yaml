# Antares, alpha Scorpii, M1.5Iab red supergiant + B companion: Hipparcos-2 parallax error above a tenth of the parallax, no Gaia parallax.
hip: 80763
name: Antares
alternative_names: ["alpha Scorpii", "alf Sco", "21 Sco"]
papers:
  - id: dezeeuw-1999
    reference: "de Zeeuw, Hoogerwerf, de Bruijne, Brown & Blaauw 1999, AJ 117, 354"
    title: "A Hipparcos census of the nearby OB associations"
    bibcode: 1999AJ....117..354D
    doi: 10.1086/300682
    arxiv: "astro-ph/9809227"
    read: "arXiv PDF of astro-ph/9809227v1, full text extracted with pypdf; Sect. 4.2 Upper Scorpius read; pages are arXiv PDF pages"
  - id: miret-roig-2022
    reference: "Miret-Roig, Galli, Olivares, Bouy, Alves & Barrado 2022, A&A 667, A163"
    title: "The star formation history of Upper Scorpius and Ophiuchus"
    bibcode: 2022A&A...667A.163M
    doi: 10.1051/0004-6361/202244709
    arxiv: "2209.12938"
