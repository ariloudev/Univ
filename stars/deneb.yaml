  sentence: "Adopting a distance modulus of 9.m52 ± 0.m18 from the affiliation of Deneb to the Cyg OB 7 association (mean value of Humphreys 1978), we derive the absolute visual magnitude and, using a bolometric correction from our model atmosphere computations, the absolute bolometric magnitude."
disputes: []
notes: >-
  Weak placement. The distance in Table 2 of Schiller & Przybilla is not their own determination:
  it is the Cyg OB7 mean distance modulus of Humphreys (1978), printed as a distance. That group
  distance is pre-Hipparcos and rests on spectroscopic parallaxes of the members, not on
  trigonometric parallaxes, hence secondary_indicator. Humphreys (1978) is not on arXiv and was
  not read. Schiller & Przybilla also infer an independent distance modulus from the
  flux-weighted gravity-luminosity relationship (FGLR), in good agreement with Humphreys, but
  give it only as a modulus, so it is not used. No Gaia-era distance of Cyg OB7 naming Deneb as a
  member was found.
