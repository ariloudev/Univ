notes: >-
  Gaia EDR3 has the bright source (source 4933453324590295040) without a parallax. Gaia DR2 has only a much
  fainter source near the Hipparcos position, source 4933453324587749504. Its parallax error is above a fifth
  of its value, and it is unclear whether it is a component of the pair or a spurious source. The pair has a
  visual orbit, but no paper read here derives a dynamical or orbital parallax from it. Searched: arXiv
  abstracts, web search, and Tokovinin's SOAR orbit papers (no entry for this pair).
