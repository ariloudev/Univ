notes: >-
  The Gaia source sits at the Hipparcos position and is in neither hipparcos2_best_neighbour table, which
  is why the project's cross-match found no Gaia parallax. DR2 and EDR3 agree, but the EDR3 RUWE shows
  the single-star solution fails, as expected for a close visual binary with orbital motion. The dynamical
  parallax rests on the visual orbit and assumed masses and has no stated error. A candidate for later
  if an orbital parallax appears.
