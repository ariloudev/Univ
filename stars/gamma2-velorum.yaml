distance:
  value: 346
  unit: parsec
  kind: measured
  uncertainty: { form: symmetric, sigma: 7 }
  cite:
    paper: schmutz-2026
    page: 5
    sentence: "With the combined velocity amplitude K = 160 ± 3 km/s (Schmutz et al. 1997) and the measured angle separation of the major axis given in Tab. 3, a = 3.483 ± 0.008 mas, we derive a distance d = 346 ± 7 pc."
  distance_kind: parallax
  method: "orbital parallax: angular semimajor axis from VLT/GRAVITY and earlier interferometry combined with the double-lined spectroscopic velocity amplitude"
disputes:
  - claim: "North et al. derive 336^{+8}_{-7} pc from the earlier SUSI orbit."
    cite:
      paper: north-2007
      page: 1
      sentence: "In combination with the latest radial-velocity results, our orbital solution produces a distance of 336^{+8}_{-7} pc, significantly more distant than the Hipparcos estimation (Schaerer et al. 1997; van der Hucht et al. 1997)."
  - claim: "The Gaia EDR3 γ Vel cluster (Villafranca O-024) lies at 336 ± 1 pc, as Schmutz et al. quote from Maíz Apellániz et al., and Schmutz et al. take this cluster distance as the most accurate one."
    cite:
      paper: schmutz-2026
      page: 5
      sentence: "Maíz Apellániz et al. (2022) have investigated the stars in the γ Vel cluster Villafranca O-024 and found 138 members at a distance of d_cluster = 336 ± 1 pc."
  - claim: "Hipparcos astrometry gives 258 ± 35 pc."
    cite:
      paper: schmutz-2026
      page: 5
      sentence: "This conclusion is supported by Hipparcos astrometry (ESA 1997) γ2 Vel, which yielded d_Hip = 258 ± 35 pc, µα Hip = −5.93 ± 0.53 mas/a, and µδ Hip = 9.90 ± 0.43 mas/a."
notes: >-
  An orbital (interferometric plus double-lined spectroscopic) distance of the star itself, so the
  brief's first category; the paper prints it as a distance in pc, not as a parallax in mas, so it
  is recorded as distance. It is a preprint accepted by A&A and not yet in ADS when read. Schmutz
  et al. find the difference from the cluster distance not significant and themselves "conclude
  that the cluster distance represents the most accurate distance"; Maíz Apellániz et al. say the
  cluster "includes γ2 Vel". The orbital value is kept here because the brief ranks the star's own
  orbit first and the two agree; the cluster value is the alternative if group distances are
  preferred.
