disputes:
  - claim: "Hummel et al. derive an orbital parallax of 3.4 ± 0.2 mas, a distance of 294 ± 21 pc, from the NPOI orbit and the radial velocities of both components; it disagrees with the OB1b distance."
    cite:
      paper: hummel-2013
      page: 4
      sentence: "An orbital parallax of 3.4 ± 0.2 mas was derived, corresponding to a distance of d = 294 ± 21 pc and a distance modulus of 7.4."
  - claim: "Hummel et al. estimate a photometric distance of 387 ± 54 pc for the system."
    cite:
      paper: hummel-2013
      page: 5
      sentence: "Taking 0.3 mag as combined uncertainty for the distance modulus from MV, mV, and AV, the photometric distance to the ζ Ori system is d = 387 ± 54 pc, i.e. the photometric parallax is πphot = 2.6^{+0.4}_{-0.3} mas."
  - claim: "Hummel et al. themselves regard the photometric distance as more robust than their orbital parallax, which rests on low velocity amplitudes."
    cite:
      paper: hummel-2013
      page: 5
      sentence: "As the photometric distance is based on a reliable spectral classification of a non-supergiant for which recent calibrations of the absolute magnitude exist Nieva (2013), we regard the photometric distance as more robust than the orbital parallax, which is based on rather low velocity amplitudes."
notes: >-
  Choice made against the brief's default order and worth a second look. Hummel et al. give a
  measured orbital parallax with an error under a tenth of its value, which would normally come
  first. But the authors themselves prefer their photometric distance, which agrees with the
  OB1b distance, and suspect small systematic radial-velocity errors from stellar winds. The OB1b
  distance rests on Gaia DR3 parallaxes, so it is preferred here. Oplištilová et al. also list a
  Gaia DR3 parallax for the faint ζ Ori C (their Table 3) without establishing that it is bound.
  The error is the uncertainty of the median, not the depth of OB1b.
