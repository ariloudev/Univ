notes: >-
  The distance is the paper's own: Maíz Apellániz et al. apply the Gaia DR2 parallax of the wide companion
  FN CMa C to the A,B pair, so this placement does not apply a companion's distance on our own account.
  It rests on C being physically associated with A,B, which the paper assumes rather than demonstrates,
  and on DR2 astrometry; nothing read contradicts the association. Gaia DR2 and DR3 give FN CMa A,B only
  a two-parameter solution. The same paper reclassifies A as B0.7 Ib and B as an O6 dwarf, removing the
  earlier argument (Rivinius et al.) that B is a background object. The Gaia-based studies of the Canis
  Major region read for this research do not list HD 53974 as a group member. Whether the asymmetric error
  is a one-sigma interval is not stated in the passage; it is recorded as the paper prints it.
