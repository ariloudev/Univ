notes: >-
  The distance is that of a Gaia DR3 subgroup of Cep OB2, which Szilágyi et al. find around the star; they
  call the star's own distance uncertain and base its membership on its spectral type and brightness, so the
  membership is probable rather than proven. Gaia EDR3 and DR3 give the star only a two-parameter solution,
  and its Hipparcos-2 and Gaia DR2 parallaxes are too imprecise to confirm or contradict the group distance.
  Corradi et al. reach a somewhat smaller distance by a model-dependent route with no quoted error; it is
  kept as a dispute. Both papers place the Ou4 outflow and the H II region the star ionises at the star's distance.
