unplaced: No published distance for a Lup itself other than the Hipparcos-2 parallax, whose error exceeds
  the parallax; Gaia DR2 and EDR3 give the star (source 6098143932950518528) only a two-parameter solution,
  and no cluster membership or modelling distance was found.
