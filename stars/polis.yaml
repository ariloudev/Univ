notes: >-
  mu Sgr is often placed in Sgr OB1, but this research found no paper with a group distance and a membership
  list naming HD 166937 that could be read and quoted. Classical association member lists were not checked,
  because they are not on arXiv and ADS was blocked. A distance from such a list would also be photometric, not
  geometric.
