# Dschubba, delta Scorpii, B0.3IV Be star in an eccentric decade-long binary: Hipparcos-2 parallax error above a tenth of the parallax, no Gaia parallax.
hip: 78401
name: Dschubba
alternative_names: ["delta Scorpii", "del Sco", "7 Sco", "HD 143275"]
papers:
  - id: tycner-2011
    reference: "Tycner, Ames, Zavala, Hummel, Benson & Hutter 2011, ApJ 729, L5"
