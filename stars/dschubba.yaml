parallax:
  value: 7.4
  unit: milliarcsecond
  kind: estimated
  uncertainty: { form: symmetric, sigma: 0.2 }
  cite:
    paper: tycner-2011
    page: 4
    sentence: "The mass of the primary is derived as 12.4 ± 0.8 M⊙, and the dynamical parallax is 7.4 ± 0.2 mas."
  distance_kind: parallax
  method: "orbital (dynamical) parallax from the NPOI interferometric orbit combined with published radial velocities, with the secondary's mass held fixed"
disputes:
  - claim: "Tango et al. estimate a dynamical parallax of 7.03 ± 0.15 mas from the SUSI orbit with estimated masses."
    cite:
      paper: tango-2009
      page: 1
      sentence: "The dynamical parallax is estimated to be 7.03 ± 0.15 mas, which is in good agreement with the revised HIPPARCOS parallax."
notes: >-
  The parallax error is under a tenth of the parallax. The fit is not a pure double-lined orbital
  parallax: Tycner et al. held the secondary's mass fixed at the value found by Tango et al. and
  fitted the primary's mass and the seven orbital elements to astrometry plus radial velocities
  of Miroshnichenko et al. Tycner et al. describe their orbit as "the best orbital parameters to
  date"; it supersedes Tango et al. 2009, whose value is in mild tension with it. Both agree with
  the Hipparcos-2 parallax within its large error. De Zeeuw et al. 1999 did not select δ Sco as an
  Upper Scorpius member because its orbital motion distorts the Hipparcos proper motion, so no
  group distance is used.
