notes: >-
  The DR2 source is the Gaia DR3 identifier SIMBAD gives for HD 2885 and lies at the Hipparcos position. The
  table gaiadr2.hipparcos2_best_neighbour has no row for this star. EDR3's fallback to a two-parameter solution
  shows the five-parameter fit failed Gaia's checks. SIMBAD lists the star as a close visual pair, whose orbital
  motion may also have biased the DR2 parallax. Unplaced under review rule B.
