notes: >-
  The DR2 source is at the Hipparcos position and is the star; it is not in gaiadr2.hipparcos2_best_neighbour.
  The star is a spectroscopic binary, which may be why EDR3 dropped its parallax. The Multiple Star Catalog
  (Tokovinin 2018) carries the same DR2 parallax for the star. A candidate for later if a later Gaia release
  or an orbit gives a parallax.
