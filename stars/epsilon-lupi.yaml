notes: >-
  Uytterhoeven et al. 2005 also adopt the membership, writing that the Hipparcos parallax "led De Zeeuw et al.
  (1999) to conclude that ε Lup is most probably a member of the UCL OB association". Gaia DR2 gives a parallax
  whose error is just above a tenth of its value and which agrees with the UCL mean. Gaia EDR3/DR3 gives no
  parallax. Rizzuto et al. 2011 do not say why eps Lup is missing from their list. It is a short-period
  spectroscopic binary, whose radial velocity and astrometry are harder to use for membership. The UCL mean
  rests on Hipparcos-1 parallaxes, and its formal error does not include the depth of the subgroup. Unlike
  lambda Lup, its own parallaxes agree with the subgroup, so its membership stands under review rule C.
