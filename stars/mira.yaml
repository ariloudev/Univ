    page: 1
    sentence: Its distance has been determined using different methods, such as the Mira period-luminosity
      relation (107±12 pc, Knapp et al. (2003)), the oxygen-rich Mira period-luminosity relation (115±7
      pc, Whitelock et al. (2008)), the oxygen-rich Mira period-color-luminosity relation (105±7 pc, Feast
      et al. (1989)), and the Hipparcos parallax (92 ± 11 pc), which is likely the least reliable method
      because the star size is three times larger than the measured parallax.
notes: >-
  Gaia DR2 and DR3 give Mira only a two-parameter solution. Its trigonometric parallaxes are all Hipparcos-based,
  with errors above a tenth of the parallax. The period-luminosity distance of Haniff et al. is old and
  rests on the Feast et al. calibration, but it is the only dedicated determination for the star with
  a stated uncertainty that was found; it agrees with the trigonometric values within their errors. Mira's
  large angular size relative to its parallax and its companion Mira B make a trigonometric parallax hard.
