notes: >-
  Candidates from the companion C, not used. Rica Romero shows C to be bound to AB ("According to all
  the criteria used, the component C is physically bound to the AB binary."), and the Multiple Star Catalog
  (Tokovinin 2018) lists C as part of the system. None of these papers applies a distance to 26 Aur AB
  itself, and the brief forbids applying C's ourselves; C's own Gaia solution also has a RUWE above the
  limit. If companion distances are accepted, the Gaia-based one for C is the natural placement.
