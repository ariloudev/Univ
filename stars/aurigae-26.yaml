unplaced: No published distance for 26 Aur AB itself other than the Hipparcos parallaxes, whose Hipparcos-2
  error exceeds the parallax; Gaia DR2 and EDR3 give the star (source 3447545341986921216) only a two-parameter
  solution, and no cluster membership or modelling distance of AB was found.
