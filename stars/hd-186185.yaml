notes: >-
  SIMBAD resolves HIP 97063 to HD 186185 (HR 7496), whose Gaia DR3 identifier is source 4181857103177308032,
  the only bright Gaia source at the Hipparcos-2 position. The DR2 parallax is precise, but EDR3 and DR3
  withdrew it, which review rule B treats as unusable. A nearby F-type subgiant like this has no cluster
  membership, and no orbital or modelling distance was found.
