# LQG 5 of Komberg, Kravtsov & Lukash 1996: 13 quasars found by cluster analysis of a quasar catalogue.
name: Komberg–Kravtsov–Lukash LQG 5
alternative_names: ["KKL LQG 5", "LQG 5"]
kind: quasar_group
status: statistical_claim
scale_domain: cosmic_web
papers:
  - id: komberg-1996
    reference: "Komberg, Kravtsov & Lukash 1996, MNRAS 282, 713"
    title: "The search and investigation of the Large Groups of Quasars"
    doi: 10.1093/mnras/282.3.713
    arxiv: "astro-ph/9602090"
    read: "arXiv PDF text of astro-ph/9602090; Table 1 read by page column from its text layer"
geometry:
  kind: members
  members:
    frame: equatorial_equinox_unstated
    tracer: quasar
    source: { paper: komberg-1996, table: "1" }
    columns:
      - { name: lon, header: "R.A.", unit: degree, format: hms, kind: measured, uncertainty: { form: none_reported } }
      - { name: lat, header: "Decl.", unit: degree, format: dms, kind: measured, uncertainty: { form: none_reported } }
      - { name: redshift, header: "Redshift", unit: dimensionless, kind: measured, uncertainty: { form: none_reported } }
    rows:
      - ["1", "03 35 52.7", "-44 06 54", 1.679]
      - ["2", "03 37 37.6", "-44 21 29", 1.661]
      - ["3", "03 37 06.4", "-44 11 54", 1.609]
      - ["4", "03 41 32.7", "-44 58 14", 1.662]
      - ["5", "03 41 50.7", "-45 17 41", 1.615]
      - ["6", "03 42 13.5", "-45 03 04", 1.700]
      - ["7", "03 39 48.1", "-44 52 00", 1.745]
      - ["8", "03 38 06.1", "-44 18 32", 1.762]
      - ["9", "03 38 06.1", "-44 22 12", 1.733]
      - ["10", "03 39 22.9", "-44 16 54", 1.764]
      - ["11", "03 40 12.0", "-44 03 38", 1.751]
      - ["12", "03 40 15.8", "-44 26 08", 1.792]
      - ["13", "03 42 07.2", "-44 56 18", 1.827]
values:
  members:
    value: 13
    unit: dimensionless
    kind: measured
    uncertainty: { form: none_reported }
    cite: { paper: komberg-1996, table: "2", row: "LQG 5", column: "Number of QSOs" }
  redshift:
    value: 1.7
    unit: dimensionless
    kind: estimated
    uncertainty: { form: none_reported }
    cite: { paper: komberg-1996, table: "2", row: "LQG 5", column: "z" }
    note: "The group's redshift to one decimal place; the paper does not say how it is taken from the members'."
  extent_ra:
    value: 45
    unit: megaparsec_over_h
    kind: inferred
    uncertainty: { form: none_reported }
    assumes: &cosmology
      cosmology: "comoving; H0 = 100h km/s/Mpc, Ω0 = 1, Λ = 0"
      cite:
        paper: komberg-1996
        sentence: "We have today considerable independent evidence for an existence of large-scale structures in matter distribution stretching from tens of megaparsecs up to a typical scale lLS ∼100−150h−1Mpc (unless otherwise stated we assume H0 = 100h km/s/Mpc, Ω0 = 1 and Λ = 0, all scales here are comoving)."
    cite: { paper: komberg-1996, table: "1", row: "LQG 5", column: "Parameters", cell: "Rα = 45" }
    note: "The group's comoving extent in right ascension."
  extent_dec:
    value: 49
    unit: megaparsec_over_h
    kind: inferred
    uncertainty: { form: none_reported }
    assumes: *cosmology
    cite: { paper: komberg-1996, table: "1", row: "LQG 5", column: "Parameters", cell: "Rδ = 49" }
    note: "The group's comoving extent in declination."
  extent_redshift:
    value: 146
    unit: megaparsec_over_h
    kind: inferred
    uncertainty: { form: none_reported }
    assumes: *cosmology
    cite: { paper: komberg-1996, table: "2", row: "LQG 5", column: "Rz, h−1Mpc" }
    note: "The group's comoving extent along the line of sight, which the paper takes as a reasonable estimate of size, since a survey does not cut a group along it."
  density_contrast:
    value: 1
    unit: dimensionless
    kind: estimated
    uncertainty: { form: none_reported }
    cite: { paper: komberg-1996, table: "1", row: "LQG 5", column: "Parameters", cell: "∆N/N ∼1" }
    note: "The approximate quasar number density contrast."
  probability_random:
    value: 0.03
    unit: dimensionless
    kind: inferred
    uncertainty: { form: none_reported }
    cite: { paper: komberg-1996, table: "2", row: "LQG 5", column: "Probability to be random" }
    note: "The fraction of random realisations of the host survey that hold a group as rich and dense in the same redshift range."
disputes: []
notes: >-
  Table 1 gives the members' coordinates as they are in the quasar catalogue the groups were found
  in, and the paper does not state their equinox. Every member comes from the deep UVX survey of
  Boyle et al. (its QSF field). The paper notes a peak in that field's redshift distribution due
  to the group, which may be a random enhancement with the probability given. The quasar number
  density of Table 2 is in units univ-model does not have and is left out. Some encyclopaedia
  entries for these groups cite other papers; this file cites only the paper that found them.
