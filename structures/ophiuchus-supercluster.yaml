      paper: hasegawa-2000
      sentence: "We estimate this overdensity for galaxies with MC 1 to 2 as 2.6 after correction for Galactic extinction according to equation (3)."
      page: 336
    note: "Sensitive to the luminosity function and the Galactic extinction adopted, as the paper says."
disputes: []
notes: >-
  The paper finds that the Ophiuchus cluster, two new clusters and four groups lie at nearly the
  same recession velocity as the field galaxies around them, all over its survey field near the
  Galactic Centre, and calls the whole a large-scale structure of supercluster size. It gives no
  centre for the supercluster, and the survey field it fills is a lower limit on its size, not a
  bound, so the point is the Ophiuchus cD cluster, labelled as such. Its lengths are in Mpc for
  a Hubble constant of a hundred, equal to h^-1 Mpc. In front of it the paper finds a void, with
  a quarter of the mean density of galaxies. Earlier notes read the paper only through a summary
  of the publisher's page; every number here is from the full text.
