# A supercluster behind the Milky Way in Vela, found in redshifts taken in the Zone of Avoidance.
name: Vela Supercluster
alternative_names: ["VSCL"]
kind: supercluster
status: observed
scale_domain: cosmic_web
papers:
  - id: kraan-korteweg-2017
    reference: "Kraan-Korteweg, Cluver, Bilicki, Jarrett, Colless, Elagali, Böhringer & Chon 2017, MNRAS Letters 466, L29"
    title: "Discovery of a supercluster in the Zone of Avoidance in Vela"
    doi: 10.1093/mnrasl/slw229
    arxiv: "1611.04615"
    read: "arXiv source (LaTeX) of 1611.04615"
# The centre of the surveyed region, which the overdensity fills; the paper gives no other centre.
position:
  frame: galactic
  lon:
    value: 272.5
    unit: degree
    kind: estimated
    uncertainty: { form: none_reported }
    cite: &survey
      paper: kraan-korteweg-2017
      sentence: "We present a preliminary analysis of ~4500 new spectroscopic galaxy redshifts obtained in the ZOA centred on the Vela region (l = 272.5° ± 20°, b = 0° ± 10°)."
  lat:
    value: 0
    unit: degree
    kind: estimated
    uncertainty: { form: none_reported }
    cite: *survey
  velocity:
    value: 18000
    unit: kilometre_per_second
    kind: measured
    uncertainty: { form: none_reported }
    cite:
      paper: kraan-korteweg-2017
      sentence: "We report the discovery of a potentially major supercluster that extends across the Galactic Plane in the constellation of Vela, at a mean recessional velocity of ~18 000 km s-1."
# The region the paper measures the overdensity in (its Fig. 2), between the velocity where the
# structure emerges and the top of its colour key's magenta band, which with red is the
# overdensity's range ("red and magenta; 16-24 000 km s-1", Section 2).
geometry:
  kind: sky_region
  sky_region:
    frame: galactic
    lon:
      - value: 255
        unit: degree
        kind: estimated
        uncertainty: { form: none_reported }
        as_published: "255°"
        cite: &region
          paper: kraan-korteweg-2017
          sentence: "To assess the significance of the overdensity, Fig. 2 shows the redshift distribution of all galaxies in the region 255° ≤ l ≤ 285° and |b| < 10°."
      - value: 285
        unit: degree
        kind: estimated
        uncertainty: { form: none_reported }
        as_published: "285°"
        cite: *region
    lat:
      - value: -10
        unit: degree
        kind: estimated
        uncertainty: { form: none_reported }
        as_published: "|b| < 10°"
        cite: *region
      - value: 10
        unit: degree
        kind: estimated
        uncertainty: { form: none_reported }
        as_published: "|b| < 10°"
        cite: *region
    near:
      velocity:
        value: 16000
        unit: kilometre_per_second
        kind: estimated
        uncertainty: { form: none_reported }
        cite:
          paper: kraan-korteweg-2017
          sentence: "We note that the Vela structure emerges at a distance cz ~ 16 000 km s-1 where existing 'whole-sky' redshift surveys lose sensitivity ..."
    far:
      velocity:
        value: 24000
        unit: kilometre_per_second
        kind: estimated
        uncertainty: { form: none_reported }
        cite:
          paper: kraan-korteweg-2017
          sentence: "Colours indicate redshift (cyan: <8000; green: 8-16000; red: 16-20000; magenta: 20-24000; blue: 24-32000 km s-1)."
    at_least:
      paper: kraan-korteweg-2017
      sentence: "The similarity of the histogram suggests that the overdensity is contiguous across the Plane, implying an overall extent of at least 25° × 20°, corresponding to ~ 115 × 90 h70 Mpc."
values:
  extent_longitude:
    value: 25
    unit: degree
    kind: estimated
    uncertainty: { form: lower_limit }
    cite: &extent
      paper: kraan-korteweg-2017
      sentence: "The presently sparsely-sampled dataset traces an overdensity that covers 25° in Galactic longitude on either side of the Plane, suggesting an extent of 25° × 20°, corresponding to ~115 × 90 h70 Mpc at the supercluster redshift."
  extent_latitude:
    value: 20
    unit: degree
    kind: estimated
    uncertainty: { form: lower_limit }
    cite: *extent
  extent_long:
    value: 115
    unit: megaparsec
    kind: estimated
    uncertainty: { form: lower_limit }
    assumes: "h70^-1 Mpc: H0 = 70 km/s/Mpc"
    cite: *extent
  extent_short:
    value: 90
    unit: megaparsec
    kind: estimated
    uncertainty: { form: lower_limit }
    assumes: "h70^-1 Mpc: H0 = 70 km/s/Mpc"
    cite: *extent
  wall_1_velocity:
    value: 18000
    unit: kilometre_per_second
    kind: measured
    uncertainty: { form: none_reported }
    cite: &walls
      paper: kraan-korteweg-2017
      sentence: "The overdensity appears to consist of a main broad wall (W1) at cz ~ 18 000 km s-1 and a smaller one (W2) at a slightly higher redshift (cz ~ 22 000 km s-1 ...)."
  wall_2_velocity:
    value: 22000
    unit: kilometre_per_second
    kind: measured
    uncertainty: { form: none_reported }
    cite: *walls
  wall_1_extent:
    value: 120
    unit: megaparsec
    kind: estimated
    uncertainty: { form: lower_limit }
    assumes: "h70^-1 Mpc: H0 = 70 km/s/Mpc"
    cite:
      paper: kraan-korteweg-2017
      sentence: "The main wall extends over at least 120 h70 Mpc."
disputes: []
notes: >-
  The region drawn is the one the paper measures the overdensity in (its Fig. 2), which it says
  the structure covers at least. Section 2 abbreviates the overdensity's velocity range, the red
  and magenta bands of Fig. 1; its ends are cited where the paper prints them in full: where the
  structure emerges, and the top of the magenta band. No velocity frame is stated, so the
  velocities are taken as published. The extent is preliminary, from sparse sampling behind the Milky Way; the main wall W1 lies both
  above and below the plane, the second wall W2 only below it. The paper writes its lengths as
  "h70 Mpc", which is read as h70^-1 Mpc, a length in Mpc at the Hubble constant its subscript
  names.
