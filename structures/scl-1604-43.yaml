# A supercluster at z ≈ 0.91 joining the clusters CL1604+4304 and CL1604+4321, confirmed by the red
# sequence of early-type galaxies that fills the region between them.
name: Cl 1604 Supercluster
alternative_names: ["CL1604+43 supercluster"]
kind: supercluster
status: observed
scale_domain: cosmic_web
papers:
  - id: lubin-2000
    reference: "Lubin, Brunner, Metzger, Postman & Oke 2000, ApJ 531, L5"
    title: "A Definitive Optical Detection of a Supercluster at z ≈ 0.91"
    bibcode: 2000ApJ...531L...5L
    arxiv: "astro-ph/0001166"
    read: "arXiv PDF of astro-ph/0001166 (the accepted letter), text extracted: abstract, Sections 1, 3 and 4 read"
unplaced: >-
  The paper prints one position, that of the third cluster it finds between the two known ones
  (J2000, in sexagesimal hours and degrees separated by spaces), which is a member and carries no
  redshift of its own; it gives no centre for the supercluster and no outline, only the two
  clusters' names and the scale of the region between them. That position is left out until it
  can be cited as printed.
values:
  redshift:
    value: 0.91
    unit: dimensionless
    kind: measured
    uncertainty: { form: none_reported }
    cite:
      paper: lubin-2000
      sentence: "We have confirmed the existence of a supercluster at z = 0.91 with deep, multiband imaging taken at the Palomar 200-in telescope."
    note: "Between the spectroscopic redshifts of its two known clusters."
  cluster_cl1604_4304_redshift:
    value: 0.897
    unit: dimensionless
    kind: measured
    uncertainty: { form: none_reported }
    cite: &clusters
      paper: lubin-2000
      sentence: "Two massive clusters of galaxies, CL1604+4304 at z = 0.897 and CL1604+4321 at z = 0.924, were originally observed in the high-redshift cluster survey of Oke, Postman & Lubin (1998)."
    note: "The abstract's value; the paper's Section 3.1 gives the same cluster a redshift lower by a unit in the last place."
  cluster_cl1604_4321_redshift:
    value: 0.924
    unit: dimensionless
    kind: measured
    uncertainty: { form: none_reported }
    cite: *clusters
  cluster_velocity_separation:
    value: 4300
    unit: kilometre_per_second
    kind: measured
    uncertainty: { form: none_reported }
    cite: &separation
      paper: lubin-2000
      sentence: "They are separated by 4300 km s−1 in radial velocity and 17 arcminutes on the plane of the sky."
  cluster_angular_separation:
    value: 17
    unit: arcminute
    kind: measured
    uncertainty: { form: none_reported }
    cite: *separation
  cluster_projected_separation:
    value: 5
    unit: megaparsec_over_h
    kind: estimated
    uncertainty: { form: none_reported }
    assumes: &cosmology
      cosmology: "H0 = 100 h km/s/Mpc, q0 = 0.1, lengths in h^-1 Mpc"
      cite:
        paper: lubin-2000
        sentence: "Unless otherwise noted, we use H0 = 100 h km s−1 Mpc−1 and q0 = 0.1."
    cite:
      paper: lubin-2000
      sentence: "This implies a projected separation of only 5 h−1 Mpc."
  extent:
    value: 5.5
    unit: megaparsec_over_h
    kind: estimated
    uncertainty: { form: lower_limit }
    assumes: *cosmology
    cite:
      paper: lubin-2000
      sentence: "The spatial distribution of red galaxies provides further confirmation of a large scale structure spanning at least 5.5 h−1 Mpc."
  red_galaxy_redshift_low:
    value: 0.89
    unit: dimensionless
    kind: estimated
    uncertainty: { form: none_reported }
    cite: &range
      paper: lubin-2000
      sentence: "Therefore, we have identified a large population of early-type galaxies within the redshift range of z ∼ 0.89 − 0.93."
    note: "Inferred from the colour of the red sequence, which matches that of the clusters' spectroscopic early-type members."
  red_galaxy_redshift_high:
    value: 0.93
    unit: dimensionless
    kind: estimated
    uncertainty: { form: none_reported }
    cite: *range
disputes: []
notes: >-
  The two clusters were found in the high-redshift cluster survey of Oke, Postman and Lubin; this
  letter confirms the supercluster with deep BRi imaging of the region between them, whose red
  galaxies form a tight colour-magnitude sequence and concentrate at the cluster centres, with a
  third rich cluster between them. Membership of the red galaxies is photometric, by colour. The
  paper names the supercluster only by its redshift; the name here is that of its two clusters.
