          sentence: "Our 'Hercules supercluster' region of interest, comprising 22.5 square degrees (14°30′ < δ < 19°30′ and 15h54m < α < 16h12m, B(1950)), now has a total of 294 velocities available from the literature. Of these, approximately 262 are possible cluster members (8500 < v < 14500 km s-1)."
      - value: 243
        unit: degree
        kind: measured
        uncertainty: { form: none_reported }
        as_published: "16h12m"
