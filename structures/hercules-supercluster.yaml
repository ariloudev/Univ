disputes: []
notes: >-
  This is the compact core of the supercluster: A2151 (the Hercules cluster) and the double cluster
  A2147/2152, all inside the region given. At a low density enhancement A2107, A2063 and A2052 also
  belong to it. The region is given in B1950. The paper also quotes Tarenghi et al.'s cluster
  centres in J2000, used only as starting points for its own centres, which it does not tabulate;
  the newsroom atlas used those as member positions, and they are left out here. Its upper limit on
  the volume, in h^-3 Mpc^3, has no unit in univ-model and is left out.
