disputes:
  - claim: >-
      Patterns like the Giant Arc are common in a ΛCDM simulation analysed with the same method,
      and its reported overdensity is an artefact of the algorithm.
    cite:
      paper: sawala-2025
      sentence: "Applying the same methods used in the observations, we show that patterns like the \"Giant Arc\", supposedly in tension with the standard model, are, in fact, common and expected in a ΛCDM universe. We also show that their reported significant overdensities are an algorithmic artefact and unlikely to reflect any underlying structure."
  - claim: >-
      A follow-up finds very similar patterns abundant in uniform random distributions and among
      equivalent haloes, and gives the arc's span as about 740 comoving Mpc.
    cite:
      paper: sawala-2025b
      sentence: "The so-called \"Giant Arc\" is a sparse pattern of Mg II absorbers spanning ~740 comoving Mpc, whose discovery has been claimed to contradict the large-scale homogeneity inherent to the standard cosmological model."
notes: >-
  Lopez et al. found the arc in the field of the SZ cluster candidate PSZ2 G069.39+68.05 (z = 0.763),
  around which it lies roughly symmetrically; they do not tabulate the absorbers, whose positions are
  digitised here from Figure 5 (the absorbers come from the Zhu & Ménard DR7/DR12 Mg II catalogues).
  The newsroom atlas placed a centre at that cluster's position, converted from its Galactic name;
  that is not a published centre and is left out.
