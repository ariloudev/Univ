# LQG 2 of Komberg, Kravtsov & Lukash 1996: 12 quasars found by cluster analysis of a quasar catalogue.
name: Komberg–Kravtsov–Lukash LQG 2
alternative_names: ["KKL LQG 2", "LQG 2"]
kind: quasar_group
status: statistical_claim
scale_domain: cosmic_web
papers:
  - id: komberg-1996
    reference: "Komberg, Kravtsov & Lukash 1996, MNRAS 282, 713"
    title: "The search and investigation of the Large Groups of Quasars"
    doi: 10.1093/mnras/282.3.713
    arxiv: "astro-ph/9602090"
    read: "arXiv PDF text of astro-ph/9602090; Table 1 read by page column from its text layer"
geometry:
  kind: members
  members:
    frame: equatorial_equinox_unstated
    tracer: quasar
    source: { paper: komberg-1996, table: "1" }
    columns:
      - { name: lon, header: "R.A.", unit: degree, format: hms, kind: measured, uncertainty: { form: none_reported } }
      - { name: lat, header: "Decl.", unit: degree, format: dms, kind: measured, uncertainty: { form: none_reported } }
      # Two members' redshifts are estimated from slitless spectra (see notes): estimated.
      - { name: redshift, header: "Redshift", unit: dimensionless, kind: estimated, uncertainty: { form: none_reported } }
    rows:
      - ["1", "00 41 24.2", "-28 44 06", 0.839]
      - ["2", "00 46 2.4", "-29 04 53", 0.84]
      - ["3", "00 48 47.0", "-28 04 19", 0.840]
      - ["4", "00 50 28.2", "-29 07 42", 0.852]
      - ["5", "00 50 36.9", "-29 29 13", 0.830]
      - ["6 (slitless-spectrum z)", "00 48 22.5", "-27 59 40", 0.87]
      - ["7", "00 52 44.5", "-29 02 31", 0.84]
      - ["8", "00 56 12.5", "-28 43 26", 0.828]
      - ["9 (slitless-spectrum z)", "00 54 22.5", "-28 10 27", 0.80]
      - ["10", "00 52 33.8", "-28 30 45", 0.779]
      - ["11", "00 46 50.7", "-29 14 40", 0.781]
      - ["12", "00 48 24.2", "-29 01 46", 0.783]
values:
  members:
    value: 12
    unit: dimensionless
    kind: measured
    uncertainty: { form: none_reported }
    cite: { paper: komberg-1996, table: "2", row: "LQG 2", column: "Number of QSOs" }
  redshift:
    value: 0.8
    unit: dimensionless
    kind: estimated
    uncertainty: { form: none_reported }
    cite: { paper: komberg-1996, table: "2", row: "LQG 2", column: "z" }
    note: "The group's redshift to one decimal place; the paper does not say how it is taken from the members'."
  extent_ra:
    value: 84
    unit: megaparsec_over_h
    kind: inferred
    uncertainty: { form: none_reported }
    assumes: &cosmology
      cosmology: "comoving; H0 = 100h km/s/Mpc, Ω0 = 1, Λ = 0"
      cite:
        paper: komberg-1996
        sentence: "We have today considerable independent evidence for an existence of large-scale structures in matter distribution stretching from tens of megaparsecs up to a typical scale lLS ∼100−150h−1Mpc (unless otherwise stated we assume H0 = 100h km/s/Mpc, Ω0 = 1 and Λ = 0, all scales here are comoving)."
    cite: { paper: komberg-1996, table: "1", row: "LQG 2", column: "Parameters", cell: "Rα = 84" }
    note: "The group's comoving extent in right ascension."
  extent_dec:
    value: 39
    unit: megaparsec_over_h
    kind: inferred
    uncertainty: { form: none_reported }
    assumes: *cosmology
    cite: { paper: komberg-1996, table: "1", row: "LQG 2", column: "Parameters", cell: "Rδ = 39" }
    note: "The group's comoving extent in declination."
  extent_redshift:
    value: 111
    unit: megaparsec_over_h
    kind: inferred
    uncertainty: { form: none_reported }
    assumes: *cosmology
    cite: { paper: komberg-1996, table: "2", row: "LQG 2", column: "Rz, h−1Mpc" }
    note: "The group's comoving extent along the line of sight, which the paper takes as a reasonable estimate of size, since a survey does not cut a group along it."
  density_contrast:
    value: 1
    unit: dimensionless
    kind: estimated
    uncertainty: { form: none_reported }
    cite: { paper: komberg-1996, table: "1", row: "LQG 2", column: "Parameters", cell: "∆N/N ∼1" }
    note: "The approximate quasar number density contrast."
disputes: []
notes: >-
  Table 1 gives the members' coordinates as they are in the quasar catalogue the groups were found
  in, and the paper does not state their equinox. The members come from several surveys: the Large
  Bright Quasar Survey, Warren et al., the deep UVX survey of Boyle et al. and the prism survey of
  Clowes & Savage. The two marked in their row names have redshifts estimated from slitless
  spectra, so the redshift column is taken as estimated. Because its quasars come from different
  surveys, the paper says the significance of this group cannot be estimated, and Table 2 gives no
  probability for it to be random. The quasar number density of Table 2 is in units univ-model
  does not have and is left out. Some encyclopaedia entries for these groups cite other papers;
  this file cites only the paper that found them.
