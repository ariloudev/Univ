values:
  mean_redshift:
    value: 1.27
    unit: dimensionless
    kind: measured
    uncertainty: { form: none_reported }
    cite: &abstract
      paper: clowes-2013
      sentence: "It has characteristic size (volume^1/3) ~ 500 Mpc (proper size, present epoch), longest dimension ~ 1240 Mpc, membership of 73 quasars, and mean redshift z = 1.27."
  characteristic_size:
    value: 500
    unit: megaparsec
    kind: inferred
    uncertainty: { form: none_reported }
    assumes: &cosmology "proper size at the present epoch; H0 = 70 km/s/Mpc, Ωm = 0.27, ΩΛ = 0.73"
    cite: *abstract
    note: "The cube root of the corrected convex-hull-of-member-spheres volume."
  principal_axis_long:
    value: 1240
    unit: megaparsec
    kind: inferred
    uncertainty: { form: none_reported }
    assumes: *cosmology
    cite: &axes
      paper: clowes-2013
      sentence: "From the inertia tensor of the member quasars of the Huge-LQG, the principal axes have lengths of ~ 1240, 640, and 370 Mpc, and the inhomogeneity thus extends to the Gpc-scale."
  principal_axis_middle:
    value: 640
    unit: megaparsec
    kind: inferred
    uncertainty: { form: none_reported }
    assumes: *cosmology
    cite: *axes
  principal_axis_short:
    value: 370
    unit: megaparsec
    kind: inferred
    uncertainty: { form: none_reported }
    assumes: *cosmology
    cite: *axes
  separation_from_clowes_campusano_lqg:
    value: 8.8
    unit: degree
    kind: measured
    uncertainty: { form: none_reported }
    cite:
      paper: clowes-2013
      sentence: "Its location on the sky is ~ 8.8° north (~ 615 Mpc projected) of the Clowes & Campusano LQG at the same redshift, z = 1.28, which is itself one of the more extreme examples."
disputes:
  - claim: >-
      The algorithm that found the Huge-LQG finds even larger groups in homogeneous Poisson point
      sets of the same density, so the group does not show a departure from homogeneity.
    cite:
      paper: nadathur-2013
      sentence: "In addition, I show that the algorithm used to identify the Huge-LQG regularly finds even larger clusters of points, extending over Gpc scales, in explicitly homogeneous simulations of a Poisson point process with the same density as the quasar catalogue."
notes: >-
  The 73 members are the quasars of Table 1, with their SDSS J2000 positions as published. The
  orientation of the principal axes is not given in numbers. Sawala et al., in "The emperor's new
  arc", also cite Park et al. and Fujii as finding the quasar agglomerations consistent with random
  fluctuations; none of those papers is cited here, and the last two were not read.
