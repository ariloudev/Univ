# LQG 11 of Komberg, Kravtsov & Lukash 1996: 11 quasars found by cluster analysis of a quasar catalogue.
name: Komberg–Kravtsov–Lukash LQG 11
alternative_names: ["KKL LQG 11", "LQG 11"]
kind: quasar_group
status: statistical_claim
scale_domain: cosmic_web
papers:
  - id: komberg-1996
    reference: "Komberg, Kravtsov & Lukash 1996, MNRAS 282, 713"
    title: "The search and investigation of the Large Groups of Quasars"
    doi: 10.1093/mnras/282.3.713
    arxiv: "astro-ph/9602090"
    read: "arXiv PDF text of astro-ph/9602090; Table 1 read by page column from its text layer"
geometry:
  kind: members
  members:
    frame: equatorial_equinox_unstated
    tracer: quasar
    source: { paper: komberg-1996, table: "1" }
    columns:
      - { name: lon, header: "R.A.", unit: degree, format: hms, kind: measured, uncertainty: { form: none_reported } }
      - { name: lat, header: "Decl.", unit: degree, format: dms, kind: measured, uncertainty: { form: none_reported } }
      - { name: redshift, header: "Redshift", unit: dimensionless, kind: measured, uncertainty: { form: none_reported } }
    rows:
      - ["1", "21 54 12.1", "-18 28 04", 0.668]
      - ["2", "21 58 00.0", "-18 54 00", 0.7]
      - ["3", "21 58 14.2", "-18 55 48", 0.687]
      - ["4", "22 00 32.1", "-20 19 52", 0.671]
      - ["5", "21 56 15.8", "-19 29 36", 0.725]
      - ["6", "21 59 30.7", "-19 31 46", 0.728]
      - ["7", "22 06 14.8", "-20 19 03", 0.682]
      - ["8", "22 03 30.1", "-19 20 01", 0.649]
      - ["9", "22 01 09.1", "-18 57 08", 0.615]
      - ["10", "22 03 01.7", "-18 46 26", 0.626]
      - ["11", "22 03 25.8", "-18 50 17", 0.619]
values:
  members:
    value: 11
    unit: dimensionless
    kind: measured
    uncertainty: { form: none_reported }
    cite: { paper: komberg-1996, table: "2", row: "LQG 11", column: "Number of QSOs" }
  redshift:
    value: 0.7
    unit: dimensionless
    kind: estimated
    uncertainty: { form: none_reported }
    cite: { paper: komberg-1996, table: "2", row: "LQG 11", column: "z" }
    note: "The group's redshift to one decimal place; the paper does not say how it is taken from the members'."
  extent_ra:
    value: 63
    unit: megaparsec_over_h
    kind: inferred
    uncertainty: { form: none_reported }
    assumes: &cosmology
      cosmology: "comoving; H0 = 100h km/s/Mpc, Ω0 = 1, Λ = 0"
      cite:
        paper: komberg-1996
        sentence: "We have today considerable independent evidence for an existence of large-scale structures in matter distribution stretching from tens of megaparsecs up to a typical scale lLS ∼100−150h−1Mpc (unless otherwise stated we assume H0 = 100h km/s/Mpc, Ω0 = 1 and Λ = 0, all scales here are comoving)."
    cite: { paper: komberg-1996, table: "1", row: "LQG 11", column: "Parameters", cell: "Rα = 63" }
    note: "The group's comoving extent in right ascension."
  extent_dec:
    value: 42
    unit: megaparsec_over_h
    kind: inferred
    uncertainty: { form: none_reported }
    assumes: *cosmology
    cite: { paper: komberg-1996, table: "1", row: "LQG 11", column: "Parameters", cell: "Rδ = 42" }
    note: "The group's comoving extent in declination."
  extent_redshift:
    value: 157
    unit: megaparsec_over_h
    kind: inferred
    uncertainty: { form: none_reported }
    assumes: *cosmology
    cite: { paper: komberg-1996, table: "2", row: "LQG 11", column: "Rz, h−1Mpc" }
    note: "The group's comoving extent along the line of sight, which the paper takes as a reasonable estimate of size, since a survey does not cut a group along it."
  density_contrast:
    value: 2
    unit: dimensionless
    kind: estimated
    uncertainty: { form: none_reported }
    cite: { paper: komberg-1996, table: "1", row: "LQG 11", column: "Parameters", cell: "∆N/N ∼2" }
    note: "The approximate quasar number density contrast."
  probability_random:
    value: 0.05
    unit: dimensionless
    kind: inferred
    uncertainty: { form: none_reported }
    cite: { paper: komberg-1996, table: "2", row: "LQG 11", column: "Probability to be random" }
    note: "The fraction of random realisations of the host survey that hold a group as rich and dense in the same redshift range."
disputes: []
notes: >-
  Table 1 gives the members' coordinates as they are in the quasar catalogue the groups were found
  in, and the paper does not state their equinox. Eight members come from the deep UVX survey of
  Boyle et al. (its QSM field) and one each from the Large Bright Quasar Survey, Dunlop et al. and
  Savage et al. The probability to be random is that of the eight quasars in the QSM field alone.
  The quasar number density of Table 2 is in units univ-model does not have and is left out. Some
  encyclopaedia entries for these groups cite other papers; this file cites only the paper that
  found them.
