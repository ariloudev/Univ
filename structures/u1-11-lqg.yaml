disputes: []
notes: >-
  The members are the quasars of Table 2, with their SDSS J2000 positions as published; the
  paper's names are prefixed with SDSS J as for U1.28. The group was found beside the
  Clowes-Campusano LQG (U1.28, its own file) in the same direction. The paper finds it
  significant by its convex-hull-of-member-spheres test against random points; that departure is
  printed in units of sigma with the symbol glued to the number, which the file's citation check
  cannot read, so it is not carried. No paper disputing this group in particular was read;
  Nadathur disputes the linkage method for the Huge-LQG.
