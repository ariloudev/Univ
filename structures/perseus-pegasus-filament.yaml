values:
  length:
    value: 300
    unit: megaparsec
    kind: inferred
    uncertainty: { form: lower_limit }
    assumes: "h75^-1 Mpc: H0 = 75 km/s/Mpc"
    cite:
      paper: batuski-1985
      sentence: "The region contains a possible filament of galaxies and galaxy clusters which includes the Perseus-Pisces Supercluster and has a total apparent length of over 300 h^-1 Mpc."
      page: 5
    note: >-
      The paper's h is defined in its introduction as "(h = H0/75 Mpc km^-1 s^-1)". The body's sum
      of the direct links between the Abell clusters gives a somewhat longer lower bound, printed
      with the number glued to its unit, which the file's citation check cannot read.
  abell_clusters_in_contour:
    value: 16
    unit: dimensionless
    kind: measured
    uncertainty: { form: none_reported }
    cite:
      paper: batuski-1985
      sentence: "There are 16 Abell clusters within this contour."
      page: 7
disputes: []
notes: >-
  The members are the clusters of Table 2B, "Filament Members", in the galactic latitude and
  longitude the paper prints (it predates the Hipparcos definition of the galactic frame, from
  which its coordinates differ by far less than their printed precision). Four are poor Zwicky
  clusters, one of which the authors take as a bridge across the widest gap between Abell
  clusters. The redshifts are from the literature, except those the authors measured, which
  Table 2B marks; the number of galaxies averaged into each is left out. The paper calls the
  structure a possible filament: a Kolmogorov-Smirnov test of cluster alignments makes it
  unlikely in random samples with the Abell clusters' correlation function. Its Perseus-Pisces
  end runs into the zone of avoidance. Table 2A lists the region's non-members, which are
  not ported.
