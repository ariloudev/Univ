    reference: "Batuski & Burns 1985, ApJ 299, 5"
    title: "A possible 300 megaparsec filament of clusters of galaxies in Perseus-Pegasus"
    doi: 10.1086/163677
    bibcode: 1985ApJ...299....5B
    read: "ADS scan of the full article; Table 2B and the quoted sentences read on rendered page images"
