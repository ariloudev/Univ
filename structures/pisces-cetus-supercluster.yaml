    unit: megaparsec
    kind: estimated
    uncertainty: { form: none_reported }
    assumes: "h75^-1 Mpc: H0 = 75 km/s/Mpc"
    cite:
      paper: tully-1987
      sentence: "Much of the motivation for the claim in T86 that we are appended to a vast supercluster complex came from the observation that relatively nearby rich clusters (those within 100 h75^-1 Mpc) adhere to the same plane as that defined by the distribution of nearby galaxies (those within 40 h75^-1 Mpc) and, moreover, rich clusters in the Pisces-Cetus Supercluster (at a distance of ~200 h75^-1 Mpc) adhere remarkably to the very same plane."
      page: 8
    note: "The supercluster's distance as the paper rounds it."
disputes: []
notes: >-
  The Pisces-Cetus Supercluster is the first of the five parts into which the paper divides
  the Pisces-Cetus Supercluster Complex (its own file), and the paper calls it "the most
  prominent component of the complex". The members are the Abell clusters listed under its
  heading in Table 1, which gives each an adopted redshift and supergalactic Cartesian
  coordinates in h75^-1 Mpc; the coordinates give only each member's direction, and its
  distance comes from its redshift. The table stars the clusters that percolate to the
  complex's major component at the shorter of the paper's two scale lengths; the others join
  at the longer one. Both are kept as members. The paper notes that the supercluster may
  extend below the southern declination limit of the Abell survey.
