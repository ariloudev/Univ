      how: >-
        The plotted points of the raster layers of the figure (topcat_visually_identified.pdf in the
        arXiv source; one layer each for the ring, the inner filament and the additional absorbers,
        drawn in that order) found as connected groups of the layers' soft masks above half opacity,
        their mask-weighted centroids mapped linearly with the figure's axis ticks. A point on the ring
        layer that a later layer covers is assigned to that later layer. Overlapping points merge
        into one group; the count column estimates how many points each group holds from its area,
        against the area of a single point.
