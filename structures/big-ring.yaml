values:
  diameter:
    value: 400
    unit: megaparsec
    kind: estimated
    uncertainty: { form: none_reported }
    assumes: &cosmology
      cosmology: "proper size at the present epoch; ΩT0 = 1, ΩM0 = 0.27, ΩΛ0 = 0.73, H0 = 70 km/s/Mpc"
      cite:
        paper: lopez-2024
        sentence: "The concordance model is adopted for cosmological calculations, with ΩT0 = 1, ΩM0 = 0.27, ΩΛ0 = 0.73, and H0 = 70 km s-1 Mpc-1. All sizes given are proper sizes at the present epoch."
    cite:
      paper: lopez-2024
      sentence: "The BR is a striking circular, annulus-like, structure of diameter ~ 400 Mpc (proper size, present epoch)."
  diameter_low_estimate:
    value: 300
    unit: megaparsec
    kind: estimated
    uncertainty: { form: none_reported }
    assumes: *cosmology
    cite:
      paper: lopez-2024
      sentence: "From Figure 1 we can estimate the BR diameter is ~ 300 - 400 Mpc"
  absorber_count:
    value: 51
    unit: dimensionless
    kind: measured
    uncertainty: { form: none_reported }
    cite:
      paper: lopez-2024
      sentence: "The table is for the 51 visually-identified BR absorber members."
  redshift:
    value: 0.802
    unit: dimensionless
    kind: measured
    # The slice's half-width: a stated interval with no probability, its
    # bounds 0.742 and 0.862, not a one-sigma error.
    uncertainty: { form: interval, minus: 0.060, plus: 0.060 }
    cite:
      paper: lopez-2024
      sentence: "The tangent-plane distribution of Mg II absorbers in the redshift slice z = 0.802 ± 0.060."
  separation_from_giant_arc:
    value: 12
    unit: degree
    kind: estimated
    uncertainty: { form: none_reported }
    cite:
      paper: lopez-2024
      sentence: "In cosmological terms the BR is close to the GA --- at the same redshift z ~ 0.8 and with a separation on the sky of only ~ 12°."
disputes: []
notes: >-
  The paper's Table 5 lists the 51 ring absorbers without coordinates, so the positions are
  digitised from Figure 2. Some plotted points overlap and are merged into groups, whose count
  column estimates the points each holds, and some points carry two absorbers seen in one quasar
  spectrum, so the plotted points are fewer than the absorbers. The inner filament and the
  additional absorbers inside the ring are rows of their own; the paper does not count either
  separately. The newsroom atlas recorded a dispute from Sawala et al., but that paper only names
  the Big Ring among recent claims and tests the Giant Arc; no dispute of the ring itself was
  found, so none is recorded.
