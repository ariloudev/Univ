# A complex of rich Abell clusters, lying in a plane coincident with the supergalactic plane, to
# which the Local Supercluster is appended.
name: Pisces-Cetus Supercluster Complex
alternative_names: []
kind: supercluster_complex
status: observed
papers:
  - id: tully-1987
    reference: "Tully 1987, ApJ 323, 1"
    title: "More about clustering on a scale of 0.1 c"
    doi: 10.1086/165803
    bibcode: 1987ApJ...323....1T
    read: "ADS scan of the article (abstract and Figure 1 read)"
unplaced: >-
  The paper places the complex only in its Figure 1 (contours in supergalactic projections) and
  says its main plane is centred about 200 h75^-1 Mpc away, without a direction; no point or
  outline is published in numbers.
values:
  long_dimension:
    value: 300
    unit: megaparsec
    kind: estimated
    uncertainty: { form: none_reported }
    assumes: "h75^-1 Mpc: H0 = 75 km/s/Mpc"
    cite: &complex
      paper: tully-1987
      sentence: "This complex involves ~60 rich clusters and ~10^18 M☉ and has a long dimension of 300 h75^-1 Mpc ≈ 0.09 c km s^-1."
      page: 1
  rich_clusters:
    value: 60
    unit: dimensionless
    kind: estimated
    uncertainty: { form: none_reported }
    cite: *complex
  percolation_scale:
    value: 38
    unit: megaparsec
    kind: inferred
    uncertainty: { form: none_reported }
    assumes: "h75^-1 Mpc: H0 = 75 km/s/Mpc"
    cite:
      paper: tully-1987
      sentence: "(i) With a sample of rich clusters that is complete to beyond the mean distance of the complex, there is percolation across ~300 h75^-1 Mpc at a separations scale length of 38 h75^-1 Mpc, a value small compared with ρ^-1/3 = 54 h75^-1 Mpc."
      page: 1
  main_plane_distance:
    value: 200
    unit: megaparsec
    kind: estimated
    uncertainty: { form: none_reported }
    assumes: "h75^-1 Mpc: H0 = 75 km/s/Mpc"
    cite: &plane
      paper: tully-1987
      sentence: "The main plane of the Pisces-Cetus Supercluster Complex, centered ~200 h75^-1 Mpc away, is coincident with the principal plane of the Local Supercluster, both in terms of the alignment of polar axes and in terms of the alignment of equatorial disks. The thickness of the Pisces-Cetus main plane has FWHM ~40 h75^-1 Mpc."
      page: 1
  main_plane_thickness_fwhm:
    value: 40
    unit: megaparsec
    kind: inferred
    uncertainty: { form: none_reported }
    assumes: "h75^-1 Mpc: H0 = 75 km/s/Mpc"
    cite: *plane
disputes: []
notes: >-
  Tully's distances follow from redshifts with H0 = 75 h75 km/s/Mpc and q0 = 1/2 (footnote 1), so
  a length in h75^-1 Mpc is in Mpc at H0 = 75. The main plane is the supergalactic plane. The
  newsroom atlas read only the abstract; the scan confirms its values.
