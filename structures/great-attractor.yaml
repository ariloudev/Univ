# The mass concentration that the streaming of elliptical galaxies converges on, behind the
# Centaurus clusters near the Galactic plane: the flow-model fit of Lynden-Bell et al. 1988, with
# the Norma cluster that later redshift surveys in the Zone of Avoidance found near its centre.
name: Great Attractor
alternative_names: ["GA"]
kind: attractor
status: reconstructed
scale_domain: cosmic_web
papers:
  - id: lynden-bell-1988
    reference: "Lynden-Bell, Faber, Burstein, Davies, Dressler, Terlevich & Wegner 1988, ApJ 326, 19"
    title: "Spectroscopy and photometry of elliptical galaxies. V. Galaxy streaming toward the new supergalactic center"
    doi: 10.1086/166066
    bibcode: 1988ApJ...326...19L
    read: "ADS full-text scan (articles.adsabs.harvard.edu), which has no text layer, rendered to page images and read by eye: the abstract, Sections I, V f, VI and VII a, Tables 2 and 3 and the captions of Figures 6 and 8"
  - id: woudt-2008
    reference: "Woudt, Kraan-Korteweg, Lucey, Fairall & Moore 2008, MNRAS 383, 445"
    title: "The Norma cluster (ACO 3627) - I. A dynamical analysis of the most massive cluster in the Great Attractor"
    doi: 10.1111/j.1365-2966.2007.12571.x
    bibcode: 2008MNRAS.383..445W
    arxiv: "0706.2227"
    read: "arXiv source (LaTeX) of 0706.2227: abstract, introduction and conclusion"
  - id: tully-2014
    reference: "Tully, Courtois, Hoffman & Pomarède 2014, Nature 513, 71"
    title: "The Laniakea supercluster of galaxies"
    doi: 10.1038/nature13674
    bibcode: 2014Natur.513...71T
    arxiv: "1409.0880"
    read: "arXiv PDF of 1409.0880, text extracted: the main text, Methods and figure captions on the attractor region read"
# The standard mass-concentration (MC) model of Section VI b, in bold in Table 2: its direction is
# the one the paper imposes, that of the bulk flow, and its distance the one it fits, in km/s of
# the Hubble flow in the CMB frame.
position:
  frame: galactic
  lon:
    value: 307
    unit: degree
    kind: reconstructed
    uncertainty: { form: none_reported }
    cite: &direction
      paper: lynden-bell-1988
      sentence: "It is natural to place the mass concentration in the direction of the observed flow l = 307, b = 9."
      page: 33
    note: "Imposed, not fitted: the bulk flow's direction, l = 307 ± 11 and b = 9 ± 8 (values bulk_flow_l and bulk_flow_b). Table 2 prints no error for the direction of the standard MC solution."
  lat:
    value: 9
    unit: degree
    kind: reconstructed
    uncertainty: { form: none_reported }
    cite: *direction
  velocity:
    value: 4350
    unit: kilometre_per_second
    kind: reconstructed
    uncertainty: { form: symmetric, sigma: 350 }
    cite:
      paper: lynden-bell-1988
      sentence: "The motions of the elliptical galaxies, over and above Hubble expansion in the Cosmic Microwave Background (CMB) frame, are best fitted by a flow toward a great attractor centered on l = 307, b = 9 at a distance of R_m = 4350 ± 350 km s-1 in the Hubble flow."
      page: 19
    note: "R_m, the distance to the mass concentration in velocity units, fitted by maximum likelihood; Table 2 gives the same distance for the standard MC solution."
  redshift_frame: cmb
values:
  infall_velocity_at_local_group:
    value: 570
    unit: kilometre_per_second
    kind: reconstructed
    uncertainty: { form: symmetric, sigma: 60 }
    cite:
      paper: lynden-bell-1988
      sentence: "The best has a mass concentration that induces 570 ± 60 km s-1 at the Local Group, situated at a distance of 4350 ± 350 km s-1, in good agreement with the quadrupole estimate above."
      page: 33
    note: "V_m, the velocity the concentration induces at the Local Group in the model with no bulk flow."
  bulk_flow_l:
    value: 307
    unit: degree
    kind: inferred
    uncertainty: { form: symmetric, sigma: 11 }
    cite: &bulk
      paper: lynden-bell-1988
      sentence: "It is significant that both directions are close to that of the bulk motion of ellipticals relative to the CMB: l = 307 ± 11, b = 9 ± 8."
      page: 30
    note: "The Galactic longitude of the standard bulk-flow solution, the direction the mass concentration is placed in."
  bulk_flow_b:
    value: 9
    unit: degree
    kind: inferred
    uncertainty: { form: symmetric, sigma: 8 }
    cite: *bulk
    note: "The Galactic latitude of the standard bulk-flow solution."
  quadrupole_distance_estimate:
    value: 4200
    unit: kilometre_per_second
    kind: inferred
    uncertainty: { form: symmetric, sigma: 1100 }
    cite:
      paper: lynden-bell-1988
      sentence: "Taking h3 = 1.25 ± 0.06 and Vm = 521 km s-1 gives Rm = 4200 ± 1100 km s-1, but this distance is uncertain since the other two components of the quadrupole are unequal."
      page: 32
    note: "The distance implied by the quadrupole of the Hubble flow, before the model fitting; the paper calls it uncertain."
  norma_cluster_l:
    value: 325.3
    unit: degree
    kind: measured
    uncertainty: { form: none_reported }
    cite: &norma
      paper: woudt-2008
      sentence: "The Norma cluster is located at (ℓ, b, v) = (325.3°, −7.2°, 4871 km s-1)."
    note: "The Norma cluster (ACO 3627), which Woudt et al. place at the bottom of the potential well of the Great Attractor."
  norma_cluster_b:
    value: -7.2
    unit: degree
    kind: measured
    uncertainty: { form: none_reported }
    cite: *norma
  norma_cluster_velocity:
    value: 4871
    unit: kilometre_per_second
    kind: measured
    uncertainty: { form: symmetric, sigma: 54 }
    cite:
      paper: woudt-2008
      sentence: "From radial velocities of 296 cluster members, we find a mean velocity of 4871 ± 54 km s-1 and a velocity dispersion of 925 km s-1."
    note: "Heliocentric: the paper's overview of the region is drawn in heliocentric velocity. It is a redshift, not a distance, and is kept as published."
  cosmicflows_attractor_centroid_sgx:
    value: -4700
    unit: kilometre_per_second
    kind: reconstructed
    uncertainty: { form: none_reported }
    cite: &centroid
      paper: tully-2014
      sentence: "A local/tidal decomposition has been applied to a sphere of radius 6000 km s−1 = 80 Mpc centered on the putative centroid of the attractor region ([−4700, 1300, −500] km s−1)."
    note: "The Cosmicflows-2 centroid of the attractor region, read as supergalactic SGX as the Laniakea file reads it; the sentence names no frame."
  cosmicflows_attractor_centroid_sgy:
    value: 1300
    unit: kilometre_per_second
    kind: reconstructed
    uncertainty: { form: none_reported }
    cite: *centroid
  cosmicflows_attractor_centroid_sgz:
    value: -500
    unit: kilometre_per_second
    kind: reconstructed
    uncertainty: { form: none_reported }
    cite: *centroid
disputes:
  - claim: >-
      A smoothed reconstruction of the mass-density field by Kolatt et al. (1995), as Woudt et al.
      report it, puts the approximate centre of the extended overdensity at (ℓ, b, v) ∼ (320°, 0°,
      4000 km/s), uncertain by about 17°, away from the direction the flow model imposes.
    cite:
      paper: woudt-2008
      sentence: "Kolatt et al. (1995) locate the approximate centre of the extended GA overdensity at (ℓ, b, v) ∼ (320°, 0°, 4000 km s-1) based on their smoothed reconstructed mass-density field. The uncertainty in this position is ∼17° as a result of the applied smoothing of 1200 km s-1; this smoothing is necessary given the sparsely sampled data (Kolatt et al. 1995)."
notes: >-
  The position is the standard mass-concentration model of Lynden-Bell et al.: the concentration
  is placed in the direction of the elliptical galaxies' bulk flow relative to the CMB, and only
  its distance and the infall it induces at the Local Group are fitted. The direction is
  therefore the bulk flow's, kept with its own errors among the values, and Table 2 prints none
  for it in the standard MC solution. The distance is in km/s of the Hubble flow in the CMB
  frame, so it needs no Hubble constant. The paper's Galactic l and b, printed in whole degrees,
  predate the Hipparcos definition and are taken in it. The paper models a point concentration
  and gives no extent, so the structure is a point. Left out: the excess mass, in solar masses,
  which univ-model has no unit for; the Table 2 solution that fits a bulk flow beside the mass
  concentration; and the redshift peak of da Costa et al. that the abstract quotes, another
  paper's measurement. The paper calls the concentration in Centaurus the new supergalactic
  center. Woudt et al. find the Norma cluster close to the predicted centre and at the bottom of
  its potential well, and note that the attractor lies largely behind the Milky Way, which hid
  the galaxies that early estimates of its mass could not find; the cluster's position and
  heliocentric mean velocity are kept as published. Tully et al. find the Laniakea flows
  converging toward the Norma and Centaurus clusters near the Great Attractor; their attractor
  centroid is the Laniakea file's position, kept here as values. Not read: the Nature paper of
  Kraan-Korteweg et al. that identified the Norma cluster in the attractor region, Kolatt et al.
  (read only as Woudt et al. report them), and the earlier letter of Dressler et al.
