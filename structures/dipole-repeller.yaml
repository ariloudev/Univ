disputes: []
notes: >-
  A Wiener-filter reconstruction of Cosmicflows-2 peculiar velocities, at the edge of the data.
  Table 1 gives the repeller's distance and Methods attaches roughly 4,500 km/s to its radial
  position, as the abstract's 16,000 ± 4,500 km/s does; the same figure, from the scatter of the
  bulk flow's direction, is also given as the uncertainty of its projected position, so the
  position is uncertain by about 4,500 km/s in every direction rather than per coordinate as
  published. The paper gives no extent; it predicts a void there, poorly covered by redshift
  surveys. The newsroom atlas read the abstract's pair as the repeller's distance and its error,
  which agrees with the paper.
