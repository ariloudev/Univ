values:
  extent:
    value: 200
    unit: megaparsec
    kind: estimated
    uncertainty: { form: lower_limit }
    assumes: &cosmology "H0 = 70.1 km/s/Mpc, Ωm = 0.279, ΩΛ = 0.721 (WMAP 5-year)"
    cite:
      paper: bagchi-2017
      sentence: "This supercluster is a major concentration of galaxies and galaxy clusters, forming a wall-like structure spanning at least 200 Mpc across at the redshift z ≈ 0.3."
  clusters_in_main_body:
    value: 43
    unit: dimensionless
    kind: measured
    uncertainty: { form: lower_limit }
    cite: &body
      paper: bagchi-2017
      sentence: "The mean density contrast δ (relative to the background matter density of the universe) of Saraswati is ≳ 1.62 and the main body of the supercluster comprises at least 43 massive galaxy clusters (mean z = 0.28) with a total mass of ~2 × 10^16 M☉."
  mean_redshift:
    value: 0.28
    unit: dimensionless
    kind: measured
    uncertainty: { form: none_reported }
    cite: *body
  mean_density_contrast:
    value: 1.62
    unit: dimensionless
    kind: inferred
    uncertainty: { form: lower_limit }
    cite: *body
  core_radius:
    value: 20
    unit: megaparsec
    kind: inferred
    uncertainty: { form: none_reported }
    assumes: *cosmology
    cite:
      paper: bagchi-2017
      sentence: "The spherical collapse model suggests that the central region of radius ~20 Mpc and mass at least 4 × 10^15 M☉ may be collapsing."
disputes: []
notes: >-
  Table 1 lists the 48 WHL clusters within 90 comoving Mpc of Abell 2631, "in and around" the
  supercluster; the paper counts 43 in its main body without flagging which, so all 48 are kept as
  members. The five marked "bound core" form the bound central core. The masses (about 2 × 10^16
  solar masses in all) have no unit in univ-model and are left out.
