notes: >-
  The void is defined by rich (R ≥ 1) Abell clusters, not by galaxies: its diameter is that of the
  largest sphere free of such clusters, at the paper's H0 = 50 km/s/Mpc and q0 = 0.5 (stated on its
  first page). The 1988 discovery paper gave a size of 400 Mpc and a centre redshift of 0.116. The
  newsroom atlas listed the 17 shell clusters of Table 1 as members; they bound the void and are not
  its members, so they are left out here.
