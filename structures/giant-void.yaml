notes: >-
  The void is defined by rich (R ≥ 1) Abell clusters, not by galaxies: its diameter is that of the
  largest sphere free of such clusters, at the paper's H0 = 50 km/s/Mpc and q0 = 0.5. The 1988
  discovery found it in the richer R ≥ 2 clusters, with a larger size and a farther centre, given
  here as this paper reports them. The newsroom atlas listed the shell clusters of Table 1 as
  members; they bound the void and are not its members, so they are left out here.
