# Local storage that Univ Ingest publishes releases to: the D1 databases and one R2 bucket,
# written with `wrangler d1 execute --local` and `wrangler r2 object put --local`.
#
# There is no Worker entry and there are no routes here, on purpose: Univ Server's Worker is a
# separate product with its own configuration. This file only names the bindings, so that
# Wrangler knows which local database and bucket the publisher writes. Nothing is deployed.
name = "univ-ingest-local"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "univ"
database_id = "00000000-0000-0000-0000-000000000000"

# The object shards (univ_model::release::shards): a release's objects divided among them by
# cell, OBJECTS_{i} named univ-objects-{i}. Univ Server binds the same, by the same ids.
[[d1_databases]]
binding = "OBJECTS_0"
database_name = "univ-objects-0"
database_id = "00000000-0000-0000-0000-000000000100"

[[d1_databases]]
binding = "OBJECTS_1"
database_name = "univ-objects-1"
database_id = "00000000-0000-0000-0000-000000000101"

[[d1_databases]]
binding = "OBJECTS_2"
database_name = "univ-objects-2"
database_id = "00000000-0000-0000-0000-000000000102"

[[d1_databases]]
binding = "OBJECTS_3"
database_name = "univ-objects-3"
database_id = "00000000-0000-0000-0000-000000000103"

[[d1_databases]]
binding = "OBJECTS_4"
database_name = "univ-objects-4"
database_id = "00000000-0000-0000-0000-000000000104"

[[d1_databases]]
binding = "OBJECTS_5"
database_name = "univ-objects-5"
database_id = "00000000-0000-0000-0000-000000000105"

[[d1_databases]]
binding = "OBJECTS_6"
database_name = "univ-objects-6"
database_id = "00000000-0000-0000-0000-000000000106"

[[d1_databases]]
binding = "OBJECTS_7"
database_name = "univ-objects-7"
database_id = "00000000-0000-0000-0000-000000000107"

[[d1_databases]]
binding = "OBJECTS_8"
database_name = "univ-objects-8"
database_id = "00000000-0000-0000-0000-000000000108"

[[d1_databases]]
binding = "OBJECTS_9"
database_name = "univ-objects-9"
database_id = "00000000-0000-0000-0000-000000000109"

[[d1_databases]]
binding = "OBJECTS_10"
database_name = "univ-objects-10"
