[package]
name = "xtask"
description = "Project tasks for univ-server, such as the check gate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
univ-model = { path = "../crates/univ-model" }
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
sha2 = "0.11.1"
ctrlc = { version = "3.5.2", features = ["termination"] }

[dev-dependencies]
tempfile = "3.27.0"
