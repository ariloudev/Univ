# SQL the JSON gate refuses and allows, read by its tests. The gate reads YAML in rules/ only, so
# the refused cases here are not refused in the tree.

refused:
  - sql: "SELECT e.object_id FROM entries e WHERE json_extract(e.via_source, '$.n') = 1"
    call: "json_extract(e.via_source, …)"
    why: "entries is a table per catalogue entry"
  - sql: "SELECT json_type(spectral_type) FROM entries"
    call: "json_type(spectral_type)"
    why: "entries is a table per catalogue entry"
  - sql: "SELECT o.id FROM objects o WHERE o.kind ->> '$.a' = 1"
    call: "o.kind ->> '$.a'"
    why: "objects is a table per object"
  - sql: "SELECT value FROM objects, json_each(objects.kind)"
    call: "json_each(objects.kind)"
    why: "objects is a table per object"
  - sql: "SELECT json_extract(x.shape, '$') FROM structure_details d"
    call: "json_extract(x.shape, …)"
    why: "cannot tell which table x is"
  - sql: "SELECT json_extract(coalesce(e.via_source, '{}'), '$.a') FROM entries e"
    call: "json_extract(coalesce(e.via_source, '{}'), …)"
    why: "entries is a table per catalogue entry"
  - sql: "SELECT json_extract(i.record, '$.a') FROM items i"
    call: "json_extract(i.record, …)"
    why: "items, which is no table of the release schema"
  - sql: "SELECT json_extract(s.id, '$') FROM sources s"
    call: "json_extract(s.id, …)"
    why: "sources.id is not a JSON column"
  - sql: "SELECT json_extract(p.key, '$') FROM json_each(?1) p"
    call: "json_extract(p.key, …)"
    why: "p.key is not the value of the json_each"
  - sql: "WITH arm(code) AS (SELECT 1) SELECT m.object_id FROM measurements m JOIN arm a ON a.code = json_extract(m.native_form, '$.Arm')"
    call: "json_extract(m.native_form, …)"
    why: "measurements is a table per catalogue entry"

allowed:
  - "SELECT value FROM json_each(?1)"
  - "SELECT id FROM objects WHERE id IN (SELECT value FROM json_each(?2)) AND kind = 3"
  - "INSERT INTO item_times SELECT ?1, key, json_extract(value, '$[0]') FROM json_each(?3)"
  - "SELECT min(json_extract(p.value, '$[0]')) FROM structure_details d, json_each(d.shape, '$.geometry.points') p"
  - "SELECT json_group_array(json_array(s.id, json(t.catalogue_uncertainties))) FROM source_terms t JOIN sources s ON s.n = t.source"
  - "SELECT json_group_array(json_array(id, json(steps))) FROM chains WHERE release <= ?1"
  - "SELECT count(*) FROM ids_issued i JOIN (SELECT value AS id FROM json_each('[1,2]')) USING (id)"
  - "SELECT value FROM json_each(:ids)"
  - "SELECT json_extract(d.shape, '$.kind') FROM structure_details AS d WHERE d.structure = ?1"
  - "SELECT ?1 ->> '$.a'"
  - "-- json_extract(e.via_source, '$') in a comment\nSELECT 1"
  - "SELECT 'json_extract(e.via_source)' FROM entries e"
  - "SELECT m.id FROM maser m JOIN structure_details d ON d.id = m.arm, json_each(d.shape, '$.points') p GROUP BY m.id HAVING min(m.x - json_extract(p.value, '$[0]')) > 1"
