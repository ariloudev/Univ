        title: "What wave 4 produced"
        markdown: |-
          Merged as f106159.

          - **Univ Server:** `GET /v1/galaxy-model`, the definition a release sampled and the arms it followed; 404 naming the release where it holds none.
          - **Univ Explorer:** the model drawn as light by level of detail, its key and credits, covered points hidden while their counterparts are drawn, and the arms view of the model alone.
          - **After the owner tried it:** pinch and two-finger move on a phone, the arms 6 times as bright, the luminous hot stars dark and faint, the stars fading beyond 1 kpc, the RR Lyrae stars fading only where they crowd (so the halo and the Sagittarius stream stay), and the tracers in natural colours behind a switch.

          The full gate passed (14 gates), and `cargo xtask integration` passed with 28 browser tests. The owner asked to merge into develop and main, publish the spec and push.
        tone: success
