                {
                  "change": null,
                  "key": "01a19f22-2ad9-716e-876f-187ab1b6831a",
                  "kind": "feature",
                  "label": "F-5",
                  "name": "Record a researched structure",
                  "parent": "01a19f1a-685d-7357-b67e-d65aba28b58f"
                },
                {
                  "change": null,
                  "key": "01a1cbb8-4b9e-71c0-8bbe-c9186dc7de32",
                  "kind": "requirement",
                  "label": "RQ-197",
                  "name": "Univ Ingest shall compute each model spiral arm's path from the log-spiral parameters its structure file cites, as a spiral arm over the azimuths its fit covers and as an extrapolation beyond them.",
                  "parent": "01a19f22-2ad9-716e-876f-187ab1b6831a"
                },
                {
                  "change": "changed",
                  "key": "01a1cbb8-4b9e-71c0-8bbe-c919a9e453c5",
                  "kind": "criterion",
                  "label": "AC-733",
                  "name": "A spiral arm's structure file gives the arm's kink azimuth, radius at the kink, pitch angles inside and outside the kink, width and the range of azimuth its fit covers, each cited to the table of the paper whose fit it is.",
                  "parent": "01a1cbb8-4b9e-71c0-8bbe-c9186dc7de32"
                },
                {
                  "change": "changed",
                  "key": "01a1cbb8-4b9e-71c0-8bbe-c91a110700f5",
                  "kind": "criterion",
                  "label": "AC-734",
                  "name": "A spiral arm's structure file gives the Galactic Centre's distance its fit assumes and the Sun's height above the Galactic plane, each cited to the paper it comes from.",
                  "parent": "01a1cbb8-4b9e-71c0-8bbe-c9186dc7de32"
                },
                {
                  "change": "changed",
                  "key": "01a1cbb8-4b9e-71c0-8bbe-c91c1ebda9f7",
                  "kind": "criterion",
                  "label": "AC-736",
                  "name": "The path is given in heliocentric galactic Cartesian kiloparsecs, with the Sun at azimuth 0 and at the Galactic Centre's distance its fit assumes, azimuth increasing toward l = 90°, and the Galactic plane below the Sun by the Sun's cited height.",
                  "parent": "01a1cbb8-4b9e-71c0-8bbe-c9186dc7de32"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9baafa27f49f",
                  "kind": "criterion",
                  "label": null,
                  "name": "A spiral arm's structure file names the arm it is a stretch of, by one name for every paper's fit of that arm.",
                  "parent": "01a1cbb8-4b9e-71c0-8bbe-c9186dc7de32"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9bab79c57a03",
                  "kind": "criterion",
                  "label": null,
                  "name": "A fit that its paper gives in another convention of azimuth is converted to this one, and the structure file cites the paper's convention.",
                  "parent": "01a1cbb8-4b9e-71c0-8bbe-c9186dc7de32"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9bacc384c466",
                  "kind": "criterion",
                  "label": null,
                  "name": "A radius that a paper assumes for an arm, rather than fitting it, is inferred, and the structure file cites where the paper says it assumed it.",
                  "parent": "01a1cbb8-4b9e-71c0-8bbe-c9186dc7de32"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9b9e2c34b07c",
                  "kind": "feature",
                  "label": null,
                  "name": "Record a researched arm tracer",
                  "parent": "01a19f1a-685d-7357-b67e-d65aba28b58f"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9b9fe243e919",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall read each researched arm tracer from a tracer file in which every number cites where it comes from.",
                  "parent": "01a213c1-93e0-7343-9f8d-9b9e2c34b07c"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9ba0270490c4",
                  "kind": "criterion",
                  "label": null,
                  "name": "A tracer file gives the tracer's sky position, its parallax or distance with the kind of value and uncertainty its paper gives, and the arm its paper assigns it to.",
                  "parent": "01a213c1-93e0-7343-9f8d-9b9fe243e919"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9ba1c490b7d9",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each number cites its paper and the sentence or table cell it was taken from.",
                  "parent": "01a213c1-93e0-7343-9f8d-9b9fe243e919"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9ba2ca5e7413",
                  "kind": "criterion",
                  "label": null,
                  "name": "A distance from a trigonometric parallax is measured.",
                  "parent": "01a213c1-93e0-7343-9f8d-9b9fe243e919"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9ba3871875ea",
                  "kind": "criterion",
                  "label": null,
                  "name": "A kinematic distance is inferred, and names the rotation curve and the Galactic Centre's distance it assumes.",
                  "parent": "01a213c1-93e0-7343-9f8d-9b9fe243e919"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9ba49435103a",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each researched arm tracer is an object of the Galaxy tracers domain, a star-forming region for a maser and a molecular cloud for a cloud traced by its CO emission.",
                  "parent": "01a213c1-93e0-7343-9f8d-9b9fe243e919"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9ba59d19c7e5",
                  "kind": "requirement",
                  "label": null,
                  "name": "If a number in a tracer file cites nothing, then Univ Ingest shall refuse the tracer and name the number.",
                  "parent": "01a213c1-93e0-7343-9f8d-9b9e2c34b07c"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9ba6054a10b8",
                  "kind": "criterion",
                  "label": null,
                  "name": "The message names the tracer file, the field and the number.",
                  "parent": "01a213c1-93e0-7343-9f8d-9ba59d19c7e5"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9ba77bd99190",
                  "kind": "requirement",
                  "label": null,
                  "name": "The science checks shall report each researched arm tracer's distance from the nearest path of the arm its paper assigns it to.",
                  "parent": "01a213c1-93e0-7343-9f8d-9b9e2c34b07c"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9ba8fc3cbde2",
                  "kind": "criterion",
                  "label": null,
                  "name": "The check gives each tracer's distance from the nearest point of each spiral arm and extrapolation of its arm, in kiloparsecs.",
                  "parent": "01a213c1-93e0-7343-9f8d-9ba77bd99190"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9ba9b9cd8c87",
                  "kind": "criterion",
                  "label": null,
                  "name": "The check fails where a tracer lies more than 2 kpc from every path of its arm, which shows a wrong conversion of its position rather than a disagreement between papers.",
                  "parent": "01a213c1-93e0-7343-9f8d-9ba77bd99190"
                },
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d65c50ba74e7",
                  "kind": "feature_group",
                  "label": "FG-4",
                  "name": "Releases",
                  "parent": "01a19f1a-685d-7357-b67e-d658085bf5c8"
                },
                {
                  "change": null,
                  "key": "01a19f23-636f-72bd-b194-152a40334d81",
                  "kind": "feature",
                  "label": "F-10",
                  "name": "Build octree tiles",
                  "parent": "01a19f1a-685d-7357-b67e-d65c50ba74e7"
                },
                {
                  "change": "changed",
                  "key": "01a19f23-636f-72bd-b194-152b36f5a5b5",
                  "kind": "requirement",
                  "label": "RQ-36",
                  "name": "Univ Ingest shall build for each scale domain an octree of tiles over the derived ICRS Cartesian positions of its objects, or of its model points for the Galaxy model.",
                  "parent": "01a19f23-636f-72bd-b194-152a40334d81"
                },
                {
                  "change": "changed",
                  "key": "01a19f23-636f-72bd-b194-152c99726521",
                  "kind": "criterion",
                  "label": "AC-91",
                  "name": "Each scale domain has its own root: stars, Galaxy tracers and the Galaxy model in parsecs, nearby galaxies and cosmic web in megaparsecs.",
                  "parent": "01a19f23-636f-72bd-b194-152b36f5a5b5"
                },
                {
                  "change": "changed",
                  "key": "01a19f23-636f-72bd-b194-1531af0609ed",
                  "kind": "requirement",
                  "label": "RQ-37",
                  "name": "Univ Ingest shall encode each point of a tile of an object's scale domain with its position, object id, source and kind of value.",
                  "parent": "01a19f23-636f-72bd-b194-152a40334d81"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9bad6b74f088",
                  "kind": "feature",
                  "label": null,
                  "name": "Build the Galaxy model",
                  "parent": "01a19f1a-685d-7357-b67e-d65c50ba74e7"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9baebd200763",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall read the Galaxy model from its definition file, in which every number cites the paper it comes from or is marked as this project's choice with its reason.",
                  "parent": "01a213c1-93e0-7343-9f8d-9bad6b74f088"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9bafb71adc50",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each cited number of the definition names its paper and the sentence, table or figure it was taken from.",
                  "parent": "01a213c1-93e0-7343-9f8d-9baebd200763"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9bb0c0e51a9d",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each number that is this project's choice is marked as such and gives the reason for it.",
                  "parent": "01a213c1-93e0-7343-9f8d-9baebd200763"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9bb1aeebce25",
                  "kind": "criterion",
                  "label": null,
                  "name": "The definition gives six populations: the thin disc, the thick disc, the bar and bulge, the stellar halo, the young stars of the arms and the star-forming knots of the arms.",
                  "parent": "01a213c1-93e0-7343-9f8d-9baebd200763"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9bb2d2a3511b",
                  "kind": "criterion",
                  "label": null,
                  "name": "The definition gives each population its density in the Galaxy, its height above and below the Galactic plane, and either its stellar mass and mass-to-light ratio in the V band or its share of the Galaxy's light.",
                  "parent": "01a213c1-93e0-7343-9f8d-9baebd200763"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9bb39faba952",
                  "kind": "criterion",
                  "label": null,
                  "name": "The definition gives each population a display colour in sRGB, derived from a cited colour index or marked as this project's choice.",
                  "parent": "01a213c1-93e0-7343-9f8d-9baebd200763"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9bb4d6fea283",
                  "kind": "requirement",
                  "label": null,
                  "name": "If a number in the Galaxy model's definition neither cites a paper nor is marked as this project's choice, then Univ Ingest shall refuse the Galaxy model and name the number.",
                  "parent": "01a213c1-93e0-7343-9f8d-9bad6b74f088"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9bb542535a8b",
                  "kind": "criterion",
                  "label": null,
                  "name": "The message names the definition file, the field and the number.",
                  "parent": "01a213c1-93e0-7343-9f8d-9bb4d6fea283"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9bb6e4e48489",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall sample 10,000,000 model points from the Galaxy model, each standing for an equal share of the Galaxy's light in the V band.",
                  "parent": "01a213c1-93e0-7343-9f8d-9bad6b74f088"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9bb7a4016439",
                  "kind": "criterion",
                  "label": null,
                  "name": "The populations share the model points in proportion to their light in the V band, each population's light being its stellar mass divided by its mass-to-light ratio, or the share of the light its definition gives.",
                  "parent": "01a213c1-93e0-7343-9f8d-9bb6e4e48489"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9bb84543dd7a",
                  "kind": "criterion",
                  "label": null,
                  "name": "The points of each population are drawn from its density, in Galactocentric coordinates.",
                  "parent": "01a213c1-93e0-7343-9f8d-9bb6e4e48489"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9bb9af0bce6b",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each model point's position is converted to ICRS Cartesian parsecs about the Solar System barycentre, with the Galactic Centre 8.15 kpc from the Sun toward l = 0°, b = 0° and the Sun above the Galactic plane by the height Reid et al. 2019 give.",
                  "parent": "01a213c1-93e0-7343-9f8d-9bb6e4e48489"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9bba9db761af",
                  "kind": "criterion",
                  "label": null,
                  "name": "The sampling is seeded, with the seed recorded in the Galaxy model's tile manifest, so that building the release again gives the same model points.",
                  "parent": "01a213c1-93e0-7343-9f8d-9bb6e4e48489"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9bbb91a65512",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall place the young stars and the star-forming knots of the arms along each spiral arm by the best published fit of each stretch of its azimuth.",
                  "parent": "01a213c1-93e0-7343-9f8d-9bad6b74f088"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9bbc75cfbc04",
                  "kind": "criterion",
                  "label": null,
                  "name": "At each azimuth of an arm, the model follows the fit whose fitted range covers it, Reid et al. 2019's first, then each other paper's in the order the definition names them for that arm.",
                  "parent": "01a213c1-93e0-7343-9f8d-9bbb91a65512"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9bbd9e6223e0",
                  "kind": "criterion",
                  "label": null,
                  "name": "At an azimuth that no fit of the arm covers, the model follows an extrapolation of one of its fits, in the same order, with the weight the definition gives an extrapolation.",
                  "parent": "01a213c1-93e0-7343-9f8d-9bbb91a65512"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9bbe211c23a8",
                  "kind": "criterion",
                  "label": null,
                  "name": "Beyond every fit and every extrapolation of an arm, the model places none of that arm's young stars or star-forming knots.",
                  "parent": "01a213c1-93e0-7343-9f8d-9bbb91a65512"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9bbfb0d5452a",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each young star and star-forming knot is spread across its arm by a Gaussian whose width is the arm's cited width, scaled by the factor the definition gives its population.",
                  "parent": "01a213c1-93e0-7343-9f8d-9bbb91a65512"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9bc09db31c03",
                  "kind": "criterion",
                  "label": null,
                  "name": "The thin disc's density along each arm's path rises by the arm contrast the definition gives.",
                  "parent": "01a213c1-93e0-7343-9f8d-9bbb91a65512"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9bc13ee5d632",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall mark each model point that the real objects of the release cover.",
                  "parent": "01a213c1-93e0-7343-9f8d-9bad6b74f088"
                },
                {
                  "change": "added",
                  "key": "01a213c1-93e0-7343-9f8d-9bc2311c3ec6",
                  "kind": "criterion",
                  "label": null,
                  "name": "In each cube of 250 pc, the first n of a population's model points, in the order they were sampled, are marked covered, n being the number of real objects of that population's counterpart in the cube.",
