    id: spec-approval-1
    kind: approval
    versions:
      - key: 01a213c1-fbf6-7727-a46d-0aa1f52511d1
        at: 2026-11-25T17:30:09Z
        revision: 2
        by:
          host: claude-code
          session: "c9af65fa-1703-4232-b229-662e70de7bff"
        title: "Approve the Galaxy model specification"
        markdown: |-
          **What changed**

          - **New in Univ Ingest:** *Build the Galaxy model*. A cited definition file. Six populations: thin disc, thick disc, bar and bulge, stellar halo, the arms' young stars, the arms' star-forming knots. 10,000,000 model points, each an equal share of the Galaxy's V-band light. Seeded and deterministic. Points that real objects cover are marked. Tiles in encoding 5. The definition is published with the release.
          - **New in Univ Ingest:** *Record a researched arm tracer*. Hand-read tracer files for Sanna 2017, Dame & Thaddeus 2011, Lin 2026 and others. A science check fails where a tracer lies more than 2 kpc from its arm.
          - **Changed:** *Record a researched structure*. Spiral-arm fits may now come from any paper, not only Reid 2019 Table 2. They are converted to Reid's azimuth convention, each names the arm it is a stretch of, and an assumed radius is marked inferred.
          - **Changed:** *Build octree tiles*, *Fetch a tile manifest* and *Decode the tile format*, to add a fifth domain and encoding version 5.
          - **New in Univ Server:** *Read the Galaxy model*, which returns the definition of a release.
          - **New in Univ Explorer:** *See the Galaxy model*. Model points are drawn as additive light in each population's colour. They are not pickable, are counted apart, and are credited. A covered point is drawn only while its counterparts' domain is off.
          - **Changed:** *See the Galaxy's arms face-on*. The arms view also turns the Galaxy model on.
          - **Three decisions:** publish the model as a scale domain of model points; follow the best published fit of each stretch of an arm; keep covered model points and mark them.
          - **Terms:** a new *Galaxy model* and *model point*, and *scale domain* widened to cover them.

          **Please look at**

          1. **Covered points are kept and marked, not removed.** This refines your choice that the model fills gaps. The arms view hides the real stars, so removing the points would leave a hole around the Sun. Marked points let each client choose.
          2. **Points stand for light, not mass.** That is why the young arm stars get about 8% of the points instead of about 0.3%. It is what makes the arms show.
          3. **Some values are marked as this project's choices, not papers'.** These are the arm contrast of the old disc, the spread of the young stars across an arm, the extrapolation weight, the knots' share of light and their colour. Each carries a reason.
          4. **The tracer check fails only beyond 2 kpc.** It catches a wrong conversion, not a disagreement between papers.
