                    "name": "The message names the tracer file, the field and the number.",
                    "path": "spec/products/univ-ingest/normalization/record-a-researched-arm-tracer.yaml"
                  },
                  {
                    "column": 10,
                    "key": "01a213c1-93e0-7343-9f8d-9ba77bd99190",
                    "kind": "requirement",
                    "label": null,
                    "line": 39,
                    "name": "The science checks shall report each researched arm tracer's distance from the nearest path of the arm its paper assigns it to.",
                    "path": "spec/products/univ-ingest/normalization/record-a-researched-arm-tracer.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a213c1-93e0-7343-9f8d-9ba8fc3cbde2",
                    "kind": "criterion",
                    "label": null,
                    "line": 45,
                    "name": "The check gives each tracer's distance from the nearest point of each spiral arm and extrapolation of its arm, in kiloparsecs.",
                    "path": "spec/products/univ-ingest/normalization/record-a-researched-arm-tracer.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a213c1-93e0-7343-9f8d-9ba9b9cd8c87",
                    "kind": "criterion",
                    "label": null,
                    "line": 47,
                    "name": "The check fails where a tracer lies more than 2 kpc from every path of its arm, which shows a wrong conversion of its position rather than a disagreement between papers.",
                    "path": "spec/products/univ-ingest/normalization/record-a-researched-arm-tracer.yaml"
                  },
                  {
                    "column": 6,
                    "key": "01a213c1-93e0-7343-9f8d-9bad6b74f088",
                    "kind": "feature",
                    "label": null,
                    "line": 1,
                    "name": "Build the Galaxy model",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
                  },
                  {
                    "column": 10,
                    "key": "01a213c1-93e0-7343-9f8d-9baebd200763",
                    "kind": "requirement",
                    "label": null,
                    "line": 22,
                    "name": "Univ Ingest shall read the Galaxy model from its definition file, in which every number cites the paper it comes from or is marked as this project's choice with its reason.",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a213c1-93e0-7343-9f8d-9bafb71adc50",
                    "kind": "criterion",
                    "label": null,
                    "line": 28,
                    "name": "Each cited number of the definition names its paper and the sentence, table or figure it was taken from.",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a213c1-93e0-7343-9f8d-9bb0c0e51a9d",
                    "kind": "criterion",
                    "label": null,
                    "line": 30,
                    "name": "Each number that is this project's choice is marked as such and gives the reason for it.",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a213c1-93e0-7343-9f8d-9bb1aeebce25",
                    "kind": "criterion",
                    "label": null,
                    "line": 32,
                    "name": "The definition gives six populations: the thin disc, the thick disc, the bar and bulge, the stellar halo, the young stars of the arms and the star-forming knots of the arms.",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a213c1-93e0-7343-9f8d-9bb2d2a3511b",
                    "kind": "criterion",
                    "label": null,
                    "line": 34,
                    "name": "The definition gives each population its density in the Galaxy, its height above and below the Galactic plane, and either its stellar mass and mass-to-light ratio in the V band or its share of the Galaxy's light.",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a213c1-93e0-7343-9f8d-9bb39faba952",
                    "kind": "criterion",
                    "label": null,
                    "line": 36,
                    "name": "The definition gives each population a display colour in sRGB, derived from a cited colour index or marked as this project's choice.",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
                  },
                  {
                    "column": 10,
                    "key": "01a213c1-93e0-7343-9f8d-9bb4d6fea283",
                    "kind": "requirement",
                    "label": null,
                    "line": 38,
                    "name": "If a number in the Galaxy model's definition neither cites a paper nor is marked as this project's choice, then Univ Ingest shall refuse the Galaxy model and name the number.",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a213c1-93e0-7343-9f8d-9bb542535a8b",
                    "kind": "criterion",
                    "label": null,
                    "line": 45,
                    "name": "The message names the definition file, the field and the number.",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
                  },
                  {
                    "column": 10,
                    "key": "01a213c1-93e0-7343-9f8d-9bb6e4e48489",
                    "kind": "requirement",
                    "label": null,
                    "line": 47,
                    "name": "Univ Ingest shall sample 10,000,000 model points from the Galaxy model, each standing for an equal share of the Galaxy's light in the V band.",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a213c1-93e0-7343-9f8d-9bb7a4016439",
                    "kind": "criterion",
                    "label": null,
                    "line": 53,
                    "name": "The populations share the model points in proportion to their light in the V band, each population's light being its stellar mass divided by its mass-to-light ratio, or the share of the light its definition gives.",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a213c1-93e0-7343-9f8d-9bb84543dd7a",
                    "kind": "criterion",
                    "label": null,
                    "line": 55,
                    "name": "The points of each population are drawn from its density, in Galactocentric coordinates.",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a213c1-93e0-7343-9f8d-9bb9af0bce6b",
                    "kind": "criterion",
                    "label": null,
                    "line": 57,
                    "name": "Each model point's position is converted to ICRS Cartesian parsecs about the Solar System barycentre, with the Galactic Centre 8.15 kpc from the Sun toward l = 0°, b = 0° and the Sun above the Galactic plane by the height Reid et al. 2019 give.",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a213c1-93e0-7343-9f8d-9bba9db761af",
                    "kind": "criterion",
                    "label": null,
                    "line": 59,
                    "name": "The sampling is seeded, with the seed recorded in the Galaxy model's tile manifest, so that building the release again gives the same model points.",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
                  },
                  {
                    "column": 10,
                    "key": "01a213c1-93e0-7343-9f8d-9bbb91a65512",
                    "kind": "requirement",
                    "label": null,
                    "line": 61,
                    "name": "Univ Ingest shall place the young stars and the star-forming knots of the arms along each spiral arm by the best published fit of each stretch of its azimuth.",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a213c1-93e0-7343-9f8d-9bbc75cfbc04",
                    "kind": "criterion",
                    "label": null,
                    "line": 67,
                    "name": "At each azimuth of an arm, the model follows the fit whose fitted range covers it, Reid et al. 2019's first, then each other paper's in the order the definition names them for that arm.",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a213c1-93e0-7343-9f8d-9bbd9e6223e0",
                    "kind": "criterion",
                    "label": null,
                    "line": 69,
                    "name": "At an azimuth that no fit of the arm covers, the model follows an extrapolation of one of its fits, in the same order, with the weight the definition gives an extrapolation.",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a213c1-93e0-7343-9f8d-9bbe211c23a8",
                    "kind": "criterion",
                    "label": null,
                    "line": 71,
                    "name": "Beyond every fit and every extrapolation of an arm, the model places none of that arm's young stars or star-forming knots.",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a213c1-93e0-7343-9f8d-9bbfb0d5452a",
                    "kind": "criterion",
                    "label": null,
                    "line": 73,
                    "name": "Each young star and star-forming knot is spread across its arm by a Gaussian whose width is the arm's cited width, scaled by the factor the definition gives its population.",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a213c1-93e0-7343-9f8d-9bc09db31c03",
                    "kind": "criterion",
                    "label": null,
                    "line": 75,
                    "name": "The thin disc's density along each arm's path rises by the arm contrast the definition gives.",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
                  },
                  {
                    "column": 10,
                    "key": "01a213c1-93e0-7343-9f8d-9bc13ee5d632",
                    "kind": "requirement",
                    "label": null,
                    "line": 77,
                    "name": "Univ Ingest shall mark each model point that the real objects of the release cover.",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a213c1-93e0-7343-9f8d-9bc2311c3ec6",
                    "kind": "criterion",
                    "label": null,
                    "line": 83,
                    "name": "In each cube of 250 pc, the first n of a population's model points, in the order they were sampled, are marked covered, n being the number of real objects of that population's counterpart in the cube.",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a213c1-93e0-7343-9f8d-9bc342e650c3",
                    "kind": "criterion",
                    "label": null,
                    "line": 85,
                    "name": "The counterparts of the young stars and the star-forming knots of the arms are the luminous hot stars, open clusters and star-forming regions of the Galaxy tracers domain.",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
                  },
