                    "key": "01a213c1-93e0-7343-9f8d-9bc4c1df698a",
                    "kind": "criterion",
                    "label": null,
                    "line": 87,
                    "name": "The counterparts of the thin disc, the thick disc, the bar and bulge and the stellar halo are the objects of the stars domain.",
                    "path": "spec/products/univ-ingest/releases/build-the-galaxy-model.yaml"
