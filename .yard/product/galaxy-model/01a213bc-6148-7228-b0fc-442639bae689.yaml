        title: "Choices made before the branch was cut"
        markdown: |-
          Asked in the session on `feat/milky-way`, before this branch was cut from it:

          | Question | Choice |
          |---|---|
          | What each model star holds | Visual points only: position, colour, brightness weight, population |
          | How many | About 10 million points per release |
          | Near the Sun | The model fills gaps: it adds only what real catalogues lack, per population |
          | The far side's arms | C: the best published fit for each stretch (Reid 2019; Sun et al. 2024, Hyland et al. 2026, Dame & Thaddeus 2008 beyond), continuing a Reid fit only where no paper covers it; Sanna 2017, Dame & Thaddeus 2011, McClure-Griffiths 2004 and Lin et al. 2026 as tracers with a science check |
          | Branch | `product/galaxy-model`, cut from `feat/milky-way` |

          Purpose: the dataset lives in Univ so that a separate sci-fi project can reuse it.

          Prototype renders (Python, scratchpad): Reid fits with a disc, bar and bulge from Bland-Hawthorn & Gerhard 2016. Reid's Scutum–Centaurus continued to β = −192° passes 0.25 kpc from Sanna 2017's far-side maser.
        tone: info
