        title: "Wave 1 merged"
        markdown: |-
          Merged `stage/galaxy-model-1` (commit `8edcdf6`).

          - Far-side fits: Sun et al. 2024 (outer Scutum–Centaurus, Outer), Hyland et al. 2026 (Perseus to β ≈ 180°), McClure-Griffiths et al. 2004 (distant fourth-quadrant arm). Dame & Thaddeus 2008's far 3-kpc arm left out: no pitch stated.
          - 18 researched arm tracers: Sanna 2017, Lin et al. 2026 (7), Dame & Thaddeus 2011 (10 CO clouds, the new molecular cloud kind).
          - `univ-ingest build --structures-of galaxy_tracers`: the Milky Way release now holds the Galaxy's 22 arm structures.
          - Science checks on Milky Way release 3: every tracer within 5 kpc of its arm (Lin 0.19–0.88, Sanna 1.96, Dame 1.45–4.82 kpc), every tracer placed on its arm.
          - Spec changes approved during the wave: the tracer check's 5 kpc bound; `--structures-of`; a fit cited to a table, sentence or figure; molecular clouds among the tracer kinds.
          - Environment: the gate now runs with rustup's toolchain first on the path (wasm32), cargo-machete and cargo-deny installed, `url` 2.5.9, humantime's unmaintained advisory ignored with its reason.
        tone: success
