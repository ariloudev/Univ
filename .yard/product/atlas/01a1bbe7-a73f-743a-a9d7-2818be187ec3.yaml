        title: "W7 merged: the distance rings"
        markdown: |-
          stage/atlas-w7 merged at 9410882 after the review fixes, the full gate and integration (14 explorer e2e tests). Its Yard Log has the details.

          - **What the owner approved:** a new requirement under frame-the-view-as-an-atlas, with nine criteria.
          - **Plan mode:** the plan was presented again through plan mode after the owner asked why it hadn't been. Later waves' plans go through plan mode.
          - **Two minor spec changes:** labels go on the arcs' middle line where only arcs are drawn, and the rings may run on to 4 × the eye's distance so that a moving view keeps them.
          - **Open for the owner:** at a shallow angle the far rings crowd into a band near the horizon. A shorter reach would thin it.

          product/atlas is not merged into develop or main, and nothing is pushed, published or deployed.
