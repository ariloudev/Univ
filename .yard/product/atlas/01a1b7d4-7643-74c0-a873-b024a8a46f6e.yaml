  - key: 01a1b7dc-72f3-70ae-b7ed-51a0a3566bc8
    id: q-openngc
    kind: question
    versions:
      - key: 01a1b7dc-72f3-70ae-b7ed-51a656c7f3ef
        at: 2026-11-07T21:14:00Z
        revision: 2
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        prompt: "OpenNGC's terms are CC BY-SA 4.0: data adapted from it must be shared under the same licence. Should release 12 adopt it?"
        header: "OpenNGC"
        context: "OpenNGC is the one open source of NGC/IC designations, Messier numbers and galaxy common names such as \"Andromeda Galaxy\". Share-alike covers the adapted database, not other sources' data, so its names would be published as a separable source marked share-alike, crediting Mattia Verga. The copyrighted alternative, NGC 2000.0, cannot be redistributed."
        options:
          - label: "Adopt, share-alike"
            detail: "M31, NGC 4472 and \"Andromeda Galaxy\" resolve, and NGC/IC numbers head galaxy panels. Its names are marked share-alike in the source record and in the credits. Recommended: there is no open alternative of the same coverage."
            recommended: true
          - label: "Skip OpenNGC"
            detail: "Only IAU star names now. Galaxies keep their survey designations (2MASS, PGC), and M31 still does not resolve until a CC0 source such as Wikidata is added later."
    responses:
      - key: 01a1b7dd-a86c-776c-a9a2-4fbf9f15487e
        at: 2026-11-07T21:15:19Z
        revision: 3
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: terminal
        chosen:
          - "Adopt, share-alike"
  - key: 01a1b7dc-72f3-70ae-b7ed-51a1bf98bc34
    id: q-sky-only
    kind: question
    versions:
      - key: 01a1b7dc-72f3-70ae-b7ed-51a7302b58c6
        at: 2026-11-07T21:14:00Z
        revision: 2
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        prompt: "What should happen to names that match no object we hold, such as most Messier clusters and nebulae (M42, M45) and stars without a HIP number?"
        header: "Unmatched"
        context: "About 2,580 OpenNGC rows are clusters, nebulae or stars, including 70 of the 110 Messier objects, and 74 IAU names have no HIP number. None of our catalogues has an object for them, and they have no distance."
        options:
          - label: "Sky-only objects"
            detail: "Each becomes an object with its sky position and no distance, so searching \"M42\" finds it and its panel says it is not placed. It is not drawn in 3D until a source gives it a distance. Recommended: the names stay findable, and nothing is drawn where we don't know the distance."
            recommended: true
          - label: "Leave them out"
            detail: "Only names that join an object we already hold are kept. The rest are counted under a left-out reason, and searching \"M42\" finds nothing."
    responses:
      - key: 01a1b7dd-a86c-776c-a9a2-4fc041cff1f1
        at: 2026-11-07T21:15:19Z
        revision: 3
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: terminal
        chosen:
          - "Sky-only objects"
  - key: 01a1b7dc-72f3-70ae-b7ed-51a2ff9deefe
    id: q-iau-copy
    kind: question
    versions:
      - key: 01a1b7dc-72f3-70ae-b7ed-51a8aef7d4c0
        at: 2026-11-07T21:14:00Z
        revision: 2
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        prompt: "How should the IAU star-name list be taken in?"
        header: "IAU list"
        context: "The current list (652 names, to 2026-10-15) is only an HTML table at exopla.net. The last text file is from 2022 and has 452 names. The names are public domain."
        options:
          - label: "Snapshot in repo"
            detail: "Read the live table once into a YAML file under the repository, with the date it was read, as the researched star files are. Rebuilds stay reproducible offline, and an update is a new snapshot. Recommended."
            recommended: true
          - label: "Fetch the 2022 file"
            detail: "Fetch the plain-text file each run, like the other sources. Simpler to keep, but 200 newer names are missing."
          - label: "Scrape each run"
            detail: "Fetch and parse the live HTML table on every fetch. Always current, but it needs a new HTML-table access method and breaks if the page changes."
    responses:
      - key: 01a1b7dd-a86c-776c-a9a2-4fc1c589e4db
        at: 2026-11-07T21:15:19Z
        revision: 3
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: terminal
        chosen:
          - "Snapshot in repo"
