          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "What the research found"
        markdown: |-
          **The panel today.** HIP 32754 is headed "32754 #17", because `headingOf` takes the first entry's name, a bare HIP number. Below that it lists eight raw ids with source slugs. The record already holds sky position, magnitudes, proper motion, radial velocity, redshift, flags and group relations, and the panel shows none of them.

          **Designations.** `rules/matching.yaml` already prefixes a few (such as "HIP " on gaia-dr3-hipparcos2). Source definitions deny unknown fields, so the designation form and flag meanings are new fields there. Nothing records what flag values mean today, only prose in `cuts`.

          **Name sources**

          | Source | Names | Terms | Joins by |
          |---|---|---|---|
          | IAU Catalog of Star Names (WGSN) | 652, to 2026-10-15 | Public domain (names); the etymology text is CC BY, not taken | HIP (578 of 652) |
          | OpenNGC v20260501 (Verga) | 13,970 NGC/IC rows, all 110 Messier numbers, 152 common names | **CC BY-SA 4.0**, credit Mattia Verga | PGC (10,105 of the 10,792 galaxies), 2MASX (9,704), position |
          | NGC 2000.0 (VizieR VII/118) | 13,226 | Sky Publishing copyright, scientific use only | not adopted |
          | Wikidata labels | many | CC0 | later, if wanted |

          - OpenNGC: drop 652 duplicate and 10 nonexistent rows. About 2,580 rows are clusters and nebulae, with nothing in our catalogues to attach to. That includes 70 of the 110 Messier objects. M102 is listed as a duplicate of M101; NGC 5866 is the usual identification, and that is noted as a dispute.
          - IAU: the live list is an HTML table only. The last text file, from 2022, has 452 names.
