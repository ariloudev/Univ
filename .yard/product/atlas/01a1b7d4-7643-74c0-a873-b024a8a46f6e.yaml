                  "kind": "criterion",
                  "label": null,
                  "name": "An object's designations are ordered by the rank the designation rules give their sources, the highest first, then by source id.",
                  "parent": "01a19f23-636f-72bd-b194-15129323b215"
                },
                {
                  "change": "added",
                  "key": "01a1b7d8-3f35-70aa-853f-45a8bb0003b4",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each designation in its catalogue's form is attached to the object as a name its source gives, so that the object is found by it.",
                  "parent": "01a19f23-636f-72bd-b194-15129323b215"
                },
                {
                  "change": "added",
                  "key": "01a1b7dc-04ef-7334-abc7-37e775e83b00",
                  "kind": "criterion",
                  "label": null,
                  "name": "A proper name, such as Sirius or the Andromeda Galaxy, is attached as the name of its catalogue entry, apart from the object's designations.",
                  "parent": "01a19f23-636f-72bd-b194-15129323b215"
                },
                {
                  "change": "added",
                  "key": "01a1b7dc-04ef-7334-abc7-37e83780d376",
                  "kind": "criterion",
                  "label": null,
                  "name": "An entry of a star-name source joins the object of the star its HIP number names.",
                  "parent": "01a19f23-636f-72bd-b194-15129323b215"
                },
                {
                  "change": "added",
                  "key": "01a1b7dc-04ef-7334-abc7-37e9e889ce84",
                  "kind": "criterion",
                  "label": null,
                  "name": "An entry of a galaxy-name source joins the object its PGC number or 2MASX designation names, or else the object its position matches.",
                  "parent": "01a19f23-636f-72bd-b194-15129323b215"
                },
                {
                  "change": "added",
                  "key": "01a1b7dc-04ef-7334-abc7-37eac8b77d98",
                  "kind": "criterion",
                  "label": null,
                  "name": "An entry of a name source that joins no object becomes an object of its own, with its sky position and no distance.",
                  "parent": "01a19f23-636f-72bd-b194-15129323b215"
                },
                {
                  "change": "added",
                  "key": "01a1b7dc-04ef-7334-abc7-37eb1f141005",
                  "kind": "criterion",
                  "label": null,
                  "name": "A name source's entries that its catalogue marks as duplicates or as nonexistent objects are left out, each with its reason.",
                  "parent": "01a19f23-636f-72bd-b194-15129323b215"
                },
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d65c50ba74e7",
                  "kind": "feature_group",
                  "label": "FG-4",
                  "name": "Releases",
                  "parent": "01a19f1a-685d-7357-b67e-d658085bf5c8"
                },
                {
                  "change": null,
                  "key": "01a19f23-636f-72bd-b194-151d9fb569d2",
                  "kind": "feature",
                  "label": "F-9",
                  "name": "Build a release",
                  "parent": "01a19f1a-685d-7357-b67e-d65c50ba74e7"
                },
                {
                  "change": "changed",
                  "key": "01a19f23-636f-72bd-b194-151ed99bd6f9",
                  "kind": "requirement",
                  "label": "RQ-33",
                  "name": "When the owner builds a release, Univ Ingest shall assemble its objects, structures, volume grids, tiles, sources and manifests into a complete release on local disk, written as what it changes from the release latest points to.",
                  "parent": "01a19f23-636f-72bd-b194-151d9fb569d2"
                },
                {
                  "change": "changed",
                  "key": "01a19f23-636f-72bd-b194-1521b702e5bb",
                  "kind": "criterion",
                  "label": "AC-84",
                  "name": "The release manifest lists every file of the release with its SHA-256, those it shares with the release before it included.",
                  "parent": "01a19f23-636f-72bd-b194-151ed99bd6f9"
                },
                {
                  "change": "added",
                  "key": "01a1b19f-a71f-7111-b5df-7f33b5e55051",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the owner builds a release, Univ Ingest shall write only the rows that differ from those valid in the release latest points to, and retire the rows that release holds and the new one does not.",
                  "parent": "01a19f23-636f-72bd-b194-151d9fb569d2"
                },
                {
                  "change": "added",
                  "key": "01a1b19f-a71f-7111-b5df-7f34044901a8",
                  "kind": "criterion",
                  "label": null,
                  "name": "A row the new release holds unchanged from the release latest points to is not written again.",
                  "parent": "01a1b19f-a71f-7111-b5df-7f33b5e55051"
                },
                {
                  "change": "added",
                  "key": "01a1b19f-a71f-7111-b5df-7f35e0c90550",
                  "kind": "criterion",
                  "label": null,
                  "name": "A row the release latest points to holds and the new release does not is retired from the new release on.",
                  "parent": "01a1b19f-a71f-7111-b5df-7f33b5e55051"
                },
                {
                  "change": "added",
                  "key": "01a1b19f-a71f-7111-b5df-7f36f972f991",
                  "kind": "criterion",
                  "label": null,
                  "name": "A changed row is retired from the new release on and written again, valid from it.",
                  "parent": "01a1b19f-a71f-7111-b5df-7f33b5e55051"
                },
                {
                  "change": "added",
                  "key": "01a1b19f-a71f-7111-b5df-7f372d8be4cc",
                  "kind": "criterion",
                  "label": null,
                  "name": "Rows are compared by their key and a hash of their content, kept for the release latest points to beside the id state.",
                  "parent": "01a1b19f-a71f-7111-b5df-7f33b5e55051"
                },
                {
                  "change": "added",
                  "key": "01a1b19f-a71f-7111-b5df-7f385b1742dd",
                  "kind": "criterion",
                  "label": null,
                  "name": "A release whose only change from the release before it is in its structures writes no object, catalogue entry, measurement or tile.",
                  "parent": "01a1b19f-a71f-7111-b5df-7f33b5e55051"
                },
                {
                  "change": "added",
                  "key": "01a1b19f-a71f-7111-b5df-7f39d65afd25",
                  "kind": "criterion",
                  "label": null,
                  "name": "The release manifest gives, for each table of each database, the rows the release adds and retires and the fingerprint of every row valid in it.",
                  "parent": "01a1b19f-a71f-7111-b5df-7f33b5e55051"
                },
                {
                  "change": "added",
                  "key": "01a1b19f-a71f-7111-b5df-7f3a7c9bc406",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall store each file of a release once by its SHA-256, shared by every release that holds it.",
                  "parent": "01a19f23-636f-72bd-b194-151d9fb569d2"
                },
                {
                  "change": "added",
                  "key": "01a1b19f-a71f-7111-b5df-7f3bcb2e200b",
                  "kind": "criterion",
                  "label": null,
                  "name": "A file whose SHA-256 a release not yet pruned already holds is not written again.",
                  "parent": "01a1b19f-a71f-7111-b5df-7f3a7c9bc406"
                },
                {
                  "change": "added",
                  "key": "01a1b19f-a71f-7111-b5df-7f3ca904736d",
                  "kind": "criterion",
                  "label": null,
                  "name": "The release maps each of its paths to the SHA-256 of the file it holds there.",
                  "parent": "01a1b19f-a71f-7111-b5df-7f3a7c9bc406"
                },
                {
                  "change": null,
                  "key": "01a19f23-636f-72bd-b194-15372421c144",
                  "kind": "feature",
                  "label": "F-11",
                  "name": "Prune old releases",
                  "parent": "01a19f1a-685d-7357-b67e-d65c50ba74e7"
                },
                {
                  "change": "changed",
                  "key": "01a19f23-636f-72bd-b194-1538be54b520",
                  "kind": "requirement",
                  "label": "RQ-39",
                  "name": "When the owner prunes a release, Univ Ingest shall delete the rows and files that no release left unpruned holds, and record when it was pruned.",
                  "parent": "01a19f23-636f-72bd-b194-15372421c144"
                },
                {
                  "change": "added",
                  "key": "01a1b19f-a71f-7111-b5df-7f3d6d51b6a3",
                  "kind": "criterion",
                  "label": null,
                  "name": "A row or file that a release left unpruned holds is not deleted.",
                  "parent": "01a19f23-636f-72bd-b194-1538be54b520"
                },
                {
                  "change": "changed",
                  "key": "01a1a931-2c8a-73a8-91f2-590d7b43ba10",
                  "kind": "criterion",
                  "label": "AC-475",
                  "name": "The rows valid only in pruned releases are deleted from the catalogue database and from every object shard.",
                  "parent": "01a19f23-636f-72bd-b194-1538be54b520"
                },
                {
                  "change": null,
                  "key": "01a19f23-636f-72bd-b194-153d515c188e",
                  "kind": "feature",
                  "label": "F-12",
                  "name": "Publish a release locally",
                  "parent": "01a19f1a-685d-7357-b67e-d65c50ba74e7"
                },
                {
                  "change": "changed",
                  "key": "01a19f23-636f-72bd-b194-153ee5a17619",
                  "kind": "requirement",
                  "label": "RQ-41",
                  "name": "When the owner publishes a complete release, Univ Ingest shall upload the files and rows it adds and the retirements it records to local R2 and to the catalogue database and object shards of local D1, and only then point latest at it.",
                  "parent": "01a19f23-636f-72bd-b194-153d515c188e"
                },
                {
                  "change": "added",
                  "key": "01a1b19f-a71f-7111-b5df-7f3e7a645727",
                  "kind": "criterion",
                  "label": null,
                  "name": "No row or file the release shares with the release before it is uploaded again.",
                  "parent": "01a19f23-636f-72bd-b194-153ee5a17619"
                },
                {
                  "change": "added",
                  "key": "01a1b19f-a71f-7111-b5df-7f3f2c140ce6",
                  "kind": "criterion",
                  "label": null,
                  "name": "Once uploaded, the rows valid in the release in each database match the counts and fingerprints of the release manifest.",
                  "parent": "01a19f23-636f-72bd-b194-153ee5a17619"
                },
                {
                  "change": "added",
                  "key": "01a1b19f-a71f-7111-b5df-7f4080f434a5",
                  "kind": "requirement",
                  "label": null,
                  "name": "If the release was built on a release other than the one latest points to, then Univ Ingest shall refuse to publish it before uploading anything.",
                  "parent": "01a19f23-636f-72bd-b194-153d515c188e"
                },
                {
                  "change": "added",
                  "key": "01a1b19f-a71f-7111-b5df-7f4109bd7c10",
                  "kind": "criterion",
                  "label": null,
                  "name": "The message names the release it was built on and the release latest points to.",
                  "parent": "01a1b19f-a71f-7111-b5df-7f4080f434a5"
                },
                {
                  "change": "added",
                  "key": "01a1b19f-a71f-7111-b5df-7f42a7d3e03b",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the owner publishes onto local D1 and R2 that hold releases of the D1 schema before rows were shared, Univ Ingest shall bring those releases under the shared schema in place before uploading anything.",
                  "parent": "01a19f23-636f-72bd-b194-153d515c188e"
                },
                {
                  "change": "added",
                  "key": "01a1b19f-a71f-7111-b5df-7f4375add914",
                  "kind": "criterion",
                  "label": null,
                  "name": "Every row of such a release is valid from that release until a later release retires it.",
                  "parent": "01a1b19f-a71f-7111-b5df-7f42a7d3e03b"
                },
                {
                  "change": "added",
                  "key": "01a1b19f-a71f-7111-b5df-7f44a48bd262",
                  "kind": "criterion",
                  "label": null,
                  "name": "Every file of such a release is held once by its SHA-256 and read through the release's map of its paths.",
                  "parent": "01a1b19f-a71f-7111-b5df-7f42a7d3e03b"
                },
                {
                  "change": "added",
                  "key": "01a1b19f-a71f-7111-b5df-7f45728f89f0",
                  "kind": "criterion",
                  "label": null,
                  "name": "No such release is built or uploaded again.",
                  "parent": "01a1b19f-a71f-7111-b5df-7f42a7d3e03b"
                },
                {
                  "change": "added",
                  "key": "01a1b19f-a71f-7111-b5df-7f4682a162c9",
                  "kind": "criterion",
                  "label": null,
                  "name": "Reads pinned to such a release return the same data after the change as before it.",
                  "parent": "01a1b19f-a71f-7111-b5df-7f42a7d3e03b"
                },
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d65e20557892",
                  "kind": "product",
                  "label": "P-2",
                  "name": "Univ Server",
                  "parent": null
                },
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d65f1c690202",
                  "kind": "feature_group",
                  "label": "FG-6",
                  "name": "Reference data",
                  "parent": "01a19f1a-685d-7357-b67e-d65e20557892"
                },
                {
                  "change": null,
                  "key": "01a19f1e-d177-716d-b124-3d0d39dc9a3f",
                  "kind": "feature",
                  "label": "F-15",
                  "name": "Look up an object",
                  "parent": "01a19f1a-685d-7357-b67e-d65f1c690202"
                },
                {
                  "change": null,
                  "key": "01a19f1e-d177-716d-b124-3d0ee7e600ab",
                  "kind": "requirement",
                  "label": "RQ-52",
                  "name": "When a client requests an object by its object id, Univ Server shall return the object with its catalogue entries, measurements, preferred measurement and derived positions.",
                  "parent": "01a19f1e-d177-716d-b124-3d0d39dc9a3f"
                },
                {
                  "change": "added",
                  "key": "01a1b7d8-3f35-70aa-853f-45a936e8825f",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each designation in the response gives the identifier as its source publishes it, and in its catalogue's form where the source's definition gives one.",
                  "parent": "01a19f1e-d177-716d-b124-3d0ee7e600ab"
                },
                {
                  "change": "added",
                  "key": "01a1b7d8-3f35-70aa-853f-45aa7e2ca87a",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response lists the object's designations in the order the release gives them, the preferred designation first.",
                  "parent": "01a19f1e-d177-716d-b124-3d0ee7e600ab"
                },
                {
                  "change": "added",
                  "key": "01a1b7d8-3f35-70aa-853f-45aba93bf7fc",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response gives each flag of each catalogue entry with its value as the source publishes it.",
                  "parent": "01a19f1e-d177-716d-b124-3d0ee7e600ab"
                },
                {
                  "change": null,
                  "key": "01a19f1e-d177-716d-b124-3d16ab310032",
                  "kind": "requirement",
                  "label": "RQ-53",
                  "name": "When a client requests an object by a catalogue designation or a common name, Univ Server shall return the object that the designation or name resolves to.",
                  "parent": "01a19f1e-d177-716d-b124-3d0d39dc9a3f"
                },
                {
                  "change": "added",
                  "key": "01a1b7d8-3f35-70aa-853f-45aceeef58a0",
                  "kind": "criterion",
                  "label": null,
                  "name": "A designation in its catalogue's form, such as HIP 32754, resolves as a name does.",
                  "parent": "01a19f1e-d177-716d-b124-3d16ab310032"
                },
                {
                  "change": null,
                  "key": "01a19f1e-d177-716d-b124-3d23daf70123",
                  "kind": "feature",
                  "label": "F-16",
                  "name": "Read a source",
                  "parent": "01a19f1a-685d-7357-b67e-d65f1c690202"
                },
                {
                  "change": null,
                  "key": "01a19f1e-d177-716d-b124-3d24f2c252fc",
                  "kind": "requirement",
                  "label": "RQ-56",
                  "name": "When a client requests a source, Univ Server shall return its citation, terms of use, required credit, provider, query, cuts and coverage.",
                  "parent": "01a19f1e-d177-716d-b124-3d23daf70123"
                },
                {
                  "change": "added",
                  "key": "01a1b7dc-04ef-7334-abc7-37ec41787dde",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response says whether the source's terms require data adapted from it to be shared under the same licence.",
                  "parent": "01a19f1e-d177-716d-b124-3d24f2c252fc"
                },
                {
                  "change": "added",
                  "key": "01a1b7d8-3f35-70aa-853f-45ad166959ce",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response gives the source's designation form with its citation, where its definition gives one.",
                  "parent": "01a19f1e-d177-716d-b124-3d24f2c252fc"
                },
                {
                  "change": "added",
                  "key": "01a1b7d8-3f35-70aa-853f-45ae96a7f9df",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response gives the meaning of each value of each of the source's flags with its citation, where its definition gives them.",
                  "parent": "01a19f1e-d177-716d-b124-3d24f2c252fc"
                },
                {
                  "change": null,
                  "key": "01a1a497-e843-728a-bce8-3ffb8e7533cb",
                  "kind": "product",
                  "label": "P-3",
                  "name": "Univ Explorer",
                  "parent": null
                },
                {
                  "change": null,
                  "key": "01a1a497-e843-728a-bce8-3ffc32e7ed9d",
                  "kind": "feature_group",
                  "label": "FG-12",
                  "name": "The view",
                  "parent": "01a1a497-e843-728a-bce8-3ffb8e7533cb"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b101c9b9b10c",
                  "kind": "feature",
                  "label": null,
                  "name": "Frame the view as an atlas",
                  "parent": "01a1a497-e843-728a-bce8-3ffc32e7ed9d"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b10246def191",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Explorer shall mark the edges of the view with the directions of sight through them, in the axes the view is drawn in.",
                  "parent": "01a1b7d7-c032-73ad-803e-b101c9b9b10c"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b103f2a0c853",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each edge of the view carries a tick where the direction of sight through it crosses a round longitude or latitude of the chosen axes.",
                  "parent": "01a1b7d7-c032-73ad-803e-b10246def191"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b10435170cb6",
                  "kind": "criterion",
                  "label": null,
                  "name": "The ticks of an edge are spaced at the finest step of 90, 30, 15, 10, 5, 2 or 1 degrees, or a tenth or hundredth of one, that keeps their labels at least 60 CSS pixels apart.",
                  "parent": "01a1b7d7-c032-73ad-803e-b10246def191"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b105558be2c4",
                  "kind": "criterion",
                  "label": null,
                  "name": "A tick of equatorial right ascension is labelled in hours and minutes, and every other tick in degrees.",
                  "parent": "01a1b7d7-c032-73ad-803e-b10246def191"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b106cab43cde",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each edge names the coordinate its ticks give, such as galactic longitude.",
                  "parent": "01a1b7d7-c032-73ad-803e-b10246def191"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b107f30dda23",
                  "kind": "criterion",
                  "label": null,
                  "name": "The ticks follow the view as it turns, zooms and moves, and as the axes are changed.",
                  "parent": "01a1b7d7-c032-73ad-803e-b10246def191"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b108ccec8a0c",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Explorer shall keep its panels in the margins about the view, never over it.",
                  "parent": "01a1b7d7-c032-73ad-803e-b101c9b9b10c"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b1098469cdfc",
                  "kind": "criterion",
                  "label": null,
                  "name": "The left margin holds the view's controls, the groups of what is drawn and the list of structures.",
                  "parent": "01a1b7d7-c032-73ad-803e-b108ccec8a0c"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b10a29501e13",
                  "kind": "criterion",
                  "label": null,
                  "name": "The right margin holds the search and the record of the chosen object or structure.",
                  "parent": "01a1b7d7-c032-73ad-803e-b108ccec8a0c"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b10be4240ee2",
                  "kind": "criterion",
                  "label": null,
                  "name": "The bottom margin holds the key, the scale and the credits.",
                  "parent": "01a1b7d7-c032-73ad-803e-b108ccec8a0c"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b10c2a3715b9",
                  "kind": "criterion",
                  "label": null,
                  "name": "No panel covers the view on a window at least 1,024 CSS pixels wide.",
                  "parent": "01a1b7d7-c032-73ad-803e-b108ccec8a0c"
                },
