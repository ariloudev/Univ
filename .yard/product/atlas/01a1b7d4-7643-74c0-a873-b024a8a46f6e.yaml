  - key: 01a1b7dc-72f3-70ae-b7ed-519f250c3753
    id: spec-approval
    kind: approval
    versions:
      - key: 01a1b7dc-72f3-70ae-b7ed-51a5d82dc08e
        at: 2026-11-07T21:14:00Z
        revision: 2
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Approve the spec change for the atlas, the object record, designations and names"
        markdown: |-
          **Explorer**
          - New Feature *Frame the view as an atlas*:
            - live coordinate ticks on the view's edges, RA in hours;
            - panels in the left, right and bottom margins, never over the view at 1,024 px and wider, folding into buttons below that;
            - a scale bar of round lengths;
            - structures named in italic type, objects in upright type.
          - *Read an object*:
            - The heading is the name it was found by, then a proper name, then the first designation in its catalogue's form.
            - A designation given by more than one source is listed once.
            - The panel adds sky position (RA/Dec and l/b), magnitudes, motion and redshift, groups and members, the structures that hold the object, and flags with their meanings.
            - Every value carries its kind-of-value mark.
            - The hover label shows the name after a 0.3 s rest.

          **Ingest**
          - Source definitions may give a cited designation form (`HIP {identifier}`) and the cited meanings of flag values. A form without exactly one `{identifier}` is refused.
          - Share-alike terms are marked, with the clause quoted.
          - An object's designations are ordered by rank in the designation rules, and each formatted designation is also a name the object is found by.
          - Name sources:
            - IAU names join by HIP; galaxy names join by PGC or 2MASX, else by position.
            - Proper names are kept apart from designations.
            - Duplicate and nonexistent rows are left out with their reasons.
            - A name that joins nothing becomes a sky-position-only object.

          **Server**
          - The record gives each designation both raw and formatted, in rank order, with each entry's flags.
          - "HIP 32754" resolves as a name does.
          - A source's record gives its designation form, its flag meanings and whether it is share-alike.

          Look at AC-392 and AC-394, the two reworded published criteria, and at the sky-position-only objects, which the questions below decide.
