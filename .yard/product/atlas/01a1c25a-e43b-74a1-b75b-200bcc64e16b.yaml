        title: "W9 merged"
        markdown: |-
          stage/atlas-w9 was merged at c202e63. The owner confirmed that the wave-end checks had already run. Its Yard Log has the details.

          - **The record panels:** an object panel and a structure panel built on one base panel, much shorter than before. The 13 mockups the owner approved, built from real release-12 records, are now test fixtures.
          - **Only what lies inside:** the checkbox moves from the panel to the top bar.
          - **The Show drawer:** one table of catalogues, with a column per domain (option B).
          - **The Outlines switch:** hides the structures' outlines but keeps their names, and a structure can still be chosen by its name.

          product/atlas now merges into develop, and the spec is published there.
        tone: success
