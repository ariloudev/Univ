          stage/atlas-w5 merged at c223420 after its review fixes, the full gate and integration. Release 12 is published locally (not deployed): every name lookup resolves, lookup p95 3.6 ms, first points p95 373 ms. Science: 30 PASS, 3 FAIL (two cross-match regressions from OpenNGC, and the fingerprint check's gap on change releases), 3 CONCERN.

          The owner chose a follow-up wave for release 13: the cross-match rule, the fingerprint check, and names not given twice by ingest. product/atlas is not merged into develop or main, and nothing is pushed, published or deployed.
