        title: "Build and publish release 12 locally"
        markdown: |-
          W1 to W4 are merged into product/atlas. Release 12 is the first to hold the designation forms, flag meanings, ranks and the two name sources. Release 11 has none of these: the explorer heads HIP 32754 by its Bailer-Jones id, and "Sirius" or "M31" don't resolve.

          **Checked already, offline, normalizing the two new sources only:**
          - OpenNGC: 13,371 entries, 662 left out (652 Dup, 10 NonEx).
          - IAU star names: 637 entries, 14 left out with no position.

          **The run, all local, with no request to any provider:**
          1. Back up the local D1 and R2 (`.cache/univ-ingest/wrangler`, 32 GB; 1 TB is free) and the id state.
          2. `univ-ingest build --offline`: release 12, built as a change on 11 from the cache.
          3. `cargo xtask science` on it.
          4. `univ-ingest publish` to the local D1 and R2. The store moves to schema 7 on this publish, adding one table, with no migration.
          5. Check that "Sirius", "M31", "Andromeda Galaxy", "NGC 4472" and "HIP 32754" resolve. Read the panel in the explorer and take the screenshots you asked for. Run `bench lookup` (QA-2) and `bench first-points`, and record D1 and R2 growth.

          Nothing is pushed, merged into develop or main, published with loft, or deployed.
