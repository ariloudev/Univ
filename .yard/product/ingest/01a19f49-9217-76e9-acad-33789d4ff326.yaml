        title: "W5 merged"
        markdown: |-
          `stage/ingest-w5` was merged as `4f45811`. It adds `univ-ingest match`, which runs fetch, normalize and cross-match:
          - **Matching:** published cross-ids come first, then complete-linkage matching under cited tolerances.
          - **Ranking:** 300 km/s peculiar velocity and the Gaia zero-point.
          - **Ids:** stable ids in a YAML ledger, written to `pending/`.
          - **Positions:** under Planck 2018, each with its chain recorded. D(z) matches astropy and FK4 matches ERFA.

          AC-28 to AC-35 and AC-60 to AC-81 are traced, 96 of 293 nodes in all. Galaxy groups (Cosmicflows-4) are kept apart from galaxies.

          One decision is held for you in W8, with real counts: measurements published without an error rank last.
        tone: success
