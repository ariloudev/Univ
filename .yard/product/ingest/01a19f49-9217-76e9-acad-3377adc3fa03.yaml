        title: "W4 merged"
        markdown: |-
          `stage/ingest-w4` was merged as `8c3bfed`.

          - **Normalization:** 14 tabular sources become typed catalogue entries, with refusals and fixes counted.
          - **Structures:** 26 files, every number checked against its paper.
          - **Grids:** CF4++, CF4 basins and 2M++, with the axis order checked at Laniakea.
          - **Outlines:** a grid outline is admitted only when every covering catalogue agrees.
          - **Gate:** AC-36 to AC-59 traced; 225 tests pass.

          **Findings from the real data:**
          - CF4++ shows no void at the Local Void's published position, so it is published as a point.
          - The structure files correct three newsroom errors.
          - 228 Cosmicflows-4 groups are direct calibrations.
        tone: success
