        markdown: |-
          Nine waves, each on its own `stage/ingest-wN` branch cut from `product/ingest`, and each merged back only with your approval. Each wave's tasks are registered in that wave's own Yard Log when it starts.

          | Wave | Covers |
          |---|---|
          | W0 Workspace + gate | Univ Ingest constraint, CON-4 |
          | W1 univ-model | CON-4–CON-8, the maths of F-3 |
          | W2 Acquisition | F-1, F-2 |
          | W3 Run display | F-13 |
          | W4 Normalization | F-4, F-5 |
          | W5 Identity + positions | F-7, F-6, F-8, F-3 |
          | W6 Octree tiles | F-10, QA-1 |
          | W7 Releases | F-9, F-12, F-11, CON-3 |
          | W8 First real release | everything, against real data |
