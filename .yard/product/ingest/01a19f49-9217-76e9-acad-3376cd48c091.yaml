        title: "W3 merged"
        markdown: "`stage/ingest-w3` was merged as `549ee75`. It adds `univ-ingest fetch`, which fetches chunks 3 at a time. On a terminal the run shows apt-style lines under a status line drawn every 100 ms; elsewhere it prints plain timestamped lines. The summary names every source as fetched, failed or not reached, and Ctrl-C keeps everything and exits 130. AC-107 to AC-120 are traced; AC-121 waits for W7. 109 tests pass."
        tone: success
