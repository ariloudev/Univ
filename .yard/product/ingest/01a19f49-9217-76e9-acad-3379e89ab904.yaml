        title: "W6 merged"
        markdown: |-
          `stage/ingest-w6` was merged as `ff49baa`. It adds `univ-ingest tiles`:
          - **Codec:** a versioned 17-byte point codec in univ-model, quantized to 1/65,536 of the node's edge.
          - **Octree:** one octree per scale domain, with one sampling fraction per level so density follows the sky.
          - **Manifests:** JSON, with source roles, rotations and per-node SHA-256s.
          - **Determinism:** two builds are byte-identical.
          - **QA-1:** proved by construction.

          AC-91 to AC-98 and QA-1 are traced: 105 of 293 nodes.
        tone: success
