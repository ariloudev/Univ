        title: "W7 merged"
        markdown: |-
          `stage/ingest-w7` was merged as `a8aa7b3`. It adds three commands:
          - `univ-ingest build`: checks the release and builds it atomically under a state lock. A failed build uses no number.
          - `univ-ingest publish`: uploads to local D1 and R2 with wrangler 4.156.2, checking SHA-256 and D1 fingerprints. It resumes from a journal and moves `latest` in one write.
          - `univ-ingest prune`: deletes a release while keeping its listing and the id ledger.

          Also: D1 schema v1, a cell index, and CON-3 checked with overflow pages counted. AC-82 to AC-106 and AC-121 are traced: 122 of 293 nodes.
        tone: success
