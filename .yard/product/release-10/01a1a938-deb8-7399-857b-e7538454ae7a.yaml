        title: "W2 merged"
        markdown: |-
          Merged as `9304264`.

          - **Gate:** 13 gates passed; trace accepted.
          - **In `sources/`:** DESI DR1, SDSS DR17 distant galaxies and quasars, 2dFGRS (221,414 galaxies), ALFALFA α.100 (code 1, errors e_W50 / 2).
          - **Waiting, not in W2:** GAMA DR4 and WISE × SuperCOSMOS are ready in the scratchpad and wait for the permission send date. 2MPZ waits for its sequential download (about a third done). Each goes in by the start of W5.
          - **Reviews:** `/code-review` found eight real defects, all fixed before any data was fetched. Among them: DESI chunks that would have missed negative ids, 2dFGRS quasars given a galaxy error, ALFALFA velocities without their published error, and every pair searched at 60″.
        tone: success
