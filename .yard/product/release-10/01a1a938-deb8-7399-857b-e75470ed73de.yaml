        title: "W3 merged"
        markdown: |-
          Merged as `db6d46e`.

          - **Gate:** 13 gates passed. The Wrangler tests, which are ignored by default, pass against real local D1 and R2. Trace accepted: 465 of 468 criteria linked.
          - **Release format:** schema 5. A release is a catalogue database (`DB`) plus up to 8 object shards (`OBJECTS_0` to `OBJECTS_7`). Shards are packed by level-0 cells in Morton order up to 4.5 GB each. The manifest is now version 2, and an older manifest is refused at publish.
          - **Reviews:** `/code-review` found these before any real data was built:
            - science checks that would fail on every sharded release;
            - Morton codes beyond exact doubles;
            - prune failing on today's schema-4 catalogue;
            - repeated ids escaping the key check.
          - **Open for W4:** Univ Server still reads objects only from `DB`. Until W4 is done, a newly published release serves no objects.
        tone: success
