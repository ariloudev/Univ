        title: "W4 merged"
        markdown: |-
          Merged as `edf31aa`.

          - **Gate:** 13 gates and `cargo xtask integration` pass (the e2e tests on the sharded fixture state, and the explorer's 9 Playwright tests). Trace accepted: 466 of 468 criteria linked.
          - **Reads:**
            - **By id:** through the catalogue's index, then one batch on the object's shard.
            - **By designation:** across every shard of the release at once.
            - **Volume pages:** only from the shards the box's own Morton ranges meet, merged by id, so pages don't depend on which shards hold the objects.
          - **Reviews:** `/code-review` caught a box-to-shard filter that read nearly every shard for any box across 0 (spheres about the Sun among them), and a Worker that hid a short D1 batch answer. Both are fixed and tested.
          - **For W5:** releases 6 to 9 read as empty under this server until they are pruned and release 10 is published.
        tone: success
