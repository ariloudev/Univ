        title: "Release 10 finished, and what followed it"
        markdown: |-
          W5 merged with its own Yard Log closed: release 10, 35,958,421 cosmic-web points, is published locally and is the explorer's latest.

          After W5, these branches merged into `product/release-10`, each with its Yard Log closed:

          | Branch | What it added |
          |---|---|
          | `stage/release-10-budget`, `-lod`, `-memory`, `-r1` | the point budget, level of detail and memory work on the explorer |
          | `fix/rendering` | one colour for non-star points, the level-of-detail switch, seamless per-point level of detail with tile fades |
          | `feature/cull-to-structure` | the cull to a structure's volume, brighter points inside it, structure kinds in their own colours, the chosen outline thicker, and the fix of extents turned twice |

          Each ended with `/simplify` and `/code-review`, the full gate and integration. The owner asked to merge `product/release-10` into `develop` and publish the specification on 2026-11-06.
        tone: success
