        title: "The routine carried over from Univ Ingest, with one change"
        markdown: |-
          The routine settled on `product/ingest` (decisions 1–5 of its Yard Log) and the owner's standing rules apply to Univ Server. One change came with this request.

          | Rule | How it applies to Univ Server |
          |---|---|
          | Waves | `stage/server-wN`, cut from `product/server`, each with its own Yard Log |
          | Wave close | `/simplify` and `/code-review` in parallel, findings fixed as tasks in the wave |
          | **Full gate (new)** | `cargo xtask check` runs **only at the end of each stage or wave**; between tasks, focused checks on what changed (`cargo test -p`, `cargo clippy -p … -D warnings`, `cargo fmt --check`, `loft check` after spec edits) |
          | Committing on the gate | commit on the gate's own exit status, never via `\| tail` |
          | Merges | none into `product/server`, `develop` or `main` until the owner asks |
          | Spec first | `spec/` changes are approved before code; tests traced in `loft.trace.yaml` |
          | Code rules | clippy pedantic + guards, 500 lines per `.rs` file, `cargo fmt --check`, no network in tests |
          | Data | internal data YAML; JSON only where the spec fixes it (API, tile manifests) |
          | Long fetches | in the background, monitored |
        tone: info
