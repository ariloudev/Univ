        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Layers and keys get a D1 database of their own"
        consequence: "The Worker binds two D1 databases: `univ` (releases, read-only to the Worker) and `univ-layers` (keys, layers, items, versions, changes), whose schema and migrations the server crate owns. Link checks and volume queries read both and merge in code; ingest and CON-3 are untouched."
        question: 01a1a2b4-fef6-72a3-9bf5-d1a451ac85bc
  - key: 01a1a2b7-8723-76d9-a30e-20d70b6fff4f
    id: d-e2e
    kind: decision
    number: 3
    versions:
      - key: 01a1a2b7-8723-76d9-a30e-20da66b9a4cf
        at: 2026-11-03T18:41:39Z
        revision: 5
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "End-to-end tests run as `cargo xtask integration`, once at each stage's or wave's end"
        consequence: "The suite that drives `wrangler dev` over a fixture release is its own xtask command, not a step of `cargo xtask check`. Each stage or wave ends with both the gate and the integration run green; between tasks only focused native checks run."
        question: 01a1a2b4-fef6-72a3-9bf5-d1a5644e6940
