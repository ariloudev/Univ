        markdown: |-
          **Changed:**

          - **RQ-99:** the owner changes a key's quotas or **rate-limit tier**.
          - **RQ-100:** a key is issued with its label, quotas and **rate-limit tier**.
          - **RQ-102:** the key listing gives each key's **rate-limit tier**.
          - **AC-262:** a keyed request is limited at the rate of its key's tier, where it used to be 1,200 per 60 s.
          - **F-28 body:** why the rate is a tier rather than any number.

          **Added:**

          - **Criterion on RQ-98:** the tiers are `basic` 300, `standard` 1,200 and `extended` 6,000 requests per 60 s.
          - **Criterion on RQ-99:** a key moved to another tier is limited at that tier's rate from its next request.
          - **Criterion on RQ-100:** a key issued without a tier gets `standard`.
          - **Term:** *rate-limit tier*.
          - **Decision:** *Set a key's rate limit by tier*, which compares tiers, fixed limits and counting in storage. Its subjects are F-28, F-29 and the rate-limiting binding.

          **Please check:**

          - the three tier names and rates;
          - that `standard` is the default.

          Once you approve, I commit `spec/` alone as `spec: give each key a rate-limit tier`, then write the master plan.
