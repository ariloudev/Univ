blocks:
  - key: 01a1a2b4-fef6-72a3-9bf5-d1a217e55780
    id: plan-context
    kind: note
    versions:
      - key: 01a1a2b4-fef6-72a3-9bf5-d1a65ce2e4fb
        at: 2026-11-03T18:38:53Z
        revision: 3
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "What the Worker starts from"
        markdown: |-
          **Scope:** Univ Server is F-14 to F-33, with RQ-49 to RQ-112, AC-122 to AC-292 (171 criteria), QA-2 and QA-3 (latency, `sampled`) and CON-2 (Rust on Workers with workers-rs).

          **Already in place from ingest:**

          - `univ-model` already builds for wasm32.
          - The D1 schema (v2), with the cell index (`object_cells`, `structure_cells`), the id ledger (`ids_issued`, `ids_replaced`), `releases` and `latest`.
          - The R2 key layout (`releases/{n}/tiles/…`, `grids/…`).
          - The tile encoder and the Rust decoder.

          **Real data:** release 6 is `latest` in the local state at `.cache/univ-ingest/wrangler`, with 2,098,918 objects, 26 structures, 3 grids and 401 tiles. Releases 1–4 are pruned, so their 410 answers can be tested on real data. The SQLite file is 6.5 GB on disk.

          **One spec/platform conflict:** the rate-limiting binding fixes its limit in `wrangler.toml`, one per namespace, with a period of 10 or 60 s. RQ-99 says the owner can change a **key's rate limit** at runtime. The binding cannot do that as written.
        tone: info
  - key: 01a1a2b4-fef6-72a3-9bf5-d1a39ecf00a9
    id: q-rate-limit
    kind: question
    versions:
      - key: 01a1a2b4-fef6-72a3-9bf5-d1a71b82fd52
        at: 2026-11-03T18:38:53Z
        revision: 3
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        prompt: "The rate-limiting binding fixes each limit in wrangler.toml, but RQ-99 lets the owner change one key's rate limit at runtime. How should a per-key rate limit work?"
        header: "Rate limit"
        context: "The defaults stay as the spec has them: 300 requests per 60 s for anonymous clients, per address, and 1,200 per 60 s per key. The binding answers only allowed or refused, so `Retry-After` will be the 60 s window. Options 1 and 3 change RQ-99 in `spec/`, and the change comes to you for approval before any code."
        options:
          - label: "Tiers"
            detail: "A few binding namespaces, such as 300, 1,200 and 6,000 per 60 s. The owner moves a key between tiers, and the move applies from the key's next request. This keeps the binding that CMP-5 names and adds no write to any request. RQ-99 changes from \"a rate limit\" to \"a rate-limit tier\". I recommend this: it meets the need behind RQ-99 at no runtime cost."
            recommended: true
          - label: "Fixed limits"
            detail: "The two limits come from the config only, and the owner changes quotas but not rate limits. This is the simplest option, but it removes part of RQ-99 and AC-264's premise for rate limits."
          - label: "Count in storage"
            detail: "Count each key's requests per window in D1 or a Durable Object, so any value works exactly as RQ-99 says, with no spec change. The cost is a write on every keyed request (D1), or a Durable Object, which ADR-7 avoided for simplicity. The binding would then serve only anonymous clients."
    responses:
      - key: 01a1a2b7-49d6-718a-ae01-16f48a87e5fc
        at: 2026-11-03T18:41:23Z
        revision: 4
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "Tiers"
  - key: 01a1a2b4-fef6-72a3-9bf5-d1a451ac85bc
    id: q-d1-layout
    kind: question
    versions:
      - key: 01a1a2b4-fef6-72a3-9bf5-d1a87f9f35d6
        at: 2026-11-03T18:38:53Z
        revision: 3
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        prompt: "Where should layers, items and API keys live in D1: beside the releases in the `univ` database, or in a database of their own?"
        header: "Layer DB"
        context: "The `univ` database holds immutable releases. Ingest's publish and prune write it, and CON-3 caps it at 10 GB. Layers and keys are the only data clients change."
        options:
          - label: "Separate database"
            detail: "A second D1 binding, `univ-layers`, for keys, layers, items, versions and changes. Ingest never touches it, CON-3 counts releases alone, and a release database can be rebuilt without risk to client data. Link checks and volume queries read both databases and merge the results in code. I recommend this."
            recommended: true
          - label: "Same database"
            detail: "Layer and key tables are added to the `univ` schema (v3). Link checks can join against `ids_issued` in SQL. But client data shares a file and the CON-3 budget with the releases, and ingest's schema owns tables it never writes."
    responses:
      - key: 01a1a2b7-49d6-718a-ae01-16f5e437afe4
        at: 2026-11-03T18:41:23Z
        revision: 4
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "Separate database"
  - key: 01a1a2b4-fef6-72a3-9bf5-d1a5644e6940
    id: q-e2e
    kind: question
    versions:
      - key: 01a1a2b4-fef6-72a3-9bf5-d1a91792c2eb
        at: 2026-11-03T18:38:53Z
        revision: 3
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        prompt: "How should the Worker be tested, given that workers-rs code only runs as wasm inside workerd?"
        header: "Worker tests"
        context: "Either way, the handlers live in a plain Rust crate behind storage traits. Most criteria are then tested natively and fast, against SQLite with the real schema, while a thin `univ-server` crate binds D1, R2 and the rate limiter. The question is how the real Worker gets tested. Since the full gate now runs only at the end of each wave, a slower step costs little."
        options:
          - label: "E2E in the gate"
            detail: "An end-to-end suite starts `wrangler dev` on a small fixture release that ingest builds from its recorded fixtures, then calls the real routes over HTTP. It runs in `cargo xtask check`, adding about 30–60 s at each wave's end. This is the only test of the real bindings, CORS, streaming and the rate limiter. I recommend this."
            recommended: true
          - label: "E2E by hand"
            detail: "The same suite, but `#[ignore]`, run by hand at each wave's end like the live fetches. The gate stays fast, but a broken binding could pass the gate."
          - label: "Native only"
            detail: "Native tests only, with nothing run inside `wrangler dev`. Criteria about the runtime would then have no test: CORS preflight, streaming from R2 without decoding, and 429 from the binding."
    responses:
      - key: 01a1a2b7-49d6-718a-ae01-16f659ec4344
        at: 2026-11-03T18:41:23Z
        revision: 4
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        words: "cargo xtask integration, default rule is to run once per stage/wave at the end"
