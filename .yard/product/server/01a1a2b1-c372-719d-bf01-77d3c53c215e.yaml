        title: "A key's rate limit is a tier the owner picks"
        consequence: "Each key tier is one rate-limit binding namespace in the Worker's config, with anonymous clients on their own namespace per address. RQ-99 and the key features change in `spec/` to name tiers; that change comes for approval before the master plan."
