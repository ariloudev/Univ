        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "End-to-end tests run as `cargo xtask integration`, once at each stage's or wave's end"
        consequence: "The suite that drives `wrangler dev` over a fixture release is its own xtask command, not a step of `cargo xtask check`. Each stage or wave ends with both the gate and the integration run green; between tasks only focused native checks run."
