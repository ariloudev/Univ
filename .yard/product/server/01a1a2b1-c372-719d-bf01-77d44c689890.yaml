        title: "Standing rules from the owner, after W0"
        markdown: |-
          - **Merges:** a complete wave merges into `product/server` straight away, with no stacking. The next wave is cut from `product/server`. Merging `product/server` into `develop` still waits for the owner.
          - **Pace:** work through the plan methodically, and pause only when the owner's feedback is needed.
          - **Spec changes:** minor ones are pre-approved and recorded as `spec-change` blocks; major ones still go for approval.
        tone: info
