        title: "Approve the relational-schema spec change"
        markdown: |-
          ## What changes

          | Node | Says |
          |---|---|
          | **Decision** *Keep JSON out of the tables that grow with a release's objects* | Relational rows chosen over columns-for-what-is-queried and indexes on JSON expressions. Consequences: schema 7, a full release 16, and the three guards. |
          | **univ-model Constraint** | No JSON column in a table whose rows grow with the objects: objects, entries, measurements, designations, names, memberships, object cells and shards. *(schema gate)* |
          | **univ-model Constraint** | The release schema names each table's scale: per release, source, structure, chain, object or entry. *(what the schema gate reads)* |
          | **univ-model Constraint** | No SQL of Univ Server, Univ Ingest or the project's checks applies a JSON function to anything but a bound parameter, or a column of a table bounded by sources, structures and chains. *(SQL gate)* |
          | **Release publisher Constraint** | A science check reads those tables through an index, and fails where its query plan scans one whole. *(scan guard)* |
          | **Cross-match Requirement** | An object that its source's own column assigns to a researched structure is recorded as its member: a Reid 2019 maser whose `Arm` code names one of the seven model arms is a member of that arm, citing the column; a spur's maser is a member of none. |

          ## Unchanged on purpose

          - **API responses** keep every field: *The response gives each flag of each catalogue entry with its value as the source publishes it* still holds; Univ Server assembles flags, references, links and relations from the new rows.
          - **JSON in small tables** stays: sources' sky and radial summaries, structures' records and shapes, chains' steps. They are bounded by the number of sources and structures, a few thousand rows at most.

          ## Worth a look

          - **The SQL gate's exception** for small tables: the arm checks read the 14 arm paths from `structure_details.shape`. I'd keep that allowed rather than add a points table for 14 rows.
          - **Memberships** are the one new relation the explorer and API could later show (*a maser on the Perseus arm*); this change adds the rows, not a response field.

          Once you approve, I commit `spec/` alone and present the build plan in plan mode.
