  - key: 01a1cc9c-febd-71e7-8f23-d300571fc0d3
    id: survey
    kind: note
    versions:
      - key: 01a1cc9c-febd-71e7-8f23-d308af2cbfaa
        at: 2026-11-11T21:56:43Z
        revision: 1
        by:
          host: claude-code
          session: "733ab034-0172-4107-897d-a9a3752e1525"
        title: "Where JSON sits at scale (release 15, object shard 0)"
        markdown: |-
          | Table | Rows | JSON columns | Filled |
          |---|---|---|---|
          | entries | 4.87 M | `flags`, `extra` | 2.44 M, 2.41 M |
          | measurements | 19.3 M | `extra` | 0 here |
          | objects | 2.43 M | `links`, `relations` | 22, 0 |

          Every other JSON column is in a table of at most a few thousand rows. The API's `json_each(?N)` reads bound parameter lists only. Science checks read `entries.flags` (`Arm`, `Ref`, `BEST_Z_TYPE`), `entries.extra` (references) and `structure_details.shape` (arm points).
  - key: 01a1cc9c-febd-71e7-8f23-d301873acff8
    id: q-scope
    kind: question
    versions:
      - key: 01a1cc9c-febd-71e7-8f23-d30938f422a8
        at: 2026-11-11T21:56:43Z
        revision: 1
        by:
          host: claude-code
          session: "733ab034-0172-4107-897d-a9a3752e1525"
        prompt: "How far should the schema fix go?"
        header: "Scope"
        context: "`flags` and `extra` fill about half of all entries. Science checks read three flags and the references."
        options:
          - label: "No JSON per object"
            detail: "Every per-object and per-entry table loses its JSON columns: flags become an indexed entry_flags table, extra becomes typed columns plus entry_references, links and relations become object_links, and the masers' arms become arm memberships. JSON is left only in tables bounded by sources and structures. Recommended: the rule then holds by construction, with nothing to judge case by case."
            recommended: true
          - label: "Only what is queried"
            detail: "Move only the queried values (the Arm, Ref and BEST_Z_TYPE flags, and references) into columns, and keep the rest as JSON the API passes through. Smaller, but the opaque JSON stays in 50 M-row tables and the next query into it is one edit away."
    responses:
      - key: 01a1cc9f-153d-7792-ba7f-03bd1cbed8a1
        at: 2026-11-11T21:59:00Z
        revision: 2
        by:
          name: "ariloudev"
          email: "contact@askloft.ai"
        channel: terminal
        chosen:
          - "No JSON per object"
  - key: 01a1cc9c-febd-71e7-8f23-d302fe542b80
    id: q-guards
    kind: question
    versions:
      - key: 01a1cc9c-febd-71e7-8f23-d30a90a5c254
        at: 2026-11-11T21:56:43Z
        revision: 1
        by:
          host: claude-code
          session: "733ab034-0172-4107-897d-a9a3752e1525"
        prompt: "Which guards should the gate run?"
        header: "Guards"
        context: "Each one is recorded as a rule in the specification and in the project's instructions."
        options:
          - label: "Schema gate"
            detail: "Each table of the release schema declares its scale (per object, per entry, per source, per structure); the gate refuses a JSON column in a per-object or per-entry table."
            recommended: true
          - label: "SQL gate"
            detail: "The gate scans the SQL in crates, xtask and rules and refuses json_extract, json_each, json_tree, -> and ->> on anything but a bound parameter, except in a short, listed set of small tables."
            recommended: true
          - label: "Scan guard"
            detail: "The science runner reads each check's EXPLAIN QUERY PLAN and fails a check that scans a per-object or per-entry table whole; that also catches slow checks that use no JSON."
            recommended: true
        multiple: true
    responses:
      - key: 01a1cc9f-153d-7792-ba7f-03bee870c9e9
        at: 2026-11-11T21:59:00Z
        revision: 2
        by:
          name: "ariloudev"
          email: "contact@askloft.ai"
        channel: terminal
        chosen:
          - "Schema gate"
          - "SQL gate"
          - "Scan guard"
