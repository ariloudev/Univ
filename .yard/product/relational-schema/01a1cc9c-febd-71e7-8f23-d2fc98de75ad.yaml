        title: "Build plan: no JSON at scale (product/relational-schema)"
        markdown: |
          # Build plan: no JSON at scale (product/relational-schema)

          ## Context

          Release 15's maser science check read `json_extract(entries.flags, '$.Arm')` over 76 M entries and ran for more than 20 minutes. You asked for the schema to be fixed properly, and for rules and static checks that stop JSON being used on million-row tables. The spec change is approved and committed (`620f2f4`, `351b44e`):
          - **Decision:** *Keep JSON out of the tables that grow with a release's objects*.
          - **Four Constraints:**
            - no JSON column at scale (schema gate);
            - each table names its scale;
            - JSON functions apply only to bound parameters or to small tables (SQL gate);
            - a science check that scans an object- or entry-scale table whole fails (scan guard).
          - **One Requirement:** a Reid 2019 maser is a member of the arm its `Arm` code names.

          The release schema is at version 7, and this change moves it to **8**.

          What changes, from the survey:

          | JSON column today | Holds | Becomes |
          |---|---|---|
          | `entries.flags` (≈50% of entries) | `{column: raw value}` from `field: quality` columns | table `entry_flags(object_id, entry, flag, value)`, with an index on `(flag, value)` |
          | `entries.extra` (≈50%) | `via`, `position_uncertainty`, `spectral_type`, `references` | typed columns on `entries`, plus table `entry_references(object_id, entry, n, citation, doi, bibcode)` |
          | `measurements.extra` | `also_published`, `assumed_cosmology`, `published_frame`, `derived_from` | typed columns on `measurements` |
          | `objects.links` (rare) | `CandidateLink{entry, candidate, reason, confidence}` | table `object_links`, with `reason` flattened into columns (anchor / cross-identification / match fields) |
          | `objects.relations` (rare) | `Relation{kind, entry, other, scheme, identifier}` | table `object_relations` |
          | none; `Arm` sits in flags | the maser → arm assignment | table `memberships(object_id, structure, source, value)`, indexed by structure |

          All of these are object- or entry-scale tables. Like the other per-object tables, they go in the object shards (`shards.rs` `SHARD_TABLES`). JSON stays only in tables bounded by sources, structures and chains. The API's responses are unchanged: Univ Server assembles the same fields from the rows.

          Two waves, because the work spans the model, ingest, the API and xtask with more than 8 tasks. Each wave runs on a `stage/relational-schema-<n>` branch cut from `product/relational-schema`, has its own Yard Log, and ends with `/simplify` and `/code-review` in parallel, then `cargo xtask check` and `cargo xtask integration` once each, traces linked, and the Yard Log closed. Each wave merges only on your word. Migrating the real store and building release 16 also wait for your word.

          ## Wave 1: the schema (stage/relational-schema-1)

          **T1. Each table names its scale, and JSON columns are marked as such.**
          - In `crates/univ-model/src/release/sql.rs`:
            - add `Scale {Release, Source, Structure, Chain, Object, Entry}` and a `scale` field on `Table`, beside `scope`;
            - add a `ColumnKind::Json` variant, stored as TEXT.
          - Every entry of `TABLES` (`rows/mod.rs`) declares its scale. Each JSON column is marked `Json`: `chains.steps`, `structures.record` and `members`, `structure_details.*`, `source_details.sky` and `radial`, `source_terms.*`, `source_reading.flags`, `grids.shape`, `releases.cosmology`.
          - Readers, fingerprints and size estimates treat `Json` as TEXT.
          - `schema.sql` states each table's scale in its comment.
          - Test: every table has a scale, and the schema comment states it.
          - Meets the Constraint that each table names its scale.

          **T2. Schema 8: the new tables and typed columns, and the five JSON columns gone.**
          - `schema.sql` and the row types (`rows/objects.rs`) as in the table above. Flag names are terms. Each new table carries `release` and `retired` like every shared row.
          - `SCHEMA_VERSION = 8`; the new per-object tables go into `SHARD_TABLES`.
          - `every_row_type_matches_its_table_in_the_schema` (`release/tests.rs:50`) passes.
          - A univ-model test asserts that no `Json` column sits in an `Object` or `Entry` table; the gate's version of this comes in T7.

          **T3. Ingest writes the rows, and the masers' memberships.**
          - `release/entries.rs` and `release/objects.rs` write `entry_flags`, `entry_references`, the typed columns, `object_links` and `object_relations` in place of the JSON. They go through the `D1Writer::add_at` path, so size estimates, content hashes and fingerprints cover them unchanged.
          - A source definition may give `memberships`:
            - a column, its citation, and a map from the column's values to structure ids;
            - `define-a-source` refuses an unknown structure id, or a column the source doesn't take.
          - `sources/reid-2019-masers.yaml` maps the 11 arm codes the science check uses to the 7 fitted arms, citing Table 1's `Arm` column. A spur's code maps to nothing.
          - Tests:
            - flags, references, links and relations are written as rows;
            - a maser on a named arm is a member of it, and a spur's maser is a member of none;
            - an unknown structure id is refused.
          - **Measured before going on:** I'll take one release-15 object shard and project the new tables' size from its own rows, against the 4.5 GB per-shard budget. 2.4 M flagged entries may become several times as many `entry_flags` rows, each with an index entry. If the growth is large, I'll bring you the numbers before T5. The packer would otherwise make more shards.

          **T4. Reads assemble the same records.**
          - `univ-model/src/release/read/*`: `EntryRecord`'s flags, references, via, position uncertainty and spectral type, and the measurement extras and object links and relations, are read from the rows.
          - `crates/univ-api/src/objects/mod.rs:216-245` also reads the object's `entry_flags`, `entry_references`, `object_links` and `object_relations` from the same shard, by `object_id` through their keys.
          - `testkit_objects.sql` is converted: its JSON literals become rows of the new tables.
          - Done when the existing response tests pass unchanged (`univ-api/src/objects/record_tests.rs`, `univ-ingest/tests/object_reads.rs`, `read/tests.rs`). The OpenAPI document and the explorer don't change.

          **T5. `univ-ingest migrate` brings a store of schema 7 to 8, in place.**
          - In `publish/migrate.rs`, after the 5→6 step, with the same rusqlite access to each database:
            - create the new tables;
            - read each row with a non-null JSON column, parse it in Rust with univ-model's serde types (no SQL JSON functions), and write its rows with the parent row's `release` and `retired`;
            - fill the typed columns;
            - rebuild `entries`, `measurements` and `objects` without the JSON columns, with `create_as` and `INSERT … SELECT` as the 5→6 `rebuild` does;
            - write `schema_version` 8.
          - Memberships are not migrated; release 16 adds them.
          - Every step can run again: a database at 8 is left alone, and an interrupted run finishes on the next. `univ-ingest reindex` then rebuilds the row index, since the content hashes change with the columns.
          - Tests:
            - a schema-7 fixture store migrates;
            - the object records read the same before and after, for every fixture object;
            - running it twice is safe;
            - a store at 8 is untouched.

          **T6. Wave review**, as above.

          ## Wave 2: the guards and checks (stage/relational-schema-2)

          **T7. Schema gate and SQL gate: `cargo xtask json`, a new entry in `GATES` after `Lines`.**
          - It also runs as its own subcommand. Its model is `Gate::Lines` and `lines_pass` (`xtask/src/main.rs:251`).
          - **Schema gate:** refuses a `Json` column in a table of scale `Object` or `Entry` (from univ-model's `TABLES`).
          - **SQL gate:**
            - It scans `crates/**/*.rs`, `xtask/**/*.rs`, `rules/*.yaml` and `**/*.sql` for `json_extract`, `json_each`, `json_tree`, `json_type`, `json_array_length` and other `json_*` readers, and for `->`/`->>` in YAML and `.sql` files only (in Rust source they are the language's own syntax).
            - Each call's first argument must be one of:
              - a bound parameter (`?`, `?N`, `:name`);
              - the `value` of an enclosing `json_each`;
              - a column that the schema marks `Json` in a table of scale `Source`, `Structure`, `Chain` or `Release`.
            - Anything else is refused, with its file and line.
          - Today's API uses (`json_each(?N)` lists, `layers/write/store.rs` `json_each(?3)`) pass. The arm checks' `json_each(structure_details.shape)` passes, as you saw in the approval.
          - Tests on fixtures: each refused and allowed form.

          **T8. Scan guard in `xtask science`.**
          - Before each query check, the runner reads its `EXPLAIN QUERY PLAN` on the loaded database.
          - It fails the check, naming the table, wherever the plan has a `SCAN` of an `Object` or `Entry` table. An index walk over the whole table (`SCAN … USING INDEX`) counts as a scan too. Only `SEARCH` passes.
          - Tests: a check that scans `entries` fails, and one that searches by `(release, source)` passes.

          **T9. Every science check reads indexed rows.**
          - Rules on `entries.flags` and `extra` (`rules/science-checks.yaml` :104, :274, :347, :392, :414, :431, :452) read `entry_flags` and `entry_references`.
          - `masers-on-their-model-arms` reads `memberships`.
          - I'll run every check's plan against a schema-8 fixture and against release 15 migrated on a clone, which needs your word (below).
            - Each check the guard flags is rewritten, or given an index the schema keeps.
            - A whole-release census that can't be made a `SEARCH` comes to you with its plan, rather than being exempted.
          - Each check keeps its citation and its expectation.

          **T10. Rules recorded, and traces.**
          - **CLAUDE.md** gets a *Data and science rules* bullet: no JSON in object- or entry-scale tables, JSON functions only on bound parameters or small tables, checks must search rather than scan, and `cargo xtask json` and the scan guard enforce it.
          - **Memory:** a feedback note with the why (the 20-minute maser check).
          - **Traces:** the four Constraints and the membership criteria link to the T1–T9 tests in `loft.trace.yaml`.

          **T11. Wave review**, as above.

          ## The real store and release 16 (each on your word)

          1. **Migrate a clone.**
             - Make an APFS clone of `.cache/univ-ingest/wrangler`, then run `univ-ingest migrate --persist-to <clone>` and `reindex`, timed and in the background.
             - Check: the API on the clone answers a sample of objects the same as on the real state (records compared field by field), and `xtask science --store` runs every check under the scan guard.
             - Then swap the clone in, keeping the old state beside it.
          2. **Release 16.**
             - A build as a change on migrated release 15. It adds only the memberships, and rows whose JSON moved are unchanged after reindex.
             - Publish to a clone, run the science checks in full, then swap.

          ## Kept throughout

          - Each task is a Yard task, marked active and done as it runs, and each wave keeps a `build-issues` note.
          - Focused checks run between tasks: `cargo test -p <crate> <filter>`, clippy `-D warnings`, `cargo fmt --check`, and `loft check`.
          - Commits are `feat(model|ingest|api|xtask): …`, with `.yard/` committed alongside.

          ## Verification

          - **Wave 1:**
            - `cargo test -p univ-model -p univ-ingest -p univ-api`, with the API's record tests unchanged;
            - migration round-trip tests;
            - `cargo xtask check` and `cargo xtask integration`, whose Rust end-to-end tests read objects with flags, references and links through the Worker.
          - **Wave 2:**
            - `cargo xtask json` passes on the tree and fails on each fixture of a refused form;
            - the scan guard passes every check of `rules/science-checks.yaml` on a fixture store;
            - full gate and integration.
          - **Store and release 16:**
            - object records identical before and after migration on a sample;
            - every science check passes under the scan guard;
            - `masers-on-their-model-arms` and every check run in seconds, where the maser check took more than 20 minutes on release 15.
