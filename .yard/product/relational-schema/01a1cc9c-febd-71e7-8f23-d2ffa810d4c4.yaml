        title: "Build issues"
        markdown: |-
          | Issue | How found | Fix | State |
          |---|---|---|---|
          | `migrate` on a clone would reindex the real state, not the clone's | reading the command before the run | `--state` (8c5b378) | fixed |
          | The rebuild's join scanned the temporary table for each row: days on a real shard | the run sat 9 min on shard 1; `sample` and the plan (`SCAN t LEFT-JOIN`) | the temporary keys typed INTEGER; a test of both plans (eadaa52) | fixed |
          | `migrate`'s summary says "Migrated the store to shared rows" after a 7→8 move too | the run's last line | to fix with wave 2 | open |
          | `sqlite3` on the command line cannot open files under `.cache` here | the first integrity check | checked through Python's sqlite3 | worked around |
