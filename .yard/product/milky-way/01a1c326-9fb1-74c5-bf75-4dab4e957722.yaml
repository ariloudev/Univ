  - key: 01a1c326-9fb1-74c5-bf75-4dac364ab7d8
    id: pruning-and-additive-releases
    kind: note
    versions:
      - key: 01a1c326-9fb1-74c5-bf75-4daf56e3f5ff
        at: 2026-11-10T01:50:50Z
        revision: 13
        by:
          host: claude-code
          session: "918a7610-2359-46e7-a590-437534c76364"
        title: "Does pruning break additive releases?"
        markdown: |-
          **Short answer: no, by its design and its code.** Two paths are untested, though, and the real store needs a snapshot before the first prune.

          ### What I read
          `crates/univ-ingest/src/publish/prune.rs`, `publish/cap.rs`, `release/packing.rs`, `release/placing.rs`, `release/mod.rs` (how a change build starts), `tests/prune.rs` and `tests/shared_rows.rs`, and the local D1 catalogue's `releases`, `release_shards` and `shard_cells`.

          ### Why additive releases survive a prune
          | Concern | What the code does | Evidence |
          |---|---|---|
          | Rows shared with a kept release | Deletes only rows valid in *n* and in no kept release: valid in *n*, `release >` the last kept one before it, `retired ≤` the first kept one after it | `pruned_rows()`; test `pruning_a_release_between_two_kept_deletes_only_the_rows_it_alone_held` |
          | Files shared by SHA-256 | Deletes only R2 keys that no unpruned release maps, nor any publish journal part way through | `held_elsewhere()`, `journaled_elsewhere()`; test `a_file_a_release_part_way_through_publishing_holds_is_not_pruned` |
          | The next change build | Reads the state's row index of `latest` (`state/`), never an earlier release's build folder. Prune touches no state | `release/mod.rs` `row_index(state, …)`; `prune()` takes only the build output, journals and the store |
          | Ids | The id ledger is never pruned, so retired ids still resolve | test `pruning_deletes_the_files_and_rows_and_keeps_the_release_listed_and_its_ids_resolving` |
          | The 10 GB cap check | Counts rows valid in unpruned releases, not file size, so a prune frees room for the next publish | `publish/cap.rs` `others_bytes()` |
          | Pruning `latest` | Refused | test `the_release_latest_points_to_is_not_pruned` |

          ### What release 13 does to the shards
          The local catalogue shows **every star cell in shard 0**, beside cosmic-web and nearby-galaxy cells, and shard 0 at its 4.5 GB budget. Placement is sticky: a cell stays in its shard. A shard that outgrows its budget gives up its *last* cells, which move to the last or a new shard. Release 13 grows shard 0 by about 15 GB of stars, so shard 0 will hand most of its cells to the new shards 8–11.

          Those moved cells' unchanged rows are written again into their new shard. Release 13 is then larger than a purely additive change: the 15 GB of new stars plus up to about 4.5 GB of moved rows. Release 12's copies stay in shard 0 until 12 is pruned. This is the case the 4.5 GB budget under the 10 GB cap exists for: shard 0 then holds about 4.5 GB valid in 12 plus at most 4.5 GB valid in 13.

          ### Gaps
          1. **No test prunes and then builds the next change.** No test covers prune *n*−2 and *n*−1, then build and publish *n*+1 as a change, with the reads of *n* and *n*+1 equal to a from-scratch build.
          2. **No test prunes across a cell that moved shards.** No test has release *n* move a cell to a new shard and then prunes *n*−1, checking that the old shard's copies go and the new shard's stay.
          3. **No snapshot before the first prune.** The real store has never been pruned since rows became shared. `cp -c`, an APFS clone, takes copy-on-write snapshots of `.cache/univ-ingest/wrangler` and `state` in seconds and costs little disk.
          4. **SQLite files don't shrink after a prune.** There is no `VACUUM`. Freed pages are reused by later inserts, so the cap is fine, but the files on disk stay their size. Size checks after a prune read `page_count − freelist_count`, not file size.

          ### What I add to the plan
          - Wave 1 adds tests for gaps 1 and 2 (`tests/prune_then_change.rs`) before any real prune.
          - Before pruning 10 and 11:
            - Clone the store and the state.
            - Record the fingerprints of release 12 (`cargo xtask science 12 --store`) and the answers to 1,000 random lookups.
          - After each prune:
            - The same science run and lookups must match exactly.
            - Ids retired in 10 still resolve.
            - On any difference, restore the clone and stop.
          - Prune 12 only after 13 is published, checked and benched, with the same guard.
        tone: warning
