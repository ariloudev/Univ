          ```mermaid
          flowchart LR
            W1["W1 deeper Gaia stars,\ninferred distances,\n4 shards, prune tests"] --> W2["W2 Galaxy tracers\ndomain and 5 sources"]
            W2 --> W3["W3 dust map grids"]
            W3 --> W4["W4 explorer drawing"]
