        title: "Wave 4 merged"
        markdown: |-
          `stage/milky-way-4` merged as `95f073c`. The gate passed 13 gates and integration passed (23 Playwright tests).

          **Built:**
          - **Tracers:** a colour for each of the domain's seven sources (69 tracers take the distance of a matched Gaia star, so the two Gaia sources are among them), twice a star's size, counted by source and kind of value in the key.
          - **Inferred stars:** half as opaque, and the key says so with their number.
          - **Dust map:** a switch in the Show drawer kept in the address; the grid fetched once a release and coarsened to 125³ half floats; a brown haze ray-marched about one step a cell; each star dimmed by the dust column before it, structure markers not; a key with source, unit, reconstructed and citation.
          - `UNIV_LOCAL_STATE` runs serve, explore and the benches on another local state.

          **Found by the preview release:** the ingest normalized the dust map, a FITS file, as a table of rows, which would have stopped release 13; fixed in `b0f88fc` before the full run. The screenshots also showed two tracer colours each shared by two sources; fixed.

          **Screenshots:** sent to the owner from a preview of 1 in 48 of the G < 14 stars; the dust lies in the plane about a cleared Local Bubble.
        tone: success
