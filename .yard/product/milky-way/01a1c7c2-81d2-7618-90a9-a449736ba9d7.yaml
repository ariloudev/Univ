        title: "Release 14 published, checked and swapped in"
        markdown: |-
          Built from `3d1f3ff` in 34 min, published to an APFS clone of the real local state (14 min, 1.1 GB, latest 13 → 14), checked there, then swapped in at the end of the run; release 13's state kept as `.cache/univ-ingest/wrangler-r13`.

          | | Release 13 | Release 14 |
          |---|---|---|
          | Objects | 53,364,009 | 53,364,009 |
          | Placed | 53,049,877 | 53,049,877 |
          | Tiles | 6,756 | 6,756 (Galaxy tracers in encoding 3) |
          | Hunt & Reffert clusters | 6,818 | 6,818, every one with an age |
          | Science | 33 PASS, 3 FAIL, 3 CONCERN | 34 PASS, 3 FAIL, 3 CONCERN, 4 INFO |

          The three FAILs (`twompp-sdss-sourced`, `local-group-duplicates`, `fingerprints` read through `--store`) and three CONCERNs are release 13's, unchanged. The new `ages-normalized-to-years` passes; `open-cluster-ages` reports 2,794 / 1,169 / 405 clusters under 100 / 30 / 10 Myr, as the VizieR table gives.

          Correction: the plan and the report's citation said 1,225 under 30 Myr. That was the count under logAge50 = 7.5 (31.6 Myr) from the first test plot; under 30 Myr it is 1,169. Fixed in `46a424b`.
        tone: success
