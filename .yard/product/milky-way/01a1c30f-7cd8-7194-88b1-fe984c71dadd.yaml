  - key: 01a1c30f-7cd8-7194-88b1-fe9ea529a8a9
    id: q-placement
    kind: question
    versions:
      - key: 01a1c30f-7cd8-7194-88b1-fea6e85968d3
        at: 2026-11-10T01:25:34Z
        revision: 1
        by:
          host: claude-code
          session: "918a7610-2359-46e7-a590-437534c76364"
        prompt: "Which of the added stars get a 3D position?"
        header: "Placement"
        context: "An object without a position stays in the catalogue, where lookups and names find it, but in no tile. The spec already requires Bailer-Jones distances and never an inverted parallax."
        options:
          - label: "Constrained only"
            detail: "Fetch the whole cut, but place only stars whose Bailer-Jones distance is constrained: (r_hi − r_lo)/2 under 20% of r_med, about ϖ/σ > 5. The rest are records without a point. Recommended: the drawn Galaxy then comes from measurements, not from the distance prior."
            recommended: true
          - label: "Place all, flag"
            detail: "Place every star and mark prior-dominated distances in its record. Every point gets drawn, but beyond about 1 kpc the shape shown partly comes from the Bailer-Jones Galaxy model."
          - label: "Fetch constrained"
            detail: "Leave stars with ϖ/σ ≤ 5 out of the fetch entirely. This saves storage (about 4% at G < 14, 8% at G < 15), but those stars are absent from lookups too."
    responses:
      - key: 01a1c312-328e-7044-a266-54b74299252b
        at: 2026-11-10T01:28:32Z
        revision: 2
        by:
          name: "ariloudev"
          email: "contact@askloft.ai"
        channel: page
        chosen:
          - "Place all, flag"
  - key: 01a1c30f-7cd8-7194-88b1-fe9feadab0fd
    id: q-tracers
    kind: question
    versions:
      - key: 01a1c30f-7cd8-7194-88b1-fea793950cba
        at: 2026-11-10T01:25:34Z
        revision: 1
        by:
          host: claude-code
          session: "918a7610-2359-46e7-a590-437534c76364"
        prompt: "Which tracers of the Galaxy's structure should join the stars?"
        header: "Tracers"
        context: "These tracers show the disk, arms, warp and halo, which no magnitude cut reveals. Each is a cited source with its own distance method, kept as its own kind of value."
        options:
          - label: "Open clusters"
            detail: "Hunt & Reffert 2023 (A&A 673, A114): about 7,200 clusters with distances and ages. They trace the local arms, the Radcliffe wave and Gould Belt structure out to a few kpc. Small, and fits the existing catalogue. Recommended."
            recommended: true
          - label: "Cepheids, RR Lyrae"
            detail: "Gaia DR3 vari_cepheid (Ripepi et al. 2023) and vari_rrlyrae (Clementini et al. 2023). Classical Cepheids map the disk and its warp to about 20 kpc, RR Lyrae the halo and bulge. Distances come from period-luminosity relations, kept as estimated. Recommended: the only option that reaches across the Galaxy."
            recommended: true
          - label: "3D dust map"
            detail: "Edenhofer et al. 2024 (A&A 685, A82), dust density to 1.25 kpc: the Local Bubble, the Radcliffe wave, molecular clouds. Served as a grid like the CF4++ density field and drawn by the explorer. The source is large and would be resampled to the release's grid. Recommended."
            recommended: true
          - label: "Globulars, masers"
            detail: "Baumgardt & Vasiliev 2021 (MNRAS 505, 5957), about 165 globular clusters with distances, and Reid et al. 2019 (ApJ 885, 131), about 200 maser parallaxes of star-forming regions that define the spiral arms. Small and precise, but only a few hundred points in all."
        multiple: true
    responses:
      - key: 01a1c312-328e-7044-a266-54b866d14870
        at: 2026-11-10T01:28:32Z
        revision: 2
        by:
          name: "ariloudev"
