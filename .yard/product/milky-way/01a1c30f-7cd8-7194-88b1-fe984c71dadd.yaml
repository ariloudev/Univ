  - key: 01a1c30f-7cd8-7194-88b1-fe9c5b5a8339
    id: findings
    kind: note
    versions:
      - key: 01a1c30f-7cd8-7194-88b1-fea403d67e69
        at: 2026-11-10T01:25:34Z
        revision: 1
        by:
          host: claude-code
          session: "918a7610-2359-46e7-a590-437534c76364"
        title: "How many more stars Gaia DR3 offers"
        markdown: |-
          **Today** release 12 draws **780,457 stars**: Gaia DR3 G < 10 (482,106 rows), the Gaia Catalogue of Nearby Stars (331,312) and Hipparcos (117,955), merged by cross-match. The decision *Take Gaia's nearby and bright stars* capped them to keep one release inside D1's 10 GB. Objects are now sharded across 8 D1 databases. Release 12 holds 36.9M objects in about 32 GB, roughly 0.9 KB per object, so that cap no longer applies.

          **Gaia DR3 by G limit.** These counts come from a 1% random sample of `gaiadr3.gaia_source` (`random_index < 18,117,098`) queried 2026-11-10 and scaled by 100. The sample's G < 10 count, 0.48M, matches the measured 482,106.

          | Cut | Sources | Added over today's G < 10 | ϖ/σ > 5 | ϖ/σ > 5 and ϖ > 1 mas (within ~1 kpc) |
          |---|---|---|---|---|
          | G < 10 | 0.48M | (today) | 0.47M | 0.39M |
          | G < 12 | 3.11M | +2.6M | 3.04M | 1.89M |
          | G < 13 | 7.40M | +6.9M | 7.18M | 4.00M |
          | G < 14 | 16.8M | +16.4M | 16.1M | 7.65M |
          | G < 15 | 36.9M | +36.4M | 33.9M | 12.7M |
          | G < 16 | 78.0M | +77.5M | 66.3M | 19.1M |
          | all | 1.81B | | 192M | 64.6M |

          **What scales already:** the stars octree (tiles of at most 61,678 points, 0.25 pc leaves) and the explorer's view-dependent loading within a 6M-point budget take any of these cuts unchanged. Shards split stars by 10 pc cells.

          **Two science caveats:**
          - *A magnitude cut gives a bubble, not a galaxy.* It sees giants out to kiloparsecs but dwarfs only to a few hundred parsecs, and dust hides the disk plane. More stars make the Sun's neighbourhood richer, but they don't draw the disk, bar or arms. Tracers chosen for structure (clusters, Cepheids, a dust map) show those.
          - *Faint stars' distances lean on a prior.* Where ϖ/σ is low, Bailer-Jones 2021 distances come mostly from their Galaxy model. Placing those stars would draw the model's shape and present it as data.
        tone: info
  - key: 01a1c30f-7cd8-7194-88b1-fe9dc4e5d613
    id: q-depth
    kind: question
    versions:
      - key: 01a1c30f-7cd8-7194-88b1-fea5c79ccb9d
        at: 2026-11-10T01:25:34Z
        revision: 1
        by:
          host: claude-code
          session: "918a7610-2359-46e7-a590-437534c76364"
        prompt: "How deep should the Gaia DR3 stars go?"
        header: "Star depth"
        context: "Counts come from the 1% Gaia sample above. Storage assumes about 0.9 KB per object, as measured in release 12. Fetch time scales from G < 10, where 30,000-row chunks ran as async jobs of about 11 s each."
        options:
          - label: "G < 12"
            detail: "3.1M stars (+2.6M). About 2.5 GB more D1, under an hour to fetch. A safe first step, but only about 4× today's stars."
          - label: "G < 13"
            detail: "7.4M stars (+6.9M). About 6 GB more D1, about an hour to fetch. A tenfold increase with room to spare."
          - label: "G < 14"
            detail: "16.8M stars (+16.4M), 96% of them with ϖ/σ > 5. About 15 GB more D1, so the 8 shards go from about 32 to 47 of their 80 GB. A few hours to fetch with the Bailer-Jones join. Recommended: twentyfold detail, distances still mostly measured, and it fits the deployment as bound."
            recommended: true
          - label: "G < 15"
            detail: "36.9M stars (+36.4M). About 33 GB more D1, which doubles the store and needs more shard bindings. Several hours to fetch. Only 34% of the added stars lie within 1 kpc with ϖ/σ > 5."
    responses:
