        title: "Approve the deeper Milky Way specification"
        markdown: |-
          Approving this also approves **superseding the accepted decision ADR-23**, *Take Gaia's nearby and bright stars, not the whole catalogue*, with *Take Gaia DR3 stars to G < 14, with the Galaxy's tracers*.

          **Decisions (4 new, 1 superseded)**
          - *Take Gaia DR3 stars to G < 14, with the Galaxy's tracers* supersedes ADR-23.
          - *Place every star, and mark distances that lean on the prior as inferred.*
          - *Give the Galaxy's tracers a scale domain of their own.*
          - *Draw the dust map as a translucent volume.*

          **Univ Ingest**
          - New sources for release 13: Gaia DR3 and Bailer-Jones to G < 14 (now carrying parallax and error), Hunt & Reffert 2023, Baumgardt & Vasiliev 2021, Skowron 2025 Cepheids, Li 2023 RR Lyrae, Reid 2019 masers and Edenhofer 2024 dust. The component *Gaia DR3 bright stars* is renamed *Gaia DR3 stars*.
          - A Bailer-Jones distance resting on ϖ < 5σ (or ϖ ≤ 0) is **inferred**. The star is still placed, and an inferred distance is set aside wherever a measured or estimated distance competes.
          - Tracers keep their kind of object, pulsation type and the published distance with its method. Cepheids and RR Lyrae join their Gaia object by `source_id`.
          - Feature *Resample the dust map*: a 2,500 pc cube about the Sun in 10 pc cells, along galactic axes, mean and standard deviation, cells without data marked so (never zero), reconstructed.
          - Tiles get a fourth scale domain, **Galaxy tracers**. An object with any tracer entry belongs to it.

          **Univ Server:** the scale domain listing includes Galaxy tracers. Dust grids go through the existing volume grid routes.

          **Univ Explorer**
          - Galaxy tracer points take one colour per source, at twice a star's size, named in the key.
          - Stars with inferred distances are drawn at half opacity.
          - Feature *Draw the dust map*: a Show-drawer switch, off by default and kept in the address. A ray-marched volume dims the stars behind the dust and not those in front. A failed fetch turns it off and says why.
          - The single colour now applies to the two galaxy domains only.

          **Worth a look:** the ratio of 5, the 10 pc dust cells (a 250³ grid, about 62 MB as float32 per grid), and the tracers' twice-star point size.
