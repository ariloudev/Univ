blocks:
  - key: 01a1c315-58d0-7641-ab12-9ec9f84d6117
    id: sources-checked
    kind: note
    versions:
      - key: 01a1c315-58d0-7641-ab12-9ecc2c4850de
        at: 2026-11-10T01:31:58Z
        revision: 4
        by:
          host: claude-code
          session: "918a7610-2359-46e7-a590-437534c76364"
        title: "Tracer sources, checked against their papers"
        markdown: |-
          | Tracer | Source | Rows | Distance |
          |---|---|---|---|
          | Open clusters | Hunt & Reffert 2023, A&A 673, A114 (VizieR J/A+A/673/A114) | about 7,200 | from member parallaxes, estimated |
          | Classical Cepheids | Skowron et al. 2025, ApJS 278, 57 (VizieR J/ApJS/278/57) | 3,424 Galactic | mid-infrared period-luminosity, estimated |
          | RR Lyrae | Li et al. 2023, ApJ 944, 88 (VizieR J/ApJ/944/88) | 135,873 | G-band absolute magnitude–metallicity relation, estimated |
          | Globular clusters | Baumgardt & Vasiliev 2021, MNRAS 505, 5957 | about 165 | combined Gaia EDR3, HST and literature, estimated |
          | Masers | Reid et al. 2019, ApJ 885, 131 | about 200 | trigonometric parallax, measured |
          | Dust | Edenhofer et al. 2024, A&A 685, A82 | HEALPix Nside 256 to 1.25 kpc, mean and uncertainty | reconstructed |

          I take the Cepheids and RR Lyrae from these two distance catalogues rather than from Gaia DR3's `vari_cepheid` and `vari_rrlyrae`. Both catalogues build on those Gaia tables and publish the period-luminosity distances, so Univ Ingest computes none of its own. Each joins its Gaia DR3 star by `source_id`.

          Under *Place all, flag*, a Bailer-Jones distance whose Gaia parallax is below 5σ becomes **inferred** rather than estimated. The explorer's kind-of-value switches (○) then show or hide those points with no change to the tile format. An inferred distance is preferred only where the star has no measured or estimated one, so a far Cepheid takes its period-luminosity distance.
  - key: 01a1c315-58d0-7641-ab12-9eca2d2767d5
    id: q-tracer-domain
    kind: question
    versions:
      - key: 01a1c315-58d0-7641-ab12-9ecd60c19242
        at: 2026-11-10T01:31:58Z
        revision: 4
        by:
          host: claude-code
          session: "918a7610-2359-46e7-a590-437534c76364"
        prompt: "How should the tracers sit in the tiles, so that 16.8M stars don't bury them?"
        header: "Tracer tiles"
        context: "Each octree level keeps an even random sample. In the stars domain, about 150k tracers among 16.8M stars would show at the root only as roughly 150 points. You would see them only after zooming in."
        options:
          - label: "Own scale domain"
            detail: "A fourth scale domain, Galaxy tracers, in parsecs, with its own octree, root and switch in the Show drawer. It holds every object with an entry from a tracer source, including a Cepheid joined to its Gaia star. Its root keeps 16,384 of about 150k points, so the whole Galaxy shows at once. This touches univ-model, the server's domain listing and the explorer's drawer. Recommended: the tracers show at Galaxy scale and can be switched alone."
            recommended: true
          - label: "Stars, tracers first"
            detail: "Keep them in the stars domain, but each octree node keeps tracer points before its random sample. They show at the root, but the even sampling rule gets an exception, and RR Lyrae alone (136k) overfill the root."
          - label: "Stars, as is"
            detail: "No special treatment. The tracers appear only as you zoom in. Simplest, but the Galaxy-wide structure they trace stays hidden from afar."
    responses:
      - key: 01a1c316-535a-705b-b701-182edb10e892
        at: 2026-11-10T01:33:02Z
        revision: 5
        by:
          name: "ariloudev"
          email: "contact@askloft.ai"
        channel: page
        chosen:
          - "Own scale domain"
  - key: 01a1c315-58d0-7641-ab12-9ecb6ed1dd43
    id: q-dust-draw
    kind: question
    versions:
      - key: 01a1c315-58d0-7641-ab12-9ece683c7069
        at: 2026-11-10T01:31:58Z
        revision: 4
        by:
          host: claude-code
          session: "918a7610-2359-46e7-a590-437534c76364"
        prompt: "How should the explorer draw the 3D dust map?"
        header: "Dust drawing"
        context: "The grid would be a 2,500 pc cube about the Sun in 10 pc cells (250 a side), resampled from Edenhofer 2024, with cells beyond 1.25 kpc marked as no data. Today the explorer draws no volume grid; it only outlines structures."
        options:
          - label: "Translucent volume"
            detail: "Ray-march the grid as a WebGL2 3D texture: dust glows or darkens in proportion to its density, behind and among the stars, switched in the Show drawer. Recommended: it shows the Local Bubble, the Radcliffe wave and the clouds as they are."
            recommended: true
          - label: "Iso-surfaces"
            detail: "Outline the dust above one or two density thresholds as shells, as structures are outlined. Lines are crisper, but the threshold is our choice, not the source's, and the faint dust disappears."
          - label: "Data only"
            detail: "Publish the grids through Univ Server and leave drawing them to a later change."
    responses:
      - key: 01a1c316-535a-705b-b701-182fb38a5d41
        at: 2026-11-10T01:33:02Z
        revision: 5
        by:
          name: "ariloudev"
          email: "contact@askloft.ai"
        channel: page
        chosen:
          - "Translucent volume"
