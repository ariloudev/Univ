        title: "Wave 3 merged"
        markdown: |-
          `stage/milky-way-3` merged as `247ca93`. The gate passed 13 gates and integration passed.

          **Built:**
          - `sources/edenhofer-2024-dust.yaml`: the Zenodo file (3.25 GB, SHA-256 recorded), CC BY 4.0.
          - A streaming reader that resamples the HEALPix map onto a 250³ cube of 10 pc cells about the Sun, galactic Cartesian. On the real map it takes 4.6 s.
          - One volume grid: the mean density in extinction (Zhang, Green & Rix 2023) per parsec, with the standard deviation as each cell's uncertainty, both reconstructed. NaN marks the cells outside the map's 68.62–1,248.10 pc bins.
          - Every grid header now carries its resampling and no-data notes, null where none.

          **Check on the real map:** the densest cell is at l 208.8°, b −19.7°, 430 pc, which is Orion A.

          **For wave 4:** each of the release's two dust files (mean, deviation) is 62.5 MB; the explorer needs a coarser texture.
        tone: success
