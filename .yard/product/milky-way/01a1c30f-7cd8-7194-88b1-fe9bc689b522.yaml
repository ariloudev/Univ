        title: "Wave 2 merged"
        markdown: |-
          `stage/milky-way-2` merged as `b6b6633`. The gate passed 13 gates and integration passed.

          **Built:**
          - The Galaxy tracers domain, in parsecs: listed and queried by the API, and named by kind in the explorer.
          - Five tracer sources: 6,818 open clusters, 165 globular clusters, 3,424 Cepheids, 135,873 RR Lyrae stars and 199 masers. Cepheids and RR Lyrae stars join their Gaia stars, and globulars join OpenNGC's objects of the same clusters.
          - Three science checks of the tracers.

          **Changes from the plan, each the owner's choice:**
          - The globular clusters come from Baumgardt's database, `permission_pending`, since the paper's distances are not on VizieR.

          **Open for the owner:**
          - The permission request to Holger Baumgardt.
          - Whether open clusters join OpenNGC by name: that needs a new matching feature, and position fails for them.
          - Li's 28,754 Magellanic Cloud RR Lyrae stars are kept as published.
        tone: success
