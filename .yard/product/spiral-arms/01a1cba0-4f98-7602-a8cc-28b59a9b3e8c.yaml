        prompt: "What should the face-on view do?"
        header: "Face-on"
        context: "The camera needs a pole-safe orbit either way: today it stops 1.15° short of the pole."
        options:
          - label: "Arms view preset"
            detail: "One button, also in the URL (`view=arms`): looks down from the north Galactic pole over about 30 kpc, centred between the Sun and the Galactic Centre, hides the stars and cosmic web, shows tracers younger than 30 Myr and turns the model arms on. Recommended: 16.8 M additive-blended stars otherwise drown the Sun's surroundings."
            recommended: true
          - label: "Camera only"
            detail: "A button that only turns the camera to look down from the north Galactic pole; you choose what's drawn in the Show drawer."
    responses:
