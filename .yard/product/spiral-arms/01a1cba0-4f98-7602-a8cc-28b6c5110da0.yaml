        by:
          host: claude-code
          session: "733ab034-0172-4107-897d-a9a3752e1525"
        title: "Approve the spiral-arms spec change"
        markdown: |-
          ## What changes

          | Area | Change |
          |---|---|
          | **Ingest sources** | Release 15 adds Zari et al. 2021's filtered sample (417,535 rows, VizieR) as a Galaxy tracer source of kind *luminous hot star*. |
          | **Normalization** | Zari's astro-kinematic median distance is kept as **inferred**, with 16th/84th percentiles. It is inferred because Zari publishes no parallax errors, so the posterior can't be shown to be parallax-led, the same rule as Bailer-Jones below 5σ. The parallax is kept as measured with no uncertainty reported, and no distance is derived from it. Stars join their Gaia DR3 objects by source id, so a G < 14 star with a precise Gaia parallax is placed by that parallax. |
          | **Tiles** | Encoding **version 4** adds a kind-of-object column. Only the Galaxy tracers' tiles take it; the stars and galaxy domains keep version 3, so their files are not republished. |
          | **Structures** | A structure file can give a log spiral's cited Table 2 parameters; Univ Ingest computes the path (1° steps, heliocentric galactic kpc, R0 = 8.15 kpc, the plane 5.5 pc below the Sun). There are two structures per arm: the **spiral arm** over its fitted azimuths, and an **extrapolation** up to 90° beyond each end, within 3–16 kpc of the Galactic Centre. Both have a new status, **model**. |
          | **Explorer: colours** | Tracers are coloured **by kind of object**, whatever source placed them, and each kind gets a switch in the Show drawer (`hide=` in the address). |
          | **Explorer: structures** | Extrapolations are drawn fainter, beneath their arms. A model's panel says it is a model; an extrapolation's says only the fitted range rests on the paper. The Structures list reaches down to 1 kpc, with a heading for structures within 30 kpc. |
          | **Explorer: arms view** | One control (and `view=arms`) looks down from the north Galactic pole, focus halfway to the Galactic Centre, Sun above the centre as in Reid's Figure 1. It shows only the tracers domain: luminous hot stars, open clusters < 30 Myr and masers, with Cepheids, RR Lyrae and globulars off, and the model arms. |

          ## Worth a look

          - **The kind name "luminous hot star"** (from Zari's paper title) rather than "OB star": the sample includes late-B and A stars.
          - **Cepheids are off in the arms view.** They are 50–300 Myr old and trace the arms only loosely; you can turn them back on.
          - **The 90° extrapolation span** is this project's choice, recorded in the decision; Reid's Figure 1 extends the arms by hand differently.

          Once you approve, I commit `spec/` alone and present the build plan in plan mode.
