        title: "W5 merged: release 10 migrated, release 11 published as its change"
        markdown: |-
          Merged as `01b3565` after a green `cargo xtask check` and `cargo xtask integration`. The run on the real local store found three bugs, each now fixed with a test that fails without the fix: a70624b (reindex), 0650873 (never-loaded database) and 40f5a11 (migration of a bound shard).

          | | Release 10 (full) | Release 11 (change) |
          |---|---|---|
          | Migrate + reindex | | 5 min 43 s + 2 min 57 s, once |
          | Build | 15 min, 55 GB | 25 min 56 s, 108 GB peak footprint |
          | Build output | 38 GB | 2.7 GB |
          | Publish | 1 h 35 min | 15 min 34 s, including one stop and resume |
          | D1 used bytes added | 22.9 GB | 0.86 GB |
          | Lookup / first points p95 | 3.9 ms / 213 ms | 3.7 ms / 211 ms |

          All pinned reads of release 10 are unchanged through the migration and through release 11: 317 of 320 sampled answers are byte-identical, and the 3 that differ are grid headers that now name their samples by SHA-256.

          Release 11 is gigabytes rather than kilobytes for three reasons outside the shared-rows path:
          - 10 object splits from the fibres fix abbddc0, which landed after release 10 was built;
          - a one-time repack of shards that release 10 had filled to the 4.5 GB budget under the old size estimate;
          - a tile layout that is not local.

          The next candidates, for the owner to choose from, are local tiles, a streamed row index (build memory), a no-change release 12 to measure the steady state, and a `VACUUM` of the 9 GB of free pages. The W5 log has the details.

          `product/additive-releases` now holds W1–W5. It is not merged into `develop` or `main`, and nothing is published, pushed or deployed.
        tone: success
