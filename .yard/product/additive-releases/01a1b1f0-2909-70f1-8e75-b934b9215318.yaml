        title: "W3 merged"
        markdown: "Merged as `bbeddb1` after `/simplify`, `/code-review` and a green `cargo xtask check`. A build compares each row with the release before's row index (SHA-256, kept in the state) and writes only what is new or changed, retiring the rest by key; manifest v3 records the parent and each table's change. Moved up from W4 because W3 needs them: prune deletes only rows no kept release holds, and publish refuses a parent `latest` does not point to and checks tables it writes no file of."
        tone: success
