  - key: 01a1b1a0-b753-7717-9387-392899c1ddcc
    id: approve-shared
    kind: approval
    versions:
      - key: 01a1b1a0-b753-7717-9387-392b7fce05ed
        at: 2026-11-06T16:11:02Z
        revision: 7
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Approve shared rows and files between releases"
        markdown: |-
          **New decision:** *Share unchanged rows and files between releases*. Four options weighed against storage, release time and pinned reads; shared rows chosen, with their costs and obligations: every read selects by release range, the row index must match what was published, prune deletes only what no kept release holds.

          **Build a release**
          - The main requirement now says a release is written *as what it changes from the release latest points to*; its manifest still lists every file with its SHA-256, shared ones included.
          - New: write only rows that differ from those valid in latest, retire the rest; rows compared by key and content hash from an index kept beside the id state; a structures-only release writes no object, entry, measurement or tile; the manifest gives each table's added and retired rows and the fingerprint of every row valid in the release.
          - New: each file stored once by SHA-256, and each release maps its paths to hashes.

          **Publish a release locally**
          - Uploads only the files and rows a release adds and the retirements it records; nothing shared is uploaded again; once uploaded, the rows valid in the release match the manifest's counts and fingerprints.
          - New refusal: a release built on a release other than latest.
          - New: publishing onto a store of the old schema brings its releases under the shared schema in place (release 10), with no rebuild or re-upload, and pinned reads unchanged.

          **Prune old releases**: deletes only rows and files no unpruned release holds.

          **CON-3**: each row counted once whichever releases hold it; 4.5 GB budgeted for the rows of latest, so a release changing every row still fits beside it.

          Worth a look: the wording of the main Build requirement, and whether the migration belongs under Publish (as drafted) or a requirement of its own.
