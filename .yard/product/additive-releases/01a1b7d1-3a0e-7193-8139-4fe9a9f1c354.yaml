          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        prompt: "Should the release gain proper names, such as Sirius, M31 and NGC 4472, from new name sources?"
        header: "Names"
        options:
          - label: "Later, separately"
            detail: "Do the panel and the revamp first, with catalogue designations as headings. Plan the name sources (IAU star names, Messier, NGC/IC) as their own ingest wave afterwards, with a licence check for each."
          - label: "Yes, in this work"
            detail: "Add the name sources in the same push. It needs a new ingest wave, a licence check for each source, and release 12 before the panel can show the names."
          - label: "No"
            detail: "Catalogue designations are enough for now."
        ownWords: true
    responses:
