  - key: 01a1b7d1-3a0e-7193-8139-4feacbe2d312
    id: ask-toolu-01713k6tlhxt9gupaxmhqm7m-1
    kind: question
    versions:
      - key: 01a1b7d1-3a0e-7193-8139-4fef6544cc3e
        at: 2026-11-07T21:01:44Z
        revision: 19
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        prompt: "Which visual direction should the Univ Explorer revamp take? (Each keeps the 3D view as the main thing; they differ in identity and where panels live.)"
        header: "Direction"
        options:
          - label: "Star atlas"
            detail: "Borrowed from printed celestial atlases. The view sits inside a frame whose edges carry live coordinate ticks (l/b or RA/Dec). Panels dock into the frame's margins, so they never cover the view. Structure names are in an italic serif, as atlases name features. The legend is an atlas key along the bottom. Night-ink blue, ivory labels. The live graticule frame is the one bold element."
            recommended: true
          - label: "Catalogue data sheet"
            detail: "The chrome recedes to one thin rail and the view fills the screen. The selected object or structure opens as a typeset catalogue record: designations as a header, then blocks for position, distance, brightness and motion. Uncertainties are set properly (34.68 +0.017/−0.014 pc). Every value carries a mark for its kind (measured, estimated, inferred, reconstructed). The typeset record is the bold element."
          - label: "Refine the current"
            detail: "Keep today's floating panels and dark-blue look, and make them consistent. Spacing, type scale and collapsible sections; the legend and help text become one tidy key; search becomes a command bar. The least change and the cheapest."
        ownWords: true
    responses:
      - key: 01a1b7d3-61af-7233-9515-bd49abdc9db7
        at: 2026-11-07T21:04:06Z
        revision: 20
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: terminal
        chosen:
          - "Star atlas"
  - key: 01a1b7d1-3a0e-7193-8139-4febc91e8234
    id: ask-toolu-01713k6tlhxt9gupaxmhqm7m-2
    kind: question
    versions:
      - key: 01a1b7d1-3a0e-7193-8139-4ff0d7475437
        at: 2026-11-07T21:01:44Z
        revision: 19
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        prompt: "Where should the catalogue prefixes in object names come from (\"HIP 32754\", \"Gaia DR3 1000166358456525568\", \"2MASS J12374380-4337163\")?"
        header: "Designations"
        options:
          - label: "Source definitions"
            detail: "Each source's YAML gains its designation form, cited from the catalogue's documentation. Ingest and the API serve it to every client, and the explorer orders designations by it. Takes an ingest and API change plus release 12; with additive releases that is about 25 min to build and 15 min to publish."
            recommended: true
          - label: "Explorer-side table"
            detail: "A small table in the explorer maps each source to its prefix. Quick, with no new release, but only the explorer knows it and it sits outside the cited source definitions."
        ownWords: true
    responses:
      - key: 01a1b7d3-61b0-70e5-9624-68d927b6fd68
