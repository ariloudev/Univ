          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        prompt: "Which groups of information should the object panel show, beyond its names and distances?"
        header: "Panel data"
        options:
          - label: "Sky position"
            detail: "RA/Dec, plus galactic l/b, with the epoch and frame of each."
          - label: "Brightness"
            detail: "Magnitudes in each band, with their uncertainty and source."
          - label: "Motion and redshift"
            detail: "Proper motion, radial velocity and redshift. Most galaxies have a redshift rather than a distance."
          - label: "Membership and flags"
            detail: "Its group (for example a Cosmicflows-4 group), the structures it lies inside, and each catalogue's quality flags explained."
        multiple: true
        ownWords: true
    responses:
