        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        prompt: "Should tiles and grids in R2 be shared across releases as rows will be?"
        header: "R2 files"
        options:
          - label: "By content"
            detail: "Each file stored once under its SHA-256; a release maps its paths to hashes in D1. A structure release uploads no tile; a new source uploads only the tiles it changes. Univ Server reads a tile through that map."
            recommended: true
          - label: "Per release"
            detail: "Keep releases/{n}/ keys: each release copies its 0.7 GB of tiles and 0.4 GB of grids. Simple, server untouched for files, but storage and upload grow by a full set each release."
    responses:
