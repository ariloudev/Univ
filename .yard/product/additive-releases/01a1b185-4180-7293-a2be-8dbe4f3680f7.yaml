  - key: 01a1b19b-7438-720e-beaa-11f8f4548e70
    id: d-approach
    kind: decision
    number: 2
    versions:
      - key: 01a1b19b-7438-720e-beaa-11ff106225bc
        at: 2026-11-06T16:05:17Z
        revision: 4
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Shared rows across releases"
        consequence: "Each row is valid from the release that adds it until one retires it: storage grows by each release's change, many releases can be kept, and publish writes only the change. The D1 schema goes to 6, every Univ Server read selects by release range, prune deletes only rows no kept release sees, and CON-3's per-release budget is rewritten."
        question: 01a1b188-df1e-74dd-98f1-82064df8d7db
  - key: 01a1b19b-7438-720e-beaa-11f928173c59
    id: how-it-relates
    kind: note
    versions:
      - key: 01a1b19b-7438-720e-beaa-1200de2f6dec
        at: 2026-11-06T16:05:17Z
        revision: 4
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "How the last two questions read under shared rows"
        markdown: |-
          Shared rows settle **how releases store and publish**. Two things are still open, and they are separate:

          1. **How a build finds its change.** Under shared rows a release writes rows that are new, rows that changed, and retirements of rows that are gone. To know which, the build compares what it made with what the parent holds. It can compare by whole table (coarse: a new source would rewrite every shard's objects table, losing most of the gain) or row by row. Row by row needs the parent's rows, but not its 37 GB: a small index kept beside the id state, each row's key and a hash of its content (about 36 M keys, roughly 0.6 GB), is enough.
          2. **How long the build itself takes.** That is separate from storage: the build can still run whole (15 min) and then compare, or keep stage results between runs so a structures-only release skips cross-match and tiles.

          ```mermaid
          flowchart LR
            B[build: whole or cached] --> D[compare with the parent's row index]
            D -->|added, changed| W[write rows valid from n]
            D -->|gone| R[retire rows at n]
            W --> P[publish: the change alone]
            R --> P
          ```

          Tiles and grids in R2 have the same choice as rows: keyed per release, as now, or stored once by content and shared.
        tone: info
  - key: 01a1b19b-7438-720e-beaa-11faef1e24ce
    id: q-unit-2
    kind: question
    versions:
      - key: 01a1b19b-7438-720e-beaa-12019dcb1d74
        at: 2026-11-06T16:05:17Z
        revision: 4
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        prompt: "With shared rows, how should a build find which rows changed?"
        header: "Diff unit"
        options:
          - label: "Row by key"
            detail: "A row index (key and content hash per row) kept with the id state; the build compares each row it makes with it and writes only added, changed and retired rows. Exact, and a structure release publishes kilobytes."
            recommended: true
          - label: "Whole table"
            detail: "Compare each table's fingerprint per database; any difference rewrites the table for the new release. No index, but a new source rewrites every shard's objects, entries and measurements: most of a full publish."
          - label: "Cell"
            detail: "Compare each level-0 cell's rows by fingerprint and rewrite whole cells that differ. A middle way: a small source in one part of the sky rewrites only its cells; still an index, of cells rather than rows."
    responses:
      - key: 01a1b19e-309e-777f-8fc0-71cd83d11994
        at: 2026-11-06T16:08:16Z
        revision: 5
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "Row by key"
