blocks:
  - key: 01a1b188-df1e-74dd-98f1-8205473245fd
    id: q-scope
    kind: question
    versions:
      - key: 01a1b188-df1e-74dd-98f1-820a9cba24f9
        at: 2026-11-06T15:44:59Z
        revision: 2
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        prompt: "Which changes must make a release without the full cost?"
        header: "Changes"
        options:
          - label: "Structures"
            detail: "Adding or correcting structures in structures/: the commonest change, and the cheapest to make additive, since objects and tiles do not move."
            recommended: true
          - label: "A new source"
            detail: "Adding one catalogue: its objects and tiles change, and cross-match must see every entry again to keep ids right, but most shards' rows stay the same."
            recommended: true
          - label: "A changed source"
            detail: "A source re-fetched or re-normalized: like a new source, with objects that leave as well as arrive."
          - label: "Rules"
            detail: "Matching, ranking or tile rules: may move every object; a full release is the honest answer, so this one stays full."
        multiple: true
    responses:
      - key: 01a1b19a-f157-7347-a8af-d6c30d0565b0
        at: 2026-11-06T16:04:43Z
        revision: 3
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "Structures"
          - "A new source"
  - key: 01a1b188-df1e-74dd-98f1-82064df8d7db
    id: q-approach
    kind: question
    versions:
      - key: 01a1b188-df1e-74dd-98f1-820b551d03fc
        at: 2026-11-06T15:44:59Z
        revision: 2
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        prompt: "How should a release reuse what its parent already holds?"
        header: "Approach"
        context: "Each keeps ADR-16 and AC-128: a release, once published, never changes."
        options:
          - label: "Carry forward"
            detail: "Rows stay per release, as now. The build still runs whole but writes SQL and files only for what differs from the parent, by the manifest's fingerprints; publish copies the rest inside D1 (INSERT … SELECT from release n) and R2 (copy by key). A structure: minutes, not 95. Storage per release unchanged, CON-3 as now. Server untouched."
            recommended: true
          - label: "Shared rows"
            detail: "Rows are valid from the release that added them until one that retires them; a release writes only its changes and storage grows by the change alone, so many releases can live side by side. Schema 6, every server query filters by range, prune rewritten: the biggest change by far, worth it only if many releases must coexist."
          - label: "Stage caches"
            detail: "Keep normalized entries per source and the cross-match result between runs, so a build re-runs only what changed. Saves minutes of the 15-minute build; the 95-minute publish and the storage stay as they are."
    responses:
      - key: 01a1b19a-f157-7347-a8af-d6c454b0284b
        at: 2026-11-06T16:04:43Z
        revision: 3
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "Shared rows"
  - key: 01a1b188-df1e-74dd-98f1-820792fdeab5
    id: q-unit
    kind: question
    versions:
      - key: 01a1b188-df1e-74dd-98f1-820c93bc0346
        at: 2026-11-06T15:44:59Z
        revision: 2
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        prompt: "At what unit should a release tell its parent's data apart from its own?"
        header: "Unit"
        options:
          - label: "Table per shard"
            detail: "The manifest already fingerprints each table in the catalogue and in each shard. A structure changes three catalogue tables; a new source changes the shards its objects land in. Simple and already checked at publish."
            recommended: true
          - label: "Cell"
            detail: "Fingerprint each level-0 cell's rows, so a source in one part of the sky rewrites only those cells. Finer, faster for small sources, but a new fingerprint per cell and per table, and copy-forward by cell ranges."
          - label: "Row"
            detail: "Diff every row against the parent: the least written, but the build must read the parent's 37 GB, which costs more than it saves."
    responses:
      - key: 01a1b19a-f157-7347-a8af-d6c5c18d260d
        at: 2026-11-06T16:04:43Z
        revision: 3
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        words: "Not sure if my previous answer changes this"
  - key: 01a1b188-df1e-74dd-98f1-82081644881b
    id: q-build
    kind: question
    versions:
      - key: 01a1b188-df1e-74dd-98f1-820d1cf2e304
        at: 2026-11-06T15:44:59Z
        revision: 2
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        prompt: "Should the build itself stop re-running every stage?"
        header: "Build"
        options:
          - label: "Whole, then diff"
            detail: "Keep the build one deterministic pass from the downloads (15 min), and make only its writing and the publish additive. Simplest to trust: a carried table is the same table a full build would make, and the fingerprints prove it."
            recommended: true
          - label: "Skip stages too"
            detail: "Also cache normalized sources and the cross-match result, so a structures-only release skips to resolving members (about a minute). Faster again, at the cost of a second path that must agree with the whole build."
    responses:
      - key: 01a1b19a-f157-7347-a8af-d6c6af94020d
        at: 2026-11-06T16:04:43Z
