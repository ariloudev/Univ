  - key: 01a1b19e-7686-704f-89b1-b9d55ae89d32
    id: options-produced
    kind: note
    versions:
      - key: 01a1b19e-7686-704f-89b1-b9da4d87d788
        at: 2026-11-06T16:08:34Z
        revision: 6
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "The shape chosen"
        markdown: |-
          ```mermaid
          flowchart LR
            B[whole build, 15 min] --> D{compare with the row index}
            D -->|added or changed| A[rows valid from n]
            D -->|gone| R[rows retired at n]
            B --> H{files by SHA-256}
            H -->|new hash| U[upload once]
            H -->|known| M[map only]
            A --> P[publish the change]
            R --> P
            U --> P
            M --> P
          ```

          | | Today | Shared rows |
          |---|---|---|
          | A row | one per release, `release` in its key | one per change, valid from the release that adds it until one retires it |
          | A release's view | `WHERE release = n` | `from ≤ n` and not retired at or before n |
          | A tile | `releases/{n}/tiles/…` | stored once by SHA-256, mapped per release |
          | A structure release | 15 min build + 95 min publish + 37 GB | 15 min build + seconds + kilobytes |
          | Prune | delete release n's rows | delete only rows and files no kept release sees |
          | CON-3 | 4.5 GB per release per database | the live rows of every kept release under 10 GB per database |

          ADR-16 (immutable releases) and AC-128 (reads pinned to a release agree) hold: a row is never changed once published, only retired by a later release.
        tone: success
