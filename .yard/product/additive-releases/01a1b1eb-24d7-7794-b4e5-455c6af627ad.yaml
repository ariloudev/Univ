        title: "Build plan: shared rows and files between releases"
        markdown: |
          # Build plan: shared rows and files between releases

          ## Context
          Today every release copies all its rows and files. Release 10 took 15 min to build, 1 h 35 min to publish and 37 GB of D1, so adding one structure costs as much as rebuilding everything. Spec `0eb24e0` (approved) changes this:
          - Each row is valid from the release that adds it until a release retires it.
          - Each file is stored once, by its SHA-256.
          - A build compares its rows with an index of the latest release's rows (key + content hash) and writes only what changed.
          - Publish uploads only that change. Prune deletes only what no kept release holds.
          - Release 10 migrates in place.

          The build stays one whole pass. Univ Server's spec is unchanged: AC-128 must keep holding.

          Two facts from the code drive the design:
          1. **Unstable numbering.** Term ids, `sources.n` and chain ids are numbered per release in first-seen order (`release/terms.rs:163-257`). Shard packing is redone each release. A small input change would therefore renumber, or move, millions of rows.
          2. **The `release = ?` prefix.** All 30 server statements, and every primary key and index, lead with `release = ?` (`univ-model/src/release/schema.sql`, univ-api inline SQL). Eight joins match `release` to `release`.

          ## Waves (each a `stage/additive-wN` branch, merged `--no-ff` into `product/additive-releases`)

          ### W1: Stable numbering and stable shards (ingest; schema unchanged)
          - Number terms, sources and chains from the previous release's maps, kept in the state directory (`state.rs`). New items take the next free number; numbers are never reused.
          - Pack shards from the previous release's cell→shard map. Only new cells are packed into shards that have room.
          - **Criteria met:** prerequisites for "a structures-only release writes no object, entry, measurement or tile".
          - **Tests:** fixture build 1, then build 2 with one structure added, then build 2' with one source added. Assert unchanged objects keep identical rows, numbers and shards.

          ### W2: Schema 6 and Univ Server reads shared rows
          - **Schema 6:**
            - Every per-release table gets `retired INTEGER NULL`.
            - Primary keys become (natural key…, release).
            - Indexes are reordered so the natural key leads.
            - `release_files(release, path, sha256)` maps a release's paths to file hashes.
            - R2 keys become `files/{sha256}` (`univ-model/src/release/keys.rs`).
          - **One visibility helper** in univ-api, `visible(alias, n)`, gives `alias.release <= n AND (alias.retired IS NULL OR alias.retired > n)`. All 30 statements use it, and the 8 release-to-release joins become a visibility test on each side.
          - **Files are read by hash:**
            - Tiles use the SHA-256 the tile manifest already holds (`bulk.rs:325`).
            - Tile manifests, grid headers and grid samples are read through `release_files`.
          - **testkit:** rows gain `retired`. Add a release 3 that retires and replaces rows. `testkit_objects.sql` is regenerated by ingest's `api_fixture` test.
          - **Criteria met:** "Two reads pinned to one release return identical data" (AC-128) and "answer from that release alone", over shared rows.
          - **Tests:**
            - univ-api lookup, volume, structures and sources tests over releases that share and retire rows.
            - A test that a pinned read is unchanged after a later release retires its rows.
            - QA-2/QA-3 benches run in W5.

          ### W3: Ingest writes the change
          - **Row index:** one binary file per table and database, mapping a 128-bit key hash (`d1/state.rs:63`) to a content hash of `canonical_row` without `release`. It is written by every build from all its rows, and installed with the state (`State::write`, `release/mod.rs:285`).
          - **Comparison at the single choke point, `D1Writer::add_at` (`d1/mod.rs:209`):**
            - A row that is unchanged is not written.
            - A changed or new row is written with `release = n`.
            - Keys missing at the end of the build become retirement files: `UPDATE t SET retired = n WHERE retired IS NULL AND key IN (…)`, batched per table and database.
          - **Files:** the release's file set is compared with the hashes held by unpruned releases, kept in state. Only new hashes are written. `release_files` rows are written for every path.
          - **Manifest v3:**
            - `parent` release;
            - per table and database: rows added, rows retired, and the fingerprint and count of every row valid in the release;
            - files with `shared: true` where already held.
          - **Criteria met:** every new Build criterion. "Manifest lists every file … shared ones included." "Each file stored once by SHA-256."
          - **Tests:** fixture builds 1→2 (structure added), 2→3 (source added), 3→4 (source dropped):
            - each delta holds only what changed;
            - the 1→2 delta holds no objects, entries, measurements or tiles;
            - **equivalence:** the rows each release can see equal what a full build of that release writes.

          ### W4: Publish and prune the change
          - **Publish:**
            - Units are added D1 files, then retirement files, then new R2 files (`files/{sha}`), then `release_files`, then the manifest, then `latest`.
            - Checks run over the rows valid in n (`fingerprint_query` with the visibility filter, `fingerprint.rs:207`).
            - The journal is unchanged.
          - **New refusal** in `refuse.rs` next to `NotNewer`: a manifest whose `parent` is not `latest`.
          - **CON-3:** the estimate counts live rows once. Each release records bytes added; prune subtracts what it deletes. Refuse when the live estimate plus the new release's added bytes passes 10 GB.
          - **Prune:**
            - Delete a row when no unpruned release lies in `[release, retired)`. The kept release numbers are inlined, because shards cannot join the catalogue.
            - Delete a file when no unpruned release maps its hash.
          - **Criteria met:** the Publish criteria (only additions uploaded; valid rows match the manifest; refusal off latest) and the Prune criteria (nothing a kept release holds is deleted).
          - **Tests:** MemoryStore publishes 1, 2 and 3:
            - pinned reads of each release are compared before and after later publishes;
            - pruning 1 keeps every row 2 and 3 see;
            - an interrupted publish resumes;
            - publishing on a non-latest parent is refused.
          - Update `fixture_state.rs` and `xtask integration` for schema 6.

          ### W5: Migrate release 10 and make the first additive release
          - **Migration, run by `publish` onto a store at schema 5:**
            - Each table is rebuilt in place with the new key: create, `INSERT … SELECT` with `retired = NULL`, drop, rename.
            - R2 `releases/{n}/…` objects are copied to `files/{sha}` and `release_files` is written, then the old keys are deleted.
            - The numbering maps and the row index for release 10 are seeded from the local D1, so release 11 compares against exactly what is published.
            - A command rebuilds the row index from the store if it is ever lost; this is the decision's obligation.
          - `xtask science` reads the rows valid in a release from the published store rather than from one release's files.
          - **Real run, after the owner's approval:**
            1. Migrate local release 10.
            2. Re-run `bench lookup` and `first-points` (QA-2, 3 s), and time a volume page.
            3. Build release 11 with one structure correction and publish it.
            4. Measure build, publish and storage.
          - **Criteria met:** the migration requirement (rows valid from their release, files by hash, nothing rebuilt or re-uploaded, pinned reads unchanged).
          - **Tests:**
            - A checked-in schema-5 fixture store (made by today's code) migrated, then compared read by read with its schema-5 answers.
            - The real numbers from the run above.

          ## Each wave
          `/simplify` and `/code-review` in parallel, then fix what they find. Then `cargo xtask check`, plus `cargo xtask integration` for W2, W4 and W5. Link traces and accept them, close the wave's Yard log, and merge `--no-ff`.

          ## Risks
          - **Row index size:** about 100 M rows × 32 B is about 3 GB. It is binary and loaded into the build, whose peak is already 55 GB.
          - **Migration rewrite:** rebuilding 37 GB of tables locally may take tens of minutes. It runs once, with progress shown.
          - **Cell scans:** visibility filtering widens them while retired rows await pruning. Prune keeps this small; QA-3 is measured in W5.

          ## Verification
          - Per wave: focused `cargo test -p univ-ingest`/`univ-api`, clippy, `loft check`. At wave end: the full gate and integration.
          - End to end (W5): migrate release 10 locally, then compare pinned reads of release 10 before and after migration on a sample of ids, volume pages and structures. Then build and publish release 11 (one structure), and check that:
            - the publish takes minutes;
            - D1 grows by kilobytes;
            - the explorer shows release 11 with the change;
            - QA-2 still holds.
