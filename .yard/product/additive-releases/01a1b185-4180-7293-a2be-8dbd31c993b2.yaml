        title: "What a release costs today"
        markdown: |-
          ```mermaid
          flowchart LR
            F[fetch --offline] --> N[normalize]
            N --> X[cross-match + ids + structures' members]
            X --> T[tiles]
            T --> R[release dir: D1 SQL, R2 files, manifest]
            R --> P[publish: every row and file]
          ```

          Every stage hands its result to the next in memory; nothing but the downloads and the id state survives a run, and a new build never reads the last release.

          | Step | Release 10 | Note |
          |---|---|---|
          | Build, offline | **15 min**, 55 GB peak | normalize 11 s and cross-match 2.5 min on the 21 M-entry rehearsal; most of the rest writes 37 GB of D1 SQL |
          | Publish | **1 h 35 min** | 1,215 D1 files into 7 shards and the catalogue, 4,680 R2 objects, each checked |
          | Storage | 37 GB D1 + 0.7 GB tiles + 0.4 GB grids | every row carries `release` in its key; release n+1 copies every row of n |

          **Where a change lands**

          | Change | What really differs |
          |---|---|
          | A new structure | `structures`, `structure_details`, `structure_cells` and a few counts in the catalogue: kilobytes. Tiles and the 7 object shards are untouched. |
          | A new or changed source | its entries and their objects, the cells and tiles they fall in, possibly merges that renumber nothing (ids stay stable) but move objects between shards |
          | Matching or ranking rules | potentially every object |

          **What the spec holds fixed**: releases are immutable and any unpruned one can be read (ADR-16); two reads pinned to a release agree whatever is published later (AC-128); the manifest lists every file with its SHA-256; CON-3 budgets each release at 4.5 GB per database so the next can be published before the last is pruned.

          **So**: a structure costs a full 15-minute build and a 95-minute publish for kilobytes of change. Publishing, not building, is 86% of the time; the manifest already fingerprints every table of every shard, which is enough to tell what did not change.
        tone: info
