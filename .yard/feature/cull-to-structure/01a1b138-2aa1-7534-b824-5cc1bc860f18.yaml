    id: perf-cull
    kind: note
    versions:
      - key: 01a1b168-a70f-738c-bbee-d9022b902181
        at: 2026-11-06T15:09:48Z
        revision: 21
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "The inside test, measured"
        markdown: |-
          Node 24, 6 M random points all inside the volume's box (the worst case), main thread:

          | Volume | Before | After |
          |---|---|---|
          | Sky region, order 6 | 1,265 ms | 375 ms |
          | Ball | 90 ms | 89 ms |

