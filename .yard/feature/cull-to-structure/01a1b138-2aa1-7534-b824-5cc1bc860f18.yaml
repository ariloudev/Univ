  - key: 01a1b168-541d-7237-9e12-8efbd46220d1
    id: review-cull-findings
    kind: note
    versions:
      - key: 01a1b168-541d-7237-9e12-8efd76ecbae7
        at: 2026-11-06T15:09:26Z
        revision: 20
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "What /simplify and /code-review found, and what changed"
        markdown: |-
          **Fixed** (`53ca78d`)

          | Finding | From | Change |
          |---|---|---|
          | Extents are ICRS vectors but were turned from the shape's frame again, in the drawing too (an existing bug: Local Void, Hercules Void and the others drew their extent lines askew) | code-review | `halfExtents` scales and does not turn; a supergalactic test pins it |
          | Shape placing copied between `structures.ts` and `volume.ts`; order 21–24 regions drawn as a box but culled exactly | all four reviewers | `placingOf`, `primitiveAxes`, `halfExtents`, `placed`, `FINEST_ORDER` shared |
          | Roots outside the volume fetched and kept | code-review | roots filtered in `plan` and dropped by `setCull` |
          | A reload with `?inside=` fetched before the cull applied | code-review | the catalogue starts culled to `NOTHING` until the structure is read |
          | `?inside=` kept for a structure with no volume | code-review | such a structure turns the cull off |
          | Reload fly kept after another choice | code-review | dropped once the choice changes |
          | UI pushed masks to the renderer from two places; fading tiles kept stale masks; buffers kept after the cull | altitude, code-review, efficiency | the renderer pulls `inside(id)` through `DrawnDetail` and lets the buffer go |
          | Two maps per tile; the full count rebuilt on uncull | simplification, efficiency | one record: full count, culled count, mask |
          | Sky test 1.3 s at 6 M points (allocation, arithmetic interleave, `Set`) | efficiency | `cellAt` by numbers, 32-bit interleave, cell bitmap, per-kind testers, tiles wholly outside skipped |
          | Tiles with nothing inside still drawn | efficiency, altitude | their share is 0, so they are not drawn |
          | Fly-to repeated in Scene | reuse | `flyToStructure` |

          **Not changed**

          - `within` as an extra planner argument rather than an options object: low value.
          - Picking still runs a closure over a culled tile's points within the pick slop; `drawnPoints` returning "none" for empty tiles was left, since their share is 0 and they are not drawn.
          - The masks are worked out on the main thread; after the rewrite a sky region costs far less, and a worker is left for later.
        tone: info
