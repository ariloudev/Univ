        title: "Every point outside is hidden"
        consequence: "One rule for every domain: stars stay only for structures around Earth. The shader's existing hide test gains a volume test; masks and kinds are untouched."
        question: 01a1b138-2aa1-7534-b824-5cc36d220134
  - key: 01a1b13b-b825-73ae-9757-53d4d673484f
    id: d-shapes
    kind: decision
    number: 2
    versions:
      - key: 01a1b13b-b825-73ae-9757-53d9e6e1b51e
        at: 2026-11-06T14:20:43Z
        revision: 3
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "No published volume: the drawn box"
        consequence: "Spheres, ellipsoids, oriented boxes and sky regions cull exactly; member lists, extents and bounds cull by the box the view already draws, and the panel says the cull is approximate for them. A structure drawn with no volume (a point alone, a path) offers no cull."
        question: 01a1b138-2aa1-7534-b824-5cc48276155b
  - key: 01a1b13b-b825-73ae-9757-53d5f7547f9a
    id: d-control
    kind: decision
    number: 3
    versions:
      - key: 01a1b13b-b825-73ae-9757-53daa07316bd
        at: 2026-11-06T14:20:43Z
        revision: 3
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "A checkbox in the structure's panel"
        consequence: "The cull belongs to the chosen structure: kept in the address beside it, carried to the next one chosen, and off when its panel closes."
        question: 01a1b138-2aa1-7534-b824-5cc5e5273278
  - key: 01a1b13b-b825-73ae-9757-53d60d8dbecb
    id: d-loading
    kind: decision
    number: 4
    versions:
