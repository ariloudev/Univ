        revision: 3
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "The budget is spent inside the volume"
        consequence: "While culling, the planner fetches and keeps only tiles whose cubes meet the volume's box, so the interior reaches full density; level of detail still thins it by distance."
        question: 01a1b138-2aa1-7534-b824-5cc605af26c6
