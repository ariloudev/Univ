        revision: 25
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Approve the fixes for the eight review findings"
        markdown: |-
          Each finding is resolved where the review pointed. `loft fmt --check` and `loft check --fail-on warning` pass. Approving commits `spec/` as `spec: resolve review findings on the first draft`.

          | # | Finding | Resolution |
          |---|---|---|
          | P1 | Unbounded octree-node list | At most **4,096 nodes per scale domain**, at the deepest level (no deeper than the client asks) that fits. The response names the level chosen. The decision's outcome says the same. |
          | P2 | Retired private layer leaks with 410 | 410 only for callers allowed to read the layer. Everyone else gets the **same 404 as a missing layer**. |
          | P2 | Revisions skip validation | New refusal Requirement: a revision is checked exactly like a publication, including **at least one source**. Nothing is stored, and the version and change sequence don't move. |
          | P2 | Pruned releases listed and not listed | The listing returns **every release ever published**, with pruned ones marked by their pruning time. |
          | P2 | Pages shift when layers change | Each cursor records the release and **each layer's change sequence**. A later page after a layer changed is refused with **409**, listing the layers, so a result is never skipped or repeated. Snapshots would need the as-of reads you dropped with 4D, so I didn't use them. |
          | P2 | No scale domain for a cross-matched object | The object belongs to the domain named by the **source of its preferred measurement**. |
          | P2 | Redirects break pinned reads | Merges and splits apply **as of the release read**: a pinned release where the id still exists returns that object. |
          | P2 | Ids lost when new entries join | An object's id follows its **carried-over entries**. New entries joining, or entries dropping out, don't change it. An object made only of new entries gets a new id. |

          One thing to look at: the 409 on a stale cursor means a client paging through a busy layer may have to restart its query. The alternative is a snapshot read, which needs the as-of machinery you removed.
