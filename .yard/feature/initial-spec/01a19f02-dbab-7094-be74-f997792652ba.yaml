        title: "Time is a full axis: epochs, events, lookback time and as-of history"
        consequence: "Each position names its epoch, and stars carry the motion needed to move them to another epoch. Layer items and events have time records that volume queries can filter on. Objects carry a lookback time under the release's cosmology. Reads can ask for the state as of a past release or a past layer version, so the server keeps history rather than overwriting it."
        question: 01a19f0d-0f67-7301-99ac-b3fc69635039
