blocks:
  - key: 01a19f06-6833-7679-b0af-8517b983ccb0
    id: q-clients
    kind: question
    versions:
      - key: 01a19f06-6833-7679-b0af-8521b3b84add
        at: 2026-11-03T01:29:19Z
        revision: 4
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        prompt: "Who calls univ-server, and who may write to it?"
        header: "Who uses it"
        context: "Reading the data could stay anonymous, as the newsroom's `keep-public-access-anonymous` decision does. Authoring layers needs some form of identity, and the choice decides whether the spec needs accounts, ownership and moderation."
        options:
          - label: "Public read, keyed writes"
            detail: "Anyone can read reference data and public layers. Writing needs an API key issued per client app, such as the newsroom. No end-user accounts. This keeps the Worker simple and fits a hobby project with a few trusted clients."
            recommended: true
          - label: "Owner only"
            detail: "Only you read and write, behind one secret. Simplest, but nothing can be public and other apps can't build on it."
          - label: "End-user accounts"
            detail: "People sign in (e.g. with Cloudflare Access or OAuth) and author their own layers. This brings in ownership, privacy, quotas and moderation, a large part of the spec."
    responses:
      - key: 01a19f0b-c773-72d2-bf5d-46dc8eb32860
        at: 2026-11-03T01:35:11Z
        revision: 5
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "Public read, keyed writes"
  - key: 01a19f06-6833-7679-b0af-85184a03a8ae
    id: q-domains
    kind: question
    versions:
      - key: 01a19f06-6833-7679-b0af-852245d5837f
        at: 2026-11-03T01:29:19Z
        revision: 4
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        prompt: "Which kinds of reference data should the first version serve?"
        header: "First data"
        context: "Each domain brings its own sources, frames and ways of measuring distance. The newsroom covered all of them in a small way. The spec can name every domain and still specify only the first ones in depth."
        options:
          - label: "Galaxies and cosmic web"
            detail: "SDSS, 6dFGS, BOSS and Cosmicflows-4 galaxies with redshift or redshift-independent distances. The work is already proven and the newsroom atlas could consume it straight away."
            recommended: true
          - label: "Large structures"
            detail: "Voids, walls, superclusters, Laniakea basins and density fields: reconstructions and shapes taken from papers. This is where the 3D geometry lives."
            recommended: true
          - label: "Local Group and nearby"
            detail: "McConnachie 2012, UNGC 2013 and named landmarks: small, curated, with mixed distance methods."
            recommended: true
          - label: "Stars and Milky Way"
            detail: "Gaia DR3 and Hipparcos: huge (1.8 billion sources in Gaia) unless cut to the nearby or bright ones. The earlier session called it \"its own piece of work\"."
          - label: "Solar System bodies"
            detail: "Planets, small bodies and spacecraft from JPL Horizons and MPC. Their positions depend on time (ephemerides), which is a different model from catalogues."
          - label: "Transient events"
            detail: "GW, GRB, neutrino, nova and supernova alerts from GCN, GraceDB and TNS, as reference records that a newsroom layer can cite."
        multiple: true
    responses:
      - key: 01a19f0b-c773-72d2-bf5d-46ddaa1e4554
        at: 2026-11-03T01:35:11Z
        revision: 5
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "Galaxies and cosmic web"
          - "Large structures"
          - "Local Group and nearby"
          - "Stars and Milky Way"
  - key: 01a19f06-6833-7679-b0af-851940cfa849
    id: q-format
    kind: question
    versions:
      - key: 01a19f06-6833-7679-b0af-8523385de9e0
        at: 2026-11-03T01:29:19Z
        revision: 4
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        prompt: "How should clients get bulk data such as a million galaxy positions?"
        header: "Format"
        context: "The newsroom ships whole-survey `.bin` files of uint16 (ra, dec, z), 7.4 MB in total, with no tiling. A Worker serves small JSON well and can stream large R2 objects cheaply, but shouldn't compute big responses per request."
        options:
          - label: "JSON API + binary tiles"
            detail: "A JSON API for objects, structures, sources and layers, plus bulk points as pre-built binary tiles in R2: spatial cells (HEALPix by distance shell, or an octree) at several levels of detail, each with a manifest. Cheap to serve from Workers, with level of detail and no recomputation. The tile format becomes part of the spec."
            recommended: true
          - label: "JSON API + whole-survey files"
            detail: "Keep the newsroom's approach: one file per survey (with higher precision), streamed from R2. Simplest, but the client downloads everything, which won't scale to Gaia or DESI."
          - label: "Query API (SQL-like)"
            detail: "Clients send cone, box or redshift-range queries answered from D1. Flexible, but D1's size limits and Worker CPU make bulk queries slow and costly. Better suited to object lookup than to bulk points."
    responses:
      - key: 01a19f0b-c773-72d2-bf5d-46de6299b005
        at: 2026-11-03T01:35:11Z
        revision: 5
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "JSON API + binary tiles"
  - key: 01a19f06-6833-7679-b0af-851a10ca5b58
    id: q-normalize
    kind: question
    versions:
      - key: 01a19f06-6833-7679-b0af-85249b20ee57
        at: 2026-11-03T01:29:19Z
        revision: 4
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        prompt: "Where are derived positions, such as 3D Cartesian coordinates under a cosmology, computed?"
        header: "Derived values"
        context: "The rule so far: store what was measured (sky position, redshift, distance modulus) and derive distances in code with a named cosmology. The question is whether the server ships derived values, and for which cosmologies."
        options:
          - label: "Ingest derives, both shipped"
            detail: "The ingest CLI keeps native values and also precomputes derived ones under Planck 2018, in named frames (ICRS, galactic, supergalactic Cartesian). Clients get both, labelled with the cosmology and the transformation. Another cosmology means another ingest run. Fast clients with an explicit lineage."
            recommended: true
          - label: "Native only"
            detail: "The server ships measured values only, and each client derives positions with a shared library (e.g. univ-model compiled to WASM). Most flexible, but every client repeats the work and can get it wrong."
          - label: "Server derives on request"
            detail: "The Worker converts per request for any requested cosmology. Flexible, but costs CPU on bulk data and makes caching harder."
    responses:
      - key: 01a19f0b-c773-72d2-bf5d-46df7ebdcae1
        at: 2026-11-03T01:35:11Z
        revision: 5
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "Ingest derives, both shipped"
  - key: 01a19f06-6833-7679-b0af-851bee48878c
    id: q-identity
    kind: question
    versions:
      - key: 01a19f06-6833-7679-b0af-8525f79e7c35
        at: 2026-11-03T01:29:19Z
        revision: 4
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        prompt: "Should the first version cross-match the same object across catalogues?"
        header: "Cross-match"
        context: "The same galaxy can appear in SDSS, 6dFGS and Cosmicflows-4. Without cross-matching it's counted twice. With it, there's one identity per object, with a confidence score and a record of the evidence."
        options:
          - label: "Identity table, later"
            detail: "Specify identities now (one object, several catalogue entries, a match confidence and method). The first version keeps each catalogue as its own source and marks the overlap with footprints. Building the matcher waits."
            recommended: true
          - label: "Cross-match in v1"
            detail: "The ingest CLI matches by position and redshift tolerance, and the server serves deduplicated objects. Most correct for display, but fuzzy matching is a project of its own."
          - label: "Never"
            detail: "Catalogues stay separate forever. Simplest, but a layer can't refer to \"M31\" as a single thing."
    responses:
      - key: 01a19f0b-c773-72d2-bf5d-46e071b696e1
        at: 2026-11-03T01:35:11Z
        revision: 5
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "Cross-match in v1"
  - key: 01a19f06-6833-7679-b0af-851c50d83410
    id: q-layers
    kind: question
    versions:
      - key: 01a19f06-6833-7679-b0af-85262159378f
        at: 2026-11-03T01:29:19Z
        revision: 4
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        prompt: "What can a client-authored layer hold?"
        header: "Layers"
        context: "In the newsroom, a story is a versioned snapshot with claims, sources, typed uncertainty, a geometry (point, region, range, ray or trajectory) and time records. Of the options below, the first is the minimum a newsroom layer needs."
        options:
          - label: "Features with geometry + time"
            detail: "Items with a geometry (point, region, credible area, range, ray, trajectory, shape) in a named frame, optional time records (event, arrival, discovery), and typed uncertainty, validated by univ-model. Enough to rebuild the newsroom's stories as a layer."
            recommended: true
          - label: "Links to reference objects"
            detail: "An item can point at univ-server's own objects or structures (\"this event's host galaxy is X\") as well as carrying its own geometry."
            recommended: true
          - label: "Versions and provenance"
            detail: "Each item is versioned (corrections and retractions publish new versions) and cites its sources, as newsroom snapshots do."
            recommended: true
          - label: "Free-form properties"
            detail: "Arbitrary JSON properties per item, for client-specific data the server doesn't interpret."
        multiple: true
    responses:
      - key: 01a19f0b-c773-72d2-bf5d-46e1a39a5a21
        at: 2026-11-03T01:35:11Z
        revision: 5
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "Features with geometry + time"
          - "Links to reference objects"
          - "Versions and provenance"
        words: "Outside of this question: the server should support \"bounded\" queries, i.e. asking for objects it knowns within a certain volume. I also think we might want to have some sort of 4D (spacetime-like, dedup'd storage)"
  - key: 01a19f06-6833-7679-b0af-851da240da83
    id: q-newsroom
    kind: question
    versions:
      - key: 01a19f06-6833-7679-b0af-8527660b47fc
        at: 2026-11-03T01:29:19Z
        revision: 4
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        prompt: "Should the cosmic-newsroom experiment become univ-server's first client?"
        header: "Newsroom"
        context: "The Univ rules keep experiments from sharing code or data unless asked. If the newsroom is the first client, univ-server's API and layer model are shaped to replace its static `.bin` files and to host its stories as a layer."
        options:
          - label: "Yes, first client"
            detail: "Specify univ-server so that the newsroom's atlas data and stories can move onto it. That gives the spec a concrete acceptance target. Moving the newsroom over is separate work in its own repository, done later."
            recommended: true
          - label: "Independent for now"
            detail: "Treat the newsroom only as inspiration. univ-server's API is designed on its own, and any migration is decided later."
    responses:
      - key: 01a19f0b-c773-72d2-bf5d-46e2ff04b9be
        at: 2026-11-03T01:35:11Z
        revision: 5
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "Independent for now"
  - key: 01a19f0d-0f67-7301-99ac-b3f511c87639
    id: d-clients
    kind: decision
    number: 1
    versions:
      - key: 01a19f0d-0f67-7301-99ac-b404b19573a2
        at: 2026-11-03T01:36:35Z
        revision: 6
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Public read, keyed writes"
        consequence: "Reference data and public layers are readable anonymously. Writing requires an API key issued per client app. The spec covers key issuance, revocation and per-key ownership of layers, but has no end-user accounts, sign-in or moderation."
        question: 01a19f06-6833-7679-b0af-8517b983ccb0
  - key: 01a19f0d-0f67-7301-99ac-b3f614c9c60d
    id: d-domains
    kind: decision
    number: 2
    versions:
      - key: 01a19f0d-0f67-7301-99ac-b4055add21d3
        at: 2026-11-03T01:36:35Z
        revision: 6
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Galaxies, large structures, the Local Group and nearby galaxies, and stars of the Milky Way"
        consequence: "The first version specifies four reference domains: galaxy surveys (SDSS, 6dFGS, BOSS, CF4), large structures and fields, the Local Group and nearby galaxies, and Milky Way stars (Gaia DR3, Hipparcos). Solar System ephemerides and transient-alert feeds are out of the first version. Gaia's size needs a decision on how much of it to take."
        question: 01a19f06-6833-7679-b0af-85184a03a8ae
  - key: 01a19f0d-0f67-7301-99ac-b3f78abd3868
    id: d-format
    kind: decision
    number: 3
    versions:
      - key: 01a19f0d-0f67-7301-99ac-b406c488a121
        at: 2026-11-03T01:36:35Z
        revision: 6
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "JSON API plus pre-built binary tiles"
        consequence: "Objects, structures, sources and layers are served as JSON. Bulk points are pre-built binary tiles at several levels of detail, stored in R2 with manifests. The tile layout and encoding are part of the spec and are produced by the ingest CLI, not the Worker."
        question: 01a19f06-6833-7679-b0af-851940cfa849
  - key: 01a19f0d-0f67-7301-99ac-b3f8228948aa
    id: d-normalize
    kind: decision
    number: 4
    versions:
      - key: 01a19f0d-0f67-7301-99ac-b4072e972d22
        at: 2026-11-03T01:36:35Z
        revision: 6
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Ingest derives; native and derived values are both served"
        consequence: "Every record keeps its native measured values. The ingest CLI also writes derived Cartesian positions under a named cosmology (Planck 2018 to start) and in named frames, with each transformation recorded. A different cosmology means a new ingest run, not a per-request computation."
        question: 01a19f06-6833-7679-b0af-851a10ca5b58
  - key: 01a19f0d-0f67-7301-99ac-b3f9a9ed38a6
    id: d-identity
    kind: decision
    number: 5
    versions:
      - key: 01a19f0d-0f67-7301-99ac-b4082112e82c
        at: 2026-11-03T01:36:35Z
        revision: 6
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Cross-match catalogues in the first version"
        consequence: "The ingest CLI resolves catalogue entries into one identity per astrophysical object, with a match method, confidence and evidence. The server serves deduplicated objects, so the spec must state how matching works, how ambiguous matches are held and which value wins when catalogues disagree."
        question: 01a19f06-6833-7679-b0af-851bee48878c
  - key: 01a19f0d-0f67-7301-99ac-b3fac7681ef1
    id: d-layers
    kind: decision
    number: 6
    versions:
      - key: 01a19f0d-0f67-7301-99ac-b409cf71e354
        at: 2026-11-03T01:36:35Z
        revision: 6
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Layers hold geometry and time, link to reference objects, and are versioned with provenance"
        consequence: "A layer item has a typed geometry in a named frame, optional time records, typed uncertainty, links to reference objects, versions (including corrections and retractions) and cited sources. Free-form properties are left out. Two further asks came with this answer: bounded volume queries and 4D spacetime storage without duplicates. Both are followed up in the next round."
        question: 01a19f06-6833-7679-b0af-851c50d83410
  - key: 01a19f0d-0f67-7301-99ac-b3fba8d19737
    id: d-newsroom
    kind: decision
    number: 7
    versions:
      - key: 01a19f0d-0f67-7301-99ac-b40a3cc44e01
        at: 2026-11-03T01:36:35Z
        revision: 6
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "univ-server stands independent of cosmic-newsroom"
        consequence: "The API and layer model are designed for univ-server's own goals. The newsroom serves only as prior art, and no acceptance criterion depends on moving it over. The Univ rule against sharing code between experiments stands."
        question: 01a19f06-6833-7679-b0af-851da240da83
  - key: 01a19f0d-0f67-7301-99ac-b3fc69635039
    id: q-4d
    kind: question
    versions:
      - key: 01a19f0d-0f67-7301-99ac-b40b044c3025
        at: 2026-11-03T01:36:35Z
        revision: 6
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        prompt: "What should \"4D, spacetime-like, deduplicated storage\" mean for univ-server?"
        header: "4D storage"
        context: "You asked for some form of 4D storage without duplicates. The options below are the readings I can see, and several can hold at once. Deduplication across catalogues is already settled by the cross-match decision; this question is about the time axis."
        options:
          - label: "Positions at an epoch"
            detail: "Every position states the epoch it holds for. Stars carry proper motion and radial velocity (from Gaia), so a client can ask where a star is at any time. Galaxies are effectively static on human timescales."
            recommended: true
          - label: "Events in spacetime"
            detail: "Layer items and future transients are located in space **and** time (event, arrival and discovery times, as in the newsroom), and bounded queries can filter on time as well as volume."
            recommended: true
          - label: "Light-cone / lookback"
            detail: "Each object also carries the cosmic time at which the light we see left it, under the named cosmology. A galaxy at z = 0.3 is seen as it was roughly 3.5 Gyr ago, so queries and views can be framed in lookback time."
            recommended: true
          - label: "Bitemporal history"
            detail: "The server keeps what was known when: each data release or correction adds a version, and a client can query the state as of a past release. This is close to the dataset-versioning question below."
        multiple: true
    responses:
      - key: 01a19f12-0449-7394-a8a8-1848fa858a70
        at: 2026-11-03T01:42:00Z
        revision: 7
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "Positions at an epoch"
          - "Events in spacetime"
          - "Light-cone / lookback"
          - "Bitemporal history"
  - key: 01a19f0d-0f67-7301-99ac-b3fd2d6ffe8f
    id: q-volume
    kind: question
    versions:
      - key: 01a19f0d-0f67-7301-99ac-b40c97964a6b
        at: 2026-11-03T01:36:35Z
        revision: 6
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        prompt: "What should a bounded volume query return?"
        header: "Bounded query"
        context: "Bulk points are served as tiles (already decided), but you also want to ask \"what does the server know inside this volume?\". The Worker can answer that from an index of spatial cells kept in D1 (about 10 GB per database). Matching objects are checked against the exact shape."
        options:
          - label: "Objects, capped + tiles"
            detail: "The query takes a shape (box, sphere, or cone with a distance range) in a named frame and cosmology, plus filters (kind, catalogue, time range). It returns matching named objects, structures and layer items as paginated JSON with a hard cap. For bulk points it returns the list of tiles that cover the volume. Bounded cost per request."
            recommended: true
          - label: "Everything, streamed"
            detail: "Same shapes, but every matching point is streamed back, galaxies and stars included. Simple for clients, but a large volume could mean millions of rows and long Worker run times."
          - label: "Counts and tiles only"
            detail: "The query returns counts per kind and the covering tiles, and clients fetch the tiles. The cheapest option, but you can't list \"what's in here\" by name."
    responses:
      - key: 01a19f12-0449-7394-a8a8-1849748cbba2
        at: 2026-11-03T01:42:00Z
        revision: 7
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "Objects, capped + tiles"
  - key: 01a19f0d-0f67-7301-99ac-b3fee2ba6048
    id: q-gaia
    kind: question
    versions:
      - key: 01a19f0d-0f67-7301-99ac-b40d26406ba5
        at: 2026-11-03T01:36:35Z
        revision: 6
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        prompt: "How much of Gaia DR3 should the first version take?"
        header: "Gaia scope"
        context: "Gaia DR3 holds about 1.8 billion sources, too many for this setup. Distances should come from Bailer-Jones et al. 2021 (geometric and photogeometric), not from inverting the parallax, which is biased for faint or distant stars."
        options:
          - label: "100 pc + bright stars"
            detail: "The Gaia Catalogue of Nearby Stars (Smart et al. 2021, 331,312 objects within 100 pc) plus a brightness cut (e.g. G < 12, a few million stars) for the Milky Way's shape, with Hipparcos for the brightest. Fits D1 and R2 easily and covers \"stars around us\" plus the visible Galaxy."
            recommended: true
          - label: "Nearby only"
            detail: "Only the 100 pc catalogue and Hipparcos. Smallest, but the Milky Way scale stays a schematic."
          - label: "Large, tiled"
            detail: "Tens to hundreds of millions of stars (e.g. G < 17 or a parallax-quality cut), as level-of-detail tiles in R2 with only named stars in D1. Gives the best Milky Way, but ingest takes hours and storage grows to tens of GB."
    responses:
      - key: 01a19f12-0449-7394-a8a8-184abe37625a
