  - key: 01a19f0d-0f67-7301-99ac-b3ff319a4dcb
    id: q-merge
    kind: question
    versions:
      - key: 01a19f0d-0f67-7301-99ac-b40ee96b430f
        at: 2026-11-03T01:36:35Z
        revision: 6
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        prompt: "When cross-matched catalogues disagree on a value, what does the merged object show?"
        header: "Disagreeing data"
        context: "Example: one galaxy has an SDSS spectroscopic redshift, a 6dFGS redshift and a Cosmicflows-4 redshift-independent distance. Its 3D position depends on which distance is used."
        options:
          - label: "All kept, one preferred"
            detail: "The object keeps every measurement with its source. A documented ranking picks a preferred value for the derived position (e.g. parallax or redshift-independent distance > spectroscopic redshift > photometric redshift), and the object says which one was picked. Ambiguous matches are kept as candidates, not merged."
            recommended: true
          - label: "Combined estimate"
            detail: "Compatible measurements are combined into one value weighted by their uncertainties. Statistically neater, but it creates new values no source published, which makes provenance harder to state."
          - label: "Client chooses"
            detail: "Nothing is preferred. Each client picks which source's value to use. Most neutral, but there's no ready 3D position for every object."
    responses:
      - key: 01a19f12-0449-7394-a8a8-184bdb4d5ebb
        at: 2026-11-03T01:42:00Z
        revision: 7
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "All kept, one preferred"
  - key: 01a19f0d-0f67-7301-99ac-b400fc7ccc91
