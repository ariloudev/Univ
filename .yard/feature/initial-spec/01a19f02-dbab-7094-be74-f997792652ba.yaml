  - key: 01a19f13-335d-7690-8368-87d38f334221
    id: outline
    kind: approval
    versions:
      - key: 01a19f13-335d-7690-8368-87e17e48eb6d
        at: 2026-11-03T01:43:18Z
        revision: 8
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Proposed outline of the specification"
        markdown: |-
          The decisions so far shape the outline below. Approving it settles the structure. Changing a Feature's place now costs one line, and every criterion beneath it later. The answers to the five questions above change only details within this outline.

          ```mermaid
          flowchart LR
            subgraph local[Your machine]
              ING[Univ Ingest CLI]
            end
            SRC[(Public data providers<br/>SkyServer · VizieR · Gaia archive · Cosmicflows)] --> ING
            ING -- releases: tiles --> R2[(R2)]
            ING -- releases: objects, identities, cell index --> D1[(D1)]
            subgraph cf[Cloudflare Workers]
              API[Univ Server Worker]
            end
            R2 --> API
            D1 --> API
            API -- JSON + tiles + OpenAPI --> CL[Clients, e.g. a TS web app]
            CL -- keyed writes: layers --> API
            MODEL[univ-model, shared crate] -.-> ING
            MODEL -.-> API
          ```

          ### Product 1: Univ Server, the Worker that clients call

          | Feature Group | Features |
          |---|---|
          | Reference data | Look up an object (by id or catalogue name; merged ids redirect) · Read a structure and its geometry · Read a source and its provenance · List and pin releases |
          | Bulk data | Fetch a tile manifest · Fetch point tiles by octree node and level of detail · Fetch a volume grid |
          | Spatial and temporal queries | Query a bounded volume · Filter by time · Read as of a past release · Place a star at an epoch |
          | Layers | Create and configure a layer · Publish a layer item · Correct or retract an item · Read a layer · Follow a layer's changes |
          | Access | Read anonymously · Write with an API key · Issue and revoke keys · Enforce quotas and rate limits |
          | API contract | Read the OpenAPI document · Decode the tile format |

          ### Product 2: Univ Ingest, the local CLI that builds and publishes releases

          | Feature Group | Features |
          |---|---|
          | Acquisition | Define a source (query, cuts, licence, credit) · Fetch a source durably (retries, mirrors, resumable cache, digests) |
          | Normalization | Normalize records (frames, units, typed distances, typed uncertainty, kind of value) · Derive positions and lookback time under a named cosmology · Record a researched structure from its paper |
          | Identity | Cross-match catalogues · Choose the preferred measurement · Keep identities stable across releases |
          | Releases | Build octree tiles · Build a release and its manifests · Publish a release to local or deployed storage · Prune old releases |

          ### Components

          - **Shared:** univ-model (types, validation, frames, cosmology, geometry).
          - **Univ Server:** HTTP API and OpenAPI; reference reader; spatial index and query; layer store; access control.
          - **Univ Ingest:** source connectors; normalizer; cross-matcher; tile builder; release publisher.
          - **External:** Cloudflare Workers runtime, D1 and R2; SDSS SkyServer; VizieR (CDS and the SAAO mirror); ESA Gaia archive; the Cosmicflows site.

          ### Constraints for the whole document

          - Univ Server runs on Cloudflare Workers, written in Rust and built to WebAssembly with `workers-rs`.
          - Univ Ingest is a native Rust CLI.
          - Real data only, with primary sources cited. Native values are kept beside derived ones. Every frame, epoch and cosmology is named. Uncertainty is typed, and measured, estimated, inferred and reconstructed values stay distinct.

          ### Decisions recorded in `spec/decisions/`

          The 15 choices recorded in the Yard Log so far, plus hosting on Workers and offline ingestion.

          ### Left out of the first version, as stated scope

          Solar System ephemerides, live transient-alert feeds, end-user accounts, sharing lists for private layers, and meshes (pending your answer).
