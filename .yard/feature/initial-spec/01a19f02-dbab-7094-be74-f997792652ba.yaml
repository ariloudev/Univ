  - key: 01a19f0d-0f67-7301-99ac-b401ae23d7c7
    id: q-releases
    kind: question
    versions:
      - key: 01a19f0d-0f67-7301-99ac-b410742c7ee6
        at: 2026-11-03T01:36:35Z
        revision: 6
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        prompt: "How should reference data change over time?"
        header: "Data versions"
        context: "Each ingest run produces new tiles, objects and identities. Clients and layers point at reference objects, so object ids and positions shouldn't shift under them without warning."
        options:
          - label: "Immutable releases"
            detail: "Each ingest publishes a numbered release (tiles, objects and manifests) that never changes afterwards. `latest` follows the newest release, and a client can pin one. Object identities stay stable across releases, with superseded and merged ids redirected. Old releases are kept until you prune them."
            recommended: true
          - label: "Latest only"
            detail: "Each ingest replaces what was there. Simplest, but layer links can silently move to a different object."
    responses:
      - key: 01a19f12-0449-7394-a8a8-184d353c8159
        at: 2026-11-03T01:42:00Z
