          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Volume queries return capped object lists and covering tiles"
        consequence: "A query names a shape (box, sphere, or cone with a distance range), a frame, a cosmology and filters, including time. It returns named objects, structures and layer items, paginated with a hard cap, plus the tiles that cover the volume. It never streams every bulk point, so each request has a bounded cost. D1 holds a spatial cell index for this."
