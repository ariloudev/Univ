          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        prompt: "Who can read a client-authored layer?"
        header: "Layer access"
        context: "Writes need an API key (decided). This is about reading."
        options:
          - label: "Public or private"
            detail: "Each layer is marked public (anyone reads) or private (readable only with its owning key). One flag, without the cost of sharing lists."
            recommended: true
          - label: "Always public"
            detail: "Every layer is public once written. Simplest, but nothing can be drafted privately."
          - label: "Shared per key"
            detail: "Private layers can be shared with chosen other keys, adding access lists and more endpoints to the spec."
    responses:
