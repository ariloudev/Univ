  - key: 01a19f13-335d-7690-8368-87ce67a3d585
    id: q-shapes
    kind: question
    versions:
      - key: 01a19f13-335d-7690-8368-87dca1e58b7e
        at: 2026-11-03T01:43:18Z
        revision: 8
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        prompt: "Which kinds of geometry should structures and layer items be able to carry?"
        header: "Shapes"
        context: "The newsroom used points, credible regions, distance ranges, rays and trajectories for events, and spheres, paths, member lists, basins and contours for structures. Each kind needs a schema, validation, a bounding volume for the spatial index and a client encoding."
        options:
          - label: "Points, rays, ranges"
            detail: "A position, a direction with an error radius, or a direction with a distance interval, each with typed uncertainty. The minimum for events."
            recommended: true
          - label: "Primitives"
            detail: "Sphere, ellipsoid and box in a named frame. These cover most structures from papers, such as supercluster extents and void radii."
            recommended: true
          - label: "Paths and members"
            detail: "Polylines (filaments, walls, trajectories) and member lists (a structure traced by named galaxies, quasars or absorbers), as the newsroom drew the Giant Arc."
            recommended: true
          - label: "Sky regions (MOC)"
            detail: "Regions of the sky as HEALPix Multi-Order Coverage maps: GW and GRB credible areas and survey footprints. This is the IVOA standard."
            recommended: true
          - label: "Volume grids"
            detail: "3D scalar fields such as the CF4++ density (128³), served as binary volumes, with contours and basins derived from them."
            recommended: true
          - label: "Meshes"
            detail: "Arbitrary triangle meshes (e.g. glTF) for iso-surfaces or hand-made shapes. Flexible, but heavy to validate and to index."
        multiple: true
    responses:
      - key: 01a19f18-10ee-7661-85f5-77d6bcd48345
        at: 2026-11-03T01:48:36Z
        revision: 10
