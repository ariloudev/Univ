  - key: 01a19f0d-0f67-7301-99ac-b4035b1508ce
    id: q-tiles
    kind: question
    versions:
      - key: 01a19f0d-0f67-7301-99ac-b412c8c968a8
        at: 2026-11-03T01:36:35Z
        revision: 6
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        prompt: "How should bulk-point tiles divide space?"
        header: "Tile layout"
        context: "The data covers a huge range of distances, from parsecs (nearby stars) to gigaparsecs (BOSS), and the earlier atlas had ten scale levels. Tiles carry derived Cartesian positions; native values stay in the object API."
        options:
          - label: "Octree per scale"
            detail: "A Cartesian octree in one canonical frame (ICRS equatorial, in light-years or Mpc), with a separate root per scale domain (stars, nearby galaxies, cosmic web) and levels of detail by subsampling. Fits 3D views and volume queries naturally, and clients rotate to galactic or supergalactic with a fixed matrix given in the manifest."
            recommended: true
          - label: "HEALPix × shells"
            detail: "Sky cells (HEALPix) crossed with logarithmic distance shells. Natural for an observer at Earth and for sky-coverage footprints, but awkward for volumes away from the observer."
          - label: "Decide in the spec later"
            detail: "The spec states the performance and level-of-detail requirements and leaves the layout to an Architecture Decision made during the build."
    responses:
      - key: 01a19f12-0449-7394-a8a8-184ff7d69dcc
        at: 2026-11-03T01:42:00Z
        revision: 7
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "Octree per scale"
  - key: 01a19f13-335d-7690-8368-87c6677a609e
