        title: "Admit a source by its terms; 2MRS comes in through its published ApJS table on VizieR"
        consequence: "Each source definition records its terms of use and the credit it requires, and ingest refuses to publish a source whose terms forbid redistribution of its data. The \"U.S. Government Work\" reading doesn't hold for 2MRS: the catalogue was produced by the survey team (Huchra et al. 2012, maintained at Texas A&M), not by NASA staff. Its README asks that **its files** not be redistributed, so that users get the latest version. The same table is published in ApJS and already redistributed by VizieR (J/ApJS/199/26) and NASA's HEASARC. So 2MRS is ingested from VizieR, cites Huchra et al. 2012 and each entry's own bibcode, and links to the 2MRS home page. It joins the galaxy sources as the all-sky survey of the nearby universe (Ks ≤ 11.75; it leaves out low Galactic latitudes)."
        question: 01a19f13-335d-7690-8368-87d2c0eaeb23
