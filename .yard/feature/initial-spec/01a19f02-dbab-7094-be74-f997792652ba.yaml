        title: "Scope settled"
        markdown: |-
          Three rounds settled **20 choices**, and the outline was approved.

          Adjustments while writing:

          - **Releases:** "Read as of a past release" folds into the release-pinning Feature, since pinning a release *is* the as-of read for reference data. Layers get their own as-of read.
          - **Deployment:** publishing targets local storage only, after the local-only decision.
          - **Preferred measurement:** the "documented ranking" will be a published rule that picks the measurement with the **smallest fractional distance uncertainty**, counting a peculiar-velocity term for redshift distances, with ties broken by method rank. A rule that ranks by method alone would place a galaxy at cz 15,000 km/s at its ~20% Tully–Fisher distance rather than its ~2% redshift distance, which would be wrong.
        tone: success
