        prompt: "How should TypeScript clients get the API's types?"
        header: "API contract"
        context: "The model lives in Rust (`univ-model`). Clients such as a TypeScript web app need the same types and validation."
        options:
          - label: "OpenAPI from Rust"
            detail: "The Worker publishes an OpenAPI 3.1 document generated from the Rust types, and a typed TS client is generated from it. The tile format is documented with a manifest schema and a small TS decoder. One source of truth."
            recommended: true
          - label: "univ-model as WASM"
            detail: "The Rust model is also compiled to a WASM + TS package, so clients use the same validation and coordinate transforms. More capable, but a bigger download for clients and a harder build."
          - label: "Handwritten TS"
            detail: "A TS types package maintained by hand next to the Rust code. Quick to start, but the two will drift apart."
