    id: cf-workers-constraint
    kind: note
    versions:
      - key: 01a19f04-00ff-750e-9251-794d904e4156
        at: 2026-11-03T01:26:42Z
        revision: 2
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Hosting: Cloudflare Workers"
        markdown: |-
          The person wants univ-server to run on **Cloudflare Workers** and to avoid building complex infrastructure for now.

          What that implies for a Rust server, to be confirmed in the scope interview:

          - It builds to `wasm32-unknown-unknown` with `workers-rs` (the `worker` crate), with no threads, no local filesystem and no native-only crates.
          - Storage comes from Cloudflare's bindings: D1 (SQLite), R2 (objects), KV, Durable Objects. Hyperdrive is an option if a Postgres database is ever needed.
          - Ingestion is limited by Workers' CPU time and memory. Heavy steps such as bulk SDSS pulls or Cosmicflows-4 FITS grids may need to run outside Workers (locally, in CI or in Cloudflare Containers) and publish their results to R2 or D1.
        tone: info
  - key: 01a19f04-c1e5-7624-b0f8-22cff17f383d
    id: offline-ingestion
    kind: note
    versions:
      - key: 01a19f04-c1e5-7624-b0f8-22d04a2b6777
        at: 2026-11-03T01:27:31Z
        revision: 3
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Ingestion runs offline"
        markdown: |-
          Ingestion will be a **local CLI** that downloads, ETLs and uploads the data. Only serving runs on Workers.

          That suggests a Cargo workspace:

          - **`univ-model`**: the shared domain types and normalization, compiled for both native and WebAssembly.
          - **`univ-server`**: the Worker, built with `workers-rs` for `wasm32-unknown-unknown`.
          - **`univ-ingest`**: a native CLI. It has no Workers limits, so it can use threads and the local filesystem, cache downloads, and read FITS, ZIP and NPZ files.

          The CLI uploads to R2 and D1, and Workers serves what it uploaded.
        tone: info
