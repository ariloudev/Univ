                  },
                  {
                    "column": 14,
                    "key": "01a19f22-b0bc-76da-bac8-9785a0efa4a1",
                    "kind": "criterion",
                    "label": null,
                    "line": 44,
                    "name": "A download that continued from a partial file prints the byte it continued from.",
                    "path": "spec/products/univ-ingest/operation/follow-a-runs-progress.yaml"
                  },
                  {
                    "column": 10,
                    "key": "01a19f22-b0bc-76da-bac8-9786b22b6ce9",
                    "kind": "requirement",
                    "label": null,
                    "line": 46,
                    "name": "When a run ends, Univ Ingest shall print a summary of what the run did.",
                    "path": "spec/products/univ-ingest/operation/follow-a-runs-progress.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f22-b0bc-76da-bac8-97876c10b6f3",
                    "kind": "criterion",
                    "label": null,
                    "line": 53,
                    "name": "The summary gives the bytes fetched, the time taken and the mean rate.",
                    "path": "spec/products/univ-ingest/operation/follow-a-runs-progress.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f22-b0bc-76da-bac8-9788528129a0",
                    "kind": "criterion",
                    "label": null,
                    "line": 55,
                    "name": "The summary gives, per source, the catalogue entries published and left out.",
                    "path": "spec/products/univ-ingest/operation/follow-a-runs-progress.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f22-b0bc-76da-bac8-9789936d8c57",
                    "kind": "criterion",
                    "label": null,
                    "line": 57,
                    "name": "The summary names the release the run built or published, or the stage and reason it stopped at.",
                    "path": "spec/products/univ-ingest/operation/follow-a-runs-progress.yaml"
                  },
                  {
                    "column": 10,
                    "key": "01a19f22-b0bc-76da-bac8-978a58c8fa20",
                    "kind": "requirement",
                    "label": null,
