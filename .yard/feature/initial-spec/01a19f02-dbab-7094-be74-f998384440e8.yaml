                  },
                  {
                    "column": 14,
                    "key": "01a19f22-b0bc-76da-bac8-978c8f52c47a",
                    "kind": "criterion",
                    "label": null,
                    "line": 68,
                    "name": "A download that lasts longer than a minute prints one progress line each minute.",
                    "path": "spec/products/univ-ingest/operation/follow-a-runs-progress.yaml"
                  },
