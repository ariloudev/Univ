                  "kind": "product",
                  "label": null,
                  "name": "Univ Server",
                  "words": {
                    "after": "Univ Server\n\nThe server that supplies real, normalized astronomical and cosmological data to clients, such as\na TypeScript web application, and lets clients author their own layers on top of it.\n\nIt serves what Univ Ingest published: objects identified across catalogues, the structures and\nfields of the large-scale universe, the sources every value came from, and bulk points as tiles.\nEvery position names its frame, epoch and cosmology, and keeps the measured value beside the\nderived one. Reference data is read anonymously; layers are written with an API key.\n\nThe first version runs locally under `wrangler dev`. Solar System ephemerides, live transient\nalerts, end-user accounts, sharing lists for private layers and mesh geometry are outside it."
                  }
                },
