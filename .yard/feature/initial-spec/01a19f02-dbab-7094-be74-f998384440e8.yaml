                  "label": null,
                  "name": "If no volume grid has the requested id, then Univ Server shall answer that the volume grid was not found.",
                  "parent": "01a19f1f-9fd6-77e0-931c-f99189987122"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd6-77e0-931c-f99c3b94bb2d",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response status is 404 with problem details that name the requested id.",
                  "parent": "01a19f1f-9fd6-77e0-931c-f99b99d555ba"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd6-77e0-931c-f99de4f76490",
                  "kind": "feature",
                  "label": null,
                  "name": "Fetch point tiles",
                  "parent": "01a19f1a-685d-7357-b67e-d660e2178068"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd6-77e0-931c-f99edc04db94",
                  "kind": "requirement",
                  "label": null,
                  "name": "When a client requests an octree node of a scale domain, Univ Server shall return that node's tile exactly as the release stored it.",
                  "parent": "01a19f1f-9fd6-77e0-931c-f99de4f76490"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd6-77e0-931c-f99f4c025db5",
                  "kind": "criterion",
                  "label": null,
                  "name": "The bytes of the response match the SHA-256 the tile manifest gives for the node.",
                  "parent": "01a19f1f-9fd6-77e0-931c-f99edc04db94"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd6-77e0-931c-f9a0a2ceac71",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response marks the tile as immutable and cacheable for one year.",
                  "parent": "01a19f1f-9fd6-77e0-931c-f99edc04db94"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5cf491cd92ad",
                  "kind": "criterion",
                  "label": null,
                  "name": "The tile is streamed from R2 without being decoded by the Worker.",
                  "parent": "01a19f1f-9fd6-77e0-931c-f99edc04db94"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5cf5b0acf817",
                  "kind": "requirement",
                  "label": null,
                  "name": "If the tile manifest has no node at the requested address, then Univ Server shall answer that the tile was not found.",
                  "parent": "01a19f1f-9fd6-77e0-931c-f99de4f76490"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5cf680d98b67",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response status is 404 with problem details that name the requested address.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5cf5b0acf817"
                },
                {
                  "change": "added",
                  "key": "01a19f1a-685d-7357-b67e-d6615e6965c1",
                  "kind": "feature_group",
                  "label": null,
                  "name": "Spatial and temporal queries",
                  "parent": "01a19f1a-685d-7357-b67e-d65e20557892"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5cf7de740462",
                  "kind": "feature",
                  "label": null,
                  "name": "Filter by time",
                  "parent": "01a19f1a-685d-7357-b67e-d6615e6965c1"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5cf8324f9e39",
                  "kind": "requirement",
                  "label": null,
                  "name": "When a query names an interval of time records, Univ Server shall return only the results whose time records of the named kind intersect the interval.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5cf7de740462"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5cf9a022ff00",
                  "kind": "criterion",
                  "label": null,
                  "name": "The query names the kind of time record compared: source event, arrival or discovery.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5cf8324f9e39"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5cfa90995426",
                  "kind": "criterion",
                  "label": null,
                  "name": "A time record with an uncertainty interval matches when that interval intersects the query's interval.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5cf8324f9e39"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5cfbeb2181d8",
                  "kind": "criterion",
                  "label": null,
                  "name": "A result with no time record of the named kind does not match.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5cf8324f9e39"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5cfc576674a6",
                  "kind": "criterion",
                  "label": null,
                  "name": "A time given in UTC and a time given in TT are compared on TT.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5cf8324f9e39"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5d002ef5c1f9",
                  "kind": "requirement",
                  "label": null,
                  "name": "If an interval ends before it starts or names an unknown timescale, then Univ Server shall refuse the query and name the faulty bound or timescale.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5cf7de740462"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5d01d38e6cfa",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response status is 400 with problem details that point at the faulty field.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5d002ef5c1f9"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5d0c87a2ef00",
                  "kind": "feature",
                  "label": null,
                  "name": "Query a bounded volume",
                  "parent": "01a19f1a-685d-7357-b67e-d6615e6965c1"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5d0dcd90a07b",
                  "kind": "requirement",
                  "label": null,
                  "name": "When a client queries a bounded volume, Univ Server shall return the objects, structures and layer items whose positions or geometries intersect the volume.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5d0c87a2ef00"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5d0ef2d0a80a",
                  "kind": "criterion",
                  "label": null,
                  "name": "The volume is a box, a sphere, or a cone with a distance range.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5d0dcd90a07b"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5d0f00fe2fe8",
                  "kind": "criterion",
                  "label": null,
                  "name": "The volume names its frame, which is ICRS, galactic or supergalactic, and its unit.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5d0dcd90a07b"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5d104c3238b3",
                  "kind": "criterion",
                  "label": null,
                  "name": "An object matches by its derived position under the release cosmology.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5d0dcd90a07b"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5d11ceeb957a",
                  "kind": "criterion",
                  "label": null,
                  "name": "A structure or layer item matches when its geometry intersects the volume, even if its centre lies outside it.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5d0dcd90a07b"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5d12d67f0253",
                  "kind": "criterion",
                  "label": null,
                  "name": "Items of a private layer match only for a request that carries the layer's owning key.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5d0dcd90a07b"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5d13540b5b8f",
                  "kind": "criterion",
                  "label": null,
                  "name": "Results can be narrowed to the kinds, sources, scale domains and layers the client names.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5d0dcd90a07b"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5d14df84914b",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Server shall return at most 1,000 results per page and at most 10,000 results per bounded volume query.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5d0c87a2ef00"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5d15532c9c3a",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each page carries a cursor to the next page while results remain.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5d14df84914b"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5d164b16f644",
                  "kind": "criterion",
                  "label": null,
                  "name": "Results come in a stable order, so paging the same query twice returns the same pages.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5d14df84914b"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5d174e903e62",
                  "kind": "criterion",
                  "label": null,
                  "name": "A query that matches more than 10,000 results returns the first 10,000 and states that the result was truncated.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5d14df84914b"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5d18140f9506",
                  "kind": "requirement",
                  "label": null,
                  "name": "When a client queries a bounded volume, Univ Server shall return the address of every octree node of each scale domain that intersects the volume.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5d0c87a2ef00"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5d19cdceaeab",
                  "kind": "criterion",
                  "label": null,
                  "name": "The nodes are given at the deepest level of detail the client asks for, or at the deepest level of the octree when it asks for none.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5d18140f9506"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5d1a86501cb8",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each node address can be fetched as a tile without further lookup.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5d18140f9506"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5d1b5a00f7dd",
                  "kind": "requirement",
                  "label": null,
                  "name": "If the volume is malformed, then Univ Server shall refuse the query and name what is malformed.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5d0c87a2ef00"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5d1c374609bf",
                  "kind": "criterion",
                  "label": null,
                  "name": "A negative or zero size, an unknown frame, an unknown unit or a cone wider than 180 degrees is refused.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5d1b5a00f7dd"
                },
                {
                  "change": "added",
                  "key": "01a19f1f-9fd7-7209-b7cb-5d1dc8111c5f",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response status is 400 with problem details that point at the malformed field.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5d1b5a00f7dd"
                },
                {
                  "change": "added",
                  "key": "01a19f1a-685d-7357-b67e-d662fbe4f6f3",
                  "kind": "feature_group",
                  "label": null,
                  "name": "Layers",
                  "parent": "01a19f1a-685d-7357-b67e-d65e20557892"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f182eae0369",
                  "kind": "feature",
                  "label": null,
                  "name": "Create and configure a layer",
                  "parent": "01a19f1a-685d-7357-b67e-d662fbe4f6f3"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f195dcd3fbe",
                  "kind": "requirement",
                  "label": null,
                  "name": "When a client with an API key creates a layer, Univ Server shall create the layer with that key as its owning key.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f182eae0369"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f1a626d07c6",
                  "kind": "criterion",
                  "label": null,
                  "name": "The layer has an id, a title, a description, a visibility, an owning key and a creation time.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f195dcd3fbe"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f1b2c8665d2",
                  "kind": "criterion",
                  "label": null,
                  "name": "A layer is private unless the client creates it public.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f195dcd3fbe"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f1c8a7b7514",
                  "kind": "criterion",
                  "label": null,
                  "name": "The layer's change sequence starts at zero.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f195dcd3fbe"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f1db7723a99",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the owning key changes a layer's title, description or visibility, Univ Server shall apply the change and record it in the layer's change sequence.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f182eae0369"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f1eef8352de",
                  "kind": "criterion",
                  "label": null,
                  "name": "The change advances the layer's change sequence by one.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f1db7723a99"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f1fdb9e5511",
                  "kind": "criterion",
                  "label": null,
                  "name": "A layer made private stops appearing in anonymous reads, listings and query results from the next request.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f1db7723a99"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f204ccf5beb",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the owning key retires a layer, Univ Server shall stop serving the layer and its items.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f182eae0369"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f21a598c53b",
                  "kind": "criterion",
                  "label": null,
                  "name": "A read of a retired layer answers 410 with problem details that give the retirement time.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f204ccf5beb"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f23c530f226",
                  "kind": "criterion",
                  "label": null,
                  "name": "A retired layer no longer counts toward its key's quota of layers.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f204ccf5beb"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f2449c53c62",
                  "kind": "requirement",
                  "label": null,
                  "name": "If a request to change or retire a layer carries a key other than its owning key, then Univ Server shall refuse the request and leave the layer unchanged.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f182eae0369"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f2523d32f02",
                  "kind": "criterion",
                  "label": null,
                  "name": "A public layer answers 403.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f2449c53c62"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f2613527c69",
                  "kind": "criterion",
                  "label": null,
                  "name": "A private layer answers 404, exactly as a layer that does not exist.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f2449c53c62"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f279c973046",
                  "kind": "feature",
                  "label": null,
                  "name": "Follow a layer's changes",
                  "parent": "01a19f1a-685d-7357-b67e-d662fbe4f6f3"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f280579c165",
                  "kind": "requirement",
                  "label": null,
                  "name": "When a client asks for a layer's changes since a cursor, Univ Server shall return the changes made after that cursor in the order of the layer's change sequence.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f279c973046"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f29763822f6",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each change gives its sequence number, its time, its kind, and the item and version it concerns.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f280579c165"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f2ac80ae6de",
                  "kind": "criterion",
                  "label": null,
                  "name": "The kinds of change are layer configured, item published, item revised, item retracted and layer retired.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f280579c165"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f2bcd986dbc",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response gives the cursor of the last change it holds.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f280579c165"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f2cd2218c36",
                  "kind": "criterion",
                  "label": null,
                  "name": "A page holds at most 1,000 changes.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f280579c165"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f2d90d4b301",
                  "kind": "criterion",
                  "label": null,
                  "name": "A cursor of zero returns the changes from the layer's creation.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f280579c165"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f2ec27451ac",
                  "kind": "requirement",
                  "label": null,
                  "name": "When a client repeats a read of a layer or an item with the entity tag it last received, Univ Server shall answer that nothing changed when the layer's change sequence has not advanced.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f279c973046"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f2f545440ba",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response status is 304 with no body.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f2ec27451ac"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f3070065acf",
                  "kind": "criterion",
                  "label": null,
                  "name": "Every change to a layer gives the layer and the changed item a new entity tag.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f2ec27451ac"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f31052701ce",
                  "kind": "requirement",
                  "label": null,
                  "name": "If the cursor is malformed or lies beyond the layer's change sequence, then Univ Server shall refuse the request and give the layer's current change sequence.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f279c973046"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f3215abe316",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response status is 400 with problem details that give the current change sequence.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f31052701ce"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f33a250acbb",
                  "kind": "feature",
                  "label": null,
                  "name": "Publish a layer item",
                  "parent": "01a19f1a-685d-7357-b67e-d662fbe4f6f3"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f34698e25b8",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the owning key publishes an item to a layer, Univ Server shall validate the item and store it as the item's first version.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f33a250acbb"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f352d3ef9fc",
                  "kind": "criterion",
                  "label": null,
                  "name": "The item holds a title, a summary, a geometry, its time records, its kind of value, its links and its sources.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f34698e25b8"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f3603bb663b",
                  "kind": "criterion",
                  "label": null,
                  "name": "The item's id is chosen by the client and is unique within the layer.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f34698e25b8"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f37afa7a5f0",
                  "kind": "criterion",
                  "label": null,
                  "name": "The geometry is one of the geometry kinds univ-model defines, in a named frame.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f34698e25b8"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f380e7feae0",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each time record names its kind, its timescale and its uncertainty.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f34698e25b8"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f39371a8402",
                  "kind": "criterion",
                  "label": null,
                  "name": "The stored version has the number 1 and the time the server stored it.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f34698e25b8"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f3a1008f3a6",
                  "kind": "criterion",
                  "label": null,
                  "name": "The publish advances the layer's change sequence by one.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f34698e25b8"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f3b5f5065f5",
                  "kind": "requirement",
                  "label": null,
                  "name": "If an item fails validation, then Univ Server shall refuse the item and name each field that failed.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f33a250acbb"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f3c190e7421",
                  "kind": "criterion",
                  "label": null,
                  "name": "Nothing is stored and the layer's change sequence is unchanged.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f3b5f5065f5"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f3db58503d4",
                  "kind": "criterion",
                  "label": null,
                  "name": "The problem details list each failing field by its JSON pointer, with the reason it failed.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f3b5f5065f5"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f3e36b397b1",
                  "kind": "requirement",
                  "label": null,
                  "name": "If an item cites no source, then Univ Server shall refuse the item and say that a source is required.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f33a250acbb"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f3f75200dfa",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response status is 422 and nothing is stored.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f3e36b397b1"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f40a8b8c250",
                  "kind": "requirement",
                  "label": null,
                  "name": "When an item links to a reference object or structure, Univ Server shall store the link with its relation and resolve it against the release a read is answered from.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f33a250acbb"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f412ed74190",
                  "kind": "criterion",
                  "label": null,
                  "name": "A link names its relation, such as host, counterpart, member of or located in, and the id of an object or structure.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f40a8b8c250"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f42b9073b71",
                  "kind": "criterion",
                  "label": null,
                  "name": "A link to an id that no release has published is refused with the id it names.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f40a8b8c250"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f43ab9e950c",
                  "kind": "criterion",
                  "label": null,
                  "name": "A link to an id that a later release merged is served with the id that replaced it, beside the id as written.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f40a8b8c250"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f4496bceaf8",
                  "kind": "requirement",
                  "label": null,
                  "name": "If an item uses an id that the layer already holds, then Univ Server shall refuse the publish as a conflict.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f33a250acbb"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f454b07cdb9",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response status is 409 with problem details that give the item's current version.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f4496bceaf8"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f46c62a0358",
                  "kind": "feature",
                  "label": null,
                  "name": "Read a layer",
                  "parent": "01a19f1a-685d-7357-b67e-d662fbe4f6f3"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f47f0d47d3c",
                  "kind": "requirement",
                  "label": null,
                  "name": "When a client lists layers, Univ Server shall return every public layer and, for a request with an API key, that key's private layers.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f46c62a0358"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f485024d062",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each listed layer gives its id, title, visibility, item count and change sequence.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f47f0d47d3c"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f49aa6b6d22",
                  "kind": "criterion",
                  "label": null,
                  "name": "A retired layer is not listed.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f47f0d47d3c"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f4a486147fc",
                  "kind": "requirement",
                  "label": null,
                  "name": "When a client reads a layer, Univ Server shall return the layer's details and the current version of each of its items that is not retracted.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f46c62a0358"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f4be0d600b7",
                  "kind": "criterion",
                  "label": null,
                  "name": "Items come in pages of at most 500, each page with a cursor to the next.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f4a486147fc"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f4c6cf130cd",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each item gives its version number and the time that version was stored.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f4a486147fc"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f4da000dbe3",
                  "kind": "requirement",
                  "label": null,
                  "name": "When a client reads an item, Univ Server shall return its current version and the list of all its versions.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f46c62a0358"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f4e28800b19",
                  "kind": "criterion",
                  "label": null,
                  "name": "Any earlier version can be read by its number.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f4da000dbe3"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f534c3dc736",
                  "kind": "requirement",
                  "label": null,
                  "name": "If a request without the owning key reads a private layer or one of its items, then Univ Server shall answer exactly as for a layer that does not exist.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f46c62a0358"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f54f63a7133",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response status is 404 and its body is the same as for an id no layer has.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f534c3dc736"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f5588b2c1c4",
                  "kind": "feature",
                  "label": null,
                  "name": "Revise or retract an item",
                  "parent": "01a19f1a-685d-7357-b67e-d662fbe4f6f3"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f5679ede9f1",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the owning key revises an item, Univ Server shall store the revised content as the item's next version, marked as an update or a correction.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f5588b2c1c4"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f5725b2fb75",
                  "kind": "criterion",
                  "label": null,
                  "name": "The new version's number is one more than the version it replaces.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f5679ede9f1"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f583c9b45b2",
                  "kind": "criterion",
                  "label": null,
                  "name": "A correction names the version it corrects and summarises what was wrong.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f5679ede9f1"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f59bc649213",
                  "kind": "criterion",
                  "label": null,
                  "name": "Earlier versions remain readable and unchanged.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f5679ede9f1"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f5a9882c425",
                  "kind": "criterion",
                  "label": null,
                  "name": "The revision advances the layer's change sequence by one.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f5679ede9f1"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f5b6d938672",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the owning key retracts an item, Univ Server shall store a new version that marks the item retracted with its reason.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f5588b2c1c4"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f5c49cf499d",
                  "kind": "criterion",
                  "label": null,
                  "name": "A retracted item no longer appears among the layer's current items or in query results.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f5b6d938672"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f5d41d72b6a",
                  "kind": "criterion",
                  "label": null,
                  "name": "A read of a retracted item returns its retraction version, with the reason, and its earlier versions.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f5b6d938672"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f5e403c1124",
                  "kind": "criterion",
                  "label": null,
                  "name": "The retraction advances the layer's change sequence by one.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f5b6d938672"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f5fb5bb46e4",
                  "kind": "requirement",
                  "label": null,
                  "name": "If a revision or retraction names a version other than the item's current one, then Univ Server shall refuse it as a conflict and leave the item unchanged.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f5588b2c1c4"
                },
                {
                  "change": "added",
                  "key": "01a19f20-1cb3-7721-97a0-4f608f85d888",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response status is 409 with problem details that give the item's current version.",
                  "parent": "01a19f20-1cb3-7721-97a0-4f5fb5bb46e4"
                },
                {
                  "change": "added",
                  "key": "01a19f1a-685d-7357-b67e-d663efc89e0d",
                  "kind": "feature_group",
                  "label": null,
                  "name": "Access",
                  "parent": "01a19f1a-685d-7357-b67e-d65e20557892"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abd83515093c",
                  "kind": "feature",
                  "label": null,
                  "name": "Enforce quotas and rate limits",
                  "parent": "01a19f1a-685d-7357-b67e-d663efc89e0d"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abd968a1043e",
                  "kind": "requirement",
                  "label": null,
                  "name": "If a write would take a key beyond one of its quotas, then Univ Server shall refuse the write and name the quota.",
                  "parent": "01a19f20-8e6c-7039-b16f-abd83515093c"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abdaebf630a9",
                  "kind": "criterion",
                  "label": null,
                  "name": "The quotas are layers per key, items per layer and bytes per item version.",
                  "parent": "01a19f20-8e6c-7039-b16f-abd968a1043e"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abdb6193c8a7",
                  "kind": "criterion",
                  "label": null,
                  "name": "The problem details give the quota, its limit and the key's current usage.",
                  "parent": "01a19f20-8e6c-7039-b16f-abd968a1043e"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abdce6ed0c1d",
                  "kind": "criterion",
                  "label": null,
                  "name": "Nothing is stored.",
                  "parent": "01a19f20-8e6c-7039-b16f-abd968a1043e"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abdd6cea244d",
                  "kind": "requirement",
                  "label": null,
                  "name": "If a client exceeds its request rate limit, then Univ Server shall refuse its requests until the limit's window has passed.",
                  "parent": "01a19f20-8e6c-7039-b16f-abd83515093c"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abde5a8c8ce0",
                  "kind": "criterion",
                  "label": null,
                  "name": "Anonymous requests are limited per client address, by default to 300 requests in 60 seconds.",
                  "parent": "01a19f20-8e6c-7039-b16f-abdd6cea244d"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abdf92323beb",
                  "kind": "criterion",
                  "label": null,
                  "name": "Requests with an API key are limited per key, by default to 1,200 requests in 60 seconds.",
                  "parent": "01a19f20-8e6c-7039-b16f-abdd6cea244d"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abe06d55345f",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response status is 429 with a Retry-After header.",
                  "parent": "01a19f20-8e6c-7039-b16f-abdd6cea244d"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abe10a4ee3c8",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the owner changes a key's quotas or rate limit, Univ Server shall apply the new values from the key's next request.",
                  "parent": "01a19f20-8e6c-7039-b16f-abd83515093c"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abe2ec3d6bd7",
                  "kind": "criterion",
                  "label": null,
                  "name": "A quota lowered below a key's current usage refuses the key's next write that would add to that usage, and keeps what the key already stored.",
                  "parent": "01a19f20-8e6c-7039-b16f-abe10a4ee3c8"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abe3447e87f6",
                  "kind": "feature",
                  "label": null,
                  "name": "Issue and revoke keys",
                  "parent": "01a19f1a-685d-7357-b67e-d663efc89e0d"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abe4333991f2",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the owner issues an API key, Univ Server shall create the key with its label and quotas and return its secret once.",
                  "parent": "01a19f20-8e6c-7039-b16f-abe3447e87f6"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abe5d0392ce2",
                  "kind": "criterion",
                  "label": null,
                  "name": "The secret holds at least 256 bits of randomness.",
                  "parent": "01a19f20-8e6c-7039-b16f-abe4333991f2"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abe6140958c5",
                  "kind": "criterion",
                  "label": null,
                  "name": "Only the SHA-256 of the secret is stored.",
                  "parent": "01a19f20-8e6c-7039-b16f-abe4333991f2"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abe78c0f59b1",
                  "kind": "criterion",
                  "label": null,
                  "name": "The secret is returned in the response that issues it and in no later response.",
                  "parent": "01a19f20-8e6c-7039-b16f-abe4333991f2"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abe824aac9f3",
                  "kind": "criterion",
                  "label": null,
                  "name": "A key issued without quotas gets the default quotas.",
                  "parent": "01a19f20-8e6c-7039-b16f-abe4333991f2"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abe9617a077f",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the owner revokes an API key, Univ Server shall refuse the key from the next request on.",
                  "parent": "01a19f20-8e6c-7039-b16f-abe3447e87f6"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abeaf5bb032f",
                  "kind": "criterion",
                  "label": null,
                  "name": "The revocation is recorded with its time.",
                  "parent": "01a19f20-8e6c-7039-b16f-abe9617a077f"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abeb18eac22e",
                  "kind": "criterion",
                  "label": null,
                  "name": "The revoked key's public layers stay readable, and its private layers stay unreadable.",
                  "parent": "01a19f20-8e6c-7039-b16f-abe9617a077f"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abeccca54ce7",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the owner lists API keys, Univ Server shall return each key's label, issuance time, revocation time, quotas and usage, without its secret.",
                  "parent": "01a19f20-8e6c-7039-b16f-abe3447e87f6"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abedaa177f5f",
                  "kind": "criterion",
                  "label": null,
                  "name": "Usage gives the key's number of layers and its largest layer's number of items.",
                  "parent": "01a19f20-8e6c-7039-b16f-abeccca54ce7"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abee0b691d4e",
                  "kind": "requirement",
                  "label": null,
                  "name": "If a request to an owner operation lacks the owner secret or carries a wrong one, then Univ Server shall refuse the request and change nothing.",
                  "parent": "01a19f20-8e6c-7039-b16f-abe3447e87f6"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abefcb4ce396",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response status is 401.",
                  "parent": "01a19f20-8e6c-7039-b16f-abee0b691d4e"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abf06331899f",
                  "kind": "feature",
                  "label": null,
                  "name": "Read anonymously",
                  "parent": "01a19f1a-685d-7357-b67e-d663efc89e0d"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abf10762fc10",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Server shall serve every read of reference data and of public layers without credentials.",
                  "parent": "01a19f20-8e6c-7039-b16f-abf06331899f"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abf26c9701c7",
                  "kind": "criterion",
                  "label": null,
                  "name": "A read with no Authorization header succeeds.",
                  "parent": "01a19f20-8e6c-7039-b16f-abf10762fc10"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abf3d55f1698",
                  "kind": "criterion",
                  "label": null,
                  "name": "A read of reference data with a valid API key returns the same data as the same read without one.",
                  "parent": "01a19f20-8e6c-7039-b16f-abf10762fc10"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abf43d1165a6",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Server shall allow cross-origin reads from any origin.",
                  "parent": "01a19f20-8e6c-7039-b16f-abf06331899f"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abf520a82854",
                  "kind": "criterion",
                  "label": null,
                  "name": "Every read response allows any origin in its CORS headers.",
                  "parent": "01a19f20-8e6c-7039-b16f-abf43d1165a6"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abf64b1ee438",
                  "kind": "criterion",
                  "label": null,
                  "name": "A CORS preflight for a read is answered without credentials.",
                  "parent": "01a19f20-8e6c-7039-b16f-abf43d1165a6"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abf782688cdf",
                  "kind": "feature",
                  "label": null,
                  "name": "Write with an API key",
                  "parent": "01a19f1a-685d-7357-b67e-d663efc89e0d"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abf8076cbedf",
                  "kind": "requirement",
                  "label": null,
                  "name": "When a request carries an API key, Univ Server shall authenticate the key before handling the request.",
                  "parent": "01a19f20-8e6c-7039-b16f-abf782688cdf"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abf9f45a15c6",
                  "kind": "criterion",
                  "label": null,
                  "name": "The key is read from the Authorization header as a bearer token.",
                  "parent": "01a19f20-8e6c-7039-b16f-abf8076cbedf"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abfa34e30e20",
                  "kind": "criterion",
                  "label": null,
                  "name": "The key is checked against the SHA-256 of the secret stored at its issuance.",
                  "parent": "01a19f20-8e6c-7039-b16f-abf8076cbedf"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abfbfb3c07b7",
                  "kind": "requirement",
                  "label": null,
                  "name": "If a write carries no API key, an unknown key or a revoked key, then Univ Server shall refuse the write and store nothing.",
                  "parent": "01a19f20-8e6c-7039-b16f-abf782688cdf"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abfc63c9e57f",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response status is 401.",
                  "parent": "01a19f20-8e6c-7039-b16f-abfbfb3c07b7"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abfd57ec4eda",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response does not say whether the key was unknown or revoked.",
                  "parent": "01a19f20-8e6c-7039-b16f-abfbfb3c07b7"
                },
                {
                  "change": "added",
                  "key": "01a19f1a-685d-7357-b67e-d664d79c25f9",
                  "kind": "feature_group",
                  "label": null,
                  "name": "API contract",
                  "parent": "01a19f1a-685d-7357-b67e-d65e20557892"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abfe741c359f",
                  "kind": "feature",
                  "label": null,
                  "name": "Decode the tile format",
                  "parent": "01a19f1a-685d-7357-b67e-d664d79c25f9"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-abff12284f64",
                  "kind": "requirement",
                  "label": null,
                  "name": "When a client requests the tile format, Univ Server shall return the JSON Schema of the tile manifest and the description of the tile encoding.",
                  "parent": "01a19f20-8e6c-7039-b16f-abfe741c359f"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-ac0049cc05d8",
                  "kind": "criterion",
                  "label": null,
                  "name": "The description gives the byte layout of a tile for each version of the encoding the release uses.",
                  "parent": "01a19f20-8e6c-7039-b16f-abff12284f64"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-ac01cf25aa34",
                  "kind": "requirement",
                  "label": null,
                  "name": "The Tile codec shall provide a reference TypeScript decoder that decodes every tile of a release into the points it encodes.",
                  "parent": "01a19f20-8e6c-7039-b16f-abfe741c359f"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-ac0273b5ac3b",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each decoded position lies within the quantization step the tile manifest states of the position the tile was built from.",
                  "parent": "01a19f20-8e6c-7039-b16f-ac01cf25aa34"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-ac037abf14fd",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each decoded point gives its object id, its source and its kind of value.",
                  "parent": "01a19f20-8e6c-7039-b16f-ac01cf25aa34"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-ac04fdc1fabe",
                  "kind": "criterion",
                  "label": null,
                  "name": "A tile with an encoding version the decoder does not know fails with an error that names the version.",
                  "parent": "01a19f20-8e6c-7039-b16f-ac01cf25aa34"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-ac05a289fbdb",
                  "kind": "feature",
                  "label": null,
                  "name": "Read the OpenAPI document",
                  "parent": "01a19f1a-685d-7357-b67e-d664d79c25f9"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-ac066aa825d3",
                  "kind": "requirement",
                  "label": null,
                  "name": "When a client requests the API description, Univ Server shall return an OpenAPI 3.1 document of every route it serves.",
                  "parent": "01a19f20-8e6c-7039-b16f-ac05a289fbdb"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-ac0782b8bf64",
                  "kind": "criterion",
                  "label": null,
                  "name": "The document is served at /v1/openapi.json.",
                  "parent": "01a19f20-8e6c-7039-b16f-ac066aa825d3"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-ac087a3ea07a",
                  "kind": "criterion",
                  "label": null,
                  "name": "The document's schemas are generated from univ-model's Rust types.",
                  "parent": "01a19f20-8e6c-7039-b16f-ac066aa825d3"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-ac09bec61527",
                  "kind": "criterion",
                  "label": null,
                  "name": "Every route the Worker serves appears in the document, and no route it does not serve.",
                  "parent": "01a19f20-8e6c-7039-b16f-ac066aa825d3"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-ac0af2d4fa5d",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each refusal a route can give is described with its status and problem type.",
                  "parent": "01a19f20-8e6c-7039-b16f-ac066aa825d3"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-ac0b05a62900",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Server shall answer every refused or failed request with an RFC 9457 problem details document.",
                  "parent": "01a19f20-8e6c-7039-b16f-ac05a289fbdb"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-ac0c9f071903",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response's content type is application/problem+json.",
                  "parent": "01a19f20-8e6c-7039-b16f-ac0b05a62900"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-ac0d10549d0c",
                  "kind": "criterion",
                  "label": null,
                  "name": "The problem type is a URI that names the kind of refusal and is listed in the OpenAPI document.",
                  "parent": "01a19f20-8e6c-7039-b16f-ac0b05a62900"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-ac0e1429d17f",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Server shall keep every route of an API version compatible with the clients of that version for as long as it serves that version.",
                  "parent": "01a19f20-8e6c-7039-b16f-ac05a289fbdb"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-ac0f65af0df8",
                  "kind": "criterion",
                  "label": null,
                  "name": "Every route lives under the path of its API version, starting with /v1.",
                  "parent": "01a19f20-8e6c-7039-b16f-ac0e1429d17f"
                },
                {
                  "change": "added",
                  "key": "01a19f20-8e6c-7039-b16f-ac103a292bb7",
                  "kind": "criterion",
                  "label": null,
                  "name": "A change that removes or renames a field, a route or a value of an enumeration is made only in a new API version.",
                  "parent": "01a19f20-8e6c-7039-b16f-ac0e1429d17f"
                },
