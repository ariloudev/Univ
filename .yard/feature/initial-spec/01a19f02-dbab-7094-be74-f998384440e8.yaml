                    "key": "01a19f20-8e6c-7039-b16f-abe9617a077f",
                    "kind": "requirement",
                    "label": null,
                    "line": 27,
                    "name": "When the owner revokes an API key, Univ Server shall refuse the key from the next request on.",
                    "path": "spec/products/univ-server/access/issue-and-revoke-keys.yaml"
