                    "name": "Identity",
                    "path": "spec/products/univ-ingest/product.yaml"
                  },
                  {
                    "column": 6,
                    "key": "01a19f23-636e-7035-8185-ab97eb9c2fb9",
                    "kind": "feature",
                    "label": null,
                    "line": 1,
                    "name": "Choose the preferred measurement",
                    "path": "spec/products/univ-ingest/identity/choose-the-preferred-measurement.yaml"
                  },
                  {
                    "column": 10,
                    "key": "01a19f23-636e-7035-8185-ab988f5d57b7",
                    "kind": "requirement",
                    "label": null,
                    "line": 13,
                    "name": "Univ Ingest shall choose as an object's preferred distance the measurement with the smallest fractional distance uncertainty.",
                    "path": "spec/products/univ-ingest/identity/choose-the-preferred-measurement.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f23-636e-7035-8185-ab998407d632",
                    "kind": "criterion",
                    "label": null,
                    "line": 19,
                    "name": "The uncertainty of a redshift distance includes a peculiar-velocity term, 300 km/s unless the release's ranking rule sets another.",
                    "path": "spec/products/univ-ingest/identity/choose-the-preferred-measurement.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f23-636e-7035-8185-ab9ac704109a",
                    "kind": "criterion",
                    "label": null,
                    "line": 21,
                    "name": "A tie is broken by method rank: geometric, then primary indicator, then secondary indicator, then spectroscopic redshift, then photometric redshift.",
                    "path": "spec/products/univ-ingest/identity/choose-the-preferred-measurement.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f23-636e-7035-8185-ab9b3e95c24c",
                    "kind": "criterion",
                    "label": null,
                    "line": 23,
                    "name": "The ranking rule and its parameters are recorded in the release manifest.",
                    "path": "spec/products/univ-ingest/identity/choose-the-preferred-measurement.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f23-636e-7035-8185-ab9ce127e733",
                    "kind": "criterion",
                    "label": null,
                    "line": 25,
                    "name": "The object names its preferred measurement and the uncertainty that made it win.",
                    "path": "spec/products/univ-ingest/identity/choose-the-preferred-measurement.yaml"
                  },
                  {
                    "column": 10,
                    "key": "01a19f23-636e-7035-8185-ab9dfac6edfe",
                    "kind": "requirement",
                    "label": null,
                    "line": 27,
                    "name": "Univ Ingest shall take an object's sky position from its catalogue entry with the smallest position uncertainty.",
                    "path": "spec/products/univ-ingest/identity/choose-the-preferred-measurement.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f23-636e-7035-8185-ab9e42fa2c14",
                    "kind": "criterion",
                    "label": null,
                    "line": 33,
                    "name": "A Gaia position is preferred over a Hipparcos one, and either over a survey position, unless a published uncertainty says otherwise.",
                    "path": "spec/products/univ-ingest/identity/choose-the-preferred-measurement.yaml"
                  },
                  {
                    "column": 10,
                    "key": "01a19f23-636e-7035-8185-ab9fe065861e",
                    "kind": "requirement",
                    "label": null,
                    "line": 35,
                    "name": "If an object has no distance, then Univ Ingest shall keep the object with its sky position alone and give it no derived three-dimensional position.",
                    "path": "spec/products/univ-ingest/identity/choose-the-preferred-measurement.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f23-636e-7035-8185-aba03617706c",
                    "kind": "criterion",
                    "label": null,
                    "line": 42,
                    "name": "The object can be looked up but appears in no tile and in no bounded volume query.",
                    "path": "spec/products/univ-ingest/identity/choose-the-preferred-measurement.yaml"
                  },
                  {
                    "column": 6,
                    "key": "01a19f23-636e-7035-8185-aba1fc8f7bbd",
                    "kind": "feature",
                    "label": null,
                    "line": 1,
                    "name": "Cross-match catalogues",
                    "path": "spec/products/univ-ingest/identity/cross-match-catalogues.yaml"
                  },
                  {
                    "column": 10,
                    "key": "01a19f23-636e-7035-8185-aba27e410ae5",
                    "kind": "requirement",
                    "label": null,
                    "line": 11,
                    "name": "Univ Ingest shall resolve catalogue entries that share a published cross-identification into one object before matching by position.",
                    "path": "spec/products/univ-ingest/identity/cross-match-catalogues.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f23-636f-72bd-b194-1509ef3e2d47",
                    "kind": "criterion",
                    "label": null,
                    "line": 17,
                    "name": "A published cross-identification, such as the Gaia DR3 Hipparcos cross-identification or a shared PGC number, is used before a positional match.",
                    "path": "spec/products/univ-ingest/identity/cross-match-catalogues.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f23-636f-72bd-b194-150a909c8f0e",
                    "kind": "criterion",
                    "label": null,
                    "line": 19,
                    "name": "The object records the cross-identification as the method that resolved it.",
                    "path": "spec/products/univ-ingest/identity/cross-match-catalogues.yaml"
                  },
                  {
                    "column": 10,
                    "key": "01a19f23-636f-72bd-b194-150b2d35ea65",
                    "kind": "requirement",
                    "label": null,
                    "line": 21,
                    "name": "Univ Ingest shall merge catalogue entries into one object when they agree within the release's match tolerances and no other candidate does.",
                    "path": "spec/products/univ-ingest/identity/cross-match-catalogues.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f23-636f-72bd-b194-150cc0a7de4d",
                    "kind": "criterion",
                    "label": null,
                    "line": 27,
                    "name": "The tolerances on angular separation and on redshift or distance are set for each pair of sources in the release's matching rules.",
                    "path": "spec/products/univ-ingest/identity/cross-match-catalogues.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f23-636f-72bd-b194-150dfab9225c",
                    "kind": "criterion",
                    "label": null,
                    "line": 29,
                    "name": "Each merge records its method, the separation, the redshift or distance difference and a confidence between 0 and 1.",
                    "path": "spec/products/univ-ingest/identity/cross-match-catalogues.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f23-636f-72bd-b194-150e56ac26d6",
                    "kind": "criterion",
                    "label": null,
                    "line": 31,
                    "name": "The release's matching rules state how the confidence is computed.",
                    "path": "spec/products/univ-ingest/identity/cross-match-catalogues.yaml"
                  },
                  {
                    "column": 10,
                    "key": "01a19f23-636f-72bd-b194-150f94f19121",
                    "kind": "requirement",
                    "label": null,
                    "line": 33,
                    "name": "If a catalogue entry has more than one candidate within the match tolerances, then Univ Ingest shall keep the candidates as separate objects linked as candidate matches.",
                    "path": "spec/products/univ-ingest/identity/cross-match-catalogues.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f23-636f-72bd-b194-1510f8ea82b8",
                    "kind": "criterion",
                    "label": null,
                    "line": 40,
                    "name": "Each candidate link carries its confidence.",
                    "path": "spec/products/univ-ingest/identity/cross-match-catalogues.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f23-636f-72bd-b194-15114b1cd667",
                    "kind": "criterion",
                    "label": null,
                    "line": 42,
                    "name": "No measurement is merged across a candidate link.",
                    "path": "spec/products/univ-ingest/identity/cross-match-catalogues.yaml"
                  },
                  {
                    "column": 10,
                    "key": "01a19f23-636f-72bd-b194-15129323b215",
                    "kind": "requirement",
                    "label": null,
                    "line": 44,
                    "name": "Univ Ingest shall attach to each object the designations and names its catalogue entries carry.",
                    "path": "spec/products/univ-ingest/identity/cross-match-catalogues.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f23-636f-72bd-b194-1513f385222f",
                    "kind": "criterion",
                    "label": null,
                    "line": 50,
                    "name": "Each designation keeps the source that gave it.",
                    "path": "spec/products/univ-ingest/identity/cross-match-catalogues.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f23-636f-72bd-b194-15144dcb948e",
                    "kind": "criterion",
                    "label": null,
                    "line": 52,
                    "name": "A common name, such as M31 or the Large Magellanic Cloud, is attached with the source that published it.",
                    "path": "spec/products/univ-ingest/identity/cross-match-catalogues.yaml"
                  },
                  {
                    "column": 6,
                    "key": "01a19f23-636f-72bd-b194-1515b9ad9670",
                    "kind": "feature",
                    "label": null,
                    "line": 1,
                    "name": "Keep object ids stable",
                    "path": "spec/products/univ-ingest/identity/keep-object-ids-stable.yaml"
                  },
                  {
