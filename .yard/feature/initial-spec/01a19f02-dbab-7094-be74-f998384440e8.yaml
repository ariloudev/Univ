          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "The 2M++ catalogue and groups, the 2M++ reconstruction and the eRASS1 clusters join the first release"
        consequence: "The galaxy sources gain 2M++ (Lavaux & Hudson 2011), which cross-matching folds into the 2MRS, 6dFGS and SDSS entries it was compiled from. Its group table and the eRASS1 clusters (Bulbul et al. 2024; Kluge et al. 2024) add groups and clusters as structures, and eRASS1's half-sky footprint is recorded. Carrick et al. 2015 becomes a second reconstructed volume grid beside CF4++, and its download location is verified during the build. COSMOS-Web and DESI DR1 wait for a later release."
        question: 01a19f1e-60e2-7194-a6b0-be38d5416ae8
  - key: 01a19f21-0161-754b-9387-765b3bf2fab9
    id: d-object-storage
    kind: decision
    number: 22
    versions:
      - key: 01a19f21-0161-754b-9387-765eae0f2887
        at: 2026-11-03T01:58:22Z
        revision: 14
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Objects stay in D1; R2 shards wait for a DESI-sized source"
        consequence: "Every object is a D1 row, and one release's D1 tables are capped at 10 GB by a monitored constraint. Adding a source the size of DESI requires a new decision that moves bulk objects into R2 shards first."
        question: 01a19f1e-60e2-7194-a6b0-be39d3b6de64
  - key: 01a19f21-0161-754b-9387-765c41245833
    id: sources-as-components
    kind: note
    versions:
      - key: 01a19f21-0161-754b-9387-765f92c71239
        at: 2026-11-03T01:58:22Z
        revision: 14
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Data sources modelled as external Components"
        markdown: "At your request, each data source is its own **external Component**, nested under the provider it is fetched from (SkyServer, VizieR, the ESA Gaia Archive, the Cosmicflows site, the eROSITA-DE release, the 2M++ reconstruction's host and the published literature). Each one's body holds its citation, size and terms of use, and **Fetch a source durably** realizes every source leaf."
        tone: info
  - key: 01a19f26-7fab-718c-ad3c-88b4f6ca6fd9
    id: d-4d-dropped
    kind: decision
    number: 23
    versions:
      - key: 01a19f26-7fab-718c-ad3c-88b6d8e7571c
        at: 2026-11-03T02:04:22Z
        revision: 15
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Drop 4D storage; time lives in temporal layers"
        consequence: "Star propagation to an epoch, lookback time on objects and as-of-time reads of layers are removed from the spec. Kept: time records on layer items and queries filtered by them, numbered item versions, release pinning, and every position naming its epoch. This replaces the earlier choice of all four readings of 4D."
        question: 01a19f0d-0f67-7301-99ac-b3fc69635039
