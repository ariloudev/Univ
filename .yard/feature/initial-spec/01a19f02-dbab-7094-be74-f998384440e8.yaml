                {
                  "change": "added",
                  "key": "01a19f25-5955-701e-b3cf-dd9ac1fad17e",
                  "kind": "decision",
                  "label": null,
                  "name": "Enforce per-key quotas and per-client rate limits",
                  "words": {
                    "after": "Enforce per-key quotas and per-client rate limits\n\nEvery key has quotas, every client a rate limit, and a refusal names what was exceeded."
                  }
                },
                {
                  "change": "added",
                  "key": "01a19f25-5955-701e-b3cf-dda232cd8d3f",
                  "kind": "decision",
                  "label": null,
                  "name": "Let clients follow layers through a change feed and entity tags",
                  "words": {
                    "after": "Let clients follow layers through a change feed and entity tags\n\nEach layer has a change sequence that clients poll since a cursor, and every read carries an entity tag."
                  }
                },
                {
                  "change": "added",
                  "key": "01a19f25-5955-701e-b3cf-ddaac3293354",
                  "kind": "decision",
                  "label": null,
                  "name": "Generate the OpenAPI document from the Rust types",
                  "words": {
                    "after": "Generate the OpenAPI document from the Rust types\n\nUniv Server serves an OpenAPI 3.1 document generated from univ-model, and the tile format ships with a reference TS decoder."
                  }
                },
                {
                  "change": "added",
                  "key": "01a19f25-5955-701e-b3cf-ddb230ab4847",
                  "kind": "decision",
                  "label": null,
                  "name": "Give layer items geometry, time, links and versions, but no free-form properties",
                  "words": {
                    "after": "Give layer items geometry, time, links and versions, but no free-form properties\n\nLayer items carry typed geometry, time records, links, sources and versions, and nothing untyped."
                  }
                },
                {
                  "change": "added",
                  "key": "01a19f25-5955-701e-b3cf-ddb94b8c7196",
                  "kind": "decision",
                  "label": null,
                  "name": "Host Univ Server on Cloudflare Workers in Rust",
                  "words": {
                    "after": "Host Univ Server on Cloudflare Workers in Rust\n\nUniv Server is a Worker compiled from Rust, storing its data in D1 and R2."
                  }
                },
                {
                  "change": "added",
                  "key": "01a19f25-5955-701e-b3cf-ddc0d2082b79",
                  "kind": "decision",
                  "label": null,
                  "name": "Ingest offline with a command-line tool on the owner's machine",
                  "words": {
                    "after": "Ingest offline with a command-line tool on the owner's machine\n\nIngest runs on the owner's machine and publishes complete releases for Univ Server to serve."
                  }
                },
                {
                  "change": "added",
                  "key": "01a19f25-5955-701e-b3cf-ddc75d01acc4",
                  "kind": "decision",
                  "label": null,
                  "name": "Keep every measurement and prefer the most precise distance",
                  "words": {
                    "after": "Keep every measurement and prefer the most precise distance\n\nEach object keeps every measurement, and the one with the smallest fractional distance uncertainty, counting peculiar velocity for redshifts, places it."
                  }
                },
                {
                  "change": "added",
                  "key": "01a19f25-5955-701e-b3cf-ddcffaf7bf98",
                  "kind": "decision",
                  "label": null,
                  "name": "Keep every object in D1 until a DESI-sized source arrives",
                  "words": {
                    "after": "Keep every object in D1 until a DESI-sized source arrives\n\nObjects live in D1 under a monitored 10 GB cap, and a larger source first needs a decision on R2 shards."
                  }
                },
                {
                  "change": "added",
                  "key": "01a19f25-5955-701e-b3cf-ddd6c363d1fe",
                  "kind": "decision",
                  "label": null,
                  "name": "Make each layer public or private to its owning key",
                  "words": {
                    "after": "Make each layer public or private to its owning key\n\nEach layer is public or readable only with its owning key, and a private layer looks absent to everyone else."
                  }
                },
                {
                  "change": "added",
                  "key": "01a19f25-5955-701e-b3cf-ddde3051d5da",
                  "kind": "decision",
                  "label": null,
                  "name": "Publish reference data as immutable, numbered releases",
                  "words": {
                    "after": "Publish reference data as immutable, numbered releases\n\nReference data changes only by publishing a new release, and any unpruned release can be read."
                  }
                },
                {
                  "change": "added",
                  "key": "01a19f25-5955-701e-b3cf-dde50e292ff4",
                  "kind": "decision",
                  "label": null,
                  "name": "Read anonymously and write with an API key per client application",
                  "words": {
                    "after": "Read anonymously and write with an API key per client application\n\nReference data and public layers are read anonymously, and every write carries an API key."
                  }
                },
                {
                  "change": "added",
                  "key": "01a19f25-5955-701e-b3cf-ddedd70737d2",
                  "kind": "decision",
                  "label": null,
                  "name": "Run the first version locally only",
                  "words": {
                    "after": "Run the first version locally only\n\nUniv Server runs under wrangler dev, and Univ Ingest publishes to its local storage."
                  }
                },
                {
                  "change": "added",
                  "key": "01a19f25-5955-701e-b3cf-ddf490f8ab1b",
                  "kind": "decision",
                  "label": null,
                  "name": "Serve galaxies, large structures, the Local Group and nearby stars first",
                  "words": {
                    "after": "Serve galaxies, large structures, the Local Group and nearby stars first\n\nThe first release holds galaxies, large structures and fields, the Local Group and nearby galaxies, and Milky Way stars."
                  }
                },
                {
                  "change": "added",
                  "key": "01a19f25-5955-701e-b3cf-ddfbab29b988",
                  "kind": "decision",
                  "label": null,
                  "name": "Serve objects as JSON and bulk points as pre-built binary tiles",
                  "words": {
                    "after": "Serve objects as JSON and bulk points as pre-built binary tiles\n\nRecords are JSON, and bulk points are binary tiles that Univ Ingest builds and the Worker streams."
                  }
                },
                {
                  "change": "added",
                  "key": "01a19f25-5955-701e-b3cf-de0332d4cea7",
                  "kind": "decision",
                  "label": null,
                  "name": "Design Univ Server independently of the cosmic-newsroom experiment",
                  "words": {
                    "after": "Design Univ Server independently of the cosmic-newsroom experiment\n\nUniv Server is specified on its own, and any move of the newsroom onto it is decided later."
                  }
                },
                {
                  "change": "added",
                  "key": "01a19f25-5955-701e-b3cf-de0aff64ecd9",
                  "kind": "decision",
                  "label": null,
                  "name": "Support a closed set of geometry kinds, without meshes",
                  "words": {
                    "after": "Support a closed set of geometry kinds, without meshes\n\nuniv-model defines eight geometry kinds, and a mesh is refused."
                  }
                },
                {
                  "change": "added",
                  "key": "01a19f25-5955-701e-b3cf-de113aab1645",
                  "kind": "decision",
                  "label": null,
                  "name": "Take Gaia's nearby and bright stars, not the whole catalogue",
                  "words": {
                    "after": "Take Gaia's nearby and bright stars, not the whole catalogue\n\nStars come from the Gaia Catalogue of Nearby Stars, Gaia DR3 bright stars with Bailer-Jones 2021 distances, and the Hipparcos new reduction."
                  }
                },
                {
                  "change": "added",
                  "key": "01a19f25-5955-701e-b3cf-de1968d9f808",
                  "kind": "decision",
                  "label": null,
                  "name": "Tile points as a Cartesian octree per scale domain",
                  "words": {
                    "after": "Tile points as a Cartesian octree per scale domain\n\nEach scale domain is an octree in ICRS Cartesian coordinates, with rotations to galactic and supergalactic in its manifest."
                  }
                },
                {
                  "change": "added",
                  "key": "01a19f25-5955-701e-b3cf-de21752217fa",
                  "kind": "decision",
                  "label": null,
                  "name": "Keep time in temporal layers rather than a 4D store",
                  "words": {
                    "after": "Keep time in temporal layers rather than a 4D store\n\nTime lives in layers: items carry time records that queries filter on, and versions that stay readable by number. Reference data names each position's epoch but is not propagated in time."
                  }
                }
