                  },
                  {
                    "column": 14,
                    "key": "01a19f22-b0bc-76da-bac8-977f946ec036",
                    "kind": "criterion",
                    "label": null,
                    "line": 27,
                    "name": "The status line names the current stage, which is fetch, normalize, cross-match, tiles, build or publish, with its count of items done of items expected.",
