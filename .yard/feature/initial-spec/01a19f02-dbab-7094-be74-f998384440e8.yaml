                    "key": "01a19f23-636f-72bd-b194-1542bf149fa0",
                    "kind": "requirement",
                    "label": null,
                    "line": 26,
                    "name": "If an upload fails part way, then Univ Ingest shall leave latest where it was and continue the upload on the next run.",
