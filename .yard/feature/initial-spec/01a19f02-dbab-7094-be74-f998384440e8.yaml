                    "key": "01a19f20-8e6c-7039-b16f-abe4333991f2",
                    "kind": "requirement",
                    "label": null,
                    "line": 12,
                    "name": "When the owner issues an API key, Univ Server shall create the key with its label and quotas and return its secret once.",
