                    "key": "01a19f20-8e6c-7039-b16f-abdaebf630a9",
                    "kind": "criterion",
                    "label": null,
                    "line": 18,
                    "name": "The quotas are layers per key, items per layer and bytes per item version.",
                    "path": "spec/products/univ-server/access/enforce-quotas-and-rate-limits.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f20-8e6c-7039-b16f-abdb6193c8a7",
                    "kind": "criterion",
                    "label": null,
                    "line": 20,
                    "name": "The problem details give the quota, its limit and the key's current usage.",
                    "path": "spec/products/univ-server/access/enforce-quotas-and-rate-limits.yaml"
                  },
