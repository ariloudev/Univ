                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-183725365029",
                  "kind": "criterion",
                  "label": null,
                  "name": "A source definition lists the mirrors to try, in order.",
                  "parent": "01a19f22-2ad9-716e-876f-1832b1bae1e2"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-1838f05eb5b7",
                  "kind": "requirement",
                  "label": null,
                  "name": "If a source definition is incomplete or names an unknown unit, frame or scale domain, then Univ Ingest shall refuse the run before fetching anything and name the field.",
                  "parent": "01a19f22-2ad9-716e-876f-1831f423e25f"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-183984aea659",
                  "kind": "criterion",
                  "label": null,
                  "name": "The message names the source definition, the field and what is wrong with it.",
                  "parent": "01a19f22-2ad9-716e-876f-1838f05eb5b7"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-183a6daa9364",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall record in each source definition whether its terms permit redistributing its data, with the terms it rests on.",
                  "parent": "01a19f22-2ad9-716e-876f-1831f423e25f"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-183b90085a10",
                  "kind": "criterion",
                  "label": null,
                  "name": "The redistribution status is permitted, permitted with credit, or forbidden.",
                  "parent": "01a19f22-2ad9-716e-876f-183a6daa9364"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-183ca629c7f8",
                  "kind": "criterion",
                  "label": null,
                  "name": "The source definition quotes the terms of use it judged and states the reasoning for its status.",
                  "parent": "01a19f22-2ad9-716e-876f-183a6daa9364"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-183d2d91487a",
                  "kind": "requirement",
                  "label": null,
                  "name": "If a source definition's redistribution status is forbidden, then Univ Ingest shall refuse to publish any release that holds the source.",
                  "parent": "01a19f22-2ad9-716e-876f-1831f423e25f"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-183ee3b99b68",
                  "kind": "criterion",
                  "label": null,
                  "name": "The message names the source and quotes its terms of use.",
                  "parent": "01a19f22-2ad9-716e-876f-183d2d91487a"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-183f79f9ae1c",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall provide a source definition for each source of the first release.",
                  "parent": "01a19f22-2ad9-716e-876f-1831f423e25f"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-1840046e9bc8",
                  "kind": "criterion",
                  "label": null,
                  "name": "The galaxy sources are SDSS DR17 main galaxy sample, BOSS DR17 Great Wall region, 6dFGS DR3, 2MRS, 2M++ catalogue and Cosmicflows-4 distances.",
                  "parent": "01a19f22-2ad9-716e-876f-183f79f9ae1c"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-1841361113b6",
                  "kind": "criterion",
                  "label": null,
                  "name": "The Local Group and nearby sources are McConnachie 2012 Local Group and the Updated Nearby Galaxy Catalog.",
                  "parent": "01a19f22-2ad9-716e-876f-183f79f9ae1c"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-1842afd6d59e",
                  "kind": "criterion",
                  "label": null,
                  "name": "The star sources are the Gaia Catalogue of Nearby Stars, Gaia DR3 bright stars, Bailer-Jones 2021 distances, the Gaia DR3 Hipparcos cross-identification and the Hipparcos new reduction.",
                  "parent": "01a19f22-2ad9-716e-876f-183f79f9ae1c"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-18439d96b214",
                  "kind": "criterion",
                  "label": null,
                  "name": "The structure and field sources are the CF4++ density grid, CF4 basins of attraction, 2M++ reconstruction, eRASS1 clusters and Researched structures.",
                  "parent": "01a19f22-2ad9-716e-876f-183f79f9ae1c"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-18443b0ddcd6",
                  "kind": "feature",
                  "label": null,
                  "name": "Fetch a source durably",
                  "parent": "01a19f1a-685d-7357-b67e-d6593dd0cb35"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-1845b82daefd",
                  "kind": "requirement",
                  "label": null,
                  "name": "When a request to a provider fails or times out, Univ Ingest shall retry it with growing waits and then move to the source's next mirror.",
                  "parent": "01a19f22-2ad9-716e-876f-18443b0ddcd6"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-18463a5dce5c",
                  "kind": "criterion",
                  "label": null,
                  "name": "A request is retried at least four times on one mirror, with waits that double from two seconds.",
                  "parent": "01a19f22-2ad9-716e-876f-1845b82daefd"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-184791f85a52",
                  "kind": "criterion",
                  "label": null,
                  "name": "A mirror that fails all its retries is skipped for the rest of the run.",
                  "parent": "01a19f22-2ad9-716e-876f-1845b82daefd"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-184848d07285",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall fetch a large source in chunks and keep each chunk on disk as soon as it arrives.",
                  "parent": "01a19f22-2ad9-716e-876f-18443b0ddcd6"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-184902d146a6",
                  "kind": "criterion",
                  "label": null,
                  "name": "A run that stops part way resumes from the first chunk not yet on disk.",
                  "parent": "01a19f22-2ad9-716e-876f-184848d07285"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-184a18088c6b",
                  "kind": "criterion",
                  "label": null,
                  "name": "A chunk is written to a temporary file and renamed once complete, so a partial file is never read as a chunk.",
                  "parent": "01a19f22-2ad9-716e-876f-184848d07285"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-184b2e4614ad",
                  "kind": "criterion",
                  "label": null,
                  "name": "A chunk already on disk is not fetched again.",
                  "parent": "01a19f22-2ad9-716e-876f-184848d07285"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-97757996f970",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the download of a single file stops part way, Univ Ingest shall continue the download from the last byte on disk on the next run.",
                  "parent": "01a19f22-2ad9-716e-876f-18443b0ddcd6"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-9776aedb5264",
                  "kind": "criterion",
                  "label": null,
                  "name": "The download continues with an HTTP range request from the byte it reached.",
                  "parent": "01a19f22-b0bc-76da-bac8-97757996f970"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-9777e4054f04",
                  "kind": "criterion",
                  "label": null,
                  "name": "Where the provider does not honour range requests, the download starts over and the progress display says so.",
                  "parent": "01a19f22-b0bc-76da-bac8-97757996f970"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-9778f9150cca",
                  "kind": "criterion",
                  "label": null,
                  "name": "Where the provider changed the file since the partial download began, as its entity tag or length shows, the download starts over.",
                  "parent": "01a19f22-b0bc-76da-bac8-97757996f970"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-9779eea8a5c5",
                  "kind": "criterion",
                  "label": null,
                  "name": "The completed file is checked against the size and digest its provider publishes, where it publishes them.",
                  "parent": "01a19f22-b0bc-76da-bac8-97757996f970"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-977a62f6ff81",
                  "kind": "criterion",
                  "label": null,
                  "name": "The bytes of a partial download stay in a temporary file until the file is complete.",
                  "parent": "01a19f22-b0bc-76da-bac8-97757996f970"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-184c59e4c9a1",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall record the SHA-256 and the retrieval time of every payload before parsing it.",
                  "parent": "01a19f22-2ad9-716e-876f-18443b0ddcd6"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-184dbfdb539d",
                  "kind": "criterion",
                  "label": null,
                  "name": "The source's provenance lists each payload with its digest, retrieval time and the URL it came from.",
                  "parent": "01a19f22-2ad9-716e-876f-184c59e4c9a1"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-184e679b3ea0",
                  "kind": "requirement",
                  "label": null,
                  "name": "If a chunk cannot be fetched from any mirror, then Univ Ingest shall fail the source and build no release that holds it.",
                  "parent": "01a19f22-2ad9-716e-876f-18443b0ddcd6"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-184f18271ab3",
                  "kind": "criterion",
                  "label": null,
                  "name": "The message names the source, the chunk and the last error of each mirror.",
                  "parent": "01a19f22-2ad9-716e-876f-184e679b3ea0"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-1850f88a0c79",
                  "kind": "criterion",
                  "label": null,
                  "name": "The chunks already on disk are kept for the next run.",
                  "parent": "01a19f22-2ad9-716e-876f-184e679b3ea0"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-18512268f257",
                  "kind": "requirement",
                  "label": null,
                  "name": "Where the owner runs Univ Ingest offline, Univ Ingest shall build from the chunks on disk alone and fail on the first chunk that is missing.",
                  "parent": "01a19f22-2ad9-716e-876f-18443b0ddcd6"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-185248f45d00",
                  "kind": "criterion",
                  "label": null,
                  "name": "No request is made to any provider.",
                  "parent": "01a19f22-2ad9-716e-876f-18512268f257"
                },
                {
                  "change": "added",
                  "key": "01a19f1a-685d-7357-b67e-d65aba28b58f",
                  "kind": "feature_group",
                  "label": null,
                  "name": "Normalization",
                  "parent": "01a19f1a-685d-7357-b67e-d658085bf5c8"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-18530217fadb",
                  "kind": "feature",
                  "label": null,
                  "name": "Derive positions",
                  "parent": "01a19f1a-685d-7357-b67e-d65aba28b58f"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-1854a9750478",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall derive each object's Cartesian position from its preferred measurement under the release cosmology.",
                  "parent": "01a19f22-2ad9-716e-876f-18530217fadb"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-185572e41a3f",
                  "kind": "criterion",
                  "label": null,
                  "name": "The release cosmology is flat ΛCDM with Planck 2018 parameters, H0 = 67.66 km/s/Mpc and Ωm = 0.3111, unless the release names another.",
                  "parent": "01a19f22-2ad9-716e-876f-1854a9750478"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-185687a92854",
                  "kind": "criterion",
                  "label": null,
                  "name": "A redshift distance is the comoving distance of the CMB-frame redshift.",
                  "parent": "01a19f22-2ad9-716e-876f-1854a9750478"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-1857a487f288",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each position is given in ICRS equatorial, galactic and supergalactic Cartesian coordinates with the Solar System barycentre as origin.",
                  "parent": "01a19f22-2ad9-716e-876f-1854a9750478"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-18581d266d87",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each derived value records the release cosmology, its chain of transformations and the version of univ-model that computed it.",
                  "parent": "01a19f22-2ad9-716e-876f-1854a9750478"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-18596dbe801e",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall rescale each distance or size published for another Hubble constant to the release cosmology's Hubble constant.",
                  "parent": "01a19f22-2ad9-716e-876f-18530217fadb"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-185a4c7f512f",
                  "kind": "criterion",
                  "label": null,
                  "name": "The rescaled value is stored beside the native value and the Hubble constant it was published for.",
                  "parent": "01a19f22-2ad9-716e-876f-18596dbe801e"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-185b99a202e5",
                  "kind": "criterion",
                  "label": null,
                  "name": "A size is rescaled with the same factor as its structure's distance, so the structure keeps its size relative to its distance.",
                  "parent": "01a19f22-2ad9-716e-876f-18596dbe801e"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-185fd835d316",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall transform between frames with the published definitions of the galactic and supergalactic systems.",
                  "parent": "01a19f22-2ad9-716e-876f-18530217fadb"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-186064637cbc",
                  "kind": "criterion",
                  "label": null,
                  "name": "Galactic coordinates use the ICRS to galactic transformation of the Hipparcos catalogue (ESA 1997, volume 1, section 1.5.3).",
                  "parent": "01a19f22-2ad9-716e-876f-185fd835d316"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-18610047a726",
                  "kind": "criterion",
                  "label": null,
                  "name": "Supergalactic coordinates use the pole and origin of Lahav et al. 2000 (MNRAS 312, 166).",
                  "parent": "01a19f22-2ad9-716e-876f-185fd835d316"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-186219f4e104",
                  "kind": "feature",
                  "label": null,
                  "name": "Normalize records",
                  "parent": "01a19f1a-685d-7357-b67e-d65aba28b58f"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-18637db5e446",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall convert each catalogue entry into univ-model values while keeping each native value.",
                  "parent": "01a19f22-2ad9-716e-876f-186219f4e104"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-186415c2b2be",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each position is stored in ICRS with the epoch of its source.",
                  "parent": "01a19f22-2ad9-716e-876f-18637db5e446"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-1865763fa63d",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each native value keeps its published unit beside the normalized value.",
                  "parent": "01a19f22-2ad9-716e-876f-18637db5e446"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-18663bbd5e71",
                  "kind": "criterion",
                  "label": null,
                  "name": "Normalized values use degrees for angles, km/s for velocities, parsecs for stellar distances and megaparsecs for extragalactic ones.",
                  "parent": "01a19f22-2ad9-716e-876f-18637db5e446"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-1867aeb456fd",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each value is classified by its kind of value.",
                  "parent": "01a19f22-2ad9-716e-876f-18637db5e446"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-186820f4df2c",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each uncertainty is typed as a symmetric error, an asymmetric interval, an upper or lower limit, a credible region, or none reported.",
                  "parent": "01a19f22-2ad9-716e-876f-18637db5e446"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-186959bf0d6e",
                  "kind": "criterion",
                  "label": null,
                  "name": "A value published without an uncertainty is marked as having none reported, never as having zero uncertainty.",
                  "parent": "01a19f22-2ad9-716e-876f-18637db5e446"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-186a829fb7fa",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall record each distance with its kind, its method and, where it depends on one, its Hubble constant or cosmology.",
                  "parent": "01a19f22-2ad9-716e-876f-186219f4e104"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-186b82bcfc95",
                  "kind": "criterion",
                  "label": null,
                  "name": "The kinds of distance are parallax, geometric or photogeometric, primary indicator, secondary indicator, spectroscopic redshift and photometric redshift.",
                  "parent": "01a19f22-2ad9-716e-876f-186a829fb7fa"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-186c1d4c0f38",
                  "kind": "criterion",
                  "label": null,
                  "name": "The method names the indicator, such as Cepheids, the tip of the red giant branch, masers, type Ia supernovae, surface brightness fluctuations, Tully-Fisher or fundamental plane.",
                  "parent": "01a19f22-2ad9-716e-876f-186a829fb7fa"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-186d9b7a0c04",
                  "kind": "criterion",
                  "label": null,
                  "name": "A distance published in h⁻¹ Mpc or for a stated Hubble constant keeps that constant beside its native value.",
                  "parent": "01a19f22-2ad9-716e-876f-186a829fb7fa"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-186e940da69e",
                  "kind": "criterion",
                  "label": null,
                  "name": "A distance modulus is kept as published beside the distance derived from it.",
                  "parent": "01a19f22-2ad9-716e-876f-186a829fb7fa"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-186f83aad488",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall keep each redshift in the frame its source published it in and derive its value in the CMB frame.",
                  "parent": "01a19f22-2ad9-716e-876f-186219f4e104"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-187089f08fa0",
                  "kind": "criterion",
                  "label": null,
                  "name": "A heliocentric redshift is kept as measured.",
                  "parent": "01a19f22-2ad9-716e-876f-186f83aad488"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-187151a4aac5",
                  "kind": "criterion",
                  "label": null,
                  "name": "The CMB-frame redshift uses the Planck 2018 dipole of 369.82 km/s toward galactic longitude 264.021° and latitude 48.253°.",
                  "parent": "01a19f22-2ad9-716e-876f-186f83aad488"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-1872f4143cd2",
                  "kind": "criterion",
                  "label": null,
                  "name": "The derivation is recorded with the redshift it was derived from.",
                  "parent": "01a19f22-2ad9-716e-876f-186f83aad488"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-18734f56d5aa",
                  "kind": "requirement",
                  "label": null,
                  "name": "If a catalogue entry fails validation, then Univ Ingest shall leave the entry out of the release and count it under its reason.",
                  "parent": "01a19f22-2ad9-716e-876f-186219f4e104"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-187496ae140f",
                  "kind": "criterion",
                  "label": null,
                  "name": "The source's provenance gives the count of entries left out for each reason.",
                  "parent": "01a19f22-2ad9-716e-876f-18734f56d5aa"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-18755300ea38",
                  "kind": "criterion",
                  "label": null,
                  "name": "No entry is left out without a reason recorded.",
                  "parent": "01a19f22-2ad9-716e-876f-18734f56d5aa"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-1876f53660fb",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall fix a known defect of a source only as its source definition states the fix.",
                  "parent": "01a19f22-2ad9-716e-876f-186219f4e104"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-1877e0c274f2",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each fix in a source definition names the defect, the change it makes and the evidence for it.",
                  "parent": "01a19f22-2ad9-716e-876f-1876f53660fb"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-187827977f54",
                  "kind": "criterion",
                  "label": null,
                  "name": "Cosmicflows-4's SGX, SGY and SGZ columns are read as km/s, as the evidence shows, although VizieR labels them Mpc.",
                  "parent": "01a19f22-2ad9-716e-876f-1876f53660fb"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-18790159a9dd",
                  "kind": "criterion",
                  "label": null,
                  "name": "The source's provenance lists each fix applied with the number of entries it changed.",
                  "parent": "01a19f22-2ad9-716e-876f-1876f53660fb"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-187ab1b6831a",
                  "kind": "feature",
                  "label": null,
                  "name": "Record a researched structure",
                  "parent": "01a19f1a-685d-7357-b67e-d65aba28b58f"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-187be2150c85",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall read each researched structure from a structure file in which every number cites where it comes from.",
                  "parent": "01a19f22-2ad9-716e-876f-187ab1b6831a"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-187cf88a2254",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each number cites its paper and the sentence, table or figure it was taken from.",
                  "parent": "01a19f22-2ad9-716e-876f-187be2150c85"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-187dd6a97fba",
                  "kind": "criterion",
                  "label": null,
                  "name": "The structure's geometry is one of the geometry kinds univ-model defines, in a named frame.",
                  "parent": "01a19f22-2ad9-716e-876f-187be2150c85"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-187e0756dd85",
                  "kind": "requirement",
                  "label": null,
                  "name": "If a number in a structure file cites nothing, then Univ Ingest shall refuse the structure and name the number.",
                  "parent": "01a19f22-2ad9-716e-876f-187ab1b6831a"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-187fc51a43e0",
                  "kind": "criterion",
                  "label": null,
                  "name": "The message names the structure file, the field and the number.",
                  "parent": "01a19f22-2ad9-716e-876f-187e0756dd85"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-18803a9713b5",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall mark each value digitised from a figure as estimated.",
                  "parent": "01a19f22-2ad9-716e-876f-187ab1b6831a"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-18814f7bf908",
                  "kind": "criterion",
                  "label": null,
                  "name": "A digitised value cites the figure it was read from.",
                  "parent": "01a19f22-2ad9-716e-876f-18803a9713b5"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-188208f7ba13",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall record, for a structure outlined from a volume grid, the grid, the threshold and the test that admitted the outline.",
                  "parent": "01a19f22-2ad9-716e-876f-187ab1b6831a"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-1883e57d3f39",
                  "kind": "criterion",
                  "label": null,
                  "name": "The test compares the outline with the galaxy catalogues that cover it, as the earlier Univ work did for voids.",
                  "parent": "01a19f22-2ad9-716e-876f-188208f7ba13"
                },
                {
                  "change": "added",
                  "key": "01a19f22-2ad9-716e-876f-188469a36f95",
                  "kind": "criterion",
                  "label": null,
                  "name": "A structure whose outline fails its test is published as a point at its published position, with the reason.",
                  "parent": "01a19f22-2ad9-716e-876f-188208f7ba13"
                },
                {
                  "change": "added",
                  "key": "01a19f1a-685d-7357-b67e-d65bef1ca65c",
                  "kind": "feature_group",
                  "label": null,
                  "name": "Identity",
                  "parent": "01a19f1a-685d-7357-b67e-d658085bf5c8"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636e-7035-8185-ab97eb9c2fb9",
                  "kind": "feature",
                  "label": null,
                  "name": "Choose the preferred measurement",
                  "parent": "01a19f1a-685d-7357-b67e-d65bef1ca65c"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636e-7035-8185-ab988f5d57b7",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall choose as an object's preferred distance the measurement with the smallest fractional distance uncertainty.",
                  "parent": "01a19f23-636e-7035-8185-ab97eb9c2fb9"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636e-7035-8185-ab998407d632",
                  "kind": "criterion",
                  "label": null,
                  "name": "The uncertainty of a redshift distance includes a peculiar-velocity term, 300 km/s unless the release's ranking rule sets another.",
                  "parent": "01a19f23-636e-7035-8185-ab988f5d57b7"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636e-7035-8185-ab9ac704109a",
                  "kind": "criterion",
                  "label": null,
                  "name": "A tie is broken by method rank: geometric, then primary indicator, then secondary indicator, then spectroscopic redshift, then photometric redshift.",
                  "parent": "01a19f23-636e-7035-8185-ab988f5d57b7"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636e-7035-8185-ab9b3e95c24c",
                  "kind": "criterion",
                  "label": null,
                  "name": "The ranking rule and its parameters are recorded in the release manifest.",
                  "parent": "01a19f23-636e-7035-8185-ab988f5d57b7"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636e-7035-8185-ab9ce127e733",
                  "kind": "criterion",
                  "label": null,
                  "name": "The object names its preferred measurement and the uncertainty that made it win.",
                  "parent": "01a19f23-636e-7035-8185-ab988f5d57b7"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636e-7035-8185-ab9dfac6edfe",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall take an object's sky position from its catalogue entry with the smallest position uncertainty.",
                  "parent": "01a19f23-636e-7035-8185-ab97eb9c2fb9"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636e-7035-8185-ab9e42fa2c14",
                  "kind": "criterion",
                  "label": null,
                  "name": "A Gaia position is preferred over a Hipparcos one, and either over a survey position, unless a published uncertainty says otherwise.",
                  "parent": "01a19f23-636e-7035-8185-ab9dfac6edfe"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636e-7035-8185-ab9fe065861e",
                  "kind": "requirement",
                  "label": null,
                  "name": "If an object has no distance, then Univ Ingest shall keep the object with its sky position alone and give it no derived three-dimensional position.",
                  "parent": "01a19f23-636e-7035-8185-ab97eb9c2fb9"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636e-7035-8185-aba03617706c",
                  "kind": "criterion",
                  "label": null,
                  "name": "The object can be looked up but appears in no tile and in no bounded volume query.",
                  "parent": "01a19f23-636e-7035-8185-ab9fe065861e"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636e-7035-8185-aba1fc8f7bbd",
                  "kind": "feature",
                  "label": null,
                  "name": "Cross-match catalogues",
                  "parent": "01a19f1a-685d-7357-b67e-d65bef1ca65c"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636e-7035-8185-aba27e410ae5",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall resolve catalogue entries that share a published cross-identification into one object before matching by position.",
                  "parent": "01a19f23-636e-7035-8185-aba1fc8f7bbd"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-1509ef3e2d47",
                  "kind": "criterion",
                  "label": null,
                  "name": "A published cross-identification, such as the Gaia DR3 Hipparcos cross-identification or a shared PGC number, is used before a positional match.",
                  "parent": "01a19f23-636e-7035-8185-aba27e410ae5"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-150a909c8f0e",
                  "kind": "criterion",
                  "label": null,
                  "name": "The object records the cross-identification as the method that resolved it.",
                  "parent": "01a19f23-636e-7035-8185-aba27e410ae5"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-150b2d35ea65",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall merge catalogue entries into one object when they agree within the release's match tolerances and no other candidate does.",
                  "parent": "01a19f23-636e-7035-8185-aba1fc8f7bbd"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-150cc0a7de4d",
                  "kind": "criterion",
                  "label": null,
                  "name": "The tolerances on angular separation and on redshift or distance are set for each pair of sources in the release's matching rules.",
                  "parent": "01a19f23-636f-72bd-b194-150b2d35ea65"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-150dfab9225c",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each merge records its method, the separation, the redshift or distance difference and a confidence between 0 and 1.",
                  "parent": "01a19f23-636f-72bd-b194-150b2d35ea65"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-150e56ac26d6",
                  "kind": "criterion",
                  "label": null,
                  "name": "The release's matching rules state how the confidence is computed.",
                  "parent": "01a19f23-636f-72bd-b194-150b2d35ea65"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-150f94f19121",
                  "kind": "requirement",
                  "label": null,
                  "name": "If a catalogue entry has more than one candidate within the match tolerances, then Univ Ingest shall keep the candidates as separate objects linked as candidate matches.",
                  "parent": "01a19f23-636e-7035-8185-aba1fc8f7bbd"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-1510f8ea82b8",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each candidate link carries its confidence.",
                  "parent": "01a19f23-636f-72bd-b194-150f94f19121"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-15114b1cd667",
                  "kind": "criterion",
                  "label": null,
                  "name": "No measurement is merged across a candidate link.",
                  "parent": "01a19f23-636f-72bd-b194-150f94f19121"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-15129323b215",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall attach to each object the designations and names its catalogue entries carry.",
                  "parent": "01a19f23-636e-7035-8185-aba1fc8f7bbd"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-1513f385222f",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each designation keeps the source that gave it.",
                  "parent": "01a19f23-636f-72bd-b194-15129323b215"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-15144dcb948e",
                  "kind": "criterion",
                  "label": null,
                  "name": "A common name, such as M31 or the Large Magellanic Cloud, is attached with the source that published it.",
                  "parent": "01a19f23-636f-72bd-b194-15129323b215"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-1515b9ad9670",
                  "kind": "feature",
                  "label": null,
                  "name": "Keep object ids stable",
                  "parent": "01a19f1a-685d-7357-b67e-d65bef1ca65c"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-1516b502f718",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall give each object the id it had in the previous release when its catalogue entries carry over.",
                  "parent": "01a19f23-636f-72bd-b194-1515b9ad9670"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-15178440da44",
                  "kind": "criterion",
                  "label": null,
                  "name": "An object whose catalogue entries are all in one object of the previous release keeps that object's id.",
                  "parent": "01a19f23-636f-72bd-b194-1516b502f718"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-15189cad9cac",
                  "kind": "criterion",
                  "label": null,
                  "name": "Two objects of the previous release that merge keep the older id, and the other id is recorded as merged into it.",
                  "parent": "01a19f23-636f-72bd-b194-1516b502f718"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-151929ed3023",
                  "kind": "criterion",
                  "label": null,
                  "name": "An object of the previous release that splits gives each part a new id, and the old id is recorded as split into them.",
                  "parent": "01a19f23-636f-72bd-b194-1516b502f718"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-151af96748e0",
                  "kind": "criterion",
                  "label": null,
                  "name": "An id is never given to a second object.",
                  "parent": "01a19f23-636f-72bd-b194-1516b502f718"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-151bff4f24f5",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall list in the release manifest every id merged, split or retired since the previous release.",
                  "parent": "01a19f23-636f-72bd-b194-1515b9ad9670"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-151c7fe18cca",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each entry gives the old id, what happened to it and the ids that replaced it.",
                  "parent": "01a19f23-636f-72bd-b194-151bff4f24f5"
                },
                {
                  "change": "added",
                  "key": "01a19f1a-685d-7357-b67e-d65c50ba74e7",
                  "kind": "feature_group",
                  "label": null,
                  "name": "Releases",
                  "parent": "01a19f1a-685d-7357-b67e-d658085bf5c8"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-151d9fb569d2",
                  "kind": "feature",
                  "label": null,
                  "name": "Build a release",
                  "parent": "01a19f1a-685d-7357-b67e-d65c50ba74e7"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-151ed99bd6f9",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the owner builds a release, Univ Ingest shall assemble its objects, structures, volume grids, tiles, sources and manifests into a complete release on local disk.",
                  "parent": "01a19f23-636f-72bd-b194-151d9fb569d2"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-151f95aff549",
                  "kind": "criterion",
                  "label": null,
                  "name": "The release has the next release number and records its build time, release cosmology, univ-model version and Univ Ingest version.",
                  "parent": "01a19f23-636f-72bd-b194-151ed99bd6f9"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-15208136562d",
                  "kind": "criterion",
                  "label": null,
                  "name": "The release records its matching rules and its ranking rule.",
                  "parent": "01a19f23-636f-72bd-b194-151ed99bd6f9"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-1521b702e5bb",
                  "kind": "criterion",
                  "label": null,
                  "name": "The release manifest lists every file of the release with its SHA-256.",
                  "parent": "01a19f23-636f-72bd-b194-151ed99bd6f9"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-1522436dac01",
                  "kind": "criterion",
                  "label": null,
                  "name": "The release holds the cell index that bounded volume queries read.",
                  "parent": "01a19f23-636f-72bd-b194-151ed99bd6f9"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-15238aca1cc9",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall check a release before marking it complete.",
                  "parent": "01a19f23-636f-72bd-b194-151d9fb569d2"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-15248994b03f",
                  "kind": "criterion",
                  "label": null,
                  "name": "Every object id that a tile holds exists among the release's objects.",
                  "parent": "01a19f23-636f-72bd-b194-15238aca1cc9"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-1525435d731d",
                  "kind": "criterion",
                  "label": null,
                  "name": "Every number of every structure cites its source.",
                  "parent": "01a19f23-636f-72bd-b194-15238aca1cc9"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-152619fffa94",
                  "kind": "criterion",
                  "label": null,
                  "name": "The counts of catalogue entries in the release match the counts in each source's provenance.",
                  "parent": "01a19f23-636f-72bd-b194-15238aca1cc9"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-152783fea6de",
                  "kind": "criterion",
                  "label": null,
                  "name": "No source in the release has a redistribution status of forbidden.",
                  "parent": "01a19f23-636f-72bd-b194-15238aca1cc9"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-1528b83f1040",
                  "kind": "requirement",
                  "label": null,
                  "name": "If a source fails or a check fails, then Univ Ingest shall mark nothing complete and name the source or the check that failed.",
                  "parent": "01a19f23-636f-72bd-b194-151d9fb569d2"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-1529a7954231",
                  "kind": "criterion",
                  "label": null,
                  "name": "No release number is used up by a build that failed.",
                  "parent": "01a19f23-636f-72bd-b194-1528b83f1040"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-152a40334d81",
                  "kind": "feature",
                  "label": null,
                  "name": "Build octree tiles",
                  "parent": "01a19f1a-685d-7357-b67e-d65c50ba74e7"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-152b36f5a5b5",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall build for each scale domain an octree of tiles over the derived ICRS Cartesian positions of its objects.",
                  "parent": "01a19f23-636f-72bd-b194-152a40334d81"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-152c99726521",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each scale domain has its own root: stars in parsecs, nearby galaxies and cosmic web in megaparsecs.",
                  "parent": "01a19f23-636f-72bd-b194-152b36f5a5b5"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-152dec6f0f74",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each object belongs to the scale domain its source definition names.",
                  "parent": "01a19f23-636f-72bd-b194-152b36f5a5b5"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-152e3b4f79ee",
                  "kind": "criterion",
                  "label": null,
                  "name": "A node is split when it holds more points than the release's split threshold, down to the release's maximum depth.",
                  "parent": "01a19f23-636f-72bd-b194-152b36f5a5b5"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-152f904380b9",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each level holds an even random subsample, and a finer level adds points without repeating those of the levels above it.",
                  "parent": "01a19f23-636f-72bd-b194-152b36f5a5b5"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-15306fd09eef",
                  "kind": "criterion",
                  "label": null,
                  "name": "The subsample is drawn with a seed recorded in the tile manifest.",
                  "parent": "01a19f23-636f-72bd-b194-152b36f5a5b5"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-1531af0609ed",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall encode each point of a tile with its position, object id, source and kind of value.",
                  "parent": "01a19f23-636f-72bd-b194-152a40334d81"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-15326d1a7654",
                  "kind": "criterion",
                  "label": null,
                  "name": "Positions are quantized relative to their node, with a step no coarser than 1/65,536 of the node's edge.",
                  "parent": "01a19f23-636f-72bd-b194-1531af0609ed"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-1533772ccbaf",
                  "kind": "criterion",
                  "label": null,
                  "name": "The tile manifest states the encoding version and the quantization step of each level.",
                  "parent": "01a19f23-636f-72bd-b194-1531af0609ed"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-1534af285ad4",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall build byte-identical tiles from identical inputs.",
                  "parent": "01a19f23-636f-72bd-b194-152a40334d81"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-153527b1bfc8",
                  "kind": "criterion",
                  "label": null,
                  "name": "Two builds from the same sources, rules and seed give tiles with the same SHA-256.",
                  "parent": "01a19f23-636f-72bd-b194-1534af285ad4"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-15372421c144",
                  "kind": "feature",
                  "label": null,
                  "name": "Prune old releases",
                  "parent": "01a19f1a-685d-7357-b67e-d65c50ba74e7"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-1538be54b520",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the owner prunes a release, Univ Ingest shall delete the release's files and tables and record when it was pruned.",
                  "parent": "01a19f23-636f-72bd-b194-15372421c144"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-153927026b4b",
                  "kind": "criterion",
                  "label": null,
                  "name": "The record of object ids merged, split or retired is kept, so every id still resolves.",
                  "parent": "01a19f23-636f-72bd-b194-1538be54b520"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-153a6cd80c2c",
                  "kind": "criterion",
                  "label": null,
                  "name": "The pruned release stays in the list of releases with its pruning time.",
                  "parent": "01a19f23-636f-72bd-b194-1538be54b520"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-153bcc1d7e13",
                  "kind": "requirement",
                  "label": null,
                  "name": "If the release is the one latest points to, then Univ Ingest shall refuse to prune it.",
                  "parent": "01a19f23-636f-72bd-b194-15372421c144"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-153c0959ad96",
                  "kind": "criterion",
                  "label": null,
                  "name": "The message says that latest points to the release.",
                  "parent": "01a19f23-636f-72bd-b194-153bcc1d7e13"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-153d515c188e",
                  "kind": "feature",
                  "label": null,
                  "name": "Publish a release locally",
                  "parent": "01a19f1a-685d-7357-b67e-d65c50ba74e7"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-153ee5a17619",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the owner publishes a complete release, Univ Ingest shall upload its files to local R2 and its tables to local D1, and only then point latest at it.",
                  "parent": "01a19f23-636f-72bd-b194-153d515c188e"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-153fb0e0dd43",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each uploaded file is checked against its SHA-256 in the release manifest.",
                  "parent": "01a19f23-636f-72bd-b194-153ee5a17619"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-1540b752f379",
                  "kind": "criterion",
                  "label": null,
                  "name": "Until latest moves, reads that name no release answer from the previous release.",
                  "parent": "01a19f23-636f-72bd-b194-153ee5a17619"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-154133241de5",
                  "kind": "criterion",
                  "label": null,
                  "name": "Latest moves in a single write, so no read sees a release partly published.",
                  "parent": "01a19f23-636f-72bd-b194-153ee5a17619"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-1542bf149fa0",
                  "kind": "requirement",
                  "label": null,
                  "name": "If an upload fails part way, then Univ Ingest shall leave latest where it was and continue the upload on the next run.",
                  "parent": "01a19f23-636f-72bd-b194-153d515c188e"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-154384255e3e",
                  "kind": "criterion",
                  "label": null,
                  "name": "Files already uploaded and verified are not uploaded again.",
                  "parent": "01a19f23-636f-72bd-b194-1542bf149fa0"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-15447f9441ad",
                  "kind": "requirement",
                  "label": null,
                  "name": "If the release's number is already published, then Univ Ingest shall refuse to publish it and leave the published release unchanged.",
                  "parent": "01a19f23-636f-72bd-b194-153d515c188e"
                },
                {
                  "change": "added",
                  "key": "01a19f23-636f-72bd-b194-1545c890a557",
                  "kind": "criterion",
                  "label": null,
                  "name": "The message names the release number and its publication time.",
                  "parent": "01a19f23-636f-72bd-b194-15447f9441ad"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-97900e1d406e",
                  "kind": "feature_group",
                  "label": null,
                  "name": "Operation",
                  "parent": "01a19f1a-685d-7357-b67e-d658085bf5c8"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-977b37d09370",
                  "kind": "feature",
                  "label": null,
                  "name": "Follow a run's progress",
                  "parent": "01a19f22-b0bc-76da-bac8-97900e1d406e"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-977c0df0543a",
                  "kind": "requirement",
                  "label": null,
                  "name": "While Univ Ingest writes to a terminal, Univ Ingest shall keep a live status line at the bottom of the terminal with the run's progress.",
                  "parent": "01a19f22-b0bc-76da-bac8-977b37d09370"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-977d3868a411",
                  "kind": "criterion",
                  "label": null,
                  "name": "The status line gives the overall percentage, the bytes fetched of the bytes expected, the current rate and the estimated time left.",
                  "parent": "01a19f22-b0bc-76da-bac8-977c0df0543a"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-977efb075d7a",
                  "kind": "criterion",
                  "label": null,
                  "name": "The status line names each download in progress with its own bytes and percentage.",
                  "parent": "01a19f22-b0bc-76da-bac8-977c0df0543a"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-977f946ec036",
                  "kind": "criterion",
                  "label": null,
                  "name": "The status line names the current stage, which is fetch, normalize, cross-match, tiles, build or publish, with its count of items done of items expected.",
                  "parent": "01a19f22-b0bc-76da-bac8-977c0df0543a"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-97803a2ac7b3",
                  "kind": "criterion",
                  "label": null,
                  "name": "The status line is redrawn at most ten times a second and fits the terminal's width.",
                  "parent": "01a19f22-b0bc-76da-bac8-977c0df0543a"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-9781a4317a39",
                  "kind": "requirement",
                  "label": null,
                  "name": "When a download finishes, is found on disk or fails, Univ Ingest shall print one line for it above the status line.",
                  "parent": "01a19f22-b0bc-76da-bac8-977b37d09370"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-978243cd702f",
                  "kind": "criterion",
                  "label": null,
                  "name": "A fetched chunk or file prints a Get line with its number, source, chunk and size.",
                  "parent": "01a19f22-b0bc-76da-bac8-9781a4317a39"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-97838637e1af",
                  "kind": "criterion",
                  "label": null,
                  "name": "A chunk or file already on disk prints a Hit line, and is not fetched again.",
                  "parent": "01a19f22-b0bc-76da-bac8-9781a4317a39"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-97847bed1992",
                  "kind": "criterion",
                  "label": null,
                  "name": "A request that failed and will be retried prints an Err line with the mirror and the reason.",
                  "parent": "01a19f22-b0bc-76da-bac8-9781a4317a39"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-9785a0efa4a1",
                  "kind": "criterion",
                  "label": null,
                  "name": "A download that continued from a partial file prints the byte it continued from.",
                  "parent": "01a19f22-b0bc-76da-bac8-9781a4317a39"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-9786b22b6ce9",
                  "kind": "requirement",
                  "label": null,
                  "name": "When a run ends, Univ Ingest shall print a summary of what the run did.",
                  "parent": "01a19f22-b0bc-76da-bac8-977b37d09370"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-97876c10b6f3",
                  "kind": "criterion",
                  "label": null,
                  "name": "The summary gives the bytes fetched, the time taken and the mean rate.",
                  "parent": "01a19f22-b0bc-76da-bac8-9786b22b6ce9"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-9788528129a0",
                  "kind": "criterion",
                  "label": null,
                  "name": "The summary gives, per source, the catalogue entries published and left out.",
                  "parent": "01a19f22-b0bc-76da-bac8-9786b22b6ce9"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-9789936d8c57",
                  "kind": "criterion",
                  "label": null,
                  "name": "The summary names the release the run built or published, or the stage and reason it stopped at.",
                  "parent": "01a19f22-b0bc-76da-bac8-9786b22b6ce9"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-978a58c8fa20",
                  "kind": "requirement",
                  "label": null,
                  "name": "While Univ Ingest writes to something other than a terminal, Univ Ingest shall print plain, timestamped lines without control codes.",
                  "parent": "01a19f22-b0bc-76da-bac8-977b37d09370"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-978bd11f8a8a",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each Get, Hit and Err line and each stage's start and end is printed as one line.",
                  "parent": "01a19f22-b0bc-76da-bac8-978a58c8fa20"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-978c8f52c47a",
                  "kind": "criterion",
                  "label": null,
                  "name": "A download that lasts longer than a minute prints one progress line each minute.",
                  "parent": "01a19f22-b0bc-76da-bac8-978a58c8fa20"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-978d5de52f15",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the owner interrupts a run, Univ Ingest shall stop at once, keep every chunk and partial file on disk, and say how to continue.",
                  "parent": "01a19f22-b0bc-76da-bac8-977b37d09370"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-978e78be4742",
                  "kind": "criterion",
                  "label": null,
                  "name": "The next run continues each partial download from the byte it reached.",
                  "parent": "01a19f22-b0bc-76da-bac8-978d5de52f15"
                },
                {
                  "change": "added",
                  "key": "01a19f22-b0bc-76da-bac8-978f94c955a4",
                  "kind": "criterion",
                  "label": null,
                  "name": "No release is left half built or half published.",
                  "parent": "01a19f22-b0bc-76da-bac8-978d5de52f15"
                },
                {
                  "change": "added",
                  "key": "01a19f1a-685d-7357-b67e-d65e20557892",
                  "kind": "product",
                  "label": null,
                  "name": "Univ Server",
                  "parent": null
                },
                {
                  "change": "added",
                  "key": "01a19f1a-685d-7357-b67e-d65f1c690202",
                  "kind": "feature_group",
                  "label": null,
                  "name": "Reference data",
                  "parent": "01a19f1a-685d-7357-b67e-d65e20557892"
                },
                {
                  "change": "added",
                  "key": "01a19f1e-d177-716d-b124-3d003878f4e1",
                  "kind": "feature",
                  "label": null,
                  "name": "List and pin releases",
                  "parent": "01a19f1a-685d-7357-b67e-d65f1c690202"
                },
                {
                  "change": "added",
                  "key": "01a19f1e-d177-716d-b124-3d011d9a2392",
                  "kind": "requirement",
                  "label": null,
                  "name": "When a client lists releases, Univ Server shall return every release that has not been pruned, newest first.",
                  "parent": "01a19f1e-d177-716d-b124-3d003878f4e1"
                },
                {
                  "change": "added",
                  "key": "01a19f1e-d177-716d-b124-3d021cccd33d",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each release gives its number, publication time, release cosmology and sources.",
                  "parent": "01a19f1e-d177-716d-b124-3d011d9a2392"
                },
                {
                  "change": "added",
                  "key": "01a19f1e-d177-716d-b124-3d03d7adf4a8",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each release gives its counts of objects, structures, volume grids and tiles.",
                  "parent": "01a19f1e-d177-716d-b124-3d011d9a2392"
                },
                {
                  "change": "added",
                  "key": "01a19f1e-d177-716d-b124-3d040ae70863",
                  "kind": "criterion",
                  "label": null,
                  "name": "The listing names the release that latest points to.",
                  "parent": "01a19f1e-d177-716d-b124-3d011d9a2392"
                },
                {
                  "change": "added",
                  "key": "01a19f1e-d177-716d-b124-3d05968932a2",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each pruned release is listed with the time it was pruned.",
                  "parent": "01a19f1e-d177-716d-b124-3d011d9a2392"
                },
                {
                  "change": "added",
                  "key": "01a19f1e-d177-716d-b124-3d061b7122c4",
                  "kind": "requirement",
                  "label": null,
                  "name": "When a client names a release, a read tagged `release-scoped` shall answer from that release alone.",
                  "parent": "01a19f1e-d177-716d-b124-3d003878f4e1"
                },
                {
                  "change": "added",
                  "key": "01a19f1e-d177-716d-b124-3d07cf8c66f8",
                  "kind": "criterion",
                  "label": null,
                  "name": "A read that names no release answers from the release that latest points to.",
                  "parent": "01a19f1e-d177-716d-b124-3d061b7122c4"
                },
                {
                  "change": "added",
                  "key": "01a19f1e-d177-716d-b124-3d080b16ed2a",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response names the release it answered from.",
                  "parent": "01a19f1e-d177-716d-b124-3d061b7122c4"
                },
                {
                  "change": "added",
                  "key": "01a19f1e-d177-716d-b124-3d0916dbb3de",
                  "kind": "criterion",
                  "label": null,
                  "name": "Two reads pinned to one release return identical data, whatever was published between them.",
                  "parent": "01a19f1e-d177-716d-b124-3d061b7122c4"
                },
                {
                  "change": "added",
                  "key": "01a19f1e-d177-716d-b124-3d0a953e5526",
                  "kind": "requirement",
                  "label": null,
                  "name": "If the named release was pruned or never existed, then a read tagged `release-scoped` shall refuse the read.",
                  "parent": "01a19f1e-d177-716d-b124-3d003878f4e1"
                },
                {
                  "change": "added",
                  "key": "01a19f1e-d177-716d-b124-3d0bc2fec3a8",
                  "kind": "criterion",
                  "label": null,
                  "name": "A pruned release answers 410 with problem details that give the time it was pruned.",
                  "parent": "01a19f1e-d177-716d-b124-3d0a953e5526"
                },
                {
                  "change": "added",
                  "key": "01a19f1e-d177-716d-b124-3d0cb2aafd93",
                  "kind": "criterion",
                  "label": null,
                  "name": "A release that never existed answers 404.",
                  "parent": "01a19f1e-d177-716d-b124-3d0a953e5526"
                },
                {
                  "change": "added",
                  "key": "01a19f1e-d177-716d-b124-3d0d39dc9a3f",
                  "kind": "feature",
                  "label": null,
                  "name": "Look up an object",
                  "parent": "01a19f1a-685d-7357-b67e-d65f1c690202"
                },
                {
                  "change": "added",
                  "key": "01a19f1e-d177-716d-b124-3d0ee7e600ab",
                  "kind": "requirement",
                  "label": null,
                  "name": "When a client requests an object by its object id, Univ Server shall return the object with its catalogue entries, measurements, preferred measurement and derived positions.",
                  "parent": "01a19f1e-d177-716d-b124-3d0d39dc9a3f"
                },
                {
                  "change": "added",
                  "key": "01a19f1e-d177-716d-b124-3d0f2163e49f",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response lists every catalogue entry resolved to the object, each with its source and the designation that source gives it.",
                  "parent": "01a19f1e-d177-716d-b124-3d0ee7e600ab"
                },
                {
                  "change": "added",
                  "key": "01a19f1e-d177-716d-b124-3d100d0beecf",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response lists every measurement with its native value, unit, uncertainty, kind of value and source.",
                  "parent": "01a19f1e-d177-716d-b124-3d0ee7e600ab"
                },
                {
                  "change": "added",
                  "key": "01a19f1e-d177-716d-b124-3d11207d1f43",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response names the preferred measurement and the ranking rule that chose it.",
                  "parent": "01a19f1e-d177-716d-b124-3d0ee7e600ab"
                },
                {
                  "change": "added",
                  "key": "01a19f1e-d177-716d-b124-3d1233780c6e",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each derived position names its frame, epoch, release cosmology and the transformation that produced it.",
                  "parent": "01a19f1e-d177-716d-b124-3d0ee7e600ab"
                },
                {
                  "change": "added",
                  "key": "01a19f1e-d177-716d-b124-3d14e7c5aa1e",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response lists each candidate match to another object with its confidence.",
                  "parent": "01a19f1e-d177-716d-b124-3d0ee7e600ab"
                },
                {
                  "change": "added",
