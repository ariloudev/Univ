blocks:
  - key: 01a19f1e-60e2-7194-a6b0-be38d5416ae8
    id: q-more-sources
    kind: question
    versions:
      - key: 01a19f1e-60e2-7194-a6b0-be3a0470b92d
        at: 2026-11-03T01:55:30Z
        revision: 12
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        prompt: "Which of the datasets you suggested should the first release include?"
        header: "More sources"
        context: |-
          Facts checked against primary sources:

          - **2M++** (Lavaux & Hudson 2011, MNRAS 416, 2840): 69,160 galaxies, all sky to K ≤ 12.5, compiled from 2MRS, 6dFGS and SDSS DR7, with a group table. On VizieR as J/MNRAS/416/2840.
            - The paste's "Know the Universe Map" is a third-party visualization and can't be cited as a source.
            - Its 43,500 galaxies is 2MRS's count, not 2M++'s.
          - **2M++ reconstruction** (Carrick et al. 2015): a density and velocity field, an independent counterpart to CF4++.
            - The earlier session saw 136 MB and 407 MB `.npy` files.
            - I haven't verified where to download it.
          - **eRASS1 clusters** (Bulbul et al. 2024; optical identification by Kluge et al. 2024):
            - About 12,247 groups and clusters, in the western Galactic hemisphere only.
            - Photometric redshifts good to δz/(1+z) ≲ 0.005; about 3,200 have spectroscopic redshifts.
          - **COSMOS-Web groups** (Toni et al. 2025, A&A 697, A197):
            - 1,678 groups up to z = 3.7, in a field of about 0.5 deg², with purity around 77–80%.
            - The "780,000 galaxies" isn't supported: the group finder's input was 389,248 galaxies.
          - **DESI DR1:** about 18.7 million redshifts (13.1 M galaxies, 1.6 M quasars, 4 M stars).
            - DR2 has measured more than 30 million redshifts, but I couldn't confirm a public release date.
            - The full survey targets more than 63 million over eight years, so "47 million, completed in 2026" isn't supported.

          The earlier session rejected DESI and the 2M++ field because they were too heavy to ship to a browser. With offline ingest and tiles, that objection no longer applies.
        options:
          - label: "2M++ catalogue + groups"
            detail: "Small, all sky and uniform to K ≤ 12.5. Its group table adds groups and clusters as structures. It overlaps 2MRS, 6dFGS and SDSS, and cross-matching folds the duplicates into one object each."
            recommended: true
          - label: "2M++ reconstruction"
            detail: "A second volume grid beside CF4++. Two independent reconstructions let a client show where they agree, which is more honest than showing one. Its download location needs verifying during the build."
            recommended: true
          - label: "eRASS1 clusters"
            detail: "About 12,000 X-ray-selected clusters to z ≈ 1.3, as objects and structures in the cosmic web domain. Small. Only half the sky, which the source's footprint records."
            recommended: true
          - label: "COSMOS-Web groups"
            detail: "1,678 groups to z = 3.7 in a pencil beam about 0.5 deg² wide. It would need a new deep-field scale domain, and its purity is around 77–80%. Better as a later release."
          - label: "DESI DR1"
            detail: "About 18.7 million redshifts, the densest cosmic web map available. Multi-GB downloads and hours of ingest. It also needs the storage choice in the next question. Better as a later release, once the pipeline is proven on smaller surveys."
        multiple: true
    responses:
      - key: 01a19f1f-ed59-704e-af01-ac5845914183
        at: 2026-11-03T01:57:12Z
