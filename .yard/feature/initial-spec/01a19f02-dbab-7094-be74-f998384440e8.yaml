                    "column": 10,
                    "key": "01a19f20-8e6c-7039-b16f-abe10a4ee3c8",
                    "kind": "requirement",
                    "label": null,
                    "line": 37,
                    "name": "When the owner changes a key's quotas or rate limit, Univ Server shall apply the new values from the key's next request.",
