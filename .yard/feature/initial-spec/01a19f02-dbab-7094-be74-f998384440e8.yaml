                  },
                  {
                    "column": 10,
                    "key": "01a19f20-8e6c-7039-b16f-abeccca54ce7",
                    "kind": "requirement",
                    "label": null,
                    "line": 38,
                    "name": "When the owner lists API keys, Univ Server shall return each key's label, issuance time, revocation time, quotas and usage, without its secret.",
