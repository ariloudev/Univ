          - **Layers:** "Correct or retract an item" became **Revise or retract an item**, so it also covers plain updates.
          - **4D removed, as you asked:** *Place a star at an epoch*, lookback time and as-of-time reads of layers are gone. Time records, time filters, item versions and release pinning stay.
          - **New Feature Group: Operation**, with **Follow a run's progress**. This is the apt-style display (Get, Hit and Err lines, a live status line, a summary, plain lines when not on a terminal) plus a clean stop on interrupt.
          - **Fetch a source durably** now also continues an interrupted single-file download with HTTP range requests.
          - **Data sources are external Components**: 18 sources under 7 providers, each with its citation and terms.
          - **Publish a release locally** replaces "publish to local or deployed storage".

          ### Values I chose that you should check

          | Where | Value |
          |---|---|
          | Bounded volume query | ≤ 1,000 results per page, ≤ 10,000 per query |
          | Listing pages | 500 items or structures; 1,000 changes |
          | Default quotas | 100 layers per key, 100,000 items per layer, 64 KiB per item version |
          | Rate limits | 300 requests / 60 s anonymous per address; 1,200 / 60 s per key |
          | Quality targets | object lookup p95 ≤ 200 ms; first page of a volume query p95 ≤ 500 ms (wrangler dev on your laptop); tile ≤ 1 MiB |
          | Retries | ≥ 4 per mirror, waits doubling from 2 s |
          | Preferred distance | smallest fractional uncertainty, with a 300 km/s peculiar-velocity term for redshifts; method rank breaks ties |
          | Frames | galactic per the Hipparcos catalogue (ESA 1997); supergalactic per Lahav et al. 2000; CMB dipole per Planck 2018 |

