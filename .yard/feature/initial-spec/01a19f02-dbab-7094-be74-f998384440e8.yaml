                  },
                  {
                    "column": 10,
                    "key": "01a19f20-8e6c-7039-b16f-abdd6cea244d",
                    "kind": "requirement",
                    "label": null,
                    "line": 24,
                    "name": "If a client exceeds its request rate limit, then Univ Server shall refuse its requests until the limit's window has passed.",
                    "path": "spec/products/univ-server/access/enforce-quotas-and-rate-limits.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f20-8e6c-7039-b16f-abde5a8c8ce0",
                    "kind": "criterion",
                    "label": null,
                    "line": 31,
                    "name": "Anonymous requests are limited per client address, by default to 300 requests in 60 seconds.",
                    "path": "spec/products/univ-server/access/enforce-quotas-and-rate-limits.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f20-8e6c-7039-b16f-abdf92323beb",
                    "kind": "criterion",
                    "label": null,
                    "line": 33,
                    "name": "Requests with an API key are limited per key, by default to 1,200 requests in 60 seconds.",
                    "path": "spec/products/univ-server/access/enforce-quotas-and-rate-limits.yaml"
                  },
