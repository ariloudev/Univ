                    "key": "01a19f23-636f-72bd-b194-153fb0e0dd43",
                    "kind": "criterion",
                    "label": null,
                    "line": 20,
                    "name": "Each uploaded file is checked against its SHA-256 in the release manifest.",
                    "path": "spec/products/univ-ingest/releases/publish-a-release-locally.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f23-636f-72bd-b194-1540b752f379",
                    "kind": "criterion",
                    "label": null,
                    "line": 22,
                    "name": "Until latest moves, reads that name no release answer from the previous release.",
