  - key: 01a19f1e-60e2-7194-a6b0-be39d3b6de64
    id: q-object-storage
    kind: question
    versions:
      - key: 01a19f1e-60e2-7194-a6b0-be3be71b673c
        at: 2026-11-03T01:55:30Z
        revision: 12
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        prompt: "Where should objects live once a source has millions of them?"
        header: "Big sources"
        context: "Every object is currently a D1 row (lookup, cell index, cross-match), and one release must fit within D1's 10 GB. SDSS, GCNS and Gaia bright stars come to roughly 5 million objects, which fits. DESI DR1 alone would add about 18 million and would not fit."
        options:
          - label: "D1 now, R2 shards later"
            detail: "Specify D1 for objects now, with the 10 GB cap as a monitored constraint. A DESI-sized source triggers a separate decision to move bulk objects into R2 shards keyed by octree node. Keeps the first version simple."
            recommended: true
          - label: "R2 shards from the start"
            detail: "Named and small-catalogue objects in D1, while bulk survey objects live in R2 JSON shards per octree node, found through the same cell index. Ready for DESI, but more complex from day one."
    responses:
      - key: 01a19f1f-ed59-704e-af01-ac59af7947e0
        at: 2026-11-03T01:57:12Z
        revision: 13
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "D1 now, R2 shards later"
