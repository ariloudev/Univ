                  },
                  {
                    "column": 14,
                    "key": "01a19f22-b0bc-76da-bac8-97838637e1af",
                    "kind": "criterion",
                    "label": null,
                    "line": 40,
                    "name": "A chunk or file already on disk prints a Hit line, and is not fetched again.",
                    "path": "spec/products/univ-ingest/operation/follow-a-runs-progress.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f22-b0bc-76da-bac8-97847bed1992",
                    "kind": "criterion",
                    "label": null,
                    "line": 42,
                    "name": "A request that failed and will be retried prints an Err line with the mirror and the reason.",
