                    "key": "01a19f22-b0bc-76da-bac8-977d3868a411",
                    "kind": "criterion",
                    "label": null,
                    "line": 23,
                    "name": "The status line gives the overall percentage, the bytes fetched of the bytes expected, the current rate and the estimated time left.",
                    "path": "spec/products/univ-ingest/operation/follow-a-runs-progress.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a19f22-b0bc-76da-bac8-977efb075d7a",
                    "kind": "criterion",
