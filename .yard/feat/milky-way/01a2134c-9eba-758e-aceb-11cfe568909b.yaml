        by:
          host: claude-code
          session: "6fd045ba-ba88-4b16-b646-cb12d6995a02"
        title: "Why"
        markdown: "Publishing Milky Way release 1 ran one `wrangler d1 execute` per SQL file (~1,300 files). No process empties the write-ahead log, so shard 0's log reached 28 GB with nothing in it that the database file lacked, and every new process read it again: 6 s per file at first, 10–11 s by file 80. Measured on a clone of shard 0: one 33 MB file in one transaction with SQLite takes 2.1 s, and an offline `wal_checkpoint(TRUNCATE)` of the 28 GB log took 7.6 s and freed it. Miniflare names each database's file from its id, recomputed for all 17 files of the store. The person chose to write the files directly (option 2)."
