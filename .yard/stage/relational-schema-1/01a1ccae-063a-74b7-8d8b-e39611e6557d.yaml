        markdown: |-
          Built in a scratch database from shard `18e5840c…` (3.17 GB, 5.79 M entries), opened immutable, read only.

          | | Bytes |
          |---|---|
          | `entries` table today | 681 MB |
          | JSON gone: `flags` 78.3 MB (2.25 M entries) + `extra` 35.0 MB (0.71 M) | −113 MB |
          | `entry_flags`: 3.47 M rows, 40 flag names as terms: table 90.5 MB + `entry_flags_by_value` 76.2 MB | +167 MB |
          | spectral type text as a column | +0.75 MB |
          | **Net** | **≈ +55 MB a shard (≈ 2%), ≈ 0.9 GB over 16** |

          Well inside the 4.5 GB per-shard budget; T5 goes ahead. The few links, relations, references and measurement details are rows of no size that matters.
