  - key: 01a1cd48-beeb-712e-8c00-819e1c80e96a
    id: wave-1-done
    kind: note
    versions:
      - key: 01a1cd48-beeb-712e-8c00-81a152e1190e
        at: 2026-11-12T01:04:19Z
        revision: 7
        by:
          host: claude-code
          session: "733ab034-0172-4107-897d-a9a3752e1525"
        title: "What wave 1 produced"
        markdown: |-
          - **Schema 8** keeps no JSON in a table that grows with a release's objects: flags, papers, measurement details, links, relations, memberships and replaced ids are rows; via, spectral type and the published redshift frame are columns; published position errors are measurements. Every table names its scale, JSON columns are typed `Json`, and a test refuses one at object or entry scale.
          - **Ingest** writes the rows through builders it shares with the migration; Reid et al. 2019's `Arm` codes make masers members of their model arms.
          - **Readers and the API** give the same records (the API's record tests unchanged); an object read is one shard batch of nine indexed reads.
          - **`univ-ingest migrate`** brings a schema-7 store to 8 in place, one database at a time, each in one transaction and vacuumed, then reindexes; a publish, `serve` and `explore` refuse a store still at 7.
          - **Size**: about +55 MB a shard (≈ 2%) on release 15.

          Left for wave 2: the `cargo xtask json` gate, the scan guard, and the science checks rewritten onto the rows (they still read the old columns). Left for the owner's word: merging this wave, migrating a clone of the real store and swapping it in, release 16.
        tone: success
