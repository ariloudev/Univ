        title: "Wave 2 plan (pre-approved by the owner)"
        markdown: |-
          Cut from `product/milky-way` at the merge of wave 1. Each task ends with its focused tests.

          | Task | Change | Criteria | Done when |
          |---|---|---|---|
          | t1 domain | `ScaleDomain::GalaxyTracers` and `CellSpace::GalaxyTracers` (100 pc cells) appended after the others, so the existing RNG streams and shard places keep their order. Units in pc. One membership rule for both callers: Galaxy tracers if any entry's source is a tracer source, else as before. | AC-91, AC-92 and the tracer-source criterion | `tiles.rs` and `release_reads.rs` tests cover a Cepheid joined to its Gaia star landing in tracers and a plain star staying in stars; the stars tiles' SHA-256 is unchanged |
          | t2 server | `/v1/scale-domains` and the volume query cover the new space | AC-166 | `bulk_tests` lists four domains |
          | t3 kind of object | `normalization.object_kind` in a definition, kept as the entry's `object_kind` flag | the tracer kind criterion | a normalize test |
          | t4 sources | `hunt-reffert-2023`, `baumgardt-vasiliev-2021`, `skowron-2025-cepheids`, `li-2023-rr-lyrae` and `reid-2019-masers` (VizieR), each with its terms, recorded fixtures and distances; Skowron and Li join `gaia-source-id` | the release 13 source criteria and the tracer distance criteria | definition and normalize tests per source |
          | t5 explorer plumbing | schemas, Show-drawer column, domain order, fixtures | none of its own (wave 4 draws them) | `pnpm check` targets for the touched files |
          | t6 science checks | `counts-by-scale-domain` with tracers, `tracers-in-tracer-domain`, `cepheids-joined-to-gaia` | none | xtask science rule tests |
          | t7 review | `/simplify`, `/code-review`, the gate and integration once, the trace, close and merge | none | green |
