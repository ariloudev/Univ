          - **The Galaxy tracers domain** is in parsecs with 100 pc cells, appended last, so the existing domains' tiles are byte-for-byte unchanged. The API lists and queries it, and the explorer names its kinds.
          - **Science checks:** `tracers-in-tracer-domain`, `tracers-name-their-kind` and `pulsating-stars-joined-to-gaia`.

          **Left open:**
          - The permission request to Holger Baumgardt is the owner's to send.
          - Li's sample includes 28,754 Magellanic Cloud RR Lyrae stars beyond 40 kpc, kept as published.
          - The Edenhofer dust map is wave 3.
