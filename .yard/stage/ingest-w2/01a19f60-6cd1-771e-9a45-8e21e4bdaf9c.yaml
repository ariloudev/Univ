        title: "Fix the /code-review and /simplify findings"
        detail: |-
          Correctness, each with a test that fails without its fix:
          - a short source drops its chunks so the next run fetches them again;
          - a body-check failure moves to the next mirror without skipping this one;
          - provenance is recorded before the rename, and an unrecorded file is fetched again;
          - an empty VizieR answer is zero rows;
          - repository sources resolve against the repository root and must exist;
          - a published-digest mismatch is not retried;
          - computed VizieR columns pass through to `-out.add`;
          - two files with one name are refused;
          - stale chunk files are pruned.

          Efficiency: the check returns the row count, kept in provenance, so no chunk is parsed twice.

          Simplify: one hex, shared test helpers, `acquire_files`/`acquire_chunks`, shared table filtering, `suffix_for`, `step_by` slices, `Payload` stored directly in provenance, named status codes, a unit `OnDisk`, and `fetch::Item`.

          Kept for W3: the stage events. Five non-blocking follow-ups are added to the plan.
        state: done
        type: fix
