        title: "Byte-range resume and payload checks"
        detail: |-
          Done in `fetch/file.rs`, with 6 tests in `tests/fetch_files.rs`:
          - Range plus If-Range from the byte reached;
          - start over when the provider ignores the range, the ETag changes, or the length differs;
          - a raw TCP server cuts the body off at 40 bytes, and the retry continues from them;
          - size and SHA-256 checked against the published values.
        state: done
