      - key: 01a19f6e-202a-71d1-a099-bd72c90822b0
        at: 2026-11-03T03:22:36Z
        revision: 4
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Durable fetcher: retries, mirrors and chunks"
        detail: |-
          Done in `fetch/mod.rs`, with 6 wiremock tests in `tests/fetch_chunks.rs`:
          - waits of 2, 4, 8 and 16 s, then the next mirror;
          - a mirror that fails is skipped for the run;
          - resume from the first chunk not on disk, with no chunk fetched twice;
          - `.part` then rename, and a body that fails its check never becomes a chunk;
          - a failure names the source, the chunk and each mirror's last error, and keeps the chunks;
          - offline runs make no request.
        state: done
