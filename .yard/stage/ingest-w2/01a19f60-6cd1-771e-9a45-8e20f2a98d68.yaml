  - key: 01a19f67-7b44-7257-a73d-e3355772bb36
    id: w2-q-gaia-cut
    kind: question
    versions:
      - key: 01a19f67-7b44-7257-a73d-e336ae4619e4
        at: 2026-11-03T03:15:21Z
        revision: 2
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        prompt: "How bright must a Gaia DR3 star be to enter the first release, beyond the 100 pc of the Gaia Catalogue of Nearby Stars?"
        header: "Gaia G cut"
        context: |-
          The **Gaia DR3 bright stars** source takes every `gaia_source` row brighter than a G cut, at epoch J2016.0. These are the stars beyond 100 pc that the GCNS doesn't hold. Counts from the ESA Gaia Archive (`SELECT COUNT(*) FROM gaiadr3.gaia_source WHERE phot_g_mean_mag < G`, queried 2026-11-03):

          | G cut | Stars |
          |---|---|
          | < 6 | 6,764 |
          | < 8 | 62,723 |
          | < 10 | 482,106 |
          | < 11 | 1,247,240 |
          | < 12 | 3,087,821 |

          For scale, Hipparcos holds about 118,000 stars. The GCNS adds 331,312 objects within 100 pc. D1 is capped at 10 GB (CON-3). Each star also gets a Bailer-Jones distance and is cross-matched with Hipparcos, so the cost grows with the cut. The brightest stars (G < ~3) saturate in Gaia, and Hipparcos covers them.
        options:
          - label: "G < 10"
            detail: "About 482k stars. Every star an observer could see in binoculars, and Hipparcos's completeness with room to spare. Its D1 share is small next to the 1.1M SDSS galaxies. I recommend it as the best balance of reach and size."
            recommended: true
          - label: "G < 8"
            detail: "About 63k stars: the naked-eye sky and a bit beyond, smaller than Hipparcos. The cheapest option, but the Milky Way's structure past 100 pc stays thin."
          - label: "G < 11"
            detail: "About 1.25M stars, more than the SDSS galaxies. It traces the Galaxy further out, roughly doubling the star share of D1 and the fetch time."
          - label: "G < 12"
            detail: "About 3.1M stars, the largest set. It is likely to make stars the biggest part of D1 and of the tiles, and the Bailer-Jones fetch grows with it."
