        title: "Wave 4 done: approve the merge"
        markdown: |-
          ## Wave 4 (with wave 3 inside it) is built and green

          - `cargo xtask check`: 14 gates passed (`loft verify` runs on `develop` only).
          - `cargo xtask integration`: the Worker's end-to-end tests and 27 Playwright tests, with axe, passed.
          - `loft reconcile --fail-on warning`: clean, 835 of 835 nodes linked.
          - Milky Way release 6 published; the explorer draws the model on it (screenshots in the session).

          ## Approve

          **Merge** `stage/galaxy-model-4` into `product/galaxy-model`. No spec change was made in this wave.

          ## Decided during the wave

          - `GET /v1/galaxy-model` gives `points` and `seed` once, inside the definition.
          - Each population of the v5 manifest names `covered_by`, the domain of its counterparts.
          - Model points are drawn at an opacity of 0.08, tuned on release 6.

          ## Open, for a later wave

          - At equal brightness the arms read faintly: their young stars and knots are 8% of the model's points, by their cited share of the light. Drawing the young populations brighter would need a spec change.
          - The reviews' larger suggestions: a Batch union of objects and model points, a one-byte population code with a colour table in the shader, a typed-array model decoder.
