          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Fix the /code-review and /simplify findings"
        detail: |-
          Each fix comes with a test that failed before it.

          **D1 integrity**
          - Non-finite values and duplicate keys fail the build.
          - Raw names are part of the key, so 'M 31' and 'M31' are both kept.
          - Text holding BEGIN TRANSACTION or COMMIT is written as hex.
          - Each table's count and per-column totals are checked against D1 after the load.

          **CON-3**
          - The size estimate counts SQLite overflow pages.
          - Publish checks the unpruned releases plus the new one against 10 GB.

          **Atomicity**
          - A state lock guards match, tiles and build.
          - The state comes from memory into `states/{n}`, with `current` switched by rename.
          - Publish refuses a release the state doesn't record.

          **Publish and prune**
          - A rerun records a missing `published_at`.
          - Prune uses the journal when there is no manifest, and otherwise refuses.
          - Unlisted releases are cleaned.

          **Other**
          - A 360° sky region is handled.
          - Wrangler's stderr is shown without ANSI codes.
          - Structures carry a scale domain and centre.
          - The build uses the cross-match's own rules and structures.
          - The `/simplify` items are done.

          End to end: real wrangler passes in 66 s.
        state: done
        type: fix
