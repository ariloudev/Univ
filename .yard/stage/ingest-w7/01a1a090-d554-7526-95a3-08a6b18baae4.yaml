        title: "Release layout and build"
        detail: |-
          **Layout and build**
          - **D1 schema v1:** 18 tables, each keyed by release, plus a single-row `latest`.
          - **R2 layout:** `releases/{n}/` holds the YAML manifest, rules, tiles and grids.
          - **Cell index:** a uniform cube grid per domain (10 pc, 1 Mpc, 10 Mpc), plus placed structure boxes.
          - **`univ-ingest build`** checks that tile ids exist, structures are cited, counts match provenance, no source is forbidden, the D1 estimate fits 10 GB, and the written files match their hashes. It builds in `.building-{n}`, so a failed build uses no number.

          **Also**
          - The cosmology comes from `rules/release.yaml`.
          - `redistribution.review: provisional` is typed on all 18 sources.

          AC-82 to AC-90 are linked; 114 of 293 nodes.
        state: done
