        title: "Publish locally and prune"
        detail: "A minimal `wrangler.toml` with only the D1 and R2 bindings, and wrangler pinned in `package.json`. Publish runs `wrangler d1 execute --local` and `r2 object put --local`, checking each file against its SHA-256. `latest` moves in one write at the end. An interrupted publish continues, and a release number already published is refused. Prune deletes a release's files and rows, keeps its pruning time and the id ledger, and refuses `latest`. Also: point and primitive structures go into the cell index. Done when AC-99 to AC-106 and AC-121 are tested, with an end-to-end run against a temporary wrangler state."
        state: active
