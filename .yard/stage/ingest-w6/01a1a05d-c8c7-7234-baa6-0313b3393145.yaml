        title: "Fix the /code-review and /simplify findings"
        detail: |-
          Each fix comes with a test that failed before it.
          - **AC-94 per level:** each inner node keeps floor(level_points·n/m), one fraction per level, recorded as `levels[].fraction`. Shown densities keep the true 10× ratio within 5%, where they were flattened to 1:1 before.
          - **Source roles:** each source carries a `role` (distance, position or both), and `encoding.point_source` is documented.
          - **Decoder:** it names an unknown version before the size bound.
          - **Nodes:** a node with a non-finite corner or a subnormal step is refused.
          - **Writes:** atomic, with the manifest written last.
          - **Cosmology:** carried over from cross-match.
          - **Simplify:** sources interned to u16, positions no longer copied, one `KINDS` list, shared CLI test helpers.
        state: done
        type: fix
