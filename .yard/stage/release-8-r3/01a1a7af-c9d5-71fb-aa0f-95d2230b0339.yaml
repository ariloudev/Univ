        detail: |-
          **Scope:** through the API on release 8:
          - Sirius: B−V ≈ 0.00, spectral type A1V;
          - Betelgeuse: B−V ≈ 1.85;
          - Laniakea and Vela present, Vela as a sky region named "(at least)";
          - the Hercules Void with its extents.

          **Done when** each is read back and recorded, with a screenshot of the explorer showing the structures.
        state: open
      - key: 01a1a7fc-5ccf-76ec-ad47-a280d5dca326
        at: 2026-11-04T19:14:56Z
        revision: 5
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Spot checks"
        detail: |-
          **Scope:** Sirius, Betelgeuse, Laniakea, Vela and the Hercules Void, read through Univ Server on release 8, and the explorer seen live with a screenshot.

          **Done when** each reads as its sources publish it, and the explorer draws Vela as "(at least)" and the Hercules Void as a marker with three axes.

          **Progress (API):**
          - **Sirius (HIP 32349):** placed at 2.637 pc from its Hipparcos 2007 parallax of 379.21 ± 1.58 mas.
            - B−V = 0.009 ± 0.007 and V−I = −0.02, from Hipparcos 2007.
            - Spectral type "A0m...", from Hipparcos 1997, which is what I/239 prints. The plan's "A1V" is SIMBAD's, not this catalogue's.
          - **Betelgeuse (HIP 27989):**
            - B−V = 1.50 ± 0.51 and V−I = 2.32, from Hipparcos 2007. The plan's 1.85 is SIMBAD's; Hipparcos's value carries a large error for this variable.
            - Spectral type M2Ib.
            - **Not placed (no distance).** Its parallax of 6.55 ± 0.83 mas has a fractional error of 0.127, above the ranking rule's 0.1, and Gaia has no measure of a star this bright. Release 7 did not place it either.
          - **Laniakea:** a basin, its point at 72.2 Mpc.
          - **Vela:** a sky region at 290.7 Mpc, its derivation marked `at_least`.
          - **Hercules Void:** a point at 95.8 Mpc, with extents of 171.4, 115.3 and 206.9 Mpc.
          - **Local Supercluster:** an oriented box at 11.1 Mpc.
          - **Pisces–Cetus:** placed from 36 members.
        state: active
      - key: 01a1a7fe-1bf9-7419-a626-6f0a3aee72bc
        at: 2026-11-04T19:16:50Z
        revision: 6
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Spot checks"
        detail: |-
          **Scope:** Sirius, Betelgeuse, Laniakea, Vela and the Hercules Void, read through Univ Server on release 8, and the explorer seen live with a screenshot.

          **Done when** each reads as its sources publish it, and the explorer draws Vela as "(at least)" and the Hercules Void as a marker with three axes.

          **Result:**
          - **Sirius (HIP 32349):** placed at 2.637 pc from its Hipparcos 2007 parallax of 379.21 ± 1.58 mas.
            - B−V = 0.009 ± 0.007 and V−I = −0.02, from Hipparcos 2007.
            - Spectral type "A0m...", as Hipparcos 1997 (I/239) prints it. The plan's "A1V" is SIMBAD's.
          - **Betelgeuse (HIP 27989):**
            - B−V = 1.50 ± 0.51 and V−I = 2.32, from Hipparcos 2007. The plan's 1.85 is SIMBAD's.
            - Spectral type M2Ib.
            - **Not placed (no distance):** a parallax of 6.55 ± 0.83 mas has a fractional error of 0.127, over the ranking rule's 0.1, and Gaia has no measure of it. Release 7 did not place it either. Raised for E7, whose star colours need it drawn.
          - **Structures:**
            - Laniakea: a basin at 72.2 Mpc.
            - Vela: a sky region marked `at_least`.
            - Hercules Void: a point with extents of 171.4, 115.3 and 206.9 Mpc.
            - Local Supercluster: an oriented box.
            - Pisces–Cetus: placed from 36 members.
          - **Explorer, live on release 8 (screenshots sent):**
            - Vela and Horologium–Reticulum are labelled "(at least)".
            - The Hercules Void, chosen, is drawn as a marker with crossing axis lines and no box.
            - Its panel gives the sentence on unknown bounds and the three cited extents: 11,600, 7,800 and 14,000 km/s along SGX, SGY and SGZ.
        state: done
