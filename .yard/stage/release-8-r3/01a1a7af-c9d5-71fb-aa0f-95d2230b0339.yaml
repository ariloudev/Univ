        title: "VizieR mirrors in the order they answer"
        detail: |-
          **Scope:** the build lost time on two slow mirrors while CDS was down; you asked for the source lists to be updated.

          **Done when** every VizieR source lists its mirrors in the order they were found to answer, the reason is stated, and the definitions' tests pass.

          **Result:** committed in `bfd5986`.
          - **New order, in all ten VizieR sources:** CDS, China-VO, NAO, IDIA.
          - **Checked on a Hipparcos query:** CDS (back up) and China-VO return the table. NAO returns "The database is not currently reachable". IDIA broke off mid-answer during the build.
          - **Harvard CfA:** did not connect, so it is not added.
          - All 79 ingest suites pass.
        state: done
        type: fix
