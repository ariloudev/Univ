    kind: note
    versions:
      - key: 01a1b631-16be-7358-b20e-6910ddfddf3d
        at: 2026-11-07T13:27:12Z
        revision: 13
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Release 11: the first additive release, measured"
        markdown: |-
          Release 11 is published on the local store and `latest` points to it. It adds the Great Attractor, and the 10 fibre-join splits that commit abbddc0 made (see below).

          | | Release 10 (full) | Release 11 (change) |
          |---|---|---|
          | Build | 15 min, 55 GB peak | **25 min 56 s**, 108 GB peak footprint (69 GB resident) |
          | Build output | 38 GB | **2.7 GB**: 1.73 GB of D1 SQL, 722 MB of new tiles |
          | Publish | 1 h 35 min | **15 min 34 s** in two runs (7:54 + 7:40), including a stop and fix |
          | D1 used bytes added | 22.9 GB | **0.86 GB** |
          | R2 added | 1.1 GB | **0.6 GB**; grids, rules and 245 tiles not uploaded again, being held by release 10 |
          | Lookup p95 | 3.9 ms | **3.7 ms** |
          | First points p95 | 213 ms | **211 ms** |

          **Pinned reads after release 11:** all 319 pinned answers of release 10 are byte-identical to before. The one difference is the release list, which ignores the pin and now shows `latest: 11`. Release 11 serves the Great Attractor at 64 Mpc, which matches cz = 4350 km/s under Planck 2018.

          **Fixed on the way (40f5a11):** the publish first stopped at its check of object shard 7. That database was bound but had never been loaded, and it still had schema-5 tables. The migration had passed it by, and the publish created its schema over those tables. The migration now rebuilds every bound shard whose tables lack `retired`, on every run, and keeps rows of a release after `latest` valid. The resumed publish finished from its journal.
        tone: success
  - key: 01a1b631-16be-7358-b20e-690fe0e80bf6
    id: w5-run-findings
    kind: note
    versions:
      - key: 01a1b631-16be-7358-b20e-6911d470f4cd
        at: 2026-11-07T13:27:12Z
        revision: 13
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Why release 11 was 2.7 GB and not kilobytes"
        markdown: |-
          The shared-rows path did what the spec asks. The size came from three things outside it.

          1. **The cross-match gained 10 splits, a real data change.** Release 10 was built at 23:25 on 5 November, 2.5 h before abbddc0 ("fibres never join a shared source or an extent galaxy"). Release 11 is the first build with that fix: 10 objects that held two DESI entries are each split in two. That gives 20 new ids and 10 replaced, and all of them resolve through the ledger. The matching is deterministic: no `HashMap` order decides a group, and every sort has a total tie-break.
          2. **The shards were repacked once, 1.53 M objects moved.** Release 10's packer filled shards 0–5 to within a few kB of the 4.5 GB budget. Schema 6's `retired` column and fixed-width `release` estimate every row about 6 % larger. So each full shard gave up its last cells: 612k objects went to shard 6 and 914k to a new shard 7. This happens once, at the migration boundary; shards packed under schema 6 keep their cells.
          3. **The tile layout is not local.** 10 more points changed 4,411 of 4,656 tiles (722 MB). The octree is laid out over the whole domain, so a few points ripple through it. Any release that changes objects rewrites most tiles.

          **Follow-ups for the owner to weigh:**
          - **Tiles:** lay out each node from its own cell alone, so that a change rewrites only the tiles of the cells it touches. This is the largest remaining cost of a change.
          - **Build memory:** the build's peak rose from 55 to 108 GB on a 128 GB machine. The 14 GB row index is loaded whole, against the 3 GB the plan estimated. Stream it, or keep only hashes per table.
          - **Steady state:** release 12, built on the same inputs, would show the cost of a release with no object change now that the shards are repacked. It should write only the 3 tile-manifest rows.
          - **Free pages:** D1's files hold 9 GB of free pages from the migration's rebuild. A `VACUUM` of each shard gives them back.
          - **From the review:** tile manifests and grid headers still carry their release number, so each release rewrites 3 + 3 rows. Dropping it is a contract decision.
        tone: warning
