          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Run W5 on the real local state"
        markdown: |-
          The code for W5 is done, reviewed and gated. Nothing has touched `.cache/univ-ingest` yet. I'd like to run it on the real state, in this order. Each step stops on any error, and every step before it can be run again.

          1. **Stop the `wrangler dev` running on the real state.** It holds the D1 files open, and the migration rewrites them. If you'd rather stop it yourself, reject with that reason.
          2. **Back up `.cache/univ-ingest/wrangler`** (about 21 GB) and `state/states/10` to `.cache/univ-ingest/backup-pre-w5/`, so release 10 can be restored as it is now.
          3. **`univ-ingest migrate`**: rebuilds the catalogue and 6 shards in place under schema 6, and copies release 10's 4,680 R2 files (1.13 GB) to `files/{sha256}`, each checked against its SHA-256. I expect tens of minutes.
          4. **`univ-ingest reindex`**: writes release 10's row index and `numbering.yaml` into `state/states/10`.
          5. **Benches on release 10 after the migration:** `bench lookup` (QA-2, 200 ms at p95) and `bench first-points` (3 s), plus a spot check that pinned reads of sample objects, a volume page and structures match what they gave before.
          6. **Build release 11 with one structure correction.** This is a full `univ-ingest build` run. Tell me which structure you want corrected, or I'll pick a cited coordinate fix from the structures file and show it to you first.
          7. **`univ-ingest publish 11`**, then measure: build time, publish time, D1 and R2 growth, and the explorer showing release 11.

          I won't push, merge into `develop` or `main`, `loft publish`, or deploy anything. After the run I'll write up the numbers, close W5 and merge `stage/additive-w5` into `product/additive-releases`.
