    id: w5-review-note
    kind: note
    versions:
      - key: 01a1b28f-f262-73cf-aca6-b5a7dba659a8
        at: 2026-11-06T20:32:20Z
        revision: 5
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "W5 review: what was fixed and what was left"
        markdown: |-
          Four cleanup reviewers and `/code-review high` ran on the W5 diff.

          **Fixed (correctness)**
          - The migration left `scale_domains.manifest_key` naming the old key it then deleted: every tile read of a migrated release would have failed. Every column ending `_key` is now renamed through a table of moved keys, and the test's schema-5 store names its files by their old keys (the test fails without the fix).
          - A run stopped while deleting the old keys orphaned the rest: they are now listed in the journals first, and the next run deletes them.
          - A release a schema-5 publish left part way is refused, telling the owner to prune it.
          - Each R2 copy is checked against its SHA-256 as R2 gives it back.
          - `univ-ingest migrate` honours a first Ctrl-C.
          - A reindex that fails no longer leaves a partial row index: it is written beside and swapped in whole.

          **Fixed (quality)**
          - The reindex now reads every row once, gathering the numbering as it indexes.
          - The hash is back to its plain form; `-0.0` becomes `0.0` where reals become SQL values.
          - Each row's `release` is estimated at a fixed width, so `release_shards` no longer changes as the release number grows.
          - Retirement is folded into the copy; `science --store` sets each copied row's release as it copies it.
          - Code is shared: `execute_sql`, `r2_manifest`, one rusqlite row reader, `LOCAL_D1_FILES`, typed table constants and `packing::bucket`.
          - The trace links are complete: 535 of 535 nodes.

          **Left, with reasons**
          - **Tile manifests and grid headers name their release, so each release rewrites them** (3 scale domains plus any grids, a few small R2 objects and rows). The tests now count these rewrites exactly instead of leaving the tables out. There are two ways to stop the rewrite:
            - drop the field: the tile manifest's is required in OpenAPI v1;
            - make it mean the first release to publish it: the grid header's is fixed by the spec (*names the release that published it*).
            Either is a contract change for the owner.
          - The `--store` file identification in xtask duplicates `LocalD1::open`: xtask must not depend on univ-ingest. They share the path constant.
          - No `Store::copy` op: the 1.13 GB of R2 still passes through disk, which costs minutes, once.
          - A publish onto a schema-6 store makes one or two extra Wrangler calls for the migration check.
          - Prune does not migrate first: its file-map guard still serves an empty catalogue.
          - The journal-only prune path is tested by `a_release_never_listed_whose_files_were_uploaded_has_them_deleted`, so that review finding was a false positive.
        tone: warning
