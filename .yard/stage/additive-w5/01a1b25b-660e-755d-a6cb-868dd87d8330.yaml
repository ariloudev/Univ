        title: "What the real state holds"
        markdown: |-
          Read only (SQLite files opened immutable; a `wrangler dev` on the real state was running and left alone):

          | | Found |
          |---|---|
          | State | `states/10`: `ledger.yaml`, `entry-ids.yaml`; **no `numbering.yaml`, no row index** |
          | Builds | `build/releases/5`, `9`, `10` (v5 files) |
          | Local D1 | schema 5: a catalogue and 6 object shards of 4.8–5.8 M objects each, 2.6–3.1 GB per file, files named by Miniflare's hash |
          | R2 | keys `releases/{n}/…`; grid headers name their samples `releases/{n}/grids/…` |

          **What W5 must therefore do**
          1. **Store, run by `publish`:** each v5 database rebuilt table by table under the v6 keys with `retired`, the rows of a listed release that is not the latest retired at the next; R2 files copied to `files/{sha256}`, grid headers rewritten to name their samples by content (as a v6 build writes them) and `grids.header_key` updated; `release_files` written; the old keys deleted last. Re-runnable.
          2. **Prune** finds a release's files by its `release_files` too: a migrated release's manifest names its old keys.
          3. **State:** `cargo xtask reindex` writes `numbering.yaml` and the row index of the latest release from the local D1 files directly (100 M rows are too many through Wrangler): terms, sources, chains, the level-0 cells of each shard, the shards of loose buckets, each row's key and content hash.
          4. **Science** reads a release from the local store, since release 11's parent chain begins with a v5 build.
          5. **Real run, only on the owner's approval:** stop the dev server, migrate, reindex, bench (QA-2), build and publish release 11, measure.
