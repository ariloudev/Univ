    id: w5-migrated
    kind: note
    versions:
      - key: 01a1b5fd-fd67-74b2-aef4-f51a437e5848
        at: 2026-11-07T12:31:24Z
        revision: 12
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Release 10 migrated, reindexed and benched"
        markdown: |-
          **Stopped:** `xtask explore` (PID 97628), on the owner's word. **Backup:** `.cache/univ-ingest/backup-pre-w5/` holds `wrangler/` (23 GB, 4,733 files) and `state/states/10`, as APFS clones.

          | Step | Time | Peak memory | Result |
          |---|---|---|---|
          | `univ-ingest migrate` | 5 min 43 s | 590 MB | 4,679 R2 files moved to `files/{sha256}`; 7 shards and the catalogue rebuilt |
          | `univ-ingest reindex` | 2 min 57 s | 424 MB | 245,783,693 rows of 22 tables; 120 terms, 28 sources, 15 chains, 7 shards |
          | `bench lookup` | | | p50 2.6 ms, **p95 3.9 ms**, p99 11.6 ms (QA-2 ≤ 200 ms) |
          | `bench first-points` | | | p50 195 ms, **p95 213 ms** (≤ 3 s) |

          **Rows:** release 10 has 245,779,314 rows before and after, table by table in every database; `release_files` adds 4,679.

          **Pinned reads:** 320 answers of release 10, from release 10's own Worker (5073cab) on a copy of the backup and from this branch's Worker on the migrated store: **317 byte-identical**. Those are 150 objects, 18 volume pages, every structure, source, scale-domain manifest and grid field, and 6 tiles per domain. The 3 that differ are the grid headers: each names its samples' R2 key, now `files/{sha256}` rather than `releases/10/grids/…`. The samples served are identical.

          **D1 on disk:** used bytes went from 22.87 to 22.53 GB. The files grew to 31.6 GB, the 9.1 GB difference being free pages left by the rebuilt tables, which SQLite reuses. A `VACUUM` would give them back; it is not part of the run.

          **Row index:** 14 GB on disk, against the plan's estimate of about 3 GB (245 M rows rather than 100 M).

          **Fixed on the way:**
          - a70624b: reindex read the whole state, which requires the very `numbering.yaml` it writes, and loaded 57 GB of entry ids. It now reads only the ledger.
          - The second fix: `LocalD1` failed on a database bound but never loaded, given the schema-5 tables and no rows. It now skips such a database, and refuses one that holds objects at an older schema.

          Both fixes have a test that fails without them.
        tone: success
