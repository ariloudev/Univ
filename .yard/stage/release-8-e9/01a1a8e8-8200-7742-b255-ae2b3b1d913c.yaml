        title: "Approve: a click centres the view on the point"
        markdown: |-
          **What changes:** clicking a drawn point, a galaxy or a star, makes it the focus of the view. The camera moves so that the point sits at the centre, at the same distance as before the click. From then on, dragging turns the view about that point, the way it turns about Earth when the view opens.

          **What stays:**
          - the click still opens the object's record;
          - a double-click still flies to the point and zooms in close;
          - *Return to Earth* brings the focus back to Earth.

          **Scope:** Univ Explorer only. The camera already supports any focus, so there is no change to the data, the server or the ingest.

          **Criteria:**
          1. After a click on a point, the point is at the centre of the view, and the distance from the eye to the focus is the one before the click.
          2. Once a point is the focus, dragging turns the view about it.
          3. With reduced motion, the view moves at once instead of flying.
