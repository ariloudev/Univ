        markdown: |
          # Plan: E9, a click centres the view on the point (`stage/release-8-e9`)

          ## Context

          You asked that clicking a galaxy put the camera's centre on it, as the view is centred on Earth
          when it opens. Today:
          - a single click on a drawn point only opens its record;
          - a double-click flies to the point, makes it the focus and zooms in close;
          - *Return to Earth* makes Earth the focus at the current distance.

          The approved change, one new requirement in `the-view/navigate-with-the-mouse`, is committed
          alone as 949f901. A click on a drawn point makes it the focus and keeps the distance, so that
          dragging then turns the view about it. Its criteria:
          1. After a click on a point, the point is at the centre of the view and the distance from the
             eye to the focus is the one before the click.
          2. Once a point is the focus, dragging turns the view about the point.
          3. With reduced motion, the view moves at once instead of flying.

          The change is to Univ Explorer only: the controller already flies to any focus.

          ## Tasks

          | Task | Scope | Done when |
          |---|---|---|
          | **e9-t-centre** | `src/scene/controller.ts`: a new `centreOn(focus)`, which is `flyTo(focus, this.view.distance)`; `returnToEarth()` becomes `centreOn(ORIGIN)`. `src/ui/useWorld.ts`: the click handler in `bindView` (`chooser`) calls `controller.centreOn(place)` on a click and keeps `flyTo(place, viewingDistance(…))` on a double-click. Both go through a small exported `focusOn(controller, point, close)`, so they can be tested without a canvas. | `controller.test.ts`: `centreOn` ends with the point at the centre (projected to 400, 300) and the distance unchanged (criterion 1); a turn afterwards leaves the point at the centre, with the focus unchanged (2); with reduced motion it moves at once (3). `useWorld.test.ts`: `focusOn` keeps the distance for a click and flies close for a double-click |
          | **e9-t-e2e** | `e2e/explorer.spec.ts`, a new test:<br>1. find "canis MAJOR" with the search box, as the existing test does;<br>2. *Return to Earth*, at the same distance;<br>3. click at the chosen object's mark (`data-testid="chosen-mark"`);<br>4. expect the record panel to be open, the distance text unchanged, and the mark at the centre of the canvas, within a few pixels. | the test passes in `cargo xtask integration` |
          | **e9-t-close** | `/simplify` and `/code-review` run in parallel, then `cargo xtask check` and `cargo xtask integration`. The three criteria are linked in `loft.trace.yaml` and accepted, along with any changed test of the double-click criteria. The Yard Log is closed, and the branch is merged `--no-ff` into `product/release-8`. | as for every wave |

          ## Critical files

          - `clients/explorer/src/scene/controller.ts` and `controller.test.ts`
          - `clients/explorer/src/ui/useWorld.ts` and `useWorld.test.ts`
          - `clients/explorer/e2e/explorer.spec.ts`

          **Reused:**
          - `Controller.flyTo` and its reduced-motion path;
          - `viewingDistance` (`scene/controls.ts`);
          - `fakeController()` (`src/test/world.ts`), which uses reduced motion;
          - the controller tests' `setup()`, with `advance(FLIGHT_MS)`;
          - `project` from `scene/camera.ts`.

          ## Verification

          - **Unit tests:** `pnpm check` in `clients/explorer`.
          - **End to end:** `cargo xtask integration`, with the new click test.
          - **Gate:** `cargo xtask check`.
          - **Trace:** `loft reconcile`, with the three new criteria linked.
          - **Live:** release 9 in headless Chromium, clicking a galaxy. The screenshot should show it at the centre at the same distance, and a drag turning the view about it.

          ## Afterwards

          On your ask, merge `product/release-8` into `develop` and run `loft publish`.
