        title: "What the reviews changed"
        markdown: |-
          **Bugs fixed:**

          | Finding | Fix |
          |---|---|
          | The first click of a double-click moved the view, so the double-click picked whatever was then under the pointer | The second click and the double-click reuse the first click's pick (`firstOfDouble`), tested by the click, click, double-click sequence |
          | A click during a flight kept the distance reached partway, freezing the zoom | `centreOn` keeps the distance the flight ends at |
          | The e2e test clicked where an off-screen object was, mid-flight | Reduced motion, then a zoom out until the mark is inside the view |
          | The hover label kept naming the point the view moved away | Cleared on a click |
          | The canvas description left out the centring | Updated |

          **Cleanups:**
          - `Controller.approach` is the one fly-close move, shared with search;
          - `focusOn` and its tests are gone;
          - a flight is not restarted toward its own target;
          - shared e2e helpers `centreOf` and `find`;
          - an `expectCentred` helper in the controller test.

          **Skipped:**
          - planning tiles once per flight: an older cost, not added here;
          - clicks on structures: outside this spec.
        tone: info
