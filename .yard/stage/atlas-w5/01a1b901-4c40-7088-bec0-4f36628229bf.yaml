  - key: 01a1b901-4c40-7088-bec0-4f3843ca2177
    id: w5-splits
    kind: note
    versions:
      - key: 01a1b901-4c40-7088-bec0-4f3b31b6d444
        at: 2026-11-08T02:33:52Z
        revision: 1
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Release 12's 510 replaced ids"
        markdown: |-
          - **215 merges**, every one into an object that now carries an OpenNGC or IAU name: duplicates the name sources joined.
          - **295 splits**, 291 with an OpenNGC entry in a part. The pattern, from IC 1125:

          | | Release 11 | Release 12 |
          |---|---|---|
          | A | Cosmicflows-4 PGC 55388 alone | PGC 55388, OpenNGC IC 1125 (by PGC), SDSS (0.08″ from IC 1125) |
          | B (873699) | SDSS, 2MRS, 6dF, 2MPP, 2MPZ (2MASS 15330561-0137417, within 0.05″) | 2MRS, 6dF, 2MPP, 2MPZ, as new id 36949353 |

          All are one galaxy, given two objects in both releases: an OpenNGC row joined by PGC draws a positional partner out of another group of the same galaxy. OpenNGC gives IC 1125 no 2MASX. No galaxy gains a duplicate it lacked, but one id per split is replaced. Merging groups of one galaxy within an arcsecond is a cross-match rule for the owner, with a spec change and another release.
        tone: warning
