        revision: 2
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Science on release 12: 30 PASS, 3 FAIL, 3 CONCERN, 2 INFO"
        markdown: |-
          Read from the local D1 (`--store`, 159 s to load).

          | Check | Release 10 | Release 12 |
          |---|---|---|
          | local-group-duplicates | FAIL, 30 pairs (accepted) | FAIL, 33 pairs |
          | twompp-sdss-sourced (floor 0.975) | PASS | **FAIL, 0.9727** |
          | redshift-conflicts | CONCERN, 278 | CONCERN, 288 |
          | redshift-conflicts-placed-high | CONCERN, 103 | CONCERN, 110 |
          | coma-ngc4889 | CONCERN | CONCERN, unchanged |
          | fingerprints | PASS (written whole) | FAIL, a checker gap |

          - **The cross-match regressions** all fit the IC 1125 pattern of note *Release 12's 510 replaced ids*: an OpenNGC row joined by PGC draws a positional partner out of another group of the same galaxy, such as an SDSS entry out of its 2M++ group.
          - **fingerprints:** both loaders set every row's `release` to the release checked, which the checks rely on, while the manifest fingerprints each row's own release. Row counts and every other column total agree; the `release` totals and four small tables' content SHA-256 differ. It has failed on every release built as a change since release 11.
        tone: warning
  - key: 01a1b910-dfd1-77ad-a432-5f9f1b291d95
    id: q-r12-regression
    kind: question
    versions:
      - key: 01a1b910-dfd1-77ad-a432-5fa391a0b74a
        at: 2026-11-08T02:50:53Z
        revision: 2
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        prompt: "Release 12 is published locally with a small cross-match regression from OpenNGC (33 duplicate pairs, not 30; the 2M++/SDSS share 0.9727, under its 0.975 floor). How should I go on?"
        header: "Release 12"
        context: "Release 12 is local only: nothing is pushed or deployed, and release 11's D1, R2 and id state are in `.cache/univ-ingest/backup-r11/`. The fix is a cross-match rule (with its criterion): an object joined by a catalogue number takes in the positional group of the same galaxy within an arcsecond, rather than drawing one entry out of it. It needs a full rebuild either way (about 20 minutes, then 9 minutes to publish)."
        options:
          - label: "Keep 12, fix in 13"
            detail: "Finish release 12's lookups, benches and your screenshots now, on real names. Then a follow-up wave specifies and builds the rule as release 13, which joins the split groups back (their ids replaced again, all locally). You see the explorer soonest."
            recommended: true
          - label: "Restore 11, rebuild 12"
            detail: "Restore release 11 from the backup, specify and build the rule first, then build release 12 again before the lookups and screenshots. No id is replaced twice, but the screenshots wait for the rule."
          - label: "Accept as is"
            detail: "Keep release 12 and record the two regressions as accepted, as the 30 pairs were; no cross-match change."
    responses:
      - key: 01a1b9ec-34c5-724a-b395-59550034ada0
        at: 2026-11-08T06:50:27Z
        revision: 3
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: terminal
        chosen:
          - "Keep 12, fix in 13"
