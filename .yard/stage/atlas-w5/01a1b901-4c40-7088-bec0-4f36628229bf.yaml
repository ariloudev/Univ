        prompt: "Should the fingerprint check be made to verify releases built as a change?"
        header: "Fingerprints"
        context: "It cannot today: the loaders give every row the release checked, so the `release` totals and four small tables' content SHA-256 never match the manifest for a change release. Row counts and every other column are verified."
        options:
