        title: "W2 plan"
        markdown: |-
          Within the release 10 build plan. The live services were probed with three-row queries on 2026-11-05.

          | Task | Source(s) | Access | Notes |
          |---|---|---|---|
          | w2-sdss | `sdss-dr17-distant` | `skyserver_sql`, chunked | GALAXY at 0.35 ≤ z < 1.2 and QSO at z > 0.005, `zWarning = 0` |
          | w2-vizier | `twodfgrs`, `alfalfa-a100` | `vizier_tsv`. The NAO mirror answers; IDIA gives empty bodies | 2dFGRS VII/250 with q_z ≥ 3 and z ≥ 0.002, rms 85 km/s as `catalogue_error`, non-commercial. ALFALFA J/ApJ/861/49/table2 with HI = 1, Vhel heliocentric, error W50/2 as estimated, Dist as an estimated flow-model distance, non-commercial |
          | w2-desi | `desi-dr1` | `tap` at Astro Data Lab, `desi_dr1.zpix` | `zcat_primary`, `zwarn = 0` (bit 0 is SKY), spectype GALAXY or QSO. Data Lab's zpix has no `target_ra`: positions are `mean_fiber_ra/dec`. Barycentric |
          | w2-gama | `gama-dr4` | `files` SpecObjv27.fits | A rule condition `is_not` and a left-out reason `other_survey`, to keep SURVEY = GAMA and NQ ≥ 3. Permission pending |
          | w2-ssa | `twompz`, `wise-supercosmos` | new `ssa_sql`: POST the freeform form, follow the `.csv.gz` link it writes | 2MPZ prefers zSpec where it is not −999. Catalogue errors 0.015 and 0.033 (1 + z). Permission pending |
          | w2-matching | the matching rules for the new pairs | `rules/matching.yaml` | Photometric tolerances scaled to the scatter |
          | w2-review | `/simplify`, `/code-review`, gate, trace, close, merge | | |
