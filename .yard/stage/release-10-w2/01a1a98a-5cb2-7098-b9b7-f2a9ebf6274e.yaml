        prompt: "2MPZ cannot be fetched from the SuperCOSMOS Science Archive: its SQL form cancels any query of more than a few hundred rows within 3 s, and 2MPZ has no file download. What should release 10 do?"
        header: "2MPZ"
        context: "Tested 2026-11-05 with TOP 500 (answered), TOP 1000, 2500 and 5000, key and RA ranges, every output format and both servers: all cancelled with \"The operation was cancelled at the user's request\". Paging 934,175 rows a few hundred at a time would mean thousands of requests to a small academic service, so I have not done it. WISE × SuperCOSMOS is unaffected: it has a whole-file download (1.7 GB, csv.gz), read by a new gzipped-CSV reader. I have removed the `ssa_sql` access method I had built for these tables (kept aside in the scratchpad), since nothing can use it."
        options:
          - label: "Ask WFAU, wait"
            detail: "The WFAU draft above now asks for a 2MPZ file. 2MPZ stays out of sources/ until one exists. If it arrives before W5's build, it goes in release 10 as a files source; otherwise in a later release. Most of 2MPZ's galaxies are also in WISE × SuperCOSMOS, 2MRS or 6dFGS."
            recommended: true
          - label: "Drop 2MPZ"
            detail: "Take 2MPZ off release 10's list, and drop the line from the WFAU draft."
