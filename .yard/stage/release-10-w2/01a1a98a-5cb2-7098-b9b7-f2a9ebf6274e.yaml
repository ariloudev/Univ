        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "What W2 produced"
        markdown: |-
          - **Sources in `sources/`:**
            - DESI DR1: barycentric, via Astro Data Lab TAP jobs, `targetid > 0`.
            - SDSS DR17: galaxies at 0.35 ≤ z < 1.2 and the quasars.
            - 2dFGRS: its 221,414 galaxies, each with the catalogue rms of 85 km/s, marked non-commercial.
            - ALFALFA α.100: code 1, cz with errors of e_W50 / 2, marked non-commercial.
          - **Reader:**
            - Rule conditions of `is`, `is_not` or `below`, with the reason `outside_selection`.
            - Scaled error columns.
            - Files sources of gzipped CSV, read in pieces.
          - **Matching:**
            - 19 new pairs.
            - Each pair searched at its own radius, so DESI's 15 million entries are not searched at 360″.
          - **Waiting:**
            - GAMA DR4 and WISE × SuperCOSMOS: on the permission send date.
            - 2MPZ: on its download.
            - Each goes in by the start of W5.
          - **For W3:** the normalizer's duplicate-identifier set copies every identifier, about 1 GB for WISE × SuperCOSMOS.
        tone: success
