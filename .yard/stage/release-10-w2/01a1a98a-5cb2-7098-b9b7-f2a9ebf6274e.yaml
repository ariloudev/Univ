        header: "Send date"
        context: "Under the spec, a permission-pending source names whom it asked and on which date. The requests are not sent yet, so no true date exists. Meanwhile the rest of W2 goes ahead: DESI, the SDSS remainder, 2dFGRS, ALFALFA, the new `ssa_sql` access method and the GAMA reader. The three pending definitions wait in my scratchpad, out of `sources/`."
        options:
          - label: "Sending today"
            detail: "I record 2026-11-05 as the date asked, and put the three definitions in sources/ straight away. Choose this only if you send them today."
            recommended: true
          - label: "I'll give the date"
            detail: "Answer with the date in your own words once they are sent. The three definitions stay out of sources/ until then; if that is after W2 closes, they go in at the start of W5, before the build."
          - label: "Leave them out"
            detail: "Release 10 goes without 2MPZ, WISE × SuperCOSMOS and GAMA. They come back in a later release once permission is asked."
