  - key: 01a1a9a2-2259-76e2-aa1b-d3351b4c8d6c
    id: permission-drafts
    kind: note
    versions:
      - key: 01a1a9a2-2259-76e2-aa1b-d3374d6f4734
        at: 2026-11-05T02:55:37Z
        revision: 3
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Permission requests to send (drafts)"
        markdown: |-
          Three drafts for you to send. I send nothing myself. Each pending source records whom it asked and on which date, so its definition takes the date you send.

          ### 1. WFAU: 2MPZ and WISE × SuperCOSMOS, as served by the SuperCOSMOS Science Archive
          **To:** WFAU at the Royal Observatory Edinburgh. The SSA pages give no address. The IfA WFAU page is http://www.roe.ac.uk/ifa/wfau.
          **Subject:** Permission to redistribute 2MPZ and WISE×SuperCOSMOS photometric redshifts in a non-commercial sky viewer

          > Dear WFAU team,
          >
          > I run Univ, a non-commercial hobby project that builds a 3D map of the observable universe from public catalogues and serves it to a web viewer. Every value is cited to its catalogue and paper, and every source's terms are shown beside its data.
          >
          > I would like to include the 2MPZ catalogue (TWOMPZ..twompzPhotoz) and the WISE×SuperCOSMOS photometric redshift catalogue (WISExSCOSPZ..wiseScosPhotoz), queried from the SuperCOSMOS Science Archive. I would redistribute the position, the photometric redshift (and the spectroscopic one, where 2MPZ gives it) and an identifier for each galaxy.
          >
          > The credits page says that data retrieved from the archive "are subject to the copyright given in this copyright summary", but I could not find the summary it refers to. May I redistribute these columns in this way, crediting WFAU and citing Bilicki et al. 2014 (ApJS 210, 9) and 2016 (ApJS 225, 5) as your pages ask? If there is a copyright summary or licence I should follow, I would be grateful for a link.
          >
          > With thanks,
          > Serge Lobanovsky

          ### 2. Maciej Bilicki: the same two catalogues, as their author
          **To:** M. Bilicki. The SSA pages list maciek@ast.uct.ac.za (2MPZ) and bilicki at strw.leidenuniv.nl (WISE×SCOS); both are probably out of date, so check his current institution's page.
          **Subject:** Redistributing 2MPZ and WISE×SuperCOSMOS photo-z in a non-commercial 3D sky map

          > Dear Dr Bilicki,
          >
          > I run Univ, a non-commercial hobby project that draws a 3D map of galaxies from public catalogues, with every value cited and each source's terms shown. I would like to include 2MPZ and the WISE×SuperCOSMOS photometric redshifts, taken from the SuperCOSMOS Science Archive. For each galaxy I would redistribute its position, its photometric redshift, given the catalogue-wide scatter you publish (σz = 0.015; σz/(1+z) = 0.033) as an estimated uncertainty, and an identifier.
          >
          > Neither the archive nor the papers state terms for redistribution, so I am writing to ask whether you are happy for the catalogues to be used this way, with Bilicki et al. 2014 and 2016 cited and WFAU acknowledged. I have asked WFAU as well.
          >
          > With thanks,
          > Serge Lobanovsky

          ### 3. GAMA: DR4 SpecObj
          **To:** gama@gama-survey.org (the DR4 page's contact)
          **Subject:** Permission to redistribute GAMA DR4 redshifts in a non-commercial 3D sky map

          > Dear GAMA team,
          >
          > I run Univ, a non-commercial hobby project that draws a 3D map of galaxies from public catalogues, with every value cited and each source's terms shown. I would like to include the redshifts of GAMA DR4's SpecObj table (v27): for the rows whose best spectrum is GAMA's own and whose NQ is at least 3, the CATAID, position and heliocentric redshift.
          >
          > The DR4 page asks publications to cite Driver et al. 2022 and acknowledge GAMA, which I would do, but it does not say whether the data may be redistributed. May I redistribute these columns in this way? If there are terms I should follow, I would be grateful to know them.
          >
          > With thanks,
          > Serge Lobanovsky
        tone: info
