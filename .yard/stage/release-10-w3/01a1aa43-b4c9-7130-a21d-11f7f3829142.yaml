          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "What W3 produced"
        markdown: |-
          - **Schema 5:**
            - A catalogue database and up to 8 object shards (`OBJECTS_0` to `OBJECTS_7` in both `wrangler.toml` files).
            - The catalogue's index: `object_shards`, `shard_cells` (Morton runs) and `release_shards`.
          - **Build:**
            - A measuring pass by cell, then packing in Morton order up to `shard_budget_bytes` (4.5 GB). Objects not placed go in 64 id buckets.
            - Each object's rows go to its shard.
            - A cell past the budget is refused by name.
            - The size checks run per database.
            - The fixture build spans 2 to 3 shards under a 12 kB budget.
          - **Publish:**
            - Units are uploaded per database, each checked by its own fingerprints.
            - A release needing more shards than are bound is refused before any upload.
            - The cap is checked per database.
            - A release built before shards is refused (build it again).
          - **Prune:** clears the release's own shards, then the catalogue. It also works on a catalogue of schema 4, which W5 needs to prune releases 6 to 9.
          - **For W4:** Univ Server must read objects through `object_shards` and query volumes through `shard_cells`. Until then a newly published release serves no objects. univ-api's fixture is still one merged database, in key order.
        tone: success
