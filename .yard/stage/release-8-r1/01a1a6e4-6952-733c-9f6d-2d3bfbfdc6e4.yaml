    id: r1-t-tiles
    kind: task
    versions:
      - key: 01a1a6e4-6952-733c-9f6d-2d474810c492
        at: 2026-11-04T14:09:09Z
        revision: 1
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Tile encoding version 2"
        detail: |-
          **Scope:**
          - the Rust encoder writes each star's colour index (Gaia BP−RP, else Hipparcos B−V, else GCNS BP−RP) and its bands, within 0.01 mag;
          - the reference decoder and the explorer decode versions 1 and 2;
          - the fixtures are regenerated;
          - `/v1/tile-format` describes version 2.

          **Done when** the encoder–decoder round-trip tests pass for both versions, version 1 fixtures still decode, and the tile-format contract test passes.
        state: open
      - key: 01a1a71d-de80-76ff-abb7-96a4ed42fdd4
        at: 2026-11-04T15:11:55Z
        revision: 10
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Tile encoding version 2"
        detail: |-
          **Scope:**
          - the Rust encoder writes each star's colour index (Gaia BP−RP, else Hipparcos B−V, else GCNS BP−RP) and its bands, within 0.01 mag;
          - the reference decoder and the explorer decode versions 1 and 2;
          - the fixtures are regenerated;
          - `/v1/tile-format` describes version 2.

          **Done when** the encoder–decoder round-trip tests pass for both versions, version 1 fixtures still decode, and the tile-format contract test passes.

          **Result (c49beef):**
          - **Layout:** version 2 is version 1 plus two columns, a 20-byte point. The colour is an `i16` in hundredths of a magnitude (−32768 for none), so values round-trip within 0.005 mag. The bands are a `u8` code (0 none, 1 BP−RP, 2 B−V). A decoder refuses a code that the colour value contradicts.
          - **Limits:** the most points a tile holds is now 52,426, and `rules/tiles.yaml` restates its byte counts for version 2.
          - **Colour order:** `tiles::colour_of` takes published BP−RP first, then B−V, then derived BP−RP.
          - **Rust tests:** 16 tile tests pass, including round trip, refusals, and version 1 read back from the same bytes.
          - **TypeScript tests:** 7 decoder tests pass. `fixtures/v1/` keeps the simulated domain as version 1 wrote it, never rewritten.
          - **Tile format:** `layout(1)` and `layout(2)` both describe their versions, and `/v1/tile-format` lists each version a release uses. The OpenAPI snapshot only adds.

          **Moved to E7:** the explorer's decoding. Its source is on `product/explorer`, not on this branch cut from `develop`.
        state: done
