        title: "Release 8 carries star colours, spectral types and tile version 2"
        consequence: |-
          **R1 builds four things, in this order:**
          1. the colour-index measurement and its readers;
          2. the spectral-type text and its two sources;
          3. tile encoding version 2 and its decoders;
          4. the tile-format contract.

          The explorer's E7 then colours stars from version 2 tiles.
  - key: 01a1a707-0446-72f3-a668-bf1501da8464
    id: r1-esphs
    kind: note
    versions:
      - key: 01a1a707-0446-72f3-a668-bf16fe556e42
        at: 2026-11-04T14:46:57Z
        revision: 6
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "What ESP-HS gives over G < 10, measured"
        markdown: |-
          I asked the Gaia archive on 2026-11-04 for `spectraltype_esphs` over `gaia_source` joined to `astrophysical_parameters`, with G < 10:

          | Type | Stars |
          |---|---|
          | K | 211,248 |
          | F | 89,418 |
          | M | 50,417 |
          | A | 49,198 |
          | B | 37,905 |
          | G | 36,724 |
          | O | 985 |
          | CSTAR | 886 |
          | unknown | 1,080 |
          | blank | 4,109 |

          In all, 481,970 of the 482,106 stars have a row in the table. So ESP-HS gives a class letter for nearly every bright star, not only hot ones. The sentence I withdrew from the first approval was wrong, and the definition records these counts. "unknown" is kept as published, and E7 shows no class for it.
