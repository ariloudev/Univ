        title: "Colour indices read and kept"
        detail: |-
          **Scope:**
          - the model gains a colour-index measurement naming its two bands;
          - Hipparcos-2 (I/311) `B-V`, `e_B-V` and `V-I`, and Gaia DR3 `bp_rp`, are read as measured;
          - GCNS `BPmag` and `RPmag` are read to derive BP−RP.

          **Done when** fixture tests of each source show the values, bands, uncertainties and kinds, and `/v1/objects/{id}` lists them as measurements.

          **Result:**
          - The answers were recorded again on 2026-11-04 from VizieR (the NAO and IDIA mirrors; CDS timed out) and the Gaia archive.
          - `tests/normalize_colours.rs`, against the recorded text:
            - HIP 1: B−V 0.482 ± 0.025 measured, V−I 0.550 with no uncertainty reported;
            - HIP 3: B−V −0.019, kept negative;
            - Gaia: BP−RP 1.2496433 measured;
            - GCNS: BP−RP 1.0626 derived from BPmag 11.3022 and RPmag 10.2396, naming both; none where both are blank.
          - `object_reads` reads each colour back as a `colour_index` measurement with its bands and `derived_from`.
          - The model, ingest and API lint clean. The OpenAPI snapshot only adds.
        state: done
