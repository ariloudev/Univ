        title: "Colour indices read and kept"
        detail: |-
          **Scope:**
          - the model gains a colour-index measurement naming its two bands;
          - Hipparcos-2 (I/311) `B-V`, `e_B-V` and `V-I`, and Gaia DR3 `bp_rp`, are read as measured;
          - GCNS `BPmag` and `RPmag` are read to derive BP−RP.

          **Done when** fixture tests of each source show the values, bands, uncertainties and kinds, and `/v1/objects/{id}` lists them as measurements.

          **Progress:**
          - **Model:** `ColourIndex` and `SpectralType` on the entry.
          - **Source definitions:** readings in `normalization.colours` and `normalization.spectral_type`, with four new fields.
          - **Release rows:** a colour is a `colour_index` measurement, its bands as the `kind` term and `derived_from` in `extra`. A spectral type goes in the entry's `extra`, so older releases need no migration.
          - **API:** `band` and `derived_from` on measurements, `spectral_type` on entries. The OpenAPI snapshot only adds.
          - **Recorded answers:** being recorded again from the live services.
        state: active
      - key: 01a1a71b-8537-71c9-903f-14947902c68d
        at: 2026-11-04T15:09:21Z
