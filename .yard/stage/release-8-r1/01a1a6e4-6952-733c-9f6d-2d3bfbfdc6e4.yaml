  - key: 01a1a6e4-6952-733c-9f6d-2d42714ea436
    id: r1-approve
    kind: approval
    versions:
      - key: 01a1a6e4-6952-733c-9f6d-2d4ad906753b
        at: 2026-11-04T14:09:09Z
        revision: 1
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Release 8: star colours, spectral types and tile version 2"
        markdown: |-
          **What changes (the spec-change above):**
          - **normalize-records:**
            - Colour indices are kept as measurements naming their two bands: Hipparcos-2's B−V and V−I, and Gaia's BP−RP, each with its published uncertainty, or marked none reported.
            - GCNS BP−RP is computed from its two magnitudes, so it is **derived** and names them.
          - **Spectral types** are kept character for character as published:
            - the Hipparcos catalogue's, classified from spectra, are **measured**;
            - Gaia DR3's ESP-HS class, a model fit to BP/RP spectra, is **estimated**.
          - **look-up-an-object:** the record lists each spectral type with its source and kind.
          - **build-octree-tiles:** encoding version 2 gives each star point a colour index and its bands (Gaia BP−RP first, then B−V, then GCNS BP−RP), within 0.01 mag, or marks that it has none.
          - **decode-the-tile-format:** the reference decoder reads versions 1 and 2.
          - **data-providers:**
            - a new provider: Hipparcos I/239 for spectral types (ESA 1997), attached by HIP number;
            - Gaia's entry gains BP−RP and ESP-HS (Creevey et al. 2023).

          **Look at:**
          - The colour order prefers Gaia's BP−RP. E7 then maps colour to a star's colour through the Pecaut & Mamajek table, which has both BP−RP and B−V columns, so no conversion between bands is needed.
          - ESP-HS gives a class only for hot stars (O, B and A types); most stars will carry only Hipparcos types or none.
