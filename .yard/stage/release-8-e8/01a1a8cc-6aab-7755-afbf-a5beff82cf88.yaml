        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Approve E8's spec: choose what is drawn"
        markdown: |-
          **A new feature, *Choose what is drawn*:**
          - **The panel:** a checkbox for each scale domain, each catalogue of the drawn points (by its title), each of the four kinds of value, and each kind of structure (supercluster, void, wall and so on). All are checked when the view opens.
          - **Points:** a point is drawn only while its scale domain, the catalogue of its preferred distance and that distance's kind of value are all checked.
          - **Structures:** a structure is drawn only while its kind is checked.
          - **Hidden things:** a point or structure not drawn cannot be hovered or clicked, and the key does not count it.
          - **The address:** the groups turned off are kept in it, so a reload or a shared link draws the same groups.

          **What to look at:** a star's catalogue is the source of its *preferred* distance. Turning off Hipparcos-2 hides the stars Hipparcos placed, but not Betelgeuse, which its researched star file placed.

          **How I'd build it**, once approved: per-point source indices go to the GPU, and the four masks are uniforms, so a toggle redraws without refetching or re-uploading anything.
