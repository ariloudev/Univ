  - key: 01a1a8da-7b43-7414-af9c-2cf1508afc0d
    id: e8-reviews
    kind: note
    versions:
      - key: 01a1a8da-7b44-743b-a7c7-42b8d8546e91
        at: 2026-11-04T23:17:33Z
        revision: 8
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "What the reviews changed"
        markdown: |-
          `/simplify` (reuse, simplification, efficiency, altitude) and `/code-review` ran in parallel on the wave's diff.

          **Bugs fixed** (from `/code-review`):

          | Finding | Fix |
          |---|---|
          | Structure names were set in an effect after the render that draws their elements, so none showed on first load | `useStructures` works the names out as the page renders and returns them; `world.names` follows |
          | Credits went only to the source of each point's distance, so a source that only gives sky positions (such as Gaia positions behind Bailer-Jones distances) lost its credit | Credits stay per domain: every source of a domain with a point drawn |
          | `masksOf` threw for a source index of 32 or more, even with nothing hidden, breaking the explorer | It no longer throws: such a source can't be masked, is always drawn, and isn't offered |
          | Position-only sources were offered, and turning one off hid nothing | The panel offers only sources whose role includes distance |
          | A star with a colour in bands the manifest does not name was drawn coloured but counted grey | It is drawn grey, so the drawing and the count agree |

          **Cleanups:**
          - one shown predicate, `masks.ts`, used by the shader, the pick and the count;
          - markers get a constant `a_source` beyond the mask's bits, in place of resetting the uniforms;
          - each pickable's `shown` is set when its batch arrives and when a group is toggled, not rebuilt on every hover;
          - counts come from a per-batch histogram (kind × source × colour), so a toggle recounts per batch, not per point;
          - the recount runs only when the point groups change;
          - turning a structure kind off hides names in the renderer instead of re-uploading every outline;
          - the world no longer holds `hidden` and `domains`; `useWorld` exposes the domains;
          - one address helper, `setInAddress`, is shared with `useChosen`;
          - `Hidden` is keyed by group;
          - a shared `Swatch`.

          **Skipped:**
          - packing source and kind into one byte: it would change the batch format to save about 6 MB of GPU memory at 3M points;
          - a shared `<details>` frame: only two copies.

          `pnpm check` passes with 193 tests.
        tone: info
