    versions:
      - key: 01a1a8df-170d-738a-a845-0652cb821ab4
        at: 2026-11-04T23:22:35Z
        revision: 10
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "What E8 produced"
        markdown: |-
          A **Show** panel turns groups of the view on and off:
          - scale domains;
          - the catalogues behind each point's distance;
          - the four kinds of value;
          - the kinds of structure.

          The groups turned off are kept in one `?hide=` parameter beside `?object=`.

          ```mermaid
          flowchart LR
            A["?hide= in the address"] --> H[Hidden, by group]
            H --> M["masksOf: kind bits, source bits per domain"]
            M --> R["renderer: domain skipped, shader masks kind and source"]
            M --> P["pick: hidden points passed over"]
            M --> C["catalogue: histogram recount, key and credits"]
            H --> S["useStructures: names, list, renderer.hideNames"]
          ```

          | Check | Result |
          |---|---|
          | `pnpm check` | 193 tests, fallow, build |
          | `cargo xtask integration` | the server's end-to-end tests and 8 Playwright tests with axe |
          | `cargo xtask check` | 13 gates |
          | `bench first-points` | p95 199 ms against 3 s |
          | Live, release 9 | stars only: 750,109 coloured and 6,946 grey; the cosmic web without SDSS: 818,281 → 169,620 measured; voids only: 10 structures |

          **Left open:**
          - a source of index 32 or more in a domain can't be masked, and isn't offered; release 9's largest domain has 9 sources;
          - credits stay per domain, since a point's sky position may come from a source other than its distance's.
        tone: success
