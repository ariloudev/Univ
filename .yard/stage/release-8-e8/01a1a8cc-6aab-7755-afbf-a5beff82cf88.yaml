        markdown: |
          # Plan: E8, choose what is drawn (`stage/release-8-e8`)

          ## Context

          You asked for a panel of checkboxes to turn groups of the view on and off. You chose all four
          groups, kept in the page's address. The spec, the feature `the-view/choose-what-is-drawn`, is
          approved and committed alone (43ed75a). Its criteria:

          - **The panel:** a checkbox for each scale domain, each source of the drawn points (by title),
            each kind of value and each structure kind, all checked when the view opens.
          - **Points:** a point is drawn only while its domain, the source of its preferred distance and
            that distance's kind of value are all checked.
          - **Structures:** a structure is drawn only while its kind is checked.
          - **Hidden things:** they are neither named by the pointer nor chosen by a click, and the key
            does not count them.
          - **The address:** the groups turned off are kept in it.

          E7 is merged into `product/release-8` (c643784), and E8's branch was cut from there. The process
          is the usual one:
          1. focused checks;
          2. `/simplify` and `/code-review`;
          3. `cargo xtask check` and `cargo xtask integration`;
          4. the trace accepted;
          5. the Yard Log closed;
          6. a `--no-ff` merge into `product/release-8`.

          **Approach.** Tiles are uploaded once and filtered on the GPU, so a toggle redraws without
          refetching or re-uploading.
          - Each point gets its source index as an attribute.
          - Per batch, the shader receives a 32-bit mask of hidden sources and a mask of hidden kinds.
          - A hidden domain's batches are skipped whole.
          - In release 9 a domain has at most 9 sources: stars 5, nearby galaxies 7, cosmic web 9.

          ## Tasks

          | Task | Scope | Done when |
          |---|---|---|
          | **e8-t-hidden** | **New `src/ui/hidden.ts`.** `Hidden = { domains, sources (by source id), kinds, structureKinds }`, as sets of what is turned off.<br>**Address:** `hiddenInAddress(search)` and `hideInAddress(hidden)` read and write one `?hide=` parameter, such as `hide=domain:cosmic_web,source:sdss-dr17-galaxies,kind:reconstructed,structure:void`. Only that parameter is edited, so `object` and `as` stay (as `keepInAddress` in `useChosen.ts:43` does).<br>**Hook:** `useHidden()` follows `useChosen`'s pattern: a lazy first read of `location.search`, and `history.replaceState` in an effect.<br>**Predicate:** `isShown(hidden, domain, sourceId, kind)` | `hidden.test.ts`: round-trip through the address, other parameters kept, nothing hidden by default, unknown entries ignored |
          | **e8-t-draw** | **`renderer.ts`:**<br>- `Points` gains `domain` and `sources: Uint16Array`;<br>- `upload` adds an `a_source` attribute;<br>- `setHidden(masks)` stores the hidden domains, a kind mask, and a source mask per domain;<br>- `draw` skips a hidden domain's batches and sets `u_hiddenSources` per batch and `u_hiddenKinds` once, with markers drawn with no mask.<br>**`shaders.ts`:** a hidden point, by `(mask >> uint(a_kind)) & 1u` or by its source, is moved outside the clip volume with size 0.<br>**Pure `masksOf(hidden, domains)`** in `src/scene/masks.ts` turns `Hidden` into bits by each domain manifest's source indices; it refuses a domain with more than 32 sources.<br>`useWorld.ts` passes `domain` and `sources`, and calls `renderer.setHidden` and `controller.invalidate()` when `Hidden` changes. | `masks.test.ts` covers the bits by manifest index, a source shared by two domains, and the 32-source refusal. The `fakeWorld` renderer gains a `setHidden` stub |
          | **e8-t-pick** | `pick.ts`: `Pickable` gains an optional `shown?: (i: number) => boolean`, checked inside the `pickIn` loop, so that a hidden point never hides a shown one behind it. `pointUnder` (`scenePoint.ts`) builds it from `isShown` with the batch's domain, sources and kinds | `pick.test.ts`: a hidden point under the pointer is passed over for the shown point behind it |
          | **e8-t-count** | `catalogue.ts`:<br>- `tally` applies the shown predicate per point; stars are counted coloured or grey by `stars.bands[i]`;<br>- a new `setShown(predicate)` resets the counts and recounts every drawn batch once per toggle, a few milliseconds at the 3M-point budget;<br>- `domainPoints` becomes points per `domain/source`, so `credits()` lists only the sources whose points are drawn and shown. | `catalogue.test.ts`: the counts and credits after hiding a source, a kind and a domain, and restored when the group is shown again |
          | **e8-t-structures** | In `useStructures.ts`, an effect keyed on `structureKinds` calls `setLines`, `setMarkers` and `world.names` with nothing for hidden ids, then invalidates. `StructureList` lists only shown structures | `useStructures` test: a hidden kind's lines, markers and names are removed and come back. The hook test hoists the world, as the memory note requires |
          | **e8-t-panel** | **New `src/ui/ShowPanel.tsx`:** a `<details>` titled "Show", placed in `SidePanels.tsx` between `Panels` and `StructureList` and styled like `StructureList`. It holds four fieldsets with a legend each:<br>- scale domains;<br>- catalogues, as the manifests' sources by id with their titles, each listed once;<br>- kinds of value;<br>- structure kinds, with counts.<br>Every checkbox is labelled for axe. **e2e:**<br>- clearing "cosmic web" puts `hide=domain:cosmic_web` in the address and drops the cosmic web's count from the key;<br>- a reload keeps the box cleared;<br>- the axe test opens the new disclosure. | `ShowPanel.test.tsx`: all checked at first, toggling calls back, labels by title. The Playwright tests pass. `pnpm check` passes |
          | **e8-t-live** | `cargo xtask explore` on release 9, with screenshots:<br>- stars only;<br>- the cosmic web without SDSS;<br>- voids only.<br>`bench first-points` stays within 3 s | screenshots sent to you, and the bench within bound |
          | **e8-t-close** | Trace links for the six criteria, the reviews, the gate, integration, closing the Yard Log, and the merge into `product/release-8` | as for every wave |

          ## Critical files

          - `clients/explorer/src/scene/renderer.ts`, `shaders.ts`, new `masks.ts`
          - `clients/explorer/src/scene/pick.ts`, `src/ui/scenePoint.ts`
