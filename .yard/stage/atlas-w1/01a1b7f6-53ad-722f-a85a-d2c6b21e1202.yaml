        title: "Forms and flag meanings for every source"
        detail: "11 sources carry a cited designation form and 13 carry flag meanings (17 columns). The others have no documented form a prefix can give (6dFGS, WISE×SuperCOSMOS, SDSS, DESI, GAMA, eRASS1, CF4 groups) or are named already (McConnachie, UNGC). The \"HIP \" prefix rule in rules/matching.yaml stays: a form formats only an entry's own identifier. Composite flags (Sn, Bailer-Jones flag, xm_flag) list the values the downloads hold; a new combination reads as having no meaning given."
        state: done
