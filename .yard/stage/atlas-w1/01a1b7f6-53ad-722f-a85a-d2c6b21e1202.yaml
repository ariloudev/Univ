                    "after": "The Release publisher shall keep every D1 database of the releases, the catalogue database and each object shard, within D1's 10 GB database cap, counting each row once whichever releases hold it, and budgeting the rows of the release latest points to at 4.5 GB in each so that a release changing every row can be published before the previous one is pruned.",
                    "before": "The Release publisher shall keep every D1 database of the releases, the catalogue database and each object shard, within D1's 10 GB database cap, budgeting each release at 4.5 GB in each so the next release can be published before the previous one is pruned."
                  }
                },
                {
                  "change": "added",
                  "key": "01a1b1a0-7c6e-703c-8f49-8a7e2f8c5737",
                  "kind": "decision",
                  "label": null,
                  "name": "Share unchanged rows and files between releases",
                  "words": {
                    "after": "Share unchanged rows and files between releases\n\nEach row is held from the release that adds it until a release retires it, and each file once by its SHA-256, so a release writes, publishes and stores only what it changes."
                  }
                }
