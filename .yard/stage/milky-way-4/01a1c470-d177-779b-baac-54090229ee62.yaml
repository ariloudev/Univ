        by:
          host: claude-code
          session: "918a7610-2359-46e7-a590-437534c76364"
        title: "Wave 4 plan (pre-approved by the owner)"
        markdown: |-
          **From the survey:**
          - Each tile point already carries its source index and the kind of value of its preferred distance, so the tile format does not change.
          - Points are drawn additively with no depth buffer. A star is therefore dimmed in its own vertex shader, by the dust a 3D texture holds between the eye and the star; this is how the spec's "dims the stars behind it and not those in front" is met.
          - The dust's own look is a full-screen ray-marched pass drawn before the points.
          - The explorer has no grid code yet. The server serves `/v1/grids/{id}` (header) and `/v1/grids/{id}/fields/0` (samples).

          | Task | Change | Criteria (draw-the-catalogues, draw-the-dust-map) | Verified by |
          |---|---|---|---|
          | t1 tracer colours and key | a colour per source of `galaxy_tracers`, set per point in `batchOf`; a key line per source with its colour and its drawn count | own colour, distinct from star temperatures and the galaxy blue; key names each source with colour and count | Vitest: palette distance from black-body colours at 2,000–40,000 K and from the galaxy blue; key rendering with counts |
          | t2 tracer size | a point size per domain, twice the stars' for tracers | twice the size | Vitest on the size rule |
          | t3 inferred stars | star alpha halved when the kind is inferred; the key says fainter stars have inferred distances | half opacity; the key says so | Vitest on `batchOf` and the key |
          | t4 dust switch and fetch | `dust` address switch in the Show drawer, off by default; header and field 0 fetched once a release on first turn-on; decoded; NaN read as no dust; averaged 2×2×2 to 125³ half floats (3.9 MB on the GPU); on failure the switch turns off and a message names the grid and the error | switch; address; fetched once; message; points kept | Vitest on the switch, fetch-once, decode, downsample and NaN handling |
          | t5 dust volume | `scene/dust.ts`: a 3D texture placed by the manifest's galactic rotation, parsecs to scene megaparsecs, and a ray-marched translucent haze | position and orientation; no-data cells add nothing | Vitest on the CPU mirror of the placement transform |
          | t6 dimming | the point vertex shader integrates the texture from the eye to the star and dims the star's colour by it (a display scale, labelled as such) | dims stars behind dust, not those in front | Vitest on a CPU mirror of the integral: a star in front of a cloud is not dimmed, one behind is |
          | t7 key | the dust key names the source, the unit and that the values are reconstructed, from the grid header | key | Vitest |
          | t8 e2e | Playwright: the switch lands in the address. The fixture release has no dust grid, so turning it on shows the failure message and the points stay drawn. No WebGL `INVALID_` errors | address; message; points kept | `cargo xtask integration` |
          | t9 review | `/simplify`, `/code-review`, the gate and integration once, the trace, close and merge | | green |

          The dimming is a display cue, not photometry: the key and the README say so. The look on real data waits for release 13, whose full ingest needs the owner's approval.
