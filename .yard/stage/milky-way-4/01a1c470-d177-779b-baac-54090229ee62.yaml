        title: "Release 13: full ingest started in the background (the owner's word)"
        markdown: |-
          The owner asked, on 2026-11-10, for the full ingest to run in the background while the explorer work goes on, without a separate confirmation.

          - **Code:** a frozen copy of the ingest binary at `.cache/univ-ingest/r13/univ-ingest`, built from `658a862`. The ingest code is the same as product/milky-way's after wave 3; wave 4 touches only the explorer and xtask.
          - **Order:** `build` (every source, the real cache and state, so release 13), then `cargo xtask science` on the build, then `publish` to the real local state, only if the build and the checks pass.
          - **The dust file:** the copy already checked against Zenodo's MD5, linked into the shared cache with its provenance, so it is not downloaded again.
          - **Logs:** `.cache/univ-ingest/r13/{run,build,science,publish}.log`.
          - **Not done:** no prune; that still needs the owner's word.
        tone: info
