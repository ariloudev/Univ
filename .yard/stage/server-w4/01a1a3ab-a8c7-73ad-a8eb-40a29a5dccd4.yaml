        title: "What W4 produced"
        markdown: |-
          | Area | Result |
          |---|---|
          | Owner | `/v1/owner/keys`: issue, list, change, revoke, with the owner secret as bearer token (compared in constant time); 401 without it, changing nothing |
          | Keys | 256-bit secrets, returned once, stored as SHA-256; default quotas (100 layers, 100,000 items, 64 KiB) and the standard tier |
          | Authentication | bearer key checked before routing; unknown and revoked keys get identical 401s |
          | Rate limits | anonymous 300/60 s per address (failed credentials included); basic 300, standard 1,200, extended 6,000 per key; 429 with `Retry-After: 60` |

          **For W5:** quotas are stored and changeable but not yet enforced; usage per key needs layers; bodies are read before authentication.
        tone: success
