        title: "Review W4 and fix the findings"
        detail: |-
          Correctness and simplify reviews ran on W4's own diff. Fixed in ebf228b:
          - failed credentials were never rate limited (owner secret guessable at any speed);
          - a quota above 2^53−1 made a key unlistable and unrevocable;
          - the lookup bench would hit the anonymous limit;
          - the 429 e2e test could flip at a minute boundary;
          - nothing held `wrangler.toml`'s limits to the tiers;
          - one UPDATE … RETURNING per change, one hex encoder, humantime, headers carried by Problem, shared test helpers, and bindings resolved on use.

          Deferred to W5: passing the caller to handlers, and reading bodies after authentication.
        state: done
