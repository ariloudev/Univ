        title: "Platform: layers database, randomness, clock, limiters, owner secret"
        detail: "The backend gains the univ-layers database, random bytes, the time, the rate limiters and the owner secret; the Worker binds them, and the test kit gives deterministic stand-ins. Done when native tests run through them."
        state: active
      - key: 01a1a3b3-55ff-7441-b7da-895e21003fb5
