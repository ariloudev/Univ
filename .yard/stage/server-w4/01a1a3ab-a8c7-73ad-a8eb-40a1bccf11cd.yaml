          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Rate limits by address and by tier"
        detail: "Anonymous requests by client address at 300 per 60 s; keyed requests by key at the tier's rate (basic 300, standard 1,200, extended 6,000), changed from the next request; 429 with Retry-After. Done when native tests cover AC-261 to AC-263 and the tier criteria, and an e2e test gets a real 429."
        state: open
      - key: 01a1a3b3-55ff-7441-b7da-89610fafac6e
        at: 2026-11-03T23:16:41Z
        revision: 2
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Rate limits by address and by tier"
        detail: "The tier is read from the key's row on every request, so a change applies from the next one. The 429 carries `Retry-After: 60`. 120 univ-api tests pass."
        state: done
