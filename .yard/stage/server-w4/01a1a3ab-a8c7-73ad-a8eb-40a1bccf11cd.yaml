        title: "Platform: layers database, randomness, clock, limiters, owner secret"
        detail: "The backend gains `layers`, `random` (getrandom `wasm_js` in the Worker), `now_millis`, `limit` (the ANON, BASIC, STANDARD and EXTENDED bindings) and `owner_secret`. The test kit gives deterministic stand-ins, and migration 0002 adds `keys`."
        state: done
  - key: 01a1a3ab-a8c7-73ad-a8eb-40a4396df6e7
    id: t4-owner
    kind: task
    versions:
      - key: 01a1a3ab-a8c7-73ad-a8eb-40ac88740825
        at: 2026-11-03T23:08:18Z
        revision: 1
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Owner key operations"
        detail: "Issue (a 256-bit secret, returned once, stored only as its SHA-256; default quotas and the standard tier), list (no secret), change quotas and tier, revoke (with time); 401 without the owner secret, changing nothing. Done when native tests cover AC-265 to AC-269, AC-272 and the tier-default criterion."
        state: open
      - key: 01a1a3b3-55ff-7441-b7da-895f80b54b7f
        at: 2026-11-03T23:16:41Z
        revision: 2
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Owner key operations"
        detail: "Issue, list, change and revoke under /v1/owner/keys, documented in OpenAPI with an `owner` bearer scheme. The secret is compared in constant time."
        state: done
  - key: 01a1a3ab-a8c7-73ad-a8eb-40a580b75ca1
    id: t4-auth
    kind: task
    versions:
      - key: 01a1a3ab-a8c7-73ad-a8eb-40adc4a63f95
        at: 2026-11-03T23:08:18Z
        revision: 1
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "API key authentication"
        detail: "A bearer key on any request is checked against its stored SHA-256 before the request is handled; an unknown or revoked key gets the same 401. Done when native tests cover AC-277 to AC-280."
        state: open
      - key: 01a1a3b3-55ff-7441-b7da-8960f5397beb
        at: 2026-11-03T23:16:41Z
        revision: 2
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "API key authentication"
        detail: "`access::authenticate` runs before routing. An unknown and a revoked key get identical 401s, with `WWW-Authenticate: Bearer`."
        state: done
  - key: 01a1a3ab-a8c7-73ad-a8eb-40a609899f9d
    id: t4-limits
    kind: task
    versions:
      - key: 01a1a3ab-a8c7-73ad-a8eb-40ae43894e5a
