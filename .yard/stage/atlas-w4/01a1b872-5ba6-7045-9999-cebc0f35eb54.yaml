        title: "W4 produced"
        markdown: |-
          - **Heading:** the name the object was found by, else its first proper name, else its first designation in its catalogue's form, with its id; a second name an entry gives (such as a Hipparcos number) heads nothing.
          - **Record parts:** names and designations (merged only where in a catalogue's form, with every source's title); on the sky (sexagesimal ICRS and galactic l, b, with frame and epoch); distance; brightness; spectral type and colour; motion and redshift (z where normalized); groups (in their catalogue's form, choosable, offering several objects or saying none); the structures whose volume holds it; catalogues with each flag's meaning; papers. Every value carries the key's mark of its kind.
          - **Hover:** after a 0.3 s rest the label names the point from its record, read through one cache shared with the panel.
          - **Ingest (minor):** a researched star is named by its file as a proper name.
          - **Checked on release 11 by eye:** galactic l, b of HIP 32754 match an independent ESA 1997 computation (l 160.1451°, b +21.9622°).
          - **Gate and integration** passed.

          **For the owner, outside this wave:**
          1. The `/v1` OpenAPI snapshot gives an object's `relations` items as the layers' `Relation` enum, where the record sends `{kind, entry, other, scheme, identifier}`: the two schemas share a name. Correcting the `$ref` is a change the snapshot rule refuses within v1.
          2. The altitude review suggests Univ Server resolve each relation to its object id, and send `Cache-Control: immutable` on release-pinned object reads, which would replace the client's record cache.
        tone: success
