        title: "Build plan: the Show drawer redesigned (W9, `stage/atlas-w9`)"
        markdown: |
          # Build plan: the Show drawer redesigned (W9, `stage/atlas-w9`)

          ## Context
          The Show drawer is a flat list of 22 catalogue titles, most of which wrap. It doesn't group them by domain, has no way to act on several at once, and its kinds of value don't look like the key. The owner chose mockup **A, catalogues nested in their domains**, on the atlas canvas (https://claude.ai/artifact/3K31gmVV3VYNc2BvN2Twao, board `ShowNested.dc.html`). The spec change was approved in Yard and committed at 7c5bfe2 (`choose-what-is-drawn`): two Requirements reworded and six new.

          This work joins W9, which stays on its branch. Nothing is merged until the owner says so.

          ## What stays
          - The model in `ui/hidden.ts`: four groups (domain, source, kind, structure), the `hide=` address parameter, and the masks in `scene/masks.ts`. A point is drawn only while its domain, source and kind are all on, as now.
          - The drawer's 300 px width (`Atlas.tsx` `Drawer`).

          ## Changes

          ### 1. `ui/hidden.ts`: changes made several at a time
          - `Toggle` becomes `Apply = (changes: readonly Change[]) => void`, where `Change = { group, name, shown }`.
          - `applied(hidden, changes)` is a pure function that keeps any group's set that no change touches, the way `toggled` does now.
          - `useHidden()` returns `[hidden, apply]`. `Scene.tsx` passes it on as `onApply`.

          ### 2. `ui/show/choices.ts` (pure; replaces `choicesOf` in `ShowPanel.tsx`)
          `choicesOf(domains, structures) → ShowChoices`:
          - **`domains`:** for each domain:
            - `name`;
            - `points`, the sum of its manifest's `nodes[].points`;
            - `sources`: each `{ id, short, title, alsoIn }`. These are the sources that place its points (not `role: "position"`, index under `MASK_BITS`, as now), and `alsoIn` names the other domains that hold each one.
          - **`sources`:** every source once, for the summary and for "only".
          - **`families`:** structure kinds grouped by family (denser, emptier, walls and threads, distant arcs and groups, flows, other), each kind with its count, in the order its family lists it.

          Then:
          - `STRUCTURE_FAMILIES` sits beside the colour table in `scene/kinds.ts`, whose comment already groups the colours this way. A kind not listed goes under "other".
          - `summaryOf(choices, hidden)` gives the counts on and in all, for domains, sources, kinds of value and structure kinds.

          ### 3. `ui/show/actions.ts` (pure change builders, each returning `Change[]`)
          - `domainState(domain, hidden)` returns `on`, `off` or `mixed`. It is mixed while the domain is on and at least one, but not every one, of its sources is off.
          - `domainOn(domain)` turns the domain and every source under it on. `domainOff(domain)` turns the domain off.
          - `onlySource(id, choices)` turns that source and each domain that holds it on, and every other source off.
          - `onlyKind(kind, choices)` turns that structure kind on and every other one off.
          - `allPoints`, `nonePoints`, `allStructures`, `noneStructures`, and `everything(hidden)` (every entry hidden now, turned on). `nonePoints` turns every domain off.

          ### 4. Components in `ui/show/`
          `ShowPanel.tsx` moves from `ui/` to `ui/show/`, and `Atlas.tsx` and `Scene.tsx` are updated to import it from there. The pieces stay small, to keep fallow's complexity limits.
          - **`ShowPanel`:** the heading "Show", then the summary line, then two parts.
          - **`Summary`:** one line each. For example: "Points: 3 of 3 domains, 20 of 22 catalogues, 4 of 4 kinds." and "Structures: 9 of 13 kinds." It shows a "Show everything" button only while something is off.
          - **`PartHeading`** (Spectral, with All · None buttons): "Points", then "Structures".
          - **`KindToggles`:** four `button`s with `aria-pressed` in a 2 × 2 grid, each carrying the key's mark (`KIND_MARKS`, `POINT_CSS` from `scene/kinds.ts`) and its name. A kind that is off is drawn with a dashed outline in dim text.
          - **`DomainBlock`:**
            - The heading row has a checkbox labelled with the domain's name in words, in sentence case ("Stars", "Nearby galaxies", "Cosmic web"). A ref sets `indeterminate` while the domain is mixed, which assistive technology reads as mixed.
            - Next come its point count (`toLocaleString`, or "36.0 million" from 1 million up), its number of catalogues, and a fold button (`aria-expanded`), open by default.
            - Then one `SourceRow` per source.
          - **`SourceRow`:** a checkbox labelled with the source's short name, with `title` set to its full title. A ↔ marker is shown where `alsoIn` is not empty; its title reads "Also in the cosmic web, switched there too". An "only" button (`aria-label="Only Gaia DR3"`) is kept in the tab order but shown only on hover or focus (`group-hover`, `group-focus-within`). One note under the domain explains ↔.
          - **`StructureFamilies`:** each family's name in dim type, then its kinds as `aria-pressed` chips:
            - the `Swatch` colour, the kind in words and its count, with accessible name "void, 10 structures";
            - when off, the swatch is hollow and the outline dashed;
            - an "only" button beside each chip, shown on hover or focus.

          **Short names:** two cosmic-web sources share "SDSS DR17", so `sdss-dr17-distant` becomes "SDSS DR17, z > 0.35" in `ui/record/names.ts`. A test checks that short names are unique among a release's sources.

          ## Tests (each against the criterion it verifies)
          - **`ui/show/choices.test.ts`** (the fixture manifests in `test/fixtures.ts`):
            - domain point counts and catalogue counts;
            - short names, with titles kept;
            - `alsoIn` for a source in two domains;
            - families, with an unknown kind under "other";
            - summary counts;
            - short names unique among release 12's sources.
          - **`ui/show/actions.test.ts`:**
            - mixed, on and off;
            - turning a domain on from off or from mixed turns its sources on;
            - turning it off leaves its sources as they are;
            - "only" a source turns on that source and its domains, and turns off every other source;
            - "only" a kind;
            - All and None for each part;
            - "Show everything".
          - **`ui/hidden.test.ts`:** `applied` with several changes; untouched sets kept identical.
          - **`ui/show/ShowPanel.test.tsx`** (rewritten):
            - the summary, and the link shown only while something is off;
            - the nested rows, with `title` and ↔;
            - the mixed checkbox's `indeterminate`;
            - fold and unfold;
            - "only" reachable by keyboard focus, calling `onApply` with its changes;
            - the kind toggles' marks and `aria-pressed`;
            - the structure chips' colour, count, family and hollow state when off;
            - All and None.
            
            The old tests' names change, so their trace links do too.
          - **e2e:**
            - The domain test uses the "Stars" label and also checks that the summary reads "2 of 3 domains".
            - A new step chooses "only" Gaia DR3 and checks that the address hides every other star source.
            - axe runs with the Show drawer open.

          ## Wave end (W9 grows; no merge)
          1. `/simplify` and `/code-review` on the Show drawer's diff, in parallel; then the fixes.
          2. `cargo xtask check` once, then `cargo xtask integration` once.
          3. Trace links for the 22 new criteria and the two reworded ones (455a, 455b), accepted.
          4. Screenshots of the drawer on release 12, side by side with mockup A.
          5. Yard notes and tasks updated, and everything committed. The branch stays open for the owner's next tasks: nothing is merged, pushed, published or deployed.

          ## Verification
          - `pnpm check` in `clients/explorer`: typecheck, Vitest, fallow and build.
          - On release 12 with `cargo xtask explore` (port 5317):
            - fold Cosmic web;
            - turn off one Nearby catalogue and see the domain go mixed, and the same catalogue go off under Cosmic web;
            - "only" Gaia DR3;
            - None and then All for structures;
            - "Show everything";
            - reload, and check that the address keeps the state.
        planMode: true
