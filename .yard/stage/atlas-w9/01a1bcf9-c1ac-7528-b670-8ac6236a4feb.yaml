        markdown: |-
          **Reworded:** a *switch* for each group, all on when the view opens; a point or structure is drawn only while its groups are all *on*.

          **New:**

          | Requirement | What it settles |
          |---|---|
          | Summary | Domains, sources, kinds of value and structure kinds as *n of N*; *Show everything* only while a group is off |
          | Nested sources | Each domain heads its sources with its point and source counts and folds; a source by its short name, its title on hover; a source in two domains marked as switched in both |
          | Domain switch | **Mixed** while the domain is on and some of its sources are off; turning it on also turns all its sources on; turning it off hides its points whatever its sources' switches |
          | Kinds of value | Toggles with ● ◐ ○ ◌; an off kind hollow, not pressed |
          | Structure kinds | Toggles with colour and count, by family: denser, emptier, walls and threads, distant arcs and groups, flows, other |
          | Only | Only a source turns it and its domains on and every other source off; only a kind of structure likewise; offered on hover or focus |
          | All and None | Points: All turns every domain, source and kind on, None every domain off. Structures: All every kind on, None every kind off |

          **To look at:** points' *None* turns the domains off rather than every source, so turning a domain on again brings back its sources at once. Nothing changes in the address: the same groups are kept there.
