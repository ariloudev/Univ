                  "key": "01a1bcba-dd8e-750a-886c-c229e5489bf9",
                  "kind": "criterion",
                  "label": null,
                  "name": "Where one source gives an object more than three redshifts, the panel draws them as ticks on one axis of velocity, with the velocity another source gives marked where one does.",
                  "parent": "01a1a497-e843-728a-bce8-3fe654d91c29"
                },
