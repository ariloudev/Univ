        revision: 1
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "The record panels' redesign"
        markdown: |-
          **Read an object** gains seven criteria:
          - a summary sentence;
          - lines of label, value with a short source name, and kind mark, with provenance given once per section;
          - short source names, the full title in the full record;
          - preferred values shown, everything else behind one link;
          - a dot plot of distances (parallaxes inverted and labelled);
          - a strip of ticks where one source gives more than three redshifts;
          - BP−RP on the view's star colour scale.

          **See the structures** gains six criteria:
          - a summary sentence;
          - a depth band in comoving distance, with velocities placed at z = cz/c under the release cosmology;
          - length bars per unit, lower limits fading out, values rescaled with the published value beneath;
          - member strips;
          - a disputed callout;
          - papers named once by first author and year, with notes, quotes and every value behind one link.

          **The cull:** "Only what lies inside" moves to the top bar, beside the level-of-detail switch. The panel explains the cull only while it is on, and the top bar criterion now names the checkbox.

          Worth a look: the dot plot draws a parallax at its inverse, a derived value, so it is labelled "1/ϖ".
