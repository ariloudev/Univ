  - key: 01a1bcbb-1314-7392-88cc-1fe649386c32
    id: why
    kind: note
    versions:
      - key: 01a1bcbb-1314-7392-88cc-1fec935fff72
        at: 2026-11-08T19:55:39Z
        revision: 1
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Why"
        markdown: |-
          The owner compared the record as built with the design they had chosen and found the built one much too wordy: every value of every source, with its full citation, in long-form units.

          - **The design:** 13 mockups built from real release-12 records (6 objects, 7 structures) are on the atlas options canvas, and the owner approved them.
          - **How to build it:** the owner asked for one base panel with the common logic, reused by each specific panel.
          - **The checkbox:** "Only what lies inside" moves from the panel to the top bar, beside the level-of-detail switch.
          - **Short source names:** a table in the explorer, falling back to the title. The proposal is to move it into the source definitions with release 13.
  - key: 01a1bcbb-1314-7392-88cc-1fe78b676f84
