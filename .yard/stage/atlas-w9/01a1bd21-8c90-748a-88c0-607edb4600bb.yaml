                  "change": "added",
                  "key": "01a1bcba-dd8e-750a-886c-c225087c12cf",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each value in the panel's sections stands on one line of its label, the value with the short name of its source, and the mark of its kind of value, and each section gives its frame, epoch and provenance once, beneath its lines.",
