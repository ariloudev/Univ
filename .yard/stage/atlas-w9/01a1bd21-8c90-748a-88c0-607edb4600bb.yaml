                  "name": "Each edge of the view carries a tick where the direction of sight through it crosses a round longitude or latitude of the chosen axes.",
                  "parent": "01a1b7d7-c032-73ad-803e-b10246def191"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b10435170cb6",
                  "kind": "criterion",
                  "label": null,
                  "name": "The ticks of an edge other than of right ascension are spaced at the finest step of 90, 30, 15, 10, 5, 2 or 1 degrees, or a tenth or hundredth of one, that keeps their labels at least 60 CSS pixels apart and is a multiple of any finer step the other edge of the coordinate takes.",
                  "parent": "01a1b7d7-c032-73ad-803e-b10246def191"
                },
                {
                  "change": "added",
                  "key": "01a1b863-1a09-757d-bbd7-6f0d72803e9a",
                  "kind": "criterion",
                  "label": null,
                  "name": "The ticks of an edge of right ascension are spaced at the finest step of 6, 2 or 1 hours, 30, 20, 10, 5, 2 or 1 minutes, or a tenth or hundredth of a minute, that keeps their labels at least 60 CSS pixels apart and is a multiple of any finer step the other edge takes.",
                  "parent": "01a1b7d7-c032-73ad-803e-b10246def191"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b105558be2c4",
                  "kind": "criterion",
                  "label": null,
                  "name": "A tick of equatorial right ascension is labelled in hours and minutes, and every other tick in degrees.",
                  "parent": "01a1b7d7-c032-73ad-803e-b10246def191"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b106cab43cde",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each edge names the coordinate its ticks give, such as galactic longitude.",
                  "parent": "01a1b7d7-c032-73ad-803e-b10246def191"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b107f30dda23",
                  "kind": "criterion",
                  "label": null,
                  "name": "The ticks follow the view as it turns, zooms and moves, and as the axes are changed.",
                  "parent": "01a1b7d7-c032-73ad-803e-b10246def191"
                },
                {
                  "change": "added",
                  "key": "01a1b7f5-f51b-71f9-80de-cd23746b3fab",
                  "kind": "criterion",
                  "label": null,
                  "name": "The ticks and their labels are drawn just inside the view's edge, taking no width or height from the view.",
                  "parent": "01a1b7d7-c032-73ad-803e-b10246def191"
                },
                {
                  "change": "added",
                  "key": "01a1bbb4-503d-7416-9488-04fa6b93a838",
                  "kind": "requirement",
                  "label": null,
                  "name": "While the person has turned the grid on, Univ Explorer shall draw across the view the lines of sight along the round longitudes and latitudes its edges mark, in the axes the view is drawn in.",
                  "parent": "01a1b7d7-c032-73ad-803e-b101c9b9b10c"
                },
                {
                  "change": "added",
                  "key": "01a1bbb4-503d-7416-9488-04fb4ff5b352",
                  "kind": "criterion",
                  "label": null,
                  "name": "A switch beside the axes in the top bar turns the grid on and off.",
                  "parent": "01a1bbb4-503d-7416-9488-04fa6b93a838"
                },
                {
                  "change": "added",
                  "key": "01a1bbb4-503d-7416-9488-04fcf6a73520",
                  "kind": "criterion",
                  "label": null,
                  "name": "The grid is off when the view opens on an address that does not turn it on.",
                  "parent": "01a1bbb4-503d-7416-9488-04fa6b93a838"
                },
                {
                  "change": "added",
                  "key": "01a1bbb4-503d-7416-9488-04fd03559559",
                  "kind": "criterion",
                  "label": null,
                  "name": "The page's address keeps the grid turned on, so that a reload or a shared link keeps it on.",
                  "parent": "01a1bbb4-503d-7416-9488-04fa6b93a838"
                },
                {
                  "change": "added",
                  "key": "01a1bbb4-503d-7416-9488-04fe7cd7893c",
                  "kind": "criterion",
                  "label": null,
                  "name": "The grid draws a line along each multiple of the finer of the steps the two edges of each coordinate are spaced at, so that every tick lies on one of its lines.",
                  "parent": "01a1bbb4-503d-7416-9488-04fa6b93a838"
                },
                {
                  "change": "added",
                  "key": "01a1bbb4-503d-7416-9488-04ff805e7421",
                  "kind": "criterion",
                  "label": null,
                  "name": "The grid's lines are directions of sight: they turn with the view and change with the axes, and stay still while the eye moves or zooms.",
                  "parent": "01a1bbb4-503d-7416-9488-04fa6b93a838"
                },
                {
                  "change": "added",
                  "key": "01a1bbb4-503d-7416-9488-0500d68ce364",
                  "kind": "criterion",
                  "label": null,
                  "name": "A line of longitude other than one at a multiple of 90 degrees, or of 6 hours of right ascension, stops at 80 degrees of latitude north and south, unless an edge marks it farther on, where it runs on to that tick.",
                  "parent": "01a1bbb4-503d-7416-9488-04fa6b93a838"
                },
                {
                  "change": "added",
                  "key": "01a1bbb4-503d-7416-9488-0501d8ee5c20",
                  "kind": "criterion",
                  "label": null,
                  "name": "The axes' equator is drawn heavier than the grid's other lines, and every line of the grid is drawn thinner and fainter than the neat line.",
                  "parent": "01a1bbb4-503d-7416-9488-04fa6b93a838"
                },
                {
                  "change": "added",
                  "key": "01a1bbb4-503d-7416-9488-0502db0af966",
                  "kind": "criterion",
                  "label": null,
                  "name": "The grid takes no pointer events: the points under it are named and chosen as where it is off.",
                  "parent": "01a1bbb4-503d-7416-9488-04fa6b93a838"
                },
                {
                  "change": "added",
                  "key": "01a1bbd3-54fe-7370-9d9f-cdc36f27a1f2",
                  "kind": "requirement",
                  "label": null,
                  "name": "While the person has turned the distance rings on, Univ Explorer shall draw rings of equal distance from the Solar System barycentre, with spokes along round longitudes, in the plane of the equator of the axes the view is drawn in, in place of that equator's single ring.",
