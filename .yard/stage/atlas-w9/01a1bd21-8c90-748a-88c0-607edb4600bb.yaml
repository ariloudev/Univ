                },
                {
                  "change": "added",
                  "key": "01a1bbd3-54fe-7370-9d9f-cdc9e9f39082",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each ring is labelled with its distance where it crosses the spoke of zero longitude, or, where the rings drawn are arcs short of going round the barycentre, the line from it through their middle, and a label that would overlap one already placed is left out.",
                  "parent": "01a1bbd3-54fe-7370-9d9f-cdc36f27a1f2"
                },
                {
                  "change": "added",
                  "key": "01a1bbd3-54fe-7370-9d9f-cdca6d344fc9",
                  "kind": "criterion",
                  "label": null,
                  "name": "The rings and spokes lie in space: they move on the view as the eye moves, as the points do, and change with the axes and with the scale bar's length.",
                  "parent": "01a1bbd3-54fe-7370-9d9f-cdc36f27a1f2"
                },
                {
                  "change": "added",
                  "key": "01a1bbd3-54fe-7370-9d9f-cdcb2966a530",
                  "kind": "criterion",
                  "label": null,
                  "name": "While the distance rings are on, the equator's single ring and its label are not drawn.",
                  "parent": "01a1bbd3-54fe-7370-9d9f-cdc36f27a1f2"
                },
                {
                  "change": "added",
                  "key": "01a1bbd3-54fe-7370-9d9f-cdccfc8db018",
                  "kind": "criterion",
                  "label": null,
                  "name": "The rings, spokes and labels take no pointer events: the points under them are named and chosen as where the rings are off.",
                  "parent": "01a1bbd3-54fe-7370-9d9f-cdc36f27a1f2"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b108ccec8a0c",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Explorer shall give the view as much of the window as its controls leave, keeping its panels on a rail and in bars about it.",
                  "parent": "01a1b7d7-c032-73ad-803e-b101c9b9b10c"
                },
                {
                  "change": "added",
                  "key": "01a1b7f5-f51b-71f9-80de-cd24519fb4d6",
                  "kind": "criterion",
                  "label": null,
                  "name": "The top bar holds the release, the eye's distance from the focus with the axes and the switches of the grid, the distance rings and the structures' outlines, the search, the checkbox \"Only what lies inside\" while a structure drawn as a volume is chosen, and the level-of-detail switch, in one line no taller than 40 CSS pixels.",
                  "parent": "01a1b7d7-c032-73ad-803e-b108ccec8a0c"
                },
                {
                  "change": "added",
                  "key": "01a1b7f5-f51b-71f9-80de-cd251f348c42",
                  "kind": "criterion",
                  "label": null,
                  "name": "A rail along the left edge, no wider than 52 CSS pixels, opens the view's controls, the groups of what is drawn and the list of structures, each as a drawer, and holds the button that returns to Earth.",
                  "parent": "01a1b7d7-c032-73ad-803e-b108ccec8a0c"
                },
                {
                  "change": "added",
                  "key": "01a1b7f5-f51b-71f9-80de-cd2646cc3c6c",
                  "kind": "criterion",
                  "label": null,
                  "name": "An open drawer narrows the view rather than covering it, and its rail button closes it again.",
                  "parent": "01a1b7d7-c032-73ad-803e-b108ccec8a0c"
                },
                {
                  "change": "added",
                  "key": "01a1b7f5-f51b-71f9-80de-cd2773cf8abe",
                  "kind": "criterion",
                  "label": null,
                  "name": "The record of the chosen object or structure is shown in the right margin only while one is chosen, and folds to the window's edge when asked.",
                  "parent": "01a1b7d7-c032-73ad-803e-b108ccec8a0c"
                },
                {
                  "change": "added",
                  "key": "01a1b7f5-f51b-71f9-80de-cd28fdfc1b1d",
                  "kind": "criterion",
                  "label": null,
                  "name": "The bottom bar holds the scale, the key and the credits in one line no taller than 30 CSS pixels.",
                  "parent": "01a1b7d7-c032-73ad-803e-b108ccec8a0c"
                },
                {
                  "change": "added",
                  "key": "01a1b7f5-f51b-71f9-80de-cd296b50d30d",
                  "kind": "criterion",
                  "label": null,
                  "name": "On a window narrower than 1,024 CSS pixels, a drawer and the record open over the view and close again.",
                  "parent": "01a1b7d7-c032-73ad-803e-b108ccec8a0c"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b10ec3cb74b8",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Explorer shall draw a scale of the view at the distance of its focus.",
