        revision: 32
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Build plan: the Outlines switch (W9, `stage/atlas-w9`)"
        markdown: |
          # Build plan: the Outlines switch (W9, `stage/atlas-w9`)

          ## Context
          The owner asked for "a toggle for wireframes only… object labels remain, but bounded volumes go away".

          The spec was approved in Yard and committed at 5af67e8, then corrected at bf554b0. It adds one Requirement to `see-the-structures`: while the person has turned the structures' outlines off, Univ Explorer draws no structure's outline, markers or flow symbol but the chosen structure's, and keeps every drawn structure's name. The switch is "Outlines", beside Rings in the top bar. It is on by default and kept in the address while off. A click on a name still chooses its structure.

          Nothing is merged until the owner says so.

          ## Changes
          1. **`ui/outlinesSwitch.ts`**, after `ui/ringsSwitch.ts`:
             - `OUTLINES = { parameter: "outlines", byDefault: true }`, using `switchInAddress` and `useAddressSwitch` from `ui/addressSwitch.ts`;
             - `useDrawnOutlines(world)` calls `world.renderer.showOutlines(on)` and `world.controller.invalidate()`.
          2. **`scene/renderer.ts`:**
             - a field `outlinesOn = true` and a method `showOutlines(on)`;
             - `drawOutlines` and `drawMarkers` skip an entry when `!outlineDrawn(name, { hidden, chosen, outlines })`.
             
             `outlineDrawn` is a small pure function exported from `scene/structures.ts`. A structure is drawn when its name is not hidden, and either the outlines are on or it is the chosen structure. The flow symbol is drawn inside `drawOutlines`, so it follows the same rule.
          3. **`ui/Atlas.tsx` and `ui/Panels.tsx`:**
             - `Atlas` makes the switch with `useDrawnOutlines(world)`, next to `grid` and `rings`;
             - `Whereabouts` takes `outlines` and draws `<SwitchBox label="Outlines" …>` after "Rings".
             - The test fake in `test/world.ts` gains `showOutlines`.
          4. **Names:** no change. `world.names` and `nameAt` (`ui/overlay.ts`) are untouched, so names stay and a click on one still chooses its structure.

          ## Tests (by criterion)
          - **`scene/structures.test.ts`**, for `outlineDrawn`:
            - every drawn outline goes while the outlines are off, but the chosen one's;
            - a name hidden by its kind stays hidden even when it is chosen or the outlines are on.
          - **`ui/outlinesSwitch.test.ts`:**
            - on by default;
            - `?outlines=off` turns it off;
            - turning it off writes `outlines=off` into the address, keeping the other parameters, and turning it on removes it;
            - the hook calls the renderer.
          - **`ui/Atlas.test.tsx`:** the top bar holds "Outlines" after "Rings". Clearing it tells the renderer to hide the outlines, while the structures' names stay in `world.names`.
          - **e2e:** in the structure test, clear "Outlines". The address gains `outlines=off`, the Bootes Void name is still shown, and clicking it still opens its record.

          ## Wave end (no merge)
          1. A short `/code-review` of the diff.
          2. `pnpm check`, then `cargo xtask check` once, then `cargo xtask integration` once.
          3. Trace links for the six new criteria and the reworded top-bar criterion, accepted.
          4. Screenshots on release 12, with outlines on and off.
          5. Yard updated and committed. The branch stays open.

          ## Verification
          - On release 12 (`cargo xtask explore`):
            - clear "Outlines": every outline and flow sphere goes, and the names stay;
            - choose the Vela Supercluster by its name: it alone is drawn, in white;
            - reload: the switch stays off.
        planMode: true
