        title: "Approve the Outlines switch"
        markdown: |-
          **While the person has turned the structures' outlines off**, Univ Explorer draws no structure's outline or markers but the chosen structure's, and keeps every drawn structure's name in the view.

          | Criterion | Says |
          |---|---|
          | Where | A switch **Outlines** beside *Rings* in the top bar |
          | Default | On, unless the address turns it off |
          | Address | Kept there while off, like the grid and rings |
          | Drawn | No outline, marker or flow symbol, but the chosen structure's |
          | Names | Every structure of a kind turned on is still named |
          | Choosing | A click on the view chooses no structure (the names take no clicks, as now); each is still chosen from the Structures list |

          **To look at:** the **chosen** structure keeps its outline while the switch is off, so a choice stays visible. Reject with *hide the chosen one too* if you'd rather it went as well. The top bar's criterion now lists the outlines' switch beside the grid's and the rings'.
