                  "change": "added",
                  "key": "01a1bcba-dd8e-750a-886c-c227aa642e74",
                  "kind": "criterion",
                  "label": null,
                  "name": "The panel shows the preferred or first value of each quantity, and holds every name, designation, value, catalogue entry with its flags, and paper of the record under one link that opens them in full.",
                  "parent": "01a1a497-e843-728a-bce8-3fe654d91c29"
                },
                {
                  "change": "added",
                  "key": "01a1bcba-dd8e-750a-886c-c22847d3d38d",
                  "kind": "criterion",
                  "label": null,
                  "name": "Where an object has more than one distance measurement, the panel draws them as dots on one axis of distance, each with its uncertainty and its source, the preferred one in the accent colour, a parallax at its inverse and labelled as such.",
                  "parent": "01a1a497-e843-728a-bce8-3fe654d91c29"
                },
                {
                  "change": "added",
                  "key": "01a1bcba-dd8e-750a-886c-c229e5489bf9",
                  "kind": "criterion",
                  "label": null,
                  "name": "Where one source gives an object more than three redshifts, the panel draws them as ticks on one axis of velocity, with the velocity another source gives marked where one does.",
                  "parent": "01a1a497-e843-728a-bce8-3fe654d91c29"
                },
                {
                  "change": "added",
                  "key": "01a1bcba-dd8e-750a-886c-c22aa107cee9",
                  "kind": "criterion",
                  "label": null,
                  "name": "The panel places a star's BP−RP colour index on the colour scale the view draws stars in.",
                  "parent": "01a1a497-e843-728a-bce8-3fe654d91c29"
                },
                {
                  "change": "changed",
                  "key": "01a1a497-e843-728a-bce8-3fe7201a1670",
                  "kind": "criterion",
                  "label": "AC-394",
