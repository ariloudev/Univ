                    "line": 1,
                    "name": "Frame the view as an atlas",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 10,
                    "key": "01a1b7d7-c032-73ad-803e-b10246def191",
                    "kind": "requirement",
                    "label": null,
                    "line": 13,
                    "name": "Univ Explorer shall mark the edges of the view with the directions of sight through them, in the axes the view is drawn in.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b7d7-c032-73ad-803e-b103f2a0c853",
                    "kind": "criterion",
                    "label": null,
                    "line": 19,
                    "name": "Each edge of the view carries a tick where the direction of sight through it crosses a round longitude or latitude of the chosen axes.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b7d7-c032-73ad-803e-b10435170cb6",
                    "kind": "criterion",
                    "label": null,
                    "line": 21,
                    "name": "The ticks of an edge other than of right ascension are spaced at the finest step of 90, 30, 15, 10, 5, 2 or 1 degrees, or a tenth or hundredth of one, that keeps their labels at least 60 CSS pixels apart and is a multiple of any finer step the other edge of the coordinate takes.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b863-1a09-757d-bbd7-6f0d72803e9a",
                    "kind": "criterion",
                    "label": null,
                    "line": 23,
                    "name": "The ticks of an edge of right ascension are spaced at the finest step of 6, 2 or 1 hours, 30, 20, 10, 5, 2 or 1 minutes, or a tenth or hundredth of a minute, that keeps their labels at least 60 CSS pixels apart and is a multiple of any finer step the other edge takes.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b7d7-c032-73ad-803e-b105558be2c4",
                    "kind": "criterion",
                    "label": null,
                    "line": 25,
                    "name": "A tick of equatorial right ascension is labelled in hours and minutes, and every other tick in degrees.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b7d7-c032-73ad-803e-b106cab43cde",
                    "kind": "criterion",
                    "label": null,
                    "line": 27,
                    "name": "Each edge names the coordinate its ticks give, such as galactic longitude.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b7d7-c032-73ad-803e-b107f30dda23",
                    "kind": "criterion",
                    "label": null,
                    "line": 29,
                    "name": "The ticks follow the view as it turns, zooms and moves, and as the axes are changed.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b7f5-f51b-71f9-80de-cd23746b3fab",
                    "kind": "criterion",
                    "label": null,
                    "line": 31,
                    "name": "The ticks and their labels are drawn just inside the view's edge, taking no width or height from the view.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 10,
                    "key": "01a1bbb4-503d-7416-9488-04fa6b93a838",
                    "kind": "requirement",
                    "label": null,
                    "line": 33,
                    "name": "While the person has turned the grid on, Univ Explorer shall draw across the view the lines of sight along the round longitudes and latitudes its edges mark, in the axes the view is drawn in.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bbb4-503d-7416-9488-04fb4ff5b352",
                    "kind": "criterion",
                    "label": null,
                    "line": 40,
                    "name": "A switch beside the axes in the top bar turns the grid on and off.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bbb4-503d-7416-9488-04fcf6a73520",
                    "kind": "criterion",
                    "label": null,
                    "line": 42,
                    "name": "The grid is off when the view opens on an address that does not turn it on.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bbb4-503d-7416-9488-04fd03559559",
                    "kind": "criterion",
                    "label": null,
                    "line": 44,
                    "name": "The page's address keeps the grid turned on, so that a reload or a shared link keeps it on.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bbb4-503d-7416-9488-04fe7cd7893c",
                    "kind": "criterion",
                    "label": null,
                    "line": 46,
                    "name": "The grid draws a line along each multiple of the finer of the steps the two edges of each coordinate are spaced at, so that every tick lies on one of its lines.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bbb4-503d-7416-9488-04ff805e7421",
                    "kind": "criterion",
                    "label": null,
                    "line": 48,
                    "name": "The grid's lines are directions of sight: they turn with the view and change with the axes, and stay still while the eye moves or zooms.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bbb4-503d-7416-9488-0500d68ce364",
                    "kind": "criterion",
                    "label": null,
                    "line": 50,
                    "name": "A line of longitude other than one at a multiple of 90 degrees, or of 6 hours of right ascension, stops at 80 degrees of latitude north and south, unless an edge marks it farther on, where it runs on to that tick.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bbb4-503d-7416-9488-0501d8ee5c20",
                    "kind": "criterion",
                    "label": null,
                    "line": 52,
                    "name": "The axes' equator is drawn heavier than the grid's other lines, and every line of the grid is drawn thinner and fainter than the neat line.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bbb4-503d-7416-9488-0502db0af966",
                    "kind": "criterion",
                    "label": null,
                    "line": 54,
                    "name": "The grid takes no pointer events: the points under it are named and chosen as where it is off.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 10,
                    "key": "01a1bbd3-54fe-7370-9d9f-cdc36f27a1f2",
                    "kind": "requirement",
                    "label": null,
                    "line": 56,
                    "name": "While the person has turned the distance rings on, Univ Explorer shall draw rings of equal distance from the Solar System barycentre, with spokes along round longitudes, in the plane of the equator of the axes the view is drawn in, in place of that equator's single ring.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bbd3-54fe-7370-9d9f-cdc400ce6b6b",
                    "kind": "criterion",
                    "label": null,
                    "line": 63,
                    "name": "A switch beside the grid's switch in the top bar turns the distance rings on and off.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bbd3-54fe-7370-9d9f-cdc5c6e120c2",
                    "kind": "criterion",
                    "label": null,
                    "line": 65,
                    "name": "The distance rings are off when the view opens on an address that does not turn them on.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bbd3-54fe-7370-9d9f-cdc69981e4ad",
                    "kind": "criterion",
                    "label": null,
                    "line": 67,
                    "name": "The page's address keeps the distance rings turned on, so that a reload or a shared link keeps them on.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bbd3-54fe-7370-9d9f-cdc75c539aaa",
                    "kind": "criterion",
                    "label": null,
                    "line": 69,
                    "name": "The rings lie at each multiple of the scale bar's length whose ring passes within three times the eye's distance of the focus, measured in the plane, and run on no farther than four times it.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bbd3-54fe-7370-9d9f-cdc8d373d024",
                    "kind": "criterion",
                    "label": null,
                    "line": 71,
                    "name": "Spokes run from the innermost ring drawn to the outermost along every multiple of 30 degrees of longitude.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bc8f-ef0a-7540-a283-8bf654031f2c",
                    "kind": "criterion",
                    "label": null,
                    "line": 73,
                    "name": "A ring fades where the next ring lies fewer than 6 CSS pixels from it on the view and is not drawn where it lies fewer than 2, and a ring's label is left out where the ring has faded, so that rings far toward the horizon do not crowd into a band.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bbd3-54fe-7370-9d9f-cdc9e9f39082",
                    "kind": "criterion",
                    "label": null,
                    "line": 75,
                    "name": "Each ring is labelled with its distance where it crosses the spoke of zero longitude, or, where the rings drawn are arcs short of going round the barycentre, the line from it through their middle, and a label that would overlap one already placed is left out.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bbd3-54fe-7370-9d9f-cdca6d344fc9",
                    "kind": "criterion",
                    "label": null,
                    "line": 77,
                    "name": "The rings and spokes lie in space: they move on the view as the eye moves, as the points do, and change with the axes and with the scale bar's length.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bbd3-54fe-7370-9d9f-cdcb2966a530",
                    "kind": "criterion",
                    "label": null,
                    "line": 79,
                    "name": "While the distance rings are on, the equator's single ring and its label are not drawn.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bbd3-54fe-7370-9d9f-cdccfc8db018",
                    "kind": "criterion",
                    "label": null,
                    "line": 81,
                    "name": "The rings, spokes and labels take no pointer events: the points under them are named and chosen as where the rings are off.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 10,
                    "key": "01a1b7d7-c032-73ad-803e-b108ccec8a0c",
                    "kind": "requirement",
                    "label": null,
                    "line": 83,
                    "name": "Univ Explorer shall give the view as much of the window as its controls leave, keeping its panels on a rail and in bars about it.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b7f5-f51b-71f9-80de-cd24519fb4d6",
                    "kind": "criterion",
                    "label": null,
                    "line": 89,
                    "name": "The top bar holds the release, the eye's distance from the focus with the axes and the switches of the grid, the distance rings and the structures' outlines, the search, the checkbox \"Only what lies inside\" while a structure drawn as a volume is chosen, and the level-of-detail switch, in one line no taller than 40 CSS pixels.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b7f5-f51b-71f9-80de-cd251f348c42",
                    "kind": "criterion",
                    "label": null,
                    "line": 91,
                    "name": "A rail along the left edge, no wider than 52 CSS pixels, opens the view's controls, the groups of what is drawn and the list of structures, each as a drawer, and holds the button that returns to Earth.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b7f5-f51b-71f9-80de-cd2646cc3c6c",
                    "kind": "criterion",
                    "label": null,
                    "line": 93,
                    "name": "An open drawer narrows the view rather than covering it, and its rail button closes it again.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b7f5-f51b-71f9-80de-cd2773cf8abe",
                    "kind": "criterion",
                    "label": null,
                    "line": 95,
                    "name": "The record of the chosen object or structure is shown in the right margin only while one is chosen, and folds to the window's edge when asked.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b7f5-f51b-71f9-80de-cd28fdfc1b1d",
                    "kind": "criterion",
                    "label": null,
                    "line": 97,
                    "name": "The bottom bar holds the scale, the key and the credits in one line no taller than 30 CSS pixels.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b7f5-f51b-71f9-80de-cd296b50d30d",
                    "kind": "criterion",
                    "label": null,
                    "line": 99,
                    "name": "On a window narrower than 1,024 CSS pixels, a drawer and the record open over the view and close again.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 10,
                    "key": "01a1b7d7-c032-73ad-803e-b10ec3cb74b8",
                    "kind": "requirement",
                    "label": null,
                    "line": 101,
                    "name": "Univ Explorer shall draw a scale of the view at the distance of its focus.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b7d7-c032-73ad-803e-b10fa8776879",
                    "kind": "criterion",
                    "label": null,
                    "line": 107,
                    "name": "The scale is a bar of a round length, 1, 2 or 5 times a power of ten of parsecs, kiloparsecs or megaparsecs, between 60 and 160 CSS pixels long at the focus's distance.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b7d7-c032-73ad-803e-b11043cf39a0",
                    "kind": "criterion",
                    "label": null,
                    "line": 109,
                    "name": "The scale is labelled with its length and its unit, and changes with the eye's distance from the focus.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 10,
                    "key": "01a1b7d7-c032-73ad-803e-b11163a65264",
                    "kind": "requirement",
                    "label": null,
                    "line": 111,
                    "name": "Univ Explorer shall name structures and objects as atlases name areas and points.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b7d7-c032-73ad-803e-b1129a75edd3",
                    "kind": "criterion",
                    "label": null,
                    "line": 117,
                    "name": "Structures are named in italic type, in the view, in their list and in their panel.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b7d7-c032-73ad-803e-b11383d20219",
                    "kind": "criterion",
                    "label": null,
                    "line": 119,
                    "name": "Objects are named in upright type, in the hover label and in their panel.",
                    "path": "spec/products/univ-explorer/the-view/frame-the-view-as-an-atlas.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b7d7-c032-73ad-803e-b0f94a6148dc",
                    "kind": "criterion",
                    "label": null,
                    "line": 18,
                    "name": "Once the pointer has rested on the point for 0.3 seconds, the label gives the object's name or first designation, read from its record, in place of its id.",
                    "path": "spec/products/univ-explorer/objects-and-structures/read-an-object.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bcba-dd8e-750a-886c-c224b6290cc7",
                    "kind": "criterion",
                    "label": null,
                    "line": 31,
                    "name": "The panel opens with a sentence saying what the object is, as far as its record tells, how far away its preferred distance puts it, and its scale domain.",
                    "path": "spec/products/univ-explorer/objects-and-structures/read-an-object.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bcba-dd8e-750a-886c-c225087c12cf",
                    "kind": "criterion",
                    "label": null,
                    "line": 33,
                    "name": "Each value in the panel's sections stands on one line of its label, the value with the short name of its source, and the mark of its kind of value, and each section gives its frame, epoch and provenance once, beneath its lines.",
                    "path": "spec/products/univ-explorer/objects-and-structures/read-an-object.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bcba-dd8e-750a-886c-c226b8b0863f",
                    "kind": "criterion",
                    "label": null,
                    "line": 35,
                    "name": "Each source is named by a short name in the panel's sections, or by its title where the explorer knows no short name, and by its title in the full record.",
                    "path": "spec/products/univ-explorer/objects-and-structures/read-an-object.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bcba-dd8e-750a-886c-c227aa642e74",
                    "kind": "criterion",
                    "label": null,
                    "line": 37,
                    "name": "The panel shows the preferred or first value of each quantity, and holds every name, designation, value, catalogue entry with its flags, and paper of the record under one link that opens them in full.",
                    "path": "spec/products/univ-explorer/objects-and-structures/read-an-object.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bcba-dd8e-750a-886c-c22847d3d38d",
                    "kind": "criterion",
                    "label": null,
                    "line": 39,
                    "name": "Where an object has more than one distance measurement, the panel draws them as dots on one axis of distance, each with its uncertainty and its source, the preferred one in the accent colour, a parallax at its inverse and labelled as such.",
                    "path": "spec/products/univ-explorer/objects-and-structures/read-an-object.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bcba-dd8e-750a-886c-c229e5489bf9",
                    "kind": "criterion",
                    "label": null,
                    "line": 41,
                    "name": "Where one source gives an object more than three redshifts, the panel draws them as ticks on one axis of velocity, with the velocity another source gives marked where one does.",
                    "path": "spec/products/univ-explorer/objects-and-structures/read-an-object.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1bcba-dd8e-750a-886c-c22aa107cee9",
                    "kind": "criterion",
                    "label": null,
                    "line": 43,
                    "name": "The panel places a star's BP−RP colour index on the colour scale the view draws stars in.",
                    "path": "spec/products/univ-explorer/objects-and-structures/read-an-object.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b7d7-c032-73ad-803e-b0fa7a60e532",
                    "kind": "criterion",
                    "label": null,
                    "line": 61,
                    "name": "The panel gives the object's position on the sky as right ascension and declination and as galactic longitude and latitude, with the frame and epoch of each.",
                    "path": "spec/products/univ-explorer/objects-and-structures/read-an-object.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b7d7-c032-73ad-803e-b0fb367dbf6d",
                    "kind": "criterion",
                    "label": null,
                    "line": 63,
                    "name": "The panel gives each magnitude of the object with its band, its uncertainty, its kind of value and its source.",
                    "path": "spec/products/univ-explorer/objects-and-structures/read-an-object.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b7d7-c032-73ad-803e-b0fc825b2931",
                    "kind": "criterion",
                    "label": null,
                    "line": 65,
                    "name": "The panel gives the object's proper motion, radial velocity and redshift where its sources publish them, each with its uncertainty, kind of value and source.",
                    "path": "spec/products/univ-explorer/objects-and-structures/read-an-object.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b7d7-c032-73ad-803e-b0fdf7abeef3",
                    "kind": "criterion",
                    "label": null,
                    "line": 67,
                    "name": "The panel names each group the object is a member of, and each member of a group the object is, each of which can be chosen.",
                    "path": "spec/products/univ-explorer/objects-and-structures/read-an-object.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b7d7-c032-73ad-803e-b0fe29efa362",
                    "kind": "criterion",
                    "label": null,
                    "line": 69,
                    "name": "The panel names each structure of the release whose published shape holds the object's position exactly, each of which can be chosen.",
                    "path": "spec/products/univ-explorer/objects-and-structures/read-an-object.yaml"
                  },
                  {
                    "column": 14,
                    "key": "01a1b7d7-c032-73ad-803e-b0ffeb6df712",
                    "kind": "criterion",
