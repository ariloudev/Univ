                  "key": "01a1bcba-dd8e-750a-886c-c226b8b0863f",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each source is named by a short name in the panel's sections, or by its title where the explorer knows no short name, and by its title in the full record.",
                  "parent": "01a1a497-e843-728a-bce8-3fe654d91c29"
                },
