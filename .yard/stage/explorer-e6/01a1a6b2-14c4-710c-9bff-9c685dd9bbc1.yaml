        title: "What E6 produced"
        markdown: |-
          **The object panel's heading:**
          - It is headed by the name the object was found by, such as "Andromeda #856254". The name is kept in the address and checked against the record on a reload.
          - "body" is gone: the panel reads "A galaxy group, in …" or "In the nearby galaxies domain".

          **The chosen structure:**
          - Its outline, markers and name are drawn white, and its markers larger, until another is chosen or the panel closes.
          - On release 7, the KBC void's sphere turns white, and Shapley's single point grows to a white disc under a bold white name.

          **Left open:**
          - **What an object is** (star, galaxy, cluster) waits for R1, since release 7 does not record it.
          - **Headings for clicked points:** release 7's entries carry no separate `name` field (McConnachie's "Andromeda" is an identifier). So an object opened by clicking a point is headed by its first designation, such as "2557 (cosmicflows-4-galaxies)". R1 could have the sources that publish common names record them as names.
          - **Points in white:** a white marker can be mistaken for a bright star at close range. The name turning white makes the choice unambiguous.
        tone: success
