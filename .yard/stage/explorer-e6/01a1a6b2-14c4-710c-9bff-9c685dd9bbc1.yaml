                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-3ffb8e7533cb",
                  "kind": "product",
                  "label": null,
                  "name": "Univ Explorer",
                  "words": {
                    "after": "Univ Explorer\n\nA web application that draws what Univ Server knows in three dimensions, around Earth, and lets\na person move through it with the mouse: from the nearest stars to the largest structures of\nthe universe.\n\nIt reads Univ Server's public API alone and draws only what a release placed, each point at the\nposition the release derived for it, coloured by the kind of value of its distance, with the\nsources credited as their terms require. Clicking a point reads its object; the structures are\ndrawn by their placed shapes.\n\nThe first version runs locally, beside Univ Server under `wrangler dev`. Flying with the\nkeyboard, editing layers, time and phones are outside it."
                  }
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-3ffc32e7ed9d",
                  "kind": "feature_group",
                  "label": null,
                  "name": "The view",
                  "words": {
                    "after": "The view\n\nOpening the explorer, drawing the catalogues and moving through them."
                  }
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-3ffe4657fb77",
                  "kind": "feature",
                  "label": null,
                  "name": "Draw the catalogues",
                  "words": {
                    "after": "Draw the catalogues\n\nDrawing the placed objects of every scale domain around Earth, from the tiles of the release, at the detail the view needs. Each domain is an octree of tiles whose inner tiles hold a sample of the points under them, so a region gains detail as the children of its tiles are added. The view decides which tiles are held: those in view, refined until their points lie as close on screen as the view can show, within a budget of points, dropping first the tiles the view needs least."
                  }
                },
                {
                  "change": "added",
