          **Code review, all fixed:**
          - a galaxy group was never named one: the wire value is `galaxy_group`, and the test fixture had the wrong value too;
          - choosing from a list of matches lost the name;
          - `?as=` from a link was trusted unchecked; it now heads the panel only where the record bears it;
          - a redraw on a disposed renderer.

          **Simplify:**
          - the renderer draws the chosen structure by name, so choosing uploads nothing;
          - `search` returns the name found;
          - smaller tidying.

          **Gate:**
          - The first integration run failed one test: no structure name appeared over the canvas in 60 s. The cause was a real race. The frame asked for when the structures arrived could run before React rendered the names' elements, and a still view draws no other.
          - Fixed by asking for the frame after the render (`bdb35a0`).
          - After the fix, `cargo xtask check` passed (13 gates) and `cargo xtask integration` passed (7 Playwright tests).
        state: done
  - key: 01a1a6b2-8691-74d1-b755-6169f5ab585c
    id: e6-find
    kind: note
    versions:
      - key: 01a1a6b2-8691-74d1-b755-616a8efd7eca
        at: 2026-11-04T13:14:40Z
        revision: 2
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "What a record says an object is"
        markdown: |-
          **What release 7 holds:**
          - `objects.kind` is only `body` (one catalogue entry) or `group` (a galaxy group, from a source of group rows). The volume query's `kinds` filter reads the same term.
          - `objects.scale_domain` names the domain: stars, nearby_galaxies or cosmic_web.
          - The source definitions (`sources/*.yaml`) give each source's scale domain and nothing about what it lists.

          **So no field says star, galaxy or galaxy cluster.** Inferring one from the domain would mislabel objects: eRASS1's galaxy clusters share the cosmic-web domain with galaxies, and so do CF4's groups. The science rules forbid that.

          **Moved to R1:** each source definition declares what it lists (star, galaxy, galaxy cluster, galaxy group). Ingest records it on each entry, and the object record returns it.

          **In E6:** the panel stops showing "body". It says "a galaxy group" for a group, and names the scale domain otherwise.
