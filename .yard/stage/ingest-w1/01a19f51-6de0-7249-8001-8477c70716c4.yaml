        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Apply the /simplify findings"
        detail: |-
          Applied:
          - one set of vector helpers (`zip`, `scaled`, `dot`, `cross`) in position.rs, with the ZipWith trait removed;
          - `apply`, `transpose` and `then_after` written with `map` and `from_fn`;
          - one shared arm for ellipsoid and box bounds;
          - one `positive` in value.rs;
          - CMB apex rotations go through `between`;
          - test helpers (`boxed`, `members`);
          - every frame-to-frame rotation computed once in a `LazyLock` table, exact identity on the diagonal;
          - the galactic rotation derived from the Hipparcos defining angles and checked against the published matrix to 1e-9;
          - `CmbCorrection` precomputes the apex, β and γ;
          - a CMB-frame redshift names a `DipoleModel` instead of copying a citation;
          - the cosmology name is a `Cow<'static, str>`.

          Deferred to the plan's follow-ups: a D(z) table (W4), sky-region cone boxes, member positions resolved at ingest.
        state: done
        type: fix
  - key: 01a19f5e-f128-7760-87f7-7d5c667a9a18
    id: w1-fix-review
    kind: task
    versions:
      - key: 01a19f5e-f128-7760-87f7-7d5e872d91ea
        at: 2026-11-03T03:06:01Z
        revision: 7
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Fix the /code-review findings"
        detail: |-
          Fixed:
          - the cosmology stops at z = 10, where leaving out radiation still costs under 1e-3, instead of 1100 (8% off there); Simpson's error is under 1e-8 to z = 10;
          - `redshift_at` returns an error when it doesn't converge and no longer computes D(1100) per call;
          - `lon_lat` never returns 360;
          - `rescale_hubble` refuses anything that isn't a length;
          - Quantity, SkyPosition, Shape, Designation and Cosmology are checked on deserialization;
          - geometry checks finite coordinates, unit directions, finite far distances, HEALPix cells of their order, positive primitive axes and orthonormal orientations;
          - a member list with an unplaced member has no box rather than one too small;
          - the CMB correction refuses non-heliocentric frames, non-dimensionless values and non-unit directions, and adds the dipole's ±0.11 km/s in quadrature.

          Also added `loft reconcile --fail-on warning` to the gate. Split geometry.rs (562 lines after fmt) into `geometry/mod.rs` (types and checks) and `geometry/bounds.rs`.
        state: done
        type: fix
