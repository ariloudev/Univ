        title: "Frames and positions: ICRS, galactic (Hipparcos), supergalactic (Lahav 2000)"
        detail: "Sky directions in ICRS with an epoch, Cartesian vectors, and rotations to galactic and supergalactic. Done when the published Hipparcos galactic pole and centre and the Lahav 2000 pole and origin are reproduced (AC-34, AC-35)."
        state: open
      - key: 01a19f57-e2e2-7741-98d8-952a1db1e385
        at: 2026-11-03T02:58:19Z
        revision: 3
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Frames and positions: ICRS, galactic (Hipparcos), supergalactic (Lahav 2000)"
        detail: "Sky directions in ICRS with an epoch, Cartesian vectors, and rotations to galactic and supergalactic. Done when the published Hipparcos galactic pole and centre and the Lahav 2000 pole and origin are reproduced (AC-34, AC-35)."
        state: active
      - key: 01a19f58-5775-7658-b272-327b62f49d66
        at: 2026-11-03T02:58:49Z
        revision: 4
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Frames and positions: ICRS, galactic (Hipparcos), supergalactic (Lahav 2000)"
        detail: "Done in `position.rs`. The Hipparcos matrix is orthonormal to 1e-9 and puts the NGP at b = 90°. The Lahav 2000 pole and origin are exact. M31 and the Galactic centre agree with astropy 8.0.2 to 1e-4°, the FK5-versus-ICRS gap in astropy's galactic frame."
        state: done
  - key: 01a19f51-6de0-7249-8001-847b64639487
    id: w1-t4-cosmology
    kind: task
    versions:
      - key: 01a19f51-6de0-7249-8001-84854a4104d4
        at: 2026-11-03T02:51:16Z
        revision: 1
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Flat ΛCDM cosmology and comoving distance"
        detail: "Planck 2018 (H0 67.66, Ωm 0.3111), comoving distance by integration, and its inverse. Done when tests match astropy references (same model to 1e-6, the full Planck18 with radiation and neutrinos to 0.1%) and z → D_C → z round-trips."
        state: open
      - key: 01a19f58-5775-7658-b272-327c98b7f270
        at: 2026-11-03T02:58:49Z
        revision: 4
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Flat ΛCDM cosmology and comoving distance"
        detail: "Done in `cosmology.rs`. Simpson's rule with 256 intervals matches astropy's same model to 1e-6 at z = 0.01 to 3, and the full Planck18 model to 0.1%. A safeguarded Newton inverse round-trips to 1e-9 from z = 0 to 7.5."
        state: done
  - key: 01a19f51-6de0-7249-8001-847c72bfad7d
    id: w1-t5-redshift
    kind: task
    versions:
      - key: 01a19f51-6de0-7249-8001-8486c73b0847
        at: 2026-11-03T02:51:16Z
        revision: 1
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Redshifts and the CMB frame"
        detail: "A redshift keeps its published frame, and the CMB-frame value is derived with the Planck 2018 dipole and records what it came from. Done when cz toward the apex rises by 369.82 km/s, falls away from it and is unchanged at 90° (AC-46, AC-47, AC-48)."
        state: open
      - key: 01a19f58-5775-7658-b272-327d0a13a899
        at: 2026-11-03T02:58:49Z
        revision: 4
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Redshifts and the CMB frame"
        detail: "Done in `redshift.rs`: 1 + z_cmb = (1 + z_hel) γ (1 + β cos θ). At z = 0.01, cz rises by (1 + z) × 369.82 toward the apex and falls by the same away from it. At 90° only the 0.23 km/s transverse Doppler term remains, a refinement of \"unchanged\"."
        state: done
  - key: 01a19f51-6de0-7249-8001-847dd2b147ac
    id: w1-t6-geometry
    kind: task
    versions:
      - key: 01a19f51-6de0-7249-8001-8487beaaf911
        at: 2026-11-03T02:51:16Z
        revision: 1
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Geometry kinds and bounding boxes"
        detail: "Point, ray, range, primitives (sphere, ellipsoid, oriented box), path, member list, MOC sky region and volume grid, each with an axis-aligned bounding box in any frame where it has a finite extent. Done when the box tests pass, including rotated ellipsoids and boxes."
        state: open
      - key: 01a19f58-68b0-714a-9a97-183bf6a911b3
        at: 2026-11-03T02:58:53Z
        revision: 5
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Geometry kinds and bounding boxes"
        detail: "Done in `geometry.rs`. All 8 kinds have a box. A ray carries its reach. A sky region is boxed by the sphere of its far distance, which is conservative (follow-up: a tighter cone box). A member list boxes its tracers plus the members a resolver can place. Rotated ellipsoids and boxes are bounded tightly."
        state: done
  - key: 01a19f51-6de0-7249-8001-847eee2d441b
    id: w1-t7-ids
    kind: task
    versions:
