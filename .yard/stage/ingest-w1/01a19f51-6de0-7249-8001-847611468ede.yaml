        title: "Values, kinds of value, typed uncertainty and units"
        detail: "A quantity with its unit and typed uncertainty (symmetric, asymmetric, upper or lower limit, credible region, none reported) and a kind of value. Unit conversion keeps the native value beside the normalized one and scales uncertainties. Done when unit tests cover conversion, refusal across dimensions and none-reported staying none."
