        title: "Ids and designations"
        detail: "Object ids, source ids (validated slugs) and designations. Done when malformed source ids are refused."
        state: open
      - key: 01a19f58-68b0-714a-9a97-183c8bc44e76
        at: 2026-11-03T02:58:53Z
        revision: 5
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Ids and designations"
        detail: "Done in `ids.rs`. Object ids run from 1 to 2^53 − 1, so they stay exact in TypeScript. Source ids are slugs, checked on deserialization too. A designation keeps its source."
        state: done
