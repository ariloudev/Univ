          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Values, kinds of value, typed uncertainty and units"
        detail: "Done in `value.rs` and `units.rs`. Unit conversion stays within a dimension, h⁻¹ Mpc is kept apart from Mpc, and a value with no reported uncertainty never becomes zero. 7 tests."
        state: done
  - key: 01a19f51-6de0-7249-8001-84791dec874c
    id: w1-t2-distance
    kind: task
    versions:
      - key: 01a19f51-6de0-7249-8001-8483a390760e
        at: 2026-11-03T02:51:16Z
        revision: 1
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Distances: kinds, methods, Hubble constant, distance modulus"
        detail: "A distance record with its kind, method and the H0 or h it was published for. A modulus becomes a distance with its propagated error while the modulus is kept, and a rescale to another H0 keeps the native value. Done when tests cover the modulus at 10 pc and h-rescaling both ways."
        state: open
      - key: 01a19f51-7859-754d-a716-813e4fc7b38c
        at: 2026-11-03T02:51:19Z
        revision: 2
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Distances: kinds, methods, Hubble constant, distance modulus"
        detail: "A distance record with its kind, method and the H0 or h it was published for. A modulus becomes a distance with its propagated error while the modulus is kept, and a rescale to another H0 keeps the native value. Done when tests cover the modulus at 10 pc and h-rescaling both ways."
        state: active
      - key: 01a19f57-e2e2-7741-98d8-9529bc9af6be
        at: 2026-11-03T02:58:19Z
        revision: 3
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Distances: kinds, methods, Hubble constant, distance modulus"
        detail: |-
          Done in `distance.rs`:
          - a modulus of 0 gives 10 pc;
          - M31's modulus of 24.47 gives 783 kpc (McConnachie 2012), with the asymmetric error wider on the far side;
          - h⁻¹ Mpc converts to Mpc, and H0 rescaling round-trips.
        state: done
  - key: 01a19f51-6de0-7249-8001-847af01eb3b2
    id: w1-t3-frames
    kind: task
    versions:
