        detail: "Each point keeps its colour from the tile; a per-point colour attribute: stars in their temperature colour or grey, other points by kind of value. Done when the batch and colour-buffer unit tests and `pnpm check` pass."
        state: open
      - key: 01a1a8b1-16e9-70e5-97e2-aa56ef65ff9c
        at: 2026-11-04T22:32:20Z
        revision: 5
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Draw stars in their colours"
        detail: |-
          Each batch now carries per-point RGBA bytes:
          - a star's colour from its colour index, or grey without one;
          - zero opacity for any point outside the stars domain.

          The renderer feeds the bytes to a normalized `a_colour` attribute. The shader uses a point's own colour where it has one, and its kind's colour otherwise. Markers upload zeros.

          The batch keeps each colour index and its bands for the hover label. Tested on the fixture tiles: each star's bytes are its colour index's colour, and cosmic-web points have none.
        state: done
