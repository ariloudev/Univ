        title: "Trace, reviews, gate, integration, close, merge"
        detail: |-
          **Reviews:** `/simplify` (four reviewers) and `/code-review` (ten findings). Fixed in `69eab61`:
          - The panel estimates a class from the index the star is drawn by, in ingest's order, and marks a derived index.
