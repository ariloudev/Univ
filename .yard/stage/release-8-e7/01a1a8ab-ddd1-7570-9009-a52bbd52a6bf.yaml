        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Approve E7's spec change: stars in their colours"
        markdown: |-
          **Draw the catalogues**
          - A new requirement: each star is drawn in the colour of the temperature its colour index gives, grey where it has none. Four criteria:
            - BP−RP or B−V gives Teff along Pecaut & Mamajek's 2013 dwarf sequence, and Teff gives a black body's colour under the CIE 1931 observer;
            - a colour index beyond the sequence is clamped to its end;
            - a star with no colour index is drawn neutral grey;
            - the key shows the colours in kelvin and counts the coloured and grey stars.
          - The kind-of-value colours now apply to points outside the stars domain only.

          **Read an object**
          - Four new panel criteria:
            - each published spectral type, with its source and kind of value;
            - each colour index, with its bands and uncertainty;
            - where no real spectral type is published, the class the colour index suggests, labelled as estimated for a main-sequence star and citing Pecaut & Mamajek;
            - the papers of a researched entry.

          **Product summary:** amended to say stars are coloured by temperature.

          **What to look at:** the estimated class assumes a main-sequence star. For a giant such as Betelgeuse, its own published type (M1–M2 Ia–ab) is what the panel shows, since a type is published, and the colour still follows its colour index. The colour is a temperature estimate along the dwarf sequence. Where the dwarf sequence ends (M9.5V, about 2,300 K, and O3V, about 44,900 K), the clamp gives the end colour.
