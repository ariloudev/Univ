        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "starColour module"
        detail: |-
          `scene/dwarfSequence.ts` holds Mamajek's dwarf sequence, version 2022.04.16 (Pecaut & Mamajek 2013), 87 rows with B−V or BP−RP, with its URL and citation.

          `scene/starColour.ts` turns a colour index into a temperature:
          - interpolated in log Teff along each column while it rises (B−V to M9V, BP−RP to M8.5V);
          - an index beyond the sequence is clamped to the end and says so.

          It then turns the temperature into an sRGB colour:
          - Planck's spectrum integrated against the CIE 1931 fit of Wyman, Sloan & Shirley 2013, whose coefficients were checked against the paper's Table 1 and Listing 1;
          - XYZ to sRGB (IEC 61966-2-1), scaled to the brightest channel;
          - cached by colour index.

          11 tests pass: the Sun's B−V gives 5,770 K and G2V, B−V 1.50 gives about 3,600 K (M1.5–M2V), B−V −0.30 is over 25,000 K, the clamps hold, and hot is bluer than cool.
        state: done
