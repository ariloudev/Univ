          - The key says BP−RP stops at B9V.
          - Star colours apply only where the manifest lists bands.
          - Star data is held only for star tiles.
          - Colours come from a cache with an integer key.
          - No zero buffers are uploaded.
          - Duplicate helpers are merged.
          - A paper with no bibcode or DOI is listed cleanly.

          **Skipped:**
          - a preferred colour index published by the server (an ingest and server change);
          - a manifest field naming how a domain is coloured (ingest);
          - a hot-star BP−RP calibration beyond B9V (needs another paper).

          **Gate:** `cargo xtask check` passed (13 gates), and `cargo xtask integration` passed (7 Playwright tests).
