        title: "E7 produced stars drawn in the colour of their temperature"
        markdown: |-
          **What the explorer does now:**
          - It draws each star in the colour its colour index gives, along Pecaut & Mamajek's dwarf sequence and the CIE 1931 observer; stars without an index are grey.
          - The key shows the colours in kelvin and counts the coloured and grey stars.
          - The object panel gives the published spectral types, each colour index (marking a derived one), a class estimated from the colour index where no type is published, and the papers of a researched distance.

          **Known limits:**
          - The colours are observed, not corrected for reddening.
          - Gaia's BP−RP sequence stops at B9V, so the hottest stars coloured by BP−RP draw at about 10,700 K.
          - A name a star file gives is not yet found by search.

          **Next:** E8, choose what is drawn.
        tone: success
