        detail: |-
          The panel gains a "Spectral type and colour" section:
          - each published type, with its kind of value and source;
          - each colour index, with its bands and uncertainty;
          - where no source gives a type (Gaia's "unknown" counts as none), the class estimated from BP−RP or B−V, labelled as for a main-sequence star and citing Pecaut & Mamajek.

          It also gains "Papers of the researched values", each with its bibcode or DOI.

          BETELGEUSE (cut from release 9) and an untyped SIMULATED star are added as fixtures. Three new panel tests pass, and `pnpm check` passes (176 tests, fallow, build).
