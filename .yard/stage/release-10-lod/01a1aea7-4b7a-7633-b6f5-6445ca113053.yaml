  - key: 01a1aead-8570-71d4-bf45-524aabbc30aa
    id: lod-review
    kind: note
    versions:
      - key: 01a1aead-8570-71d4-bf45-524cebdd7d75
        at: 2026-11-06T02:26:09Z
        revision: 3
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "/simplify and /code-review"
        markdown: |-
          **Fixed**

          | Finding | Fix |
          |---|---|
          | Flicker at the view's edge: a tile straddling a side plane went in and out with each 0.1° turn (12 tiles a turn once the test looked off-centre) | A held tile counts as in view to 1° beyond the edge (`HELD_VIEW_MARGIN`) |
          | A held family lost its preference as soon as one tile in view was not held | Preferred while it holds any tile in view |
          | Keep spacing judged over children out of view too | Judged over the children in view, as the preference is |
          | The turn test could not catch edge flicker (the cloud sat inside the field of view) | Turns about an off-centre focus; also checks a 30° turn still moves tiles |
          | `wanted()` and `Family.size` docs stale | Rewritten |
          | Test helpers copied; the held check written twice; `drawn` rebuilt every round | One test file on shared helpers (`children`, `simulatedCatalogue`); one `holds()`; `drawn` kept up to date |

          Each of the four rules has a test that fails without it.

          **Skipped, with reason**

          - Resting tiles (a failed read waiting to be asked again) count as held, since the catalogue passes them as pending: they are asked again, and keeping their region steady meanwhile is what the fix is for.
          - Make-before-break (keep a dropped tile drawn until its replacement is): a real pan or zoom still shows a coarser region until new tiles land. It needs the budget split into a planning target and a hard cap, a spec change. A follow-up, not part of this fix.
        tone: info
