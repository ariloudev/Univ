                  "name": "D1",
                  "words": {
                    "after": "D1\n\nSQLite databases: the catalogue database of the releases, which holds their sources, structures and the object shard of each object id; the object shards, which hold objects, identities and the cell index; and the layers and keys.",
                    "before": "D1\n\nSQLite databases: objects, identities, the cell index, layers and keys."
