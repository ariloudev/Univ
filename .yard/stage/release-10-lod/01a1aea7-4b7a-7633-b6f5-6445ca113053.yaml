  - key: 01a1aea7-4b7a-7633-b6f5-6446fd61e65e
    id: lod-cause
    kind: note
    versions:
      - key: 01a1aea7-4b7a-7633-b6f5-644bce92bd1f
        at: 2026-11-06T02:19:21Z
        revision: 1
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "The cause"
        markdown: |-
          The owner saw regions appear and vanish between two steps of a camera move on release 10. Not z-fighting: nothing depth-tests.

          The tile plan (`clients/explorer/src/catalogue/lod.ts`) has no hysteresis. With the budget of 3,000,000 points full (release 10 holds 36.9 M cosmic-web points), a small move changes which families of tiles are wanted:

          - a node near the 3 px refine spacing flips between refined and not;
          - the families' order by size on screen changes, and the budget takes another of nearly the same size.

          What is no longer wanted is dropped at once, so the region falls back to its coarser parent until the new tiles arrive.

          **Reproduced** on a simulated octree (10,729 tiles, budget full): turning the view 0.1° and back dropped and fetched 9 tiles on every move, without end.
        tone: warning
