        title: "The loaders record the fingerprints before the stamp"
        detail: "`fingerprints::Recorder` measures each table as the builds (after the rows not valid are dropped) or each local D1 file hold it, before the loader takes shared rows as the release's own; the measures go into `science_fingerprints` and `science_contents` in the scratch database, which the check compares with the manifest. Tests: the altered-row test alters the SQL before the load; the change test asserts objects.release totals release 1's and the terms digest is release 1's."
        state: done
        type: fix
