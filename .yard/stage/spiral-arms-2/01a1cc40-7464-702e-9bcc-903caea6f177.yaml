                  "name": "See the Galaxy's arms face-on",
                  "words": {
                    "after": "See the Galaxy's arms face-on\n\nLooking down on the Milky Way's disk to see its spiral arms: the young tracers that lie along them\nwithin a few kiloparsecs of the Sun, and the Reid et al. 2019 model of the arms over the whole\ndisk. The stars of the stars domain are hidden in this view, since millions of overlapping stars\naround the Sun drown the tracers, and the old tracers, RR Lyrae stars and globular clusters, belong\nto the halo and the bulge rather than to the arms.\n\nThe Galactic Centre lies 8.15 kpc from the Sun toward l = 0°, b = 0°, the distance Reid et al.\n2019 adopt (ApJ 885, 131, Table 3, fit A5) and fit their arms with, so that the model arms and the\nview share one centre."
                  }
