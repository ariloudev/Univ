        title: "T10. Pole-safe camera and the arms view's camera"
        detail: "eyeAxes takes its right as [−sin yaw, cos yaw, 0], the same as before off the pole and defined at it; flights now turn the eye too, the short way round; scene/armsView.ts places the focus 4.075 kpc toward l = 0 (half Reid 2019's cited R0) and the eye above the north Galactic pole, far enough that every point within 16 kpc of the Galactic Centre is in view on wide and tall screens; the controller flies there in galactic axes, or jumps for reduced motion; an Arms control sits beside Return to Earth. Vitest covers the projection (Sun above the centre, l = 90° to the right), the pole, the flight and the rail."
        state: done
