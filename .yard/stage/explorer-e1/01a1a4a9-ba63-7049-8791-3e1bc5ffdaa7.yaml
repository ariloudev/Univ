        title: "What E1 produced"
        markdown: |-
          The explorer draws release 7 in full: 2,085,809 points from the stars, nearby-galaxies and cosmic-web domains, around Earth in galactic, equatorial or supergalactic axes.

          **Navigation:** the mouse turns, zooms from 0.1 pc to 20 Gpc, pans, and returns to Earth.

          **Panels:**
          - a key counts each kind of value;
          - credits list every source of the drawn domains;
          - a statement names the frame, origin, units and cosmology.

          **Seen live:**
          - the rectangular density steps at kpc scale are the redshift surveys' footprints in perspective, not loading artefacts;
          - at 13 Gpc the dense surveys still sum to a bright disc. Tone mapping is noted for E3 polish.

          **Next, E2:** picking and the object panel, search, and structures.
        tone: success
