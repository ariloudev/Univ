      - key: 01a1a4bd-6856-76d9-9284-b1e7ebba1653
        at: 2026-11-04T04:07:18Z
        revision: 3
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Fix E1's review findings"
        detail: |-
          Fixed in `ea34b4d`.

          **From code review:**
          - a cancelled drag now ends;
          - a tile that could not be read is retried, then counted as unread rather than as failing its check;
          - the frame named is always the frame drawn: equatorial until the rotations arrive;
          - kinds use one fixed order;
          - the axes control follows the view at once.

          **From simplify:**
          - manifests are checked as read, with no casts;
          - buffers are freed, uniform locations cached, and the eye computed once per frame;
          - the context is released once its canvas is gone;
          - the overlay and panels update only on frames that are drawn;
          - the catalogue flattens its tiles once;
          - typed listeners;
          - one shared fixture loader;
          - panel and pointer tests added.

          **Skipped, with reasons:**
          - columnar decode in a Worker: loading already finishes in about 8 s;
          - packing all tiles into a few buffers: no measured draw-call cost;
          - a separate tsconfig for the decoder: `getUint8` removed the type hack instead;
          - a general list of derived lines: the ring is the only one;
          - vitest projects: two files need Node's crypto;
          - hover, click and double-click hooks: kept for E2.
        state: done
