                  "key": "01a1b7d8-3f35-70aa-853f-45a936e8825f",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each designation in the response gives the identifier as its source publishes it, and in its catalogue's form where the source's definition gives one.",
