                  "key": "01a1b7d8-3f35-70aa-853f-45aceeef58a0",
                  "kind": "criterion",
                  "label": null,
                  "name": "A designation in its catalogue's form, such as HIP 32754, resolves as a name does.",
                  "parent": "01a19f1e-d177-716d-b124-3d16ab310032"
                },
                {
                  "change": null,
                  "key": "01a19f1e-d177-716d-b124-3d23daf70123",
                  "kind": "feature",
                  "label": "F-16",
                  "name": "Read a source",
