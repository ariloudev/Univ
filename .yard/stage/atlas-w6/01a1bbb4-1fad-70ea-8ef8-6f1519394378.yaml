        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        view: spec-change
        note: |-
          One new requirement under frame-the-view-as-an-atlas, and three criteria reworded:

          - **Shared steps:** the two tick criteria now space a coordinate's ticks at one step on both its edges. Today top and bottom choose their steps alone, so they can disagree (10° on one, 15° on the other), and no single set of grid lines could meet both. The finest step that keeps both edges' labels 60 px apart is shared. A step of 90° is a multiple of every other, so some step always fits both.
          - **The grid's switch** sits in the top bar beside the axes.
