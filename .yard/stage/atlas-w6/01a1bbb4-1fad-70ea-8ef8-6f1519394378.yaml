        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "The sky graticule's spec"
        markdown: |-
          Approve the change above to frame-the-view-as-an-atlas:

          - **A new state-driven requirement:** while the grid is on, the view draws its lines of sight along the round longitudes and latitudes its edges mark, in the chosen axes.
          - **Eight criteria:**
            - the switch beside the axes;
            - off by default, and kept in the address when on;
            - every tick lies on a line;
            - the lines are directions, which turn with the view and stay still while the eye flies or zooms;
            - meridians stop at ±80°, except those at multiples of 90° or 6 h;
            - the equator is heavier, and every line is fainter than the neat line;
            - the grid takes no pointer events.
          - **Reworded:** the two tick-step criteria now share one step across a coordinate's two edges, and the top-bar criterion names the grid's switch.

          What to look at: the shared step. When you look up toward a pole, the top edge's meridians crowd together, so the bottom edge's ticks coarsen to match (for example, 15° instead of 5°).
