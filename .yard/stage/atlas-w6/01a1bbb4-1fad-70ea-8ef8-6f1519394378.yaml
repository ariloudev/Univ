                },
                {
                  "change": null,
                  "key": "01a19f1e-d177-716d-b124-3d24f2c252fc",
                  "kind": "requirement",
                  "label": "RQ-56",
                  "name": "When a client requests a source, Univ Server shall return its citation, terms of use, required credit, provider, query, cuts and coverage.",
                  "parent": "01a19f1e-d177-716d-b124-3d23daf70123"
                },
                {
                  "change": "added",
                  "key": "01a1b7dc-04ef-7334-abc7-37ec41787dde",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response says whether the source's terms require data adapted from it to be shared under the same licence.",
                  "parent": "01a19f1e-d177-716d-b124-3d24f2c252fc"
                },
                {
                  "change": "added",
                  "key": "01a1b7d8-3f35-70aa-853f-45ad166959ce",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response gives the source's designation form with its citation, where its definition gives one.",
                  "parent": "01a19f1e-d177-716d-b124-3d24f2c252fc"
                },
                {
                  "change": "added",
                  "key": "01a1b7d8-3f35-70aa-853f-45ae96a7f9df",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response gives the meaning of each value of each of the source's flags with its citation, where its definition gives them.",
                  "parent": "01a19f1e-d177-716d-b124-3d24f2c252fc"
                },
                {
                  "change": null,
                  "key": "01a1a497-e843-728a-bce8-3ffb8e7533cb",
                  "kind": "product",
                  "label": "P-3",
                  "name": "Univ Explorer",
                  "parent": null
                },
                {
                  "change": null,
                  "key": "01a1a497-e843-728a-bce8-3ffc32e7ed9d",
                  "kind": "feature_group",
                  "label": "FG-12",
                  "name": "The view",
                  "parent": "01a1a497-e843-728a-bce8-3ffb8e7533cb"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b101c9b9b10c",
                  "kind": "feature",
                  "label": null,
                  "name": "Frame the view as an atlas",
                  "parent": "01a1a497-e843-728a-bce8-3ffc32e7ed9d"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b10246def191",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Explorer shall mark the edges of the view with the directions of sight through them, in the axes the view is drawn in.",
                  "parent": "01a1b7d7-c032-73ad-803e-b101c9b9b10c"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b103f2a0c853",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each edge of the view carries a tick where the direction of sight through it crosses a round longitude or latitude of the chosen axes.",
                  "parent": "01a1b7d7-c032-73ad-803e-b10246def191"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b10435170cb6",
                  "kind": "criterion",
                  "label": null,
                  "name": "The ticks of a coordinate other than right ascension are spaced, on both its edges, at the finest step of 90, 30, 15, 10, 5, 2 or 1 degrees, or a tenth or hundredth of one, that keeps their labels at least 60 CSS pixels apart on each.",
                  "parent": "01a1b7d7-c032-73ad-803e-b10246def191"
                },
                {
                  "change": "added",
                  "key": "01a1b863-1a09-757d-bbd7-6f0d72803e9a",
                  "kind": "criterion",
                  "label": null,
                  "name": "The ticks of right ascension are spaced, on both its edges, at the finest step of 6, 2 or 1 hours, 30, 20, 10, 5, 2 or 1 minutes, or a tenth or hundredth of a minute, that keeps their labels at least 60 CSS pixels apart on each.",
                  "parent": "01a1b7d7-c032-73ad-803e-b10246def191"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b105558be2c4",
                  "kind": "criterion",
                  "label": null,
                  "name": "A tick of equatorial right ascension is labelled in hours and minutes, and every other tick in degrees.",
                  "parent": "01a1b7d7-c032-73ad-803e-b10246def191"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b106cab43cde",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each edge names the coordinate its ticks give, such as galactic longitude.",
                  "parent": "01a1b7d7-c032-73ad-803e-b10246def191"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b107f30dda23",
                  "kind": "criterion",
                  "label": null,
                  "name": "The ticks follow the view as it turns, zooms and moves, and as the axes are changed.",
                  "parent": "01a1b7d7-c032-73ad-803e-b10246def191"
                },
                {
                  "change": "added",
                  "key": "01a1b7f5-f51b-71f9-80de-cd23746b3fab",
                  "kind": "criterion",
                  "label": null,
                  "name": "The ticks and their labels are drawn just inside the view's edge, taking no width or height from the view.",
                  "parent": "01a1b7d7-c032-73ad-803e-b10246def191"
                },
                {
                  "change": "added",
                  "key": "01a1bbb4-503d-7416-9488-04fa6b93a838",
                  "kind": "requirement",
                  "label": null,
                  "name": "While the person has turned the grid on, Univ Explorer shall draw across the view the lines of sight along the round longitudes and latitudes its edges mark, in the axes the view is drawn in.",
                  "parent": "01a1b7d7-c032-73ad-803e-b101c9b9b10c"
                },
                {
                  "change": "added",
                  "key": "01a1bbb4-503d-7416-9488-04fb4ff5b352",
                  "kind": "criterion",
                  "label": null,
                  "name": "A switch beside the axes in the top bar turns the grid on and off.",
                  "parent": "01a1bbb4-503d-7416-9488-04fa6b93a838"
                },
                {
                  "change": "added",
                  "key": "01a1bbb4-503d-7416-9488-04fcf6a73520",
                  "kind": "criterion",
                  "label": null,
                  "name": "The grid is off when the view opens on an address that does not turn it on.",
                  "parent": "01a1bbb4-503d-7416-9488-04fa6b93a838"
                },
                {
                  "change": "added",
                  "key": "01a1bbb4-503d-7416-9488-04fd03559559",
                  "kind": "criterion",
                  "label": null,
                  "name": "The page's address keeps the grid turned on, so that a reload or a shared link keeps it on.",
                  "parent": "01a1bbb4-503d-7416-9488-04fa6b93a838"
                },
                {
                  "change": "added",
                  "key": "01a1bbb4-503d-7416-9488-04fe7cd7893c",
                  "kind": "criterion",
                  "label": null,
                  "name": "The grid draws a line along each multiple of the steps the edges' ticks are spaced at, so that every tick lies on one of its lines.",
                  "parent": "01a1bbb4-503d-7416-9488-04fa6b93a838"
                },
                {
                  "change": "added",
                  "key": "01a1bbb4-503d-7416-9488-04ff805e7421",
                  "kind": "criterion",
                  "label": null,
                  "name": "The grid's lines are directions of sight: they turn with the view and change with the axes, and stay still while the eye moves or zooms.",
                  "parent": "01a1bbb4-503d-7416-9488-04fa6b93a838"
                },
                {
                  "change": "added",
                  "key": "01a1bbb4-503d-7416-9488-0500d68ce364",
                  "kind": "criterion",
                  "label": null,
                  "name": "A line of longitude other than one at a multiple of 90 degrees, or of 6 hours of right ascension, stops at 80 degrees of latitude north and south.",
                  "parent": "01a1bbb4-503d-7416-9488-04fa6b93a838"
                },
                {
                  "change": "added",
                  "key": "01a1bbb4-503d-7416-9488-0501d8ee5c20",
                  "kind": "criterion",
                  "label": null,
                  "name": "The axes' equator is drawn heavier than the grid's other lines, and every line of the grid is drawn thinner and fainter than the neat line.",
                  "parent": "01a1bbb4-503d-7416-9488-04fa6b93a838"
                },
                {
                  "change": "added",
                  "key": "01a1bbb4-503d-7416-9488-0502db0af966",
                  "kind": "criterion",
                  "label": null,
                  "name": "The grid takes no pointer events: the points under it are named and chosen as where it is off.",
                  "parent": "01a1bbb4-503d-7416-9488-04fa6b93a838"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b108ccec8a0c",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Explorer shall give the view as much of the window as its controls leave, keeping its panels on a rail and in bars about it.",
                  "parent": "01a1b7d7-c032-73ad-803e-b101c9b9b10c"
                },
                {
                  "change": "added",
                  "key": "01a1b7f5-f51b-71f9-80de-cd24519fb4d6",
                  "kind": "criterion",
                  "label": null,
                  "name": "The top bar holds the release, the eye's distance from the focus with the axes and the grid's switch, the search and the level-of-detail switch, in one line no taller than 40 CSS pixels.",
                  "parent": "01a1b7d7-c032-73ad-803e-b108ccec8a0c"
                },
                {
                  "change": "added",
                  "key": "01a1b7f5-f51b-71f9-80de-cd251f348c42",
                  "kind": "criterion",
                  "label": null,
                  "name": "A rail along the left edge, no wider than 52 CSS pixels, opens the view's controls, the groups of what is drawn and the list of structures, each as a drawer, and holds the button that returns to Earth.",
                  "parent": "01a1b7d7-c032-73ad-803e-b108ccec8a0c"
                },
                {
                  "change": "added",
                  "key": "01a1b7f5-f51b-71f9-80de-cd2646cc3c6c",
                  "kind": "criterion",
                  "label": null,
                  "name": "An open drawer narrows the view rather than covering it, and its rail button closes it again.",
                  "parent": "01a1b7d7-c032-73ad-803e-b108ccec8a0c"
                },
                {
                  "change": "added",
                  "key": "01a1b7f5-f51b-71f9-80de-cd2773cf8abe",
                  "kind": "criterion",
                  "label": null,
                  "name": "The record of the chosen object or structure is shown in the right margin only while one is chosen, and folds to the window's edge when asked.",
                  "parent": "01a1b7d7-c032-73ad-803e-b108ccec8a0c"
                },
                {
                  "change": "added",
                  "key": "01a1b7f5-f51b-71f9-80de-cd28fdfc1b1d",
                  "kind": "criterion",
                  "label": null,
                  "name": "The bottom bar holds the scale, the key and the credits in one line no taller than 30 CSS pixels.",
                  "parent": "01a1b7d7-c032-73ad-803e-b108ccec8a0c"
                },
                {
                  "change": "added",
                  "key": "01a1b7f5-f51b-71f9-80de-cd296b50d30d",
                  "kind": "criterion",
                  "label": null,
                  "name": "On a window narrower than 1,024 CSS pixels, a drawer and the record open over the view and close again.",
                  "parent": "01a1b7d7-c032-73ad-803e-b108ccec8a0c"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b10ec3cb74b8",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Explorer shall draw a scale of the view at the distance of its focus.",
                  "parent": "01a1b7d7-c032-73ad-803e-b101c9b9b10c"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b10fa8776879",
                  "kind": "criterion",
                  "label": null,
                  "name": "The scale is a bar of a round length, 1, 2 or 5 times a power of ten of parsecs, kiloparsecs or megaparsecs, between 60 and 160 CSS pixels long at the focus's distance.",
                  "parent": "01a1b7d7-c032-73ad-803e-b10ec3cb74b8"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b11043cf39a0",
                  "kind": "criterion",
                  "label": null,
                  "name": "The scale is labelled with its length and its unit, and changes with the eye's distance from the focus.",
                  "parent": "01a1b7d7-c032-73ad-803e-b10ec3cb74b8"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b11163a65264",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Explorer shall name structures and objects as atlases name areas and points.",
                  "parent": "01a1b7d7-c032-73ad-803e-b101c9b9b10c"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b1129a75edd3",
                  "kind": "criterion",
                  "label": null,
                  "name": "Structures are named in italic type, in the view, in their list and in their panel.",
                  "parent": "01a1b7d7-c032-73ad-803e-b11163a65264"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b11383d20219",
                  "kind": "criterion",
                  "label": null,
                  "name": "Objects are named in upright type, in the hover label and in their panel.",
                  "parent": "01a1b7d7-c032-73ad-803e-b11163a65264"
                },
                {
                  "change": null,
                  "key": "01a1a497-e843-728a-bce8-3ffdfd7a2e54",
                  "kind": "feature_group",
                  "label": "FG-13",
                  "name": "Objects and structures",
                  "parent": "01a1a497-e843-728a-bce8-3ffb8e7533cb"
                },
                {
                  "change": null,
                  "key": "01a1a497-e843-728a-bce8-3fe32aecd7d3",
                  "kind": "feature",
                  "label": "F-38",
                  "name": "Read an object",
                  "parent": "01a1a497-e843-728a-bce8-3ffdfd7a2e54"
                },
                {
                  "change": null,
                  "key": "01a1a497-e843-728a-bce8-3fe4680b13fa",
                  "kind": "requirement",
                  "label": "RQ-138",
                  "name": "When the pointer rests on a drawn point, Univ Explorer shall name the object it stands for.",
                  "parent": "01a1a497-e843-728a-bce8-3fe32aecd7d3"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b0f94a6148dc",
                  "kind": "criterion",
                  "label": null,
                  "name": "Once the pointer has rested on the point for 0.3 seconds, the label gives the object's name or first designation, read from its record, in place of its id.",
                  "parent": "01a1a497-e843-728a-bce8-3fe4680b13fa"
                },
                {
                  "change": null,
                  "key": "01a1a497-e843-728a-bce8-3fe654d91c29",
                  "kind": "requirement",
                  "label": "RQ-139",
                  "name": "When the person clicks a drawn point, Univ Explorer shall show the object's record that Univ Server gives.",
                  "parent": "01a1a497-e843-728a-bce8-3fe32aecd7d3"
                },
                {
                  "change": "changed",
                  "key": "01a1a6b2-b217-764e-93d0-da89ee4e3c67",
                  "kind": "criterion",
                  "label": "AC-392",
                  "name": "The panel is headed by the object's name: the name it was found by, or else the first proper name its sources give, or else the first designation of its record, in its catalogue's form, with its id beside it.",
                  "parent": "01a1a497-e843-728a-bce8-3fe654d91c29"
                },
                {
                  "change": "changed",
                  "key": "01a1a497-e843-728a-bce8-3fe7201a1670",
                  "kind": "criterion",
                  "label": "AC-394",
                  "name": "The panel gives the object's names and designations, each designation in its catalogue's form, each with the title of its source, and a name or designation that more than one source gives, or a designation that reads as one of the names, once, with all of them.",
                  "parent": "01a1a497-e843-728a-bce8-3fe654d91c29"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b0fa7a60e532",
                  "kind": "criterion",
                  "label": null,
                  "name": "The panel gives the object's position on the sky as right ascension and declination and as galactic longitude and latitude, with the frame and epoch of each.",
                  "parent": "01a1a497-e843-728a-bce8-3fe654d91c29"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b0fb367dbf6d",
                  "kind": "criterion",
                  "label": null,
                  "name": "The panel gives each magnitude of the object with its band, its uncertainty, its kind of value and its source.",
                  "parent": "01a1a497-e843-728a-bce8-3fe654d91c29"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b0fc825b2931",
                  "kind": "criterion",
                  "label": null,
                  "name": "The panel gives the object's proper motion, radial velocity and redshift where its sources publish them, each with its uncertainty, kind of value and source.",
                  "parent": "01a1a497-e843-728a-bce8-3fe654d91c29"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b0fdf7abeef3",
                  "kind": "criterion",
                  "label": null,
                  "name": "The panel names each group the object is a member of, and each member of a group the object is, each of which can be chosen.",
                  "parent": "01a1a497-e843-728a-bce8-3fe654d91c29"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b0fe29efa362",
                  "kind": "criterion",
                  "label": null,
                  "name": "The panel names each structure of the release whose published shape holds the object's position exactly, each of which can be chosen.",
                  "parent": "01a1a497-e843-728a-bce8-3fe654d91c29"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b0ffeb6df712",
                  "kind": "criterion",
                  "label": null,
                  "name": "The panel gives each flag of each catalogue entry of the object with the meaning its source gives that value, or the value alone where its source gives none.",
                  "parent": "01a1a497-e843-728a-bce8-3fe654d91c29"
                },
                {
                  "change": "added",
                  "key": "01a1b7d7-c032-73ad-803e-b1003b3339be",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each value in the panel is marked with the symbol of its kind of value that the key shows.",
                  "parent": "01a1a497-e843-728a-bce8-3fe654d91c29"
                },
                {
                  "change": null,
                  "key": "01a1a497-e843-728a-bce8-3fef08e193da",
                  "kind": "feature",
                  "label": "F-39",
                  "name": "See the structures",
                  "parent": "01a1a497-e843-728a-bce8-3ffdfd7a2e54"
                },
                {
                  "change": null,
                  "key": "01a1a497-e843-728a-bce8-3ff084b48fab",
                  "kind": "requirement",
                  "label": "RQ-141",
                  "name": "Univ Explorer shall draw each structure of the release by its placed shape.",
                  "parent": "01a1a497-e843-728a-bce8-3fef08e193da"
                },
                {
                  "change": "added",
                  "key": "01a1b7a9-f2af-7290-9cdf-77a3c5b309a5",
                  "kind": "criterion",
                  "label": null,
                  "name": "An attractor or a repeller is drawn as its marker inside a sphere of a fixed size on the view, a symbol rather than its extent, with an arrow along each axis of its shape's frame, pointing in toward the marker for an attractor and out from it for a repeller, the way its reconstructed flow runs.",
                  "parent": "01a1a497-e843-728a-bce8-3ff084b48fab"
                },
                {
                  "change": "added",
                  "key": "01a1b7a9-f2af-7290-9cdf-77a431863fe1",
                  "kind": "criterion",
                  "label": null,
                  "name": "Attractors and repellers are drawn in colours of one family, apart from each other's and from every other kind's.",
                  "parent": "01a1a497-e843-728a-bce8-3ff084b48fab"
                },
                {
                  "change": null,
                  "key": "01a1a497-e843-728a-bce8-3ff56cfa0dc5",
                  "kind": "requirement",
                  "label": "RQ-142",
                  "name": "Univ Explorer shall name each drawn structure in the view.",
                  "parent": "01a1a497-e843-728a-bce8-3fef08e193da"
                },
                {
                  "change": "changed",
                  "key": "01a1a497-e843-728a-bce8-3ff67c685244",
                  "kind": "criterion",
                  "label": "AC-408",
                  "name": "Each structure's name is drawn at its centre, but an attractor's or a repeller's, which is drawn just below the reach of its symbol's arrows.",
                  "parent": "01a1a497-e843-728a-bce8-3ff56cfa0dc5"
                },
                {
                  "change": null,
                  "key": "01a1a497-e843-728a-bce8-3ff8d753cd12",
                  "kind": "requirement",
                  "label": "RQ-143",
                  "name": "When the person chooses a structure, in the view or from the list of structures, Univ Explorer shall show its record and fly to it.",
                  "parent": "01a1a497-e843-728a-bce8-3fef08e193da"
                },
                {
                  "change": "added",
                  "key": "01a1b7a9-f2af-7290-9cdf-77a50a274427",
                  "kind": "criterion",
                  "label": null,
                  "name": "The panel of an attractor or a repeller says that its sphere is a symbol of a fixed size on the view, not its extent, and that its arrows show the way its reconstructed flow runs.",
                  "parent": "01a1a497-e843-728a-bce8-3ff8d753cd12"
                },
                {
                  "change": null,
                  "key": "01a19f1e-d177-716d-b124-3ceccbdcd63e",
                  "kind": "component",
                  "label": "CMP-33",
                  "name": "Ingest pipeline",
                  "parent": null
                },
                {
                  "change": "changed",
