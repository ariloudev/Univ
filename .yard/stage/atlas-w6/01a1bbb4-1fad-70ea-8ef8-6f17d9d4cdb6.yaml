        title: "Ticks at a multiple of the finer edge's step"
        markdown: |-
          This replaces the shared step you approved, because the review showed it strips the labels from about one view in six.

          **The tick criteria now read:**
          > …the finest step … that keeps their labels at least 60 CSS pixels apart and is a multiple of any finer step the other edge of the coordinate takes.

          **The grid criterion now reads:**
          > The grid draws a line along each multiple of the finer of the steps the two edges of each coordinate are spaced at, so that every tick lies on one of its lines.

          What changes for you:
          - Near a pole, the crowded edge shows only its 90° ticks (or none), and the far edge keeps its 5° ones.
          - The grid follows the finer edge, so its lines can be closer than the coarser edge's ticks.

          The code and tests for this are written; I'll commit them once you approve.
