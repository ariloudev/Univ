        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "The review found a fault in the shared step"
        markdown: |-
          `/code-review` showed that a step shared by both edges of a coordinate costs far more than my example said:

          - **Labels lost:** near a pole, one edge fits only 90°, so the other edge and the grid fall to 90° too.
          - **Scale:** across 5,472 views, 16.5% (pitch 52–71°) lost almost every label on the far edge, and the grid drew only 4 meridians.

          The fix keeps every tick on a line without that loss. The edge that can take the finer step keeps it, and the grid's lines use it. The other edge takes the finest step that fits it and is a multiple of the finer one.

          - **Labels lost:** 0 of 9,600 views now lose labels.
          - **Coarser edges:** 647 of about 38,000 edges take a coarser multiple than they would alone, for example 30° beside 10°.

          **Also fixed, outside the spec:**
          - an edge whose only fitting step has no tick no longer sets the step;
          - a round value met exactly at a sample is no longer counted twice;
          - the `/simplify` cleanups, including a grid that samples only the lines within the view.
        tone: warning
