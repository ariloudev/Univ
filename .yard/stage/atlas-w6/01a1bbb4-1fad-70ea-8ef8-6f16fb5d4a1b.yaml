          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "A minor spec change: a meridian runs on to its tick"
        markdown: "The approved criteria clashed in one case. A meridian stops at 80°, but near a pole the top edge can mark 30° or 330° at about 82° of latitude (for example, galactic, looking up at 72°, 1280 × 800), and that tick would sit on no line. The stop criterion now reads *…stops at 80 degrees … unless an edge marks it farther on, where it runs on to that tick.* It is committed on its own (0b77b55) as a minor spec change, which is pre-approved, and a grid test covers that view."
        tone: warning
