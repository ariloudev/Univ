        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "What the build produced"
        markdown: |-
          - **Smooth edges, every line:** ribbons a pixel wider each side, their edge faded in the fragment shader by the distance across, interpolated straight across the view.
          - **Rings fade as they crowd:** each ring's ends carry the vector to the next ring; the line shader fades a line by how far apart its neighbours lie on the view, 6 down to 2 CSS pixels. Labels of faded rings are left out. Spokes carry no neighbour and never fade.
          - **Units:** ring distances in the largest unit they reach one of (800 kpc, 1.0 Mpc, 1.005 Gpc), sharing format.ts's units.
        tone: success
