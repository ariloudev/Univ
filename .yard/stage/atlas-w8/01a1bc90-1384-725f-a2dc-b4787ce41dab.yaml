        title: "Build plan: smooth lines and faded rings (W8, `stage/atlas-w8`)"
        markdown: |
          # Build plan: smooth lines and faded rings (W8, `stage/atlas-w8`)

          ## Context
          On release 12, the owner saw the far distance rings shimmer, crawl and look dashed near the horizon. They asked whether the explorer needs anisotropic filtering, and whether it has Z-fighting.

          It has neither problem:
          - **No Z-fighting:** the renderer has no depth buffer.
          - **No textures to filter:** every line is a flat-coloured ribbon (`scene/ribbon.ts`, `LINE_VERTEX` and `LINE_FRAGMENT` in `scene/shaders.ts`).

          The real causes:
          1. **Hard edges.** The ribbons are 1.5 device pixels wide (`LINE_WIDTH` in `scene/kinds.ts`), and the context has `antialias: false`. Each pixel is either fully lit or not, so thin angled lines break into dashes and crawl as the view moves.
          2. **Crowding.** At a shallow angle, rings 200 kpc apart out to 14 Mpc land under a pixel apart. They add up under the additive blending into a moiré band.

          The owner agreed to three changes:
          - smooth line edges;
          - fading of crowded rings;
          - large ring distances written in the next unit ("14.2 Mpc", not "14,200 kpc").

          **Spec:** the new criterion `01a1bc8f-ef0a-7540-a283-8bf654031f2c` is committed (7720a30). It reads: "A ring fades where the next ring lies fewer than 6 CSS pixels from it on the view and is not drawn where it lies fewer than 2, and a ring's label is left out where the ring has faded…". The smoothing and the label units need no spec change. The existing criterion "labelled with its distance" still holds.

          ## Steps

          ### 1. Smooth line edges, for every line (`scene/shaders.ts`, `scene/renderer.ts`)
          - **`LINE_VERTEX`:**
            - Widen each ribbon by one device pixel on each side (`half = 0.5 * u_width + 1.0`).
            - Pass `v_across = a_corner.y * half`, the distance from the centreline in device pixels.
          - **`LINE_FRAGMENT`:**
            - Coverage is `clamp(0.5 * u_width + 0.5 - abs(v_across), 0.0, 1.0) * min(u_width, 1.0)`.
            - Alpha is `u_colour.a * coverage`.
          - **Why the interpolation is right:** `v_across` is the same at both ends of a side. Perspective-correct interpolation therefore leaves it linear across the ribbon, and `noperspective` (missing from GLSL ES 3.00) isn't needed.
          - **Scope:** this covers structure outlines, flows, symbols, the equator ring, the rings and spokes. Widths in `kinds.ts` stay as they are.

          ### 2. Rings fade where crowded
          **`scene/rings.ts`:**
          - Export `FADE = { gone: 2, full: 6 }` (CSS pixels between neighbouring rings).
          - Export `ringFade(spacing) = smoothstep(gone, full, spacing)`.
          - Export `ringSpacing(at, point, step)`:
            - it is the CSS-pixel distance between `at(point·(1 − h))` and `at(point·(1 + h))`, with `h = step / (2|point|)`;
            - it returns `Infinity` where either end is out of sight (`at` gives undefined).
          - `ringLines` returns the rings and the spokes as two `Lines`. Only the rings fade.
          - **`scene/drawing.ts`:** `Lines` gains an optional `fade?: number`, the step in Mpc between the rings it holds.

          **`scene/controller.ts`:**
          - `drawRings` sets `"distance-rings"` with `fade: step`, and the new `"distance-spokes"`.
          - `setRings(false)`, `setAxes` and the no-set case clear both.

          **`scene/shaders.ts`, `LINE_VERTEX`:**
          - New uniforms:
            - `u_fadeStep` (0 means no fade);
            - `u_origin`, the ICRS centre of the offsets;
            - `u_fadeFrom` and `u_fadeTo`, the fade thresholds converted to device pixels.
          - At each corner's end:
            - take the radial direction `r = normalize(offset·scale + u_origin)` in the ICRS (the barycentre is the origin);
            - project `end ± 0.5·u_fadeStep·r` through `u_axes`, `u_centre` and `u_projection`;
            - the spacing is the distance between the two points on the view, in device pixels. It is unbounded where either point is behind the eye.
            - `v_fade = smoothstep(u_fadeFrom, u_fadeTo, spacing)`.
          - The fragment multiplies the alpha by `v_fade`.

          **`scene/renderer.ts`:**
          - Keep `fade` on each outline.
          - In `drawOutlines`, set `u_fadeStep`, `u_origin`, and the thresholds × `devicePixelRatio` for an outline that has a fade, or 0 otherwise.

          **`ui/overlay.ts` (labels):**
          - `RingLabel` gains `step`.
          - `placeRingLabels` leaves out a label where `ringFade(ringSpacing(at, label.at, label.step)) < 1`, since that ring has started to fade.

          ### 3. Ring distances in the next unit (`scene/rings.ts`, `distanceOf`)
          - Each label is written in the largest of pc, kpc and Mpc in which it is at least 1, with the step's places in that unit. Examples:
            - step 200 kpc: "800 kpc", "1.0 Mpc", "14.2 Mpc";
            - step 5 Mpc: "1,005 Mpc", unchanged.
          - Rings side by side still never read alike, since each label carries the step's last figure in its own unit.

          ### 4. Wave end
          1. `/simplify` and `/code-review` in parallel, then the fixes.
          2. `cargo xtask check` once, then `cargo xtask integration` once.
          3. Trace links for the new criterion, accepted.
          4. Screenshots on release 12 of the same grazing view, before and after.
          5. Yard Log closed and committed, merged `--no-ff` into `product/atlas`, product Yard updated.

          Nothing is pushed, published or deployed.

          ## Tests
          - **`scene/rings.test.ts`:**
            - `ringFade`: 0 at or below 2 px, 1 at or above 6 px, and rising in between.
            - `ringSpacing` with a real `project`: rings seen from straight above are as far apart as `step` in pixels; at a grazing angle the far ones are closer than the near ones; a point behind the eye gives `Infinity`.
            - Spokes come apart from the rings, and only the rings carry `fade`.
            - Distances: "1.0 Mpc" after "800 kpc" at a 200 kpc step; neighbours still differ.
          - **`scene/controller.test.ts`:**
            - rings on draws both `"distance-rings"` (with `fade` equal to the step) and `"distance-spokes"`;
            - off, an axes change, or no set clears both.
          - **`ui/overlay.test.ts`:** at a grazing view, the far rings' labels are left out while the near ones are shown.
          - **`e2e/explorer.spec.ts`:** the rings test also flies to a grazing view and checks that only the near labels show and that no console errors appear. A shader that fails to compile shows up there, and in every drawing test.

          ## Verification
          1. `pnpm check` in `clients/explorer`.
          2. On release 12 locally (`cargo xtask explore`, port 5317), the owner's view: rings on, about 4 Mpc out at a shallow angle. The far rings should dissolve toward the horizon with no band, lines should be continuous rather than dashed, and labels should stop where the rings fade.
          3. Structure outlines should look smooth, with the chosen outline still thicker.
