        title: "Why"
        markdown: |-
          The owner saw the far distance rings shimmer, crawl and look dashed near the horizon (they suspected missing anisotropic filtering and Z-fighting).

          - **No Z-fighting:** the renderer has no depth buffer. The shimmer is temporal aliasing.
          - **No textures to filter:** lines are flat-coloured ribbons 1.5 device pixels wide with hard edges, so thin, angled ones break into dashes and crawl as the view moves.
          - **Crowding:** at a shallow angle, rings 200 kpc apart out to 14 Mpc fall under a pixel apart and add up into a moiré band.

          The owner agreed in the session to smooth line edges, fade crowded rings, and write large ring distances in the next unit. The fade is a new criterion; the rest needs none.
