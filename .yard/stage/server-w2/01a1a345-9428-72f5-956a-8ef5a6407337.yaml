          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Science notes from decoding real objects"
        markdown: |-
          From decoding release 6. These are ingest matters, not the server's:

          - **M31 at 0.747 Mpc**, about 5% under the usual ~0.78 Mpc. Under the release's ranking rule, CF4's group modulus 24.366 ± 0.045 beat McConnachie's 24.47 ± 0.07 (0.783 Mpc) on fractional uncertainty. That follows the rule as specified; whether a group modulus should outrank a galaxy's own distance is a ranking-rule question.
          - **Proper-motion errors** from Gaia DR3 and Hipparcos are recorded as `none_reported`; ingest does not appear to map their error columns.
          - **CF4's CMB-frame velocity** (−585 km/s for M31) appears twice: once as a redshift and once as a plain velocity.
          - **M31's sky position** comes from the CF4 entry (4-decimal degrees, FK5), because every entry is class `survey` with no reported error, so entry order decided.
        tone: warning
