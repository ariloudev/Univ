        title: "Research and review the star files"
        detail: |-
          **Stopped early at the person's request**: 51 of the 64 stars have a file; the other 13 (batch D's unfinished stars) stay as release 8 has them, unplaced with no file.

          **Outcome of the 51:** 16 placed, 35 unplaced with their reasons.

          **Review rules applied:** a non-1σ range is an interval (Betelgeuse); a Gaia parallax places a star only with RUWE ≤ 1.4 (Lindegren et al. 2021), and a DR2 parallax that EDR3 withdrew does not count; a group distance places a member only where its membership stands (Wezen and λ Lup unplaced).

          **Checked:** every file passes the checker; every quoted sentence of the 16 placed stars was found in the saved paper texts; batch D's three files reviewed by hand.

          **Placed:** Betelgeuse, Antares, Deneb, Shaula, Alnilam, Alnitak, Mintaka, γ² Vel, Dschubba, Alniyat, ε Lup, σ Ori, b Vel, Mira, FN CMa, HD 202214.
