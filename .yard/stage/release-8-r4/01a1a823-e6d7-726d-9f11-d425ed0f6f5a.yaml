        title: "How the research agents are doing (20:19 UTC)"
        markdown: |-
          **Status.** The four agents, one per batch of 16 stars, have been working for about 20 minutes. None has finished, and no star file is written yet. Each writes its files at the end, after reading the papers.

          **Papers read so far: 20, each saved as quoted text for checking.**

          | Paper | Likely for |
          |---|---|
          | Joyce et al. 2020; Harper et al. 2017 | Betelgeuse |
          | Schiller & Przybilla 2008 | Deneb |
          | North et al. 2007 | γ Velorum |
          | Hummel et al. 2013; Tango et al. 2006, 2009; Tycner et al. 2011 | interferometric orbits (Mintaka, and the α/δ Sco binaries) |
          | de Zeeuw et al. 1999; Miret-Roig et al. 2022 | Sco–Cen membership and distances |
