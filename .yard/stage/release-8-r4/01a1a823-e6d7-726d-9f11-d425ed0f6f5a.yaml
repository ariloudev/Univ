  - key: 01a1a826-2d5c-73f2-9175-34dca600218a
    id: r4-approve-spec
    kind: approval
    versions:
      - key: 01a1a826-2d5c-73f2-9175-34dec45f09c6
        at: 2026-11-04T20:00:36Z
        revision: 3
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Approve the spec change for researched star distances"
        markdown: |-
          **What changes** (shown in the block above):

          - **New feature, Record a researched star distance** (Univ Ingest, normalization). It has three requirements:
            1. **Every number cites its source.** Each researched star distance is read from a star file in which every number cites where it comes from. The criteria:
               - each number cites its paper and sentence or table cell;
               - a file joins the Hipparcos star of its HIP number;
               - the file's kind of value, uncertainty and method are kept;
               - a cluster's or association's distance given to a member is *inferred* and cites the membership paper;
               - the entry names its paper.
            2. **Uncited numbers are refused.** A star file with an uncited number, or a quote that doesn't hold its number, is refused, and the message names the file, field and number.
            3. **No distance is never invented.** A star whose papers publish no distance keeps its file with the reason and places nothing.
          - **Define a source:** the star-source list adds "the researched star distances".
          - **Data providers:** a new provider under Literature, "Researched star distances".
          - **Look up an object** (Univ Server): "The response names the paper each researched catalogue entry's values come from."

          **What to look at:**
          - The kinds of value. A star's own parallax is *measured*, a group's distance given to a member is *inferred*, and a model distance is *estimated*. Only the inferred rule is a criterion; the others follow the existing normalization rules.
