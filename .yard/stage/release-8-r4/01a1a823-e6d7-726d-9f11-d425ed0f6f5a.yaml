        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "R4 produced release 9 with 16 researched naked-eye stars placed"
        markdown: |-
          **Release 9**, published locally, places 16 naked-eye stars by researched distances. Each comes from a cited star file and names its paper in the API:

          | Kind | Stars |
          |---|---|
          | Model or seismic distance (estimated) | Betelgeuse 168 pc (3σ range kept as an interval), Shaula 112 pc, Mira 110 pc |
          | Group distance with cited membership (inferred) | Antares, Alniyat 145 pc (Upper Sco), ε Lup 140 pc, Alnilam, Alnitak 382 pc, Mintaka 381 pc, Deneb 802 pc, b Vel 410 pc, FN CMa 1.48 kpc, HD 202214 829 pc |
          | Orbital or interferometric parallax | σ Ori 2.5806 mas (measured), γ² Vel 346 pc (measured), Dschubba 7.4 mas (estimated: it rests on an assumed mass) |

          **Unplaced:** 48 of the 64 stay unplaced. 35 have a file giving the reason; 13 have no file, because the research was stopped at your request.

          The review rules made the outcomes stricter: a Gaia parallax counts only with RUWE ≤ 1.4, a DR2 parallax that EDR3 withdrew does not count, and a group's distance places a member only where its membership stands.

          **Deterministic checks:**
          - every star file is checked by the ingest suite, on every `cargo test` and in the gate;
          - the release carries six cited science checks (Betelgeuse, Antares, σ Ori, the count of 16, papers named).

          **Open for a later wave:**
          - the 13 unresearched stars;
          - the Gaia gap: about 8,700 Hipparcos stars miss a Gaia parallax, mostly through `gaia-dr3-bright`'s G < 10 cut.
        tone: success
