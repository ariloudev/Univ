  - key: 01a1a825-a48a-7083-bf7d-c69cc9f4afa3
    id: r4-note-list
    kind: note
    versions:
      - key: 01a1a825-a48a-7083-bf7d-c69ea95ded13
        at: 2026-11-04T20:00:01Z
        revision: 2
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "The 64 stars"
        markdown: |-
          **The 64 stars.** Hipparcos-2 stars brighter than Hp 6 that release 8 leaves unplaced.
          - **Why:** each has a parallax error over 10%, and none has a Gaia parallax. Where Gaia DR3 holds one of them, it is a two-parameter solution, a position only.
          - **Batches:** the stars are split into four, each researched by its own agent from the brief in the scratchpad.

          | Batch | HIP numbers |
          |---|---|
          | A (Hp 0.5–2.9) | 27989 Betelgeuse, 80763 Antares, 102098 Deneb, 85927 Shaula, 26311 Alnilam, 26727 Alnitak, 39953 γ Vel, 86228 Sargas, 34444 Wezen, 25930 Mintaka, 9640 Almach, 78401 Dschubba, 100453 Sadr, 35904 Aludra, 84345, 26451 |
          | B (Hp 2.9–4.8) | 80112, 29655, 75264, 5165, 26549, 89341, 74117, 65936, 5434, 86170, 102589, 75323, 2487, 28413, 41039, 110386 |
          | C (Hp 4.8–5.6) | 76880, 70264, 10340, 10826, 93867, 101923, 13165, 96957, 34301, 23879, 14376, 26536, 21730, 33048, 104750, 71500 |
          | D (Hp 5.6–6.0) | 97063, 104642, 74750, 87569, 41621, 116582, 41861, 92027, 71502, 88136, 41250, 29616, 66984, 96840, 8544, 87616 |

          By brightness: 14 are brighter than Hp 2.5, 8 lie between 2.5 and 4, and 42 between 4 and 6.

          **Query.** Run over release 8's D1, read-only. It takes each Hipparcos-2 object's least Hp, keeps those under 6, and joins `objects` where `placed = 0`. All 64 are `no_distance`.
        tone: info
