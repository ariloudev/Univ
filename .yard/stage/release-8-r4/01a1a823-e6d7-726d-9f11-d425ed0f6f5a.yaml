        title: "Research and write the 64 star files"
        detail: |-
          **Scope:** four research agents, 16 stars each, then my review of every file.
          - **Sources:** each star's own published distance, as an interferometric, VLBI or orbital parallax, a stellar model, or a cluster or association distance with its membership paper.
          - **Kinds of value:**
            - a parallax of the star itself is measured;
            - a group's distance applied to a member is inferred;
            - a model distance is estimated.
          - **No distance found:** the file is `unplaced:` with the reason.

          **Done when** the file checker and `cargo test -p univ-ingest` pass and every file is reviewed.
