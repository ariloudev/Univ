  - key: 01a1a837-48a5-725c-90c2-a9df2a740f0a
    id: r4-note-research
    kind: note
    versions:
      - key: 01a1a837-48a5-725c-90c2-a9e0b678d8b7
        at: 2026-11-04T20:19:17Z
