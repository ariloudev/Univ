        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Read star files into catalogue entries"
        detail: |-
          **Scope:**
          - Source `researched-star-distances` (`method: repository`, `path: stars/`, `holds: star_distances`).
          - Star files read with the structure files' `Cited`, papers and quoted-sentence checker.
          - Each file becomes an entry with no position and its distance, or is `unplaced:` with a reason.
          - The paper is named in the object record (`EntryRecord.reference`).

          **Done when** `tests/star_distances.rs` passes:
          - a file joins HIP 27989's object and places it;
          - an uncited or mismatched number is refused;
          - an `unplaced:` file places nothing;
          - the record names the paper.
        state: open
      - key: 01a1a851-2b27-73f7-b68d-89f2aef70294
        at: 2026-11-04T20:47:34Z
        revision: 6
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Read star files into catalogue entries"
        detail: |-
          **Scope:**
          - Source `researched-star-distances` (`method: repository`, `path: stars/`, `holds: star_distances`).
          - Star files read with the structure files' `Cited`, papers and quoted-sentence checker.
          - Each file becomes an entry with no position and its distance, or is `unplaced:` with a reason.
          - The paper is named in the object record (`EntryRecord.references`).

          **Done when** `tests/star_distances.rs` passes:
          - a file joins HIP 27989's object and places it;
          - an uncited or mismatched number is refused;
          - an `unplaced:` file places nothing;
          - the record names the paper.

          **Progress:**
          - **Shared checker:** the structure files' checks are lifted into a `CitedFile` trait that structure and star files share.
          - **Number scanner:** reads LaTeX asymmetric errors such as `168^{+27}_{-15}` as numbers, not powers, and treats HIP, HD, HR, TIC and Gaia `source` numbers as names.
          - **Star files:** disputes carry their own citation, as in structure files. A star with no published distance is counted as `no_published_distance`.
          - **Entries:** carry `references` (`PaperReference`), through the release's `extra` column to the API; the OpenAPI snapshot is regenerated.
          - **Tests:** the six tests of `star_distances.rs` pass. The fixture release holds a SIMULATED star file for HIP 1, and the object-read test checks its paper reads back.
          - **Checker for the agents:** an ignored test checks any directory of star files (`UNIV_STARS=dir`). The research agents run it to fix their files.
          - **Next:** the full workspace run, then the commit.
        state: active
