  - key: 01a1a851-2b27-73f7-b68d-89f0570b533a
    id: r4-note-gaia-gap
    kind: note
    versions:
      - key: 01a1a851-2b27-73f7-b68d-89f15d3314d7
        at: 2026-11-04T20:47:34Z
        revision: 6
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Found: about 8,700 Hipparcos stars miss their Gaia parallax"
        markdown: |-
          Batch B found Gaia EDR3 parallaxes for three "no parallax" stars, which led to a count over release 8.

          **The count.** Hipparcos-2 stars by their Gaia DR3 entry. Each cell gives the stars, with the unplaced ones in brackets.

          | Hp | No Gaia entry | Gaia source with no parallax |
          |---|---|---|
          | < 6 | 446 (24) | 135 (40) |
          | 6–8 | 1,191 (189) | 508 (344) |
          | 8–10 | 2,364 (1,186) | 751 (687) |
          | ≥ 10 | 8,073 (5,995) | 12 (11) |

          In all, 104,475 Hipparcos-2 stars have a Gaia parallax and are all placed.

          **The causes.**
          - **Selection gap (about 6,000 stars).** `gaia-dr3-bright` keeps only G < 10, so Hipparcos stars fainter than that never get their Gaia parallax. The fix: fetch Gaia DR3 for every source of `gaiadr3.hipparcos2_best_neighbour`, whatever its G.
          - **Missing or wrong links (about 2,300 stars, Hp < 10).** The best-neighbour table has no row for the star, or links a companion or a two-parameter solution. In DR2, λ Cyg was linked to its fainter companion. A position match against Gaia, checked by magnitude, would recover many of them.

          **Proposed:** a later ingest wave, not R4. R4 stays with the 64 naked-eye stars you chose, whose researched distances are needed whatever happens to Gaia, since these stars are mostly too bright for a Gaia parallax.
        tone: warning
