  - key: 01a1ac2a-2d68-7132-b2b1-8dfcbf513727
    id: memory-progress-1
    kind: note
    versions:
      - key: 01a1ac2a-2d68-7132-b2b1-8dfddf6c75b8
        at: 2026-11-05T14:43:27Z
        revision: 9
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Savings so far"
        markdown: |-
          Peak memory footprint of the focused run: SDSS DR17 distant, ALFALFA α.100 and 6dFGS, 2,432,397 entries, offline through tiles. Measured with `/usr/bin/time -l`. The fixture release stayed byte-identical after every step.

          | Step | Commit | Peak footprint | Per entry |
          |---|---|---|---|
          | Baseline | `a91d41f` | 10.31 GB | 4,239 B |
          | Chains held without the direction's steps | `a8b01b0` | 9.50 GB | 3,905 B |
          | Objects stop copying their entries' designations | `52306b2` | 9.41 GB | 3,870 B |
          | Flags as one shared-name list, not a map per entry | `a82375c` | 9.16 GB | 3,766 B |
          | Parallax and velocity boxed | `0d8214f` | 8.42 GB | 3,460 B |

          Overall: **−1.9 GB (−18%)**, about 780 B less per entry.

          **DESI gains more.** Its entries carry flags, and these three surveys carry few. Normalizing DESI DR1 alone (15,825,713 entries) dropped from **23.1 GB to 13.1 GB** (1,460 → 828 B per entry) with the flag change.

          **Projection for release 10.** This is an extrapolation, not a measurement. Each entry now costs about 780 B less, so the earlier ~3.6 KB per entry falls to roughly 2.8 KB: about **120 GB instead of 156 GB** for 43 M entries. That is still too close to the machine's 128 GB, and the plan's goal is about 1.2 KB per entry. The full 21.4 M-entry rehearsal that measures it waits for the owner's approval at the wave's end.

          **Next.** In placement, the old object array (400 B per object) appears to stay allocated while the new `ReleaseObject` array (744 B per object) is built beside it. A fresh heap profile is running to confirm that before it is changed.
        tone: info
