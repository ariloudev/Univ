          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "How each step is measured"
        markdown: |-
          Under your rule to approve any full ingest run first, each step is measured on a focused offline run of SDSS DR17 distant, ALFALFA α.100 and 6dFGS: 2.43 M entries, about 10 seconds without the profiler. The 21.4 M-entry rehearsal runs once, at the wave's end, after you approve it.

          2dFGRS is kept out of the focused runs. This branch has its old slices, which would remove its cached chunks again.
