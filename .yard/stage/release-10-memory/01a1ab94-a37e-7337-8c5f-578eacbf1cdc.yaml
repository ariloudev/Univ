  - key: 01a1abb1-1d37-7718-b264-83b353843a1b
    id: memory-plan
    kind: plan
    versions:
      - key: 01a1abb1-1d37-7718-b264-83b629fe4ff1
        at: 2026-11-05T12:31:13Z
        revision: 2
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Make ingest leaner: plan"
        markdown: |-
          **Goal:** release 10's 43 million entries build within memory, at no more than about **1.2 KB per entry at the peak** (about 52 GB), down from 3.6 KB. The release comes out the same.

          ## Approach
          Keep one pass in memory, but compact. Cross-matching genuinely needs every entry's position and match keys at once, and these steps shrink what is held per entry. Writing the full records by streaming them from disk is held back as a further step, taken only if the measured result misses the goal.

          ## Steps
          Each step is measured on the 21.4 M-entry offline rehearsal. The savings are estimates.

          | # | Change | Estimated saving per entry |
          |---|---|---|
          | 1 | **Chains as templates in memory.** A derived position or distance holds its chain's template and parameters, as D1 already stores them. The steps are spelled out only when rows are written. | 400–600 B |
          | 2 | **Entries held once.** Objects hold the indexes of their entries in one entry table, not moved copies. Designations are read from the entries, not copied beside them. | about 300 B |
          | 3 | **Compact entries.** The values a survey seldom gives (proper motion, spectral type, colours, supergalactic velocity, group, flags, references, a second name) move into one optional boxed part. A redshift's CMB-frame value is worked out when written, not stored. | about 400 B |
          | 4 | **Compact objects.** The derived position is boxed or compacted in `ReleaseObject`. | about 300 B |
          | 5 | **Id maps keyed by 128-bit hashes**, as the D1 writer's key checks already are. | about 150 B |

          ## How it is checked
          - **The release comes out the same.** The fixture release built before and after each step has the same files: the same SHA-256 for every file in the manifest, and the same D1 fingerprints.
          - **No step changes what a release holds.**
          - **The gates.** The full `cargo xtask check` passes, and `cargo xtask science` passes on the rehearsal.
          - **Memory is measured.** The peak per entry is reported after each step. The wave ends with the 43 M-entry figure, projected from two measured points.

          ## Not in this wave
          No spec change: memory is not a criterion today. If you want it held, I can add a quality attribute for release 10's build, such as "within 64 GB".

          ## After the wave
          The wave merges into `product/release-10`. W5 then takes it, adds 2MPZ as a prepared file and WISE × SuperCOSMOS and GAMA as permission pending, and builds release 10.
