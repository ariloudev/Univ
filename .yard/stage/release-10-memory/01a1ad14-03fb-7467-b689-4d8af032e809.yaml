        title: "Flag names shared per table, and a smaller Flags API"
        detail: "The plan names its quality columns once (`Arc<str>`), so rows no longer take the global name lock. `get` returns `&str`, `Deserialize` is derived through `serde(from)`, and the test-only `remove` and `BTreeMap` equality moved into the tests. Index on Flags was not restored: the lints forbid its panic."
