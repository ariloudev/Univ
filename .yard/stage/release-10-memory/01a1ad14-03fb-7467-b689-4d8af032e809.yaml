  - key: 01a1ad60-4275-762c-b000-d370eb4aabaf
    id: memory-final
    kind: note
    versions:
      - key: 01a1ad60-4275-762c-b000-d372cb46b7c5
        at: 2026-11-05T20:22:09Z
        revision: 25
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "The rehearsal's result"
        markdown: |-
          | | Before the wave | After |
          |---|---|---|
          | Rehearsal entries | 21.44 M | 21.22 M (2dFGRS left out) |
          | Peak footprint | 78.8 GB | **29.15 GB** (−63%) |
          | Per entry | ~3.6 KB | **1,373 B** |
          | Time | — | 159 s |

          The run: normalization 10 s, cross-matching 127 s (matching 93 s), tiles 4 s. 19,381,115 objects, 1,835,816 merges, 64,085 candidate links, 19,305,160 placed. The footprint peaked at 28.8 GB in the samples as tiles began, after the id state was written.

          **Projection for release 10 (about 43 M entries).** Two measured points agree on about 1.37 KB per entry: DESI alone, 15.83 M entries at 21.72 GB, and this run, 21.22 M at 29.15 GB. They give (29.15 − 21.72) / 5.39 M ≈ 1,378 B per entry. So release 10 needs about **29.15 + 21.8 M × 1.37 KB ≈ 59 GB**, against 156 GB projected before the wave. That fits the machine's 128 GB with a wide margin. The plan's goal was about 1.2 KB per entry and 52 GB, and this is 14% above it; the two cuts that remain are recorded in "Where the cuts stop".

          The release is unchanged: the fixture snapshot was byte-identical after every step, and the full gate is green.
        tone: success
