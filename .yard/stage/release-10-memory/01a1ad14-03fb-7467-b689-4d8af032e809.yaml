  - key: 01a1ad58-d988-71d5-bc5c-89f5c2f8b433
    id: a-rehearsal
    kind: approval
    versions:
      - key: 01a1ad58-d988-71d5-bc5c-89f85afd79ee
        at: 2026-11-05T20:14:03Z
        revision: 22
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Run the full offline rehearsal"
        markdown: |-
          **What runs:** `univ-ingest tiles --offline` over every cached source but 2dFGRS: 23 sources, about 21.4 M entries, as the rehearsal before the wave. Measured with `/usr/bin/time -l` and the footprint sampled by stage.

          **What it touches**
          - Reads only the download cache; nothing is fetched.
          - The id state is a **copy** of the real one (release 9) in the scratch folder, so the run pays the real cost of reading release 9's ids, and the real state directory is not written to.
          - The tiles go to the scratch folder and are deleted afterwards. No release is built or published.

          **Why 2dFGRS is left out:** this branch still has its old slice range, and a run would remove its cached chunks again. W5 refetches it.

          **Expected:** about 30 GB at the peak, against 78.8 GB before the wave, and a few minutes. Then the 43 M projection from this run and DESI's measured figure, and the wave can close.

          After this, the downloads move (stage "Move the downloads"), then the merge into `product/release-10`.
    responses:
