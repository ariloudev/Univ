          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Box objects where matching makes them"
        detail: "`map(Box::new).collect()` reused the old object array's buffer in place, so the array and the boxes were both held until placement ended. Matching now boxes each object as it makes it (`Matched.objects: Vec<Box<Object>>`), and the conversion step is gone. Builds; not yet measured."
        state: done
