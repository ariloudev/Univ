          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Build thin lists directly, without a copy"
        detail: "The object's entries, and the entry's distances, redshifts and colours, are built as thin vectors, trimmed only when a blank cell leaves room; no `ThinVec::from(Vec)` copy per row or object. Also reverted a stray thin vector that an earlier rewrite put in `outlines/compare.rs`."
        state: done
