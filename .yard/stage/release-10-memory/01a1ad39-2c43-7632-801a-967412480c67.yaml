blocks:
  - key: 01a1ad39-2c43-7632-801a-96752f23f7b2
    id: q-move-what
    kind: question
    versions:
      - key: 01a1ad39-2c43-7632-801a-9678e67623e0
        at: 2026-11-05T19:39:27Z
        revision: 19
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        prompt: "Which parts of univ-server/.cache/univ-ingest should move to the Univ home folder?"
        header: "What moves"
        context: |-
          The folder holds four things, all on one disk, so a move is an instant rename:

          | Part | Size |
          |---|---|
          | Source downloads: chunks, files and provenance, one folder per source | ~3 GB |
          | `wrangler`: the local D1 and R2 that releases are published to | 8.2 GB |
          | `build`: built releases | 6.7 GB |
          | `state`: the id ledger and the last release's entry ids | 1.8 GB |

          The move happens after the memory wave's review stage. The default of `--cache` (and of the other folders that move) changes to match, an environment variable can override it, and the code, tests, xtask, CLAUDE.md, AGENTS.md and the spec, where they name the path, are updated.
        options:
          - label: "Downloads only"
            detail: "The ~3 GB of source downloads move. The id state, built releases and local D1/R2 stay in univ-server: they are this project's own outputs, not shared data, and `xtask serve`/`explore`/benches keep their paths."
            recommended: true
          - label: "Downloads and builds"
            detail: "Source downloads and built releases move (~10 GB). The id state and local D1/R2 stay with the project."
          - label: "Everything"
            detail: "The whole 20 GB folder moves, the id state and local D1/R2 included. Every path in univ-ingest and xtask changes."
    responses:
      - key: 01a1ad39-efe3-7041-9d43-915bc540b7f4
        at: 2026-11-05T19:40:17Z
        revision: 20
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "Downloads only"
  - key: 01a1ad39-2c43-7632-801a-96765bedab66
    id: q-move-where
    kind: question
    versions:
      - key: 01a1ad39-2c43-7632-801a-9679acc3ff19
        at: 2026-11-05T19:39:27Z
        revision: 19
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        prompt: "Where in the Univ home folder should the downloads go?"
        header: "Where"
        context: "The Univ home folder is /Users/admin/Locap/Univ. It is not a git repository, so nothing there is committed."
        options:
          - label: "Univ/downloads/univ-ingest"
            detail: "A visible `downloads` folder, with one subfolder per tool so other projects can keep theirs beside it."
            recommended: true
          - label: "Univ/.cache/univ-ingest"
            detail: "Hidden, the same layout as today one level up."
          - label: "Univ/downloads"
            detail: "The source folders straight under `downloads`, with no subfolder for Univ Ingest."
    responses:
      - key: 01a1ad39-efe3-7041-9d43-915cdc3d3b5f
        at: 2026-11-05T19:40:17Z
        revision: 20
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "Univ/downloads/univ-ingest"
