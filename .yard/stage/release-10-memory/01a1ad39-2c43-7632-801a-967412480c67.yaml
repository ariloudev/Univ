          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Point --cache at Univ/downloads/univ-ingest"
        detail: "`--cache` defaults to `../downloads/univ-ingest` from the repository root, and `UNIV_INGEST_CACHE` overrides it (the variable the hand-run tests already read; clap's `env` feature on). The tests' `cache_dir()` and two test docs follow it. AGENTS.md (CLAUDE.md links to it) gains a \"Local data\" section, and the umbrella Univ/CLAUDE.md a rule on `downloads/<tool>/`. The spec does not name the path; the release records provenance but not the cache's path. Commit `5b58aab`."
        state: done
