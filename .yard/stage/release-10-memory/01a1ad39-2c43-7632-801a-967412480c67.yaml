        title: "Only the source downloads move"
        consequence: "The per-source chunks, files and provenance (~3 GB) leave univ-server. The id state, built releases and local D1/R2 stay in `.cache/univ-ingest`, so `build`, `publish`, `serve`, `explore` and the benches keep their paths; only the `--cache` default changes."
        question: 01a1ad39-2c43-7632-801a-96752f23f7b2
