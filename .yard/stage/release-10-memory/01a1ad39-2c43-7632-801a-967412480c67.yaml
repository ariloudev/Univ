        title: "What the move left"
        markdown: |-
          - **Downloads:** /Users/admin/Locap/Univ/downloads/univ-ingest/, 24 source folders, 2.7 GB. New downloads go there: it is the default of `univ-ingest --cache`, and `UNIV_INGEST_CACHE` names another.
          - **Project outputs:** univ-server/.cache/univ-ingest/ keeps `state`, `build` and `wrangler`.
          - **Documented** in univ-server's AGENTS.md ("Local data") and the umbrella Univ/CLAUDE.md.

          **For W5:** the 2dFGRS refetch and the WISE, GAMA and 2MPZ downloads land in the new folder.
        tone: success
