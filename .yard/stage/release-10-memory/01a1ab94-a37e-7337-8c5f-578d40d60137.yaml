          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Where the 3 KB per entry goes"
        markdown: |-
          The heap at its peak, by where it was allocated, per entry. One object per entry in this run.

          | Allocated in | Bytes per entry | What it is |
          |---|---|---|
          | matching | 1,059 | Each entry moved into its object as an `ObjectEntry` (600 inline: the whole `CatalogueEntry` and its resolution), and its designation copied beside it |
          | cross-matching | 752 | The `Vec<ReleaseObject>`: 752 bytes inline each, an `Object` (400) and an optional `DerivedPosition` (344) |
          | placement | 418 | Each object's transformation chain, spelled out step by step; D1 already stores chains as shared templates |
          | id assignment | 251 | Maps keyed by strings |
          | normalization | 219 | Each entry's own heap: identifier, `Vec<Redshift>` (160 each, with the CMB-frame value stored beside the measured one), flag maps |
          | others | about 280 | Ranking, dhat's own bookkeeping |

          Most of it is room for what a galaxy never has: `CatalogueEntry` is 504 bytes inline, mostly empty `Option`s for parallax, proper motion, spectral type, colours and the like, against about 130 bytes of raw data.
