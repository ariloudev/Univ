        title: "What is measured so far"
        markdown: |-
          Offline runs through the tile stage, with no release built, measured by `/usr/bin/time -l` (W5, 2026-11-05):

          | Entries | Peak footprint | Peak resident | Time |
          |---|---|---|---|
          | 5.61 M (no DESI) | 22.1 GB | 23.0 GB | 29 s |
          | 21.44 M (with DESI) | 78.8 GB | 67.3 GB | 164 s |

          - **Cost:** about 3.6 KB per entry, with about 2 GB fixed.
          - **Release 10's 43 M entries:** about 156 GB of footprint, on a 128 GB machine.
          - **Raw data:** about 130 bytes per entry in the cache.
