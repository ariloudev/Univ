  - key: 01a1bbd3-9899-7112-9cdf-193dbfffd36b
    id: rings-spec-approval
    kind: approval
    versions:
      - key: 01a1bbd3-9899-7112-9cdf-1940271e7f04
        at: 2026-11-08T15:42:48Z
        revision: 2
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "The distance rings' spec"
        markdown: |-
          Approve the change above:

          - **The switch:** a **Rings** switch beside **Grid** in the top bar. It is off by default, and `rings=on` keeps it on in the address.
          - **Rings:** centred on the Solar System barycentre, in the chosen axes' equator, at every multiple of the **scale bar's length**, so the bar in the bottom bar is the key to them. Only rings within three times the eye's distance of the focus are drawn, about 40 to 90 of them.
          - **Spokes:** every 30° of longitude, from the innermost ring drawn to the outermost.
          - **Labels:** each ring's distance, where it crosses the 0° spoke. A label that would overlap another is left out.
          - **In space:** unlike the sky grid, the rings move as you fly, as the points do. They change with the axes and when the scale bar steps.
          - **The single ring:** while the rings are on, the equator's single ring and its label are not drawn.
          - **The pointer:** the rings take no pointer events.

          **Left out:** fading points by their height above or below the plane. Without depth testing, the rings can't show whether a point is above or below the plane. That would be its own change.
