    kind: plan
    versions:
      - key: 01a1bbd6-7f67-7567-bdf3-140b3b159647
        at: 2026-11-08T15:45:59Z
        revision: 6
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Build plan: distance rings (W7, `stage/atlas-w7`)"
        markdown: |
          # Build plan: distance rings (W7, `stage/atlas-w7`)

          ## Context
          The owner asked for "option 2": rings of equal distance from the Solar System barycentre, with spokes, in the chosen axes' equator. The rings let you read how far things are as you fly. They complement the sky graticule merged in W6, which shows only directions.

          **Spec:** approved in Yard and committed at 96f55cc. It adds one state-driven requirement under frame-the-view-as-an-atlas, with nine criteria (keys `01a1bbd3-54fe-…cdc4` to `…cdcc`), and rewords the top-bar criterion to name the new switch.

          **What exists already:**
          - The explorer draws one ring, the equator at the power of ten nearest the eye's distance:
            - `scene/frames.ts`: `equatorRing`, `ringRadius`, `ringAnchor`;
            - `scene/controller.ts:157`: `tick` draws it with `drawer.setLines("equator", …)`;
            - `ui/overlay.ts:115`: the label at its 0° point.
          - The distance rings take that ring's place while they are on.

          **Two changes from the plan sent earlier in Yard,** found while reading the code:
          1. **Arcs, not whole rings, around a distant focus.** Rings are centred on the barycentre. When the focus is far from it and the view is zoomed in (for example a few kpc wide at 100 Mpc), each ring would be drawn as 192 chords sitting about 13 kpc off the true circle, and with float32 offsets from the origin. So:
             - When the focus lies more than 3 × the eye's distance from the barycentre in the plane, only the sector of each ring that passes near the focus is drawn.
             - That sector is cut into fine segments and drawn relative to a centre in the middle of it.
          2. **Labels when the 0° spoke is out of view.** In that same case the 0° spoke is usually outside the sector, so no ring would be labelled.
             - Labels go where each ring crosses the line from the barycentre through the middle of the sector drawn.
             - This rewords one criterion: *"…where it crosses the spoke of zero longitude, or, where the rings drawn are arcs short of going round, the line through their middle…"*. It is a minor spec change, committed on its own before the code, with its `spec-change` block in Yard.

          ## Steps

          ### 1. Rings as data (new `clients/explorer/src/scene/rings.ts`, pure functions)
          `ringSet(view, toFrame, height): RingSet | undefined`:
          - **Step:** the scale bar's length, `scaleBar(unitsPerPixel(view, height)).parsecs / 1e6` Mpc. This reuses `scene/scale.ts` and `scene/camera.ts`.
          - **ρ:** the focus's distance from the barycentre in the plane, `hypot` of `apply(toFrame, focus)`'s x and y.
          - **Range:** rings k from `max(1, ceil((ρ − 3d)/step))` to `floor((ρ + 3d)/step)`, where d is `view.distance`.
          - **Sector:**
            - none (full rings) where ρ ≤ 3d;
            - otherwise a half-width of `asin(3d/ρ)`, rounded up to a power of two in degrees, centred on the focus's longitude snapped to half that width.
            - The snapping means small moves keep the same set, so the lines are not rebuilt every frame.
          - Returns `{ step, first, last, sector?, axes }` and a `key` string to compare sets.

          `ringLines(toFrame, set): Lines`:
          - Rings of 192 segments (full) or 96 (arc). Spokes at multiples of 30° within the sector, from the first ring to the last.
          - All lines lie in z = 0 of the axes, are turned to the ICRS with `unapply`, and are offset from a centre in the middle of what is drawn.
          - Uses the `Lines` type from `scene/drawing.ts`, in the grid's dim ink at low opacity.

          `ringLabels(toFrame, set)`:
          - One label per ring, `shortDistance(k × step)` from `scene/format.ts`, at its crossing with the 0° spoke, or with the sector's middle line for arcs.

          `scene/frames.ts` keeps `equatorRing`. Its `onEquator` helper is shared by exporting it.

          ### 2. The controller (`clients/explorer/src/scene/controller.ts`)
          - `setRings(on)` marks the view dirty.
          - **In `tick`, with the rings on:**
            - recompute `ringSet`;
            - when its key changes, call `drawer.setLines("distance-rings", ringLines(...))`;
            - clear `"equator"` once.
          - **With the rings off:** clear `"distance-rings"` once and keep the existing equator logic. `this.ring = 0` forces the equator ring back.
          - `setAxes` resets the ring key.
          - A getter `rings: RingSet | undefined` serves the overlay and the drawer text.

          ### 3. Labels (`ui/overlay.ts`, `ui/SceneOverlay.tsx`)
          - `Overlay` gains `ringLabels: RefObject<HTMLDivElement>`, a `pointer-events-none` container in `Marks`.
          - `placeOverlay`, while `controller.rings` is set:
            - hides the single ring element;
            - projects each label point with `project` (`scene/camera.ts`);
            - keeps those clear of each other with `clearLabels` (`scene/labels.ts`, as the structure names do);
            - reuses or creates spans in the container, then hides the rest.
          - With the rings off, the container is hidden and the single ring label is placed as now.

          ### 4. The switch (`ui/ringsSwitch.ts` on `ui/addressSwitch.ts`)
          - `{ parameter: "rings", byDefault: false }`, like `ui/gridSwitch.ts`.
          - `Whereabouts` (`ui/Panels.tsx`) shows `SwitchBox` "Rings" (`ui/SwitchBox.tsx`) after "Grid", typed with the shared `Switch`.
          - `Atlas` (`ui/Atlas.tsx`) holds `useRings()` beside `useGrid()`, passes it to `TopBarParts`, and runs `useEffect(() => world?.controller.setRings(on), [world, on])`.
          - `ViewDrawer`'s ring sentence becomes "Rings: every 50 Mpc from the barycentre in the galactic equator" while the rings are on.

          ### 5. Wave end
          1. `/simplify` and `/code-review` in parallel, then the fixes.
          2. `cargo xtask check` and `cargo xtask integration`, each once and green.
          3. Trace links for the nine criteria and the reworded top-bar one, accepted with `loft reconcile --accept`.
          4. Screenshots on release 12 (`cargo xtask explore`).
          5. The Yard Log closed and committed, merged `--no-ff` into product/atlas, and the product Yard updated.

          Nothing is pushed, published or deployed.

          ## Tests (each criterion → test)
          - **`scene/rings.test.ts`:**
            - the step equals `scaleBar`'s length;
            - the range covers exactly the multiples within 3d of ρ;
            - every vertex lies in z = 0 of the axes at its ring's radius;
            - 12 spokes on full rings, only the sector's spokes on arcs;
            - a turn leaves the key, a move or zoom past a scale step changes it, and the axes change it;
            - arcs appear for a distant focus, with labels on the middle line.
          - **`scene/controller.test.ts`** (fake drawer, as now): on replaces `"equator"` with `"distance-rings"`; off restores the equator ring; lines are rebuilt only when the key changes.
          - **`ui/overlay.test.ts`** (fake world): labels at their points; an overlapping label left out; the single ring label hidden while on; the container `pointer-events-none`.
          - **`ui/ringsSwitch.test.ts`:** off by default; `rings=on` kept beside other parameters and left out once off; starts on after a reload.
          - **`ui/Atlas.test.tsx`:** the Rings switch sits beside Grid in the top bar; switching it on calls `setRings(true)`.
          - **`e2e/explorer.spec.ts`:**
            - a new test switches the rings on at 1,280 px, sees ring labels, checks the top bar is still ≤ 40 px, reloads and finds them on;
            - the pick test runs with the rings on as well as the grid.

          ## Verification
          1. `pnpm check` in `clients/explorer` between steps.
          2. The full gate and integration once at the end.
          3. On release 12 locally:
             - the rings around Earth in galactic axes, labelled along 0°;
             - after flying to Virgo, arcs near the focus labelled on their middle line;
             - after zooming, the step changes with the scale bar;
             - with the rings off, the single equator ring is back.
        planMode: true
