        markdown: |-
          | Step | Result |
          |---|---|
          | `/simplify` (4 reviewers) | Applied: a drawn set is kept while it reaches 3 × the eye's distance and runs no farther than 4 (a minor spec change, 1f06897), so a flight or a zoom rebuilds it now and then rather than every frame; each ring's directions and labels worked out once per set; off-screen labels left out; `RAD` shared; a generic `clearLabels`; number formats made once; the rings' switch held in `Atlas`. |
          | `/code-review` | Fixed: rings side by side read alike far out (labels now carry the step's precision); the old rings stayed after an axes change that gave none; the single ring's label and the drawer's sentence came back while the rings were on but none in reach; whole rings drawn as arcs just past the reach; ring labels measured in the wrong type and not kept clear of structure names; a test that didn't change the axes. |
          | Left as they are | Treating the single equator ring as a one-ring set (a larger rework of the existing ring and its tests); deriving the rings' colour from the CSS token. |
          | `cargo xtask check` | Passed, 13 gates. |
          | `cargo xtask integration` | Passed, with 14 Playwright tests, including the rings test and the pick test with the rings on. |
          | Trace | 602 of 602 nodes linked; the two TR-008 findings predate this work. |
        tone: success
