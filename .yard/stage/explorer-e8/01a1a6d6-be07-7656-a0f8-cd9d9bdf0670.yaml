        title: "Draw a sky region from its cells"
        detail: |-
          **Scope:** `scene/structures.ts`: a `sky_region` shape gives:
          - its boundary at `near` and at `far`;
          - radial edges at the 4 boundary corners furthest along two axes across the region;
          - its centre and size from its cells.

          It is no longer approximate.

          **Done when** `structures.test.ts` shows:
          - a one-cell region at 10 to 20 Mpc gives 8 edges, plus 4 radial ones;
          - every outline point lies at `near` or `far`, or between them on a radial edge;
          - the frame's rotation is applied.
