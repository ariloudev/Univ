        detail: |-
          **Scope:** `scene/healpix.ts`:
          - a nested cell's corners as unit vectors, by the standard projection (xyf2loc);
          - the edges of a set of cells that no two cells share, each subdivided to follow the cell's edge.

          **Done when** `healpix.test.ts` shows:
          - cell centres and corners match the reference values for orders 0 and 1;
          - one cell's boundary is its 4 edges;
          - two neighbouring cells' boundary is 6 edges, across a face edge too;
          - all 12 cells of order 0 have no boundary.

          **Result:** 10 tests pass. healpy is not installed, so the reference values come from `cdshealpix` 0.10.1 itself, the crate that makes the regions: `nested::center` and `nested::vertices`, at orders 0, 1 and 6, to 1e-9. Base cells 0 and 4 share an edge across the projection's faces, and the boundary finds it.
        state: done
