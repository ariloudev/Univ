        revision: 1
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "What a sky region is on the wire"
        markdown: |-
          `shape.geometry` is `{kind: "sky_region", order, cells, near, far}`:
          - `cells` are HEALPix cells, nested, of order 6 (cdshealpix, `REGION_ORDER`), in `shape.frame` (ICRS for all five);
          - `near` and `far` are in `shape.unit` (megaparsecs).

          Release 7's five regions:

          | Structure | Cells | Depth |
          |---|---|---|
          | Hercules SC | 25 | 125–212 Mpc |
          | CfA2 Great Wall | 6,517 | 44–219 Mpc |
          | Sloan Great Wall | 375 | 226–388 Mpc |
          | BOSS Great Wall | 123 | 1,776–1,946 Mpc |
          | Perseus–Pisces | 1,028 | 59–96 Mpc |

          The API's `bounds` are already the box about the region itself; only the model's `Geometry::bounds` takes the whole sphere. R2 checks which of the two the volume query reads.
