          **Done when** screenshots show the Hercules SC, the CfA2, Sloan and BOSS Great Walls, and Perseus–Pisces each drawn as a curved slab at its distance, no longer a box about Earth, and none is named "approximate".

          **Result:** each is drawn at its own distance:
