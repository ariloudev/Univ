  - key: 01a1a6d6-be07-7656-a0f8-cda056f40060
    id: e8-t-healpix
    kind: task
    versions:
      - key: 01a1a6d6-be07-7656-a0f8-cda7362cc15f
        at: 2026-11-04T13:54:13Z
        revision: 1
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "HEALPix nested cells: corners and the region's boundary"
        detail: |-
          **Scope:** `scene/healpix.ts`:
          - a nested cell's corners as unit vectors, by the standard projection (xyf2loc);
          - the edges of a set of cells that no two cells share, each subdivided to follow the cell's edge.

          **Done when** `healpix.test.ts` shows:
          - cell centres and corners match healpy's values for orders 0 and 1;
          - one cell's boundary is its 4 edges;
          - two neighbouring cells' boundary is 6 edges, across a face edge too;
          - all 12 cells of order 0 have no boundary.
        state: open
