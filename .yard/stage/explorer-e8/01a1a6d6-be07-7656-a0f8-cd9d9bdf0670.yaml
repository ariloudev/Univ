        title: "What E8 produced"
        markdown: |-
          **Each sky region is drawn as itself:** the boundary of its HEALPix cells at its near and far distances, joined by radial edges at its extremes. It is no longer a box about Earth marked approximate. This uses release 7's data as it is.

          **On release 7:**
          - the BOSS Great Wall lies over the BOSS galaxies, 1.78–1.95 Gpc out;
          - the Hercules Supercluster is a narrow wedge at 125–212 Mpc.

          **Ready for R2:** Vela, Shapley and Horologium–Reticulum will draw the same way once R2 gives them sky regions.

          **Left open:**
          - Wide regions show stepped edges from order-6 cells. They are true to the cells.
          - A dense point cloud can hide a chosen region's white outline at a distance.
        tone: success
