        title: "W1 review: findings and what became of them"
        markdown: |-
          Five reviews ran in parallel: `/code-review` (high) and the four `/simplify` angles (reuse, simplification, efficiency, altitude).

          | Finding | Outcome |
          |---|---|
          | Wrangler's `request.cf` cache, with location data, committed in abe7647 (W0) | Fixed in fc90372: untracked, and `.wrangler/` ignored wherever it lies. **Local only, never pushed**, but it stays in local history |
          | Pre-v3 releases handled by matching "no such table" | Fixed in 88be678: details joined into one query; `xtask serve` creates the missing tables (checked on the real state: latest still 6, schema version still 2) |
          | 2 to 4 sequential D1 round trips per read | Fixed in 88be678: source, provenance and structure each one query after release resolution; the listing folds `latest` in |
          | HEAD: refusals carried bodies, and Content-Length was lost; the e2e HEAD test couldn't fail | Fixed in 88be678; the e2e test now reads the raw socket |
          | Methods upper-cased (RFC 9110 §9.1) | Fixed |
          | Problem schema hand-built; four kind lists that must agree | Fixed: one table macro; schema derived from the served document |
          | Three JSON-column parsers; hand-mapped flat rows; copied test helpers; hand-written query decoding; OpenAPI cloned per request | Fixed |
          | Ctrl-C orphaned wrangler and workerd | Fixed: a handler stops the process group |
          | Admitted outlines left as points; untyped JSON contract between ingest and the API; the pc/Mpc rule in 4 places; frame citations differing from objects'; per-entry allocations | Delegated (ingest worktree), with the minor spec wording in b18d365 |
          | Each route's refusals in OpenAPI (AC-290) | Kept for W7, as planned |
        tone: info
