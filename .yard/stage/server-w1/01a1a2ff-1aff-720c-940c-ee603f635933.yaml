        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "What W1 produced"
        markdown: |-
          | Area | Result |
          |---|---|
          | Releases | Listing newest first with counts, cosmology and sources; `?release=n` pinning with `Univ-Release`; 410 for pruned, 404 for never published |
          | Sources | Listing, detail (terms, query, cuts, reference, HEALPix coverage, radial ranges), provenance (payloads, fetched/published/left-out, fixes) |
          | Structures | Pages of 500 with a release-keeping cursor; the record verbatim with citations; typed shape, derivation, outline result and rescaled sizes |
          | Ingest schema v3 | `source_details`, `structure_details`; admitted outlines placed as grid regions |
          | Contract | Problem schema from a type; HEAD and methods per RFC 9110 |

          Tests: univ-api 62, end-to-end 11, ingest and model suites green.

          **For later waves:**
          - Real data gets the v3 fields only with a new real release build (W7). Release 6 now has the empty tables, created by `serve`.
          - AC-290 (each route's refusals in OpenAPI) stays for W7.
          - The fixture release has no CF4++ grid, so no admitted outline reaches the end-to-end tests.
          - The giant GRB ring's sizes are rescaled by the Hubble ratio: the paper's flat ΛCDM is stated, but the structure file cites no single redshift for a comoving ratio. That follows the documented rule.
        tone: success
