          - AC-150: the range applies only where entries hold redshifts or distances.
          - AC-152: "fetched" is published plus left out.
          - AC-157 is split: published numbers cite their source, and a new criterion says derived numbers name their derivation.

          Five ingest criteria are added under *Build a release*, so that ingest publishes what those server criteria read: the reference, the coverage, the placed geometry, the outline test result and the rescaled sizes.

          AC-152 keeps one LQ-005 info finding: it is one record's two counts, an enumerated shape.
