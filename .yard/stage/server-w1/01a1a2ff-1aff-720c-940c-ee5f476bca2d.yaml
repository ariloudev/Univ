        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "What W1's criteria need that releases don't hold yet"
        markdown: |-
          I mapped F-14, F-16 and F-17's 28 criteria against the published D1 data.

          - **F-14:** all met by the data.
          - **F-16:** two criteria are short:
            - AC-147: the reference is free text, and `researched-structures` gives no bibcode.
            - AC-150: no coverage is stored.
          - **F-17:** four are short:
            - AC-156: only member lists have a univ-model geometry, and sky regions are boxes with no HEALPix.
            - AC-161: the outline test's result is computed in tests only.
            - AC-162: the rescaled sizes are computed but used only for bounds.
            - AC-157: derived numbers carry no derivation.

          **Done in W1:**

          | Ingest addition | Criteria |
          |---|---|
          | bibcode or DOI per source definition | AC-147 |
          | coverage: a HEALPix MOC of entry positions, plus the redshift or distance range (needs `ang2pix_nested` in univ-model, Górski et al. 2005) | AC-150 |
          | univ-model geometry for every placed structure (sky regions as MOCs) | AC-156 |
          | outline test result per grid-outlined structure | AC-161 |
          | rescaled size beside its native value | AC-162 |

          All of these are additive tables or columns, so releases already published still read. Real data gets them with the next real build, which belongs to W7.
        tone: warning
