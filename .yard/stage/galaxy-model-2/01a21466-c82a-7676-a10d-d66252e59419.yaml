        title: "Wave 2 done: approve the spec reword and the merge"
        markdown: |-
          ## Wave 2 is built and green

          - `cargo xtask check`: 14 gates passed (`loft verify` runs on `develop` only).
          - `loft reconcile --fail-on warning`: clean; every criterion of *Build the Galaxy model*, AC-91, AC-345 and the v5 decoder criterion linked.
          - Milky Way release 5 published with the 10M-point model; science checks pass.

          ## Approve

          1. **Spec reword (uncommitted)** in *Build the Galaxy model*, two criteria:
             - *Along each arm, the model follows the fitted ranges of its fits in the order the definition names them for that arm, Reid et al. 2019's first, leaving out each stretch of a later fit that runs alongside an earlier fit within the distance the definition gives for one stretch.*
             - *Where no fitted range of an arm reaches, the model follows the extrapolations of its fits, in the same order and leaving out the same stretches, with the weight the definition gives an extrapolation.*

             Why: choosing a fit by azimuth fails across papers, whose windings share azimuths.
          2. **Merge** `stage/galaxy-model-2` into `product/galaxy-model`.

          ## Decided during the wave (for the record)

          - CLI tests run on a symlinked mirror of the repository whose model asks for 20,000 points; 10M take minutes in a debug build.
          - Univ Explorer's object catalogue leaves out `galaxy_model` until wave 4 draws it.
          - The definition refuses numbers the model cannot be drawn with, and a seed beyond 2^53 - 1.

          ## Open, for a later wave

          - An arm still ends abruptly where its last fit ends; a taper would need a spec change.
