        by:
          host: claude-code
          session: "918a7610-2359-46e7-a590-437534c76364"
        title: "What wave 1 produced"
        markdown: |-
          - **Gaia DR3 stars and Bailer-Jones distances to G < 14**, in 768 chunks run as archive jobs: 16,844,156 sources and 16,716,140 distances, counted live on 2026-11-10.
          - **Inferred distances:** a Bailer-Jones distance resting on ϖ/σ < 5 (or a null or non-positive ratio) is inferred. The ranking sets it aside beside a measured or estimated distance precise enough to place the star, and otherwise it places the star like any other.
          - **16 object shards bound**, on the owner's choice after one chunk measured 1.8 KB a star (release 13 ≈ 61 GB in its shards).
          - **Pruning proven safe for additive releases** by `prune_then_change.rs`, before any real prune.
          - **Science check** `inferred-share-of-gaia-stars`, 2–8%.

          **Left open for later waves:** AC-91, AC-92 and AC-166 (wave 2) and AC-362 (wave 4) are unverified until those waves meet them. The full fetch takes about 14 hours and waits for the owner's approval, with the release stage.
        tone: success
