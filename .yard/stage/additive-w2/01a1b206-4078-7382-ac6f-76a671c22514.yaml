          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Until W3 and W5"
        markdown: |-
          - **Every build still writes every row** and retires all earlier rows: correct shared-rows releases, but no smaller yet. W3 makes it write the change only.
          - **The local state of release 10 is schema 5.** After W2, `cargo xtask serve`/`explore` on the real state would read tables without `retired`; nothing is run on it until W5 migrates it in place.
          - **Grid headers name their release**, so a grid's header file and row change every release though its samples (the 371 MB) are shared. Left as is: it is a few kilobytes per grid.
        tone: warning
  - key: 01a1b21d-8b77-77ba-82b9-bb3ec43e1b03
    id: w2-produced
    kind: note
    versions:
      - key: 01a1b21d-8b77-77ba-82b9-bb40f967b629
        at: 2026-11-06T18:27:23Z
        revision: 5
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "What W2 produced"
        markdown: |-
          | | Before | Schema 6 |
          |---|---|---|
          | A row | one per release, `release` leading its key | valid from `release` until `retired`; key = natural key, then `release` |
          | A read of release n | `release = n` | `valid_in`: `release <= n AND (retired IS NULL OR retired > n)` |
          | A file | `releases/{n}/…` | `files/{sha256}`, once; `release_files` maps each release's paths |
          | A build | writes every row | writes every row and retires every earlier one (W3 narrows both) |
          | Prune of R2 | the release's prefix | only files no kept release maps and no other publish journal names |

          Univ Server reads every per-release table through `valid_in!`, built at compile time. Pinned reads are proved unchanged across a later release that shares, replaces and retires rows (univ-api shared_rows_tests; univ-ingest shared_rows).

          **Carried forward**
          - **W3**: write only added and changed rows; retire by key, in batches, including the rows of a shard the release no longer uses.
          - **W4**: prune rows by their validity against the releases left; publish skips files R2 already holds; live-row CON-3.
          - **W5**: migrate local release 10 (tables and R2 keys); until then publish refuses that store, and `serve`/`explore` on the real state wait.
        tone: success
