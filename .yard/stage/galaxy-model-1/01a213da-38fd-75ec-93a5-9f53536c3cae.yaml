    id: build-issues
    kind: note
    versions:
      - key: 01a213e0-731d-7518-b608-6e57f9ea7a43
        at: 2026-11-25T18:03:26Z
        revision: 3
        by:
          host: claude-code
          session: "c9af65fa-1703-4232-b229-662e70de7bff"
        title: "Issues met while building"
        markdown: |-
          | Issue | How found | Fix | State |
          |---|---|---|---|
          | Clippy of rustc 1.100 (2026-11-09) rejects `map(..).unwrap_or_default()` (8 places) and a `format!` collected into a String (1 test), in code this wave did not touch, so the gate fails | `cargo clippy --workspace --all-targets -D warnings` | `map_or_default`, and `fold` with `writeln!` | fixed |
          | Azimuth conventions of the far-side papers are not yet known; converting a value in the file would break the cell check (a value must appear in its cited cell) | reading `structures/check.rs` | the files keep each value as printed; the convention is a cited field the code applies | open |
      - key: 01a213f3-ecc3-7356-a1be-83bb4beb8bdc
        at: 2026-11-25T18:24:42Z
        revision: 10
        by:
          host: claude-code
          session: "c9af65fa-1703-4232-b229-662e70de7bff"
        title: "Issues met while building"
        markdown: |-
          | Issue | How found | Fix | State |
          |---|---|---|---|
          | Clippy of rustc 1.100 rejects `map(..).unwrap_or_default()` (8 places) and a `format!` collected into a String, in code this wave did not touch | `cargo clippy --workspace` | `map_or_default`; `fold` with `writeln!` | fixed |
          | Node 26's own `localStorage` hides jsdom's: 22 explorer tests failed before this wave | `pnpm exec vitest run` on the base | `--no-experimental-webstorage` for the tests | fixed |
          | An entry's position had to be equatorial; Sanna's and Dame's papers give l and b | reading `entry/position.rs` | galactic positions allowed, rotated by the Hipparcos rotation | fixed |
          | `assumes` with a citation took only `cosmology:` | the tracer files | `stated:` accepted as an alias | fixed |
          | A sexagesimal value failed its cell check (`18h12m02.6822s` vs `18 12 02.6822`) | the Lin files | a cell holds the published form when their figures match in order | fixed |
          | Tracer files named with dots are not slugs | the reader | dots became hyphens | fixed |
          | Free text of the tracer files held uncited numbers | the reader's free-text rule | reworded by the tracer reader | fixed |
          | `width` was required; Sun 2024 and McClure-Griffiths 2004 give none | the far-fit drafts | optional | fixed |
          | Dame & Thaddeus 2008's far 3-kpc arm states no pitch | the far-fit drafts | left out, as decided | settled |
          | Sun 2024 does not define φ's zero point or sense; read as Reid's β, the only reading within 5 kpc of the tracers | conventions tested against Dame's clouds | `convention` note in the files | settled |
          | McClure-Griffiths 2004's own radii and distances do not agree with each other; the arm is read from its figure, estimated, and is the Outer arm only by the literature's reading | the far-fit reader | noted in the file | open, for the model's weighting |
          | The `model-spiral-arms` check counted every spiral structure as Reid's 14 | the new structures | counts Reid's ids | fixed |
          | The checks' SQLite has no `sqrt` | the scan-guard test | registered like `sep_arcmin` | fixed |
