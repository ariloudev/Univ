        title: "What the build produced"
        markdown: |-
          Milky Way release 3 (`scripts/mw-build.sh`, `--structures-of galaxy_tracers`): 17,390,649 objects, 17,260,573 placed, **22 structures** (Reid 2019's seven arms; Sun 2024's outer Scutum–Centaurus and Outer; Hyland 2026's Perseus; McClure-Griffiths 2004's distant arm; each fitted and extrapolated), 18 researched arm tracers.

          | Tracer | Nearest path | kpc |
          |---|---|---|
          | Lin 2026, 7 masers | Reid Sgr–Car extrapolated, Reid Perseus extrapolated, Hyland Perseus | 0.19–0.88 |
          | Sanna 2017 | Sun 2024 OSC extrapolated | 1.96 |
          | Dame & Thaddeus 2011, 10 clouds | Sun 2024 OSC | 1.45–4.82 |

          PASS: arm-tracers-near-their-arms, arm-tracers-placed-on-their-arms, model-spiral-arms (14 of Reid), masers-members-of-their-arms (181), masers-on-the-arm-their-code-names, tracers-name-their-kind (after molecular clouds joined its list, spec approved). The 25 other failing checks error for want of the extragalactic sources a Milky Way release does not take.

          For wave 2: the release now holds the arms the Galaxy model follows.
        tone: success
