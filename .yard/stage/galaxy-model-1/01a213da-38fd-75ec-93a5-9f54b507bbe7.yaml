        title: "The gate's environment"
        markdown: |-
          | Issue | Fix |
          |---|---|
          | `cargo-machete` and `cargo-deny` were not installed: the toolchain is now Homebrew's Rust 1.100 | `cargo install --locked cargo-machete cargo-deny` |
          | Homebrew's `rust` has no `wasm32-unknown-unknown`; rustup's stable 1.100 has it | the gate runs with `/opt/homebrew/opt/rustup/bin` first on the path |
          | RUSTSEC-2026-0592, a stack overflow in `url` 2.5.8 | `url` 2.5.9 |
          | RUSTSEC-2026-0542, `humantime` unmaintained as chrono is, with no successor | ignored in `deny.toml` with its reason, as bincode's is; it only formats RFC 3339 timestamps |
        tone: warning
