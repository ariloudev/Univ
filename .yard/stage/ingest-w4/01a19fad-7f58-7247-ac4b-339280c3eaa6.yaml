          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Fix the /code-review and /simplify findings"
        detail: |-
          Each fix comes with a test that failed before it.

          **Science**
          - CF4 groups with DMav = 0 (228 of them) are direct TRGB, Cepheid or maser calibrations, so their distances are now primary-indicator distances (ReadMe table3 Note 1).
          - Each distance names its measure; a modulus gives a luminosity distance.
          - A modulus error maps to the exact interval d·10^(∓σ/5).
          - Dipole Repeller: 16,000 ± 4,500 km/s, as Hoffman et al. 2017 give it.
          - CfA2 Great Wall: −8.5° to 42.5°, from Gott's sample definition.
          - Mpc values in the structure files name their paper's cosmology.

          **Integrity**
          - A failed normalization leaves no stale report in provenance.
          - Ctrl-C cancels normalization within 4,096 rows.
          - A row of blank cells is counted as `blank_row`.
          - Structure citations: whole-token matches, `as_published` checked against the value, uncertainties cited, numbers in free text cited, coordinate ranges checked.

          **Hostile files**
          - FITS, NPY and ZIP input: checked sizes, NAXIS ≤ 999, non-ASCII cards refused, zip CRCs checked, unpack capped at 1 GiB, and no unbounded allocation.

          **Simplify**
          - One YAML loader and one FITS sample decoder.
          - One cz/100 helper and shared test helpers.
          - Each zip archive opened once; the grid tests split out of their file.
        state: done
        type: fix
