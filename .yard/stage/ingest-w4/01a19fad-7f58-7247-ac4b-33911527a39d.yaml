          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Catalogue entries and the normalizer"
        detail: "A univ-model `CatalogueEntry` (ICRS position and epoch, native and normalized values, kind of value, typed uncertainty, distances with kind, method, H0 and modulus, heliocentric and CMB-frame redshift with its derivation). A normalizer drives each tabular source's column map through a streaming reader shared with the download check, with FK5 to ICRS, one `CmbCorrection` per run, refusals counted per reason and machine-applied fixes counted, both kept in provenance. Done when per-source fixture rows give the expected entries for all 15 tabular sources and tests cover AC-36 to AC-53."
        state: active
