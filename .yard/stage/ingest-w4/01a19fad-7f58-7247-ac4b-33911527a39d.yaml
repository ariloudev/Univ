          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Structure files"
        detail: "The YAML structure format: every number cites its paper and its sentence, table or figure; digitised values are estimated and cite their figure; geometry is a univ-model kind in a named frame. Port the newsroom's structures, re-checking each citation. Done when the repository's structures all load and tests cover AC-54 to AC-57 (an uncited number is refused, naming the file, field and number)."
        state: open
