          | Adding columns to `sources` would not reach an existing D1 | design | new table `source_terms`, schema 4, additive like version 3 | fixed |
          | `normalization.rs` reached 510 lines | `cargo xtask lines` | `source/normalization/catalogue_error.rs` | fixed |
          | `write_release` over 100 lines; similar binding names | clippy | `manifest_sources` extracted; bindings renamed | fixed |
          | Permission request in three structs and two columns | `/simplify` | one `univ_model::api::sources::PermissionRequest`, one JSON column | fixed |
          | `is_iso_date` accepted 2026-02-31 | `/simplify` | `univ_model::time::is_calendar_date` | fixed |
          | Catalogue uncertainties untyped on write | `/simplify`, `/code-review` | `CatalogueError` defined once in univ-model, flattened in `CatalogueUncertainty` | fixed |
          | Two allocations per measurement read | `/simplify` | map by source id, then quantity | fixed |
          | `Redshift::barycentric` duplicated `heliocentric` | `/simplify` | `Redshift::measured(frame, …)` | fixed |
          | `CmbRedshift.heliocentric` held a barycentric value | `/simplify` | renamed `measured`, `heliocentric` read as an alias | fixed |
          | A catalogue error on one of several readings would mark all estimated | `/simplify` | refused unless the reading is the only one | fixed |
          | **Barycentric frame not written to D1: the API would serve DESI as heliocentric** | `/code-review` | `extra.published_frame` written for every frame other than heliocentric; DESI's fixture in W2 exercises the round trip in `object_reads` | fixed |
          | **`barycentric_redshift` not a chain parameter: one chain row per DESI object** | `/code-review` | added to `PER_OBJECT`; test that two objects share one template | fixed |
          | A catalogue error on a reading coded by kind would reach rows of another kind | `/code-review` | refused | fixed |
          | Schema v4 module doc left out `catalogue_uncertainties` | `/code-review` | doc corrected | fixed |
          | `source_terms` read with no fallback on a D1 older than v4 | `/code-review` | no change: every path that serves D1 applies the full schema first (`univ-ingest publish`'s schema unit, `xtask serve`, `integration`) | no change |
          | `uncertainty_basis` matched by source and quantity, not by value | `/code-review` | no change: a catalogue error is now refused unless its reading is the source's only redshift, so every redshift of that source carries it | no change |
          | cz → z conversion inline; basis cloned per record | `/simplify` | skipped as minor | skipped |
