          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "W1 plan"
        markdown: |-
          Within the release 10 build plan on `product/release-10`.

          | Task | Change | Verified by |
          |---|---|---|
          | w1-pending | `RedistributionStatus::PermissionPending`; `redistribution.permission: {asked_of, asked_on}`, required for that status and refused otherwise; carried to the manifest, the `sources` D1 row and the API's `terms.permission`; build summary lists pending sources | `source_definitions` / `definitions` tests; `univ-api` sources tests |
          | w1-noncommercial | `terms.non_commercial: <quoted clause>`, optional; carried to the manifest, D1 and the API's `terms.non_commercial` | same tests |
          | w1-barycentric | `RedshiftFrame::Barycentric`, moved to the CMB frame by the same dipole as a heliocentric one (Planck's dipole is the barycentre's motion; the two frames differ by ≤ 13 m/s) and kept with `published: barycentric` | `univ-model` redshift tests; a normalization test |
          | w1-catalogue-error | `normalization.redshifts[].catalogue_error: {value, unit, times_one_plus_z, basis}`, exclusive of `error`; each value gets a symmetric uncertainty marked estimated, citing `basis` | normalization tests over a fixture |
          | w1-schema | D1 schema version 4 for the new `sources` columns; OpenAPI snapshot | snapshot test, fixture build |
          | w1-review | `/simplify`, `/code-review`, fixes, `cargo xtask check`, trace, close, merge | gate exit status |
