        title: "What W1 produced"
        markdown: |-
          - **Terms.** A source definition may be `permission_pending` with `permission: {asked_of, asked_on}`, and may quote a `non_commercial` clause. The manifest, the new `source_terms` table (D1 schema 4) and `GET /v1/sources/{id}` carry both. The build summary lists pending sources.
          - **Frames.** `RedshiftFrame::Barycentric` is moved to the CMB frame by the same dipole and kept named. It has its own chain step, which is templated, and it is written to D1 as `published_frame: barycentric`.
          - **Uncertainties.** `catalogue_error` on a source's only redshift reading gives each value a symmetric error: km/s on z converted by c, optionally times (1 + z). The object API marks each such redshift `uncertainty_basis: {estimated, basis}`.
          - **For W2:** DESI's definition uses `frame: barycentric`; 2dFGRS, 2MPZ and WISE×SuperCOSMOS use `catalogue_error`; 2MPZ, WISE×SuperCOSMOS and GAMA use `permission_pending`; 2dFGRS and ALFALFA use `non_commercial`.
        tone: success
