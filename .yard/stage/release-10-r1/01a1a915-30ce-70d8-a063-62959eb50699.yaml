          **Judgment: still unclear for 2MPZ and WISE×SuperCOSMOS.** No page grants or refuses redistribution of the SSA catalogues. The copyright summary they defer to is unlinked, and WFAU's one fair-use statement, though written for UHS, discourages passing on "massive subsets". WISE×SuperCOSMOS's 20 M rows would be such a subset. Recommended: write to the archive contact on the page (mar@roe.ac.uk) and to the catalogue author (M. Bilicki), and publish once they reply.

          **Correction:** Univ Ingest's redistribution statuses are only `permitted`, `permitted_with_credit` and `forbidden` (`crates/univ-ingest/src/source/mod.rs`). There is no status for a source that is waiting for permission. Holding one back would need a fourth status, refused like `forbidden`, in the spec, or the source definition written only once the reply arrives.
