  - key: 01a1a92b-885c-71a5-a921-4c91ff3e52ef
    id: surveys-weighed-deep
    kind: note
    versions:
      - key: 01a1a92b-885c-71a5-a921-4c9a36749425
        at: 2026-11-05T00:46:04Z
        revision: 8
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "DESI DR1, Euclid and COSMOS-Web groups"
        markdown: |-
          | Survey | Objects after cuts | Coverage | Redshifts | Terms | Judgment |
          |---|---|---|---|---|---|
          | DESI DR1 (`zall-pix-iron`, `ZCAT_PRIMARY`, `OBJTYPE='TGT'`, `ZWARN=0`) | 13,049,402 galaxies + 1,553,713 QSOs in the Main Survey; ~15.8 M with SV and special programmes | ~9,700 deg² bright, ~9,500 dark | spectroscopic, **barycentric** ("vacuum barycentric"), with `ZERR`; galaxies to z = 1.7 | CC BY 4.0: "free to share, copy, redistribute … for any purpose, including commercially, as long as they Cite … Indicate if any changes are made … Include the following acknowledgments text" | permitted with credit |
          | Euclid Q1 photo-z (`phz_classification = 2`, `phz_flags = 0`) | 12,937,426 | **63.1 deg²** (three deep fields) | photometric, z 0–6; asymmetric 70% interval; Q1 grism redshifts only ~27% reliable, not taken | CC BY-NC 3.0 IGO; websites must "display the ESA Euclid logo" | permitted with credit, non-commercial |
          | Euclid DR1 | not public; ESA lists "12 November 2026 — DR1-Foundation" (~1,900 deg²), marked tentative | | | | |
          | COSMOS-Web groups (Toni et al. 2025) | 1,678 (665 at ~90% purity, `SN_NOCL` ≳ 10) | 0.45 deg² | **photometric** group z, 0.08–3.7, to 2 decimals; frame and epoch not stated | no licence stated; the A&A article is CC BY 4.0; CDS: free "in a scientific context" with citation | unclear: ask the corresponding author |

          Sources: DESI Collaboration 2026, AJ 171, 285 (doi:10.3847/1538-3881/ae4c43); Aussel et al. 2026, A&A 711, A1 (doi:10.1051/0004-6361/202554610); Toni et al. 2025, A&A 697, A197 (doi:10.1051/0004-6361/202553759).

          Notes for the spec:

          - **DESI** is the size that needs shards. Release 10 with DESI, the rest of BOSS/eBOSS, 2dFGRS and ALFALFA would be about 21 M objects before cross-matching, about 15–18 GB.
          - **DESI positions** are ICRS at a per-row `REF_EPOCH`, and its redshifts are barycentric. univ-model has no barycentric redshift frame yet. It differs from heliocentric by at most ~13 m/s, but it has to be named, not relabelled.
          - **Euclid Q1** packs ~13 M points into 63 deg² to z = 6, and **COSMOS-Web** is 0.45 deg² to z = 3.7. Both are pencil beams that would need the deep-field scale domain the earlier deferral named. The `cosmic_web` octree would split very deep around them otherwise.
  - key: 01a1a92b-885c-71a5-a921-4c922917527f
    id: weighed-summary
    kind: note
    versions:
      - key: 01a1a92b-885c-71a5-a921-4c9bc71313eb
        at: 2026-11-05T00:46:04Z
        revision: 8
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "What the weighing produced"
        markdown: |-
          Nine candidates weighed, each with its count, coverage, redshift kind, citation and terms quoted from the provider, plus the D1 room measured on release 9.

          ```mermaid
          flowchart LR
            A[Clear terms, fits D1] --> A1[rest of BOSS/eBOSS 2.3 M]
            A --> A2[2dFGRS 0.22 M, NC]
            A --> A3[ALFALFA 25 k, NC]
            B[Clear terms, needs shards] --> B1[DESI DR1 15.8 M]
            C[Permission pending] --> C1[2MPZ 0.93 M]
            C --> C2[WISE x SuperCOSMOS 18.5 M, shards]
            C --> C3[GAMA DR4 0.30 M]
            C --> C4[COSMOS-Web groups 1.7 k, deep field]
            D[Waits for data or a domain] --> D1[Euclid: Q1 63 deg2 NC; DR1 not out]
          ```

          Left open for the owner: storage, which surveys, quasars, Euclid, non-commercial terms, and how `permission_pending` behaves.
        tone: success
