    versions:
      - key: 01a1a936-5387-7193-8c2d-05cc2bc783cf
        at: 2026-11-05T00:57:52Z
        revision: 13
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Build release 10 unattended (Yard workflow of Loft 2.3.0-alpha.5)"
        markdown: |-
          **Order of work**

          1. Once you approve the spec change above, commit `spec/` alone (`spec: release 10 ...`), record the decision views, and close and merge `stage/release-10-r1` into `product/release-10`.
          2. **Parent plan.** On `product/release-10`, enter plan mode and write the build plan: each criterion of the change mapped to its wave, task and tests. The work is large, so it is split into waves. With this permission the plan is recorded in Yard Log and I go on **without waiting for its approval**. Approving this block approves the waves it names.
          3. **Waves**, each on `stage/release-10-<wave>` cut from `product/release-10`, one at a time with no stacking:

          | Wave | Leaves done |
          |---|---|
          | W1 terms and frames | `permission_pending` (with whom and when asked), the non-commercial mark, the barycentric redshift frame, catalogue-wide estimated uncertainties; *Read a source* serves status and mark |
          | W2 sources | the seven source definitions with recorded fixtures, any new access methods (DESI files or Data Lab TAP, SuperCOSMOS SQL, GAMA FITS, VizieR), matching rules for the new pairs |
          | W3 shards in ingest | build divides objects by cell, catalogue database and manifest, publish and prune across shards, the two refusals |
          | W4 shards in the server | the Worker's shard bindings and routing, lookup through the id index, designation fan-out, page order across shards, integration tests |
          | W5 release 10 | the real fetches (in the background), build, science checks, local publish, the lookup, volume and first-points benches against QA-2 and QA-3 |

          4. **Inside each wave** (the alpha.5 workflow):
             - Write the wave's plan as a `plan` block, inside the parent plan, without waiting.
             - Register its tasks and keep each one true as it runs.
             - Keep one `build-issues` note.
             - Run focused checks between tasks.
             - End with `/simplify` then `/code-review` and fix the confirmed findings.
             - Run the full `cargo xtask check` once (plus `cargo xtask integration` for W4 and W5), committing on its own exit status.
             - Link tests in `loft.trace.yaml` and accept them.
             - Close the wave's Yard Log, commit it, and merge `--no-ff` into `product/release-10`.
          5. **Minor spec edits** (rewording, a criterion clarified to fit the platform) go in as `spec-change` blocks with a note, committed alone, without asking.

          **When I stop and ask you, as one decision point:**

          - a scope or design choice the plan doesn't settle;
          - a science judgement;
          - a major spec change: a feature, a decision superseded, a limit changed;
          - review findings I dispute;
          - a QA target missed;
          - a source that cannot be fetched or whose terms turn out stricter than recorded.

          **What I never do unattended:** merge `product/release-10` into `develop` or `main`, `loft publish`, push, write to any provider (I draft the permission requests to WFAU, M. Bilicki and GAMA for you to send), or deploy anything.

          **Downloads:** DESI DR1 is 22.4 GB as files. I try Data Lab TAP column subsets first. WISE × SuperCOSMOS is a 1.7 GB CSV.
