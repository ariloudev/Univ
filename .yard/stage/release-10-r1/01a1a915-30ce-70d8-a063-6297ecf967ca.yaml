  - key: 01a1a931-b85b-74d7-85fd-ea4a770e6c9d
    id: approve-spec-change-1
    kind: approval
    versions:
      - key: 01a1a931-b85b-74d7-85fd-ea4c9eb05266
        at: 2026-11-05T00:52:50Z
        revision: 11
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Approve the release 10 spec change"
        markdown: |-
          The change above says what release 10 is. It is not committed yet, and no code follows until it is approved.

          **Storage**

          - New decision *Shard a release's objects across several D1 databases* supersedes ADR-13, *Keep every object in D1 until a DESI-sized source arrives*.
          - *Build a release* gains a requirement: objects are split into object shards **by cell of the cell index**. A cell is never split. An object without a position goes to a shard by its id. The catalogue database holds sources, terms, structures, grids and an index from object id to shard. A cell too big for one shard refuses the build.
          - *Publish* fills the catalogue database and the shards, and refuses a release that needs more shards than Univ Server binds. *Prune* deletes rows from every shard.
          - CON-3 now caps **each** database at 10 GB, with 4.5 GB per release in each.
          - QA-2 and QA-3 keep their targets (200 ms and 500 ms at the 95th percentile). Their scenarios now say they are measured on a release that spans several shards.
          - A new volume-query criterion keeps page order independent of which shards the results come from.

          **Sources and terms**

          - New decision *Add DESI DR1 and seven more galaxy surveys to release 10*, with a new requirement listing them: DESI DR1, SDSS DR17 distant galaxies and quasars, 2dFGRS, GAMA DR4, ALFALFA α.100, 2MPZ, and WISE × SuperCOSMOS. Quasars are included. Euclid and the COSMOS-Web groups are deferred.
          - Ten new Components under *Data providers*: three new providers (DESI, the SuperCOSMOS Science Archive, GAMA) and their sources, plus the new SDSS, VizieR sources.
          - AC-7 adds the status **permission pending**, which names whom permission was asked of and when. New decision *Publish a source while its permission is pending* records your choice: pending sources are included everywhere, with no deployment guard.
          - New decision *Admit sources for non-commercial use, marked as such*. Such a source quotes the clause that limits it, and *Read a source* serves the mark beside the redistribution status.

          **Normalization**

          - A **barycentric** redshift (DESI) is kept as measured and named barycentric.
          - An uncertainty a source states once for its whole catalogue (2dFGRS's 85 km/s, 2MPZ's σz = 0.015) is given to each value as an **estimated** uncertainty, with its citation.

          **Worth a look:** sharding by cell keeps a volume query to the few shards it touches. A lookup by designation, though, may read every shard.
