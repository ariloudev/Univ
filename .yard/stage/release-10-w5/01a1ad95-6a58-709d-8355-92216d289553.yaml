  - key: 01a1ad98-dfd7-70a0-8108-ce561f9e541c
    id: q-unsent-api
    kind: question
    versions:
      - key: 01a1ad98-dfd7-70a0-8108-ce58c78fed0d
        at: 2026-11-05T21:23:59Z
        revision: 12
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        prompt: "How should /v1/sources serve a permission-pending source whose request is not yet sent?"
        header: "Unsent in /v1"
        context: |-
          The spec now lets a pending source leave its asked date empty until the request is sent (`a1383f6`). Today the API's `terms.permission` is `{asked_of, asked_on}`, both required.

          Making `asked_on` optional fails the OpenAPI snapshot test: *Read the OpenAPI document* holds that a change within `/v1` only adds, and a required field becoming optional counts as taking something away (`/components/schemas/PermissionRequest/required/1: "asked_on" is no longer listed`).

          No client in the repository reads `permission`; the explorer does not. Nothing has been deployed.
        options:
          - label: "Add a new field"
            detail: "Additive, so /v1's contract holds. `terms.permission` keeps both fields required and appears once a request is sent. A pending source not yet asked serves a new optional `terms.permission_to_ask: {asked_of}`. Two fields say one thing for a while, but no client of /v1 can break."
            recommended: true
          - label: "Optional in /v1"
            detail: "`asked_on` becomes optional in `terms.permission`, and the snapshot is rewritten. Simplest, and no client today reads it, but it breaks the rule the spec and the test hold for /v1. It needs that rule amended for this one change: a spec change for your approval."
          - label: "A new API version"
            detail: "Sources move to /v2 with `asked_on` optional, and /v1 keeps serving the old shape. Correct by the rule but heavy for one field: a second version of the route, its OpenAPI document and tests."
    responses:
      - key: 01a1ad9a-2a0a-7660-89ae-5f4dfba82bf7
        at: 2026-11-05T21:25:24Z
        revision: 13
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "Add a new field"
  - key: 01a1ad9a-4836-77e0-857c-c47edaa096ef
    id: d-unsent-api
    kind: decision
    number: 4
    versions:
      - key: 01a1ad9a-4836-77e0-857c-c47ff9e0d8ea
        at: 2026-11-05T21:25:31Z
        revision: 14
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "An unsent request is served in a new optional field"
        consequence: "`terms.permission` keeps `asked_of` and `asked_on` required, and appears once a request is sent. A pending source not yet asked serves `terms.permission_to_ask: {asked_of}` instead. The OpenAPI document only gains, so /v1's contract holds. Definitions and the release manifest keep one request with an optional date; the API splits it."
        question: 01a1ad98-dfd7-70a0-8108-ce561f9e541c
