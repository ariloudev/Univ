          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "2MPZ as a prepared source"
        detail: |-
          `sources/twompz.yaml` reads `twompz.csv.gz` (934,175 rows, SHA-256 10df357b…) from Univ/downloads/univ-ingest/twompz; the file and the script's 2,968 parts are there. `scripts/fetch-twompz.py` writes there by default, and now fails on an incomplete join. 2MPZ joins the 2MASX scheme, with seven pairs at 13,500 km/s (3 × 0.015 in cz). The fixture is 8 real rows; its test is in `tests/pending_surveys.rs`.

          Two findings shaped the definition:
          - The 934,175 are the 928,352 sources of version 1.1 plus 5,823 supplementary sources added on 2016-06-06 (TWOMPZ page).
          - Only `zPhoto` is taken. A source may carry a catalogue-wide error on one redshift only. `zSpec` repeats the training surveys' redshifts, which release 10 holds from those surveys. It also carries two sentinels, -999 and -9.999995E008, five impossible values below -0.002, and 83 near-zero values on galaxies the photo-z puts beyond z = 0.04.
        state: done
