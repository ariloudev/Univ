      - key: 01a1ada1-329a-77f9-ad5b-bff619df4716
        at: 2026-11-05T21:33:05Z
        revision: 18
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "The prepared access method"
        detail: "`method: prepared` names `file` (a `.csv.gz` in the source's download directory), `script`, `sha256` and `rows`. Acquisition never fetches it. It refuses a missing file, naming the script, and a file whose SHA-256 or row count differs, naming both values. A good file is recorded in provenance with `prepared_by`. Normalization reads it as a gzipped CSV. Five tests in `tests/prepared.rs`, which also check that no request reaches the mirror."
        state: done
