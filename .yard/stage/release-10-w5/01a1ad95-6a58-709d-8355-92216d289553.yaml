        title: "GAMA DR4 and WISE × SuperCOSMOS in sources/, fetched"
        detail: |-
          Both fetched (1.8 GB in 1 min 55 s), and normalized offline with 2MPZ in 21 s, peaking at 11.9 GB. Every count matches:
          - WISE × SuperCOSMOS: 20,412,353 kept and 3,789 left out = 20,416,142, the page's count;
          - GAMA DR4: 238,716 of 344,905, the definition's count;
          - 2MPZ: all 934,175.

          WISE's 3,789 left out are designations on two rows: one galaxy within 0.1″, matched once to WISE all-sky and once to AllWISE. The first row is kept, the all-sky one for 3,788 of them; this is now recorded in the definition (`512adf6`).
        state: done
