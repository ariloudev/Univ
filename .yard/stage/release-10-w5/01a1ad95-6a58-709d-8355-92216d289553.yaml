          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Source definitions accept a pending source without a date"
        detail: "Definitions and the release manifest hold a `Permission` with an optional `asked_on`, and the date is checked when given. /v1 serves a sent request as `terms.permission` (both fields required, unchanged) and an unsent one as the new `terms.permission_to_ask: {asked_of}`, per the owner's decision. The OpenAPI document only gains. The build's report names an unsent request as \"to ask of …, not yet sent\". New tests: `a_pending_source_not_yet_asked_names_whom_and_no_date`, and the sources handler test for both fields."
        state: done
