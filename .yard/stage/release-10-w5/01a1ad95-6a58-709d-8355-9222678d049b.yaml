  - key: 01a1adf8-4dcb-7498-b7d2-e738ef825d3d
    id: science-10-second
    kind: note
    versions:
      - key: 01a1adf8-4dcb-7498-b7d2-e73c06f3d511
        at: 2026-11-05T23:08:13Z
        revision: 29
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Release 10, rebuild: science checks"
        markdown: |-
          Rebuild with the extent rule fixed: 43,023,589 entries, 36,945,904 objects (1,269 fewer), peak 55.06 GB, 931 s. Science: **31 PASS, 2 FAIL, 3 CONCERN, 2 INFO**. The concerns are unchanged.

          **local-group-duplicates: 441 → 240 pairs.** 206 of them are two DESI fibres alone. They form 129 clusters (300 objects) of 2 to 8 fibres within 1′, at one cz to within a few km/s: HII regions or knots of one dwarf galaxy. For example, 8 fibres at RA 337.111°, Dec +30.295° span 599–677 km/s, and three clusters near RA 144.78°, Dec −2.80°, all at 400 km/s, look like one galaxy about 4′ across. No source of the release gives these galaxies an extent, so the extent rule has nothing to join them to. The matching rules say "Entries of one source are never candidates for each other: a source lists a body once", which DESI does not hold to for extended nearby galaxies.

          **New FAIL, nothing-inside-1-mpc-outside-local-group: 1.** This one comes from the fix. IC 1613's object now holds an ALFALFA detection and about ten DESI fibres as pieces. It takes ALFALFA's HI centroid as its position, 1.7′ from McConnachie's optical centre, so Cosmicflows-4 group 3844, on the optical centre, is no longer within 1′ of a Local Group galaxy.

          The cause is the position rule. With no published position error, the tie goes by class and then entry order, and ALFALFA sorts first: **16,174 objects take ALFALFA's HI centroid** over an optical position. A piece is also off-centre by construction: a fibre on an HII region could become a galaxy's position the same way.
        tone: warning
  - key: 01a1adf8-4dcb-7498-b7d2-e739b93307f2
    id: q-position
    kind: question
    versions:
      - key: 01a1adf8-4dcb-7498-b7d2-e73d6c86a93b
        at: 2026-11-05T23:08:13Z
        revision: 29
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        prompt: "Which entry should give an object its sky position when no entry publishes a position error?"
        header: "Position"
        context: "The spec: \"take an object's sky position from its catalogue entry with the smallest position uncertainty\", with Gaia over Hipparcos over any survey. Among surveys without errors the tie falls to entry order, which is alphabetical by source, so ALFALFA (new in release 10) wins: 16,174 objects take an HI centroid that is good only to tens of arcseconds (beam 3.5′). Pieces the extent rule joins are off-centre by construction."
        options:
          - label: "Galaxy's own, HI last"
            detail: "Two rules. An object that took pieces takes the position of the galaxy whose extent took them, its UNGC or 2MRS entry, never a piece. Among the rest, an HI survey's position (ALFALFA) ranks after optical and infrared surveys. Fixes IC 1613 and the 16,174 objects. Adds a criterion to *Choose the preferred measurement*, a minor spec change, and code in the ranking."
            recommended: true
          - label: "HI last only"
            detail: "Only ALFALFA ranks last. Simpler, and fixes IC 1613 if no DESI fibre on it sorts before McConnachie: fibres come from desi-dr1, which sorts before mcconnachie-2012, so a fibre on an HII region could still give the galaxy's position."
          - label: "Leave it"
            detail: "Keep the rule; record the IC 1613 case as an exception of the check. The 16,174 HI positions stay."
