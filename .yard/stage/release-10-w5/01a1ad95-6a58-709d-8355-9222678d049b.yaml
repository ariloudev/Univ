        title: "Build release 10: the full ingest"
        markdown: |-
          **What runs:** `univ-ingest build --offline` over all 28 definitions in `sources/`, reading only `Univ/downloads/univ-ingest` (every source's download is present).

          **Size:** about 43 million entries: the rehearsal's 21.2 M, plus 2MPZ, GAMA, WISE × SuperCOSMOS and 2dFGRS (21.8 M).

          **Memory and time:** the rehearsal measured 1,373 B per entry, so the peak should be about **59 GB** of the machine's 137 GB, and the run about 6 to 10 minutes. The rehearsal stopped at tiles; writing the release may add to the peak. Disk: 961 GB free.

          **What it writes:**
          - release 10 to `.cache/univ-ingest/build/releases/10`;
          - once the release is complete and checked, the id state to `.cache/univ-ingest/state`.

          A failed run uses up no release number and leaves the state as it was. Nothing is published, pushed or deployed.

          **To run it yourself and watch** (you preferred this for the rehearsal):

          ```
          /private/tmp/claude-501/-Users-admin-Locap-Univ/0dff9621-d0e9-418a-9aee-e82062f9f784/scratchpad/scripts/build-release-10.sh
          ```

          It streams the log, prints the footprint every 5 s, and ends with entries, peak, bytes per entry and time. Approve and I run it myself; or reject with "I'll run it", and tell me when it ends.
