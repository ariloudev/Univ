        markdown: |-
          **Before the run, rewinding the first build.** Release 10 has not been published anywhere:
          - `.cache/univ-ingest/state/current` points back to `states/9`;
          - the first build's `states/10` and `build/releases/10` (38 GB) move to `.cache/univ-ingest/discarded/first-10/`, which git ignores. I delete them once the rebuild passes, unless you say otherwise.

          **The run.** The same full build as before, `univ-ingest build --offline` over all 28 sources: about 15 minutes, peaking near 55 GB. Then `cargo xtask science` (about 18 minutes).

          To run it yourself instead: the same script, `/private/tmp/claude-501/-Users-admin-Locap-Univ/0dff9621-d0e9-418a-9aee-e82062f9f784/scratchpad/scripts/build-release-10.sh`, after the rewind above. Reject with "I'll run it" and I do only the rewind.

          If duplicates remain where no source publishes the galaxy's extent, I stop and ask before anything is published.
