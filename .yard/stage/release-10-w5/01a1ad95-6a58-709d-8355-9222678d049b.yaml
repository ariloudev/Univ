        prompt: "What should happen to the 129 clusters of DESI fibres on one nearby galaxy that no other source lists?"
        header: "DESI fibres"
        context: "300 DESI objects in the nearby volume (cz below about 1,000 km/s) stand 2 to 8 to a galaxy, within 1′ of each other at one cz. No source of the release lists these galaxies or their extent. Today's rule never matches two entries of one source."
        options:
          - label: "Join them nearby"
            detail: "A new rule for the fibre surveys (DESI, SDSS, 2dFGRS, GAMA, 6dFGS): below 1,000 km/s, fibres of one survey within 1′ and 300 km/s of each other are pieces of one galaxy, the same tolerances as the extent rule. The galaxy keeps every fibre's redshift, and its position is the brightest… rather, the first fibre's. Minor spec change to *Cross-match catalogues*; new matching code and tests."
            recommended: true
          - label: "Leave out"
            detail: "A DESI target below 1,000 km/s that matches no other source's entry is left out. Simple, but discards redshifts of nearby dwarfs that DESI alone measured."
          - label: "Accept for now"
            detail: "Publish release 10 with the 240 pairs as a known limitation; the check stays FAIL. Revisit in a later wave."
