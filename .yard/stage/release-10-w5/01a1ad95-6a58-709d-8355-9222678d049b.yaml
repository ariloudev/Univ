        title: "Release 10, third build: science checks"
        markdown: |-
          Third build: 43,023,589 entries, 36,944,696 objects, peak 55.12 GB, 845 s. Science: **32 PASS, 1 FAIL, 3 CONCERN, 2 INFO**, the same as release 9's apart from the duplicates.

          | | First build | Second (extent) | Third (fibres, position) |
          |---|---|---|---|
          | local-group-duplicates | 441 | 240 | **30** |
          | nothing inside 1 Mpc outside the LG | PASS | FAIL (IC 1613) | PASS |
          | nearby-galaxy points drawn | 13,372 | 13,116 | 12,941 |

          The 30 left have three causes:
          - about 8: a WISE × SuperCOSMOS photo-z merged with a fibre blocks the extent rule's velocity check;
          - about 10: an ALFALFA detection that met several fibres of one galaxy keeps candidate links after the fibres join;
          - 11: DESI galaxies wider than 1′, which complete linkage keeps as two groups.
        tone: info
