  - key: 01a1add3-0be9-7149-926d-89a37cdd379c
    id: science-10-first
    kind: note
    versions:
      - key: 01a1add3-0be9-7149-926d-89a53a065175
        at: 2026-11-05T22:27:31Z
        revision: 26
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Release 10, first build: science checks"
        markdown: |-
          `cargo xtask science` on the first build: 38 checks, **32 PASS, 1 FAIL, 3 CONCERN, 2 INFO**. Loading 1,214 D1 files took 798 s and the checks 277 s.

          | Check | Release 9 | Release 10 |
          |---|---|---|
          | local-group-duplicates | PASS | **FAIL, 441 pairs** |
          | coma-ngc4889 | CONCERN | CONCERN, identical |
          | redshift-conflicts | CONCERN, 154 | CONCERN, 278 |
          | redshift-conflicts-placed-high | CONCERN, 47 | CONCERN, 103 |

          **The failure.** Nearby galaxies were entered twice, 443 pairs before the two known exceptions:
          - 350 pairs are two DESI fibres on one galaxy;
          - about 70 are a DESI fibre beside DDO 125, NGC 4190, DDO 190 and others as UNGC, Cosmicflows-4 and McConnachie hold them;
          - the rest involve ALFALFA and WISE × SuperCOSMOS.

          The extent rule joins the pieces of an extended nearby galaxy, but its `pieces` list named only the pre-release-10 surveys. Fixed in `223718d`: DESI, SDSS distant, 2dFGRS, GAMA, ALFALFA, 2MPZ and WISE × SuperCOSMOS may now be pieces, and univ-ingest's tests pass. A pair of DESI fibres on a galaxy whose extent no source publishes would still stay apart; the rebuild will show how many remain.

          **The concerns.** Coma is unchanged from release 9. The conflicts grew with the new sources. In the examples they are real disagreements beyond 5σ, with each photo-z's catalogue error counted: 2MPZ's photo-z against 2M++'s estimated cz for one 2MASX galaxy, and WISE photo-z between SDSS redshifts.

          Release 9 also fails `fingerprints` against today's loader: it was built before the schema changed. Release 10 passes it.
        tone: warning
