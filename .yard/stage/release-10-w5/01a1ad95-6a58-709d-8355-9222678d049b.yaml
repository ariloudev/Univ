        title: "Position and nearby-fibre fixes"
        detail: |-
          Spec `a8ff8eb`; code `c56d226`; tests and trace `a3440ea`.
          - **Fibre pass:** a fourth matching pass. Below 1,000 km/s, fibres of DESI, SDSS (both), 2dFGRS, GAMA or 6dFGS join one galaxy when each lies within 60″ and 300 km/s of every fibre already joined. Two groups that each hold an identity source's entry, or that a link joins, stay apart. A joined fibre records `fibres_of_one_galaxy`.
          - **Anchor:** a group that took pieces is anchored at its galaxy, so each piece's resolution leads back to it.
          - **Position:** an object that took pieces never takes a piece's position (one reached through an extent or fibre join), and the new class `beam` (ALFALFA) ranks after `survey`.

          The OpenAPI document gained `fibres_of_one_galaxy` and `beam`. univ-model, univ-ingest and univ-api tests pass; clippy and fmt are clean; all 479 nodes are linked.

          One effect to watch: M51 now takes UNGC's centre, which the extents test records as 2.35′ north of the 2MASX nucleus, as the rule you chose asks.
        state: done
