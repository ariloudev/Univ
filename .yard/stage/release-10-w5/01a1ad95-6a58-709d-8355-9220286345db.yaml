        title: "What the audit showed"
        markdown: |-
          | Check | Result |
          |---|---|
          | Code paths to the downloads | One: `--cache` of fetch, normalize, match, tiles and build. The release's source rows and its check get it from there. |
          | Publish, prune, xtask, scripts, explorer | Don't read the downloads; their folders did not move. |
          | Old path inside the downloads, state or built releases | None found. |
          | Hand-run tests on the real files | `grids` and `outlines_real` pass with the new default. |
          | A real fetch | 2dFGRS's chunks and provenance land in the new folder; univ-server/.cache gains nothing. |
          | Docs and memory | AGENTS.md and the umbrella CLAUDE.md updated; no memory names the old path. |

          The one limit, unchanged by the move: commands run from the repository root, and a worktree elsewhere sets `UNIV_INGEST_CACHE`.
        tone: success
