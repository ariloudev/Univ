        title: "Find every reader and writer of the downloads"
        detail: |-
          One path into the downloads: `--cache` of fetch, normalize, match, tiles and build (default `../downloads/univ-ingest`, or `UNIV_INGEST_CACHE`). Everything that reads them gets it from there: acquisition, provenance, the release's source rows and its check.

          Unaffected, since their folders did not move:
          - publish and prune: build, state, wrangler;
          - xtask: `serve`, `explore`, the benches and `integration` use wrangler or the fixture state; `science` reads a built release;
          - `scripts/r2-batch.mjs`;
          - the explorer.

          No file in the downloads, the id state or the built releases records the old path. No memory names it. Docs are updated. The hand-run tests in `grids.rs` and `outlines_real.rs` read it through `cache_dir()`, which follows the new default. All non-ignored tests use their own temporary caches.

          One limit, the same as before the move: the default is relative, so commands run from the repository root. A git worktree elsewhere needs `UNIV_INGEST_CACHE` set.

          To write the new folder: the 2MPZ script, when it enters the repository in the next stage.
        state: done
