              "nodes": [
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d658085bf5c8",
                  "kind": "product",
                  "label": "P-1",
                  "name": "Univ Ingest",
                  "parent": null
                },
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d6593dd0cb35",
                  "kind": "feature_group",
                  "label": "FG-1",
                  "name": "Acquisition",
                  "parent": "01a19f1a-685d-7357-b67e-d658085bf5c8"
                },
                {
                  "change": null,
                  "key": "01a19f22-2ad9-716e-876f-1831f423e25f",
                  "kind": "feature",
                  "label": "F-1",
                  "name": "Define a source",
                  "parent": "01a19f1a-685d-7357-b67e-d6593dd0cb35"
                },
                {
                  "change": null,
                  "key": "01a19f22-2ad9-716e-876f-183a6daa9364",
                  "kind": "requirement",
                  "label": "RQ-3",
                  "name": "Univ Ingest shall record in each source definition whether its terms permit redistributing its data, with the terms it rests on.",
                  "parent": "01a19f22-2ad9-716e-876f-1831f423e25f"
                },
                {
                  "change": "changed",
                  "key": "01a19f22-2ad9-716e-876f-183b90085a10",
                  "kind": "criterion",
                  "label": "AC-7",
                  "name": "The redistribution status is permitted, permitted with credit, permission pending, or forbidden.",
                  "parent": "01a19f22-2ad9-716e-876f-183a6daa9364"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-58fcaa8b8bee",
                  "kind": "criterion",
                  "label": null,
                  "name": "A source whose status is permission pending names whom permission is asked of, and the date it was asked once the request is sent.",
                  "parent": "01a19f22-2ad9-716e-876f-183a6daa9364"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-58fd8e368264",
                  "kind": "criterion",
                  "label": null,
                  "name": "A source whose terms allow only non-commercial use is marked non-commercial, with the clause that says so quoted.",
                  "parent": "01a19f22-2ad9-716e-876f-183a6daa9364"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-58fec7b6f3d1",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall provide a source definition for each source that release 10 adds.",
                  "parent": "01a19f22-2ad9-716e-876f-1831f423e25f"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-58ff5749b30b",
                  "kind": "criterion",
                  "label": null,
                  "name": "The spectroscopic sources are DESI DR1 redshifts, SDSS DR17 distant galaxies and quasars, 2dFGRS and GAMA DR4 redshifts.",
                  "parent": "01a1a931-2c8a-73a8-91f2-58fec7b6f3d1"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-5900bff82962",
                  "kind": "criterion",
                  "label": null,
                  "name": "The 21 cm source is ALFALFA α.100.",
                  "parent": "01a1a931-2c8a-73a8-91f2-58fec7b6f3d1"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-59016fa68370",
                  "kind": "criterion",
                  "label": null,
                  "name": "The photometric redshift sources are 2MPZ and WISE × SuperCOSMOS photometric redshifts.",
                  "parent": "01a1a931-2c8a-73a8-91f2-58fec7b6f3d1"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-5902c9bf1383",
                  "kind": "criterion",
                  "label": null,
                  "name": "The quasars of DESI DR1 and SDSS DR17 are taken beside their galaxies.",
                  "parent": "01a1a931-2c8a-73a8-91f2-58fec7b6f3d1"
                },
                {
                  "change": null,
                  "key": "01a19f22-2ad9-716e-876f-18443b0ddcd6",
                  "kind": "feature",
                  "label": "F-2",
                  "name": "Fetch a source durably",
                  "parent": "01a19f1a-685d-7357-b67e-d6593dd0cb35"
                },
                {
                  "change": "added",
                  "key": "01a1ad9c-dc22-72c6-99cb-1a44aeb16de5",
                  "kind": "requirement",
                  "label": null,
                  "name": "Where a source's provider serves it only through an interface that Univ Ingest cannot page, such as a form that cancels long answers, Univ Ingest shall read the source from a prepared file in its download cache, made by a script kept in the repository, after checking the file against its definition.",
                  "parent": "01a19f22-2ad9-716e-876f-18443b0ddcd6"
                },
                {
                  "change": "added",
                  "key": "01a1ad9c-dc22-72c6-99cb-1a45af5083ab",
                  "kind": "criterion",
                  "label": null,
                  "name": "The source definition names the script that prepared the file, the file, its SHA-256 and its row count.",
                  "parent": "01a1ad9c-dc22-72c6-99cb-1a44aeb16de5"
                },
                {
                  "change": "added",
                  "key": "01a1ad9c-dc22-72c6-99cb-1a46049c41ff",
                  "kind": "criterion",
                  "label": null,
                  "name": "A prepared file whose SHA-256 or row count differs from its definition's is refused, naming the file, the value expected and the value found.",
                  "parent": "01a1ad9c-dc22-72c6-99cb-1a44aeb16de5"
                },
                {
                  "change": "added",
                  "key": "01a1ad9c-dc22-72c6-99cb-1a470d130dde",
                  "kind": "criterion",
                  "label": null,
                  "name": "Univ Ingest makes no request for a prepared source.",
                  "parent": "01a1ad9c-dc22-72c6-99cb-1a44aeb16de5"
                },
                {
                  "change": "added",
                  "key": "01a1ad9c-f735-761b-8646-f276559d7943",
                  "kind": "criterion",
                  "label": null,
                  "name": "A prepared file missing from the cache fails its source, naming the script that prepares it.",
                  "parent": "01a1ad9c-dc22-72c6-99cb-1a44aeb16de5"
                },
                {
                  "change": "added",
                  "key": "01a1ad9c-dc22-72c6-99cb-1a4853c15f56",
                  "kind": "criterion",
                  "label": null,
                  "name": "The source's provenance lists the prepared file with its digest and the script that made it.",
                  "parent": "01a1ad9c-dc22-72c6-99cb-1a44aeb16de5"
                },
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d65aba28b58f",
                  "kind": "feature_group",
                  "label": "FG-2",
                  "name": "Normalization",
                  "parent": "01a19f1a-685d-7357-b67e-d658085bf5c8"
                },
                {
                  "change": null,
                  "key": "01a19f22-2ad9-716e-876f-186219f4e104",
                  "kind": "feature",
                  "label": "F-4",
                  "name": "Normalize records",
                  "parent": "01a19f1a-685d-7357-b67e-d65aba28b58f"
                },
                {
                  "change": null,
                  "key": "01a19f22-2ad9-716e-876f-18637db5e446",
                  "kind": "requirement",
                  "label": "RQ-15",
                  "name": "Univ Ingest shall convert each catalogue entry into univ-model values while keeping each native value.",
                  "parent": "01a19f22-2ad9-716e-876f-186219f4e104"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-59032696dddd",
                  "kind": "criterion",
                  "label": null,
                  "name": "An uncertainty a source states once for its whole catalogue, such as 2dFGRS's rms of 85 km/s or 2MPZ's photometric redshift scatter of 0.015, is given to each of its values as an estimated uncertainty that cites where it is stated.",
                  "parent": "01a19f22-2ad9-716e-876f-18637db5e446"
                },
                {
                  "change": "added",
                  "key": "01a1aa2d-9931-7550-bba8-ae02a06fd78a",
                  "kind": "criterion",
                  "label": null,
                  "name": "A redshift error that a source defines as a multiple of another column, such as ALFALFA's half the error on the HI line's width, is that column's value times the stated factor.",
                  "parent": "01a19f22-2ad9-716e-876f-18637db5e446"
                },
                {
                  "change": "added",
                  "key": "01a1aa2d-9931-7550-bba8-ae03b8e720b0",
                  "kind": "criterion",
                  "label": null,
                  "name": "A source read from files reads FITS binary tables or gzipped CSV tables, the latter in pieces of whole lines, so that no file is held unpacked whole.",
                  "parent": "01a19f22-2ad9-716e-876f-18637db5e446"
                },
                {
                  "change": null,
                  "key": "01a19f22-2ad9-716e-876f-186f83aad488",
                  "kind": "requirement",
                  "label": "RQ-17",
                  "name": "Univ Ingest shall keep each redshift in the frame its source published it in and derive its value in the CMB frame.",
                  "parent": "01a19f22-2ad9-716e-876f-186219f4e104"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-59042cfff012",
                  "kind": "criterion",
                  "label": null,
                  "name": "A barycentric redshift, such as DESI's, is kept as measured and named barycentric, never relabelled heliocentric.",
                  "parent": "01a19f22-2ad9-716e-876f-186f83aad488"
                },
                {
                  "change": "added",
                  "key": "01a1aa2d-9931-7550-bba8-ae0461c674ae",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall leave out the rows that a source definition's rules select out, as a query's WHERE clause would for a source read whole from a file, and count them.",
                  "parent": "01a19f22-2ad9-716e-876f-186219f4e104"
                },
                {
                  "change": "added",
                  "key": "01a1aa2d-9931-7550-bba8-ae05fcc0d255",
                  "kind": "criterion",
                  "label": null,
                  "name": "A rule's condition tests one column with exactly one of: the cell is one of a list of values, none of a list of values, or a number below a bound.",
                  "parent": "01a1aa2d-9931-7550-bba8-ae0461c674ae"
                },
                {
                  "change": "added",
                  "key": "01a1aa2d-9931-7550-bba8-ae06fd8a5b30",
                  "kind": "criterion",
                  "label": null,
                  "name": "A row a rule selects out of the source, such as another survey's redshift that GAMA re-serves or a star in a galaxy survey, is counted under the reason `outside_selection`, and the rule's basis says why.",
                  "parent": "01a1aa2d-9931-7550-bba8-ae0461c674ae"
                },
                {
                  "change": "added",
                  "key": "01a1aa2d-9931-7550-bba8-ae077f98b2cc",
                  "kind": "criterion",
                  "label": null,
                  "name": "A cell too large for a double to hold exactly, such as an SDSS specObjID, is compared with a condition's values as text.",
                  "parent": "01a1aa2d-9931-7550-bba8-ae0461c674ae"
                },
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d65bef1ca65c",
                  "kind": "feature_group",
                  "label": "FG-3",
                  "name": "Identity",
                  "parent": "01a19f1a-685d-7357-b67e-d658085bf5c8"
                },
                {
                  "change": null,
                  "key": "01a19f23-636e-7035-8185-ab97eb9c2fb9",
                  "kind": "feature",
                  "label": "F-6",
                  "name": "Choose the preferred measurement",
                  "parent": "01a19f1a-685d-7357-b67e-d65bef1ca65c"
                },
                {
                  "change": null,
                  "key": "01a19f23-636e-7035-8185-ab9dfac6edfe",
                  "kind": "requirement",
                  "label": "RQ-25",
                  "name": "Univ Ingest shall take an object's sky position from its catalogue entry with the smallest position uncertainty.",
                  "parent": "01a19f23-636e-7035-8185-ab97eb9c2fb9"
                },
                {
                  "change": "added",
                  "key": "01a1adfa-315f-708f-8cd8-bf4bc1cdc275",
                  "kind": "criterion",
                  "label": null,
                  "name": "An object that holds pieces of a nearby galaxy takes the position of the galaxy whose extent took them, never a piece's.",
                  "parent": "01a19f23-636e-7035-8185-ab9dfac6edfe"
                },
                {
                  "change": "added",
                  "key": "01a1adfa-315f-708f-8cd8-bf4cdd697c86",
                  "kind": "criterion",
                  "label": null,
                  "name": "Among positions without a published uncertainty, a position from a 21 cm survey's beam ranks after an optical or infrared survey's.",
                  "parent": "01a19f23-636e-7035-8185-ab9dfac6edfe"
                },
                {
                  "change": null,
                  "key": "01a19f23-636e-7035-8185-aba1fc8f7bbd",
                  "kind": "feature",
                  "label": "F-7",
                  "name": "Cross-match catalogues",
                  "parent": "01a19f1a-685d-7357-b67e-d65bef1ca65c"
                },
                {
                  "change": "added",
                  "key": "01a1adfa-315f-708f-8cd8-bf4d9f766f81",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall join as pieces of one galaxy the fibres of one fibre survey that lie together in the nearby volume at one velocity, where no source of the release publishes the galaxy's extent.",
                  "parent": "01a19f23-636e-7035-8185-aba1fc8f7bbd"
                },
                {
                  "change": "added",
                  "key": "01a1adfa-315f-708f-8cd8-bf4e61ca16c8",
                  "kind": "criterion",
                  "label": null,
                  "name": "Fibres of one survey join below the matching rules' velocity of the nearby volume, each within their angle and velocity tolerance of every fibre already joined.",
                  "parent": "01a1adfa-315f-708f-8cd8-bf4d9f766f81"
                },
                {
                  "change": "added",
                  "key": "01a1adfa-315f-708f-8cd8-bf4fa228b618",
                  "kind": "criterion",
                  "label": null,
                  "name": "The fibre surveys whose fibres may join are those the matching rules list.",
                  "parent": "01a1adfa-315f-708f-8cd8-bf4d9f766f81"
                },
                {
                  "change": "added",
                  "key": "01a1adfa-315f-708f-8cd8-bf5086a0f213",
                  "kind": "criterion",
                  "label": null,
                  "name": "Two groups that each hold an entry of a source naming its own galaxy are never joined as one galaxy.",
                  "parent": "01a1adfa-315f-708f-8cd8-bf4d9f766f81"
                },
                {
                  "change": "added",
                  "key": "01a1ae91-90f5-716e-b3d3-07b944951329",
                  "kind": "criterion",
                  "label": null,
                  "name": "Two groups that each hold an entry of one source other than a fibre survey, such as two ALFALFA detections, are never joined as one galaxy.",
                  "parent": "01a1adfa-315f-708f-8cd8-bf4d9f766f81"
                },
                {
                  "change": "added",
                  "key": "01a1adfa-315f-708f-8cd8-bf51d418d386",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each joined fibre records the rule as its method, its separation and its velocity difference.",
                  "parent": "01a1adfa-315f-708f-8cd8-bf4d9f766f81"
                },
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d65c50ba74e7",
                  "kind": "feature_group",
                  "label": "FG-4",
                  "name": "Releases",
                  "parent": "01a19f1a-685d-7357-b67e-d658085bf5c8"
                },
                {
                  "change": null,
                  "key": "01a19f23-636f-72bd-b194-151d9fb569d2",
                  "kind": "feature",
                  "label": "F-9",
                  "name": "Build a release",
                  "parent": "01a19f1a-685d-7357-b67e-d65c50ba74e7"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-59053781d70f",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall divide a release's objects among object shards, each a D1 database, by the cell of the cell index that holds each object.",
                  "parent": "01a19f23-636f-72bd-b194-151d9fb569d2"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-590689bd8862",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each object is in exactly one object shard, with its catalogue entries, measurements, designations and cell.",
                  "parent": "01a1a931-2c8a-73a8-91f2-59053781d70f"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-59076b96877f",
                  "kind": "criterion",
                  "label": null,
                  "name": "All the objects of one cell of the cell index are in one object shard.",
                  "parent": "01a1a931-2c8a-73a8-91f2-59053781d70f"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-5908e94d50c7",
