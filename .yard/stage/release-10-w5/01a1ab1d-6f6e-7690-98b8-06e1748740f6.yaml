  - key: 01a1ab1d-6f6e-7690-98b8-06e5f0991918
    id: build-issues
    kind: note
    versions:
      - key: 01a1ab1d-6f6e-7690-98b8-06ea81a8e9ba
        at: 2026-11-05T09:49:55Z
        revision: 1
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Build issues"
        markdown: |-
          | Issue | Found by | Fix | State |
          |---|---|---|---|
          | Astro Data Lab refuses a TAP job created with `PHASE=RUN` (HTTP 400, "Execution Phase is mandatory") and leaves one created with `phase=RUN` pending. Every DESI chunk failed. | the real fetch | The job is created without its phase and started with `PHASE=RUN` sent to its `/phase`, the UWS route every service takes. The recorded form keeps `PHASE=RUN`, so the cached Gaia chunks are still matched. | fixed |
          | 2dFGRS fetched 138,586 rows of 221,414. Its SeqNum slices stopped at 270,000, but serial numbers reach 389,712 (counted at China-VO), and the mirror once answered one slice with no rows. | the source's row-total check | Slices up to 390,000. The total check had removed the chunks, so the next run fetches them again. | fixed |
          | The 2MPZ scratch script overwrote its output directory's name with each answer, and crashed when joining the parts. | the run | Renamed; the 2,968 saved parts joined into 934,175 rows, matching the archive's count. | fixed |
