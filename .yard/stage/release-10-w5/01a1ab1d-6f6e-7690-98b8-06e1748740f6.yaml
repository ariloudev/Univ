  - key: 01a1ab1d-b09b-7278-b15d-7b8c28c14a6c
    id: q-twompz-access
    kind: question
    versions:
      - key: 01a1ab1d-b09b-7278-b15d-7b8ef75122d5
        at: 2026-11-05T09:50:12Z
        revision: 2
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        prompt: "How should Univ Ingest read 2MPZ, which the SuperCOSMOS archive serves only through an SQL form that cancels answers of more than about 500 rows?"
        header: "2MPZ access"
        context: "The spec asks that a source be described once in the repository so a release can be rebuilt from it. 2MPZ came down through the scratch script you approved: 2,968 sequential key-range queries of about 500 rows each, over several hours, with no parallel queries. No access method of ingest fits it: the archive has no file of 2MPZ and no TAP service."
        options:
          - label: "Prepared file"
            detail: "A new access method, `prepared`. The definition names the script, kept in the repository as `scripts/fetch-twompz.py`, and gives the file's SHA-256 and row count. Ingest reads the file from its cache after checking both, and never fetches it. The download already made is used as it is. Rebuilding from scratch means running the script once. A small change, and the archive is not queried again."
            recommended: true
          - label: "SSA SQL in ingest"
            detail: "A new access method, `ssa_sql`. Ingest pages the archive's SQL form itself, one query at a time, by key ranges sized to its answer limit, with ingest's retries, resumable chunks and row-total check. Everything stays inside ingest, but it is more code. The chunks would differ from the script's, so the archive is queried again: about 3,000 queries over several hours."
          - label: "Leave 2MPZ out"
            detail: "Release 10 goes without 2MPZ. WISE × SuperCOSMOS covers the same sky deeper, but with photometric redshifts about twice as uncertain at low redshift."
      - key: 01a1ab77-a996-70a7-a65f-e0f81db57a1a
        at: 2026-11-05T11:28:28Z
        revision: 5
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        prompt: "How should Univ Ingest read 2MPZ, which the SuperCOSMOS archive serves only through an SQL form that cancels answers of more than about 500 rows?"
        header: "2MPZ access"
        context: "The spec asks that a source be described once in the repository so a release can be rebuilt from it. 2MPZ came down through the scratch script you approved: 2,968 sequential queries, 934,175 rows, matching the archive's count. No access method of ingest fits it."
        options:
          - label: "Prepared file"
            detail: "A new access method, `prepared`. The definition names the script, kept in the repository as `scripts/fetch-twompz.py`, and gives the file's SHA-256 and row count. Ingest reads the file from its cache after checking both, and never fetches it. The download already made is used, and the archive is not queried again."
            recommended: true
          - label: "SSA SQL in ingest"
            detail: "A new access method, `ssa_sql`. Ingest pages the archive's SQL form itself, one query at a time, with its retries, resumable chunks and row-total check. More code, and about 3,000 fresh queries to the archive over several hours."
          - label: "Leave 2MPZ out"
            detail: "Release 10 goes without 2MPZ."
  - key: 01a1ab77-a996-70a7-a65f-e0f46035479f
    id: w5-rehearsal
    kind: note
    versions:
      - key: 01a1ab77-a996-70a7-a65f-e0f643276e0b
        at: 2026-11-05T11:28:28Z
        revision: 5
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Build rehearsal: memory"
        markdown: |-
          Measured on the sources in the cache: the 21 sources of release 9 plus DESI DR1, SDSS DR17 distant, 2dFGRS and ALFALFA α.100. Run offline, with no release built and no number used.

          | Stage | Took | Peak memory |
          |---|---|---|
          | Normalize | 11 s | |
          | Cross-match | 2.5 min | 62.5 GB resident |
          | Through tiles | 2.7 min | 67.3 GB resident, 78.8 GB footprint |

          - **Result:** 21,438,345 entries became 19,531,736 objects, with 1,906,609 merges and 78,168 candidate links. 19,455,781 are placed and 75,955 are not.
          - **Memory per entry:** about 3.7 KB at the peak.

          | Release 10 with | Entries | Projected peak, before the D1 build stage |
          |---|---|---|
          | What is fetched | 21.4 M | 79 GB, measured |
          | + 2MPZ + GAMA DR4 | 22.6 M | ~83 GB |
          | + WISE × SuperCOSMOS too | 43.0 M | ~158 GB, over the machine's 128 GB |
        tone: warning
  - key: 01a1ab77-a996-70a7-a65f-e0f59e9829fd
    id: q-wise-scope
    kind: question
    versions:
      - key: 01a1ab77-a996-70a7-a65f-e0f918c80487
        at: 2026-11-05T11:28:28Z
        revision: 5
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        prompt: "WISE × SuperCOSMOS's 20.4 million galaxies would take release 10's build to about 158 GB on a 128 GB machine. What should release 10 do with it?"
        header: "WISE × SCOS"
        context: |-
          Measured in the rehearsal note above: about 3.7 KB of memory per entry at the peak, before the D1 build stage. The plan named this risk and said to stop and ask before restructuring.

          Without WISE × SuperCOSMOS, release 10 has about 22.6 million entries. That includes 15.8 million DESI redshifts and 2MPZ's whole-sky 934,175, and needs about 83 GB.
        options:
          - label: "Leave it out"
            detail: "Release 10 is built without WISE × SuperCOSMOS. I record the memory finding and the measurements so that a later wave can make ingest leaner and bring it in whole. Release 10 stays well within memory, and no science cut has to be chosen now."
            recommended: true
          - label: "Take a bright cut"
            detail: "Take the brightest part, about 7 million galaxies, by a W1 magnitude limit. I'd read the exact limit off the file and tell you the count before building. Its brighter galaxies have the better photo-z, but the cut is a science choice that release 10's notes must state. It runs near the memory limit, about 105 GB."
          - label: "Make ingest leaner"
            detail: "Restructure ingest's in-memory entries and objects first, a wave of its own before release 10 is built. All 43 million go in, but release 10 is delayed by that wave."
