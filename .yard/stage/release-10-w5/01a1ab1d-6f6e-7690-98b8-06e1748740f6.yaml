  - key: 01a1ab1d-6f6e-7690-98b8-06e204148ae0
    id: w5-plan
    kind: plan
    versions:
      - key: 01a1ab1d-6f6e-7690-98b8-06e73373b067
        at: 2026-11-05T09:49:55Z
        revision: 1
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "W5 plan"
        markdown: |-
          This is release 10's plan for wave W5. It is recorded under your unattended permission and does not wait for approval.

          1. **Prune releases 6–8 (done) and 9 once 10 is published.** The catalogue held 9.7 GB of them against D1's 10 GB cap. Release 9 stays as `latest` until 10 replaces it.
          2. **Fetch the new sources in the background.**
             - SDSS DR17 distant and ALFALFA α.100 are in.
             - DESI DR1 and 2dFGRS are being fetched again after two fixes: a TAP job is now started through its phase, as Astro Data Lab requires, and 2dFGRS is sliced up to its highest serial number.
          3. **Add the permission-pending sources: 2MPZ, WISE × SuperCOSMOS and GAMA DR4.** They wait for your answers below.
          4. **Build release 10 and run `cargo xtask science`.** If memory (128 GB) runs out, stop and ask.
          5. **Publish locally, then prune release 9.**
          6. **Measure the benches against their targets.**
             - `bench lookup` against QA-2: 200 ms at the 95th percentile.
             - `bench volume` against QA-3: 500 ms.
             - `bench first-points` against 3 s.
          7. **Write a release note** with the counts per source and the measured shard sizes.
          8. **Draft the three permission requests** for you to send.

          Worked out with each wave: `/simplify` and `/code-review`, then `cargo xtask check` and `cargo xtask integration`, trace links accepted, the log closed, and a merge into `product/release-10`.
