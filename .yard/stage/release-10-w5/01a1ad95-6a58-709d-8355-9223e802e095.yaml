  - key: 01a1ae84-03ee-7728-aa82-b5ac7c0fb7c0
    id: publish-misplaced
    kind: note
    versions:
      - key: 01a1ae84-03ef-70a9-bb24-c2b582f82f7f
        at: 2026-11-06T01:40:49Z
        revision: 38
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Release 10 was published to the wrong local state, and moved"
        markdown: |-
          **What happened.** I ran `univ-ingest publish 10` without `--persist-to .cache/univ-ingest/wrangler`. The command's default was Wrangler's own `.wrangler/state`, so the 95-minute publish (40.5 GB, every file checked) went there, where nothing reads releases, and not to the state that serve, explore and the benches use. Release 9 was published with the option; this run left it out. The downloads move had nothing to do with it.

          **Fixed without publishing again.** No process held either state, so I moved files within one disk:
          - release 10's catalogue, its seven shards and its R2 store went into `.cache/univ-ingest/wrangler`, with its publish journal;
          - release 9's catalogue and R2 went to `.cache/univ-ingest/wrangler-release-9-set-aside/` (7.3 GB), which stands in for the planned prune of release 9;
          - univ-layers (keys and layers) stayed untouched.

          Checked: the catalogue passes `quick_check`, `latest` is 10, each shard's object count equals `release_shards`' (36,944,696 in all), and R2 holds 4,680 objects, all under `releases/10/`.

          **So it cannot recur.** `DEFAULT_PERSIST` is now `.cache/univ-ingest/wrangler`, the directory xtask reads (`bcd`).
        tone: warning
