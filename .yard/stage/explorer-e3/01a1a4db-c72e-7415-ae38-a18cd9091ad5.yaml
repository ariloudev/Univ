          - **End to end:** `cargo xtask integration` drives the explorer in Chromium against the fixture release. It covers drawing, the mouse, search by name and by designation, the address across a reload, the structures from the list and by name in the view, and an axe accessibility check.
          - **First points:** p95 172 ms on release 7, against 3 s (see `e3-qa-evidence`).
          - **Docs:** `clients/explorer/README.md` (run, use, check) and AGENTS.md.
          - **Checked live:**
            - switching from release 7 to release 6 works;
            - hovering a name says a click reads it, and the click opens the structure's panel.

          **To run it:** `cargo xtask explore`, then open http://127.0.0.1:5317/.

          **Left open:**
          - sky regions are drawn as their bounding boxes, not as HEALPix outlines;
          - picking runs on the CPU;
          - tiles are decoded on the main thread, which is fast enough at release 7's size.
