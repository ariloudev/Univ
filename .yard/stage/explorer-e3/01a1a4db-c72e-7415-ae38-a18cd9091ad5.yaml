      - key: 01a1a4f1-ace3-7432-be9f-3173cce1eed2
        at: 2026-11-04T05:04:24Z
        revision: 3
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "explorer.first_points.latency on release 7: met (sampled)"
        markdown: |-
          `cargo xtask bench first-points` at `ea383af`, on the real local state, with release 7 latest (2,085,809 placed points in 4 scale domains).

          - **Setup:** Univ Server under `wrangler dev`, read through the explorer's Vite dev server (port 5319) with an extended-tier key. Headless Chromium with WebGL2 on SwiftShader (software rendering), 1400×900, a fresh browser context for each load. Apple M5 Max.
          - **Measured:** the `univ:first-points` performance mark, from the page's start to the first frame drawn that holds points.

          | | ms |
          |---|---|
          | warm-up load (not counted: Vite transforms the modules on their first request) | 801 |
          | p50 of 10 | 155 |
          | **p95 of 10** | **172** |
          | max | 172 |

          The bound is 3,000 ms at the 95th percentile, so it is met by a wide margin. An earlier run without a warm-up gave a p95 of 809 ms, which was that cold first load. This measures a local machine and its local Worker, not a network.
        tone: success
  - key: 01a1a4f1-ace3-7432-be9f-316eae5ecbd7
    id: e3-review
    kind: task
    versions:
      - key: 01a1a4f1-ace3-7432-be9f-31748465673d
        at: 2026-11-04T05:04:24Z
        revision: 3
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Simplify and code review of E3, findings fixed"
        detail: |-
          Fixed in `ea383af` and `5898251`.

          **From code review:**
          - the bench now warms up once before its 10 loads;
          - Playwright's Chromium is installed by the tasks that need it;
          - the e2e test no longer asserts the 3 s bound, which the bench samples;
          - hovering a structure's name says a click reads it, so a point under a name is not taken silently;
          - name boxes are measured, not estimated;
          - the structure test has no fixed wait;
          - integration says when it skipped the explorer;
          - the bench has a port of its own.

          **From simplify:**
          - one start of Univ Server on the real state, shared by explore and every bench;
          - one bench arm;
          - one installer and one pnpm runner;
          - the browser settings and the first-points read are shared;
          - `clearLabels` returns the kept boxes, and `contains` sits beside `overlaps`.

          **Found live:**
          - names were buttons, so the KBC void's name, which lies over Earth at the centre of the opening view, took the wheel and drags;
          - 2.1M points summed to white from 13 Gpc. Beyond 1 Gpc from the focus, points are now drawn fainter in proportion to distance, down to 3 %.
        state: done
