        title: "Fix the /code-review and /simplify findings"
        detail: |-
          Correctness, each with a test that fails without its fix:
          - chunks in flight beside a failing one finish and report before the source fails;
          - resumed downloads count only this run's bytes;
          - the status line is drawn on a 100 ms tick, lines and status in one draw (indicatif `println` forces a draw, so the status is a template key), so it is never stale and never exceeds 10 draws a second;
          - a dead mirror is skipped once across concurrent chunks;
          - the summary names every source as fetched, failed or not reached, including on Ctrl-C;
          - a Ctrl-C handler that cannot be installed no longer counts as an interrupt.

          Simplify: shared `TestClock::advance`, a `RunDisplay` trait, a sink-built summary, `Fetcher::emit`, downloads keyed by number, one timestamp per written line, and `progress_due` in place of the plain sink's own map.

          Three later items are added to the plan for W4.
        state: done
        type: fix
