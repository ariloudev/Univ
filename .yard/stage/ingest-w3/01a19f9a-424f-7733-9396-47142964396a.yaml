          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Run state and line rendering"
        detail: "A pure `RunState` fed events: bytes, rate, time left, downloads in progress, stage counts, Get numbering. Pure renderers for the status line (cut to a width), the Get, Hit and Err lines, resume lines and stage lines. Done when snapshot tests cover AC-107 to AC-114 and AC-118."
        state: active
