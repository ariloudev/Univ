          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Run state and line rendering"
        detail: "A pure `RunState` fed events: bytes, rate, time left, downloads in progress, stage counts, Get numbering. Pure renderers for the status line (cut to a width), the Get, Hit and Err lines, resume lines and stage lines. Done when snapshot tests cover AC-107 to AC-114 and AC-118."
        state: active
      - key: 01a19f9f-9df0-72ef-9522-103e90f6891c
        at: 2026-11-03T04:16:40Z
        revision: 2
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Run state and line rendering"
        detail: "`display::RunState` turns events into Get, Hit, Err, Resume, Restart and stage lines, and a status line with stage percentage, bytes of expected, rate, time left and downloads in progress, cut to the width. Integer arithmetic throughout. 6 tests in `tests/display.rs` cover AC-107 to AC-114 and AC-118."
        state: done
  - key: 01a19f9a-424f-7733-9396-471763837877
    id: w3-t2-sinks
    kind: task
    versions:
      - key: 01a19f9a-424f-7733-9396-471fbfb737a3
        at: 2026-11-03T04:10:49Z
        revision: 1
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Terminal and plain sinks"
        detail: "The terminal sink prints lines above an indicatif status line redrawn at most 10 times a second. The plain sink prints timestamped lines with no control codes, and a progress line each minute for long downloads. Done when plain-mode tests on a scripted clock cover AC-118 and AC-119, and the terminal sink's redraw limit and width are tested (AC-110)."
        state: open
      - key: 01a19f9f-a905-762f-8dd9-cdce6d457022
        at: 2026-11-03T04:16:43Z
        revision: 3
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Terminal and plain sinks"
        detail: "`TerminalSink` prints lines above an indicatif status line, redrawn at most every 100 ms through a `StatusTarget` (recorded in tests). `PlainSink` writes RFC 3339 timestamped lines and a progress line each minute for long downloads. Tests cover AC-110, AC-118 and AC-119."
        state: done
