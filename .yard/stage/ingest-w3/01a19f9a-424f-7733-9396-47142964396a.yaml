          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Terminal and plain sinks"
        detail: "The terminal sink prints lines above an indicatif status line redrawn at most 10 times a second. The plain sink prints timestamped lines with no control codes, and a progress line each minute for long downloads. Done when plain-mode tests on a scripted clock cover AC-118 and AC-119, and the terminal sink's redraw limit and width are tested (AC-110)."
        state: open
