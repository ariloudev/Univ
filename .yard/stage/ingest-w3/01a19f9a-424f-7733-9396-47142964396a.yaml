  - key: 01a19f9a-424f-7733-9396-471999769c9e
    id: w3-t4-interrupt
    kind: task
    versions:
      - key: 01a19f9a-424f-7733-9396-4721fe194831
        at: 2026-11-03T04:10:49Z
        revision: 1
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Interrupt and continue"
        detail: "Ctrl-C cancels at once and keeps every chunk and partial file, says how to continue, and leaves no release half built. Done when a test cancels a stalled download, and the next run resumes from the byte it reached (AC-120, AC-121)."
        state: open
      - key: 01a19f9f-c07e-71f1-9606-e59bfa54a22c
        at: 2026-11-03T04:16:49Z
        revision: 5
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Interrupt and continue"
        detail: "Ctrl-C drops the fetch future at once; the `.part` file and its record stay. The command prints the summary, where the cache is and how to continue, and exits 130. `tests/interrupt.rs` stops a download stalled at byte 40 and the next run resumes with `Range: bytes=40-` (AC-120). AC-121 is unverified until W7 adds releases."
        state: done
  - key: 01a19f9a-424f-7733-9396-471a73c339d3
    id: w3-t5-cli
    kind: task
    versions:
      - key: 01a19f9a-424f-7733-9396-472239d39356
        at: 2026-11-03T04:10:49Z
        revision: 1
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "The fetch command"
        detail: "`univ-ingest fetch [--offline] [--source ID]... [--cache DIR]` reads the definitions and acquires each source. It picks the terminal or plain display by whether stderr is a terminal. Chunks are fetched 2 or 3 at a time per source, results in order (a W2 follow-up). Done when a CLI test runs `fetch --offline` on a cache dir and gets the plain lines and summary."
        state: open
      - key: 01a19f9f-cc1e-70e3-a11d-3c50cee72406
        at: 2026-11-03T04:16:52Z
        revision: 6
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "The fetch command"
        detail: "`univ-ingest fetch [--source ID]... [--offline] [--cache DIR] [--definitions DIR] [--repository DIR]` (clap). It picks the terminal display when stderr is a terminal and plain lines otherwise. A failing source is reported and the rest are still fetched. Chunks are fetched 3 at a time per source, results in order, with provenance writes behind a mutex. `tests/cli.rs` runs the binary offline on a cache."
        state: done
