        title: "What W3 produced"
        markdown: |-
          | Area | Result |
          |---|---|
          | Scale domains | Listed with radius in their own unit; manifests served from R2 as published |
          | Tiles | Streamed by the runtime from R2, never read by the Worker; immutable for a year when pinned, ETag = SHA-256; unpinned gets a no-store 302 to the pinned URL; HEAD sized from R2 metadata |
          | Grids | Listing, header, samples, and each field's uncertainty where published (CF4++ standard deviations) |
          | Tile format | Byte layout per encoding the release uses, and a self-contained manifest JSON Schema |
          | Decoder | `clients/tile-decoder`, reference TypeScript with no dependencies, in the gate |

          **Open:** the fixture release has no grid, so grid reads are checked natively and only listed end to end; W7 checks real grids on release 6. A plain-Mpc grid stating another H0 still has no `cell_rescaled` in its header.
