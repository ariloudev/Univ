    id: t3-format
    kind: task
    versions:
      - key: 01a1a37b-e1cd-74aa-b3eb-bdb03974e904
        at: 2026-11-03T22:16:07Z
        revision: 1
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Tile format in univ-model and the TypeScript decoder"
        detail: "Delegated to a worktree agent. Scope: the tile manifest type moved into univ-model with its OpenAPI schema; a byte-layout description of each encoding version; `clients/tile-decoder` (`node --test`, no dependencies) with fixtures the Rust encoder writes; a gate in `cargo xtask check`. Done for AC-282 to AC-284 when the decoder's tests pass."
        state: active
      - key: 01a1a3aa-c51e-7306-8fd8-324085de2cc9
        at: 2026-11-03T23:07:20Z
        revision: 3
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Tile format in univ-model and the TypeScript decoder"
        detail: "Merged in 63e7dab. `univ_model::tile::manifest::TileManifest` round-trips ingest's manifests byte for byte (`float_roundtrip` enabled). `tile::format::layout` is tested against the encoder. `clients/tile-decoder` (no dependencies) passes 5 node tests, and decoding all 1,227 real nearby-galaxy points lands within half a step. Its gate is in `cargo xtask check`."
        state: done
  - key: 01a1a37b-e1cc-72fb-b455-e1e1519a0482
    id: t3-blobs
    kind: task
