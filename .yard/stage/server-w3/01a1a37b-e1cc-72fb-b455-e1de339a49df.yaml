        title: "Scale domains and their tile manifests"
        detail: "`GET /v1/scale-domains` and `/v1/scale-domains/{name}/manifest`, with a 404 that lists the domains. Done when native tests cover AC-166 to AC-174."
        state: open
      - key: 01a1a381-8e6d-7109-863a-38968911f130
        at: 2026-11-03T22:22:19Z
