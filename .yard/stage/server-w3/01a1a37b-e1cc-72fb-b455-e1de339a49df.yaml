        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "R2 reads and streamed bodies"
        detail: "The backend reads small R2 files (manifests, headers); a response can stream an R2 object without the Worker decoding it (AC-185). Done when native tests read from an in-memory bucket."
        state: active
      - key: 01a1a381-8e6d-7109-863a-3895b1606cdd
        at: 2026-11-03T22:22:19Z
        revision: 2
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "R2 reads and streamed bodies"
        detail: "In 18670a3. `Body::Object(key)` is handed to the runtime as the R2 object's stream (`ObjectBody::response_body`), so the Worker never reads it (AC-185). `Backend::blob` reads small files such as manifests. One `Kept` store per isolate holds vocabularies and manifest nodes."
        state: done
