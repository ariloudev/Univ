        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Tiles streamed from R2"
        detail: "`GET /v1/scale-domains/{name}/tiles/{address}`: only a node the manifest holds, immutable for a year, with an ETag from its SHA-256. Done when native tests cover AC-184 to AC-186 and an e2e test checks every fixture tile's SHA-256 (AC-183)."
        state: open
      - key: 01a1a381-8e6d-7109-863a-389793e4ac37
        at: 2026-11-03T22:22:19Z
        revision: 2
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Tiles streamed from R2"
        detail: "In 18670a3. A pinned tile is immutable for a year with its SHA-256 as ETag; an unpinned tile gets a no-store 302 to the pinned URL; an unknown node gives 404 naming its address; HEAD invents no length. The e2e test checks every fixture tile's SHA-256 (AC-183)."
        state: done
