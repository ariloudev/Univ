          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Scale domains and their tile manifests"
        detail: "In 18670a3. The listing gives each domain's radius in its own unit; a manifest is served as published; an unknown domain gives 404 listing the domains. The manifest's contents (AC-168 to AC-173) are checked through the Worker by the e2e test, and by the format agent's round trip."
        state: done
  - key: 01a1a37b-e1cc-72fb-b455-e1e3b17d6884
    id: t3-tiles
    kind: task
    versions:
      - key: 01a1a37b-e1cd-74aa-b3eb-bdb3e8100f6a
