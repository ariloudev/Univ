          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Volume grids"
        detail: "In 18670a3. The listing gives id, source, unit, shape and each field (index, quantity, kind, unit, samples path); the header and samples are streamed as published; fields are addressed by index because names repeat (two `basin_label` fields); an unknown grid or field gives 404 naming it. The fixture release holds no grid, so grid e2e checks are the listing and the 404."
        state: done
