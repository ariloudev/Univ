        title: "The owner's ask"
        markdown: |-
          Owner: *Can we say that the repeller and attractor are the same category? Render them kinda similar and add an arrow to their wireframe showing the direction of the force.*

          Both are critical points of a reconstructed peculiar-velocity field: an attractor is where the flow converges (a sink), a repeller where it diverges (a source). The data keeps the two kinds, since the direction is the difference; the explorer draws them as one family, with arrows inward for an attractor and outward for a repeller.
