        title: "What the stage produced"
        markdown: |-
          - **Data unchanged.** Attractors and repellers stay as two kinds. `FLOWS` in `scene/kinds.ts` maps the attractor to *in* and the repeller to *out*.
          - **Symbol.** `flowSymbol` in `scene/outline.ts` draws three rings of unit radius, plus an arrow either way along each axis of the shape's frame, out to 2 radii.
          - **Fixed size.** The symbol travels in `Lines.symbol` with its own pixel size and widest line. The renderer scales it by the centre's *depth* through a `u_scale` uniform, so it stays 24 device pixels in radius anywhere on the view.
          - **Colours.** Attractor is magenta `[1, .25, .95]`, repeller violet `[.8, .35, 1]`. They are 22° apart in hue, and each is more than 15° from every other kind's colour (the first attractor colour shared a hue with shells).
          - **Names** go below the arrows' reach, in CSS pixels at the current pixel ratio.
          - **Panel** says the sphere is a symbol, not an extent, and which way the arrows point.

          Reviews: `/simplify` (4 angles) and `/code-review`. The fixes were scaling by depth rather than distance, the pixel ratio read each frame, the shell hue clash, one arrow-reach constant, and the placing computed once. Skipped: making the symbol's size CSS pixels, since markers and lines are device pixels throughout.

          Gate passed (13 gates), and integration passed (9 explorer e2e tests).
