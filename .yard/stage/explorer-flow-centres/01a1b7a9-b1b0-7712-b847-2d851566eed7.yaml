          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Seen in the explorer, and one spec amendment"
        markdown: |-
          Seen on release 11 in the explorer: the Dipole Repeller and the Great Attractor each draw as a sphere with arrows, out from the repeller and in to the attractor.

          - At 12 device pixels the symbol was hidden under its name, so the sphere is now 24 device pixels (12 CSS px on a 2× screen), with the arrows reaching twice that.
          - A chosen symbol's lines are capped at 2.5 px, because the chosen 5 px lines filled the sphere.
          - The name of an attractor or repeller is now drawn just below the reach of the arrows. The criterion "Each structure's name is drawn at its centre" was amended to say so (minor, pre-approved).
