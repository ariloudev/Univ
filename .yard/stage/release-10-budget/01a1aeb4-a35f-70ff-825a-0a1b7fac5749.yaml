        title: "Keep a dropped tile drawn until its replacements are"
        detail: "Make-before-break in the catalogue: a tile dropped to make room is kept drawn, outside the budget, until every tile fetched in the same round is drawn or given up; within an allowance above the budget, the oldest let go first; a kept tile the view wants again is drawn again without a fetch."
        state: active
