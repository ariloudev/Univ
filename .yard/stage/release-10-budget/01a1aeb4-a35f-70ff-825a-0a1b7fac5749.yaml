          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Double the point budget to 6,000,000"
        detail: "The owner's call. `POINT_BUDGET` 6,000,000, the spec criterion and the README with it; the simulated octree's tiles doubled to 800 points so the budget still fills. About 15 bytes a point on the GPU: some 90 MB of vertex buffers at the budget, and as much in decoded tiles. The decision on WebGL2 still names \"up to three million points\" in its context; left as written, since an accepted decision is superseded, not edited."
        state: done
  - key: 01a1aeb4-a35f-70ff-825a-0a1d71a5a2d8
    id: b-keep
    kind: task
    versions:
      - key: 01a1aeb4-a35f-70ff-825a-0a21078ee1ed
        at: 2026-11-06T02:33:56Z
        revision: 1
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Keep a dropped tile drawn until its replacements are"
        detail: "Make-before-break in the catalogue: a tile dropped to make room is kept drawn, outside the budget, until every tile fetched in the same round is drawn or given up; within an allowance above the budget, the oldest let go first; a kept tile the view wants again is drawn again without a fetch."
        state: active
      - key: 01a1aeb7-593b-71bd-914c-c52d5130cb40
        at: 2026-11-06T02:36:53Z
        revision: 2
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Keep a dropped tile drawn until its replacements are"
        detail: "`Catalogue`: drops go to a kept set, still drawn, counted and credited, until every tile of the round that dropped them is drawn or given up; the longest kept let go beyond `KEEP_ALLOWANCE` (1,500,000); a kept tile the plan fetches again is revived without a read. Three tests on a server that holds answers back, each failing with its mechanism switched off. The plan and its budget are unchanged: kept tiles sit outside it."
        state: done
