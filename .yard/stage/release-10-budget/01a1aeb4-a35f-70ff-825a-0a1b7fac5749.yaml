                  "name": "D1",
                  "words": {
                    "after": "D1\n\nSQLite databases: the catalogue database of the releases, which holds their sources, structures and the object shard of each object id; the object shards, which hold objects, identities and the cell index; and the layers and keys.",
                    "before": "D1\n\nSQLite databases: objects, identities, the cell index, layers and keys."
                  }
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-58d0bd77ebdc",
                  "kind": "component",
                  "label": null,
                  "name": "SDSS DR17 distant galaxies and quasars",
                  "words": {
                    "after": "SDSS DR17 distant galaxies and quasars\n\nThe rest of SDSS DR17's spectroscopy (Abdurro'uf et al. 2022, ApJS 259, 35) with zWarning = 0: the galaxies at 0.35 ≤ z < 1.2, about 1.53 million, mostly BOSS and eBOSS, and the quasars at any redshift, about 753,000. Public, with the SDSS acknowledgement."
                  }
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-58d1c13261fc",
                  "kind": "component",
                  "label": null,
                  "name": "2dFGRS",
                  "words": {
                    "after": "2dFGRS\n\nThe 2dF Galaxy Redshift Survey's final release (Colless et al. 2001, MNRAS 328, 1039; VizieR\nVII/250): 221,414 galaxies of redshift quality 3 or better over about 1,500 square degrees,\nwith heliocentric redshifts and one rms uncertainty of 85 km/s for the whole catalogue. Used\nunder the VizieR terms, for scientific and non-commercial use with its citation."
                  }
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-58d2281c1099",
                  "kind": "component",
                  "label": null,
                  "name": "ALFALFA α.100",
                  "words": {
                    "after": "ALFALFA α.100\n\nThe complete ALFALFA HI source catalogue (Haynes et al. 2018, ApJ 861, 49; VizieR\nJ/ApJ/861/49): the 25,434 code 1 detections over about 7,000 square degrees, with heliocentric\n21 cm velocities. The catalogue's own distances, a Hubble-law distance above 6,000 km/s and a\nflow model below, are not taken. An AAS table, for non-commercial use through VizieR."
                  }
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-58d3b98ead8a",
                  "kind": "component",
                  "label": null,
                  "name": "DESI public data release",
                  "words": {
                    "after": "DESI public data release\n\nThe public data release site of the Dark Energy Spectroscopic Instrument, with its copies at NOIRLab's Astro Data Lab."
                  }
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-58d4eab51e82",
                  "kind": "component",
                  "label": null,
                  "name": "DESI DR1 redshifts",
                  "words": {
                    "after": "DESI DR1 redshifts\n\nThe redshift catalogue of DESI's first data release (DESI Collaboration 2026, AJ 171, 285):\none primary redshift per target with ZWARN = 0, the 13.1 million galaxies and 1.6 million\nquasars of the Main Survey (the DR1 abstract) and those of its Survey Validation, with\nbarycentric redshifts and their errors. CC BY 4.0, with the DESI acknowledgement."
                  }
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-58d51ef988ca",
                  "kind": "component",
                  "label": null,
                  "name": "SuperCOSMOS Science Archive",
                  "words": {
                    "after": "SuperCOSMOS Science Archive\n\nThe archive of the Wide Field Astronomy Unit in Edinburgh that holds the 2MASS and WISE photometric redshift catalogues."
                  }
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-58d66f8d9197",
                  "kind": "component",
                  "label": null,
                  "name": "2MPZ",
                  "words": {
                    "after": "2MPZ\n\nThe 2MASS Photometric Redshift catalogue (Bilicki et al. 2014, ApJS 210, 9): 928,352\ngalaxies over nearly the whole sky, with photometric redshifts of scatter 0.015 for the whole\ncatalogue and spectroscopic ones where they exist. Permission to redistribute is pending."
                  }
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-58d7b4335c3a",
                  "kind": "component",
                  "label": null,
                  "name": "WISE × SuperCOSMOS photometric redshifts",
                  "words": {
                    "after": "WISE × SuperCOSMOS photometric redshifts\n\nThe WISE × SuperCOSMOS photometric redshift catalogue (Bilicki et al. 2016, ApJS 225, 5):\nabout 18.5 million galaxies over three quarters of the sky away from the Galactic plane, with\na scatter of 0.033 (1 + z) for the whole catalogue. Permission to redistribute is pending."
                  }
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-58d805dbe294",
                  "kind": "component",
                  "label": null,
                  "name": "GAMA data release site",
                  "words": {
                    "after": "GAMA data release site\n\nThe data release site of the Galaxy And Mass Assembly survey."
                  }
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-58d918ceb9bc",
                  "kind": "component",
                  "label": null,
                  "name": "GAMA DR4 redshifts",
                  "words": {
                    "after": "GAMA DR4 redshifts\n\nThe best redshift of each GAMA target in its fourth data release (Driver et al. 2022, MNRAS\n513, 439): the redshifts of quality 3 or better that GAMA measured itself, 248,682 before\nstars are left out, over\nabout 286 square degrees in five fields, heliocentric. Permission to redistribute is\npending."
                  }
                },
                {
                  "change": "changed",
                  "key": "01a19f1e-d177-716d-b124-3cf23344602c",
                  "kind": "constraint",
                  "label": "CON-3",
                  "name": "The Release publisher shall keep every D1 database of the releases, the catalogue database and each object shard, within D1's 10 GB database cap, budgeting each release at 4.5 GB in each so the next release can be published before the previous one is pruned.",
                  "words": {
                    "after": "The Release publisher shall keep every D1 database of the releases, the catalogue database and each object shard, within D1's 10 GB database cap, budgeting each release at 4.5 GB in each so the next release can be published before the previous one is pruned.",
                    "before": "The Release publisher shall keep the D1 tables of every unpruned release together within D1's 10 GB database cap, budgeting each release at 4.5 GB so the next release can be published before the previous one is pruned."
                  }
                },
                {
                  "change": "changed",
                  "key": "01a19f25-5955-701e-b3cf-ddcffaf7bf98",
                  "kind": "decision",
                  "label": "ADR-13",
                  "name": "Keep every object in D1 until a DESI-sized source arrives",
                  "words": {
                    "after": "Keep every object in D1 until a DESI-sized source arrives\n\nObjects live in D1 under a monitored 10 GB cap, and a larger source first needs a decision on R2 shards.",
                    "before": "Keep every object in D1 until a DESI-sized source arrives\n\nObjects live in D1 under a monitored 10 GB cap, and a larger source first needs a decision on R2 shards."
                  }
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-58da6aab49a1",
                  "kind": "decision",
                  "label": null,
                  "name": "Add DESI DR1 and seven more galaxy surveys to release 10",
                  "words": {
                    "after": "Add DESI DR1 and seven more galaxy surveys to release 10\n\nRelease 10 adds DESI DR1, the rest of SDSS DR17, 2dFGRS, GAMA DR4, ALFALFA α.100, 2MPZ and WISE × SuperCOSMOS, quasars included, while Euclid waits for its first full data release and the COSMOS-Web groups for a deep-field scale domain."
                  }
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-58e3584b3f25",
                  "kind": "decision",
                  "label": null,
                  "name": "Admit sources for non-commercial use, marked as such",
                  "words": {
                    "after": "Admit sources for non-commercial use, marked as such\n\nA source whose terms allow only non-commercial use is admitted, marked non-commercial in its source definition, and served with that mark."
                  }
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-58eab95e4bc8",
                  "kind": "decision",
                  "label": null,
                  "name": "Publish a source while its permission is pending",
                  "words": {
                    "after": "Publish a source while its permission is pending\n\nA source definition may carry the status permission pending, and Univ Ingest builds and publishes such a source like a permitted one, serving its status with its terms."
                  }
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-58f331400c25",
                  "kind": "decision",
                  "label": null,
                  "name": "Shard a release's objects across several D1 databases",
                  "words": {
                    "after": "Shard a release's objects across several D1 databases\n\nA release keeps its sources, structures and an index of object ids in a catalogue database, and its objects in object shards divided by cell, each within the 10 GB cap."
                  }
                }
