        title: "Ways to draw a bounded volume, worked on Vela"
        detail: |-
          **Done when** a note compares:
          - a sky-and-depth sector, from a sky extent and a velocity range;
          - an ellipsoid or sphere of the published size about the point;
          - the convex hull of members;
          - a size-less marker.

          For each it states which structures it fits, the science caveats (lower limits, h⁻¹ units, an approximate label), and whether it belongs in ingest (a derived shape with its chain) or in the explorer. It recommends one, with Vela worked through: l 260°–285°, b −10°–+10°, cz 18,000–22,000 km/s.
        state: open
