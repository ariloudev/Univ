                }
              ],
              "nodes": [
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-3ffb8e7533cb",
                  "kind": "product",
                  "label": null,
                  "name": "Univ Explorer",
                  "parent": null
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-3ffc32e7ed9d",
                  "kind": "feature_group",
                  "label": null,
                  "name": "The view",
                  "parent": "01a1a497-e843-728a-bce8-3ffb8e7533cb"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-3ffe4657fb77",
                  "kind": "feature",
                  "label": null,
                  "name": "Draw the catalogues",
                  "parent": "01a1a497-e843-728a-bce8-3ffc32e7ed9d"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-3fff6f6d18ce",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Explorer shall draw each placed object of every scale domain at the position its tile gives, with Earth at the centre.",
                  "parent": "01a1a497-e843-728a-bce8-3ffe4657fb77"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-4000304272e5",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each point is drawn at the ICRS position its tile gives, converted from its scale domain's unit to megaparsecs.",
                  "parent": "01a1a497-e843-728a-bce8-3fff6f6d18ce"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-40018ecb5def",
                  "kind": "criterion",
                  "label": null,
                  "name": "Earth is marked at the origin, which the marker names as the Solar System barycentre, within about 1 AU of Earth.",
                  "parent": "01a1a497-e843-728a-bce8-3fff6f6d18ce"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-40026e7286d2",
                  "kind": "criterion",
                  "label": null,
                  "name": "Points of the stars domain and of the galaxy domains are drawn together, each at its own distance.",
                  "parent": "01a1a497-e843-728a-bce8-3fff6f6d18ce"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-4003ade9ca4b",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the view changes, Univ Explorer shall fetch the tiles the view needs, those in view and the largest on screen first, within a budget of points.",
                  "parent": "01a1a497-e843-728a-bce8-3ffe4657fb77"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-40049983aed9",
                  "kind": "criterion",
                  "label": null,
                  "name": "The root tile of every scale domain is fetched before any other tile.",
                  "parent": "01a1a497-e843-728a-bce8-4003ade9ca4b"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-400536d8f2b5",
                  "kind": "criterion",
                  "label": null,
                  "name": "The tiles the view needs are fetched in order of their size on screen, largest first, and a tile wholly outside the view is not fetched.",
                  "parent": "01a1a497-e843-728a-bce8-4003ade9ca4b"
                },
                {
                  "change": "added",
                  "key": "01a1a689-0b25-768a-9f1e-cc267f67e3c1",
                  "kind": "criterion",
                  "label": null,
                  "name": "A tile's children are fetched only while its points lie farther apart on screen than 3 pixels, so that a region far away or seen whole is not refined beyond what the screen shows.",
                  "parent": "01a1a497-e843-728a-bce8-4003ade9ca4b"
                },
                {
                  "change": "added",
                  "key": "01a1a6a7-c540-7210-8492-7dfc16d279b8",
                  "kind": "criterion",
                  "label": null,
                  "name": "A tile's children in view are fetched together or not at all, so that no part of a region is left coarser than the rest.",
                  "parent": "01a1a497-e843-728a-bce8-4003ade9ca4b"
                },
                {
                  "change": "added",
                  "key": "01a1a6a7-c540-7210-8492-7dfdf91c2ccf",
                  "kind": "criterion",
                  "label": null,
                  "name": "A view that does not change stops fetching and dropping tiles once it holds what it needs.",
                  "parent": "01a1a497-e843-728a-bce8-4003ade9ca4b"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-4006f5c2ce8f",
                  "kind": "criterion",
                  "label": null,
                  "name": "No more than 3,000,000 points are held at once.",
                  "parent": "01a1a497-e843-728a-bce8-4003ade9ca4b"
                },
                {
                  "change": "added",
                  "key": "01a1a689-0b25-768a-9f1e-cc27109fed3c",
                  "kind": "requirement",
                  "label": null,
                  "name": "When a tile the view needs would take the points held beyond the budget, Univ Explorer shall drop the held tiles the view needs least until the tile fits.",
                  "parent": "01a1a497-e843-728a-bce8-3ffe4657fb77"
                },
                {
                  "change": "added",
                  "key": "01a1a689-0b25-768a-9f1e-cc28566a82e6",
                  "kind": "criterion",
                  "label": null,
                  "name": "Tiles wholly outside the view are dropped before tiles in view, and among them the smallest on screen first.",
                  "parent": "01a1a689-0b25-768a-9f1e-cc27109fed3c"
                },
                {
                  "change": "added",
                  "key": "01a1a689-0b25-768a-9f1e-cc29da0f0de4",
                  "kind": "criterion",
                  "label": null,
                  "name": "A root tile, and a tile whose children are held, is never dropped, so that no region loses the sample its children refine.",
                  "parent": "01a1a689-0b25-768a-9f1e-cc27109fed3c"
                },
                {
                  "change": "added",
                  "key": "01a1a689-0b25-768a-9f1e-cc2a53831ad9",
                  "kind": "criterion",
                  "label": null,
                  "name": "A dropped tile is fetched again when the view needs it again.",
                  "parent": "01a1a689-0b25-768a-9f1e-cc27109fed3c"
                },
                {
                  "change": "added",
                  "key": "01a1a689-0b25-768a-9f1e-cc2b2734abc4",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Explorer shall draw only the held tiles that lie in the view.",
                  "parent": "01a1a497-e843-728a-bce8-3ffe4657fb77"
                },
                {
                  "change": "added",
                  "key": "01a1a689-0b25-768a-9f1e-cc2c484365d4",
                  "kind": "criterion",
                  "label": null,
                  "name": "A held tile is not drawn while the sphere about its points lies wholly outside the view.",
                  "parent": "01a1a689-0b25-768a-9f1e-cc2b2734abc4"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-400775a8d943",
                  "kind": "requirement",
                  "label": null,
                  "name": "If a tile's bytes do not match the SHA-256 its manifest gives, or the tile does not decode, then Univ Explorer shall leave the tile undrawn and count it as failed.",
                  "parent": "01a1a497-e843-728a-bce8-3ffe4657fb77"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-40081f3b67cf",
                  "kind": "criterion",
                  "label": null,
                  "name": "A tile whose SHA-256 differs from its manifest's is not drawn.",
                  "parent": "01a1a497-e843-728a-bce8-400775a8d943"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-4009e23e1ebc",
                  "kind": "criterion",
                  "label": null,
                  "name": "The view states the count of tiles that failed, where any did.",
                  "parent": "01a1a497-e843-728a-bce8-400775a8d943"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-400ade54e0e1",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Explorer shall colour each point by the kind of value of its distance and show the key to the colours.",
                  "parent": "01a1a497-e843-728a-bce8-3ffe4657fb77"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-400b9b581384",
                  "kind": "criterion",
                  "label": null,
                  "name": "Measured, estimated, inferred and reconstructed distances are drawn in four distinct colours.",
                  "parent": "01a1a497-e843-728a-bce8-400ade54e0e1"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-400c71ad8ebe",
                  "kind": "criterion",
                  "label": null,
                  "name": "The key names each colour's kind of value and counts the points drawn in it.",
                  "parent": "01a1a497-e843-728a-bce8-400ade54e0e1"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-400db24e35a8",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Explorer shall credit every source whose points are drawn, as the tile manifest gives its credit.",
                  "parent": "01a1a497-e843-728a-bce8-3ffe4657fb77"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-400eb0b1b70d",
                  "kind": "criterion",
                  "label": null,
                  "name": "The credits list each source of the drawn points with its title, its citation and its required credit.",
                  "parent": "01a1a497-e843-728a-bce8-400db24e35a8"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-400fa74e76fc",
                  "kind": "criterion",
                  "label": null,
                  "name": "The credits name the release the points come from.",
                  "parent": "01a1a497-e843-728a-bce8-400db24e35a8"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-401087e90f86",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Explorer shall state the frame, origin, units and cosmology of what it draws.",
                  "parent": "01a1a497-e843-728a-bce8-3ffe4657fb77"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-40111a7d5c5f",
                  "kind": "criterion",
                  "label": null,
                  "name": "The view names the frame whose axes it shows, the origin, the unit of its distances and the release cosmology.",
                  "parent": "01a1a497-e843-728a-bce8-401087e90f86"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-4013de790aff",
                  "kind": "feature",
                  "label": null,
                  "name": "Navigate with the mouse",
                  "parent": "01a1a497-e843-728a-bce8-3ffc32e7ed9d"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-4014d5bf7fe9",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the person drags with the primary button, Univ Explorer shall turn the view about the focus.",
                  "parent": "01a1a497-e843-728a-bce8-4013de790aff"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-40155a522828",
                  "kind": "criterion",
                  "label": null,
                  "name": "Dragging sideways turns the view about the pole of the frame whose axes it shows.",
                  "parent": "01a1a497-e843-728a-bce8-4014d5bf7fe9"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-40169a56936b",
                  "kind": "criterion",
                  "label": null,
                  "name": "Dragging up or down tilts the view, stopping short of either pole.",
                  "parent": "01a1a497-e843-728a-bce8-4014d5bf7fe9"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-4017e181b56d",
                  "kind": "criterion",
                  "label": null,
                  "name": "A press that moves less than 6 pixels is a click, not a drag.",
                  "parent": "01a1a497-e843-728a-bce8-4014d5bf7fe9"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-40189c79db07",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the person turns the mouse wheel, Univ Explorer shall move the eye toward or away from the focus by the same factor for each step.",
                  "parent": "01a1a497-e843-728a-bce8-4013de790aff"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-40194ffc65db",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each step of the wheel changes the distance from the eye to the focus by the same factor.",
                  "parent": "01a1a497-e843-728a-bce8-40189c79db07"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-401a8b7b26d8",
                  "kind": "criterion",
                  "label": null,
                  "name": "The distance from the eye to the focus stays between 0.1 parsec and 20 gigaparsecs.",
                  "parent": "01a1a497-e843-728a-bce8-40189c79db07"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-401b318a282a",
                  "kind": "criterion",
                  "label": null,
                  "name": "The view shows the distance from the eye to the focus in parsecs, kiloparsecs, megaparsecs or gigaparsecs, whichever suits it, with light-years beside it.",
                  "parent": "01a1a497-e843-728a-bce8-40189c79db07"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-401c96d859c6",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the person drags with the secondary button, or with the primary button and Shift held, Univ Explorer shall move the focus across the view.",
                  "parent": "01a1a497-e843-728a-bce8-4013de790aff"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-401d23c750eb",
                  "kind": "criterion",
                  "label": null,
                  "name": "The focus moves in the plane facing the eye, by the distance the pointer moved at the focus's depth.",
                  "parent": "01a1a497-e843-728a-bce8-401c96d859c6"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-401e02fe8fb9",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the person double-clicks a point or a structure, Univ Explorer shall fly to it and make it the focus.",
                  "parent": "01a1a497-e843-728a-bce8-4013de790aff"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-401fac9dd829",
                  "kind": "criterion",
                  "label": null,
                  "name": "The flight ends within 1.5 seconds with the thing at the centre of the view.",
                  "parent": "01a1a497-e843-728a-bce8-401e02fe8fb9"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-40204b4131f6",
                  "kind": "criterion",
                  "label": null,
                  "name": "Where the person's system asks for reduced motion, the view moves at once instead of flying.",
                  "parent": "01a1a497-e843-728a-bce8-401e02fe8fb9"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-402165709dd6",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the person asks to return to Earth, Univ Explorer shall make Earth the focus again.",
                  "parent": "01a1a497-e843-728a-bce8-4013de790aff"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-4022b38915cd",
                  "kind": "criterion",
                  "label": null,
                  "name": "A control on the view returns the focus to Earth.",
                  "parent": "01a1a497-e843-728a-bce8-402165709dd6"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-40239ca6b61d",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the person chooses the galactic, equatorial or supergalactic axes, Univ Explorer shall turn the view to that frame's axes.",
                  "parent": "01a1a497-e843-728a-bce8-4013de790aff"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-4024890baa12",
                  "kind": "criterion",
                  "label": null,
                  "name": "The chosen frame's equator is drawn as a ring around Earth.",
                  "parent": "01a1a497-e843-728a-bce8-40239ca6b61d"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-4025c1c8e956",
                  "kind": "criterion",
                  "label": null,
                  "name": "Changing the axes leaves every point at the same place in space.",
                  "parent": "01a1a497-e843-728a-bce8-40239ca6b61d"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-402682c20f97",
                  "kind": "feature",
                  "label": null,
                  "name": "Open the explorer",
                  "parent": "01a1a497-e843-728a-bce8-3ffc32e7ed9d"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-4027880d6bf0",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the person opens the explorer, Univ Explorer shall draw the release that latest points to and name it.",
                  "parent": "01a1a497-e843-728a-bce8-402682c20f97"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-4028add2863c",
                  "kind": "criterion",
                  "label": null,
                  "name": "The explorer reads the list of releases and draws the one latest points to.",
                  "parent": "01a1a497-e843-728a-bce8-4027880d6bf0"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-4029408477ea",
                  "kind": "criterion",
                  "label": null,
                  "name": "The view names the release it draws.",
                  "parent": "01a1a497-e843-728a-bce8-4027880d6bf0"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-402aecf36789",
                  "kind": "requirement",
                  "label": null,
                  "name": "When the person chooses another release, Univ Explorer shall draw that release in place of the one shown.",
                  "parent": "01a1a497-e843-728a-bce8-402682c20f97"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-402b1b713ac4",
                  "kind": "criterion",
                  "label": null,
                  "name": "Every release that is published and not pruned can be chosen.",
                  "parent": "01a1a497-e843-728a-bce8-402aecf36789"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-402c7430235c",
                  "kind": "criterion",
                  "label": null,
                  "name": "Every read made after the choice names the chosen release.",
                  "parent": "01a1a497-e843-728a-bce8-402aecf36789"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-402de61f7a43",
                  "kind": "requirement",
                  "label": null,
                  "name": "If Univ Server cannot be reached, then Univ Explorer shall say so, say how to start it, and try again when asked.",
                  "parent": "01a1a497-e843-728a-bce8-402682c20f97"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-402e69057896",
                  "kind": "criterion",
                  "label": null,
                  "name": "The message names the address the explorer tried.",
                  "parent": "01a1a497-e843-728a-bce8-402de61f7a43"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-402f2c21ca9d",
                  "kind": "criterion",
                  "label": null,
                  "name": "The message gives the command that starts Univ Server and the explorer together.",
                  "parent": "01a1a497-e843-728a-bce8-402de61f7a43"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-4030e4feb6a1",
                  "kind": "criterion",
                  "label": null,
                  "name": "Trying again reads the releases anew without reloading the page.",
                  "parent": "01a1a497-e843-728a-bce8-402de61f7a43"
                },
                {
                  "change": "added",
                  "key": "01a1a497-e843-728a-bce8-40313c8ccea7",
                  "kind": "requirement",
                  "label": null,
                  "name": "If Univ Server refuses a read because the rate limit was reached, then Univ Explorer shall read it again once the time the server gives has passed.",
