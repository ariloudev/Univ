          - the largest on screen first;
          - the budget counts the points on their way;
          - room is made by dropping drawn tiles that are needed less than the tile wanted: outside the view first, then the smallest on screen. A root, a tile with a child drawn or on its way, or the parent of a tile being fetched is never dropped.

