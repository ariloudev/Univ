  - key: 01a1a698-6451-7607-932e-3818b1ce713c
    id: plan-28-plan-glowing-questing-ullman-01a1a686-8188-775c-986e-63222598951e
    kind: plan
    versions:
      - key: 01a1a698-6451-7607-932e-3819564f54e2
        at: 2026-11-04T12:46:07Z
        revision: 7
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Plan: the explorer's next waves (E5, E6, S1, release 8, E7)"
        markdown: |
          # Plan: the explorer's next waves (E5, E6, S1, release 8, E7)

          ## Context

          You asked for nine items and a spike after using the explorer on release 7:

          1. Frustum culling.
          2. Eviction.
          3. Ranking.
          4. Dynamic refinement.
          5. Catalogue names (Andromeda's panel shows "Object 856254 · body").
          6. A chosen shell structure changes colour.
          7. A chosen point structure changes colour.
          8. Stars coloured by class.
          9. All known superstructures.

          The spike: Vela is placed by a point, so how can it be shown as a bounded volume?

          You decided in the Yard Log:
          - **Colours:** both the colour index and published spectral types.
          - **Structures:** a curated list, each checked against its primary paper.
          - **Ingest work:** on `product/release-8`, cut from `develop`.

          I had started E5's code before registering its tasks. It is uncommitted: its unit tests pass, but it has not been checked live. Every task is now registered in the Yard Log of `stage/explorer-e5`, http://127.0.0.1:7411/, with its scope and the check that shows it done.

          The process for each wave is unchanged:
          - spec first, committed alone;
          - focused checks between tasks;
          - `/simplify` and `/code-review` in parallel;
          - `cargo xtask check` and `cargo xtask integration` once;
          - the trace linked and accepted;
          - close the Yard Log, then merge `--no-ff` into the product branch.

          Merges into `develop` wait for you.

          ## E5: view-driven loading (`stage/explorer-e5`, items 1 to 4)

          The spec change is committed (`567d984`, draw-the-catalogues): one criterion reworded, five added, and two requirements.

          | Task | Scope | Done when | State |
          |---|---|---|---|
          | e5-t-frustum | `scene/frustum.ts`: `sightOf` (eye, focal length, a sphere-against-frustum test with no far plane), `inSight` | `frustum.test.ts`: ahead, behind, sides by aspect, focal, filter | written, passing |
          | e5-t-plan | `catalogue/lod.ts` `plan()`: roots first; children only of tiles in view refined while their points lie more than 3 px apart; none wholly outside the view; largest on screen first; the budget counts points on their way; room made by dropping the least needed tiles (outside the view first, then the smallest), never a root, a parent, or the parent of a tile being fetched | `lod.test.ts`, one test per criterion | written, 9 tests pass |
          | e5-t-catalogue | `Catalogue.update(sight)`, `onDrop`, counts go down, a `budget` option | `catalogue.test.ts`: the simulated fixture domain at a 25-point budget drops and refetches as the view turns | written, passing |
          | e5-t-render | the renderer keys batches by tile, draws only `inSight`, `removePoints`; picking forgets dropped tiles; the controller gives its `sight` | `pnpm check` passes, and the live check shows no holes | `pnpm check` passes |
          | e5-t-live | release 7 through `cargo xtask explore` | points held at 400 Mpc, 2.3 Gpc, near Earth and after turning, with screenshots; one run with the budget lowered to 300k locally (never committed) shows drops and refetches within 300k; `bench first-points` within 3 s | open |
          | e5-t-trace, e5-t-review, e5-t-gate, e5-t-close | the wave's end | as in the process above | open |

          The pieces it reuses:
          - `apparentSize`, `eyeAxes`, `eyeOf` and `focalPixels` in `scene/camera.ts`;
          - `Controller.subscribe` for view changes;
          - the `pickable` list in `ui/useWorld.ts`.

          ## E6: names and selection (`stage/explorer-e6`, items 5 to 7)

          | Task | Done when |
          |---|---|
          | e6-t-find | A note says whether the object record carries a type (star, galaxy, group). `ObjectRecord.kind` is only one entry versus a group (`univ-model/src/object/relation.rs`), but the volume query filters by a kind term (`univ-api/src/query/objects.rs`). If the API doesn't return the term, that change moves to R1. |
          | e6-t-spec | Two spec changes, committed alone: `read-an-object` (the panel is headed by the name, with the id beside it, and says the type where the record gives one) and `see-the-structures` (a chosen structure's outline, markers and members get their own colour until another is chosen or the panel closes). |
          | e6-t-heading | `ObjectPanel.test.tsx`: Andromeda found by name is headed "Andromeda"; an object opened by click is headed by its first name; an object with no name is headed by its designation. |
          | e6-t-type | The panel shows galaxy, star or galaxy group in place of "body", or the task moves to R1. |
          | e6-t-outline | A `useStructures` test shows the chosen structure's lines in the chosen colour and the others unchanged, restored on close; a live screenshot of the KBC void. |
          | e6-t-markers | The same for point and member markers; a live screenshot of Shapley. |
          | e6-t-close | Trace, review, gate, close, merge. |

          It reuses `STRUCTURE_COLOUR` and `APPROXIMATE_COLOUR` (`scene/kinds.ts`), `drawingOf` (`scene/structures.ts`) and `Renderer.setLines` / `setMarkers`.

