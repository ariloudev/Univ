        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "What the live check on release 7 found"
        markdown: |-
          **Held points, at the full 3M budget:**

          | View | Held points | Tile requests |
          |---|---|---|
          | Opening, 400 Mpc | 853,382 of 2,085,809 | 138 |
          | Zoomed out to 13.2 Gpc from there | 1,214,163 | 248 |
          | Zoomed to 1.38 kpc, then four turns | 1,496,651, then 1,609,774 | 240, then 314 |
          | 24 Mpc, four turns | 845,718 | 177 |

          Below the budget nothing is dropped, as the spec says, so a zoom keeps what it fetched on the way.

          **At a 300,000 budget** (a local edit, reverted): never more than 299,749 points held. The opening view settles after 51 requests, and turning drops tiles and fetches others.

          **First points:** p95 211 ms over 10 loads, within 3 s.

          **Faults found and fixed (`64eede0`):**

          1. **Thrashing.** With the budget full, two sets of tiles dropped each other in turn, 9,949 requests at a still view. The plan now computes one wanted set from the view alone. A simulation on release 7's manifests settles in 9 rounds, and a unit test pins it.
          2. **Cubes much bigger than the data.** The cosmic-web root is 16 Gpc across, while 90 % of its points lie within 1.3 Gpc and a few reach 6 Gpc. A tile is now culled by the sphere about its points, and its spacing is measured by the sphere about their mean that holds 90 %.
          3. **Spacing on screen.** It was computed with ∛N; the points of a whole depth land on one square, so it is √N.
          4. **Wedges.** At 300k, one octant of the star sphere stayed coarse. A tile's children in view are now wanted together or not at all.
        tone: warning
