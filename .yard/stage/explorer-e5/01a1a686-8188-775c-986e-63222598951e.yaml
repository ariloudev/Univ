          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        view: spec-change
        note: |-
          Items 1 to 4 of your list:
          - **Ranking:** tiles in view first, by size on screen.
          - **Dynamic refinement:** a tile is refined only while its points lie more than 3 px apart on screen.
          - **Eviction:** dropped first are tiles outside the view, then those smallest on screen. A root, or a tile whose children are held, is never dropped.
          - **Frustum culling:** held tiles outside the view are not drawn.

          The 3,000,000-point budget stays.
