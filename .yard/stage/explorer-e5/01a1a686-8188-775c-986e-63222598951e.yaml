          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "What E5 produced"
        markdown: |-
          The explorer now loads by what the view sees.

          **What it loads:**
          - every root;
          - then, the largest on screen first, the children in view of each tile whose points lie more than 3 px apart on screen;
          - a tile's children together or not at all;
          - all within 3M points.

          **What it drops:** when the budget needs room, the held tiles the view no longer wants. Out of view first, then the smallest, leaves before parents, never a root. A still view settles.

          **What it draws:** only the tiles whose points reach into the view.

          **What it measures by:** a read tile counts by where its points lie, not by its octree cube, which can be 10 times larger than the data.

          **On release 7:**
          - the opening view holds 853,382 of 2,085,809 points, with no hole;
          - under a 300k budget the view stays within it and settles after 51 requests;
          - first points come in 211 ms at p95.

          **Left open:**
          - Below the budget nothing is dropped, as the spec says, so a long zoom keeps what it fetched on the way. That is fine at 3M for release 7.
          - The 90 % core is found with a sort once per tile read.
        tone: success
