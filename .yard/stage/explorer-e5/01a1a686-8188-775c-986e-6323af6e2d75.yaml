        title: "The panel is headed by the object's name"
        detail: |-
          **Done when** `ObjectPanel.test.tsx` shows:
          - Andromeda found by name is headed "Andromeda", with its id beside it;
          - an object opened by click is headed by its first name;
          - an object with no name is headed by its source's designation.
        state: open
