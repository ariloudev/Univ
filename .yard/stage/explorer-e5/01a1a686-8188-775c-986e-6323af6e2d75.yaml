          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Find what a record says an object is"
        detail: |-
          **Done when** a note states:
          - whether release 7's object record holds a type (star, galaxy, galaxy group): the record's `kind` is one entry versus a group, and the volume query's `kinds` filter reads a kind term;
          - where that term lives;
          - whether the API returns it.

          If it is not returned, the note says what server or ingest change would return it, and that change moves to R1.
        state: open
