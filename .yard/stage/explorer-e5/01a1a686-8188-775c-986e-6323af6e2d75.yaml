        revision: 6
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Spec: names and the chosen structure's colour"
        detail: |-
          **Scope:**
          - `read-an-object`: the panel is headed by the object's name, the one it was found by or else its first name, with its id beside it, and it says what the object is where the record does;
          - `see-the-structures`: the chosen structure's outline, markers and members are drawn in a colour of their own until another is chosen or the panel closes.

          **Done when** `loft fmt --check` and `loft check --fail-on warning` pass, and the spec is committed alone with its `spec-change` block.
        state: open
