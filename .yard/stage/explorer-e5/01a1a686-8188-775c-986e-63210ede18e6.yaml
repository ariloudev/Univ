  - key: 01a1a688-990c-75b1-8cef-920fdd17ae4f
    id: x5-order
    kind: note
    versions:
      - key: 01a1a688-990c-75b1-8cef-92138c830c8a
        at: 2026-11-04T12:28:52Z
        revision: 3
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "The order of work"
        markdown: |-
          | Wave | Branch | Items | Ends with |
          |---|---|---|---|
          | E5 | stage/explorer-e5 | 1 frustum culling, 2 eviction, 3 ranking, 4 dynamic refinement | spec change to draw-the-catalogues; lod and renderer tests; a live check with the budget lowered so eviction happens |
          | E6 | stage/explorer-e6 | 5 names, 6 and 7 the chosen structure's colour | spec change to read-an-object and see-the-structures |
          | S1 | stage/explorer-s1 | the Vela spike | a recommendation note, and the spec change it implies for release 8 |
          | R1 | stage/release-8-r1 | 8 star colours and spectral types | ingest columns, tile encoding v2, the TypeScript decoder, the tile-format contract |
          | R2 | stage/release-8-r2 | 9 curated superstructures (and S1's volumes) | research, structure files, science checks |
          | R3 | stage/release-8-r3 | build and publish release 8 | the benches and the science checks on it |
          | E7 | stage/explorer-e7 | stars drawn in their colour | waits for the owner to ask for the merges of release 8 |

          What comes after this needs your approval:
          - **E5, E6 and S1** are within the explorer, whose spec you pre-approved, so they run without stopping.
          - **Release 8 changes the tile-format contract and ingest's spec.** I'll send that spec change for your approval before building it.
