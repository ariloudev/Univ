blocks:
  - key: 01a1a686-8188-775c-986e-63257fdb5a56
    id: x5-findings
    kind: note
    versions:
      - key: 01a1a686-8188-775c-986e-632db2f84e3a
        at: 2026-11-04T12:26:35Z
        revision: 1
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "What I found before planning"
        markdown: |-
          **Star colours (8).** Nothing in release 7 can colour stars by class:
          - the sources keep magnitudes only (Hipparcos `Hpmag`, Gaia `phot_g_mean_mag`, GCNS `Gmag`), with no colour index and no spectral type;
          - a tile carries only position, id, source and the kind of distance value.

          Colouring stars needs three things: ingest reading new columns, a new tile column (encoding v2, which the server streams unchanged), and a release 8.

          **Superstructures (9).** Release 7 has 26 structures:
          - **Walls and superclusters:** Big Ring, BOSS Great Wall, CfA2 Great Wall, Hercules–Corona Borealis Great Wall, Hercules Supercluster, Ho'oleilana, Horologium–Reticulum, Perseus–Pisces, Pisces–Cetus Complex, Saraswati, Shapley, Sloan Great Wall, South Pole Wall, Vela;
          - **Quasar and gamma-ray-burst structures:** Clowes–Campusano LQG, Huge-LQG, Giant Arc, Giant GRB Ring;
          - **Voids:** Bootes, Dipole Repeller, Eridanus supervoid, Giant Void, Hercules Void, KBC, Local Void, Sculptor.

          Not all known superstructures are in. Notable ones missing as structures:
          - Laniakea (it is in the release only as a basin of the CF4 grid, which the explorer does not draw);
          - the Virgo or Local Supercluster;
          - Coma, Hydra–Centaurus, the Great Attractor and Norma, Pavo–Indus, Corona Borealis;
          - Quipu (Böhringer et al. 2025).

          Each structure file quotes its paper sentence by sentence, so adding them is ingest research work and needs a new release.

          **Andromeda's "body" (5).** The record's `kind` says whether the object is one catalogue entry (`body`) or a galaxy group. It is not what the object is. Whether a star or galaxy class can be shown depends on what the record carries; E6 will find out. The heading "Object 856254" is the explorer's own choice and will become the object's name.

          **Vela (spike).** Vela is placed by a point, but its paper gives a sky extent of 25° × 20° (lower limits) and two walls at cz ≈ 18,000 and 22,000 km/s. That is enough to draw an approximate sky-and-depth sector. The spike will look at every point-placed structure the same way.
  - key: 01a1a686-8188-775c-986e-6326163d4531
    id: q-colour
    kind: question
    versions:
      - key: 01a1a686-8188-775c-986e-632e01932a6b
        at: 2026-11-04T12:26:35Z
        revision: 1
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        prompt: "How should stars be coloured by class?"
        header: "Star colour"
        context: "Release 7 holds no colour or spectral type for any star. Every option except the last needs an ingest wave, tile encoding v2 and a release 8."
        options:
          - label: "Colour index"
            detail: "Ingest reads each catalogue's colour: Gaia BP−RP, Hipparcos B−V (vizier I/311) and GCNS BP/RP. A tile column carries it, and the explorer maps it to the colour of a star of that temperature through a cited table (Pecaut & Mamajek 2013). The panel gives the colour as measured and the class as estimated. This covers almost every star, so I recommend it."
            recommended: true
          - label: "Spectral types"
            detail: "Published spectral classes where a catalogue has them, such as Hipparcos's SpType (about 118,000 stars) and Gaia DR3's ESP-HS classes (hot stars only). Most of the 2 million stars would stay uncoloured."
          - label: "Both"
            detail: "Colour comes from the colour index, and the panel names the published spectral type where there is one. This is the most ingest work."
          - label: "Not now"
            detail: "Stars keep the kind-of-value colouring, and the waves stay within the explorer."
    responses:
      - key: 01a1a688-3bf0-7181-a597-f253d089d5c9
        at: 2026-11-04T12:28:28Z
        revision: 2
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "Both"
  - key: 01a1a686-8188-775c-986e-63273d56027f
    id: q-structures
    kind: question
    versions:
      - key: 01a1a686-8188-775c-986e-632f589d10fe
        at: 2026-11-04T12:26:35Z
        revision: 1
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        prompt: "Which superstructures should be added?"
        header: "Structures"
        context: "Each structure is a YAML file whose every number quotes its paper's sentence, with kinds of value and uncertainties. A fair definition of \"all known\" is needed so the list has an end."
        options:
          - label: "Curated list"
            detail: "Every structure named in a peer-reviewed paper that gives a position, from the two Wikipedia lists (largest cosmic structures; superclusters) checked against their primary papers. That is roughly 20 to 30 more, Laniakea's neighbours included. It means a research-heavy ingest wave and release 8. I recommend it because it gives a list with an end and a source for each entry."
            recommended: true
          - label: "Local first"
            detail: "Only the nearby ones: Laniakea, Virgo, Hydra–Centaurus, the Great Attractor and Norma, Pavo–Indus, Coma, Perseus–Pisces's neighbours. Smaller, and the ones most worth flying to."
          - label: "Not now"
            detail: "Keep the 26."
    responses:
      - key: 01a1a688-3bf0-7181-a597-f254e538dc46
        at: 2026-11-04T12:28:28Z
        revision: 2
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "Curated list"
