        title: "What E0 produced"
        markdown: |-
          - `clients/explorer` builds and tests under the gate: 14 unit tests, fallow clean.
          - The explorer opens on the latest release (7, Planck 2018) and offers every release not pruned. When the server is down it names the address it tried and the command to run, and tries again.
          - `cargo xtask explore` starts everything on `127.0.0.1:5317`, with a fresh extended-tier key that only the proxy holds.

          **Next, E1:** the scene. Its pure modules are drafted already: camera, controls, LOD, tiles, catalogue, renderer, controller.
        tone: success
