        title: "cargo xtask explore and the explorer gate"
        detail: |-
          `cargo xtask explore` starts the Worker on the real state, issues an extended key, and runs Vite on `127.0.0.1:5317`. Two ports were changed on the way: 5174 belonged to another project's Vite, and `localhost` had bound to IPv6 alone.

          Verified live: 310 reads in a row through the proxy all answered 200, past the anonymous limit of 300, so the key is in use. `cargo xtask check` gains the `explorer` gate (`pnpm install --frozen-lockfile`, then `pnpm check`).
        state: done
