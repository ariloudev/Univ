        title: "Scaffold clients/explorer"
        detail: |-
          `clients/explorer` uses Vite 8, TypeScript 7 strict, React 19, Tailwind 4, zod, Vitest 4 with Istanbul coverage, and fallow. It is its own pnpm root (a workspace file above the repository made pnpm look elsewhere). `pnpm check` passes.

          The tile decoder and axe are left out until their first use, because fallow refuses unused dependencies.
        state: done
