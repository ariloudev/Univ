        title: "Open the explorer: releases, choice, unreachable server"
        detail: |-
          4 App tests with a mocked `fetch`:

          - the latest release is drawn and named;
          - every release not pruned is offered, and the chosen one is drawn;
          - the unreachable screen gives its address and command, and Try again works;
          - a problem is named.

          Checked in Chromium against the real server: the header shows release 7 and its cosmology, with no console errors.
        state: done
