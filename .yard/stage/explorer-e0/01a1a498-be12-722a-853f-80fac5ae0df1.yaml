        detail: "Done when unit tests show a 429 retried after `Retry-After`, a problem's status and title surfaced, and zod-checked releases."
        state: open
      - key: 01a1a49e-1559-7288-ad94-a752bbe0734e
        at: 2026-11-04T03:33:06Z
        revision: 2
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "API client with problem details and 429 retry"
        detail: |-
          `src/api/client.ts` and `schemas.ts`, with 7 unit tests:

          - a 429 is read again after `Retry-After`, or after 60 s when it gives none;
          - the release appears on pinned reads;
          - a problem surfaces its status and title;
          - a failed connection, or a proxy's own 5xx, counts as unreachable;
          - answers are checked by zod;
          - an aborted read stays aborted.
        state: done
