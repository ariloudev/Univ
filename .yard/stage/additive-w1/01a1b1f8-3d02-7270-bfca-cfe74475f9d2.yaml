      - key: 01a1b1f8-a6ea-7764-8dbb-caffea4a3271
        at: 2026-11-06T17:47:05Z
        revision: 2
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "A shard may now hold two runs of one domain"
        markdown: "Kept placement can give a shard two separate runs of cells of one scale domain (a new cell packed after another shard's, or cells given up by an over-budget shard). `shard_cells` is keyed by `(release, shard, domain)`, so such a build would stop on its key check rather than write a wrong index. Schema 6 (W2) keys `shard_cells` by its `first` cell as well; W2 carries a test of a shard with two runs."
        tone: warning
      - key: 01a1b201-bd81-77af-8e31-5b9d420c6a3e
        at: 2026-11-06T17:57:00Z
        revision: 4
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "A shard may now hold two runs of one domain"
        markdown: "Kept placement gives a shard separate runs of one scale domain when a new cell lands between its cells and goes to the last shard. `shard_cells` was keyed by `(release, shard, domain)`, so a release adding a source stopped on its key check: W1's own source test hit it. Its key is now `(release, shard, domain, first)`; Univ Server already reads every run as its own row. Local D1 still holds release 10 under the old key: nothing is published onto it until W5's migration rebuilds every table under schema 6, whose number W2 sets."
        tone: info
  - key: 01a1b201-bd81-77af-8e31-5b9c3bcbea6a
    id: w1-review-findings
    kind: note
    versions:
      - key: 01a1b201-bd81-77af-8e31-5b9eab20c61f
        at: 2026-11-06T17:57:00Z
        revision: 4
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "What the reviews changed"
        markdown: |-
          | Finding | Change |
          |---|---|
          | source_details numbered sources by position (code review) | numbered by the kept source index; the fixture test now puts a source back in the middle and checks each source keeps its details |
          | a new cell inside a shard's old run could push its old cells out (code review) | the numbering keeps the exact cells each shard held; only those stay, new cells go to the last shard |
          | a missing numbering.yaml renumbered everything silently (altitude) | numbering is part of `State`, refused when missing beside a ledger that lists releases, like the entry ids |
          | one number twice in a hand-edited file (code review) | refused on read |
          | empty trailing shards kept forever; an emptied bucket lost its shard (code review) | trailing empty shards dropped; a bucket keeps its shard while empty |
          | the never-twice numbering written three times, two lookups per term (reuse, simplification, efficiency) | one `Numbers` under terms, sources and chains, one lookup per call |
          | chains held in two places; `Previous` and closures in packing (simplification, altitude) | chains only in the numbering; `pack` takes `&Kept`, placement in its own module |
          | version check copied; test copied `build_next` (reuse) | `yaml::version_is`; the test uses `build_next` and `State::read` |
          | assemble.rs and packing.rs over 500 lines | `place` in `placing.rs`; `cell_index` and `manifest_sources` moved beside what they describe |
        tone: success
  - key: 01a1b205-1e22-74a0-ae13-01985ad67521
    id: w1-produced
    kind: note
    versions:
      - key: 01a1b205-1e22-74a0-ae13-019ad0c861c8
        at: 2026-11-06T18:00:42Z
        revision: 5
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "What W1 produced"
        markdown: |-
          - **numbering.yaml** beside the id state: every term, source and chain number ever given, and the exact level-0 cells and buckets each object shard holds. A state without it, once a release exists, is refused.
          - **Numbers never given twice**; a release names only what it uses.
          - **Placement kept**: a cell or bucket stays in the shard that held it; new ones fill the last shard; only a shard whose own cells outgrow the budget gives any up, last first; trailing empty shards go.
          - **shard_cells keyed by its first cell**, since a shard may now hold several runs of one domain.

          Proved on the fixture: a structure-only release writes every object, term, source, chain and shard row as the release before; a release adding a source in the middle of the list keeps the numbers, rows, shards and source details of everything it leaves alone.

          **For W5**: release 10's state has no numbering.yaml; it must be seeded from the published release before release 11 is built.
        tone: success
