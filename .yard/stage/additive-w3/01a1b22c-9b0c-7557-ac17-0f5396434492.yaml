    title: "W3: Ingest writes the change"
    goal: "A build writes only the rows it adds or changes and the retirements of those it drops, by comparing with the row index of the release before, and records the change in manifest v3."
    status: active
blocks:
  - key: 01a1b22c-9b0c-7557-ac17-0f54b8413107
    id: w3-index
    kind: task
    versions:
      - key: 01a1b22c-9b0c-7557-ac17-0f5c3ba90c88
        at: 2026-11-06T18:43:50Z
        revision: 1
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Row index kept in the state"
        detail: "rows/{database}/{table}.idx per per-release table: key hash, content hash (both without release), the release that added the row, its key as SQL literals. Written by every build into rows.part, moved into states/{n}/ on install; the replaced state's index removed. A state that lists releases but holds no index is refused (W5 seeds release 10's)."
        state: done
  - key: 01a1b22c-9b0c-7557-ac17-0f55f4219e23
    id: w3-diff
    kind: task
    versions:
      - key: 01a1b22c-9b0c-7557-ac17-0f5d5b5e6dd5
        at: 2026-11-06T18:43:50Z
        revision: 1
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Compare at D1Writer::add_at, retire by key"
        detail: "Unchanged rows are not written and keep the release that added them; new and changed rows are written as release n. At finish, rows of the index not kept become UPDATE … SET retired = n WHERE (key) IN (VALUES …) files, parts r001…, per table and database, the vanished shard included (a shard the release before held stays one release so its rows can be retired)."
        state: done
