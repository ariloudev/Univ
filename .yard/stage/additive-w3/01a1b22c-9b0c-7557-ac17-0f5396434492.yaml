          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "Tests: structure only, source added and dropped"
        detail: "stable_rows: a structure-only release writes no object-shard row or file and retires none; shared_rows: releases 1→4 (structure added, source added, source dropped) keep every pinned read of the earlier ones, see each key once, and pass publish's fingerprint and content checks over the rows valid in them. The test loader and the API fixture read a release through the releases before it."
        state: done
