    kind: plan
    versions:
      - key: 01a1a779-15a7-718e-b164-bc1c68367423
        at: 2026-11-04T16:51:32Z
        revision: 21
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Plan: R2, building release 8's curated superstructures"
        markdown: |
          # Plan: R2, building release 8's curated superstructures

          ## Context

          The plan you approved earlier (E5, E6, S1, release 8, E7) is unchanged in its order. E5, E6, S1,
          R1 and the develop merge and publish 4 are done. This plan replaces only R2's tasks, because your
          answers in the Yard Log changed R2's scope:

          - **Scope:** the superstructures each paper places, from both Wikipedia lists, plus the named
            supervoids, as hand-cited structure files. That is about 27 files. The catalogued voids
            (about 110) and the 22 Einasto 2001 catalogue superclusters move to a later wave that reads
            them as catalogue sources.
          - **Voids with unknown bounds:** drawn as a marker with three lines along their published
            extents, and no box. The spec change is approved and committed (`3d5545b`).
          - **Sky-region bounds and "(at least)":** the spec change is approved and committed
            (`1d49952`). Its code is written and tested but not committed yet.

          Branch `stage/release-8-r2` (cut from `product/release-8`), Yard Log open, stage `r2`.

          ## Tasks

          | Task | Scope | Done when |
          |---|---|---|
          | **r2-t-bounds**, **r2-t-label**, **r2-t-volumes** (written) | Commit the uncommitted code. It covers: univ-model sky-region bounds from cells (`geometry/bounds.rs`); `Derivation.at_least`; the structure file's `at_least`, centred sky regions (`Sides`) and the `\|x\| < N` rule; Vela, Shapley and Horologium–Reticulum as sky regions; the explorer's "(at least)" (`structureName` in `scene/structures.ts`) | the background run of every workspace test and `pnpm check` is green; fixtures and the OpenAPI snapshot regenerated; one commit with `.yard/` |
          | **r2-t-extents-ingest** | A structure file may give `extents: {x, y, z}` (each `Cited`, a length or a velocity) along its position's Cartesian frame axes. `structures/check.rs` checks the citations. `release/shapes.rs::point` sets `Derivation.extents = {frame, axes: [Vec3; 3], from}`, each axis the frame's unit vector turned to ICRS (the frame rotation `between(frame, Icrs)`) times the full extent in Mpc. A velocity extent is divided by the release H0, as the paper itself converts it; a length is rescaled with `place.rs::length`. Bounds stay at the point (`place.rs::point` unchanged). New `Extents` type in `univ-model/src/api/structures.rs`, `skip_serializing_if` none | `structure_details` test: the Hercules Void's SGX axis has ICRS length 11600/H0 Mpc and points along supergalactic X; its bounds are its point's; a structure without extents serializes none |
          | **r2-t-extents-voids** | `extents` in hercules-, sculptor- and local-void.yaml, citing the sentences already in the files | the structure file tests pass |
          | **r2-t-extents-explorer** | `api/structures.ts` reads `derivation.extents`; `drawingOf` adds three segments, centre ± axis/2, to a point's marker; the panel adds "Its bounds are unknown: the lines are its published extents about its position, which need not be its middle." | `structures.test.ts`: three segments of the given lengths centred on the marker, and no box; `StructuresPanel.test.tsx`: the sentence appears only with extents |
          | **r2-t-member-xyz** | Member tables may give `x`, `y`, `z` columns (lengths, h-scaled allowed) in a Cartesian frame such as supergalactic, in place of lon/lat/redshift. `structures/members.rs` validates them; `crossmatch/members.rs` places such a row as a tracer at the rotated, rescaled point. Needed for Tully 1987's Pisces–Cetus Supercluster, whose table gives only SGX/SGY/SGZ | `structure_tracers` test: a supergalactic member at (0, 100, 0) h75⁻¹ Mpc lands at the rescaled ICRS point |
          | **r2-t-box** | A structure primitive `box` given by published ranges along its frame's Cartesian axes, placed as univ-model's oriented box (`Primitive::Box`), its bounds the box. Needed for the Local Supercluster: Tully 1982's "roughly enclosed by the limits −10 < SGX < +10, 0 < SGY < +15, −10 < SGZ < +10 h⁻¹ Mpc" | a `structure_details` test on the Local Supercluster's half-extents (10, 7.5, 10) h⁻¹ Mpc, rescaled |
          | **r2-t-files** (in three batches, by three agents in parallel, then reviewed by me file by file) | One file per included structure, following the existing files' format. Every quote is checked against the paper text in the scratchpad's `r2-research/` (or fetched again where only a summary was read, such as Ophiuchus). Positions use the frame as published (`fk4_b1950`, `icrs` for J2000, `equatorial_equinox_unstated`, `galactic`, `supergalactic`). Where a paper prints no single place, the file uses `unplaced:` with the reason, never an invented centre. | `cargo test -p univ-ingest --test structures` (the file checker) passes, and so do the structure tests |
          | **r2-t-trace**, **r2-t-review**, **r2-t-gate**, **r2-t-close** | Link the tests to the five new criteria. Run `/simplify` and `/code-review` in parallel and fix their findings. Then `cargo xtask check` and `cargo xtask integration` once each, `loft reconcile --accept`, the trace view recorded, the Yard Log closed, and a `--no-ff` merge into `product/release-8` | each green once; the merge commit |

          ### The three file batches

          - **Members (tracers from tables):**
            - U1.11 LQG (38 quasars, Clowes 2012 Table 2);
            - KKL LQGs 2, 5, 8, 11 and 12 (KKL96 Table 1; equinox unstated);
            - Perseus–Pegasus Filament (Batuski & Burns 1985, 20 clusters, galactic, z);
            - Pisces–Cetus Supercluster (Tully 1987, 35 clusters, supergalactic xyz);
            - Hyperion (Cucciati 2018, 7 peaks);
            - COSMOS-z3.1-A (10 peaks);
            - Hydra–Centaurus (Chincarini & Rood 1979, 8 groups, l, b and V0 in the Local Group frame);
            - Lynx (Rosati 1999, 2 clusters);
            - MS 0302+17 (Kaiser 1998, 3 clusters).
          - **Points, sky regions and the box:**
            - Quipu (sky region of its Table 1 RA, Dec and z ranges, which hold every member);
            - King Ghidorah (point);
            - Laniakea (point at the attractor centroid, supergalactic, km/s);
            - Einasto Supercluster (point);
            - Boötes Supercluster (Einasto 1997 SCL 138, B1950, h⁻¹ Mpc);
            - Corona Borealis (Einasto 2001 SCl 158 point; Postman 1988 values);
            - Coma (Gregory & Thompson 1978);
            - Sculptor Wall (da Costa 1988);
            - Ophiuchus (Hasegawa 2000);
            - SCL @ 1604+43 and SCL @ 0018+16;
            - the Local Supercluster (box).
          - **Supervoids:**
            - Bahcall & Soneira 1982 void (sky region of l 150°–240°, b 35°–50°, z 0.03–0.08);
            - the Northern and Southern Local Supervoids (Einasto 1994 Table 5 points; the minor axis as a value).

          Each file decides its own geometry from what its paper prints. The list above is the expected
          outcome, not a licence to place a structure the paper does not place.

          **Left out, as in the list note:** Pavo–Indus (no source names it so), and the ones the note lists.

          ## Order

          1. Commit the written code once the background run is green.
          2. r2-t-extents-ingest, r2-t-member-xyz and r2-t-box in sequence: they share `shapes.rs` and `place.rs`.
          3. The file agents start when the formats they need are in place. The member batch waits for
             xyz, the points batch for the box. The supervoid batch can start at once.
          4. Meanwhile: r2-t-extents-explorer and r2-t-extents-voids.
          5. Review every file, then trace, reviews, gate, integration, close, merge.

          Each task is marked active and done in the Yard Log as it runs. Focused checks between tasks:
          `cargo test -p <crate> <filter>`, clippy on the crate, `pnpm vitest` on the touched explorer
          files, and `cargo fmt`.

          ## Verification

          - **Files:** `cargo test -p univ-ingest` runs the file checker. It refuses an uncited number in
            notes, an `as_published` that doesn't parse or match its quote, and a missing citation.
          - **Placement:** `cargo test -p univ-ingest --test structure_details --test structure_cells
            --test structure_tracers`.
          - **Explorer:** `pnpm check` in `clients/explorer`.
          - **Wave end:** `cargo xtask check` and `cargo xtask integration`, each once and green, with
            the trace accepted.
          - **After R3 builds release 8 (outside this wave):** `cargo xtask science` and the spot checks.
            Laniakea and Vela must be present, Vela as a sky region labelled "(at least)", and the Hercules
            Void drawn as a marker with three axes, checked live with a screenshot.

          ## After R2

          R3 (build release 8, science checks, spot checks), then E7 (star colours), as approved. The
          catalogue wave for the voids and Einasto superclusters is planned when R3 is done.
