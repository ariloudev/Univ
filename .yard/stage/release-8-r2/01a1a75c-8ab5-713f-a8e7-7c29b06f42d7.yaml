  - key: 01a1a75c-8ab5-713f-a8e7-7c2c36b2d221
    id: r2-t-bounds
    kind: task
    versions:
      - key: 01a1a75c-8ab5-713f-a8e7-7c350b8f34de
        at: 2026-11-04T16:20:22Z
        revision: 1
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Sky-region bounds from their cells"
        detail: |-
          **Scope:** `Geometry::bounds` for a sky region becomes the box around its cells between `near` and `far`, from each cell's centre and `healpix::radius_bound`, never smaller than the region.

          **Done when** model tests show:
          - the box holds every cell's corners and edges, sampled finely, at both distances;
          - it is far tighter than the sphere of radius `far` for a small region;
          - the whole sky still gives the sphere's box.
        state: open
      - key: 01a1a76e-be14-7796-bba2-e5d369da7c47
        at: 2026-11-04T16:40:15Z
        revision: 8
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Sky-region bounds from their cells"
        detail: |-
          **Scope:** `Geometry::bounds` for a sky region becomes the box around its cells between `near` and `far`, from each cell's centre and `healpix::radius_bound`, never smaller than the region.

          **Done when** model tests show:
          - the box holds every cell's corners and edges, sampled finely, at both distances;
          - it is far tighter than the sphere of radius `far` for a small region;
          - the whole sky still gives the sphere's box.

          **Progress:**
          - Written: along each axis, a cell at angle θ from it reaches at most cos(max(0, θ − ρ)).
          - The tests pass. A Vela-like slab of order-6 cells is checked against every direction of a 0.25° sky grid at both distances, and the whole sky gives the sphere's box.
          - A first draft took `far` on every side, which would have cut the box short on the sides the region does not face; it was caught in review before it ran.
          - Uncommitted until the spec is approved.
        state: active
  - key: 01a1a75c-8ab5-713f-a8e7-7c2de8941b52
    id: r2-t-label
    kind: task
    versions:
      - key: 01a1a75c-8ab5-713f-a8e7-7c36b6c1017f
        at: 2026-11-04T16:20:22Z
        revision: 1
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "The \"(at least)\" label"
        detail: |-
          **Scope:**
          - the structure detail's derivation states whether any number its shape comes from is a lower limit;
          - the explorer appends "(at least)" to that structure's name in the view and in its panel.

          **Done when** an ingest test shows the flag set for a sky region with a lower-limit bound and unset otherwise, and explorer tests show the label in the view and the panel.
        state: open
      - key: 01a1a76e-be14-7796-bba2-e5d49ef79d99
        at: 2026-11-04T16:40:15Z
        revision: 8
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "The \"(at least)\" label"
        detail: |-
          **Scope:**
          - a structure file's sky region may cite the sentence in which its paper gives the region as a lower limit on the extent (`at_least`);
          - the derivation points at that citation;
          - the explorer appends "(at least)" to the name in the view and in the panel.

          **Done when** an ingest test shows the pointer set for a sky region whose paper says "at least" and unset otherwise, and explorer tests show the label in the view and the panel.

          **Progress:**
          - **Ingest:** `structure_details` shows Vela pointing at its "at least 25° × 20°" citation and Hercules SC not pointing at all, and every pointer resolves in its record.
          - **Explorer:** tests show "Vela Supercluster (at least)" in the drawing's name and in the panel heading.
          - Uncommitted until the spec is approved.
        state: active
  - key: 01a1a75c-8ab5-713f-a8e7-7c2e0aa3b35b
    id: r2-t-volumes
    kind: task
    versions:
      - key: 01a1a75c-8ab5-713f-a8e7-7c374bd6e869
        at: 2026-11-04T16:20:22Z
        revision: 1
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Vela, Shapley and Horologium–Reticulum as sky regions"
        detail: |-
          **Scope:** each structure file is placed by the sky region its paper quotes, with every bound quoted verbatim from the paper's text:
          - Vela: l 255°–285°, |b| ≤ 10°, cz 16,000–24,000 km/s;
          - Shapley: from the published A&A text, its self-disagreement settled and stated;
          - Horologium–Reticulum: 12° × 12° about 03h19m, −50°02′, cz 17,000–22,500 km/s.

          **Done when** the structure tests and the science checks pass, and the files' sentences are checked against the papers.
        state: open
      - key: 01a1a76e-be14-7796-bba2-e5d5bd2c7b3d
        at: 2026-11-04T16:40:15Z
        revision: 8
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Vela, Shapley and Horologium–Reticulum as sky regions"
        detail: |-
          **Scope:** each structure file is placed by the sky region its paper quotes, with every bound quoted verbatim from the paper's text:
          - Vela: l 255°–285°, |b| ≤ 10°, cz 16,000–24,000 km/s;
          - Shapley: from the published A&A text, its self-disagreement settled and stated;
          - Horologium–Reticulum: 12° × 12° about 03h19m, −50°02′, cz 17,000–22,500 km/s.

          **Done when** the structure tests and the science checks pass, and the files' sentences are checked against the papers.

          **Progress:** all three are written and pass the file checks. Each quote was checked against the paper's arXiv TeX.
          - **Vela:** the region of its Fig. 2, "255° ≤ l ≤ 285° and |b| < 10°". The number reader now takes "|b| < 10°" as ±10°. The paper writes its velocity range abbreviated ("16–24 000"), so its ends are cited where printed in full: "emerges at a distance cz ~ 16 000", and the top of Fig. 1's magenta band, 24000.
          - **Shapley:** §4.1's surveyed area, "R.A. ≃ 12h40m to ≃ 14h10m and from Dec ≃ −24° to ≃ −38°", and the main body's 13000–18000 km/s. The abstract's "12 degrees by 30 degrees" disagrees with that box; the notes say so and keep the abstract's numbers as published. The A&A site refused automated reads, so the arXiv v1 text ("accepted for publication") is the one checked.
          - **Horologium–Reticulum:** a new centred form of sky region holds "12° × 12° … centered at approximately α = 03h19m, δ = −50°02′", with its width turned into right ascension at its declination (18.68°). Its range is "at least the redshift range from 17,000 to 22,500".
        state: active
