        title: "The \"(at least)\" label"
        detail: |-
          **Scope:**
          - the structure detail's derivation states whether any number its shape comes from is a lower limit;
          - the explorer appends "(at least)" to that structure's name in the view and in its panel.

          **Done when** an ingest test shows the flag set for a sky region with a lower-limit bound and unset otherwise, and explorer tests show the label in the view and the panel.
        state: open
      - key: 01a1a76e-be14-7796-bba2-e5d49ef79d99
        at: 2026-11-04T16:40:15Z
        revision: 8
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "The \"(at least)\" label"
        detail: |-
          **Scope:**
          - a structure file's sky region may cite the sentence in which its paper gives the region as a lower limit on the extent (`at_least`);
          - the derivation points at that citation;
          - the explorer appends "(at least)" to the name in the view and in the panel.

          **Done when** an ingest test shows the pointer set for a sky region whose paper says "at least" and unset otherwise, and explorer tests show the label in the view and the panel.

          **Progress:**
          - **Ingest:** `structure_details` shows Vela pointing at its "at least 25° × 20°" citation and Hercules SC not pointing at all, and every pointer resolves in its record.
          - **Explorer:** tests show "Vela Supercluster (at least)" in the drawing's name and in the panel heading.
          - Uncommitted until the spec is approved.
        state: active
  - key: 01a1a75c-8ab5-713f-a8e7-7c2e0aa3b35b
    id: r2-t-volumes
    kind: task
    versions:
      - key: 01a1a75c-8ab5-713f-a8e7-7c374bd6e869
        at: 2026-11-04T16:20:22Z
