  - key: 01a1a75c-aa7f-71dc-9419-dec3498c9651
    id: r2-q-voids
    kind: question
    versions:
      - key: 01a1a75c-aa7f-71dc-9419-dec4caae693c
        at: 2026-11-04T16:20:30Z
        revision: 2
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        prompt: "The three voids' papers give their extents but no centre. How should release 8 draw them?"
        header: "Void boxes"
        context: |-
          S1's approval said the Hercules, Sculptor and Local voids get boxes along their published ΔSGX, ΔSGY and ΔSGZ. Reading the files again for R2, I found the papers (Tully et al. 2019, Cosmicflows-3) give each void's **extent** at isodensity −0.7 but **no centre** to put that box around:

          | Void | Extent (ΔSGX, ΔSGY, ΔSGZ) | What the file places it at |
          |---|---|---|
          | Hercules | 11,600 × 7,800 × 14,000 km/s | its deepest minimum, [−1200, +4000, +5000] |
          | Sculptor | 14,500 × 6,500 × 10,200 km/s | its *nearest* basin, [−1200, −1700, −1700] |
          | Local | 5,200 × 3,000 × 4,500 km/s | its deepest minimum, Lacerta-2.4; the file notes "the paper gives no single centre" |

          The deepest minimum need not be the middle of the void. For Sculptor, a 14,500 km/s box about its nearest basin would reach past the Milky Way to the other side.
        options:
          - label: "Keep them as points"
            detail: "Each void stays a marker at the minimum its paper names, and its panel lists the three extents with their citations. Nothing is placed where the paper does not put it. The S1 item for voids is dropped."
            recommended: true
          - label: "Box about the minimum"
            detail: "A box of the published extents, centred on the deepest minimum and drawn as approximate (dashed), its centre marked estimated. The size is right but its placement is a guess, and Sculptor's box would cover the Milky Way."
    responses:
      - key: 01a1a773-9516-74fa-aa38-c2e32a8b51cd
        at: 2026-11-04T16:45:32Z
        revision: 10
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        words: "Why don't we combine the two. Put a marker and 3 axes from it both + and - directions, without making it a box, indicating that it;s a voluminous object, but the bounds are unknown"
