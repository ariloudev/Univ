          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Release 8: sky regions bounded by their cells, and the \"(at least)\" label"
        markdown: |-
          **What changes (the spec-change above):**
          - **read-a-structure:**
            - A structure placed by a sky region is bounded by the box around the region's directions between its near and far distances, not by the sphere of its far distance.
            - The structure's derivation states whether its papers give its shape as a lower limit on its extent, and cites where they say so.
          - **see-the-structures:** such a structure is named with "(at least)" after its name, in the view and in its panel.

          These are S1's approved items 2 and 4, written as criteria.

          **Why I withdrew the first version:** it flagged a shape whose *numbers* were lower limits. The papers' text, now read, puts the "at least" on the region as a whole:
          - Vela: "at least 25° × 20°";
          - Horologium–Reticulum: "more than 12° × 12°" and "at least the redshift range from 17,000 to 22,500";
          - Shapley's main plane is "filling the whole extent of our survey region".

          A near bound of 17,000 km/s is not itself a lower limit. So a structure file's sky region will cite the paper's "at least" sentence, and the flag comes from that citation.

          **Look at:**
          - **Bounds:** ingest already bounds structure sky regions tightly. univ-model's own `bounds`, which layer items use, comes up to the same rule.
          - **Voids:** the question on the voids is still open and separate.
