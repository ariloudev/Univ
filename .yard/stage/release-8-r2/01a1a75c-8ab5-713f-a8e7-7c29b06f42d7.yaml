  - key: 01a1a75c-8ab5-713f-a8e7-7c2c36b2d221
    id: r2-t-bounds
    kind: task
    versions:
      - key: 01a1a75c-8ab5-713f-a8e7-7c350b8f34de
        at: 2026-11-04T16:20:22Z
        revision: 1
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Sky-region bounds from their cells"
        detail: |-
          **Scope:** `Geometry::bounds` for a sky region becomes the box around its cells between `near` and `far`, from each cell's centre and `healpix::radius_bound`, never smaller than the region.

          **Done when** model tests show:
          - the box holds every cell's corners and edges, sampled finely, at both distances;
          - it is far tighter than the sphere of radius `far` for a small region;
          - the whole sky still gives the sphere's box.
        state: open
      - key: 01a1a76e-be14-7796-bba2-e5d369da7c47
        at: 2026-11-04T16:40:15Z
        revision: 8
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Sky-region bounds from their cells"
        detail: |-
          **Scope:** `Geometry::bounds` for a sky region becomes the box around its cells between `near` and `far`, from each cell's centre and `healpix::radius_bound`, never smaller than the region.

          **Done when** model tests show:
          - the box holds every cell's corners and edges, sampled finely, at both distances;
          - it is far tighter than the sphere of radius `far` for a small region;
          - the whole sky still gives the sphere's box.

          **Progress:**
          - Written: along each axis, a cell at angle θ from it reaches at most cos(max(0, θ − ρ)).
          - The tests pass. A Vela-like slab of order-6 cells is checked against every direction of a 0.25° sky grid at both distances, and the whole sky gives the sphere's box.
          - A first draft took `far` on every side, which would have cut the box short on the sides the region does not face; it was caught in review before it ran.
          - Uncommitted until the spec is approved.
        state: active
  - key: 01a1a75c-8ab5-713f-a8e7-7c2de8941b52
    id: r2-t-label
