      - key: 01a1a7aa-afd5-73e0-92a6-983606024d85
        at: 2026-11-04T17:45:43Z
        revision: 31
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "/simplify and /code-review"
        detail: |-
          **Scope:** both run in parallel on `product/release-8...HEAD`, without `.yard/`, `spec/`, the trace and the structure files.

          **Done when** every finding is fixed or skipped with a reason.

          **Result:** committed in `ae9db97`.

          **Fixed:**
          - univ-model scales every geometry kind exhaustively. Ingest's own per-kind rescaling left ellipsoids, paths and rays unscaled in a parsec domain.
          - The sky-region bound evaluates its reach once per axis extreme, not per cell.
          - A Cartesian member table needs redshifts and one unit. Its directions, published to the megaparsec, place members but are not used to check a name match at the 60″ tolerance, which would have refused Pisces–Cetus once a catalogue held its clusters.
          - A centred sky region checks its centre and the poles in degrees.
          - One walker for named pairs of cited bounds. The box's pairs are named as the sky region's, and the box is placed once, into its own type.
          - The explorer frames a structure drawn by its extents by their span, not by its zero-size bounds.
          - Tests read the structure files once, and the cannot-be-placed test no longer special-cases one file.
          - A misplaced doc comment, a dead latitude reordering, and a duplicated length rule.

          **Skipped, with reasons:**
          - **One bounds path for sky regions** (index bounds from the cells rather than ingest's sampled box). It would change every sky region's index bounds and the unstated-equinox margin, so it belongs in a change of its own.
          - **Velocity extents as v/H0.** That is how the papers convert them, and the derivation records the method.
        state: done
