  - key: 01a1a792-993c-74c5-b00f-53ac9781e90a
    id: r2-note-files
    kind: note
    versions:
      - key: 01a1a792-993d-7044-a574-dea1170951c2
        at: 2026-11-04T17:19:24Z
        revision: 29
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "The structure files written, and what was left out"
        markdown: |-
          27 new files, 53 in all. Every number is cited, and every quote was checked against the paper's text. Scanned pages were checked on their images.

          | Placed by | Structures |
          |---|---|
          | Members | U1.11 LQG (38 quasars); KKL LQGs 2, 5, 8, 11 and 12; Perseus–Pegasus Filament (20 clusters); Pisces–Cetus Supercluster (36 clusters, supergalactic X/Y/Z); Hyperion (7 peaks); COSMOS-z3.1-A (10 peaks); Lynx (2 clusters); MS 0302+17 (3 clusters) |
          | Point | King Ghidorah; Laniakea (attractor centroid); Einasto Supercluster; Boötes Supercluster; Corona Borealis; Coma (at the Coma cluster, so labelled); Sculptor Wall; Ophiuchus (at its cD cluster) |
          | Sphere | Northern and Southern Local Supervoids (Einasto 1994's empty-sphere diameters, which the paper takes as minor axes) |
          | Sky region | Quipu (the box holding its members); Bahcall–Soneira void (its most depleted volume) |
          | Box | Local Supercluster (Tully 1982) |
          | Unplaced, with values | SCL @ 1604+43 (only a member's position is printed); SA 68 Supercluster, SCL @ 0018+16 (its ellipse centre comes from a field the structure runs off) |

          **Corrections to the survey:**
          - Pisces–Cetus has 36 clusters, not 35. A281 was checked on the page image.
          - Laniakea's frame is read from the Extended Data captions.
          - The Coma and Ophiuchus notes now say their velocities are placed as heliocentric, which is how the pipeline reads an unstated frame.

          **Left out, with reasons:**
          - **Hydra–Centaurus.** Chincarini & Rood give Local Group-frame velocities, and the pipeline refuses that frame everywhere, sources included, because it has no cited Local Group apex. It moves to the catalogue wave, with a cited correction.
          - **COSMOS-z3.1-A's per-peak position errors.** A member column holds one uncertainty. The file says so.
          - **U1.11's 2.95σ and Perseus–Pegasus's "310h⁻¹".** The number reader cannot read a number printed glued to its symbol. Perseus–Pegasus keeps the abstract's "over 300".
          - **Masses, areas and densities.** univ-model has no units for them.

          **Shared name:** the Northern Local Supervoid (Einasto 1994) and the Hercules Void (Tully 2019) both carry "Northern Local Void". The supervoid's notes say they are kept apart, each as its paper places it.
        tone: info
