        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Release 8: voids drawn as a marker with their published extents as three axes"
        markdown: |-
          **What changes:**
          - **read-a-structure:** a structure whose papers give its extent along each axis of a frame, but not where it ends, gives those extents about its position: in ICRS megaparsecs, naming the frame they were published in, each citing its number. Its bounds stay those of its position.
          - **see-the-structures:**
            - such a structure is drawn as its marker with one line through it along each axis of that frame, as long as the extent along that axis and centred on the marker, and no box;
            - its panel says its bounds are unknown and that the lines are its published extents about its position, which need not be its middle.

          **Look at:** each line is the full published width, half each way from the marker. For Hercules that is ±5,800 km/s along supergalactic X.

          **First users:** the Hercules, Sculptor and Local voids (Tully et al. 2019, extents at isodensity −0.7).
