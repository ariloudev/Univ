        prompt: "Wikipedia's list of the largest cosmic structures yields about 150 entries, mostly catalogued voids. Which should release 8 include as structure files?"
        header: "List scope"
        context: |-
          Every number below was read from the primary papers (some scanned papers were checked on the page images).

          | Group | Entries | Examples | Sources |
          |---|---|---|---|
          | **Superstructures** | about 16 | U1.11 LQG, Quipu (Böhringer 2025), King Ghidorah (2023), Laniakea, Hyperion, KKL LQGs 2/5/8/11/12, Perseus–Pegasus Filament, Boötes Supercluster, Pisces–Cetus Supercluster, Coma, Hydra–Centaurus, Sculptor Wall, Pavo–Indus | one paper each, positions or member lists, quotable |
          | **Named supervoids** | about 4 | Bahcall & Soneira 1982 void (also listed as B&B Abell-9 and Einasto row 10: one record), Northern and Southern Local Supervoids | Einasto 1994 Table 5; BS82 |
          | **Catalogued voids** | about 110 | Mao 2017 BOSS voids (34), SSRS2 (15), IRAS (13), Batuski & Burns 1985 (14, plus 5 with ranges only), Tully 1986 (10), Einasto 1994 (3 more), Lu & Freudling 1995 (4), SSRS1 (3) | rows of catalogue tables, each a centre, distance and size; several below their own papers' significance cut |

          **Leave out (11):**
          - the "theoretical limit" row;
          - the Virgo Supercluster: de Vaucouleurs 1953 prints no distance;
          - the Ursa Major–Lynx and Pegasus superclusters: no primary paper uses these names;
          - duplicates of structures already in, and two member clusters of Saraswati;
          - the Pegasus Void: unverified, as its source is a book.

          The survey also found several errors in Wikipedia's figures: light-year sizes with h dropped, KKL citations pointing to the wrong papers, and a wrong Northern Local Supervoid position.

          The survey of the supercluster list is still running and may add to the first group.
        options:
