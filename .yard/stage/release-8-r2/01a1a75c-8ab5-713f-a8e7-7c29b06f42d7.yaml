      - key: 01a1a75e-11dd-7540-b475-3f48badc8011
        at: 2026-11-04T16:22:02Z
        revision: 4
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Release 8: sky regions bounded by their cells, and the \"(at least)\" label"
        markdown: |-
          **What changes (the spec-change above):**
          - **read-a-structure:**
            - A structure placed by a sky region is bounded by the box around the region's directions between its near and far distances, not by the sphere of its far distance.
            - The structure's derivation states whether any number its shape comes from is a lower limit.
          - **see-the-structures:** such a structure is named with "(at least)" after its name, in the view and in its panel.

          These are S1's approved items 2 and 4, written as criteria.

          **Look at:**
          - **Bounds:** ingest already bounds structure sky regions tightly from their longitude and latitude box, and the structure record gives that box. The change brings univ-model's own `bounds` (which layer items use) up to the same rule, so this criterion holds for every sky region, not only structures.
          - **Lower limits:** "lower limit" means a cited number whose uncertainty is the lower-limit form, such as Vela's "at least 25°×20°". The flag lives in the derivation, so a client needs no record walk to show it.
          - **Voids:** the question on the voids is separate, as its answer changes no criterion.
