          | Group | Entries | Examples | What the source gives |
          |---|---|---|---|
          | **Superstructures from their own papers** | about 27 | U1.11 LQG, Quipu, King Ghidorah, Laniakea, Hyperion, KKL LQGs 2/5/8/11/12, Perseus–Pegasus Filament, Pisces–Cetus SC, Coma, Hydra–Centaurus, Corona Borealis, Sculptor Wall, Ophiuchus, Local SC (Tully 1982), Einasto SC, Lynx, COSMOS-z3.1-A, SCL@1604+43, SCL@0018+16, MS 0302+17 | a position or members, a redshift, and usually an extent |
          | **Named supervoids** | about 3 | Bahcall & Soneira 1982 void (one record for three listings), Northern and Southern Local Supervoids | centre, distance, size |
          | **Einasto 2001 catalogue superclusters** | about 22 | Leo, Draco, Grus, Microscopium, Aquarius, Boötes A, … | a B1950 centre, a distance in h⁻¹ Mpc and member Abell clusters; **no extent**; two rest mostly on estimated distances |
          | **Catalogued voids** | about 110 | Mao 2017 BOSS voids, SSRS2, IRAS, Batuski & Burns 1985, Tully 1986, Lu & Freudling 1995, SSRS1 | rows of catalogue tables: centre, distance, a size; several below their own papers' significance cut |

