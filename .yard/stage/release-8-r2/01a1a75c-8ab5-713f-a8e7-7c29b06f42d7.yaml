          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Every candidate from Wikipedia's two lists, with its decision"
        markdown: |-
          Read from the primary papers by two surveys: the list of the largest cosmic structures, and the list of superclusters. Scanned papers were checked on the page images. Notes and papers are in the session scratchpad, under `r2-research/`.

          ### Included in R2: hand-cited structure files

          | Structure | Primary source | Caveat |
          |---|---|---|
          | U1.11 LQG | Clowes et al. 2012, MNRAS 419, 556 | 2.95σ |
          | Quipu | Böhringer et al. 2025, A&A 695, A59 | only 10 of 68 members printed; equinox unstated |
          | King Ghidorah | Shimakawa et al. 2023, MNRAS 519, L45 | photometric redshifts |
          | Laniakea | Tully et al. 2014, Nature 513, 71 | centroid of the attractor region; frame read from the figures as supergalactic |
          | Hyperion | Cucciati et al. 2018, A&A 619, A49 | seven peaks |
          | KKL LQGs 2, 5, 8, 11, 12 | Komberg, Kravtsov & Lukash 1996, MNRAS 282, 713 | Wikipedia cites the wrong papers; LQG 2's significance not evaluable |
          | Perseus–Pegasus Filament | Batuski & Burns 1985, ApJ 299, 5 | "a possible filament" |
          | Pisces–Cetus Supercluster | Tully 1987, ApJ 323, 1 | a component of the complex already in |
          | Coma Supercluster | Gregory & Thompson 1978, ApJ 222, 784 | |
          | Hydra–Centaurus | Chincarini & Rood 1979, ApJ 230, 648 | H = 50 |
          | Corona Borealis | Postman, Geller & Huchra 1988, AJ 95, 267 | |
          | Sculptor Wall | da Costa et al. 1988, ApJ 327, 544 | the paper's "wall" |
          | Ophiuchus Supercluster | Hasegawa et al. 2000, MNRAS 316, 326 | lower limits on its extent; to be checked against the journal text |
          | Local Supercluster | Tully 1982, ApJ 257, 389 | |
          | Einasto Supercluster | Sankhyayan et al. 2023, ApJ 958, 62 | |
          | Lynx Supercluster | Rosati et al. 1999, AJ 118, 76 | two clusters; extent is a separation |
          | COSMOS-z3.1-A | Ramakrishnan et al. 2025, arXiv 2511.11826 | journal reference not yet on arXiv |
          | SCL @ 1604+43 | Lubin et al. 2000, ApJ 531, L5 | "at least 5.5 h⁻¹ Mpc" |
          | SCL @ 0018+16 | Connolly et al. 1996, ApJ 473, L67 | Selected Area 68, not Wikipedia's SA26 |
          | MS 0302+17 | Kaiser et al. 1998 (arXiv) and Gavazzi et al. 2004, A&A 422, 407 | |
          | Boötes Supercluster | Einasto et al. 1994 row 83 / 1997 SCL 138 | no discovery paper; Wikipedia's size unsourced |
          | Bahcall & Soneira 1982 void | Bahcall & Soneira 1982, ApJ 262, 419 | one record for B&B Abell-9 and Einasto 1994 row 10 too |
          | Northern Local Supervoid | Einasto et al. 1994, Table 5 row 24 | Wikipedia's position is wrong |
          | Southern Local Supervoid | Einasto et al. 1994, Table 5 row 9 | |

          Pavo–Indus (Winkler 1983) is in neither column for now. The first survey found it as the "Indus supercluster" of a non-refereed paper; the second found no source that names it Pavo–Indus. It stays out unless the plan says otherwise.

          ### A later wave: read as catalogue sources
          - the catalogued voids: Mao et al. 2017 (34), El-Ad & Piran 1997 SSRS2 (15), El-Ad, Piran & da Costa 1997 IRAS (13), Batuski & Burns 1985 (19), Tully 1986 (10), Einasto et al. 1994 (3), Lu & Freudling 1995 (4) and da Costa et al. 1988 SSRS1 (3);
          - the 22 named Einasto 2001 superclusters, such as Leo, Draco, Grus, Microscopium and Aquarius.

          ### Left out
          | Entry | Why |
          |---|---|
          | "Theoretical limit" | a statistical bound, not a structure |
          | Virgo Supercluster per de Vaucouleurs 1953 | no distance; the Local Supercluster per Tully 1982 is in |
          | Ursa Major–Lynx, Pegasus SC, Columba, Southern Supercluster | no primary source uses the name or places it |
          | SCL @ 1338+27 | its paper prints no coordinates |
          | Pegasus Void | its source is a book I could not read |
          | Abell 2361, ZwCl 2341.1+0000 | member clusters of Saraswati |
          | IRAS voids 4 and 10, SSRS1 void 3, Tully void 5 | the Local, Sculptor and Boötes voids, already in |
          | Saraswati, Perseus–Pisces, Hercules SC, Shapley, Pisces–Cetus complex, Horologium–Reticulum | already in |

          **Wikipedia errors found:** most light-year sizes drop h; KKL citations point to unrelated papers; "1994EEDTAWSS" is Einasto 1994's Table 5; IRAS void 1's X is −10.7, not −10.4; the "SSRS2" void list is Einasto 1994's Table 5.
        tone: info
