          - names no primary source uses: Ursa Major–Lynx, Pegasus SC, Columba, the Southern Supercluster;
          - SCL@1338+27, whose paper prints no coordinates;
          - the Pegasus Void, unverified because its source is a book;
          - duplicates of structures already in, and Saraswati's member clusters.

          The surveys also found errors in Wikipedia's figures: light-year sizes with h dropped, KKL citations pointing to the wrong papers, a wrong Northern Local Supervoid position, and "SA26" for SCL@0018+16, which its paper calls SA 68.
        options:
          - label: "Papers' structures and supervoids"
            detail: "About 30 hand-cited files in R2. The Einasto 2001 superclusters and the catalogued voids come later as catalogue sources: each table one source with its terms and credit, read by the pipeline rather than retyped, keeping significance columns and estimated-distance flags."
            recommended: true
          - label: "Also Einasto's superclusters"
            detail: "About 52 files in R2: the above plus the 22 Einasto 2001 rows, each placed as a point with its members. Each has no extent, so it is drawn as a marker. The catalogued voids come later."
          - label: "Everything, as files"
            detail: "About 160 hand-cited files in R2. Every row is quotable, but this is several times R2's planned size, and catalogue rows retyped by hand risk transcription errors a table reader would not make."
