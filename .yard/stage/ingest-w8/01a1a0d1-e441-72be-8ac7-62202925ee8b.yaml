          **Release 3**, published:
          - 2,086,261 objects placed; 252 too uncertain.
          - D1 is 2.33 GB; peak RSS 15.4 GB, which the owner accepts.
          - Nearby galaxies has 1,270 points.
          - 106,419 preferred distances changed: 63,194 from the 300 km/s term, 43,225 from CF4 Vcmb redshifts. The median change is 0.03%.
          - M81 3.63, Cen A 3.75, M87 16.77 and the Virgo group 16.12 Mpc.

          **Pruning releases 1 and 2** was blocked by the permission check and waits for the owner.
