        title: "W8 result: the first real releases"
        markdown: |-
          **Live:** release 6, built from 19 real sources and published to local D1 and R2. Releases 1–4 are pruned with their id ledger kept. `cargo xtask science` gives 27 PASS, 0 FAIL, 3 CONCERN.

          | | Release 1 | Release 6 |
          |---|---|---|
          | D1 | 18.05 GB, refused | 2.3 GB |
          | Peak RSS | 66 GB | ~15 GB (accepted) |
          | M81 | 0.72 Mpc | 3.63 Mpc (Cepheids) |
          | Cen A | 11.85 Mpc | 3.75 Mpc (TRGB) |
          | M87 | 24.2 Mpc | 16.77 Mpc (Mei 2007: 16.5 ± 1.1) |
          | Virgo group | 33° off | at the KT17 centre |
          | Publish / prune | 12 min / 4 min | 8 min / 34 s |

          **Owner decisions:**
          - Memory: the current peak is accepted.
          - Ranking: method rank first; among redshifts, measured first, then σ_cz.
          - Distances more than 100% uncertain leave an object unplaced.
          - CF4 galaxies added as the 19th source.
          - Scale domain follows the placed distance.
          - Planck H0 kept, with the ladder offset stated.
          - Releases 1–4 pruned.

          **Found in published catalogues:** 157 CF4 group positions are wrong (148 are corrected from KT17). eRASS1 uses BEST_ZERR = −1 as a sentinel. CF4's V3k above 13,000 km/s is a comoving distance (inferred).

          **Also built:** `cargo xtask science` with 32 cited checks, batched R2, and Ctrl-C that really stops every stage.

          **Left open (plan follow-ups):**
          - the 6-min D1 import;
          - 47 redshift conflicts placed by their higher value;
          - the loose extent-join tolerance;
          - AC-119's wording;
          - release 5's unpublished build;
          - the SDSS rename question;
          - licences before any public deployment.
        tone: success
