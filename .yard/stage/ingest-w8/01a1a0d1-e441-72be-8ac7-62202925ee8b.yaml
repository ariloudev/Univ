        title: "Faster prune and publish: batched R2, prune deletes the local build"
        detail: |-
          The owner asked for this. Every R2 operation of a run goes through one long-running Miniflare script instead of a wrangler process per object. Each upload is still read back and checked against its SHA-256, and the journal and the move of `latest` work as before. Prune also deletes `build/releases/{n}`.

