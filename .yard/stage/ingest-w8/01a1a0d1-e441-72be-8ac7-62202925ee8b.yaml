          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        view: spec-change
        note: |-
          This change records the owner's three W8 decisions and the pre-approved minor items:
          - **RQ-24 ranking order.** If an indicator distance is present, redshift distances above the threshold are set aside. Otherwise the smallest fractional uncertainty wins. A candidate without an uncertainty wins only with a strictly better method rank. It supersedes ADR-12.
          - **RQ-26.** An object whose distance is more than 100% uncertain gets no position.
          - **19th source.** The Cosmicflows-4 galaxies table.
          - **Minor items.** Distance measure, `blank_row`, FK4 and unstated-equinox frames, assumed cosmology, CON-3 restated for all unpruned releases together, and galaxy groups as their own objects.

          The SDSS rename waits for the owner's answer.
