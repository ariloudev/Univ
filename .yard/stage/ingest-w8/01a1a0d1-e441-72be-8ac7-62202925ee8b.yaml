                  "key": "01a19f23-636e-7035-8185-ab97eb9c2fb9",
                  "kind": "feature",
                  "label": "F-6",
                  "name": "Choose the preferred measurement",
                  "words": {
                    "after": "Choose the preferred measurement\n\nChoosing which of an object's measurements places it in three dimensions. A ranking by method\nalone would misplace galaxies: at a recession velocity of 15,000 km/s a Tully-Fisher distance\ncarries about 20% error, while a redshift distance, with a peculiar velocity of 300 km/s, carries\nabout 2%. So the rule weighs each measurement's uncertainty first and its method second.\n\nA redshift distance can still be far off: near a cluster, infall moves a galaxy's redshift away\nfrom the Hubble flow, and close by, the peculiar velocity outweighs the recession velocity. So a\nredshift-independent distance beats a redshift distance whose uncertainty passes a threshold,\nand a distance whose uncertainty exceeds its value places nothing.",
                    "before": "Choose the preferred measurement\n\nChoosing which of an object's measurements places it in three dimensions. A ranking by method\nalone would misplace galaxies: at a recession velocity of 15,000 km/s a Tully-Fisher distance\ncarries about 20% error, while a redshift distance, with a peculiar velocity of 300 km/s, carries\nabout 2%. So the rule weighs each measurement's uncertainty first and its method second."
