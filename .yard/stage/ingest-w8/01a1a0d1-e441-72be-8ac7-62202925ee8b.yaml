        revision: 3
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Fix what the real data exposes"
        detail: |-
          - **D1 size:** measure each table, then slim the schema to at most 4.5 GB per release (integer keys, typed uncertainty columns, chains stored once).
          - **Memory:** stream SQL generation, aiming under 8 GB peak.
          - **Members:** place members from their own cited coordinates and redshift.
          - **Fetch errors:** include the underlying cause.
          - **Commands:** `Until` carries its own options.

          Done when the real build succeeds and release 1 is published locally.
        state: active
      - key: 01a1a132-f196-70f1-9fef-ba24746da40d
        at: 2026-11-03T11:37:12Z
        revision: 6
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Fix what the real data exposes"
        detail: |-
          - **D1 schema v2** (`terms`, numbered sources, typed uncertainty columns, `chains` stored once): 18.05 GB → 2.20 GB, with every reader fact kept in D1 and a read-back check added to the build.
          - **Memory:** peak cut from 65.9 GB to 12.1 GB by streaming D1 rows.
          - **Structure members:** all 275 are placed from their own cited values, so 23 of 26 structures are now indexed. The member redshift frames are still to be verified against the papers.
          - **Errors and options:** fetch errors carry their cause chain, and `Until` carries its options.
        state: done
