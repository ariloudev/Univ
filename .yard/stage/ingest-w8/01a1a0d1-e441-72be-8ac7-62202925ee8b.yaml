          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Science checks"
        detail: |-
          Each check against its published value, with the source cited:
          - M31 at about 0.77 Mpc.
          - Virgo and Coma at their published distances.
          - The Laniakea attractor where Dupuy & Courtois place it.
          - Cross-match rates between 2M++ and its parent surveys.
          - eRASS1's 155 `bad_uncertainty` rows.
          - How many objects the no-error ranking rule affects.

          Done when each result is recorded in a note, failures included.
        state: open
  - key: 01a1a0d1-e441-72be-8ac7-6225c2c2db05
