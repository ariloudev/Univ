        title: "Fix what the real data exposes"
        detail: "Plus the W8 follow-ups: batched R2 put/read-back, streaming SQL generation, and `Until` carrying its options. Done when the gate passes and release 1 (or a rebuilt release 2) passes the checks."
        state: open
      - key: 01a1a0ea-fbcc-72c2-b75e-fb646acb1ccf
        at: 2026-11-03T10:18:36Z
        revision: 3
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Fix what the real data exposes"
        detail: |-
          - **D1 size:** measure each table, then slim the schema to at most 4.5 GB per release (integer keys, typed uncertainty columns, chains stored once).
          - **Memory:** stream SQL generation, aiming under 8 GB peak.
          - **Members:** place members from their own cited coordinates and redshift.
          - **Fetch errors:** include the underlying cause.
          - **Commands:** `Until` carries its own options.

          Done when the real build succeeds and release 1 is published locally.
        state: active
  - key: 01a1a0ea-fbcc-72c2-b75e-fb620605cde1
    id: w8-first-build
    kind: note
    versions:
      - key: 01a1a0ea-fbcc-72c2-b75e-fb6394ef5587
        at: 2026-11-03T10:18:36Z
        revision: 3
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "First real build: refused by CON-3, as it should be"
        markdown: |-
          | Stage | Result |
          |---|---|
          | Normalize | 2,909,101 entries from 14 tables. Left out: 2M++ 3,813, eRASS1 155, UNGC 110, SDSS 6, BOSS 1 |
          | Cross-match | 2,095,269 objects, 813,832 merges, 1,252 candidate links; 2,082,458 placed, 12,811 with no distance |
          | Tiles | stars 141 nodes and 780,442 points; nearby galaxies 1 node and 637 points; cosmic web 259 nodes and 1,301,379 points. Largest tile 553,959 B, within QA-1's 1 MiB |
          | Build | **refused**: D1 estimated at 18.05 GB against the 10 GB cap (CON-3), so no number was used |
          | Resources | 80 s wall time, **62 GB peak RSS** |
          | Members | none of the 275 members of 6 structures match a catalogue object: they are quasars, absorbers, GRBs and clusters |

          The fix targets at most 4.5 GB of D1 per release (so the next release can be published before this one is pruned) and a peak under 8 GB. Members will be placed from their own cited positions and redshifts.
        tone: warning
