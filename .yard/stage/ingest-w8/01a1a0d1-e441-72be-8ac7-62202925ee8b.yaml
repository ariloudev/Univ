      - key: 01a1a26e-7c4e-758e-866b-805d194614cc
        at: 2026-11-03T17:21:52Z
        revision: 30
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Faster prune and publish: batched R2, prune deletes the local build"
        detail: |-
          Spec commit `cd30028`, code `3e8d57b`, merged into W8 as `eba587f`.

          **Design:** `scripts/r2-batch.mjs` loads Wrangler's own Miniflare and local bucket, and runs one Node process per run. A put returns the object read back with its SHA-256, and deletes go 1,000 keys per call. A round-trip test against `wrangler r2 object get` shows the script and wrangler share one storage.

          **Measured** on a copy of release 4:
          - Publish: 12 min → 6 min. R2 now takes about 5 s; D1's 2.9 GB of SQL is the rest.
          - Prune: 4 min → 17 s.

          Prune also deletes `build/releases/{n}`, last.
        state: done
