        detail: |-
          A read-only agent queries a copy of local D1 and the release files.

          **Against published values:**
          - M31
          - Virgo and Coma
          - the Laniakea attractor
          - 2M++ cross-match rates against 2MRS, 6dFGS and SDSS

          **Open questions on the data:**
          - Left-out rows: 2M++ 3,813, eRASS1 155, UNGC 110.
          - The ranking rule's impact on measurements with no published error.
          - Member redshift frames, against each paper.
          - Horologium–Reticulum's missing distance.

          **Sanity:** sizes and absurd distances.
