  - key: 01a1a141-4d28-753c-9c80-70dd916af763
    id: ask-toolu-01sugxe3fubqukppmvko7n9u-1
    kind: question
    versions:
      - key: 01a1a141-4d28-753c-9c80-70e02708d357
        at: 2026-11-03T11:52:53Z
        revision: 7
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        prompt: "UNGC publishes many indicator distances (Cepheid, TRGB, SBF) with no uncertainty, so the current rule ranks them last. In 129 objects they lose to a redshift distance, e.g. M81 is placed at 0.72 Mpc instead of its Cepheid 3.63 Mpc, and Cen A at 11.85 Mpc instead of TRGB 3.75 Mpc. How should a distance with no published uncertainty rank?"
        header: "No-error rank"
        options:
          - label: "Method rank first"
            detail: "A geometric, primary or secondary indicator beats any redshift distance whose fractional uncertainty exceeds a stated threshold (e.g. 25%), and otherwise ranks by method. No uncertainty is invented. The rule and threshold go in rules/ranking.yaml and the spec (AC-60/61)."
            recommended: true
          - label: "Typical error per method"
            detail: "Give each method a typical fractional uncertainty from cited literature (e.g. TRGB ~5%, Cepheid ~5%, SBF ~10%, TF ~20%), marked estimated, and keep ranking by fractional uncertainty. Simple, but it puts a number on values the source didn't publish."
          - label: "Keep it as is"
            detail: "A distance with no published uncertainty always ranks last. Faithful to the source, but M81, Cen A and 127 others stay badly placed."
        ownWords: true
    responses:
      - key: 01a1a143-52f9-77ae-9fde-d25279560884
        at: 2026-11-03T11:55:06Z
        revision: 8
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "Method rank first"
  - key: 01a1a141-4d28-753c-9c80-70de31cd5649
    id: ask-toolu-01sugxe3fubqukppmvko7n9u-2
    kind: question
    versions:
      - key: 01a1a141-4d28-753c-9c80-70e1002247d8
        at: 2026-11-03T11:52:53Z
        revision: 7
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        prompt: "35 galaxies outside the Local Group are placed inside 1 Mpc because their only distance is a tiny redshift (e.g. one at 5 kpc with a fractional uncertainty of 931). What should happen to an object whose only distance is far more uncertain than itself?"
        header: "Low-z place"
        options:
          - label: "Leave unplaced"
            detail: "An object whose best distance has fractional uncertainty above 1 gets no 3D position (reason: distance too uncertain). It stays in look-ups with its sky position and measurements, as AC-65 already allows for objects with no distance."
            recommended: true
          - label: "Place anyway"
            detail: "Keep placing it. Every derived value carries its uncertainty, so a client could filter, but the tiles and volume queries show these galaxies at nonsensical distances."
        ownWords: true
    responses:
      - key: 01a1a143-52f9-77ae-9fde-d253d2de02e4
        at: 2026-11-03T11:55:06Z
        revision: 8
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "Leave unplaced"
  - key: 01a1a141-4d28-753c-9c80-70df2809b60f
    id: ask-toolu-01sugxe3fubqukppmvko7n9u-3
    kind: question
    versions:
      - key: 01a1a141-4d29-7798-8d8a-03149974402b
        at: 2026-11-03T11:52:53Z
        revision: 7
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        prompt: "M87 is placed at 24.2 Mpc from its redshift, against Mei et al. 2007's 16.5 Mpc: Virgo infall makes redshift distances wrong near clusters, and the 300 km/s allowance can't cover it. Cosmicflows-4's individual-galaxy table (J/ApJ/944/94/table2, 55,877 galaxies with group ids) would give M87 and other cluster members their group's measured distance. Should it be added?"
        header: "CF4 galaxies"
        options:
          - label: "Add CF4 galaxies"
            detail: "Fetch table2, cross-match its galaxies (they carry PGC numbers), and use a member's own CF4 distance or its group's distance as a measured candidate. This fixes Virgo-like cases near the clusters CF4 covers. It's a 19th source, so a minor spec change to the data providers."
            recommended: true
          - label: "Not now"
            detail: "Keep 18 sources. M87 and other galaxies in clusters stay at their redshift distances, with the flow error noted as a known limitation of release 1."
        ownWords: true
    responses:
      - key: 01a1a143-52f9-77ae-9fde-d254d33efff1
        at: 2026-11-03T11:55:06Z
        revision: 8
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "Add CF4 galaxies"
  - key: 01a1a143-a733-73f1-b2a1-14c7bf128eb0
    id: w8-science-report
    kind: note
    versions:
      - key: 01a1a143-a733-73f1-b2a1-14cb42b625eb
        at: 2026-11-03T11:55:27Z
        revision: 9
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Release 1 science check: 4 pass, 2 fail, 3 concerns"
        markdown: |-
          | Check | Result |
          |---|---|
          | M31 | **pass**: 0.783 ± 0.025 Mpc (McConnachie 2012), l = 121.174°, b = −21.573° |
          | Virgo | **fail**: M87 is at 24.2 Mpc from its redshift against 16.5 Mpc (Mei et al. 2007). The CF4 Virgo group sits 33° off its galaxies; 155 CF4 group positions as served by VizieR have no member within 5° |
          | Coma | concern: NGC 4874 at 109.5 Mpc and NGC 4889 at 99.5 Mpc, from redshifts, against 98.5 ± 2.2 Mpc (Scolnic et al. 2024) |
          | Laniakea | **pass**: all 9 Dupuy & Courtois 2023 attractors fall in their own basins; volume 1.945e6 against 1.9e6 |
          | 2M++ match | **pass**: 97.3% match a parent; 99% of 6dF- and SDSS-sourced entries match. The rest are fibre clones |
          | Left out | 2M++ 3,813 ZoA fakes, correct. UNGC 110 are Hubble-relation distances: only the distance should go. **eRASS1 155 fail**: BEST_ZERR = −1 is an undocumented sentinel; Virgo and Fornax are among them |
          | Ranking | **fail**: in 129 objects an indicator with no published error loses to a redshift distance (M81 at 0.72 Mpc against Cepheid 3.63) |
          | Members | concern: Saraswati mixes photometric redshifts but stores them as measured; Giant Arc and Big Ring members show false precision |
          | Horologium–Reticulum | concern: the file omits the cited mean velocity of 19,900 km/s (Fleenor et al. 2005 §3.1) |
          | Sanity | D1 1.57 GB on disk; largest tile 554 kB; 35 galaxies placed inside 1 Mpc from tiny redshifts; Local Group duplicates (Fornax, M32, NGC 55, Sgr dSph) |
        tone: warning
