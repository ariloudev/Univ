  - key: 01a1a149-f447-7033-a444-61246cbbc4a8
    id: w8-d-order
    kind: note
    versions:
      - key: 01a1a149-f447-7033-a444-61263d1ff586
        at: 2026-11-03T12:02:20Z
        revision: 10
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "The ranking is a total order"
        markdown: "The choice 'method rank first' could loop when a measurement without an uncertainty is compared by method rank and all others by fractional uncertainty. The spec now fixes one order, and under it M81's Cepheid and Cen A's TRGB distances win. The option text said 'otherwise ranks by method'. The spec says 'otherwise by fractional uncertainty', so a precise redshift can still beat an imprecise indicator. That reading was flagged to the owner."
        tone: info
  - key: 01a1a14c-9e5d-70b7-95c8-32262603bc06
    id: w8-cf4-positions
    kind: note
    versions:
      - key: 01a1a14c-9e5d-70b7-95c8-322849ba2c50
        at: 2026-11-03T12:05:15Z
        revision: 11
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Cosmicflows-4 group positions: an error in the published catalogue"
        markdown: |-
          157 of the 38,053 groups in J/ApJ/944/94 carry wrong directions in every position column (RAdeg/DEdeg, GLON/GLAT, SGL/SGB), and each has no table2 member within 2°. VizieR copies them faithfully.

          | Kind | Groups | Example |
          |---|---|---|
          | KT17 galactic angles written into SGL/SGB | 68 | 1PGC 1816: SGL/SGB = KT17 GLON/GLAT 311.03, −65.26 |
          | 4–119° off, no frame swap | 80 | Virgo 41220 at 220.82, −23.90 against KT17 187.76, +12.41 |
          | Not in Kourkchi & Tully 2017 | 9 | 43423: 18 members, 41–148° away |

          **Fix:** 148 groups take their Kourkchi & Tully 2017 group centre as a cited fix (CF4 built its groups from KT17). Their CF4 distances are unaffected, so the Virgo group keeps 16.1 Mpc. The 9 groups not in KT17 are left out under `wrong_position`.
        tone: warning
  - key: 01a1a14c-9e5d-70b7-95c8-3227b21f51e5
    id: w8-t4b-decisions
    kind: task
    versions:
      - key: 01a1a14c-9e5d-70b7-95c8-3229d77e1021
        at: 2026-11-03T12:05:15Z
        revision: 11
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Implement the decisions and the science-check fixes"
        detail: |-
          **Decisions and spec:**
          - RQ-24's total order, with a 0.25 threshold.
          - RQ-26: distances more than 100% uncertain are left unplaced.
          - The CF4 galaxies table as a 19th source, which should put M87 at about 16.5 Mpc.

          **Data fixes:**
          - CF4 group positions from KT17.
          - eRASS1 BEST_ZERR = −1 read as none reported.
          - UNGC Hubble-relation rows kept, without their distances.
          - Horologium–Reticulum's velocity, Saraswati's redshift kind, and Giant Arc and Big Ring members' slice uncertainty.
          - Local Group duplicates merged.

          Done when release 2 is built from the real data, published, and the science check is rerun.
        state: active
        type: fix
  - key: 01a1a182-6e06-742f-b98e-5aab6db2d481
    id: ask-toolu-01uwqzzqrwk1uajmegurud2z-1
    kind: question
    versions:
      - key: 01a1a182-6e06-742f-b98e-5aacde7fe1d4
        at: 2026-11-03T13:04:02Z
        revision: 12
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        prompt: "An object's scale domain follows the source of its preferred distance (AC-92). Cosmicflows-4 galaxies are defined as cosmic web, so once M81, Cen A and other nearby galaxies take a CF4 distance they tile as cosmic web, and the nearby-galaxies domain shrank from 637 to 426 objects. Structure files already use a distance rule (under 11 Mpc, the Updated Nearby Galaxy Catalog's depth, is nearby). How should a galaxy's scale domain be chosen?"
        header: "Domain rule"
        options:
          - label: "By placed distance"
            detail: "A galaxy within 11 Mpc (the UNGC depth) is in nearby galaxies, beyond it in cosmic web, whatever source its distance came from; stars stay in the stars domain by source. Matches the structure rule. AC-92 changes (minor spec change)."
            recommended: true
          - label: "By source, as now"
            detail: "Keep AC-92 as written: the domain is the one the preferred distance's source definition names. Nearby galaxies placed by a CF4 distance tile with the cosmic web."
        ownWords: true
    responses:
      - key: 01a1a182-a183-7447-a1c3-ee460a8ee8bf
        at: 2026-11-03T13:04:15Z
        revision: 13
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "By placed distance"
  - key: 01a1a182-eba5-7186-8253-f08ea76acc7e
    id: w8-release2
    kind: note
    versions:
      - key: 01a1a182-eba5-7186-8253-f09029163f98
        at: 2026-11-03T13:04:34Z
        revision: 14
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Release 2 built and published"
        markdown: |-
          | | Release 1 | Release 2 |
          |---|---|---|
          | Entries | 2,909,101 | 2,965,234 |
          | Objects | 2,095,269 | 2,099,389 (4,229 new ids, 109 replaced) |
          | Placed | 2,082,458 | 2,086,262; 251 too uncertain; 12,876 with no distance |
          | D1 | 2.20 GB | 2.32 GB |
          | Peak RSS | 12.1 GB | **14.1 GB**, above the owner's 10–12 GB |
          | Structures indexed | 23 of 26 | 24 of 26 |

          **Placements:**
          - M81 0.72 → 3.63 Mpc (Cepheids)
          - Cen A 11.85 → 3.75 Mpc (TRGB)
          - NGC 59 0.94 → 4.79 Mpc
          - M87 24.2 → 16.86 Mpc (CF4 galaxies)
          - Virgo group moved to its KT17 centre at 16.12 Mpc

          **Other changes:**
          - 1,285 preferred distances changed, 1,231 of them to a CF4 galaxy distance.
          - eRASS1 recovers 155 rows and UNGC 110.

          **Correction:** I expected SN Ia at 5% to beat a TRGB distance with no error. CF4 and UNGC class SN Ia as secondary, so TRGB (primary) wins under the chosen rule.
