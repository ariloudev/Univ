                    "after": "Cosmicflows-4 distances\n\nThe groups table of Cosmicflows-4 (Tully et al. 2023, ApJ 944, 94; VizieR J/ApJ/944/94):\nthe redshift-independent distances of 38,053 galaxy groups, each named by the PGC number of\nits dominant galaxy, on H0 = 74.6. Its SGX, SGY and SGZ columns are in km/s although\nlabelled Mpc, and 158 of its group positions are wrong.",
