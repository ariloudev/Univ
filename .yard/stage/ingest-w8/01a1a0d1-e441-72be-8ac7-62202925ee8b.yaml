  - key: 01a1a18c-37cc-706a-b880-97115cdf722d
    id: w8-review-findings
    kind: note
    versions:
      - key: 01a1a18c-37cc-706a-b880-97132b0fafee
        at: 2026-11-03T13:14:43Z
        revision: 17
        by:
          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "W8 reviews: 8 code findings, 16 cleanups"
        markdown: |-
          **Code review, confirmed on release 2:**

          | Finding | Effect |
          |---|---|
          | A redshift with no published σ_z gets no uncertainty, not even the 300 km/s term | 36,040 redshifts lose by method rank; 9,260 objects placed by indicators worse than 25% |
          | CF4 galaxies' DM, a luminosity distance, is never made comoving | 5,094 objects up to 13% too far, apart from their groups |
          | The D1 fingerprint can't tell NULL from 0 and checks text by length | Nulled `preferred_entry`, `chain` or `scale_domain` would pass |
          | `method_rank` is recorded for ties that the fraction decided | About 669k objects mislabelled (AC-63) |
          | The KT17 positions carry no citation on the entry | Virgo credited to Tully 2023 only |
          | The Local Group name join has no position check | A latent false-merge risk |
          | The Giant Arc and Big Ring slice is stored as an asymmetric 1σ error | It is a bound, not σ |
          | Text: 158 against 157 groups; 11 against 20 txt dwarfs | Wording only |

          **Kept as it is:** RQ-26 uses the ranking's own fraction, which leaves 3 objects unplaced. Clean: the ranking order, the KT17 values (7 match VizieR exactly), the Vcmb inversion, all 45 Local Group name joins, and the schema v2 read-back.

          **Simplify:** 12 cleanups now, 4 saved to the plan.
        tone: warning
