        title: "A galaxy's scale domain follows its placed distance"
        consequence: "A galaxy within 11 Mpc (the Updated Nearby Galaxy Catalog's depth) is in nearby galaxies, and beyond that in cosmic web, whatever source its distance came from. Stars stay in the stars domain by source. AC-92 changes, as a minor spec change, matching the rule structures already follow."
        question: 01a1a182-6e06-742f-b98e-5aab6db2d481
