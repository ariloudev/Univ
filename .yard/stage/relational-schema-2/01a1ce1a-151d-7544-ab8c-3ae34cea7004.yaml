          - **`cargo xtask json`**, in the gate after the 500-line rule: refuses a JSON column in a table per object or per entry, and a JSON function or arrow over anything but a parameter, a literal, a `json_each` value or a JSON column of a small table, in Rust string literals, `rules/*.yaml` and `.sql`.
          - **Scan guard** in `xtask science`: reads each query's bytecode and fails a check that rewinds or counts a table per object or per entry (scans, whole-index walks, automatic indexes). Partial indexes pass.
          - **Scratch indexes and statistics**: `CHECK_INDEXES` (by source, quantity, domain, kind, preferred quantity, and the misplaced objects), and release 15's `ANALYZE` in `rules/science-statistics.yaml`, loaded everywhere.
          - **Checks**: all on rows (`entry_flags`, `entry_references`, `memberships`); two new maser checks.

          | Release 15 | checks took |
          |---|---|
          | schema 7 (before) | 742 s |
          | schema 8, first rewrite | 609 s |
          | schema 8, final | 210 s |

