        title: "What W5 produced"
        markdown: |-
          | Area | Result |
          |---|---|
          | Layers | create (private by default), list, configure, retire; sequence from 0; 403 or the same 404 for another key; 410 with the retirement time |
          | Items | publish, revise (update or correction), retract; every failing member by JSON pointer; 422 source-required; 409 with the current version |
          | Links | an object or structure some published release holds; merged and split ids served with `replaced_by` and `replaced_in` against the release read |
          | Time | an instant in UTC (1961 to the table's expiry, IERS TAI − UTC) or TT, or years before J2000.0; stored on TT with its uncertainty interval for W6 |
          | Following | change feed in pages of 1,000 with cursors; entity tags from the sequence and the release; 304 |
          | Quotas | layers per key, items per layer and bytes per version, held in each write's batch; usage on every key |

          **For W6:** `item_times` holds every current record on TT. Items still need bounding-box columns for volume queries.
        tone: success
