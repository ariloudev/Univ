        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Fix W5's review findings"
        detail: |-
          Correctness:
          - the ETag ignores the release links are resolved against (a stale 304 after a new release);
          - links accepted against unpublished releases;
          - retractions skip the bytes quota;
          - sub-objects report one failure and drop unknown members;
          - quota races;
          - 403 checked before 409;
          - a concurrent retire answers 500.

          Simplify:
          - 6 D1 round trips per publish, down to 4;
          - item counts kept on the layer row;
          - links resolved in a few batches;
          - only the current version's content read;
          - one write path and one change helper;
          - one serialization of each version.
        state: active
      - key: 01a1a3fa-8679-77c7-9fd9-047543acc843
        at: 2026-11-04T00:34:27Z
        revision: 6
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Fix W5's review findings"
        detail: |-
          d51d6f9. Correctness:
          - the release is in entity tags and the Univ-Release header;
          - links count published releases only;
          - retractions are held to the bytes quota;
          - each member of a geometry, time record, link and source is checked on its own, and members no type holds are refused;
          - quotas are held inside the batch;
          - 409 is checked before 403;
          - a failed batch is settled into 410, 409 or 403.

          Simplify:
          - 4 round trips per publish instead of 6;
          - item counts on the layer row;
          - links resolved a ledger level per batch;
          - one store path and one change helper.

          7 new tests, 156 in univ-api.
        state: done
