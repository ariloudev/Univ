        title: "Fix W5's review findings"
        detail: |-
          Correctness:
          - the ETag ignores the release links are resolved against (a stale 304 after a new release);
          - links accepted against unpublished releases;
          - retractions skip the bytes quota;
          - sub-objects report one failure and drop unknown members;
          - quota races;
          - 403 checked before 409;
          - a concurrent retire answers 500.

          Simplify:
          - 6 D1 round trips per publish, down to 4;
          - item counts kept on the layer row;
          - links resolved in a few batches;
          - only the current version's content read;
          - one write path and one change helper;
          - one serialization of each version.
