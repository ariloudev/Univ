          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Fix the /code-review and /simplify findings"
        detail: |-
          Each fix comes with a test that failed before it.

          **Matching and ids:**
          - An entry joins an object only if it agrees with every member already in it.
          - An identifier claimed twice joins neither claimant; each gets a link.
          - A ledger without its entry map is refused.
          - Cosmicflows-4 groups are their own objects, related `dominant_member` to their galaxy (ReadMe Note G1), lending nothing.
          - A redshift with no one-sigma error ranks as none reported.
          - A NaN confidence counts as 0.
          - Members checked by name only are counted.
          - A repeated identifier is left out as `duplicate_identifier`.

          **Positions:**
          - Distance and size share one rescaling rule.
          - A parallax's chain starts from the published parallax, then the Gaia zero-point (−17 µas, Lindegren et al. 2021 §1), then 1/ϖ.
          - Redshift intervals carry the peculiar velocity.
          - A luminosity distance keeps its redshift's kind and errors, and a blueshift is handled explicitly.
          - An unstated equinox is taken as J2000 before the move to ICRS.
          - Dense places off the grid are recorded.

          **Also:** provenance payloads are kept in item order, which fixes nondeterminism from concurrent chunks. The `/simplify` reuse and allocation items are done.
        state: done
        type: fix
