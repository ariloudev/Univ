        detail: "Release cosmology (Planck 2018 by default), a tabulated D(z), redshift distances as comoving distances of the CMB-frame z, luminosity to comoving, H0 rescaling with sizes scaled alike, ICRS, galactic and supergalactic Cartesian positions with the transformation chain and univ-model version recorded. Also FK4 B1950 and the unstated-equinox frame, and one typed `AssumedCosmology`. Done when tests cover AC-28 to AC-35 and M31 is placed at its McConnachie distance in the right direction."
