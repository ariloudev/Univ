        title: "Stable ids and the id ledger"
        detail: "Id assignment from the previous release's entry-to-object map: kept, merged (the older id wins), split (new ids), lost entries and new objects. A YAML id ledger that never reuses an id. Done when a release-over-release suite tests AC-75 to AC-81."
