          host: claude-code
          session: "dbe06352-d73b-4e8a-b959-235a3a2018c7"
        title: "Integrate into the run"
        detail: |-
          `univ-ingest match` runs fetch, normalize and then cross-match: matching, ranking (with the tabulated D(z)), ids against a state dir, positions, then structure members.
          - The state dir holds `ledger.yaml` and `entry-ids.yaml`. A match writes only `pending/`; the release build promotes it.
          - Each structure member resolves to one object by name, within 60″.
          - Void outlines are refused when an eRASS1 cluster or a supercluster lies inside.
          - One `RunSink` serves the terminal and the plain log.

          On the fixtures: 19 entries, 18 objects, 15 placed.
        state: done
