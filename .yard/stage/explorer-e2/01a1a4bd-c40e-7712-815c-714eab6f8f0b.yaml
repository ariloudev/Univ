        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Simplify and code review of E2, findings fixed"
        detail: |-
          Fixed in `16a37f9`.

          **From code review:**
          - every uncertainty form the API defines is worded as published: an interval is not an error, and a limit is not a value;
          - small values keep their significant figures;
          - bounds are converted by the centre's unit;
          - structure values keep their uncertainties;
          - a split id lists its replacements;
          - picking tests a ray against each sphere, which is correct off-axis;
          - the hover label clears;
          - labels no longer flicker;
          - searches don't race;
          - one read per choice;
          - one failed record doesn't hide the other structures.

          **From simplify:**
          - one units table;
          - per-frame state lives in stores, so the whole scene doesn't re-render each frame;
          - rotations are state;
          - one selection;
          - the shader's colour table is sized from the kinds;
          - shared test fakes.

          **Skipped:**
          - HEALPix outlines for sky regions: the spec marks them approximate;
          - GPU picking: the ray test is enough at 2.1M points;
          - one structures document: that is a server change.
        state: done
