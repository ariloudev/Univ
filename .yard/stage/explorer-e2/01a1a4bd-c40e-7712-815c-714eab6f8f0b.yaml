        revision: 1
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Picking, hover label, chosen object panel, URL, double-click flight"
        detail: |-
          Done when unit tests show:
          - the nearest point within the slop is picked across batches;
          - the label gives id, domain, distance, source and kind;
          - the panel gives names and designations, the preferred distance with uncertainty, kind, source and rule, the other distances, and frame and epoch;
          - the object id is kept in the URL and restored;
          - a problem shows its status and title;
          - a double-click flies within 1.5 s, or moves at once under reduced motion.
        state: open
