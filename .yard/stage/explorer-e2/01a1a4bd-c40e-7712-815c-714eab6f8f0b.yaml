        title: "What E2 produced"
        markdown: |-
          On release 7, the explorer now:
          - names the point under the pointer;
          - reads a clicked object into a panel: names, the preferred distance with its fractional uncertainty, kind, source and rule, the other distances, and the frame and epoch;
          - keeps the chosen object in the address;
          - flies to a double-clicked point;
          - finds objects by id, `source:identifier` or name;
          - draws, names, lists and reads the 26 structures.

          **Science notes found on the way:**
          - the preferred-distance uncertainty is fractional (Sirius: 0.42 %);
          - release 7's structures use points, members, spheres and sky regions. Sky regions are drawn as their bounding box, marked approximate, by the spec change in this wave.

          **Next, E3:** Playwright tests with axe inside `cargo xtask integration`, the 3-second first-points measurement over 10 loads, and a README.
        tone: success
