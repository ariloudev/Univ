        view: spec-change
        note: |-
          Two criteria are added to see-the-structures, for geometries that release 7's structures use and the requirement did not cover:
          - a **point** is drawn as a marker;
          - a **sky region** or a **grid** is drawn as its bounding box, marked approximate.

          The second avoids putting a HEALPix cell decoder in the client. This is a minor change, pre-approved for this product.
