        title: "Objects API: lookup, search with choices, distances"
        detail: |-
          Done when unit tests show:
          - a number is looked up as an id, `source:identifier` as a designation, and other text as a name;
          - an answer of 300 lists the objects to choose from, and 404 means none found;
          - the preferred distance's measurement and the other distances are picked out;
          - positions in pc or Mpc are converted to Mpc;
          - the fractional uncertainty is shown as a share of the distance.
        state: open
  - key: 01a1a4bd-c40e-7712-815c-71515009ea67
