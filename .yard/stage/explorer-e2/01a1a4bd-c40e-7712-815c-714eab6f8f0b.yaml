                  "name": "Univ Explorer",
                  "words": {
                    "after": "Univ Explorer\n\nA web application that draws what Univ Server knows in three dimensions, around Earth, and lets\na person move through it with the mouse: from the nearest stars to the largest structures of\nthe universe.\n\nIt reads Univ Server's public API alone and draws only what a release placed, each point at the\nposition the release derived for it, coloured by the kind of value of its distance, with the\nsources credited as their terms require. Clicking a point reads its object; the structures are\ndrawn by their placed shapes.\n\nThe first version runs locally, beside Univ Server under `wrangler dev`. Flying with the\nkeyboard, editing layers, time and phones are outside it."
