          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "W4 plan"
        markdown: |-
          Release 10's plan, wave W4, worked out from the code. It is recorded under the unattended permission and does not wait for approval.

          | Read | Today | Sharded |
          |---|---|---|
          | Object by id (`record`, `present`) | one batch on `DB` | the shard from `object_shards` (catalogue), then one batch on that shard; designations' source numbers named through the kept vocabulary rather than a join |
          | By designation | join of `designations` and `sources` | the source number from the vocabulary, then the release's every shard at once, merged |
          | Volume query page | one `UNION ALL` on `DB` | the shards whose `shard_cells` run of a domain overlaps the Morton range of the box's cells, each with its own `UNION ALL` and `LIMIT`; pages merged by id, so the cursor is unchanged |
          | Layer links | `objects` on `DB` | `object_shards` on the catalogue |
          | Everything else | `DB` | unchanged: the catalogue |

          - **Backend:** one new read, `shards(&[(shard, sql, params)])`. The Worker groups the statements by shard into one D1 batch each, runs the shards at once (`futures-util`), and gives the rows back in order. A shard's runs and the release's shards are read once per release and kept.
          - **Test backend:** eight in-memory shard databases beside the catalogue. Fixture rows written to the catalogue are moved to the shard their `object_shards` row names. A fixture written by hand gets `id % 2`, and its `shard_cells` and `release_shards` are derived, so every univ-api test runs on two shards.
          - **xtask:** `serve`, `integration`, `explore` and the benches give every shard database the release schema.
          - **No fallback** for a release built before shards: schema-4 releases are pruned in W5, as the spec's decision says.

          Criteria: the page-order criterion of query-a-bounded-volume, with the existing look-up, query and source criteria still holding on two shards.
