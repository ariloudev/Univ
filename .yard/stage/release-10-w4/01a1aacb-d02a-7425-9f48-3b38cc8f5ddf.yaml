        revision: 4
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "What W4 produced"
        markdown: |-
          - **Reads of a sharded release:**
            - **By id:** the object's shard from `object_shards`, then one batch on that shard. That is two round trips where there was one.
            - **By designation:** every shard of the release at once. A single hit is then read from the shard it was found in.
            - **Volume query:** only the shards whose cells the box's own Morton ranges meet, each giving a page. The pages are merged by id, so pages and cursors are the same whichever shards hold the objects.
            - **Layer links:** by the index.
          - **Worker:** `Backend::shards` groups statements into one D1 batch per shard and reads the shards at once. A short answer is an error.
          - **Tests:**
            - univ-api's tests run on eight in-memory shard databases, with hand-written fixtures over two.
            - The integration state is ingest's sharded fixture.
            - 13 gates and `cargo xtask integration` pass.
          - **xtask:** `serve`, `explore` and the benches give every bound shard the schema, one shard after another, since parallel Wrangler on one state fails. `bench lookup` samples ids from the catalogue by name.
          - **For W5:**
            - Releases 6 to 9 (schema 4) read as empty under this server until they are pruned and release 10 is published.
            - QA-2 and QA-3 are measured on release 10. A lookup by id now pays one catalogue round trip more than before.
        tone: success
