  - key: 01a1a6cf-e0a5-72ff-9510-6c0b845e1709
    id: s1-survey
    kind: note
    versions:
      - key: 01a1a6cf-e0a5-72ff-9510-6c0ee369c2a1
        at: 2026-11-04T13:46:43Z
        revision: 2
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "What places each of release 7's 26 structures"
        markdown: |-
          | Placed by | Structures | Extents their files quote |
          |---|---|---|
          | **Sphere** (5) | Boötes, Eridanus supervoid, Giant Void, Ho'oleilana (shell), KBC void | radius, each with its cosmology (H₀ 50 to 75) |
          | **Sky region**, drawn as its bounding box today (5) | BOSS Great Wall, CfA2 Great Wall, Hercules SC, Perseus–Pisces, Sloan Great Wall | RA/Dec or l/b ranges and near/far redshift; CfA2's sizes are lower limits |
          | **Members** (6) | Big Ring, Clowes–Campusano LQG, Giant Arc, Giant GRB Ring, Huge-LQG, Saraswati | sizes and axes in proper Mpc (H₀ 70) |
          | **A point only** (8) | **Vela**, **Shapley**, **Horologium–Reticulum**, Hercules Void, Sculptor Void, Local Void (with an outline), Dipole Repeller, South Pole Wall | see below |
          | **Not placed** (2) | Hercules–Corona Borealis Great Wall, Pisces–Cetus | no sky position in the file |

          **The point-placed structures that quote a bounded volume:**
          - **Vela** (Kraan-Korteweg et al. 2017): "an overall extent of at least 25°×20°"; the overdensity's galaxies at "16–24 000 km s⁻¹"; Fig. 2 region 255°≤l≤285°, |b|≤10°. The paper calls the 25° longitude in the abstract and latitude in Section 2.
          - **Shapley** (Proust et al. 2006): survey area "R.A. ≃12h40m to ≃14h10m and from Dec ≃−24° to ≃−38°", with the main plane filling it; main body 13,000–18,000 km/s. The abstract's "12 degrees by 30 degrees" disagrees with that area, and the equinox is not stated.
          - **Horologium–Reticulum** (Fleenor et al. 2005): "more than 12° × 12° on the sky centered at approximately α = 03h19m, δ = −50°02′" and "at least the redshift range from 17,000 to 22,500 km s⁻¹".
          - **Hercules, Sculptor and Local voids:** extents along SGX, SGY and SGZ at isodensity −0.7, in km/s.
          - **Dipole Repeller and South Pole Wall:** a distance or lengths only, no extent across the sky.
  - key: 01a1a6cf-e0a5-72ff-9510-6c0cc1507d04
    id: s1-options
    kind: note
    versions:
      - key: 01a1a6cf-e0a5-72ff-9510-6c10ab79bfc3
        at: 2026-11-04T13:46:43Z
        revision: 2
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Ways to draw a bounded volume, compared"
        markdown: |-
          | Option | Fits | Caveats | Where |
          |---|---|---|---|
          | **A. Sector: a sky region between two depths** | Vela, Shapley, Horologium–Reticulum; and it draws the 5 existing sky regions as what they are | Uses quantities as published (angles, cz), so no h⁻¹ enters. Depth comes from the release cosmology (inferred) and ignores peculiar velocities. The sky extents are mostly lower limits, so the label says "at least". | Structure files (ingest), drawing (explorer), bounds (model) |
          | B. Ellipsoid of published size | none of the three | Vela's 115 × 90 h₇₀⁻¹ Mpc has no orientation and no third axis; drawing one would invent both | — |
          | C. Hull of members | none of the three | release 7 holds no member list for them | — |
          | D. Box along the published axes | Hercules, Sculptor and Local voids | Extents at an isodensity contour, in km/s; a box claims no shape beyond them | Structure files: the existing `box` primitive in the supergalactic frame |
          | E. Marker, as today | Dipole Repeller, South Pole Wall | no extent across the sky is quoted | — |

          **Recommended: A for the three superclusters, D for the three voids, E for the rest.**

          How it is drawn today matters too. `SkyRegion` is held as HEALPix cells between `near` and `far`, but its bounds are a box around the whole sphere of radius `far`. The explorer draws that box, so the Hercules Supercluster shows as a cube about Earth. Drawing the region's own outline fixes the 5 existing regions with release 7's data, and needs no new release.

          **Vela, worked through:**
          - **Sky:** l 255°–285°, b −10° to +10°, the region the paper measures the overdensity in (Fig. 2). Estimated, a lower limit: it "extends over most of our ZOA survey region", which is "at least 25°×20°".
          - **Depth:** cz 16,000–24,000 km/s, the paper's range for the overdensity. That is z 0.053–0.080, about 237–350 Mpc comoving in Planck 2018 (inferred). It replaces the plan's 18,000–22,000, which were the walls' centres.
          - **Drawn as:** a curved slab across the Galactic Plane, about 30° × 20° and about 110 Mpc deep, labelled "Vela Supercluster (at least)", in place of today's point.
  - key: 01a1a6cf-e0a5-72ff-9510-6c0d7afe74f1
    id: s1-approve
    kind: approval
    versions:
      - key: 01a1a6cf-e0a5-72ff-9510-6c131e8c1682
        at: 2026-11-04T13:46:43Z
        revision: 2
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Draw structures as the volumes their papers bound"
        markdown: |-
          **What this approves** (the spec is written once you approve, in the waves named):

          1. **Explorer (a new wave, E8):** a sky region is drawn as its own outline: the boundary of its cells at its near and far distances, joined by radial edges. It replaces the box about Earth. This helps the 5 sky regions release 7 already has, with no new data.
          2. **Model and server (R2):** a sky region's bounds become the box around its cells between `near` and `far`, not the whole sphere out to `far`. This narrows what a volume query matches.
          3. **Structure files (R2):** Vela, Shapley and Horologium–Reticulum are placed by sky regions built from the ranges their papers quote:
             - Vela: l 255°–285°, |b| ≤ 10°, cz 16,000–24,000 km/s;
             - Shapley: RA 12h40m–14h10m, Dec −38° to −24°, cz 13,000–18,000 km/s;
             - Horologium–Reticulum: 12° × 12° about 03h19m, −50°02′, cz 17,000–22,500 km/s.
             
             The Hercules, Sculptor and Local voids get boxes along their published SGX/SGY/SGZ extents. Each bound keeps its kind and its lower-limit form.
          4. **Label:** a structure whose bounds are lower limits is named with "(at least)" in the view and in its panel.

          **Look at:**
          - Shapley's paper disagrees with itself (12° × 30° against its own RA/Dec area), and its equinox is unstated. R2 checks the published A&A text before using it.
          - Depths follow from cz through the release cosmology, ignoring peculiar velocities, and are labelled inferred.
          - The Dipole Repeller and the South Pole Wall stay markers: their papers give no sky extent.
