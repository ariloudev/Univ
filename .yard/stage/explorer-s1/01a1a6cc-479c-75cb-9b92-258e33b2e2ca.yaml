  - key: 01a1a6d5-9908-747b-90fa-0f2537619c80
    id: s1-result
    kind: note
    versions:
      - key: 01a1a6d5-9908-747b-90fa-0f28856703ba
        at: 2026-11-04T13:52:58Z
        revision: 4
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "What S1 produced"
        markdown: |-
          **Vela can be shown as a volume** without inventing anything. Its paper quotes a sky region and a velocity range, so it becomes a curved slab: l 255°–285°, |b| ≤ 10°, at 237–350 Mpc, labelled "(at least)". Shapley and Horologium–Reticulum take the same form, and three voids become boxes along their published axes.

          **What it found:**
          - the existing sky regions are drawn as a box around Earth, which E8 fixes with release 7's own data;
          - the papers correct the plan's Vela numbers;
          - Shapley's paper disagrees with itself.

          **Next:**
          - **E8:** draw sky regions as their outline.
          - **R1:** star colours and spectral types.
          - **R2:** curated superstructures plus S1's volumes.
          - **R3:** build release 8.
        tone: success
