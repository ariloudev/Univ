        title: "Real-state runs use .dev.vars's owner secret"
        detail: |-
          Done when:
          - `with_real_server` reads `OWNER_SECRET` from `crates/univ-server/.dev.vars` before it starts Wrangler, with a unit test of the reading;
          - it starts Wrangler without `--var`, so Wrangler loads `.dev.vars` itself;
          - it issues and revokes keys with that secret;
          - a missing file or empty secret stops the run, saying how to create the file;
          - only `integration` passes the test secret.

          The key-handling code moves out of `integration.rs`, which is at 497 lines, into a module of its own.
