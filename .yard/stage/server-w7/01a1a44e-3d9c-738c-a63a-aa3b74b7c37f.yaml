        detail: "Done when a committed snapshot of `openapi.json` is compared by a test that fails on any path, operation, parameter, schema or property removed or renamed within /v1, and passes on additions."
        state: open
      - key: 01a1a455-032e-75d3-bedf-c472109c45bb
        at: 2026-11-04T02:13:17Z
        revision: 2
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "OpenAPI snapshot refusing removals and renames (AC-292)"
        detail: |-
          `crates/univ-api/openapi.v1.json` is the committed document. A test refuses anything the snapshot holds that the document lost or changed, prose aside. It then requires the snapshot to equal the document, so additions are held from then on; `UNIV_OPENAPI_SNAPSHOT=write` rewrites it, and only when nothing was taken away.

          A second test checks that a field removed, a field renamed, a route removed and an enumeration value removed are each caught, while additions and rewording pass.
        state: done
