        revision: 3
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Science spot-checks through the API"
        detail: |-
          Through the API on release 7:

          - **M31**, object 856254 (CF4 PGC 2557 = "Andromeda" = MESSIER031): preferred 0.747 ± 0.016 Mpc from CF4 μ = 24.366 ± 0.045. McConnachie 2012 gives 0.783 ± 0.025 Mpc (μ = 24.47 ± 0.07), kept as runner-up. The rule picks the smaller uncertainty; the two agree within 1.2σ.
          - **M87**, object 2081340 (CF4 PGC 41361): μ = 31.134 ± 0.04 gives 16.86 ± 0.31 Mpc luminosity distance; its derived position is at 16.77 Mpc comoving (z_CMB = 0.00536, Planck 2018). `preferred.uncertainty.total` = 0.0184 is the fractional uncertainty, as the schema says.
          - **Virgo**, CF4 group 1PGC 41220 (dominant NGC 4472, 164 member links), served at RA 187.755781°, Dec 12.405941°: exactly the KT17 centre ingest records, replacing CF4's wrong 220.8243°, −23.9008°. Found by a volume query around M87.
          - **Laniakea basins** (Dupuy & Courtois 2023): the observer and all 9 attractors sit in their own basin labels in the served `cf4-basins` field 0, indexed from the header's cell-centre origin.
          - **Structures:** within 300 Mpc, release 6 matches 16 by `bounding_box`, release 7 matches 15 by `shape`.

          Still to come: `xtask science` on release 7.

          Noted, not changed: `?name=M31` is 404 because only the nearby-galaxies names are indexed, where M31 is "Andromeda". The 404's wording was fixed.
        state: active
