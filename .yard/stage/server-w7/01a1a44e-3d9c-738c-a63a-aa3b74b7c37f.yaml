          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Every refusal of every route in the OpenAPI document"
        detail: |-
          Done in `7fd9697`. `refusals.rs` lists each endpoint's problem types. The document gives one `application/problem+json` response per status, its `type` narrowed to that route's types.

          The test kit now asserts that every problem a test meets on a route is in that route's list, so all 189 univ-api tests check it. It found one gap: an empty release listing answers `release-not-found`.

          A test also holds the document's schemas equal to those univ-model generates (AC-286). AC-274 got its missing test in `3563aa5`: a keyed read answers byte for byte as an anonymous one. All 335 criteria in scope are now linked.
        state: done
