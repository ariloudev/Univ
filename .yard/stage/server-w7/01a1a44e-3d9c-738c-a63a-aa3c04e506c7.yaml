        title: "Fix W7's review findings"
        detail: |-
          Fixed in `81c7ac8`.

          **Code review** (9 findings):
          - layer and item reads now list the release refusals, and a test meets each;
          - the snapshot check treats fields named `title`, `description` or `summary` as fields, keeps required fields required, and refuses a request that gains a required field, a constraint or a required parameter (9 cases);
          - writing a missing snapshot works;
          - the tile script pins to the listed release, builds URLs properly and waits out a 429.

          **Simplify:**
          - the refusal check moved into `routes::answer` (test builds), and `endpoint_of` is gone;
          - `Signing::of` returns a `Result` and runs only where a cursor is used;
          - one operation lookup and one `PROBLEM_SCHEMA`;
          - table-driven tests;
          - the script no longer repeats the decoder's own checks.

          **Not done, with reasons:**
          - a mandatory owner secret checked at startup: it would change how a Worker without a secret behaves;
          - one refusals list per route held in `ROUTES`: the `match` already forces an entry for every endpoint;
          - concurrent tile fetches: a few seconds locally.
        state: done
