        title: "What W7 produced, and where Univ Server stands"
        markdown: |-
          **The contract is complete.**
          - Every route's refusals are in the OpenAPI document by status and problem type, and every refusal any test meets is checked against its route's list.
          - The schemas are univ-model's, as generated.
          - `openapi.v1.json` refuses any removal, rename or narrowed request within /v1.

          **Release 7** is built with the current ingest and served as `latest`; release 6 stays readable and releases 1–4 answer 410.

          | Check | Result |
          |---|---|
          | QA-2 lookup p95 | 8.5 ms (≤ 200) |
          | QA-3 volume first page p95 | 86.0 ms (≤ 500) |
          | Tiles (AC-281) | 401 of 401 match SHA-256 and decode, 2,085,809 points |
          | Science spot-checks | M31, M87, Virgo at its KT17 centre, Laniakea basins: all as cited |
          | `xtask science` | 27 PASS, 0 FAIL, 3 CONCERN (ingest's, unchanged) |
          | Structures | matched by placed shape (15 within 300 Mpc) |

          **Found and fixed on the way:** a Worker without an owner secret signed cursors under a key anyone could derive.

          **Open:**
          - `?name=M31` answers 404, because only the nearby-galaxies catalogue's names are indexed and it lists M31 as "Andromeda". Messier names are designations, so this is a lookup gap for ingest, not a server fault.
          - The 3 science concerns are ingest's data questions.
          - `product/server` goes to `develop` only when the owner asks.
        tone: success
