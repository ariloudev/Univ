  - key: 01a1a2ef-c93e-77ff-9e77-5f6635814121
    id: t-fix-api
    kind: task
    versions:
      - key: 01a1a2ef-c93e-77ff-9e77-5f6c2e810f0a
        at: 2026-11-03T19:43:06Z
        revision: 8
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "univ-api: HEAD, problems for every failure, typed route methods"
        detail: |-
          - HEAD is answered as GET without its body, and Allow lists HEAD.
          - New problem kinds unreadable-body (400) and internal-error (500); the OpenAPI document's serialization failure is a problem, and `univ_api::failure` gives the Worker a problem with CORS.
          - `Route.method` is a `Method`.
          - One shared header lookup.
          - `ProblemType::uri` returns `&'static str` and `slug` is gone.
          - `Problem::with` takes `impl Into<Value>`.
          - The OpenAPI JSON is built once per isolate.

          16 native tests pass.
        state: done
  - key: 01a1a2ef-c93e-77ff-9e77-5f6705f273f7
    id: t-fix-worker
    kind: task
    versions:
      - key: 01a1a2ef-c93e-77ff-9e77-5f6dc7c3c382
        at: 2026-11-03T19:43:06Z
        revision: 8
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "univ-server: runtime errors and unread bodies"
        detail: |-
          - Any runtime error, while building the request or sending the answer, becomes an internal-error problem with CORS, not the runtime's plain 500.
          - A body is read only for POST, PATCH and DELETE; one that cannot be read is refused as unreadable-body rather than taken as empty.
          - Header names are taken as the runtime gives them.
          - The answer is moved, not copied.

          wasm32 clippy is clean.
        state: done
  - key: 01a1a2ef-c93e-77ff-9e77-5f683bf5500a
    id: t-fix-harness
    kind: task
    versions:
      - key: 01a1a2ef-c93e-77ff-9e77-5f6ebb32738c
        at: 2026-11-03T19:43:06Z
        revision: 8
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "xtask: Wrangler from the crate dir, try_wait, retried start"
        detail: |-
          - One `wrangler()` builder, run from crates/univ-server with metrics off and no colour, so the build command is plain `worker-build --release`.
          - `[dev]` port 8790 moves to wrangler.toml.
          - Liveness uses `Child::try_wait`: the `kill -0` probe also succeeded on an exited zombie, so a dead Wrangler waited the full 600 s.
          - A Wrangler that exits before answering, such as on a port taken in the meantime, is started again on a new port, up to 3 times.
        state: done
  - key: 01a1a2ef-c93e-77ff-9e77-5f6916221b19
    id: t-fix-tests
    kind: task
    versions:
      - key: 01a1a2ef-c93e-77ff-9e77-5f6f4d705f33
        at: 2026-11-03T19:43:06Z
        revision: 8
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Tests: shared runner, config id check, one e2e client"
        detail: |-
          - `release_fixture::univ_ingest` is the one runner for publish_wrangler and fixture_state.
          - fixture_state explains itself when UNIV_FIXTURE_STATE is unset.
          - New tests/config.rs: the Worker's `univ` database id and bucket match the root wrangler.toml, and a planted id mismatch fails it; LAYERS is another file.
          - The e2e tests share one LazyLock client.
          - A new e2e test checks HEAD.
        state: done
  - key: 01a1a2ef-c93e-77ff-9e77-5f6aa3b43a91
    id: w0-review-findings
    kind: note
    versions:
      - key: 01a1a2ef-c93e-77ff-9e77-5f70a8bbbe46
        at: 2026-11-03T19:43:06Z
        revision: 8
        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "W0 review: what was fixed, kept and skipped"
        markdown: |-
          | Finding | From | Outcome |
          |---|---|---|
          | `kill -0` on a zombie: a dead Wrangler waits 600 s | review, simplify ×3 | fixed: `try_wait` |
          | HEAD answered 405 | review | fixed |
          | OpenAPI 500 and runtime errors not problem+json, no CORS | review | fixed: `internal-error`, `univ_api::failure` |
          | Failed body read taken as empty; every body buffered | review, efficiency | fixed: writes only, `unreadable-body` |
          | free-port race | review | fixed: retried start on a new port |
          | fixture_state panics opaquely under `--ignored` | review, altitude | fixed: explicit message (kept as a test: its helpers live in tests/) |
          | OpenAPI rebuilt per request | review, efficiency | fixed: `LazyLock` |
          | Duplicate header lookup, string route methods, `slug`, `with(Value)` | simplify, review | fixed |
          | `--config` path tied to the start directory | altitude | fixed: Wrangler runs from the crate dir |
          | Config ids copied by hand, unchecked | reuse | fixed: tests/config.rs |
          | Runner copied between ingest tests | reuse | fixed |
          | **Each route's refusals in OpenAPI (AC-290)** | review | **kept for W7**, where the plan places it |
          | Request body size cap | review | **kept for W4/W5**, with the 64 KiB item quota |
          | Build the wasm while the fixture state is written; cache the state | efficiency | **skipped**: the cargo lock serializes the builds, and a cached state risks staleness |
          | fixture_state as a Cargo example | altitude | **skipped**: examples get no `CARGO_BIN_EXE_*` |
