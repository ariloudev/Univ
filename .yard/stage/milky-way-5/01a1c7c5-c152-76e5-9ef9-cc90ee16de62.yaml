        title: "What wave 5 produced"
        markdown: |-
          Hunt & Reffert 2023's open-cluster ages run end to end:

          | Layer | What it does |
          |---|---|
          | Model | `Unit::Year`, `Unit::LogYear`; `Age` keeps the published log as native and years as normalized, the 16–84% interval carried through exactly (`Uncertainty::through`) |
          | Ingest | `normalization.ages` in Hunt & Reffert's definition; an `age` measurement per cluster; a tracer point carries its log age in version 3 tiles (same 20 bytes) |
          | Decoder | Reads versions 1, 2 and 3; `fixtures/v2/` frozen |
          | Explorer | Show drawer: any / < 100 / < 30 / < 10 Myr, kept as `?age=`, cutting drawing, picking and the key's counts alike; the panel shows the age in Myr and the log as published |
          | Science | `ages-normalized-to-years` (fail), `open-cluster-ages` (report, against 2,794 / 1,225 / 405 of 6,818) |

          Open: release 14, which carries the ages, is being built; after its swap a face-on view at `?age=30` should show the Local, Sagittarius–Carina and Perseus arm segments.
        tone: success
