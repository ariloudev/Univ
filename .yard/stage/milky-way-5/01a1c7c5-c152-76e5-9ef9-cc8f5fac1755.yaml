              ],
              "nodes": [
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d658085bf5c8",
                  "kind": "product",
                  "label": "P-1",
                  "name": "Univ Ingest",
                  "parent": null
                },
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d6593dd0cb35",
                  "kind": "feature_group",
                  "label": "FG-1",
                  "name": "Acquisition",
                  "parent": "01a19f1a-685d-7357-b67e-d658085bf5c8"
                },
                {
                  "change": null,
                  "key": "01a19f22-2ad9-716e-876f-1831f423e25f",
                  "kind": "feature",
                  "label": "F-1",
                  "name": "Define a source",
                  "parent": "01a19f1a-685d-7357-b67e-d6593dd0cb35"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c5f854eb67f1",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall provide a source definition for each source that release 13 adds or widens, to show the Milky Way in depth.",
                  "parent": "01a19f22-2ad9-716e-876f-1831f423e25f"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c5f9f47eb4b7",
                  "kind": "criterion",
                  "label": null,
                  "name": "The Gaia DR3 stars and the Bailer-Jones 2021 distances take every Gaia DR3 source with a G magnitude below 14.",
                  "parent": "01a1c319-7860-76e8-92ac-c5f854eb67f1"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c5fae6ebd0d3",
                  "kind": "criterion",
                  "label": null,
                  "name": "The Bailer-Jones 2021 distances carry, as published, the Gaia DR3 ratio of the parallax to its error of each source they give a distance to.",
                  "parent": "01a1c319-7860-76e8-92ac-c5f854eb67f1"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c5fb497eb9df",
                  "kind": "criterion",
                  "label": null,
                  "name": "The star cluster sources are Hunt & Reffert 2023 open clusters and Baumgardt & Vasiliev 2021 globular clusters.",
                  "parent": "01a1c319-7860-76e8-92ac-c5f854eb67f1"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c5fc305bf6e9",
                  "kind": "criterion",
                  "label": null,
                  "name": "The variable star sources are Skowron 2025 classical Cepheids and Li 2023 RR Lyrae.",
                  "parent": "01a1c319-7860-76e8-92ac-c5f854eb67f1"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c5fda2de7bf8",
                  "kind": "criterion",
                  "label": null,
                  "name": "The star-forming region source is Reid 2019 maser parallaxes.",
                  "parent": "01a1c319-7860-76e8-92ac-c5f854eb67f1"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c5fe0e6a94b9",
                  "kind": "criterion",
                  "label": null,
                  "name": "The dust source is the Edenhofer 2024 dust map.",
                  "parent": "01a1c319-7860-76e8-92ac-c5f854eb67f1"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c5ff9e1131e1",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each source of a Galaxy tracer names the Galaxy tracers scale domain.",
                  "parent": "01a1c319-7860-76e8-92ac-c5f854eb67f1"
                },
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d65aba28b58f",
                  "kind": "feature_group",
                  "label": "FG-2",
                  "name": "Normalization",
                  "parent": "01a19f1a-685d-7357-b67e-d658085bf5c8"
                },
                {
                  "change": null,
                  "key": "01a19f22-2ad9-716e-876f-186219f4e104",
                  "kind": "feature",
                  "label": "F-4",
                  "name": "Normalize records",
                  "parent": "01a19f1a-685d-7357-b67e-d65aba28b58f"
                },
                {
                  "change": "added",
                  "key": "01a1c7c5-a164-7706-ad2c-c82d69fadcb8",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall keep each age a source publishes for a star cluster, with the logarithm of the age as published.",
                  "parent": "01a19f22-2ad9-716e-876f-186219f4e104"
                },
                {
                  "change": "added",
                  "key": "01a1c7c5-a164-7706-ad2c-c82eaf9e36dd",
                  "kind": "criterion",
                  "label": null,
                  "name": "Hunt & Reffert 2023's 50th percentile of the logarithm of an open cluster's age is kept as an estimated age in years, with its 16th and 84th percentiles as a 68% credible interval.",
                  "parent": "01a1c7c5-a164-7706-ad2c-c82d69fadcb8"
                },
                {
                  "change": "added",
                  "key": "01a1c7c5-a164-7706-ad2c-c82fc742d77b",
                  "kind": "criterion",
                  "label": null,
                  "name": "An age keeps its native value, the base-10 logarithm of the age in years as its source publishes it, beside its normalized value in years.",
                  "parent": "01a1c7c5-a164-7706-ad2c-c82d69fadcb8"
                },
                {
                  "change": "added",
                  "key": "01a1c7c5-a164-7706-ad2c-c830ff27afdf",
                  "kind": "criterion",
                  "label": null,
                  "name": "An open cluster whose source publishes no age has none, and is not given one.",
                  "parent": "01a1c7c5-a164-7706-ad2c-c82d69fadcb8"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c601520a52af",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall classify a Bailer-Jones 2021 distance as inferred where the Gaia DR3 parallax of its star is less than five times its error, and as estimated otherwise.",
                  "parent": "01a19f22-2ad9-716e-876f-186219f4e104"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c6027604a178",
                  "kind": "criterion",
                  "label": null,
                  "name": "A Bailer-Jones distance of a star whose parallax is less than five times its error is inferred.",
                  "parent": "01a1c319-7860-76e8-92ac-c601520a52af"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c603c8d6589e",
                  "kind": "criterion",
                  "label": null,
                  "name": "A Bailer-Jones distance of a star whose parallax is zero or negative, or that has none, is inferred.",
                  "parent": "01a1c319-7860-76e8-92ac-c601520a52af"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c6045ac7b6f1",
                  "kind": "criterion",
                  "label": null,
                  "name": "A Bailer-Jones distance of a star whose parallax is at least five times its error is estimated.",
                  "parent": "01a1c319-7860-76e8-92ac-c601520a52af"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c605905af8ee",
                  "kind": "criterion",
                  "label": null,
                  "name": "The ratio of five and its basis are stated in the ranking rule, which the release records.",
                  "parent": "01a1c319-7860-76e8-92ac-c601520a52af"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c606e2fa0dcc",
                  "kind": "criterion",
                  "label": null,
                  "name": "A star keeps the Gaia DR3 parallax and parallax error that its distance's kind of value rests on, as measured values.",
                  "parent": "01a1c319-7860-76e8-92ac-c601520a52af"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c6074783ae9b",
                  "kind": "criterion",
                  "label": null,
                  "name": "An inferred distance places its star as any other distance does, under the ranking rule's threshold for a distance too uncertain to place.",
                  "parent": "01a1c319-7860-76e8-92ac-c601520a52af"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c608fc0fd4c3",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall keep for each Galaxy tracer the kind of object it is and the distance its source publishes, with that source's uncertainty, method and kind of value.",
                  "parent": "01a19f22-2ad9-716e-876f-186219f4e104"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c609c99b51a3",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each Galaxy tracer names its kind of object: open cluster, globular cluster, classical Cepheid, RR Lyrae star or star-forming region.",
                  "parent": "01a1c319-7860-76e8-92ac-c608fc0fd4c3"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c60af84ad06b",
                  "kind": "criterion",
                  "label": null,
                  "name": "A Cepheid or RR Lyrae star keeps its pulsation type as its source publishes it.",
                  "parent": "01a1c319-7860-76e8-92ac-c608fc0fd4c3"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c60bab2a9a0e",
                  "kind": "criterion",
                  "label": null,
                  "name": "A Cepheid's or RR Lyrae star's distance is an estimated primary-indicator distance whose method names the relation its source used.",
                  "parent": "01a1c319-7860-76e8-92ac-c608fc0fd4c3"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c60c55259d8f",
                  "kind": "criterion",
                  "label": null,
                  "name": "An open or globular cluster's distance is an estimated distance whose method names how its source derived it.",
                  "parent": "01a1c319-7860-76e8-92ac-c608fc0fd4c3"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c60d21b0fe2e",
                  "kind": "criterion",
                  "label": null,
                  "name": "A maser's parallax is kept as measured with its error, and a distance is derived from it only under the parallax rule of the ranking rule.",
                  "parent": "01a1c319-7860-76e8-92ac-c608fc0fd4c3"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c60efaeb5601",
                  "kind": "criterion",
                  "label": null,
                  "name": "A Cepheid or RR Lyrae star joins the object of its Gaia DR3 source by the source id its source gives, as a published cross-identification.",
                  "parent": "01a1c319-7860-76e8-92ac-c608fc0fd4c3"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c60f36189336",
                  "kind": "feature",
                  "label": null,
                  "name": "Resample the dust map",
                  "parent": "01a19f1a-685d-7357-b67e-d65aba28b58f"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c610df135a9d",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall publish the Edenhofer 2024 dust map as a volume grid of its posterior mean dust density, with its posterior standard deviation as each cell's uncertainty, resampled onto a Cartesian grid about the Sun.",
                  "parent": "01a1c319-7860-76e8-92ac-c60f36189336"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c6115fb30760",
                  "kind": "criterion",
                  "label": null,
                  "name": "The grid is a cube of 2,500 pc a side centred on the Sun in cells of 10 pc, 250 cells a side, with its axes along the galactic Cartesian axes of the Hipparcos catalogue's transformation.",
                  "parent": "01a1c319-7860-76e8-92ac-c610df135a9d"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c612e2d9ee1a",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each cell holds the mean of the source's values at the centres of the source's voxels that fall within it, or, where none does, the source's value at the cell's centre, and the grid's header names this resampling.",
                  "parent": "01a1c319-7860-76e8-92ac-c610df135a9d"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c613ec2ab0d2",
                  "kind": "criterion",
                  "label": null,
                  "name": "A cell whose centre lies outside the map's distance bins, nearer than their inner boundary or farther than their outer one (68.6 pc and 1,248.1 pc in the published file), holds a value that marks no data, never zero, in the mean and in its standard deviation.",
                  "parent": "01a1c319-7860-76e8-92ac-c610df135a9d"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c614a12c8ab8",
                  "kind": "criterion",
                  "label": null,
                  "name": "The mean and its standard deviation keep the source's unit, extinction in the units of Zhang, Green & Rix 2023 per parsec, and name it.",
                  "parent": "01a1c319-7860-76e8-92ac-c610df135a9d"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c6153bd22a56",
                  "kind": "criterion",
                  "label": null,
                  "name": "The kind of value of the mean and of its standard deviation is reconstructed.",
                  "parent": "01a1c319-7860-76e8-92ac-c610df135a9d"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c6161d503573",
                  "kind": "criterion",
                  "label": null,
                  "name": "The standard deviation is published as samples of its own, which the grid's header names as the uncertainty of the mean.",
                  "parent": "01a1c319-7860-76e8-92ac-c610df135a9d"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c617cbb3fe81",
                  "kind": "criterion",
                  "label": null,
                  "name": "Two builds from the same source files give grids with the same SHA-256.",
                  "parent": "01a1c319-7860-76e8-92ac-c610df135a9d"
                },
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d65bef1ca65c",
                  "kind": "feature_group",
                  "label": "FG-3",
                  "name": "Identity",
                  "parent": "01a19f1a-685d-7357-b67e-d658085bf5c8"
                },
                {
                  "change": null,
                  "key": "01a19f23-636e-7035-8185-ab97eb9c2fb9",
                  "kind": "feature",
                  "label": "F-6",
                  "name": "Choose the preferred measurement",
                  "parent": "01a19f1a-685d-7357-b67e-d65bef1ca65c"
                },
                {
                  "change": null,
                  "key": "01a19f23-636e-7035-8185-ab988f5d57b7",
                  "kind": "requirement",
                  "label": "RQ-24",
                  "name": "Univ Ingest shall choose as an object's preferred distance the measurement that ranks first: its leading redshift distance by kind of value and velocity uncertainty, against its other distances by fractional distance uncertainty and method rank.",
                  "parent": "01a19f23-636e-7035-8185-ab97eb9c2fb9"
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c600a1803611",
                  "kind": "criterion",
                  "label": null,
                  "name": "Where any measured or estimated geometric, primary-indicator or secondary-indicator distance precise enough to place its object is a candidate, an inferred one, such as a Bailer-Jones distance resting on a parallax below five times its error, is set aside.",
                  "parent": "01a19f23-636e-7035-8185-ab988f5d57b7"
                },
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d65c50ba74e7",
                  "kind": "feature_group",
                  "label": "FG-4",
                  "name": "Releases",
                  "parent": "01a19f1a-685d-7357-b67e-d658085bf5c8"
                },
                {
                  "change": null,
                  "key": "01a19f23-636f-72bd-b194-152a40334d81",
                  "kind": "feature",
                  "label": "F-10",
                  "name": "Build octree tiles",
                  "parent": "01a19f1a-685d-7357-b67e-d65c50ba74e7"
                },
                {
                  "change": null,
                  "key": "01a19f23-636f-72bd-b194-152b36f5a5b5",
                  "kind": "requirement",
                  "label": "RQ-36",
                  "name": "Univ Ingest shall build for each scale domain an octree of tiles over the derived ICRS Cartesian positions of its objects.",
                  "parent": "01a19f23-636f-72bd-b194-152a40334d81"
                },
                {
                  "change": "changed",
                  "key": "01a19f23-636f-72bd-b194-152c99726521",
                  "kind": "criterion",
                  "label": "AC-91",
                  "name": "Each scale domain has its own root: stars and Galaxy tracers in parsecs, nearby galaxies and cosmic web in megaparsecs.",
                  "parent": "01a19f23-636f-72bd-b194-152b36f5a5b5"
                },
                {
                  "change": "changed",
                  "key": "01a19f23-636f-72bd-b194-152dec6f0f74",
                  "kind": "criterion",
                  "label": "AC-92",
                  "name": "Each object belongs to one scale domain: Galaxy tracers where any of its catalogue entries comes from a source whose definition names Galaxy tracers, otherwise stars where the source definition of the catalogue entry that holds its preferred distance names stars, and otherwise nearby galaxies where its placed distance is within 11 Mpc, the depth of the Updated Nearby Galaxy Catalog (Karachentsev et al. 2013), and cosmic web beyond, whatever source the distance came from.",
                  "parent": "01a19f23-636f-72bd-b194-152b36f5a5b5"
                },
                {
                  "change": "added",
                  "key": "01a1c7c5-a164-7706-ad2c-c831082f4d41",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall encode, from encoding version 3, the age of each point of the Galaxy tracers domain where its object has one, in the place a star's colour index takes.",
                  "parent": "01a19f23-636f-72bd-b194-152a40334d81"
                },
                {
                  "change": "added",
                  "key": "01a1c7c5-a164-7706-ad2c-c832997484e0",
                  "kind": "criterion",
                  "label": null,
                  "name": "A point of the Galaxy tracers domain carries the base-10 logarithm of its object's preferred age in years where it has one, coded apart from both colour indices.",
                  "parent": "01a1c7c5-a164-7706-ad2c-c831082f4d41"
                },
                {
                  "change": "added",
                  "key": "01a1c7c5-a164-7706-ad2c-c833a68083c3",
                  "kind": "criterion",
                  "label": null,
                  "name": "A point of the Galaxy tracers domain whose object has no age carries none, which no age encodes.",
                  "parent": "01a1c7c5-a164-7706-ad2c-c831082f4d41"
                },
                {
                  "change": "added",
                  "key": "01a1c7c5-a164-7706-ad2c-c834de8aedd4",
                  "kind": "criterion",
                  "label": null,
                  "name": "An age is encoded within 0.01 of the logarithm it was built from.",
                  "parent": "01a1c7c5-a164-7706-ad2c-c831082f4d41"
                },
                {
                  "change": "added",
                  "key": "01a1c7c5-a164-7706-ad2c-c835f5afc589",
                  "kind": "criterion",
                  "label": null,
                  "name": "A version 3 point takes the same bytes as a version 2 point.",
                  "parent": "01a1c7c5-a164-7706-ad2c-c831082f4d41"
                },
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d65e20557892",
                  "kind": "product",
                  "label": "P-2",
                  "name": "Univ Server",
                  "parent": null
                },
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d660e2178068",
                  "kind": "feature_group",
                  "label": "FG-7",
                  "name": "Bulk data",
                  "parent": "01a19f1a-685d-7357-b67e-d65e20557892"
                },
                {
                  "change": null,
                  "key": "01a19f1f-9fd6-77e0-931c-f98491ea6241",
                  "kind": "feature",
                  "label": "F-18",
                  "name": "Fetch a tile manifest",
                  "parent": "01a19f1a-685d-7357-b67e-d660e2178068"
                },
                {
                  "change": null,
                  "key": "01a19f1f-9fd6-77e0-931c-f985aa2ecbff",
                  "kind": "requirement",
                  "label": "RQ-62",
                  "name": "When a client lists scale domains, Univ Server shall return each scale domain of the release with its extent, unit and point count.",
                  "parent": "01a19f1f-9fd6-77e0-931c-f98491ea6241"
                },
                {
                  "change": "changed",
                  "key": "01a19f1f-9fd6-77e0-931c-f9865de3a042",
                  "kind": "criterion",
                  "label": "AC-166",
                  "name": "The listing holds the stars, Galaxy tracers, nearby galaxies and cosmic web scale domains.",
                  "parent": "01a19f1f-9fd6-77e0-931c-f985aa2ecbff"
                },
                {
                  "change": null,
