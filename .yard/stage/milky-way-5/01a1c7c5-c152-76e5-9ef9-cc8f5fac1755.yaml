        markdown: |-
          Committed as `192f617`.

          | File | Change |
          |---|---|
          | normalize-records | New requirement: an open cluster keeps Hunt & Reffert's age as estimated, in years, with the 16th–84th percentiles as a 68% interval and the logarithm as its native value |
          | build-octree-tiles | New requirement: from version 3, a Galaxy tracer carries log₁₀ age in years in the colour slot, under its own code, within 0.01; no point grows |
          | decode-the-tile-format | The decoder reads versions 1, 2 and 3; a version 3 point gives a colour, an age, or neither |
          | choose-what-is-drawn | New requirement: an age choice for the Galaxy's tracers (any, or under 100, 30 or 10 Myr), kept in the address. All resets it |
          | read-an-object | The panel gives each age in Myr with its uncertainty, kind of value and source, and its published logarithm |
        tone: success
