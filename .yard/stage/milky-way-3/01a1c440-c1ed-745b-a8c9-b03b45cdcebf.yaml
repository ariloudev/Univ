                    "before": "Gaia DR3 bright stars\n\nGaia DR3 sources (Gaia Collaboration, Vallenari et al. 2023, A&A 674, A1) brighter than the G cut the source definition names, at epoch J2016.0, with their BP−RP colour and the ESP-HS spectral type of the astrophysical parameters table (Creevey et al. 2023, A&A 674, A26) where it gives one."
