                  }
                },
                {
                  "change": "added",
                  "key": "01a1c319-7860-76e8-92ac-c5da24c9d23c",
                  "kind": "decision",
                  "label": null,
                  "name": "Take Gaia DR3 stars to G < 14, with the Galaxy's tracers",
                  "words": {
