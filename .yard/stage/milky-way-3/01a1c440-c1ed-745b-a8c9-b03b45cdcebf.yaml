                  "kind": "component",
                  "label": null,
                  "name": "Li 2023 RR Lyrae",
                  "words": {
                    "after": "Li 2023 RR Lyrae\n\nPhotometric metallicities and distances of 135,873 RR Lyrae stars of Gaia DR3 (Li et al. 2023, ApJ 944, 88; VizieR J/ApJ/944/88), from a G-band absolute magnitude and metallicity relation, identified by their Gaia DR3 source ids."
                  }
