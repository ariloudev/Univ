                  "words": {
                    "after": "Galactic globular cluster database\n\nHolger Baumgardt's database of the Milky Way's globular clusters (people.smp.uq.edu.au/HolgerBaumgardt/globular), whose tables carry their authors' copyright and state no terms of redistribution."
                  }
