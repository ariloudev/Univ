                  "name": "Baumgardt & Vasiliev 2021 globular clusters",
                  "words": {
                    "after": "Baumgardt & Vasiliev 2021 globular clusters\n\nDistances of 165 Galactic globular clusters combining Gaia EDR3 parallaxes, HST star counts and literature distances (Baumgardt & Vasiliev 2021, MNRAS 505, 5957), as the database's orbits table gives them: the paper's distances are on no VizieR mirror. Permission to redistribute is pending."
