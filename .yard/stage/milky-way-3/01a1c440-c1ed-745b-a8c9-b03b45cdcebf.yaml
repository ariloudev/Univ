                  "name": "Hunt & Reffert 2023 open clusters",
                  "words": {
                    "after": "Hunt & Reffert 2023 open clusters\n\nThe all-sky star cluster catalogue of Hunt & Reffert 2023 (A&A 673, A114; VizieR J/A+A/673/A114), from Gaia DR3: about 7,200 clusters with distances from their members' parallaxes, ages and extinctions. The clusters are taken, not their members."
