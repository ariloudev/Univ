                  "kind": "component",
                  "label": null,
                  "name": "Skowron 2025 classical Cepheids",
                  "words": {
                    "after": "Skowron 2025 classical Cepheids\n\nDistances of 3,424 Galactic classical Cepheids from mid-infrared period-luminosity relations (Skowron et al. 2025, ApJS 278, 57; VizieR J/ApJS/278/57), built on the Cepheids of Gaia DR3 and identified by their Gaia DR3 source ids."
                  }
