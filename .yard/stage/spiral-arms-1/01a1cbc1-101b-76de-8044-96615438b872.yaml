          host: claude-code
          session: "733ab034-0172-4107-897d-a9a3752e1525"
        title: "The model arms against their own masers"
        markdown: |-
          Before writing the tests, every Reid 2019 maser with a parallax better than 20% was set against the model arm it was assigned to, with the same conventions as `spiral.rs`:

          | Arm | Masers | Median distance to its arm | As mirrored |
          |---|---|---|---|
          | Local | 27 | 0.20 kpc | 0.79 kpc |
          | Perseus | 33 | 0.25 kpc | 0.99 kpc |
          | Scutum (near) | 27 | 0.26 kpc | 1.45 kpc |
          | Sagittarius (near) | 16 | 0.21 kpc | 1.39 kpc |
          | Norma | 9 | 0.11 kpc | 2.42 kpc |
          | Outer | 9 | 0.65 kpc | 0.93 kpc |

          The medians sit at the arms' published widths (0.14–0.65 kpc), and the mirrored sense of azimuth misses them, so the sign of β, the Sun's place and the galactic axes are right. Two of those masers (NGC 7538, and G031.24−00.11 on the far side) are now a test.
        tone: success
