        detail: "univ-model writes versions 3 (BASE_VERSION) and 4 (VERSION) and reads 1–4; version 4 adds a u8 kind-of-object column (0 none, else 1 + index into OBJECT_KINDS), described by format::layout and the manifest's TRACERS_ENCODING. Ingest writes 4 for galaxy_tracers only; the octree's full-leaf limit follows the domain's point size. TypeScript decoder, README and fixtures carry version 4 (a SIMULATED tracers fixture; the real fixture release has no tracers). Rewriting the fixtures changed only the tracers' files. Tests: v4 round-trip and refusal, layout, per-domain versions in a built release; decoder 12/12; explorer 513/513."
