        title: "T4. Reid 2019 arms as log-spiral structures"
        detail: "Structure files take a cited log_spiral (structures/spiral.rs); the release places it as a univ-model path in the ICRS, centred on its middle point, with a derivation naming the formula, R0 and the Sun's height and a new kind_of_value (reconstructed). 14 files from Table 2, re-read from the arXiv TeX source. Tests: radii at β = 0 (Local 8.526, Perseus 10.070, Sgr-Car 6.871 kpc), exact fitted spans, extrapolation within 90° and 3–16 kpc (Sct-Cen cut at 3 kpc, Perseus −113° to 205°), two Perseus masers on the arm and off its mirror, the placed path and its pointers, and refusals. Workspace: 1006 tests pass, clippy clean."
