        title: "What wave 1 produced"
        markdown: |-
          - **Zari et al. 2021**: 417,535 luminous hot stars as Galaxy tracers, each with its astro-kinematic distance kept as inferred and its parallax as measured with none reported; each joins its Gaia DR3 star, whose precise parallax places it first.
          - **Tile encoding 4** for the Galaxy tracers only: each point's kind of object after version 3's columns; the other domains' tiles stay version 3, byte for byte.
          - **Reid 2019's seven arms** as 14 model structures (fitted and extrapolated), every number cited to Table 2 or a quoted sentence, the path computed in ingest; checked against the paper's own masers (medians 0.11–0.65 kpc from their arms, about the arms' widths).
          - **Six science checks** for release 15.

          Next: release 15 (a full ingest, waiting for the owner's approval) and wave 2, the explorer.
