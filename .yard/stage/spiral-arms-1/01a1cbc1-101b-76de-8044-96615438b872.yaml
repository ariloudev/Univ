  - key: 01a1cc02-ef1f-7301-858d-8c1c6c8ad897
    id: arm-check
    kind: note
    versions:
      - key: 01a1cc02-ef1f-7301-858d-8c1ff38c3318
        at: 2026-11-11T19:08:26Z
        revision: 6
        by:
          host: claude-code
          session: "733ab034-0172-4107-897d-a9a3752e1525"
        title: "The model arms against their own masers"
        markdown: |-
          Before writing the tests, every Reid 2019 maser with a parallax better than 20% was set against the model arm it was assigned to, with the same conventions as `spiral.rs`:

          | Arm | Masers | Median distance to its arm | As mirrored |
          |---|---|---|---|
          | Local | 27 | 0.20 kpc | 0.79 kpc |
          | Perseus | 33 | 0.25 kpc | 0.99 kpc |
          | Scutum (near) | 27 | 0.26 kpc | 1.45 kpc |
          | Sagittarius (near) | 16 | 0.21 kpc | 1.39 kpc |
          | Norma | 9 | 0.11 kpc | 2.42 kpc |
          | Outer | 9 | 0.65 kpc | 0.93 kpc |

          The medians sit at the arms' published widths (0.14–0.65 kpc), and the mirrored sense of azimuth misses them, so the sign of β, the Sun's place and the galactic axes are right. Two of those masers (NGC 7538, and G031.24−00.11 on the far side) are now a test.
        tone: success
  - key: 01a1cc28-f08d-778e-b764-69ebf2bb1ac0
    id: review-findings
    kind: note
    versions:
      - key: 01a1cc28-f08d-778e-b764-69ec1c68898c
        at: 2026-11-11T19:49:57Z
        revision: 9
        by:
          host: claude-code
          session: "733ab034-0172-4107-897d-a9a3752e1525"
        title: "/code-review findings"
        markdown: |-
          The review checked the Table 2 numbers in all seven arms, the azimuth sign and heliocentric axes, the version 4 layout in Rust and TypeScript, the Zari slice bounds, the `LogSpiral` pointers and how the explorer takes parsec paths, and found them correct.

          | Finding | Fix | State |
          |---|---|---|
          | The release manifest's `tile_encoding` says 4 while most domains write 3 | The API reads each domain's own manifest, so the field is build metadata: documented as the newest encoding the build writes | fixed |
          | `object_kind_code` would code a kind left off `OBJECT_KINDS` as none, silently | Exhaustive match on `ObjectKind`; the round-trip test holds it to the list's order | fixed |
          | `SPIRAL_METHOD` restated 90° and 3–16 kpc by hand | `spiral_method()` formats them from `EXTRAPOLATION_DEGREES` and `RADIUS_BAND_KPC` | fixed |
          | An arm and its extrapolation repeat the cited parameters with nothing to keep them equal | Test: each extrapolation takes every cited parameter of its arm | fixed |
          | `MAX_POINTS` doc said 49,930 | 49,929 | fixed |
          | The tile-format answer was never checked to describe version 4 | univ-api unit test with a version 3 and a version 4 domain (the integration fixture has no tracers) | fixed |
          | The explorer's depth index knows no `model` status | T9 of wave 2, as planned (half-filled dot and its legend); release 15 is not drawn before then | deferred to wave 2 |
          | `object_kinds` a fixed-length array | Adding a kind changes what version 4's codes mean, which needs version 5 anyway, with its own list | disputed |
          | `assign` asks the encoding per object | A const check; `/simplify`'s altitude review asked for exactly this, so one place decides | disputed |
          | Path computed three times per arm | Already weighed in `/simplify`: microseconds over 14 arms | disputed |
