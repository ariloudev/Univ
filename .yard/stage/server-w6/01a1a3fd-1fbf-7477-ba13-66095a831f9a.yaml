        title: "What W6 produced"
        markdown: |-
          `POST /v1/query/volume` answers with the objects, structures and layer items in a box, sphere or cone given in the ICRS, galactic or supergalactic frame and any length unit.

          | Part | How it matches |
          |---|---|
          | Objects | exactly in SQL, by derived position, over the cells the volume's box covers |
          | Structures | by placed shape, member list, bounding box (labelled approximate) or centre, in that order |
          | Items | by their shape, with their stored box narrowing the candidates |

          - Filters: kinds, sources, scale domains, layers and a time interval on TT, combined with AND.
          - Pages of 1,000, capped at 10,000. Signed cursors record the release and each layer's sequence; a layer changed between pages answers 409.
          - The first page gives the tile nodes covering the volume per scale domain.
          - **QA-3 met** on release 6: p95 47.9 ms against 500 ms.

          **For W7:** release 6 has no placed structure shapes, so its structures match by bounding box; release 7 built with the current ingest fixes that. The OpenAPI snapshot (AC-292) is W7's.
        tone: success
