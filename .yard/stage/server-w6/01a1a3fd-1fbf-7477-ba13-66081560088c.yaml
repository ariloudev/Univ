        by:
          host: claude-code
          session: "8a28c3c8-b122-421a-a3de-8664f4b8b6df"
        title: "Fix W6's review findings"
        detail: |-
          **Code review:**
          - items stored before migration 0004 are invisible;
          - cursors can be forged: unsigned, and their `served` count is trusted;
          - a 409 reveals which private layer ids exist;
          - `kinds` accepts any term;
          - the cursor's digest includes `tiles`;
          - the body is parsed by hand next to the model types;
          - structures are read without a limit;
          - objects are sorted again on every page.

          **Simplify:**
          - volume rules written in two places;
          - a placeholder time record;
          - copied JSON helpers and the readable-layer SQL;
          - `HitPosition` holds strings;
          - domain names hardcoded;
          - `Region` clones;
          - fields that could be derived;
          - `collect` matches twice;
          - vector helpers defined three times;
          - `Aabb` builders duplicated;
          - tile leaves found with 8 strings per node;
          - the octree builder copied in tests;
          - linear vocabulary lookups;
          - no test ties the SQL predicate to `Region::contains`.

          **Kept as is, with reasons:** no index on item boxes (layers are small in v1); tile nodes not pruned by parent (401 nodes); awaits not run together (univ-api has no join utility).
        state: active
