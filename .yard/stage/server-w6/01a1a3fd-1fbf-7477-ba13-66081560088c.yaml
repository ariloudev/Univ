          ### W7: Contract complete and the real release (`stage/server-w7`)

          **OpenAPI checks:**

          - every refusal of every route appears with its status and problem type;
          - the schemas are generated from univ-model types;
          - a snapshot test of `openapi.json` refuses any removal or rename within `/v1`, and allows additions only (AC-292).

          **Release 7:** release 6 predates `structure_details`, so W6 matches its structures by bounding box, labelled (decided in W6). W7 builds and publishes a release 7 with the current ingest, from cached downloads, run in the background. Its structures then match by their placed shapes. The checks below run on release 7, with release 6 kept as the previous release.

          **On release 7, through `cargo xtask serve`:**

          - measure QA-2 and QA-3 and record the results as `sampled` evidence;
          - decode all 401 tiles with the TypeScript decoder and check their SHA-256s (AC-281);
          - spot-check the science through the API: M31 at about 0.78 Mpc, M87 at 16.77 Mpc, the Virgo group at its KT17 centre, and Laniakea's attractors in their basins;
          - check that releases 1–4 answer 410.

          Whatever fails is fixed as a task or reported plainly.

          **Covers:** F-33 (AC-285–292) and every criterion again end to end.

          ## Verification

          - **Each wave:** `cargo xtask check` and `cargo xtask integration` are green at the wave's end. `/simplify` and `/code-review` findings are resolved, `loft reconcile --accept` passes, and a `trace` block is recorded.
