        title: "Covering tile nodes"
        detail: |-
          `query/tiles.rs`.

          **What changed:** the kept manifest index now has each node's level and cube, and a leaf flag. A covering at a level is the level's nodes that meet the volume, plus the shallower leaves that do. The level chosen is the deepest at most `max_level` with at most 4,096 nodes. Coverings come on the first page, for the domains the filters leave, when the query reads objects.

          **Tests:**
          - covering against a brute-force count on a full octree of five levels, for three spheres; level 5 exceeds 4,096 nodes, so level 4 is chosen; `max_level` is honoured;
          - shallower leaves standing in where the octree stops short;
          - a handler test: the four level-2 nodes about x = 100 Mpc, each fetched through the tile route.

          When no node meets the volume, the level is the deepest allowed, with no nodes.
        state: done
