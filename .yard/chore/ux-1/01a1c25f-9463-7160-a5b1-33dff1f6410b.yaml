        title: "Fix plan: letting go makes Earth the focus again (`chore/ux-1`)"
        markdown: |
          # Fix plan: letting go makes Earth the focus again (`chore/ux-1`)

          ## Context

          The owner found that deselecting kept the camera locked on the item they had let go. Nothing follows the chosen item: a click makes its point the view's focus, and turning and zooming pivot on it. The approved criteria said letting go leaves the view where it was, so the focus stayed on an empty spot.

          The owner chose **Back to Earth** in Yard. The spec change is committed at `3abd085`:
          - **Both let-go statements** (read-an-object and see-the-structures) now also make Earth the focus again.
          - **Two criteria** now read "Once the object/structure is let go, Earth is the focus again, at the distance from the eye to the focus the view had."

          Only the steps these nodes touch are planned here. Everything else in the approved plan stands, and this is Yard task `t-fix-focus`, a fix.

          ## Changes

          - **`clients/explorer/src/ui/letGo.ts`:** adds `letGo(close, controller)`. It calls `close()`, then `controller?.returnToEarth()`.
            - It reuses `Controller.returnToEarth()` (`scene/controller.ts`), which is what the rail's Earth button calls.
            - That method centres on the origin at the current distance, flying unless reduced motion asks otherwise.
          - **`clients/explorer/src/ui/Scene.tsx`:** `OnChoose.letGo` and `selection.structureFromList` call `letGo(selection.close, world?.controller)` in place of `selection.close()` alone.
          - **The panels' close buttons keep `selection.close()` unchanged.** The decision covered only letting go by choosing again. Whether closing a panel should also return to Earth goes to the owner in the final report.

          ## Tests and trace

          - **`letGo.test.ts`:** `letGo` closes the record and returns the focus to Earth, using a fake controller that records `returnToEarth`.
          - **`e2e/explorer.spec.ts`:** in the object and structure let-go tests, after the let-go click, the "Earth" mark is polled until it sits at the canvas centre (the focus) under reduced motion. The distance is still unchanged. This replaces the reliance on the view staying put.
          - **`loft.trace.yaml`:** the two reworded criteria (keys `…7d969cb2496a` and `…7d9d5bd55b7c`) link to the new `letGo` unit test and their e2e tests, in place of `chooses`' "lets it go" test. The reworded statements make no criterion stale beyond these two.

          ## Verification

          - `pnpm check` in `clients/explorer` before the commit `fix(explorer): letting go makes Earth the focus again`, with `.yard/`.
          - Then the remaining plan as approved:
            - `cargo xtask integration`. The run in progress predates this fix and is superseded.
            - Accept the trace links, then `/simplify` and `/code-review`.
            - `cargo xtask check`, then integration once more.
            - Close the Yard Log and leave the branch unmerged.
        planMode: true
