  - key: 01a1c26b-2fd3-75cc-84d5-3c8d826ee941
    id: ask-let-go-focus
    kind: question
    versions:
      - key: 01a1c26b-2fd3-75cc-84d5-3c8e5e5d07d8
        at: 2026-11-09T22:26:06Z
        revision: 8
        by:
          host: claude-code
          session: "659efa7c-bd48-4781-a542-1417b043d536"
        prompt: "When the chosen object or structure is let go, where should the view's focus go?"
        header: "Focus"
        context: |-
          Nothing follows the chosen item. A click makes its point the **focus**, and turning and zooming pivot on it. Letting go currently leaves the focus there, because the approved criteria say the view stays where it was. So the camera still pivots on an empty spot. Choosing a structure also flies to it, so the focus sits on the structure's centre.

          Any fix rewords two criteria: "A click on the chosen object's point leaves the view where it was" and "Choosing the chosen structure again leaves the view where it was".
        options:
          - label: "Back to Earth"
            detail: "Letting go makes Earth the focus again at the current distance, as the Earth button does, flying there (or moving at once under reduced motion). It is simple and predictable, since Earth is the explorer's resting focus, but it moves the view a long way when you are far out."
            recommended: true
          - label: "The view before"
            detail: "Letting go flies back to the focus and distance the view had just before the item was chosen. It undoes the click's centring or the structure's flight, but it also undoes any zoom or turn made since, and it is odd after several choices in a row."
          - label: "Keep eye, refocus"
            detail: "The eye stays where it is, but the focus moves to the point straight ahead at Earth's distance, so turning pivots there instead of on the item. Nothing jumps, but what you then turn about is an unmarked point in space."
    responses:
      - key: 01a1c26b-8d62-70ed-8f6e-284f236105ef
        at: 2026-11-09T22:26:30Z
        revision: 9
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: terminal
        chosen:
          - "Back to Earth"
