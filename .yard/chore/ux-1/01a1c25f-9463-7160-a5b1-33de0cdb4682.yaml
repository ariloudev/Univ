        markdown: |-
          **1. Choosing the chosen thing again lets it go**

          - **Objects (read-an-object):** a click on the chosen object's point closes its record, unmarks the point and drops it from the address. The view stays where it is. A double-click on it still flies there and keeps it chosen.
          - **Structures (see-the-structures):** the same for a click on the chosen structure's name in the view, or on its entry in the Structures list.
          - **RQ-148 reworded:** "a click on a point makes it the focus" now excludes the chosen object's point, since that click no longer moves the view.
          - **Not covered:** finding the chosen object again with the search, or picking it from a link in a record, keeps it chosen. I read "selecting" as clicking in the view or the list.

          **2. The open drawer is remembered (frame-the-view-as-an-atlas)**

          - Each time a drawer opens or closes, the rail stores which one is open, or none, in localStorage.
          - On opening, the explorer restores that drawer.
          - A missing or unknown value, or blocked storage, opens with no drawer.
          - This also applies on windows narrower than 1,024 px, where the restored drawer opens over the view.
