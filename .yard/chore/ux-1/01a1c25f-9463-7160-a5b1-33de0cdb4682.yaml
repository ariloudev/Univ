        title: "Why"
        markdown: |-
          The owner asked for two UX changes on `chore/ux-1`:

          1. Selecting an already selected item should deselect it.
          2. The left panel's expand state should be stored in and restored from localStorage.

          The branch was cut from `develop` at `26b26d4`. It is not merged until the owner asks.
