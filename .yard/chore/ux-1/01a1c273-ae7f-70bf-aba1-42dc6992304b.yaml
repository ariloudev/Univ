          **New in see-the-structures:** Univ Explorer lists the structures in the Structures drawer outward from Earth, each placed on one axis of distance that every row shares.

          - **Order:** nearest first, by the distance to the centre as the view places it. Structures with no placed shape come last.
          - **Headings:** within 100 Mpc, 100 Mpc to 1 Gpc, 1 to 10 Gpc, and not placed, each with its count.
          - **Rows:** name, kind in words beside its colour swatch, and distance. Distances are whole Mpc below 1,000 Mpc and Gpc to three figures above, and the KBC void reads "around us".
          - **Dot:** in the kind's colour on a log axis from 10 Mpc to 10 Gpc, with its ticks labelled at the head. It is filled for observed, open for a statistical claim and dotted for reconstructed, with a legend.
          - **A to Z switch:** orders by name without headings, keeping the dots.
          - **Find box:** narrows by name or kind, with an "N of 54" count and a message when nothing matches.
          - **The chosen row is marked.**

          **Unchanged:** the existing criterion "Every structure of the release is listed by name and kind", and choosing or letting go from the list.

          **To look at:** whether the order switch and the find box should be kept across visits, like the drawer. They are not in this change.
