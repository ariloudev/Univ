      - key: 01a1c277-b514-7245-85db-9e2a8bde30e0
        at: 2026-11-09T22:39:47Z
        revision: 20
        by:
          host: claude-code
          session: "659efa7c-bd48-4781-a542-1417b043d536"
        title: "The Structures drawer becomes a depth index"
        consequence: "The drawer lists the structures outward from Earth, grouped by decade of distance, each row with its kind in words and colour, its distance, and a dot on one shared log axis whose fill says how the structure is known. It adds an A-to-Z switch and a find box. This needs a new see-the-structures Requirement, approved before any code."
        question: 01a1c277-3510-77ef-90ff-624ca3ff95b5
