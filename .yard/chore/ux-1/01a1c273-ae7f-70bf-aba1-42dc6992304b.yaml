  - key: 01a1c273-ae7f-70bf-aba1-42ddfdc09ec4
    id: design-why
    kind: note
    versions:
      - key: 01a1c273-ae7f-70bf-aba1-42e4a1e39e95
        at: 2026-11-09T22:35:23Z
        revision: 16
        by:
          host: claude-code
          session: "659efa7c-bd48-4781-a542-1417b043d536"
        title: "Why"
        markdown: "The owner asked for the Structures drawer to be redesigned using the frontend-design and dataviz skills. Today it lists 54 structures alphabetically, each as an italic name followed by its kind in parentheses. Long names wrap onto a second line, and the list says nothing of where each structure lies or how large it is, although the explorer reads every structure's placed shape."
  - key: 01a1c277-3510-77ef-90ff-624b7b1392cb
    id: design-options
    kind: note
    versions:
      - key: 01a1c277-3510-77ef-90ff-624d3d0c7d47
        at: 2026-11-09T22:39:14Z
        revision: 18
        by:
          host: claude-code
          session: "659efa7c-bd48-4781-a542-1417b043d536"
        title: "Three options, from release 12's real structures"
        markdown: |-
          The options are on the page [Structures drawer options](https://claude.ai/artifact/TT6xR8P36q2NZ4P3U2fnsK). Each is a working 300-pixel drawer that can be clicked and searched, and holds the 54 structures as the view places them.

          | | A. Depth index | B. Families | C. Depth strip and list |
          |---|---|---|---|
          | Order | Nearest first, by decade of distance (or A to Z) | The Show drawer's five families, nearest first in each | A to Z |
          | Chart | A dot per row on one shared log axis, 10 Mpc to 10 Gpc | None: distance as a figure | One overview strip, a lane per family |
          | Kind | Swatch and words on every row | Swatch and words; kind chips per family | Swatch and words inline |
          | How it is known | Dot fill: observed, statistical claim, reconstructed | Words, only where not observed | Dot fill |
          | Find box | Yes | Yes | Yes, which also fades the strip's other dots |

          **Common to all three:**
          - **Distances:** to each structure's centre as placed, written in Mpc or Gpc. The 4 structures with no placed shape are listed as not placed.
          - **Kind colours:** the view's 13 kind colours fail the dataviz validator as a categorical palette (protan ΔE 1.6 between attractor and repeller, and 6.8 between ring and quasar group), so the kind is always written out beside the swatch.
        tone: info
  - key: 01a1c277-3510-77ef-90ff-624ca3ff95b5
    id: ask-design
    kind: question
    versions:
      - key: 01a1c277-3510-77ef-90ff-624ee28662ef
        at: 2026-11-09T22:39:14Z
        revision: 18
        by:
          host: claude-code
          session: "659efa7c-bd48-4781-a542-1417b043d536"
        prompt: "Which design should the Structures drawer take?"
        header: "Drawer"
        context: "Try them on [Structures drawer options](https://claude.ai/artifact/TT6xR8P36q2NZ4P3U2fnsK): click to choose and click again to let go, type to narrow the list, and switch the order in A. Whatever you choose goes through a spec change (the list criterion RQ for see-the-structures, plus new criteria for the order, the depth marks and the find box) before any code."
        options:
          - label: "A. Depth index"
            detail: "Ordered outward from Earth on a shared log-distance axis, grouped by decade, with how each structure is known in the dot's fill. The most information per row; rows are two lines (about 1.7 times the current list's height)."
            recommended: true
          - label: "B. Families"
            detail: "Grouped like the Show drawer, folding, with distance figures and no chart. The quietest and the closest to today, and a structure sits where its kind's switch is."
          - label: "C. Depth strip and list"
            detail: "An overview strip of every placed structure by distance and family above a one-line A to Z list. Gives the best whole picture, but the strip costs 150 pixels of list and its dots crowd between 60 and 300 Mpc."
    responses:
      - key: 01a1c277-896f-714f-a355-4def4945e866
        at: 2026-11-09T22:39:36Z
        revision: 19
        by:
          name: "ariloudev"
          email: "ariloudev@local"
        channel: page
        chosen:
          - "A. Depth index"
