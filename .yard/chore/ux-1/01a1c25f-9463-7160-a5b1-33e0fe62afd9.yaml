  - key: 01a1c2d7-2572-7587-9c7d-75f661130307
    id: gate-deny
    kind: note
    versions:
      - key: 01a1c2d7-2573-76f1-a95e-b638e3b49c3f
        at: 2026-11-10T00:24:02Z
        revision: 39
        by:
          host: claude-code
          session: "659efa7c-bd48-4781-a542-1417b043d536"
        title: "The gate fails at deny, on a new advisory"
        markdown: |-
          `cargo xtask check` passed every gate up to `deny` (Rust tests, clippy, fmt, lines, loft, the explorer's 474 tests, fallow and build), then failed on one new advisory.

          - **What:** RUSTSEC-2026-0459 (CVE-2026-119375). SQLite before 3.54.0 can return uninitialized page-cache memory when it opens a database together with a `-wal` file of a different page size. The attack is local and needs crafted files.
          - **Where:** `libsqlite3-sys` 0.30.1, bundled through `rusqlite` 0.32.1 (with the `bundled` feature) in univ-api (dev), univ-ingest and xtask.
          - **The fix upstream:** `rusqlite` 0.41, which bundles SQLite 3.54.x and needs Rust 1.89. The toolchain is `stable`.
          - **Not this branch's doing:** chore/ux-1 changes no Rust code or Cargo.lock, so develop fails the same way.
          - **Exposure here:** these crates open only databases they write themselves: the local D1 state, the science scratch database and the test fixtures.
        tone: warning
  - key: 01a1c2d7-2572-7587-9c7d-75f73f023a2d
    id: ask-deny
    kind: question
    versions:
      - key: 01a1c2d7-2573-76f1-a95e-b639614d06fd
        at: 2026-11-10T00:24:02Z
