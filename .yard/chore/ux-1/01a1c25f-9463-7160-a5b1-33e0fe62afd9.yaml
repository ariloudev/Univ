        title: "Review findings"
        markdown: |-
          From `/code-review` and `/simplify`'s four reviewers (reuse, simplification, efficiency, altitude), all fixed in 8bcf8f5 except where marked skipped.

          | # | Finding | From | Fix | State |
          |---|---|---|---|---|
          | 1 | A double-click on the chosen item let it go before choosing it again: the cull was lost, the record reloaded, and two flights competed | code-review | A click on what is chosen lets it go only after 300 ms with no double-click (`clickChooser`), and the second-click flag is gone | fixed |
          | 2 | The list toggled against the pending choice but marked the loaded one | code-review | `Selection.structureId` marks the row, and one `isChosen(target)` serves the view, the list and the marker | fixed |
          | 3 | A structure whose record was not read was labelled observed | code-review | Known in no way: a dim dot and no status words | fixed |
          | 4 | 999.5 to 1,000 Mpc read as Gpc under the "100 Mpc to 1 Gpc" heading | code-review | Mpc below 1,000 exactly, as the headings divide | fixed |
          | 5 | A stale comment said letting go leaves the view | code-review | Removed with the rewrite | fixed |
          | 6 | After a let-go click, a quick click on a new point was ignored | code-review | The second-click ignore is gone | fixed |
          | 7 | `useLocalState`'s setter changed identity each render | code-review | `useCallback` | fixed |
          | 8 | `storedDrawer`/`storeDrawer` were used only by tests | code-review, simplification, altitude | storedDrawer.ts is its hook alone; its tests drive the hook | fixed |
          | 9 | The one-caller `letGo()` helper, and `ChosenIds` | simplification | Inlined `returnToEarth()` into `selection.close` | fixed |
          | 10 | `OnChoose.letGo` asked and acted at once | simplification | `isChosen(found)` and `letGo()` apart | fixed |
          | 11 | The e2e let-go check was pasted four times, and the find box looked up five times | simplification | `expectEarthTheFocus`, and one `find` locator | fixed |
          | 12 | StructuresPanel.test.tsx tested only the record panel | simplification | Renamed StructureRecordPanel.test.tsx, with its trace paths | fixed |
          | 13 | A square swatch, a second dot glyph, a second distance format | reuse | `Swatch`, `Dot` (now exported, with `dotted`) and `shortDistance` for the ticks | fixed |
          | 14 | `KNOWN_WORDS` repeated `words()` | reuse | `words(known)` | fixed |
          | 15 | Gridlines recomputed `depthX` in every row | efficiency (optional) | Tick positions computed once | fixed |
          | 16 | `distanceText` could use `shortDistance` | reuse | Skipped: the approved criterion asks for whole Mpc, which `shortDistance` does not give | skipped |
          | 17 | Read clicks' count from the browser in `bindMouse` | altitude | Skipped: the deferred let-go (1) makes the second-click flag unnecessary without changing the input layer | skipped |
          | 18 | Move the camera moves into the selection | altitude | Skipped: a larger refactor outside this change | skipped |
          | 19 | `PAST_A_DOUBLE_CLICK_MS` repeats the app's window | reuse | Skipped: low cost; `DOUBLE_CLICK_MS` lives in a module e2e should not import | skipped |
          | 20 | The list does not add "(approximate)" to names as the view does | altitude | Skipped: the list names the structure, while "(approximate)" describes how its outline is drawn | skipped |
