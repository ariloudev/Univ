        by:
          host: claude-code
          session: "659efa7c-bd48-4781-a542-1417b043d536"
        prompt: "How should the new SQLite advisory (RUSTSEC-2026-0459) that fails the gate be handled?"
        header: "Advisory"
        context: "The gate's only failure is `deny`, on RUSTSEC-2026-0459 in the SQLite that `rusqlite` 0.32 bundles (univ-api dev, univ-ingest, xtask). It fails on develop too; this branch changes no Rust. The fix is `rusqlite` 0.41, which may change its API in places, and the toolchain is stable. These crates open only SQLite files they write themselves."
        options:
          - label: "Own branch first"
            detail: "Upgrade `rusqlite` to 0.41 on its own branch from develop (with its own Yard Log and gate), then bring develop into chore/ux-1 and run this branch's gate again. This keeps one intent per branch and fixes develop too. I recommend it."
            recommended: true
          - label: "Upgrade here"
            detail: "Upgrade `rusqlite` to 0.41 on chore/ux-1 itself. It's quicker, but it mixes a dependency upgrade into a UX branch."
          - label: "Ignore with reason"
            detail: "Add RUSTSEC-2026-0459 to deny.toml's ignore list, with the reason that only self-written SQLite files are opened, and upgrade later. Quickest, but it leaves a known flaw in the bundled SQLite."
    responses:
