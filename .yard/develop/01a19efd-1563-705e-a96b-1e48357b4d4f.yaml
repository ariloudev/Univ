        prompt: "There's no crate called `loft` at 2.3.0-alpha.3 on crates.io: `loft` is an unrelated scripting language, latest 0.0.1-alpha.22. The Loft tool is published as several crates that all have 2.3.0-alpha.3. Which one should univ-server depend on? (I'd pin it exactly with `=`, since a plain requirement would also accept 2.3.0-alpha.4.)"
        header: "Loft crate"
        options:
          - label: "loftspec"
            detail: "The Loft Specification Format library: document model, identity, canonical bytes, hashing. The usual choice if the server reads or writes Loft specs."
            recommended: true
          - label: "loft-cli"
            detail: "The crate the `loft` command comes from. It's built mainly as a binary, so it may not work as a library dependency."
          - label: "loftspec + loftspec-store"
            detail: "The format library plus the memory and file stores for Loft documents."
          - label: "No Cargo dependency"
            detail: "The loft 2.3.0-alpha.3 CLI is already installed and the plugin is pinned to it, so skip Cargo.toml."
