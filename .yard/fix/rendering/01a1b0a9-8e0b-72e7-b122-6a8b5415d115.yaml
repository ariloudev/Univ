                {
                  "change": "changed",
                  "key": "01a1a497-e843-728a-bce8-3ffb8e7533cb",
                  "kind": "product",
                  "label": "P-3",
                  "name": "Univ Explorer",
                  "words": {
                    "after": "Univ Explorer\n\nA web application that draws what Univ Server knows in three dimensions, around Earth, and lets\na person move through it with the mouse: from the nearest stars to the largest structures of\nthe universe.\n\nIt reads Univ Server's public API alone and draws only what a release placed, each point at the\nposition the release derived for it, each star in the colour of the temperature its colour\nindex gives and every other point in one colour, with the sources\ncredited as their terms require. Clicking a point reads its object; the structures are\ndrawn by their placed shapes.\n\nThe first version runs locally, beside Univ Server under `wrangler dev`. Flying with the\nkeyboard, editing layers, time and phones are outside it.",
                    "before": "Univ Explorer\n\nA web application that draws what Univ Server knows in three dimensions, around Earth, and lets\na person move through it with the mouse: from the nearest stars to the largest structures of\nthe universe.\n\nIt reads Univ Server's public API alone and draws only what a release placed, each point at the\nposition the release derived for it, each star in the colour of the temperature its colour\nindex gives and every other point by the kind of value of its distance, with the sources\ncredited as their terms require. Clicking a point reads its object; the structures are\ndrawn by their placed shapes.\n\nThe first version runs locally, beside Univ Server under `wrangler dev`. Flying with the\nkeyboard, editing layers, time and phones are outside it."
                  }
                },
                {
                  "change": "changed",
                  "key": "01a1a497-e843-728a-bce8-3ffe4657fb77",
                  "kind": "feature",
                  "label": "F-34",
                  "name": "Draw the catalogues",
                  "words": {
                    "after": "Draw the catalogues\n\nDrawing the placed objects of every scale domain around Earth, from the tiles of the release, at the detail the view needs. Each domain is an octree of tiles whose inner tiles hold a sample of the points under them, so a region gains detail as the children of its tiles are added. The view decides which tiles are held: those in view, refined until their points lie as close on screen as the view can show, within a budget of points, dropping first the tiles the view needs least. Each point is drawn by its rank against the share of its domain the view needs at its own distance, so that detail thins out smoothly with distance and no tile's edge shows, and tiles fade in and out. A switch turns level of detail off, so that every tile is fetched whatever the view.",
                    "before": "Draw the catalogues\n\nDrawing the placed objects of every scale domain around Earth, from the tiles of the release, at the detail the view needs. Each domain is an octree of tiles whose inner tiles hold a sample of the points under them, so a region gains detail as the children of its tiles are added. The view decides which tiles are held: those in view, refined until their points lie as close on screen as the view can show, within a budget of points, dropping first the tiles the view needs least."
                  }
                },
                {
                  "change": "changed",
                  "key": "01a1a689-0b25-768a-9f1e-cc267f67e3c1",
