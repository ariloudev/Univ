        revision: 8
        by:
          host: claude-code
          session: "0dff9621-d0e9-418a-9aee-e82062f9f784"
        title: "The owner's switch-off test"
        markdown: "With level of detail off the density varies smoothly and only the surveys' footprints show; with it on, rectangular patches unrelated to Earth appear: tile cube edges. Cause: the drawn share, and the fetch rule, were per tile (its own points and extent), so neighbouring cubes stepped in density."
        tone: info
