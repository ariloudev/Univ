                  "key": "01a19f1a-685d-7357-b67e-d65f1c690202",
                  "kind": "feature_group",
                  "label": "FG-6",
                  "name": "Reference data",
                  "parent": "01a19f1a-685d-7357-b67e-d65e20557892"
                },
                {
                  "change": "changed",
                  "key": "01a19f1e-d177-716d-b124-3d0d39dc9a3f",
                  "kind": "feature",
                  "label": "F-15",
                  "name": "Look up an object",
                  "parent": "01a19f1a-685d-7357-b67e-d65f1c690202"
                },
                {
                  "change": null,
                  "key": "01a19f1e-d177-716d-b124-3d23daf70123",
                  "kind": "feature",
                  "label": "F-16",
                  "name": "Read a source",
                  "parent": "01a19f1a-685d-7357-b67e-d65f1c690202"
                },
                {
                  "change": null,
                  "key": "01a19f1e-d177-716d-b124-3d24f2c252fc",
                  "kind": "requirement",
                  "label": "RQ-56",
                  "name": "When a client requests a source, Univ Server shall return its citation, terms of use, required credit, provider, query, cuts and coverage.",
                  "parent": "01a19f1e-d177-716d-b124-3d23daf70123"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-591121be3932",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response gives the source's redistribution status and whether its terms allow only non-commercial use.",
                  "parent": "01a19f1e-d177-716d-b124-3d24f2c252fc"
                },
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d6615e6965c1",
                  "kind": "feature_group",
                  "label": "FG-8",
                  "name": "Spatial and temporal queries",
                  "parent": "01a19f1a-685d-7357-b67e-d65e20557892"
                },
                {
                  "change": "changed",
                  "key": "01a19f1f-9fd7-7209-b7cb-5d0c87a2ef00",
                  "kind": "feature",
                  "label": "F-22",
                  "name": "Query a bounded volume",
                  "parent": "01a19f1a-685d-7357-b67e-d6615e6965c1"
                },
                {
                  "change": null,
                  "key": "01a19f1f-9fd7-7209-b7cb-5d14df84914b",
                  "kind": "requirement",
                  "label": "RQ-73",
                  "name": "Univ Server shall return at most 1,000 results per page and at most 10,000 results per bounded volume query.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5d0c87a2ef00"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-59122e92f2fd",
                  "kind": "criterion",
                  "label": null,
                  "name": "A page holds its results in the same order whichever object shards they come from.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5d14df84914b"
                },
                {
                  "change": "changed",
                  "key": "01a1a497-e843-728a-bce8-3ffb8e7533cb",
                  "kind": "product",
                  "label": "P-3",
                  "name": "Univ Explorer",
                  "parent": null
                },
                {
                  "change": null,
                  "key": "01a1a497-e843-728a-bce8-3ffc32e7ed9d",
                  "kind": "feature_group",
                  "label": "FG-12",
                  "name": "The view",
                  "parent": "01a1a497-e843-728a-bce8-3ffb8e7533cb"
                },
                {
                  "change": "changed",
                  "key": "01a1a497-e843-728a-bce8-3ffe4657fb77",
                  "kind": "feature",
                  "label": "F-34",
                  "name": "Draw the catalogues",
                  "parent": "01a1a497-e843-728a-bce8-3ffc32e7ed9d"
                },
                {
                  "change": null,
                  "key": "01a1a497-e843-728a-bce8-4003ade9ca4b",
                  "kind": "requirement",
                  "label": "RQ-119",
                  "name": "When the view changes, Univ Explorer shall fetch the tiles the view needs, those in view and the largest on screen first, within a budget of points.",
                  "parent": "01a1a497-e843-728a-bce8-3ffe4657fb77"
                },
                {
                  "change": "changed",
                  "key": "01a1a689-0b25-768a-9f1e-cc267f67e3c1",
                  "kind": "criterion",
                  "label": "AC-352",
                  "name": "A tile's children are fetched only while a typical tile of its level, with the mean points of the level's split tiles and the level's edge, would have its points farther apart on screen than 3 pixels at the distance of the tile's nearest points, so that a region far away or seen whole is not refined beyond what the screen shows, and regions at one distance are refined alike.",
                  "parent": "01a1a497-e843-728a-bce8-4003ade9ca4b"
                },
                {
                  "change": "added",
                  "key": "01a1aea7-5e8b-7623-8601-48fb7856d2e3",
                  "kind": "criterion",
                  "label": null,
                  "name": "A tile whose children are held keeps them while a typical tile of its level would have its points farther apart on screen than 2 pixels, so that a view moving a little about the 3 pixels that refine it does not drop the children it has just fetched.",
                  "parent": "01a1a497-e843-728a-bce8-4003ade9ca4b"
                },
                {
                  "change": "added",
                  "key": "01a1aea7-5e8b-7623-8601-48fc4cf3ff3f",
                  "kind": "criterion",
                  "label": null,
                  "name": "Where the budget cannot hold every family of tiles the view needs, a family that holds any of its tiles in view counts as half again its size on screen, so that a view moving a little does not trade it for a family of nearly its size.",
                  "parent": "01a1a497-e843-728a-bce8-4003ade9ca4b"
                },
                {
                  "change": "added",
                  "key": "01a1aea7-5e8b-7623-8601-48fd8492b9c4",
                  "kind": "criterion",
                  "label": null,
                  "name": "A view whose budget is full, turned by 0.1 degree and back again and again, drops and fetches no tile after its first turn.",
                  "parent": "01a1a497-e843-728a-bce8-4003ade9ca4b"
                },
                {
                  "change": "added",
                  "key": "01a1aead-1e30-7695-bbd5-099c2f301565",
                  "kind": "criterion",
                  "label": null,
                  "name": "A held tile counts as in view until it lies more than 1 degree outside the view, so that a view turning a little does not drop a tile at its edge and fetch it again as it turns back.",
                  "parent": "01a1a497-e843-728a-bce8-4003ade9ca4b"
                },
                {
                  "change": "changed",
                  "key": "01a1a497-e843-728a-bce8-4006f5c2ce8f",
                  "kind": "criterion",
                  "label": "AC-355",
                  "name": "While level of detail is on, no more than 6,000,000 points are held at once.",
                  "parent": "01a1a497-e843-728a-bce8-4003ade9ca4b"
                },
                {
                  "change": null,
                  "key": "01a1a689-0b25-768a-9f1e-cc27109fed3c",
                  "kind": "requirement",
                  "label": "RQ-120",
                  "name": "When a tile the view needs would take the points held beyond the budget, Univ Explorer shall drop the held tiles the view needs least until the tile fits.",
                  "parent": "01a1a497-e843-728a-bce8-3ffe4657fb77"
                },
                {
                  "change": "added",
                  "key": "01a1aeb6-f18d-7787-9cbd-de2cfdcfe714",
                  "kind": "criterion",
                  "label": null,
                  "name": "A dropped tile stays drawn, its points counted and its sources credited, until no tile is on its way, so that a moving view shows no region emptier while its new tiles arrive.",
                  "parent": "01a1a689-0b25-768a-9f1e-cc27109fed3c"
                },
                {
                  "change": "added",
                  "key": "01a1aeb6-f18d-7787-9cbd-de2dfa8b12aa",
                  "kind": "criterion",
                  "label": null,
                  "name": "The dropped tiles kept drawn hold no more than a quarter of the budget, 1,500,000 points, beyond it, and those beyond it are drawn no more at once.",
                  "parent": "01a1a689-0b25-768a-9f1e-cc27109fed3c"
                },
                {
                  "change": "added",
                  "key": "01a1aeb6-f18d-7787-9cbd-de2e11b3bd4b",
                  "kind": "criterion",
                  "label": null,
                  "name": "A dropped tile still drawn that the view wants again is drawn on without being read again.",
                  "parent": "01a1a689-0b25-768a-9f1e-cc27109fed3c"
                },
                {
                  "change": "added",
                  "key": "01a1b07b-8157-7546-927e-272151c4d940",
                  "kind": "requirement",
                  "label": null,
                  "name": "While the person has turned level of detail off, Univ Explorer shall fetch every tile of the release, the coarser levels first, whatever the view, and drop none.",
                  "parent": "01a1a497-e843-728a-bce8-3ffe4657fb77"
                },
                {
                  "change": "added",
                  "key": "01a1b07b-8157-7546-927e-2722e634b9b0",
                  "kind": "criterion",
                  "label": null,
                  "name": "The top bar holds a switch that turns level of detail on and off, on when the page's address does not turn it off.",
                  "parent": "01a1b07b-8157-7546-927e-272151c4d940"
                },
                {
                  "change": "added",
                  "key": "01a1b07b-8157-7546-927e-272335750e5f",
                  "kind": "criterion",
                  "label": null,
                  "name": "With level of detail off, every tile of every scale domain is fetched, the tiles of each level asked for before those of the level below, and no tile is dropped, whatever the view and the budget.",
                  "parent": "01a1b07b-8157-7546-927e-272151c4d940"
                },
                {
                  "change": "added",
                  "key": "01a1b07b-8157-7546-927e-2724ac33dc33",
                  "kind": "criterion",
                  "label": null,
                  "name": "Turned on again, level of detail drops the tiles the view does not need until the points held fit the budget.",
                  "parent": "01a1b07b-8157-7546-927e-272151c4d940"
                },
                {
                  "change": "added",
                  "key": "01a1b07b-8157-7546-927e-2725108d8df2",
                  "kind": "criterion",
                  "label": null,
                  "name": "The page's address keeps level of detail turned off, so that a reload or a shared link keeps it off.",
                  "parent": "01a1b07b-8157-7546-927e-272151c4d940"
                },
                {
                  "change": "added",
                  "key": "01a1b093-647d-7308-9b46-bdc985f6f0e9",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Explorer shall draw each point of a held tile while its rank lies below the share of its domain the view needs at the point's own distance, and fade each tile in as it arrives and out as it goes.",
                  "parent": "01a1a497-e843-728a-bce8-3ffe4657fb77"
                },
                {
                  "change": "added",
                  "key": "01a1b093-647d-7308-9b46-bdca66fcbd08",
                  "kind": "criterion",
                  "label": null,
                  "name": "The share of a domain the view needs at a distance rises, level by level below the root, from the share the levels above hold to the share the level adds, in proportion as a typical tile of the level above would have its points from 3 to 6 pixels apart on screen at that distance.",
                  "parent": "01a1b093-647d-7308-9b46-bdc985f6f0e9"
                },
                {
                  "change": "added",
                  "key": "01a1b0a9-6982-71c6-b321-0cfc1d1f8a93",
                  "kind": "criterion",
                  "label": null,
                  "name": "A point's rank lies in its tile's slice of its domain, from the share the levels above the tile's hold to the share its level adds, or to all for a leaf, the tile's points dividing the slice evenly in their shuffled order.",
                  "parent": "01a1b093-647d-7308-9b46-bdc985f6f0e9"
                },
                {
                  "change": "added",
                  "key": "01a1b0a9-6982-71c6-b321-0cfd3507cc88",
                  "kind": "criterion",
                  "label": null,
                  "name": "Points at one distance are drawn at one share of their domain whichever tiles hold them, so that where the tiles the view needs are held no tile's cube shows as an edge.",
                  "parent": "01a1b093-647d-7308-9b46-bdc985f6f0e9"
                },
                {
                  "change": "added",
                  "key": "01a1b093-81da-759e-8532-70d7aa4d0ff1",
                  "kind": "criterion",
                  "label": null,
                  "name": "Every point of a root tile is drawn.",
                  "parent": "01a1b093-647d-7308-9b46-bdc985f6f0e9"
                },
                {
                  "change": "added",
                  "key": "01a1b093-647d-7308-9b46-bdcbf842c1af",
                  "kind": "criterion",
                  "label": null,
                  "name": "The share drawn is the first points of the tile in an order shuffled by the tile's id, so that every share is an even sample of its points, the same on every read.",
                  "parent": "01a1b093-647d-7308-9b46-bdc985f6f0e9"
                },
                {
                  "change": "added",
                  "key": "01a1b093-647d-7308-9b46-bdcc1ec02df7",
                  "kind": "criterion",
                  "label": null,
                  "name": "A tile fades in over 0.3 seconds once its points arrive, and out over 0.3 seconds before they are drawn no more.",
                  "parent": "01a1b093-647d-7308-9b46-bdc985f6f0e9"
                },
                {
                  "change": "added",
                  "key": "01a1b093-647d-7308-9b46-bdcd4901ec3c",
                  "kind": "criterion",
                  "label": null,
                  "name": "With level of detail off, every point of every held tile is drawn.",
                  "parent": "01a1b093-647d-7308-9b46-bdc985f6f0e9"
                },
                {
                  "change": "added",
                  "key": "01a1b0b8-3632-76bc-88e5-8dd265a1a28d",
                  "kind": "criterion",
                  "label": null,
                  "name": "With level of detail on, points are drawn as opaque whatever the eye's distance from the focus, since they crowd no more as it withdraws.",
                  "parent": "01a1b093-647d-7308-9b46-bdc985f6f0e9"
                },
                {
                  "change": "added",
                  "key": "01a1b0b8-5967-707c-ba41-c9e3bc5755a6",
                  "kind": "criterion",
                  "label": null,
                  "name": "With level of detail off, points grow fainter as the eye withdraws beyond 1 gigaparsec, so that a whole catalogue seen from afar adds up to its shape rather than to white.",
                  "parent": "01a1b093-647d-7308-9b46-bdc985f6f0e9"
                },
                {
                  "change": "added",
                  "key": "01a1b093-647d-7308-9b46-bdce5099b2f5",
                  "kind": "criterion",
                  "label": null,
                  "name": "Only the points drawn can be pointed at or clicked.",
                  "parent": "01a1b093-647d-7308-9b46-bdc985f6f0e9"
                },
                {
                  "change": "changed",
                  "key": "01a1a497-e843-728a-bce8-400ade54e0e1",
                  "kind": "requirement",
                  "label": "RQ-123",
                  "name": "Univ Explorer shall draw every point outside the stars domain in one colour and count in the key the points drawn of each kind of value of distance.",
                  "parent": "01a1a497-e843-728a-bce8-3ffe4657fb77"
                },
                {
                  "change": "changed",
                  "key": "01a1a497-e843-728a-bce8-400b9b581384",
                  "kind": "criterion",
                  "label": "AC-362",
                  "name": "Points outside the stars domain are drawn in one colour, whatever the kind of value of their distance.",
                  "parent": "01a1a497-e843-728a-bce8-400ade54e0e1"
                },
                {
                  "change": "changed",
                  "key": "01a1a497-e843-728a-bce8-400c71ad8ebe",
                  "kind": "criterion",
                  "label": "AC-363",
                  "name": "The key shows that colour and counts the points of the tiles held of each kind of value: measured, estimated, inferred and reconstructed.",
                  "parent": "01a1a497-e843-728a-bce8-400ade54e0e1"
                },
                {
                  "change": null,
                  "key": "01a19f1e-d177-716d-b124-3ce12c3a03b8",
