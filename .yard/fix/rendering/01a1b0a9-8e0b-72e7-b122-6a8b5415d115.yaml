              "nodes": [
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d658085bf5c8",
                  "kind": "product",
                  "label": "P-1",
                  "name": "Univ Ingest",
                  "parent": null
                },
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d6593dd0cb35",
                  "kind": "feature_group",
                  "label": "FG-1",
                  "name": "Acquisition",
                  "parent": "01a19f1a-685d-7357-b67e-d658085bf5c8"
                },
                {
                  "change": null,
                  "key": "01a19f22-2ad9-716e-876f-1831f423e25f",
                  "kind": "feature",
                  "label": "F-1",
                  "name": "Define a source",
                  "parent": "01a19f1a-685d-7357-b67e-d6593dd0cb35"
                },
                {
                  "change": null,
                  "key": "01a19f22-2ad9-716e-876f-183a6daa9364",
                  "kind": "requirement",
                  "label": "RQ-3",
                  "name": "Univ Ingest shall record in each source definition whether its terms permit redistributing its data, with the terms it rests on.",
                  "parent": "01a19f22-2ad9-716e-876f-1831f423e25f"
                },
                {
                  "change": "changed",
                  "key": "01a19f22-2ad9-716e-876f-183b90085a10",
                  "kind": "criterion",
                  "label": "AC-7",
                  "name": "The redistribution status is permitted, permitted with credit, permission pending, or forbidden.",
                  "parent": "01a19f22-2ad9-716e-876f-183a6daa9364"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-58fcaa8b8bee",
                  "kind": "criterion",
                  "label": null,
                  "name": "A source whose status is permission pending names whom permission is asked of, and the date it was asked once the request is sent.",
                  "parent": "01a19f22-2ad9-716e-876f-183a6daa9364"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-58fd8e368264",
                  "kind": "criterion",
                  "label": null,
                  "name": "A source whose terms allow only non-commercial use is marked non-commercial, with the clause that says so quoted.",
                  "parent": "01a19f22-2ad9-716e-876f-183a6daa9364"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-58fec7b6f3d1",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall provide a source definition for each source that release 10 adds.",
                  "parent": "01a19f22-2ad9-716e-876f-1831f423e25f"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-58ff5749b30b",
                  "kind": "criterion",
                  "label": null,
                  "name": "The spectroscopic sources are DESI DR1 redshifts, SDSS DR17 distant galaxies and quasars, 2dFGRS and GAMA DR4 redshifts.",
                  "parent": "01a1a931-2c8a-73a8-91f2-58fec7b6f3d1"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-5900bff82962",
                  "kind": "criterion",
                  "label": null,
                  "name": "The 21 cm source is ALFALFA α.100.",
                  "parent": "01a1a931-2c8a-73a8-91f2-58fec7b6f3d1"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-59016fa68370",
                  "kind": "criterion",
                  "label": null,
                  "name": "The photometric redshift sources are 2MPZ and WISE × SuperCOSMOS photometric redshifts.",
                  "parent": "01a1a931-2c8a-73a8-91f2-58fec7b6f3d1"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-5902c9bf1383",
                  "kind": "criterion",
                  "label": null,
                  "name": "The quasars of DESI DR1 and SDSS DR17 are taken beside their galaxies.",
                  "parent": "01a1a931-2c8a-73a8-91f2-58fec7b6f3d1"
                },
                {
                  "change": null,
                  "key": "01a19f22-2ad9-716e-876f-18443b0ddcd6",
                  "kind": "feature",
                  "label": "F-2",
                  "name": "Fetch a source durably",
                  "parent": "01a19f1a-685d-7357-b67e-d6593dd0cb35"
                },
                {
                  "change": "added",
                  "key": "01a1ad9c-dc22-72c6-99cb-1a44aeb16de5",
                  "kind": "requirement",
                  "label": null,
                  "name": "Where a source's provider serves it only through an interface that Univ Ingest cannot page, such as a form that cancels long answers, Univ Ingest shall read the source from a prepared file in its download cache, made by a script kept in the repository, after checking the file against its definition.",
                  "parent": "01a19f22-2ad9-716e-876f-18443b0ddcd6"
                },
                {
                  "change": "added",
                  "key": "01a1ad9c-dc22-72c6-99cb-1a45af5083ab",
                  "kind": "criterion",
                  "label": null,
                  "name": "The source definition names the script that prepared the file, the file, its SHA-256 and its row count.",
                  "parent": "01a1ad9c-dc22-72c6-99cb-1a44aeb16de5"
                },
                {
                  "change": "added",
                  "key": "01a1ad9c-dc22-72c6-99cb-1a46049c41ff",
                  "kind": "criterion",
                  "label": null,
                  "name": "A prepared file whose SHA-256 or row count differs from its definition's is refused, naming the file, the value expected and the value found.",
                  "parent": "01a1ad9c-dc22-72c6-99cb-1a44aeb16de5"
                },
                {
                  "change": "added",
                  "key": "01a1ad9c-dc22-72c6-99cb-1a470d130dde",
                  "kind": "criterion",
                  "label": null,
                  "name": "Univ Ingest makes no request for a prepared source.",
                  "parent": "01a1ad9c-dc22-72c6-99cb-1a44aeb16de5"
                },
                {
                  "change": "added",
                  "key": "01a1ad9c-f735-761b-8646-f276559d7943",
                  "kind": "criterion",
                  "label": null,
                  "name": "A prepared file missing from the cache fails its source, naming the script that prepares it.",
                  "parent": "01a1ad9c-dc22-72c6-99cb-1a44aeb16de5"
                },
                {
                  "change": "added",
                  "key": "01a1ad9c-dc22-72c6-99cb-1a4853c15f56",
                  "kind": "criterion",
                  "label": null,
                  "name": "The source's provenance lists the prepared file with its digest and the script that made it.",
                  "parent": "01a1ad9c-dc22-72c6-99cb-1a44aeb16de5"
                },
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d65aba28b58f",
                  "kind": "feature_group",
                  "label": "FG-2",
                  "name": "Normalization",
                  "parent": "01a19f1a-685d-7357-b67e-d658085bf5c8"
                },
                {
                  "change": null,
                  "key": "01a19f22-2ad9-716e-876f-186219f4e104",
                  "kind": "feature",
                  "label": "F-4",
                  "name": "Normalize records",
                  "parent": "01a19f1a-685d-7357-b67e-d65aba28b58f"
                },
                {
                  "change": null,
                  "key": "01a19f22-2ad9-716e-876f-18637db5e446",
                  "kind": "requirement",
                  "label": "RQ-15",
                  "name": "Univ Ingest shall convert each catalogue entry into univ-model values while keeping each native value.",
                  "parent": "01a19f22-2ad9-716e-876f-186219f4e104"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-59032696dddd",
                  "kind": "criterion",
                  "label": null,
                  "name": "An uncertainty a source states once for its whole catalogue, such as 2dFGRS's rms of 85 km/s or 2MPZ's photometric redshift scatter of 0.015, is given to each of its values as an estimated uncertainty that cites where it is stated.",
                  "parent": "01a19f22-2ad9-716e-876f-18637db5e446"
                },
                {
                  "change": "added",
                  "key": "01a1aa2d-9931-7550-bba8-ae02a06fd78a",
                  "kind": "criterion",
                  "label": null,
                  "name": "A redshift error that a source defines as a multiple of another column, such as ALFALFA's half the error on the HI line's width, is that column's value times the stated factor.",
                  "parent": "01a19f22-2ad9-716e-876f-18637db5e446"
                },
                {
                  "change": "added",
                  "key": "01a1aa2d-9931-7550-bba8-ae03b8e720b0",
                  "kind": "criterion",
                  "label": null,
                  "name": "A source read from files reads FITS binary tables or gzipped CSV tables, the latter in pieces of whole lines, so that no file is held unpacked whole.",
                  "parent": "01a19f22-2ad9-716e-876f-18637db5e446"
                },
                {
                  "change": null,
                  "key": "01a19f22-2ad9-716e-876f-186f83aad488",
                  "kind": "requirement",
                  "label": "RQ-17",
                  "name": "Univ Ingest shall keep each redshift in the frame its source published it in and derive its value in the CMB frame.",
                  "parent": "01a19f22-2ad9-716e-876f-186219f4e104"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-59042cfff012",
                  "kind": "criterion",
                  "label": null,
                  "name": "A barycentric redshift, such as DESI's, is kept as measured and named barycentric, never relabelled heliocentric.",
                  "parent": "01a19f22-2ad9-716e-876f-186f83aad488"
                },
                {
                  "change": "added",
                  "key": "01a1aa2d-9931-7550-bba8-ae0461c674ae",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall leave out the rows that a source definition's rules select out, as a query's WHERE clause would for a source read whole from a file, and count them.",
                  "parent": "01a19f22-2ad9-716e-876f-186219f4e104"
                },
                {
                  "change": "added",
                  "key": "01a1aa2d-9931-7550-bba8-ae05fcc0d255",
                  "kind": "criterion",
                  "label": null,
                  "name": "A rule's condition tests one column with exactly one of: the cell is one of a list of values, none of a list of values, or a number below a bound.",
                  "parent": "01a1aa2d-9931-7550-bba8-ae0461c674ae"
                },
                {
                  "change": "added",
                  "key": "01a1aa2d-9931-7550-bba8-ae06fd8a5b30",
                  "kind": "criterion",
                  "label": null,
                  "name": "A row a rule selects out of the source, such as another survey's redshift that GAMA re-serves or a star in a galaxy survey, is counted under the reason `outside_selection`, and the rule's basis says why.",
                  "parent": "01a1aa2d-9931-7550-bba8-ae0461c674ae"
                },
                {
                  "change": "added",
                  "key": "01a1aa2d-9931-7550-bba8-ae077f98b2cc",
                  "kind": "criterion",
                  "label": null,
                  "name": "A cell too large for a double to hold exactly, such as an SDSS specObjID, is compared with a condition's values as text.",
                  "parent": "01a1aa2d-9931-7550-bba8-ae0461c674ae"
                },
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d65bef1ca65c",
                  "kind": "feature_group",
                  "label": "FG-3",
                  "name": "Identity",
                  "parent": "01a19f1a-685d-7357-b67e-d658085bf5c8"
                },
                {
                  "change": null,
                  "key": "01a19f23-636e-7035-8185-ab97eb9c2fb9",
                  "kind": "feature",
                  "label": "F-6",
                  "name": "Choose the preferred measurement",
                  "parent": "01a19f1a-685d-7357-b67e-d65bef1ca65c"
                },
                {
                  "change": null,
                  "key": "01a19f23-636e-7035-8185-ab9dfac6edfe",
                  "kind": "requirement",
                  "label": "RQ-25",
                  "name": "Univ Ingest shall take an object's sky position from its catalogue entry with the smallest position uncertainty.",
                  "parent": "01a19f23-636e-7035-8185-ab97eb9c2fb9"
                },
                {
                  "change": "added",
                  "key": "01a1adfa-315f-708f-8cd8-bf4bc1cdc275",
                  "kind": "criterion",
                  "label": null,
                  "name": "An object that holds pieces of a nearby galaxy takes the position of the galaxy whose extent took them, never a piece's.",
                  "parent": "01a19f23-636e-7035-8185-ab9dfac6edfe"
                },
                {
                  "change": "added",
                  "key": "01a1adfa-315f-708f-8cd8-bf4cdd697c86",
                  "kind": "criterion",
                  "label": null,
                  "name": "Among positions without a published uncertainty, a position from a 21 cm survey's beam ranks after an optical or infrared survey's.",
                  "parent": "01a19f23-636e-7035-8185-ab9dfac6edfe"
                },
                {
                  "change": null,
                  "key": "01a19f23-636e-7035-8185-aba1fc8f7bbd",
                  "kind": "feature",
                  "label": "F-7",
                  "name": "Cross-match catalogues",
                  "parent": "01a19f1a-685d-7357-b67e-d65bef1ca65c"
                },
                {
                  "change": "added",
                  "key": "01a1adfa-315f-708f-8cd8-bf4d9f766f81",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall join as pieces of one galaxy the fibres of one fibre survey that lie together in the nearby volume at one velocity, where no source of the release publishes the galaxy's extent.",
                  "parent": "01a19f23-636e-7035-8185-aba1fc8f7bbd"
                },
                {
                  "change": "added",
                  "key": "01a1adfa-315f-708f-8cd8-bf4e61ca16c8",
                  "kind": "criterion",
                  "label": null,
                  "name": "Fibres of one survey join below the matching rules' velocity of the nearby volume, each within their angle and velocity tolerance of every fibre already joined.",
                  "parent": "01a1adfa-315f-708f-8cd8-bf4d9f766f81"
                },
                {
                  "change": "added",
                  "key": "01a1adfa-315f-708f-8cd8-bf4fa228b618",
                  "kind": "criterion",
                  "label": null,
                  "name": "The fibre surveys whose fibres may join are those the matching rules list.",
                  "parent": "01a1adfa-315f-708f-8cd8-bf4d9f766f81"
                },
                {
                  "change": "added",
                  "key": "01a1adfa-315f-708f-8cd8-bf5086a0f213",
                  "kind": "criterion",
                  "label": null,
                  "name": "Two groups that each hold an entry of a source naming its own galaxy are never joined as one galaxy.",
                  "parent": "01a1adfa-315f-708f-8cd8-bf4d9f766f81"
                },
                {
                  "change": "added",
                  "key": "01a1ae91-90f5-716e-b3d3-07b944951329",
                  "kind": "criterion",
                  "label": null,
                  "name": "Two groups that each hold an entry of one source other than a fibre survey, such as two ALFALFA detections, are never joined as one galaxy.",
                  "parent": "01a1adfa-315f-708f-8cd8-bf4d9f766f81"
                },
                {
                  "change": "added",
                  "key": "01a1adfa-315f-708f-8cd8-bf51d418d386",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each joined fibre records the rule as its method, its separation and its velocity difference.",
                  "parent": "01a1adfa-315f-708f-8cd8-bf4d9f766f81"
                },
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d65c50ba74e7",
                  "kind": "feature_group",
                  "label": "FG-4",
                  "name": "Releases",
                  "parent": "01a19f1a-685d-7357-b67e-d658085bf5c8"
                },
                {
                  "change": null,
                  "key": "01a19f23-636f-72bd-b194-151d9fb569d2",
                  "kind": "feature",
                  "label": "F-9",
                  "name": "Build a release",
                  "parent": "01a19f1a-685d-7357-b67e-d65c50ba74e7"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-59053781d70f",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Ingest shall divide a release's objects among object shards, each a D1 database, by the cell of the cell index that holds each object.",
                  "parent": "01a19f23-636f-72bd-b194-151d9fb569d2"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-590689bd8862",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each object is in exactly one object shard, with its catalogue entries, measurements, designations and cell.",
                  "parent": "01a1a931-2c8a-73a8-91f2-59053781d70f"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-59076b96877f",
                  "kind": "criterion",
                  "label": null,
                  "name": "All the objects of one cell of the cell index are in one object shard.",
                  "parent": "01a1a931-2c8a-73a8-91f2-59053781d70f"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-5908e94d50c7",
                  "kind": "criterion",
                  "label": null,
                  "name": "An object that is not placed is assigned to an object shard by its object id.",
                  "parent": "01a1a931-2c8a-73a8-91f2-59053781d70f"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-59092cd5e331",
                  "kind": "criterion",
                  "label": null,
                  "name": "The catalogue database holds the release's sources, terms, structures and grids, and the object shard of every object id.",
                  "parent": "01a1a931-2c8a-73a8-91f2-59053781d70f"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-590a9d7b0864",
                  "kind": "criterion",
                  "label": null,
                  "name": "The release manifest names each object shard with the cells it holds and its estimated size.",
                  "parent": "01a1a931-2c8a-73a8-91f2-59053781d70f"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-590b8ae658df",
                  "kind": "requirement",
                  "label": null,
                  "name": "If the objects of one cell would exceed an object shard's budget, then Univ Ingest shall refuse the build and name the cell, its object count and its estimated size.",
                  "parent": "01a19f23-636f-72bd-b194-151d9fb569d2"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-590cebe0fc8d",
                  "kind": "criterion",
                  "label": null,
                  "name": "No release number is used up by the refused build.",
                  "parent": "01a1a931-2c8a-73a8-91f2-590b8ae658df"
                },
                {
                  "change": null,
                  "key": "01a19f23-636f-72bd-b194-15372421c144",
                  "kind": "feature",
                  "label": "F-11",
                  "name": "Prune old releases",
                  "parent": "01a19f1a-685d-7357-b67e-d65c50ba74e7"
                },
                {
                  "change": null,
                  "key": "01a19f23-636f-72bd-b194-1538be54b520",
                  "kind": "requirement",
                  "label": "RQ-39",
                  "name": "When the owner prunes a release, Univ Ingest shall delete the release's files and tables and record when it was pruned.",
                  "parent": "01a19f23-636f-72bd-b194-15372421c144"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-590d7b43ba10",
                  "kind": "criterion",
                  "label": null,
                  "name": "The release's rows are deleted from the catalogue database and from every object shard.",
                  "parent": "01a19f23-636f-72bd-b194-1538be54b520"
                },
                {
                  "change": null,
                  "key": "01a19f23-636f-72bd-b194-153d515c188e",
                  "kind": "feature",
                  "label": "F-12",
                  "name": "Publish a release locally",
                  "parent": "01a19f1a-685d-7357-b67e-d65c50ba74e7"
                },
                {
                  "change": "changed",
                  "key": "01a19f23-636f-72bd-b194-153ee5a17619",
                  "kind": "requirement",
                  "label": "RQ-41",
                  "name": "When the owner publishes a complete release, Univ Ingest shall upload its files to local R2 and its tables to the catalogue database and object shards of local D1, and only then point latest at it.",
                  "parent": "01a19f23-636f-72bd-b194-153d515c188e"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-590ede3fd3b1",
                  "kind": "criterion",
                  "label": null,
                  "name": "Each object shard receives only the rows the release manifest assigns to it.",
                  "parent": "01a19f23-636f-72bd-b194-153ee5a17619"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-590fd0e5d484",
                  "kind": "requirement",
                  "label": null,
                  "name": "If the release needs more object shards than Univ Server binds, then Univ Ingest shall refuse to publish it before uploading anything.",
                  "parent": "01a19f23-636f-72bd-b194-153d515c188e"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-5910680f6e67",
                  "kind": "criterion",
                  "label": null,
                  "name": "The message names the number of object shards the release needs and the number Univ Server binds.",
                  "parent": "01a1a931-2c8a-73a8-91f2-590fd0e5d484"
                },
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d65e20557892",
                  "kind": "product",
                  "label": "P-2",
                  "name": "Univ Server",
                  "parent": null
                },
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d65f1c690202",
                  "kind": "feature_group",
                  "label": "FG-6",
                  "name": "Reference data",
                  "parent": "01a19f1a-685d-7357-b67e-d65e20557892"
                },
                {
                  "change": "changed",
                  "key": "01a19f1e-d177-716d-b124-3d0d39dc9a3f",
                  "kind": "feature",
                  "label": "F-15",
                  "name": "Look up an object",
                  "parent": "01a19f1a-685d-7357-b67e-d65f1c690202"
                },
                {
                  "change": null,
                  "key": "01a19f1e-d177-716d-b124-3d23daf70123",
                  "kind": "feature",
                  "label": "F-16",
                  "name": "Read a source",
                  "parent": "01a19f1a-685d-7357-b67e-d65f1c690202"
                },
                {
                  "change": null,
                  "key": "01a19f1e-d177-716d-b124-3d24f2c252fc",
                  "kind": "requirement",
                  "label": "RQ-56",
                  "name": "When a client requests a source, Univ Server shall return its citation, terms of use, required credit, provider, query, cuts and coverage.",
                  "parent": "01a19f1e-d177-716d-b124-3d23daf70123"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-591121be3932",
                  "kind": "criterion",
                  "label": null,
                  "name": "The response gives the source's redistribution status and whether its terms allow only non-commercial use.",
                  "parent": "01a19f1e-d177-716d-b124-3d24f2c252fc"
                },
                {
                  "change": null,
                  "key": "01a19f1a-685d-7357-b67e-d6615e6965c1",
                  "kind": "feature_group",
                  "label": "FG-8",
                  "name": "Spatial and temporal queries",
                  "parent": "01a19f1a-685d-7357-b67e-d65e20557892"
                },
                {
                  "change": "changed",
                  "key": "01a19f1f-9fd7-7209-b7cb-5d0c87a2ef00",
                  "kind": "feature",
                  "label": "F-22",
                  "name": "Query a bounded volume",
                  "parent": "01a19f1a-685d-7357-b67e-d6615e6965c1"
                },
                {
                  "change": null,
                  "key": "01a19f1f-9fd7-7209-b7cb-5d14df84914b",
                  "kind": "requirement",
                  "label": "RQ-73",
                  "name": "Univ Server shall return at most 1,000 results per page and at most 10,000 results per bounded volume query.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5d0c87a2ef00"
                },
                {
                  "change": "added",
                  "key": "01a1a931-2c8a-73a8-91f2-59122e92f2fd",
                  "kind": "criterion",
                  "label": null,
                  "name": "A page holds its results in the same order whichever object shards they come from.",
                  "parent": "01a19f1f-9fd7-7209-b7cb-5d14df84914b"
                },
                {
                  "change": "changed",
                  "key": "01a1a497-e843-728a-bce8-3ffb8e7533cb",
                  "kind": "product",
                  "label": "P-3",
                  "name": "Univ Explorer",
                  "parent": null
                },
                {
                  "change": null,
                  "key": "01a1a497-e843-728a-bce8-3ffc32e7ed9d",
                  "kind": "feature_group",
                  "label": "FG-12",
                  "name": "The view",
                  "parent": "01a1a497-e843-728a-bce8-3ffb8e7533cb"
                },
                {
                  "change": "changed",
                  "key": "01a1a497-e843-728a-bce8-3ffe4657fb77",
                  "kind": "feature",
                  "label": "F-34",
                  "name": "Draw the catalogues",
                  "parent": "01a1a497-e843-728a-bce8-3ffc32e7ed9d"
                },
                {
                  "change": null,
                  "key": "01a1a497-e843-728a-bce8-4003ade9ca4b",
                  "kind": "requirement",
                  "label": "RQ-119",
                  "name": "When the view changes, Univ Explorer shall fetch the tiles the view needs, those in view and the largest on screen first, within a budget of points.",
                  "parent": "01a1a497-e843-728a-bce8-3ffe4657fb77"
                },
                {
                  "change": "changed",
                  "key": "01a1a689-0b25-768a-9f1e-cc267f67e3c1",
                  "kind": "criterion",
                  "label": "AC-352",
                  "name": "A tile's children are fetched only while a typical tile of its level, with the mean points of the level's split tiles and the level's edge, would have its points farther apart on screen than 3 pixels at the distance of the tile's nearest points, so that a region far away or seen whole is not refined beyond what the screen shows, and regions at one distance are refined alike.",
                  "parent": "01a1a497-e843-728a-bce8-4003ade9ca4b"
                },
                {
                  "change": "added",
                  "key": "01a1aea7-5e8b-7623-8601-48fb7856d2e3",
                  "kind": "criterion",
                  "label": null,
                  "name": "A tile whose children are held keeps them while a typical tile of its level would have its points farther apart on screen than 2 pixels, so that a view moving a little about the 3 pixels that refine it does not drop the children it has just fetched.",
                  "parent": "01a1a497-e843-728a-bce8-4003ade9ca4b"
                },
                {
                  "change": "added",
                  "key": "01a1aea7-5e8b-7623-8601-48fc4cf3ff3f",
                  "kind": "criterion",
                  "label": null,
                  "name": "Where the budget cannot hold every family of tiles the view needs, a family that holds any of its tiles in view counts as half again its size on screen, so that a view moving a little does not trade it for a family of nearly its size.",
                  "parent": "01a1a497-e843-728a-bce8-4003ade9ca4b"
                },
                {
                  "change": "added",
                  "key": "01a1aea7-5e8b-7623-8601-48fd8492b9c4",
                  "kind": "criterion",
                  "label": null,
                  "name": "A view whose budget is full, turned by 0.1 degree and back again and again, drops and fetches no tile after its first turn.",
                  "parent": "01a1a497-e843-728a-bce8-4003ade9ca4b"
                },
                {
                  "change": "added",
                  "key": "01a1aead-1e30-7695-bbd5-099c2f301565",
                  "kind": "criterion",
                  "label": null,
                  "name": "A held tile counts as in view until it lies more than 1 degree outside the view, so that a view turning a little does not drop a tile at its edge and fetch it again as it turns back.",
                  "parent": "01a1a497-e843-728a-bce8-4003ade9ca4b"
                },
                {
                  "change": "changed",
                  "key": "01a1a497-e843-728a-bce8-4006f5c2ce8f",
                  "kind": "criterion",
                  "label": "AC-355",
                  "name": "While level of detail is on, no more than 6,000,000 points are held at once.",
                  "parent": "01a1a497-e843-728a-bce8-4003ade9ca4b"
                },
                {
                  "change": null,
                  "key": "01a1a689-0b25-768a-9f1e-cc27109fed3c",
                  "kind": "requirement",
                  "label": "RQ-120",
                  "name": "When a tile the view needs would take the points held beyond the budget, Univ Explorer shall drop the held tiles the view needs least until the tile fits.",
                  "parent": "01a1a497-e843-728a-bce8-3ffe4657fb77"
                },
                {
                  "change": "added",
                  "key": "01a1aeb6-f18d-7787-9cbd-de2cfdcfe714",
                  "kind": "criterion",
                  "label": null,
                  "name": "A dropped tile stays drawn, its points counted and its sources credited, until no tile is on its way, so that a moving view shows no region emptier while its new tiles arrive.",
                  "parent": "01a1a689-0b25-768a-9f1e-cc27109fed3c"
                },
                {
                  "change": "added",
                  "key": "01a1aeb6-f18d-7787-9cbd-de2dfa8b12aa",
                  "kind": "criterion",
                  "label": null,
                  "name": "The dropped tiles kept drawn hold no more than a quarter of the budget, 1,500,000 points, beyond it, and those beyond it are drawn no more at once.",
                  "parent": "01a1a689-0b25-768a-9f1e-cc27109fed3c"
                },
                {
                  "change": "added",
                  "key": "01a1aeb6-f18d-7787-9cbd-de2e11b3bd4b",
                  "kind": "criterion",
                  "label": null,
                  "name": "A dropped tile still drawn that the view wants again is drawn on without being read again.",
                  "parent": "01a1a689-0b25-768a-9f1e-cc27109fed3c"
                },
                {
                  "change": "added",
                  "key": "01a1b07b-8157-7546-927e-272151c4d940",
                  "kind": "requirement",
                  "label": null,
                  "name": "While the person has turned level of detail off, Univ Explorer shall fetch every tile of the release, the coarser levels first, whatever the view, and drop none.",
                  "parent": "01a1a497-e843-728a-bce8-3ffe4657fb77"
                },
                {
                  "change": "added",
                  "key": "01a1b07b-8157-7546-927e-2722e634b9b0",
                  "kind": "criterion",
                  "label": null,
                  "name": "The top bar holds a switch that turns level of detail on and off, on when the page's address does not turn it off.",
                  "parent": "01a1b07b-8157-7546-927e-272151c4d940"
                },
                {
                  "change": "added",
                  "key": "01a1b07b-8157-7546-927e-272335750e5f",
                  "kind": "criterion",
                  "label": null,
                  "name": "With level of detail off, every tile of every scale domain is fetched, the tiles of each level asked for before those of the level below, and no tile is dropped, whatever the view and the budget.",
                  "parent": "01a1b07b-8157-7546-927e-272151c4d940"
                },
                {
                  "change": "added",
                  "key": "01a1b07b-8157-7546-927e-2724ac33dc33",
                  "kind": "criterion",
                  "label": null,
                  "name": "Turned on again, level of detail drops the tiles the view does not need until the points held fit the budget.",
                  "parent": "01a1b07b-8157-7546-927e-272151c4d940"
                },
                {
                  "change": "added",
                  "key": "01a1b07b-8157-7546-927e-2725108d8df2",
                  "kind": "criterion",
                  "label": null,
                  "name": "The page's address keeps level of detail turned off, so that a reload or a shared link keeps it off.",
                  "parent": "01a1b07b-8157-7546-927e-272151c4d940"
                },
                {
                  "change": "added",
                  "key": "01a1b093-647d-7308-9b46-bdc985f6f0e9",
                  "kind": "requirement",
                  "label": null,
                  "name": "Univ Explorer shall draw each point of a held tile while its rank lies below the share of its domain the view needs at the point's own distance, and fade each tile in as it arrives and out as it goes.",
                  "parent": "01a1a497-e843-728a-bce8-3ffe4657fb77"
                },
                {
                  "change": "added",
                  "key": "01a1b093-647d-7308-9b46-bdca66fcbd08",
                  "kind": "criterion",
                  "label": null,
                  "name": "The share of a domain the view needs at a distance rises, level by level below the root, from the share the levels above hold to the share the level adds, in proportion as a typical tile of the level above would have its points from 3 to 6 pixels apart on screen at that distance.",
                  "parent": "01a1b093-647d-7308-9b46-bdc985f6f0e9"
                },
                {
                  "change": "added",
                  "key": "01a1b0a9-6982-71c6-b321-0cfc1d1f8a93",
                  "kind": "criterion",
                  "label": null,
                  "name": "A point's rank lies in its tile's slice of its domain, from the share the levels above the tile's hold to the share its level adds, or to all for a leaf, the tile's points dividing the slice evenly in their shuffled order.",
                  "parent": "01a1b093-647d-7308-9b46-bdc985f6f0e9"
                },
                {
                  "change": "added",
                  "key": "01a1b0a9-6982-71c6-b321-0cfd3507cc88",
                  "kind": "criterion",
                  "label": null,
                  "name": "Points at one distance are drawn at one share of their domain whichever tiles hold them, so that where the tiles the view needs are held no tile's cube shows as an edge.",
                  "parent": "01a1b093-647d-7308-9b46-bdc985f6f0e9"
                },
                {
                  "change": "added",
                  "key": "01a1b093-81da-759e-8532-70d7aa4d0ff1",
                  "kind": "criterion",
                  "label": null,
                  "name": "Every point of a root tile is drawn.",
                  "parent": "01a1b093-647d-7308-9b46-bdc985f6f0e9"
                },
                {
                  "change": "added",
                  "key": "01a1b093-647d-7308-9b46-bdcbf842c1af",
                  "kind": "criterion",
                  "label": null,
                  "name": "The share drawn is the first points of the tile in an order shuffled by the tile's id, so that every share is an even sample of its points, the same on every read.",
                  "parent": "01a1b093-647d-7308-9b46-bdc985f6f0e9"
                },
                {
                  "change": "added",
                  "key": "01a1b093-647d-7308-9b46-bdcc1ec02df7",
                  "kind": "criterion",
                  "label": null,
                  "name": "A tile fades in over 0.3 seconds once its points arrive, and out over 0.3 seconds before they are drawn no more.",
                  "parent": "01a1b093-647d-7308-9b46-bdc985f6f0e9"
                },
                {
                  "change": "added",
                  "key": "01a1b093-647d-7308-9b46-bdcd4901ec3c",
                  "kind": "criterion",
                  "label": null,
                  "name": "With level of detail off, every point of every held tile is drawn.",
                  "parent": "01a1b093-647d-7308-9b46-bdc985f6f0e9"
                },
                {
                  "change": "added",
                  "key": "01a1b093-647d-7308-9b46-bdce5099b2f5",
                  "kind": "criterion",
                  "label": null,
                  "name": "Only the points drawn can be pointed at or clicked.",
                  "parent": "01a1b093-647d-7308-9b46-bdc985f6f0e9"
                },
                {
                  "change": "changed",
                  "key": "01a1a497-e843-728a-bce8-400ade54e0e1",
                  "kind": "requirement",
                  "label": "RQ-123",
                  "name": "Univ Explorer shall draw every point outside the stars domain in one colour and count in the key the points drawn of each kind of value of distance.",
                  "parent": "01a1a497-e843-728a-bce8-3ffe4657fb77"
                },
                {
                  "change": "changed",
                  "key": "01a1a497-e843-728a-bce8-400b9b581384",
                  "kind": "criterion",
                  "label": "AC-362",
                  "name": "Points outside the stars domain are drawn in one colour, whatever the kind of value of their distance.",
                  "parent": "01a1a497-e843-728a-bce8-400ade54e0e1"
                },
                {
                  "change": "changed",
                  "key": "01a1a497-e843-728a-bce8-400c71ad8ebe",
                  "kind": "criterion",
                  "label": "AC-363",
                  "name": "The key shows that colour and counts the points of the tiles held of each kind of value: measured, estimated, inferred and reconstructed.",
                  "parent": "01a1a497-e843-728a-bce8-400ade54e0e1"
                },
                {
                  "change": null,
                  "key": "01a19f1e-d177-716d-b124-3ce12c3a03b8",
                  "kind": "component",
                  "label": "CMP-1",
                  "name": "Cloudflare platform",
                  "parent": null
                },
