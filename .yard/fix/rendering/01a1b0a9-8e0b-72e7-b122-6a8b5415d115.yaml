        view: spec-change
        note: "Agreed with the owner after the switch-off test. The 3/2 px fetch and keep rules now use a typical tile of the level (mean points of its split tiles, the level's edge) at the tile's nearest points, so the fetch rule matches the per-point share and regions at one distance are refined alike. Where the budget stops refinement, a region can still fall short of the share it needs."
