  - id: coma-ngc4874
    title: NGC 4874 at Scolnic et al.'s Coma distance on the Planck scale
    severity: concern
    select:
      kind: object_distance
      object: { source: twomrs, identifier: 12593570+2757338 }
    expect: { value: 111.8, sigma: 1.8, hubble_constant: 67.4 }
    cite: &scolnic
      - paper: "Scolnic et al. 2024, arXiv:2409.14546"
        locator: abstract
        quote: >-
          "Calibrating the absolute magnitude of SNe Ia with the HST distance ladder yields
          $D_{\textrm Coma}=98.5\pm2.2$ Mpc" ... "This distance results in $H_0=76.5 \pm 2.2$
          km/s/Mpc from the DESI FP relation." ... "calibrating it instead to the Planck+$\Lambda$CDM
          value of $H_0=67.4$ km/s/Mpc implies a much greater distance to Coma,
          $D_{\textrm Coma}=111.8\pm1.8$ Mpc"
        fetched: "https://arxiv.org/abs/2409.14546, 2026-11-03"
    note: >-
      The release places Coma's galaxies by redshift under Planck 2018 (H0 = 67.66), so the
      comparison is on that scale: Scolnic et al.'s own Planck-calibrated distance, 111.8 ± 1.8 Mpc
      at H0 = 67.4, times 67.4/67.66 (a distance at fixed redshift goes as 1/H0), 111.37 ± 1.79 Mpc.
      Their ladder distance gives the same: 98.5 Mpc × 76.5/67.66 = 111.4 Mpc. A single galaxy's
      redshift also carries its motion within the cluster, which the release's 300 km/s term only
      partly covers, hence a concern, not a failure.

  - id: coma-ngc4889
    title: NGC 4889 at Scolnic et al.'s Coma distance on the Planck scale
    severity: concern
    select:
      kind: object_distance
      object: { source: twomrs, identifier: 13000809+2758372 }
    expect: { value: 111.8, sigma: 1.8, hubble_constant: 67.4 }
    cite: *scolnic
    note: As coma-ngc4874.

