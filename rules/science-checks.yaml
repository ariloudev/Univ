    severity: fail
    select:
      kind: object_distance
      object: { source: twomrs, identifier: 12304942+1223279 }
    expect: { value: 16.5, sigma: 1.1 }
    cite:
      - paper: "Mei et al. 2007, ApJ 655, 144 (astro-ph/0702510)"
        locator: abstract
        quote: "have a narrow distribution around our adopted mean distance of 16.5+/-0.1 (random mean error) +/-1.1 Mpc (systematic)."
        fetched: "https://arxiv.org/abs/astro-ph/0702510, 2026-11-03"
    note: >-
      The SBF mean distance of the Virgo cluster's main sample, measured; its systematic 1.1 Mpc
      dominates the 0.1 Mpc random error and is taken as sigma. 2MASX J12304942+1223279 is M87.

