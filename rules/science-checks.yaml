  - id: counts-by-scale-domain
    title: Objects per scale domain
    severity: report
    select:
      kind: report
      sql: >-
        SELECT coalesce((SELECT term FROM terms t WHERE t.release = o.release AND t.id = o.scale_domain), '-')
        AS scale_domain, placed, count(*) AS objects, min(distance_mpc) AS min_mpc, max(distance_mpc) AS max_mpc
        FROM objects o WHERE o.release = :release GROUP BY 1, 2 ORDER BY 1, 2
    cite: *domains

  - id: unplaced-by-reason
    title: Unplaced objects by reason
    severity: report
    select:
      kind: report
      sql: >-
        SELECT (SELECT term FROM terms t WHERE t.release = o.release AND t.id = o.not_placed) AS reason,
        count(*) AS objects FROM objects o WHERE o.release = :release AND o.placed = 0
        GROUP BY 1 ORDER BY 2 DESC
    cite: *domains
