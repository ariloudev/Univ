      grid: cf4-basins
      field: 0
      frame: supergalactic
      unit: megaparsec_over_h
      points:
        - { name: observer, at: [0, 0, 0], label: 1 }
        - { name: Laniakea, at: [-62, -8, 39], label: 1 }
        - { name: Apus, at: [-125, -23, -31], label: 2 }
        - { name: Hercules, at: [-39, 70, 78], label: 3 }
        - { name: Lepus, at: [-62, -39, -109], label: 4 }
        - { name: Perseus-Pisces, at: [47, -23, -31], label: 5 }
        - { name: Shapley, at: [-141, 62, -16], label: 6 }
        - { name: SDSS-1a, at: [117, 227, -227], label: 7 }
        - { name: SDSS-2a, at: [-102, 297, 102], label: 8 }
        - { name: SDSS-2b, at: [31, 289, 156], label: 9 }
    expect: { equals: 0 }
    cite:
      - paper: "Dupuy & Courtois 2023, A&A 678, A176 (arXiv:2305.02339)"
        locator: "table of gravitational basins (tab:basins), CF4 galaxies columns SGX, SGY, SGZ"
        quote: >-
          "Laniakea & 263 & -39 & 7,412 & -62 & -8 & 39 & 1.9" ... "Apus -125 -23 -31", "Hercules
          -39 70 78", "Lepus -62 -39 -109", "Perseus-Pisces 47 -23 -31", "Shapley -141 62 -16",
          "SDSS-1a 117 227 -227", "SDSS-2a -102 297 102", "SDSS-2b 31 289 156"; "Columns 5-12, 6-13
          and 7-14 give the supergalactic cartesian coordinates of the corresponding attractor or
          repeller, SGX, SGY and SGZ, respectively, in units of Mpc $h^{-1}$."
        fetched: "arXiv:2305.02339 LaTeX source (main.tex), fetched 2026-11-03"
      - paper: "Dupuy & Courtois 2023, A&A 678, A176 (arXiv:2305.02339)"
        locator: data availability
        quote: >-
          "Each integer labels a single basin (in the same order as listed in Table
          \ref{tab:basins}, ignoring blank lines) [...] voxels filled with 1 are part of Laniakea,
          2 of Apus, 3 of Hercules, etc."
        fetched: "arXiv:2305.02339 LaTeX source (main.tex), fetched 2026-11-03"
    note: >-
      Reconstructed: attractors of the CF4 galaxies' velocity field, in supergalactic Mpc/h, read
      in the released basins of attraction of the CF4 galaxies (field 0, CF4_new_128-z008_BoA).
      The grid and the table share the Mpc/h unit, so no H0 enters.

  - id: horologium-reticulum-distance
