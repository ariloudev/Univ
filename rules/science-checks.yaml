      sql: >-
        SELECT e.object_id, e.name FROM entries e WHERE e.release = :release
        AND e.source = source('erass1-clusters')
        AND e.name IN ('1eRASS J123049.2+122332', '1eRASS J033829.1-352701')
        AND json_extract(e.flags, '$.BEST_Z_TYPE') = 'lit_z'
    expect: { equals: 2 }
    cite: *erass1

  - id: ungc-without-distance
    title: UNGC's 110 rows without a measured distance kept
    severity: fail
    select:
      kind: query
      sql: >-
        SELECT e.object_id, e.identifier FROM entries e WHERE e.release = :release
        AND e.source = source('updated-nearby-galaxies')
        AND NOT EXISTS (SELECT 1 FROM measurements m WHERE m.release = e.release
        AND m.object_id = e.object_id AND m.entry = e.entry AND m.quantity = term('distance'))
    expect: { equals: 110 }
    cite:
      - paper: "Karachentsev, Makarov & Kaisina 2013, AJ 145, 101 (VizieR J/AJ/145/101)"
        locator: "catalog, column f_Dist, and ReadMe Note (G1)"
        quote: >-
          f_Dist "Method used to obtain Dist (G1)"; h and h' are distances "by the Hubble
          velocity-distance relation at H0=73 km/s/Mpc", and txt marks dwarfs whose "texture ...
          indicates their likely proximity". Of the 869 rows served, 86 are h, 4 h' and 20 txt.
        fetched: "http://vizier.idia.ac.za/viz-bin/asu-tsv?-source=J%2FAJ%2F145%2F101%2Fcatalog&-out=Name%2CDist%2Cf_Dist%2CHRV%2CBmag&-out.add=_RAJ%2C_DEJ&-out.max=unlimited, 2026-11-03T10:16:00Z; ReadMe http://vizier.nao.ac.jp/ftp/cats/J/AJ/145/101/ReadMe, 2026-11-03"
    note: >-
      Estimated distances (Hubble-flow and texture), not measured ones: the definition drops them
      and keeps the 110 galaxies, to be placed by another source if at all.

  # -------------------------------------------------------------------------------- sanity
  - id: local-group-duplicates
    title: No two placed galaxies within 1′ at distances agreeing within their uncertainties
    severity: fail
    select:
      kind: close_pairs
      scale_domains: [nearby_galaxies]
      kinds: [body]
      radius_arcmin: 1.0
      exceptions:
        - source: mcconnachie-2012
          identifier: HIZSS 3B
          reason: >-
            HIZSS 3B, a companion galaxy of HIZSS 3(A) whose HI overlaps it in projection but
            separates in velocity (Begum et al. 2005, cited); McConnachie 2012 lists both at one
            position and one distance, 288.0 and 322.6 km/s, "Binary with B?" and "Binary with A?".
        - source: sixdfgs-dr3
          identifier: g2257107-424818
          reason: >-
            A second 6dFGS target in NGC 7412A (RC3, cited: D25 = 3.5′ along PA 91°, V21 929
            km/s), 41″ east of its RC3 centre beside g2257089-424818 21″ east, both given ZCAT's
            929 km/s (q_cz 9). No source of the release publishes this galaxy's extent, so the
            extent rule cannot join them: one galaxy entered twice, kept as a known duplicate.
    expect: { equals: 0 }
    cite:
      - paper: "univ-server specification, univ-ingest cross-matching"
        locator: "spec/products/univ-ingest"
        quote: "Each object belongs to one scale domain [...] nearby galaxies where its placed distance is within 11 Mpc"
        fetched: "this repository, spec/products/univ-ingest/releases/build-octree-tiles.yaml"
      - paper: "Begum, Chengalur, Karachentsev & Sharina 2005, MNRAS 359, L53 (astro-ph/0503125)"
        locator: abstract
        quote: >-
          "We present high spatial and velocity resolution Giant Meterwave Radio Telescope (GMRT)
          observations that resolve these puzzles by showing that HIZSS003 is actually a galaxy
          pair and that the HII region lies at the center of a much smaller companion galaxy
          (HIZSS003B) to the main galaxy (HIZSS003A). The HI emission from these two galaxies
          overlaps in projection, but can be separated in velocity space."
        fetched: "https://export.arxiv.org/api/query?id_list=astro-ph/0503125, 2026-11-03"
      - paper: "McConnachie 2012, AJ 144, 4 (VizieR J/AJ/144/4)"
        locator: "catalog, rows HIZSS 3(A) and HIZSS 3B: RAJ2000, DEJ2000, D, Vh, Notes"
        quote: >-
          HIZSS 3(A) | 07 00 29.3 | -04 12 30 | D 1675 kpc | Vh 288.0 | "Zone of obscuration.
          Binary with B?"; HIZSS 3B | 07 00 29.3 | -04 12 30 | D 1675 kpc | Vh 322.6 | "Zone of
          obscuration. Binary with A?"
