# Science checks of a built release, run by `cargo xtask science <release-dir>`.
#
# Each check selects one thing of the release by a generic kind and states what it should be,
# with the primary source of that expectation: the paper or catalogue, where in it, the sentence
# or row quoted, and where and when it was fetched. Measured, estimated and reconstructed values
# are named as such. Severity `fail` makes the command exit non-zero, `concern` is reported for a
# look, `report` prints counts and judges nothing.
#
# Kinds (xtask/src/science/rules.rs):
#   object_distance    an object's placed distance, Mpc. expect: value with sigma (agreement
#                      within n_sigma, default 2, of the cited sigma and the object's own in
#                      quadrature), absolute or relative; hubble_constant carries a value cited at
#                      another H0 to the release's; placed_by names the preferred measurement's
#                      source and method.
#   object_direction   an object's sky position. expect: frame, lon, lat, within_arcmin.
#   structure_distance a researched structure's centre distance against the comoving distance,
#                      under the release cosmology, of a cited velocity (z = v/c), corrected to
#                      the CMB frame with the Planck 2018 dipole when heliocentric.
#   grid_labels        a grid field's labels at points given in the grid's frame and unit: the
#                      number of points in another label than expected.
#   query              an SQL query of the loaded release: the number of rows it gives (its first
#                      column an object id, so listed exceptions are left out), or with scalar its
#                      first value. :release is the release number. SQL functions: term(name),
#                      source(id), sep_arcmin(ra1, dec1, ra2, dec2), comoving_mpc(z).
#   close_pairs        placed objects closer on the sky than radius_arcmin whose distances agree
#                      within their uncertainties in quadrature: the number of pairs.
#   largest_tile, d1_estimate, fingerprints, report.
# A count or share is judged by equals, at_least or at_most.

checks:
  # ---------------------------------------------------------------- positions and distances
  - id: m31-distance
    title: M31 at McConnachie's 783 ± 25 kpc
    severity: fail
    select:
      kind: object_distance
      object: { source: mcconnachie-2012, identifier: Andromeda }
    expect: { value: 0.783, sigma: 0.025 }
    cite:
      - paper: "McConnachie 2012, AJ 144, 4 (VizieR J/AJ/144/4)"
        locator: "catalog, row Andromeda (M31, NGC 224): (m-M), D, E_D, e_D"
        quote: "Andromeda | M31,NGC 224,UGC 454 | (m-M) 24.47 +0.07 -0.07 | D 783 kpc +25 -25 (measured)"
        fetched: "https://vizier.idia.ac.za/viz-bin/asu-tsv?-source=J/AJ/144/4/catalog&-out.all&-out.max=200, 2026-11-03T12:18:45"
    note: >-
      A measured distance with a symmetric 25 kpc error. The release may place M31 by another
      measured distance; it agrees when within 2σ of McConnachie's and its own in quadrature.

  - id: m31-direction
    title: M31 toward l = 121.174°, b = -21.573°
    severity: fail
    select:
      kind: object_direction
      object: { source: mcconnachie-2012, identifier: Andromeda }
    expect: { frame: galactic, lon: 121.174, lat: -21.573, within_arcmin: 0.5 }
    cite:
      - paper: "McConnachie 2012, AJ 144, 4 (VizieR J/AJ/144/4)"
        locator: "catalog, row Andromeda: RAJ2000, DEJ2000, GLON, GLAT"
        quote: "Andromeda | RAJ2000 00 42 44.3 | DEJ2000 +41 16 09 | GLON 121.2 | GLAT -21.6"
        fetched: "https://vizier.idia.ac.za/viz-bin/asu-tsv?-source=J/AJ/144/4/catalog&-out.all&-out.max=200, 2026-11-03T12:18:45"
    note: >-
      l and b to 0.001° are McConnachie's FK5 J2000 position turned to galactic coordinates
      (astropy 2026-11-03: l = 121.17423°, b = -21.57289°); the table prints them to 0.1°. Half an
      arcminute allows the rounding to 0.001° and the release's own position of M31.

  - id: m87-distance
