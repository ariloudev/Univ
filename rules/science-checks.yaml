  - id: redshift-distances-carry-peculiar-velocity
    title: Every redshift distance carries at least the 300 km/s term
    severity: fail
    select:
      kind: query
      sql: >-
        SELECT o.id, m.cmb, o.distance_mpc, o.distance_minus, o.distance_plus FROM objects o
        JOIN measurements m ON m.release = o.release AND m.object_id = o.id
        AND m.entry = o.preferred_entry AND m.quantity = o.preferred_quantity AND m.n = o.preferred_n
        WHERE o.release = :release AND o.placed = 1 AND o.preferred_quantity = term('redshift')
        AND (m.cmb IS NULL OR o.distance_minus IS NULL OR o.distance_plus IS NULL
          OR o.distance_minus < 0.999 * (comoving_mpc(m.cmb)
            - comoving_mpc(max(0.0, m.cmb - (1.0 + m.cmb) * 300.0 / 299792.458)))
          OR o.distance_plus < 0.999 * (comoving_mpc(min(10.0, m.cmb + (1.0 + m.cmb) * 300.0 / 299792.458))
            - comoving_mpc(m.cmb)))
    expect: { equals: 0 }
    cite:
      - paper: "univ-server specification, choose-the-preferred-measurement; rules/ranking.yaml"
        locator: "peculiar_velocity_km_s and its basis"
        quote: >-
          "a peculiar-velocity term, 300 km/s unless the release's ranking rule sets another";
          rules/ranking.yaml: "peculiar_velocity_km_s: 300" and "a redshift distance always
          carries the peculiar-velocity term"
        fetched: "this repository, rules/ranking.yaml"
    note: >-
      Each side of a redshift distance's interval must be at least D(z) moved by the redshift
      (1 + z) 300 km/s / c, under the release cosmology; 0.1% allows rounding.

