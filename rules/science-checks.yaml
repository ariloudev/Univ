  - id: redshift-conflicts
    title: No object whose entries' redshifts disagree by more than max(1,000 km/s, 5σ)
    severity: concern
    select:
      kind: query
      shown: 10
      sql: >-
        WITH z AS (SELECT m.object_id, m.entry, m.cmb * 299792.458 AS cz, m.kind_of_value AS k,
          CASE WHEN m.native_form = term('none_reported') THEN 0.0
          ELSE (coalesce(m.native_minus, 0.0) + coalesce(m.native_plus, 0.0)) / 2.0
            * CASE WHEN m.native_unit = term('kilometre_per_second') THEN 1.0 ELSE 299792.458 END
          END AS sigma
          FROM measurements m WHERE m.release = :release AND m.quantity = term('redshift')
          AND m.cmb IS NOT NULL),
        d AS (SELECT a.object_id, abs(a.cz - b.cz) AS dcz FROM z a JOIN z b
          ON b.object_id = a.object_id AND b.entry > a.entry
          WHERE abs(a.cz - b.cz) > 1000.0
          AND (a.cz - b.cz) * (a.cz - b.cz) > 25.0 * (a.sigma * a.sigma + b.sigma * b.sigma))
        SELECT d.object_id, round(max(d.dcz)) AS worst_km_s,
          (SELECT group_concat(s.id || ':' || e.identifier || ' ' || round(z.cz) || ' '
            || t.term, ', ') FROM z JOIN entries e ON e.release = :release
            AND e.object_id = z.object_id AND e.entry = z.entry
            JOIN sources s ON s.release = e.release AND s.n = e.source
            JOIN terms t ON t.release = e.release AND t.id = z.k
            WHERE z.object_id = d.object_id) AS cmb_cz_by_entry
        FROM d GROUP BY d.object_id ORDER BY worst_km_s DESC
    expect: { equals: 0 }
    cite:
      - paper: "Jones et al. 2009, MNRAS 399, 683 (VizieR VII/259)"
        locator: "6dfgs.dat, columns f_cz and q_cz, Notes (2) and (5)"
        quote: >-
          f_cz "Comparison flags between z measurements (2)", Note (2): "The comparison threshold
          is 330km/s"; q_cz Note (5): "3 = 6dFGS or 2dFGRS, 'probable' redshift (notionally 90%
          confidence)", "9 = SDSS and ZCAT sources (not a measure of quality)"
        fetched: "http://vizier.nao.ac.jp/ftp/cats/VII/259/ReadMe, 2026-11-03"
      - paper: "Lavaux & Hudson 2011, MNRAS 416, 2840 (VizieR J/MNRAS/416/2840)"
        locator: "catalog, column Cln"
        quote: >-
          Cln "Flag to indicate if the redshift has been obtained by the cloning procedure of
          Section 2.3."
        fetched: "http://vizier.nao.ac.jp/ftp/cats/J/MNRAS/416/2840/ReadMe, 2026-11-03"
    note: >-
      Entries of one object, matched by a shared 2MASX name or by position, whose CMB-frame cz
      differ by more than 1,000 km/s and five times their published errors in quadrature (none
      reported counts as zero): one of them is a wrong or assigned redshift, or a background
      object. 6dFGS flags its own disagreements beyond 330 km/s; 1,000 km/s is a pipeline choice
      well above a group's velocity spread. Each row gives every entry's cz and kind of value:
      2M++ clones (Cln = 1) are estimated, not measured. Looked at on release 4 (154 objects).

