      velocity_km_s: 19900
      frame: heliocentric
    expect: { relative: 0.005 }
    cite:
      - paper: "Fleenor et al. 2005, AJ 130, 957 (astro-ph/0505361)"
        locator: "§3.1 Kinematic Extent of the HRS"
        quote: "The mean redshift of these clusters is 19,900 km s-1, with a dispersion σ of 2300 km s-1."
        fetched: "arXiv:astro-ph/0505361 LaTeX source (ms.tex), fetched 2026-11-03"
      - paper: "Fleenor et al. 2005, AJ 130, 957 (astro-ph/0505361)"
        locator: "§2.4 Redshift Determination"
        quote: "heliocentric corrections were applied to all redshifts."
        fetched: "arXiv:astro-ph/0505361 LaTeX source (ms.tex), fetched 2026-11-03"
    note: >-
      The measured mean cz of seventeen ACO clusters, heliocentric, with no error of the mean
      given. The check is of the placement from that velocity, so the tolerance is tight: 0.5%,
      about 100 km/s.

  # ------------------------------------------------------------ cross-matching and kept rows
  - id: twompp-in-parent-surveys
    title: 2M++ entries sharing an object with a parent survey
    severity: fail
    select:
      kind: query
      scalar: true
      sql: >-
        SELECT avg(EXISTS (SELECT 1 FROM entries x WHERE x.release = e.release
        AND x.object_id = e.object_id AND x.source IN (source('twomrs'), source('sixdfgs-dr3'),
        source('sdss-dr17-galaxies'))))
        FROM entries e WHERE e.release = :release AND e.source = source('twompp-catalogue')
    expect: { at_least: 0.97 }
    cite:
      - paper: "Lavaux & Hudson 2011, MNRAS 416, 2840 (arXiv:1105.6107)"
        locator: "§1 and Table 1"
        quote: >-
          "We gather the high-quality redshifts from the 2MASS redshift survey [...] limited to
          $K=11.5$, the 6dF galaxy redshift survey Data Release Three [...] and the Sloan Digital
          Sky Survey Data Release Seven." Table 1: "2Mx6S 9 016 | 6dF 42 442 | SDSS 17 702 |
          Total 69 160" redshifts.
        fetched: "arXiv:1105.6107 LaTeX source (paper.tex), fetched 2026-11-03"
    note: >-
      The paper adds NED redshifts and fibre clones (1,840 rows with Cln = 1) beside its three
      parent surveys, so not every row has a parent entry. The 97% floor is set from the share
      measured on release 1 (97.27%), not a number of the paper.

  - id: twompp-6df-sourced
    title: 2M++ rows whose redshift is 6dF DR3's sharing an object with 6dFGS DR3
    severity: fail
    select:
      kind: query
      scalar: true
      sql: >-
        SELECT avg(EXISTS (SELECT 1 FROM entries x WHERE x.release = e.release
        AND x.object_id = e.object_id AND x.source = source('sixdfgs-dr3')))
        FROM entries e WHERE e.release = :release AND e.source = source('twompp-catalogue')
        AND json_extract(e.flags, '$.Ref') = '20096dF...C...0000J'
    expect: { at_least: 0.99 }
    cite: &twompp-ref
      - paper: "Lavaux & Hudson 2011, MNRAS 416, 2840 (VizieR J/MNRAS/416/2840)"
        locator: "catalog, column Ref"
        quote: >-
          "Ref (A19) Reference bibcode ("zoa" for fake galaxies in the Zone of Avoidance)"; 38,660
          rows give Ref 20096dF...C...0000J (6dFGS DR3, Jones et al. 2009) and 11,606 rows
          2009ApJS..182..543A (SDSS DR7, Abazajian et al. 2009).
        fetched: "https://vizier.idia.ac.za/viz-bin/asu-tsv?-source=J%2FMNRAS%2F416%2F2840%2Fcatalog&-out=Name%2CHV%2Ce_HV%2CKsmag%2CGID%2CRef%2CCln&-out.add=_RAJ%2C_DEJ&-out.max=unlimited, 2026-11-03"
    note: The 99% floor is set from the share measured on release 1 (99.17%), not a number of the paper.

  - id: twompp-sdss-sourced
    title: 2M++ rows whose redshift is SDSS DR7's sharing an object with SDSS DR17
    severity: fail
    select:
      kind: query
      scalar: true
      sql: >-
        SELECT avg(EXISTS (SELECT 1 FROM entries x WHERE x.release = e.release
        AND x.object_id = e.object_id AND x.source = source('sdss-dr17-galaxies')))
        FROM entries e WHERE e.release = :release AND e.source = source('twompp-catalogue')
        AND json_extract(e.flags, '$.Ref') = '2009ApJS..182..543A'
    expect: { at_least: 0.975 }
    cite: *twompp-ref
    note: >-
      A regression floor, not a number of the paper: the share was 97.98% on release 1
      (11,372 of 11,606) and 97.75% on release 3. A fall below 97.5% means matching lost real
      pairs.

  - id: erass1-lit-z-kept
    title: eRASS1's 155 lit_z rows with BEST_ZERR = -1 kept, with no uncertainty reported
    severity: fail
    select:
      kind: query
      sql: >-
        SELECT e.object_id, e.name FROM entries e JOIN measurements m ON m.release = e.release
        AND m.object_id = e.object_id AND m.entry = e.entry AND m.quantity = term('redshift')
        WHERE e.release = :release AND e.source = source('erass1-clusters')
        AND json_extract(e.flags, '$.BEST_Z_TYPE') = 'lit_z' AND m.native_form = term('none_reported')
    expect: { equals: 155 }
    cite: &erass1
      - paper: "Bulbul et al. 2024, A&A 685, A106 (eRASS1 cluster catalogue erass1cl_primary_v3.2.fits)"
        locator: "data model, column BEST_ZERR; the table's rows"
        quote: >-
          "BEST_ZERR float64 None 1 sigma error of BEST_Z"; in the file, 155 of 12,247 rows have
          BEST_ZERR < 0, every one -1.0 and BEST_Z_TYPE lit_z (of 247 lit_z rows), among them
          1eRASS J123049.2+122332 (BEST_Z 0.003) and 1eRASS J033829.1-352701 (BEST_Z 0.005).
        fetched: "https://erosita.mpe.mpg.de/dr1/AllSkySurveyData_dr1/Catalogues_dr1/BulbulE_DR1/erass1cl_primary_v3.2.fits.tgz, 2026-11-03T10:09:24Z; rows counted with astropy 2026-11-03"
    note: Measured literature redshifts; their -1 error is read as none reported, not as zero.

  - id: erass1-virgo-fornax
