  - sources: [alfalfa-a100, sdss-dr17-galaxies]
    angular_tolerance_arcsec: 60.0
    line_of_sight: { compare: velocity, tolerance_km_s: 300 }
    basis: &alfalfa >-
      ALFALFA positions are the HI centroids of 21 cm sources seen with Arecibo's beam of a few
      arcminutes (J/ApJ/861/49 ReadMe: "HI centroid"), not optical centres. 60 arcsec is a pipeline
      choice, as for McConnachie 2012 against 2MRS. In a crowded field more than one galaxy lies
      within it and the HI source stays apart, linked to each, rather than merged with the wrong
      one. A 21 cm velocity and an optical cz of one galaxy can differ by tens of km/s, and the line
      is hundreds of km/s wide; 300 km/s is the pipeline's choice for velocities from another
      spectrum, as for UNGC.
  - sources: [alfalfa-a100, desi-dr1]
    angular_tolerance_arcsec: 60.0
    line_of_sight: { compare: velocity, tolerance_km_s: 300 }
    basis: *alfalfa
  - sources: [alfalfa-a100, twomrs]
    angular_tolerance_arcsec: 60.0
    line_of_sight: { compare: velocity, tolerance_km_s: 300 }
    basis: *alfalfa
  - sources: [alfalfa-a100, twompp-catalogue]
