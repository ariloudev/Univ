    angular_tolerance_arcsec: 5.0
    line_of_sight: { compare: velocity, tolerance_km_s: 200 }
    basis: &twodf >-
      2dFGRS targets were "selected from the extended APM Galaxy Survey" (VII/250 ReadMe), whose
      positions the catalogue gives; 5 arcsec is a pipeline choice, as for the fibre surveys. Its
      redshifts carry an rms of 85 km/s (VII/250 ReadMe), within the 200 km/s of 2MRS and 2M++.
  - sources: [twodfgrs, sixdfgs-dr3]
    angular_tolerance_arcsec: 5.0
    line_of_sight: { compare: velocity, tolerance_km_s: 200 }
    basis: *twodf
  - sources: [twodfgrs, twomrs]
    angular_tolerance_arcsec: 5.0
