  - sources: [alfalfa-a100, twodfgrs]
    angular_tolerance_arcsec: 60.0
    line_of_sight: { compare: velocity, tolerance_km_s: 300 }
    basis: *alfalfa

  # Release 10, permission pending: 2MPZ's photometric redshifts.
  - sources: [twompz, twomrs]
    angular_tolerance_arcsec: 2.0
    line_of_sight: { compare: velocity, tolerance_km_s: 13500 }
    basis: &twompz_xsc >-
      2MPZ, 2MRS and 2M++ all take positions from the 2MASS XSC, so 2 arcsec as for 2MRS and
      2M++; most pairs join by their shared 2MASX name first. 2MPZ's photometric redshifts err by
      0.015 for the whole catalogue (Bilicki et al. 2014): three times that is 0.045, 13,500 km/s
      in cz, a pipeline choice that rejects only a galaxy far in front of or behind the other.
  - sources: [twompz, twompp-catalogue]
    angular_tolerance_arcsec: 2.0
    line_of_sight: { compare: velocity, tolerance_km_s: 13500 }
    basis: *twompz_xsc
  - sources: [twompz, sixdfgs-dr3]
    angular_tolerance_arcsec: 5.0
    line_of_sight: { compare: velocity, tolerance_km_s: 13500 }
    basis: &twompz >-
      2MPZ positions are the 2MASS XSC's; 5 arcsec is a pipeline choice, as for the fibre surveys
      against 2MRS. 2MPZ's photometric redshifts err by 0.015 (Bilicki et al. 2014): three times
      that is 0.045, 13,500 km/s in cz, a pipeline choice that rejects only a spectroscopic galaxy
      far in front of or behind the photometric one. Within 5 arcsec a merge rests on the
      position.
  - sources: [twompz, sdss-dr17-galaxies]
    angular_tolerance_arcsec: 5.0
    line_of_sight: { compare: velocity, tolerance_km_s: 13500 }
    basis: *twompz
