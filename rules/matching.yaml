  - sources: [gama-dr4, twodfgrs]
    angular_tolerance_arcsec: 5.0
    line_of_sight: { compare: velocity, tolerance_km_s: 200 }
    basis: *gama
  - sources: [gama-dr4, sixdfgs-dr3]
    angular_tolerance_arcsec: 5.0
    line_of_sight: { compare: velocity, tolerance_km_s: 200 }
    basis: *gama
  - sources: [gama-dr4, twomrs]
    angular_tolerance_arcsec: 5.0
    line_of_sight: { compare: velocity, tolerance_km_s: 200 }
    basis: *gama
  - sources: [gama-dr4, twompp-catalogue]
    angular_tolerance_arcsec: 5.0
    line_of_sight: { compare: velocity, tolerance_km_s: 200 }
    basis: *gama
  - sources: [gama-dr4, alfalfa-a100]
    angular_tolerance_arcsec: 60.0
    line_of_sight: { compare: velocity, tolerance_km_s: 300 }
    basis: *alfalfa
  - sources: [wise-supercosmos, desi-dr1]
    angular_tolerance_arcsec: 5.0
    line_of_sight: { compare: velocity, tolerance_km_s: 36000 }
    basis: &wisescos >-
      WISE × SuperCOSMOS positions are WISE's; 5 arcsec is a pipeline choice, as for the fibre
      surveys. Its photometric redshifts scatter by 0.033 (1 + z) (Bilicki et al. 2016): three
      times that at the catalogue's median z of about 0.2 is 0.119, 36,000 km/s in cz, a pipeline
      choice that rejects only a spectroscopic galaxy far in front of or behind the photometric
      one. Within 5 arcsec a merge rests on the position.
  - sources: [wise-supercosmos, sdss-dr17-galaxies]
    angular_tolerance_arcsec: 5.0
    line_of_sight: { compare: velocity, tolerance_km_s: 36000 }
    basis: *wisescos
