  # Release 10, permission pending: GAMA DR4 and WISE × SuperCOSMOS.
  - sources: [gama-dr4, desi-dr1]
    angular_tolerance_arcsec: 5.0
    line_of_sight: { compare: velocity, tolerance_km_s: 200 }
    basis: &gama >-
      GAMA's RA and DEC are the spectrum's position (SpecObj v27); 5 arcsec is a pipeline choice,
      as for the other fibre surveys. GAMA publishes no redshift error; 200 km/s as for 2MRS and
      2M++.
  - sources: [gama-dr4, sdss-dr17-galaxies]
    angular_tolerance_arcsec: 5.0
    line_of_sight: { compare: velocity, tolerance_km_s: 200 }
    basis: *gama
