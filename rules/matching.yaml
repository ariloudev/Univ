  - sources: [twompz, wise-supercosmos]
    angular_tolerance_arcsec: 5.0
    line_of_sight: { compare: velocity, tolerance_km_s: 36000 }
    basis: >-
      2MPZ's positions are the 2MASS XSC's and WISE × SuperCOSMOS's are WISE's; 5 arcsec is a
      pipeline choice. Both redshifts are photometric: 0.015 (Bilicki et al. 2014) and 0.033 (1 +
      z) (Bilicki et al. 2016) add in quadrature to 0.038 at 2MPZ's median z of 0.07, and three
      times that is 0.115, 34,500 km/s in cz; 36,000 km/s as for WISE × SuperCOSMOS's other pairs.
      Within 5 arcsec a merge rests on the position.

# The extent rule (step 3). Point-source tolerances cannot join the pieces of one extended nearby
# galaxy: release 4 kept IC 5052 (UNGC a26 = 8.13 arcmin, edge-on, b/a = 0.14) as one object of
# its UNGC and Cosmicflows-4 entries, one of its 2MRS and 2M++ entry 34 arcsec away, and four of
# 6dFGS fibres 6 to 28 arcsec from its centre, all within 60 km/s of its 584 km/s; and NGC 1507
# as two objects of two 2MASX designations 53 arcsec apart, 2MRS 04042714-0211210 against 2M++
# 04042802-0210254.
  - sources: [iau-star-names, hipparcos-2007]
    angular_tolerance_arcsec: 60.0
    line_of_sight: { compare: none }
    basis: >-
      Only IAU names with no HIP number carry a position (iau-star-names, cuts), one the WGSN
      table does not attribute. 60 arcsec is a pipeline choice: the proper motion of a bright star
      between Hipparcos's epoch J1991.25 and J2000 is a few arcseconds, and two stars bright
      enough to be named rarely lie within an arcminute of each other. Mesarthim (gamma Arietis)
      lies 1 arcsec from HIP 8832.
  - sources: [openngc, baumgardt-vasiliev-2021]
    angular_tolerance_arcsec: 60.0
    line_of_sight: { compare: none }
    basis: >-
      Measured on 2026-11-10: the 107 globular clusters both name the same (Baumgardt's NGC_104
      as OpenNGC's NGC 104) lie a median 3 arcsec apart, 90% within 9 and all within 40 (NGC 288);
      60 arcsec takes every one of them, far inside a globular cluster's few-arcminute core. Ten
      other OpenNGC objects lie within 60 arcsec of a cluster; where one is a cluster's second
      candidate, the rule above keeps both apart and linked. Neither publishes a line of sight to
      compare. The open clusters of Hunt & Reffert 2023 are not paired: their densest points lie a
      median 50 arcsec and up to degrees from OpenNGC's positions, so a tolerance wide enough to
      join them would join other clusters and nebulae too.
  - sources: [openngc, twomrs]
    angular_tolerance_arcsec: 10.0
    line_of_sight: { compare: none }
    basis: &openngc >-
      OpenNGC's positions are "usually taken from NED" (README); a few are of a knot or a
      superposed star, as its notes say. 10 arcsec is a pipeline choice for the offset between
      two catalogues' positions of one bright, extended galaxy. OpenNGC takes no distance or
      velocity, so the line of sight is not compared. Most galaxies join first by their PGC
      number or 2MASX designation.
  - sources: [openngc, twompp-catalogue]
    angular_tolerance_arcsec: 10.0
    line_of_sight: { compare: none }
    basis: *openngc
  - sources: [openngc, sixdfgs-dr3]
    angular_tolerance_arcsec: 10.0
    line_of_sight: { compare: none }
    basis: *openngc
  - sources: [openngc, sdss-dr17-galaxies]
    angular_tolerance_arcsec: 10.0
    line_of_sight: { compare: none }
    basis: *openngc
  - sources: [openngc, cosmicflows-4-galaxies]
    angular_tolerance_arcsec: 10.0
    line_of_sight: { compare: none }
    basis: *openngc
  - sources: [openngc, updated-nearby-galaxies]
    angular_tolerance_arcsec: 30.0
    line_of_sight: { compare: none }
    basis: >-
      As for UNGC and 2MRS: UNGC's centres of nearby dwarfs differ from other catalogues' by tens
      of arcseconds (Karachentsev et al. 2013). OpenNGC takes no distance or velocity.

extents:
  below_km_s: 1000
  tolerance_km_s: 300
  basis: >-
    Pipeline choice. Below a heliocentric cz of 1,000 km/s (within about 15 Mpc) galaxies are large
    on the sky and few per square degree, as for the nearby tolerance of Cosmicflows-4 against
    2MRS. Neither UNGC nor 2MRS table3 publishes a position angle, so a galaxy's extent is taken as
    the circle of its semi-major axis, which holds the ellipse it publishes; a piece must also
    agree with the galaxy's cz within 300 km/s, the tolerance of UNGC against 2MRS for velocities
    compiled from other spectra, which also takes in a fibre on a disc's HII region moved from the
    systemic velocity by the disc's rotation. A galaxy that publishes no size or no cz takes no
    pieces, and no size is supplied for one.
  sources:
    - source: updated-nearby-galaxies
      column: a26
      form: diameter
      unit: arcminute
      basis: >-
        J/AJ/145/101 ReadMe, table1.dat bytes 41-46 (read from
        http://vizier.nao.ac.jp/ftp/cats/J/AJ/145/101/ReadMe, 2026-11-03): "F6.2 arcmin a26
        [0.1/645.65]? Major angular diameter (1)", Note (1): "Corresponding to the Holmberg
        isophote (~26.5mag/arcsec^2^) in B band." The radius is half of a26.
    - source: twomrs
      column: Riso
      form: log10_radius
      unit: arcsecond
      basis: >-
        J/ApJS/199/26 ReadMe, table3.dat bytes 142-146 (read from
        http://vizier.nao.ac.jp/ftp/cats/J/ApJS/199/26/ReadMe, 2026-11-03): "F5.3 [arcsec] Riso Log
        of K=20 mag/sq arcsec elliptical isophote semimajor axis", the 2MASS XSC isophotal radius
        (Jarrett et al. 2000, AJ 119, 2498). The radius is ten to the power Riso, in arcseconds.
  pieces:
    - twomrs
    - twompp-catalogue
    - sixdfgs-dr3
    - sdss-dr17-galaxies
    - cosmicflows-4-galaxies
    # Release 10.
    - desi-dr1
    - sdss-dr17-distant
    - twodfgrs
    - gama-dr4
    - alfalfa-a100
    - twompz
    - wise-supercosmos
  pieces_basis: >-
    The galaxy surveys and the Cosmicflows-4 galaxies, whose entries are a detection, a fibre
    target or an adopted centre of a galaxy, so that one large galaxy can stand in them as several
    entries (IC 5052 and NGC 1507 above). Release 10's surveys are such entries too: its first
    build left 441 pairs of nearby galaxies 1 arcmin apart at one distance, almost all DESI DR1
    fibres on DDO 125, NGC 4190, DDO 190 and other nearby galaxies (350 of them between two DESI
    fibres of one galaxy), with ALFALFA detections and WISE × SuperCOSMOS sources among the rest. UNGC and McConnachie 2012 list each galaxy once by name
    and are never pieces; star sources and galaxy-group sources are never pieces.
  identities: [cosmicflows-4-galaxies, updated-nearby-galaxies, mcconnachie-2012]
  identities_basis: >-
    Each lists a galaxy once under its own identity: Cosmicflows-4 by its HyperLEDA PGC number
    (J/ApJ/944/94 ReadMe, table2, Note 1), UNGC and McConnachie 2012 by name. A companion with an
    identity of its own, such as NGC 5195 (UNGC a26 = 6.92 arcmin, 455 km/s) 4.6 arcmin from M51
    (NGC5194, a26 = 15.85 arcmin, 446 km/s) and within its extent, stays apart.
  fibres:
    surveys: [desi-dr1, sdss-dr17-galaxies, sdss-dr17-distant, twodfgrs, gama-dr4, sixdfgs-dr3]
    radius_arcsec: 60.0
    basis: >-
      Pipeline choice. A fibre survey targets the HII regions and knots of a nearby dwarf as
      separate objects: release 10's second build left 129 such clusters of DESI DR1 fibres, 2 to
      8 within 1 arcmin of each other at one cz to within a few km/s, on galaxies that no source
      of the release gives an extent (8 at RA 337.111, Dec +30.295, 599 to 677 km/s). Below the
      extent rule's 1,000 km/s, two galaxies 1 arcmin apart at one velocity are one galaxy
      entered twice, as the science check local-group-duplicates holds; 1 arcmin is that check's
      radius, and 300 km/s the extent rule's tolerance, which takes in a disc's rotation.
