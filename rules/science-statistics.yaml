# The statistics of release 15 (53.5 million objects, 76.2 million catalogue entries), as
# SQLite's ANALYZE wrote them into sqlite_stat1 of its scratch database on 2026-11-12, with the
# check indexes of xtask/src/science/indexes.rs. xtask science loads them into every scratch
# database, the fixture's too, so that the checks are planned as for a full release wherever
# they run (the scan guard reads those plans). Each row: table, index (none for a table that
# has no index), and the row count followed by the average rows per value of each prefix of
# the index's columns.
