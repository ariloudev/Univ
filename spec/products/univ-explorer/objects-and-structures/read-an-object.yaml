key: 01a1a497-e843-728a-bce8-3fe32aecd7d3
slug: read-an-object
name: "Read an object"
body: "Naming a point under the pointer, and reading the object it stands for from Univ Server."
realizes:
  - 01a1a497-e843-728a-bce8-3fcf940bdac0
  - 01a1a497-e843-728a-bce8-3fd1631f1368
requirements:
  - key: 01a1a497-e843-728a-bce8-3fe4680b13fa
    statement:
      form: event_driven
      when: "the pointer rests on a drawn point"
      system: "Univ Explorer"
      shall: "name the object it stands for."
    criteria:
      - key: 01a1a497-e843-728a-bce8-3fe5ca42baa2
        name: "The label gives the object's id, its scale domain, its distance from Earth and the source and kind of value of that distance."
      - key: 01a1b7d7-c032-73ad-803e-b0f94a6148dc
        name: "Once the pointer has rested on the point for 0.3 seconds, the label gives the object's name or first designation, read from its record, in place of its id."
  - key: 01a1a497-e843-728a-bce8-3fe654d91c29
    statement:
      form: event_driven
      when: "the person clicks a drawn point"
      system: "Univ Explorer"
      shall: "show the object's record that Univ Server gives."
    criteria:
      - key: 01a1a6b2-b217-764e-93d0-da89ee4e3c67
        name: "The panel is headed by the object's name: the name it was found by, or else the first proper name its sources give, or else the first designation of its record, in its catalogue's form, with its id beside it."
      - key: 01a1a6b2-b217-764e-93d0-da8ac9eeac60
        name: "The panel names a galaxy group as such, and names the scale domain of every object."
      - key: 01a1a497-e843-728a-bce8-3fe7201a1670
        name: "The panel gives the object's names and designations, each designation in its catalogue's form, each with the title of its source, and a name or designation that more than one source gives, or a designation that reads as one of the names, once, with all of them."
      - key: 01a1a497-e843-728a-bce8-3fe8c93208cf
        name: "The panel gives the preferred distance with its uncertainty, its kind of value, its source and the rule that preferred it."
      - key: 01a1a497-e843-728a-bce8-3fe962cd751a
        name: "The panel lists each other distance measurement of the object beside the preferred one."
      - key: 01a1a497-e843-728a-bce8-3fea61a8f74f
        name: "The panel gives the frame and epoch of the object's position."
      - key: 01a1a8ac-052e-72b3-a33e-b33a18c5c77c
        name: "The panel gives each spectral type the object's sources publish, as published, with its source and its kind of value."
      - key: 01a1a8ac-052e-72b3-a33e-b33ba7b45072
        name: "The panel gives each colour index of the object with its bands, its uncertainty and its source."
      - key: 01a1a8ac-052e-72b3-a33e-b33c05d6a7a7
        name: "Where no source publishes a spectral type, or only an unknown one, the panel gives the class the colour index suggests, labelled as estimated for a main-sequence star and citing Pecaut & Mamajek 2013."
      - key: 01a1a8ac-052e-72b3-a33e-b33dc8e38c1d
        name: "The panel names the papers of each researched entry of the object."
      - key: 01a1b7d7-c032-73ad-803e-b0fa7a60e532
        name: "The panel gives the object's position on the sky as right ascension and declination and as galactic longitude and latitude, with the frame and epoch of each."
      - key: 01a1b7d7-c032-73ad-803e-b0fb367dbf6d
        name: "The panel gives each magnitude of the object with its band, its uncertainty, its kind of value and its source."
      - key: 01a1b7d7-c032-73ad-803e-b0fc825b2931
        name: "The panel gives the object's proper motion, radial velocity and redshift where its sources publish them, each with its uncertainty, kind of value and source."
      - key: 01a1b7d7-c032-73ad-803e-b0fdf7abeef3
        name: "The panel names each group the object is a member of, and each member of a group the object is, each of which can be chosen."
      - key: 01a1b7d7-c032-73ad-803e-b0fe29efa362
        name: "The panel names each structure of the release whose volume, as its shape gives it exactly, holds the object's position, each of which can be chosen; a structure drawn by its bounding box, or by extents laid about a point, is not named."
      - key: 01a1b7d7-c032-73ad-803e-b0ffeb6df712
        name: "The panel gives each flag of each catalogue entry of the object with the meaning its source gives that value, or the value alone where its source gives none."
      - key: 01a1b7d7-c032-73ad-803e-b1003b3339be
        name: "Each value in the panel is marked with the symbol of its kind of value that the key shows."
      - key: 01a1a497-e843-728a-bce8-3febf4df9871
        name: "The chosen object is marked in the view."
      - key: 01a1a497-e843-728a-bce8-3fec1fe0b4b3
        name: "The chosen object is kept in the page's address, so that reloading the page shows it again."
  - key: 01a1a497-e843-728a-bce8-3fedaa2c488c
    statement:
      form: unwanted
      if: "Univ Server does not give the object's record"
      system: "Univ Explorer"
      shall: "say so in the panel."
    criteria:
      - key: 01a1a497-e843-728a-bce8-3fee23d1c65a
        name: "The panel gives the status and the problem's title that Univ Server answered with."
