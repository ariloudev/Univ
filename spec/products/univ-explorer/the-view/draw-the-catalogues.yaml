key: 01a1a497-e843-728a-bce8-3ffe4657fb77
slug: draw-the-catalogues
name: "Draw the catalogues"
body: "Drawing the placed objects of every scale domain around Earth, from the tiles of the release, at the detail the view needs. Each domain is an octree of tiles whose inner tiles hold a sample of the points under them, so a region gains detail as the children of its tiles are added. The view decides which tiles are held: those in view, refined until their points lie as close on screen as the view can show, within a budget of points, dropping first the tiles the view needs least. Each point is drawn by its rank against the share of its domain the view needs at its own distance, so that detail thins out smoothly with distance and no tile's edge shows, and tiles fade in and out. A switch turns level of detail off, so that every tile is fetched whatever the view."
realizes:
  - 01a1a497-e843-728a-bce8-3fcf940bdac0
  - 01a1a497-e843-728a-bce8-3fd0d4f9d2a1
requirements:
  - key: 01a1a497-e843-728a-bce8-3fff6f6d18ce
    statement:
      form: ubiquitous
      system: "Univ Explorer"
      shall: "draw each placed object of every scale domain at the position its tile gives, with Earth at the centre."
    criteria:
      - key: 01a1a497-e843-728a-bce8-4000304272e5
        name: "Each point is drawn at the ICRS position its tile gives, converted from its scale domain's unit to megaparsecs."
      - key: 01a1a497-e843-728a-bce8-40018ecb5def
        name: "Earth is marked at the origin, which the marker names as the Solar System barycentre, within about 1 AU of Earth."
      - key: 01a1a497-e843-728a-bce8-40026e7286d2
        name: "Points of the stars domain and of the galaxy domains are drawn together, each at its own distance."
  - key: 01a1a497-e843-728a-bce8-4003ade9ca4b
    statement:
      form: event_driven
      when: "the view changes"
      system: "Univ Explorer"
      shall: "fetch the tiles the view needs, those in view and the largest on screen first, within a budget of points."
    criteria:
      - key: 01a1a497-e843-728a-bce8-40049983aed9
        name: "The root tile of every scale domain is fetched before any other tile."
      - key: 01a1a497-e843-728a-bce8-400536d8f2b5
        name: "The tiles the view needs are fetched in order of their size on screen, largest first, and a tile wholly outside the view is not fetched."
      - key: 01a1a689-0b25-768a-9f1e-cc267f67e3c1
        name: "A tile's children are fetched only while a typical tile of its level, with the mean points of the level's split tiles and the level's edge, would have its points farther apart on screen than 3 pixels at the distance of the tile's nearest points, so that a region far away or seen whole is not refined beyond what the screen shows, and regions at one distance are refined alike."
      - key: 01a1a6a7-c540-7210-8492-7dfc16d279b8
        name: "A tile's children in view are fetched together or not at all, so that no part of a region is left coarser than the rest."
      - key: 01a1a6a7-c540-7210-8492-7dfdf91c2ccf
        name: "A view that does not change stops fetching and dropping tiles once it holds what it needs."
      - key: 01a1aea7-5e8b-7623-8601-48fb7856d2e3
        name: "A tile whose children are held keeps them while a typical tile of its level would have its points farther apart on screen than 2 pixels, so that a view moving a little about the 3 pixels that refine it does not drop the children it has just fetched."
      - key: 01a1aea7-5e8b-7623-8601-48fc4cf3ff3f
        name: "Where the budget cannot hold every family of tiles the view needs, a family that holds any of its tiles in view counts as half again its size on screen, so that a view moving a little does not trade it for a family of nearly its size."
      - key: 01a1aea7-5e8b-7623-8601-48fd8492b9c4
        name: "A view whose budget is full, turned by 0.1 degree and back again and again, drops and fetches no tile after its first turn."
      - key: 01a1aead-1e30-7695-bbd5-099c2f301565
        name: "A held tile counts as in view until it lies more than 1 degree outside the view, so that a view turning a little does not drop a tile at its edge and fetch it again as it turns back."
      - key: 01a1a497-e843-728a-bce8-4006f5c2ce8f
        name: "While level of detail is on, no more than 6,000,000 points are held at once."
  - key: 01a1a689-0b25-768a-9f1e-cc27109fed3c
    statement:
      form: event_driven
      when: "a tile the view needs would take the points held beyond the budget"
      system: "Univ Explorer"
      shall: "drop the held tiles the view needs least until the tile fits."
    criteria:
      - key: 01a1a689-0b25-768a-9f1e-cc28566a82e6
        name: "Tiles wholly outside the view are dropped before tiles in view, and among them the smallest on screen first."
      - key: 01a1a689-0b25-768a-9f1e-cc29da0f0de4
        name: "A root tile, and a tile whose children are held, is never dropped, so that no region loses the sample its children refine."
      - key: 01a1a689-0b25-768a-9f1e-cc2a53831ad9
        name: "A dropped tile is fetched again when the view needs it again."
      - key: 01a1aeb6-f18d-7787-9cbd-de2cfdcfe714
        name: "A dropped tile stays drawn, its points counted and its sources credited, until no tile is on its way, so that a moving view shows no region emptier while its new tiles arrive."
      - key: 01a1aeb6-f18d-7787-9cbd-de2dfa8b12aa
        name: "The dropped tiles kept drawn hold no more than a quarter of the budget, 1,500,000 points, beyond it, and those beyond it are drawn no more at once."
      - key: 01a1aeb6-f18d-7787-9cbd-de2e11b3bd4b
        name: "A dropped tile still drawn that the view wants again is drawn on without being read again."
  - key: 01a1b07b-8157-7546-927e-272151c4d940
    statement:
      form: state_driven
      while: "the person has turned level of detail off"
      system: "Univ Explorer"
      shall: "fetch every tile of the release, the coarser levels first, whatever the view, and drop none."
    criteria:
      - key: 01a1b07b-8157-7546-927e-2722e634b9b0
        name: "The top bar holds a switch that turns level of detail on and off, on when the page's address does not turn it off."
      - key: 01a1b07b-8157-7546-927e-272335750e5f
        name: "With level of detail off, every tile of every scale domain is fetched, the tiles of each level asked for before those of the level below, and no tile is dropped, whatever the view and the budget."
      - key: 01a1b07b-8157-7546-927e-2724ac33dc33
        name: "Turned on again, level of detail drops the tiles the view does not need until the points held fit the budget."
      - key: 01a1b07b-8157-7546-927e-2725108d8df2
        name: "The page's address keeps level of detail turned off, so that a reload or a shared link keeps it off."
  - key: 01a1b093-647d-7308-9b46-bdc985f6f0e9
    statement:
      form: ubiquitous
      system: "Univ Explorer"
      shall: "draw each point of a held tile while its rank lies below the share of its domain the view needs at the point's own distance, and fade each tile in as it arrives and out as it goes."
    criteria:
      - key: 01a1b093-647d-7308-9b46-bdca66fcbd08
        name: "The share of a domain the view needs at a distance rises, level by level below the root, from the share the levels above hold to the share the level adds, in proportion as a typical tile of the level above would have its points from 3 to 6 pixels apart on screen at that distance."
      - key: 01a1b0a9-6982-71c6-b321-0cfc1d1f8a93
        name: "A point's rank lies in its tile's slice of its domain, from the share the levels above the tile's hold to the share its level adds, or to all for a leaf, the tile's points dividing the slice evenly in their shuffled order."
      - key: 01a1b0a9-6982-71c6-b321-0cfd3507cc88
        name: "Points at one distance are drawn at one share of their domain whichever tiles hold them, so that where the tiles the view needs are held no tile's cube shows as an edge."
      - key: 01a1b093-81da-759e-8532-70d7aa4d0ff1
        name: "Every point of a root tile is drawn."
      - key: 01a1b093-647d-7308-9b46-bdcbf842c1af
        name: "The share drawn is the first points of the tile in an order shuffled by the tile's id, so that every share is an even sample of its points, the same on every read."
      - key: 01a1b093-647d-7308-9b46-bdcc1ec02df7
        name: "A tile fades in over 0.3 seconds once its points arrive, and out over 0.3 seconds before they are drawn no more."
      - key: 01a1b093-647d-7308-9b46-bdcd4901ec3c
        name: "With level of detail off, every point of every held tile is drawn."
      - key: 01a1b0b8-3632-76bc-88e5-8dd265a1a28d
        name: "With level of detail on, a domain's points are drawn fully opaque while, at the eye's distance from the focus, the view still needs more of the domain than its root holds, since thinned they crowd no more as the eye withdraws."
      - key: 01a1b0c4-82ea-7058-b4c4-959c016ec0f3
        name: "With level of detail on, a domain's points fade beyond the distance where the view needs no more of it than its root holds, as they crowd again, never fainter than with level of detail off."
      - key: 01a1b0b8-5967-707c-ba41-c9e3bc5755a6
        name: "With level of detail off, points grow fainter as the eye withdraws beyond 1 gigaparsec, so that a whole catalogue seen from afar adds up to its shape rather than to white."
      - key: 01a1b093-647d-7308-9b46-bdce5099b2f5
        name: "Only the points drawn can be pointed at or clicked."
  - key: 01a1a689-0b25-768a-9f1e-cc2b2734abc4
    statement:
      form: ubiquitous
      system: "Univ Explorer"
      shall: "draw only the held tiles that lie in the view."
    criteria:
      - key: 01a1a689-0b25-768a-9f1e-cc2c484365d4
        name: "A held tile is not drawn while the sphere about its points lies wholly outside the view."
  - key: 01a1a497-e843-728a-bce8-400775a8d943
    statement:
      form: unwanted
      if: "a tile's bytes do not match the SHA-256 its manifest gives, or the tile does not decode"
      system: "Univ Explorer"
      shall: "leave the tile undrawn and count it as failed."
    criteria:
      - key: 01a1a497-e843-728a-bce8-40081f3b67cf
        name: "A tile whose SHA-256 differs from its manifest's is not drawn."
      - key: 01a1a497-e843-728a-bce8-4009e23e1ebc
        name: "The view states the count of tiles that failed, where any did."
  - key: 01a1a497-e843-728a-bce8-400ade54e0e1
    statement:
      form: ubiquitous
      system: "Univ Explorer"
      shall: "draw every point of the nearby galaxies and cosmic web domains in one colour and count in the key the points drawn of each kind of value of distance."
    criteria:
      - key: 01a1a497-e843-728a-bce8-400b9b581384
        name: "Points of the nearby galaxies and cosmic web domains are drawn in one colour, whatever the kind of value of their distance."
      - key: 01a1a497-e843-728a-bce8-400c71ad8ebe
        name: "The key shows that colour and counts the points of the tiles held of each kind of value: measured, estimated, inferred and reconstructed."
  - key: 01a1a8ac-052e-72b3-a33e-b33e770aeebd
    statement:
      form: ubiquitous
      system: "Univ Explorer"
      shall: "draw each point of the stars domain in the colour of the temperature its colour index gives, and in neutral grey where it has none."
    criteria:
      - key: 01a1a8ac-052e-72b3-a33e-b33fb69a707c
        name: "A star's colour index, BP−RP or B−V, gives its effective temperature along the dwarf sequence of Pecaut & Mamajek 2013, and the temperature gives the colour a black body of that temperature shows the CIE 1931 standard observer."
      - key: 01a1a8ac-052e-72b3-a33e-b340d68ae618
        name: "A colour index beyond the sequence is taken at the sequence's end, so that the star is drawn in the sequence's hottest or coolest colour."
      - key: 01a1a8ac-052e-72b3-a33e-b3413483ba01
        name: "A star without a colour index is drawn in neutral grey."
      - key: 01a1a8ac-052e-72b3-a33e-b3422af21b30
        name: "The key shows the colours of the stars with their temperatures in kelvin, and counts the stars drawn in colour and those drawn in grey."
  - key: 01a1a497-e843-728a-bce8-400db24e35a8
    statement:
      form: ubiquitous
      system: "Univ Explorer"
      shall: "credit every source whose points are drawn, as the tile manifest gives its credit."
    criteria:
      - key: 01a1a497-e843-728a-bce8-400eb0b1b70d
        name: "The credits list each source of the drawn points with its title, its citation and its required credit."
      - key: 01a1a497-e843-728a-bce8-400fa74e76fc
        name: "The credits name the release the points come from."
  - key: 01a1a497-e843-728a-bce8-401087e90f86
    statement:
      form: ubiquitous
      system: "Univ Explorer"
      shall: "state the frame, origin, units and cosmology of what it draws."
    criteria:
      - key: 01a1a497-e843-728a-bce8-40111a7d5c5f
        name: "The view names the frame whose axes it shows, the origin, the unit of its distances and the release cosmology."
  - key: 01a1c319-7860-76e8-92ac-c5e5caae2dff
    statement:
      form: ubiquitous
      system: "Univ Explorer"
      shall: "draw each point of the Galaxy tracers domain in the colour of its kind of object, larger than a star's point."
    criteria:
      - key: 01a1c319-7860-76e8-92ac-c5e61e66e5d3
        name: "Each kind of object of the Galaxy tracers domain has its own colour, distinct from the colours of the stars' temperatures and of the galaxy domains."
      - key: 01a1c319-7860-76e8-92ac-c5e7f392df4f
        name: "The key names each kind of object of the Galaxy tracers domain with its colour and the number of its points drawn."
      - key: 01a1cbb8-4b9e-71c0-8bbe-c8fb25546047
        name: "A point of the Galaxy tracers domain is drawn in its kind of object's colour whichever source placed it."
      - key: 01a1cbb8-4b9e-71c0-8bbe-c8fc292cfa4a
        name: "A point of a Galaxy tracers tile that gives no kind of object is drawn in one colour of its own, which the key names as a tracer of unknown kind."
      - key: 01a1c319-7860-76e8-92ac-c5e864b8c262
        name: "A point of the Galaxy tracers domain is drawn twice the size of a point of the stars domain at the same distance."
  - key: 01a1c319-7860-76e8-92ac-c5e9e544de53
    statement:
      form: ubiquitous
      system: "Univ Explorer"
      shall: "draw each point of the stars domain whose distance is inferred at half the opacity of a star whose distance is measured or estimated."
    criteria:
      - key: 01a1c319-7860-76e8-92ac-c5ea87f31404
        name: "A star whose preferred distance is inferred is drawn at half the opacity of a star of the same colour whose preferred distance is measured or estimated."
      - key: 01a1c319-7860-76e8-92ac-c5ebab7e87a4
        name: "The key says that fainter stars have inferred distances."
qualityAttributes:
  - key: 01a1a497-e843-728a-bce8-4012b27b645f
    name: "Univ Explorer shall draw the first points of the latest release within 3 seconds of being opened."
    qaKind: latency
    qualityTarget:
      metric: "explorer.first_points.latency"
      band:
        kind: at_most
        upper: "3"
      unit: "s"
      aggregation: p95
      scenario: "Opening the explorer on the latest release, from page load to the first points drawn, over 10 loads"
      environment: "Univ Server and the explorer run locally through cargo xtask explore on the owner's computer"
    verificationFate: sampled
