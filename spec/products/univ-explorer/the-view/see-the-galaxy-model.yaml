key: 01a213c1-93e0-7343-9f8d-9b92bac26aaa
slug: see-the-galaxy-model
name: "See the Galaxy model"
body: |
  Seeing the whole Milky Way as a spiral galaxy: its disc, bar, bulge and halo, and the young
  stars and star-forming knots of its arms, drawn from the model points of the Galaxy model
  beyond the few kiloparsecs that its observed stars and tracers reach. The model's points stand
  for light, not for stars, so they are drawn as light, adding up where they crowd. Drawn by
  their cited share of the light alone, the young stars and knots of the arms are too few to
  stand out against the old disc, as a spiral galaxy's arms do in a photograph, where their hot
  young stars outshine the old disc; so each population is drawn at a display brightness of its
  own, the arms' brighter than the rest. Near the Sun, the real objects stand in for the model points they cover,
  while their scale domain is drawn.
realizes:
  - 01a1a497-e843-728a-bce8-3fcf940bdac0
  - 01a1a497-e843-728a-bce8-3fd0d4f9d2a1
  - 01a1a497-e843-728a-bce8-3fd1631f1368
requirements:
  - key: 01a213c1-93e0-7343-9f8d-9b934b63897f
    statement:
      form: ubiquitous
      system: "Univ Explorer"
      shall: "draw the model points of the Galaxy model domain as light, in the display colour of each one's population."
    criteria:
      - key: 01a213c1-93e0-7343-9f8d-9b94c1b7d454
        name: "Every model point of a population is drawn with the same brightness, its population's display brightness, and the light of model points that overlap on screen adds up."
      - key: 01a21597-d81c-71be-95d7-ab2f180b7371
        name: "The young stars and the star-forming knots of the arms are drawn 6 times as bright as the points of the discs, the bar and bulge and the halo."
      - key: 01a213c1-93e0-7343-9f8d-9b95b48b1af3
        name: "Each model point is drawn in the display colour the Galaxy model's definition gives its population."
      - key: 01a213c1-93e0-7343-9f8d-9b96e3363efe
        name: "A model point is drawn while the Galaxy model domain is on, whatever the switches of sources and kinds of value say."
  - key: 01a213c1-93e0-7343-9f8d-9b977e9963be
    statement:
      form: ubiquitous
      system: "Univ Explorer"
      shall: "draw a model point that real objects cover only while the scale domain of its population's counterparts is off."
    criteria:
      - key: 01a213c1-93e0-7343-9f8d-9b9882bfc8e0
        name: "A covered model point of the young stars or the star-forming knots of the arms is drawn only while the Galaxy tracers domain is off."
      - key: 01a213c1-93e0-7343-9f8d-9b9985b0e904
        name: "A covered model point of any other population is drawn only while the stars domain is off."
  - key: 01a213c1-93e0-7343-9f8d-9b9a0f698dee
    statement:
      form: ubiquitous
      system: "Univ Explorer"
      shall: "mark the Galaxy model's points as a model, apart from observed objects."
    criteria:
      - key: 01a213c1-93e0-7343-9f8d-9b9b9ac1d575
        name: "The key names the Galaxy model's points as a model, not observed stars, and counts them apart from the objects drawn."
      - key: 01a213c1-93e0-7343-9f8d-9b9c98eef163
        name: "A model point is not named by the pointer nor chosen by a click."
      - key: 01a213c1-93e0-7343-9f8d-9b9dba1301d7
        name: "The credits list each paper the Galaxy model's definition cites, while the Galaxy model domain is on."
