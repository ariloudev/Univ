key: 01a1a8cc-3d02-7585-85fb-4558813fc355
slug: choose-what-is-drawn
name: "Choose what is drawn"
body: "Turning groups of what the view draws on and off: the points of each scale domain, of each catalogue and of each kind of value of their distances, and the structures of each kind, so that one survey, one kind of value or one kind of structure can be seen alone. The Show drawer holds them in two parts, the points and the structures, and lists each source once, marked under each scale domain whose points it places, since turning a source off acts in every scale domain it is in."
realizes:
  - 01a1a497-e843-728a-bce8-3fcf940bdac0
  - 01a1a497-e843-728a-bce8-3fd0d4f9d2a1
requirements:
  - key: 01a1a8cc-3d02-7585-85fb-4559a8a2b471
    statement:
      form: ubiquitous
      system: "Univ Explorer"
      shall: "offer a switch for each scale domain, each source of the drawn points, each kind of value and each kind of structure, all on when the view opens."
    criteria:
      - key: 01a1a8cc-3d02-7585-85fb-455a3c55e223
        name: "The Show drawer lists the scale domains, the sources of the drawn points, the four kinds of value and the kinds of the structures, each with a switch."
      - key: 01a1a8cc-3d02-7585-85fb-455bf6b1d224
        name: "Every switch is on when the view opens on an address that turns no group off."
  - key: 01a1a8cc-3d02-7585-85fb-455c402dc776
    statement:
      form: event_driven
      when: "a group is turned off or on"
      system: "Univ Explorer"
      shall: "draw only the points and structures whose groups are all on."
    criteria:
      - key: 01a1a8cc-3d02-7585-85fb-455d411f618e
        name: "A point is drawn only while its scale domain, the source of its preferred distance and that distance's kind of value are all on."
      - key: 01a1a8cc-3d02-7585-85fb-455ef6890107
        name: "A structure is drawn only while its kind is on."
      - key: 01a1a8cc-3d02-7585-85fb-455fd5131e7f
        name: "A point or structure not drawn is not named by the pointer nor chosen by a click, and the key does not count it."
  - key: 01a1a8cc-3d02-7585-85fb-4560c2ae86dc
    statement:
      form: ubiquitous
      system: "Univ Explorer"
      shall: "keep the groups turned off in the page's address."
    criteria:
      - key: 01a1a8cc-3d02-7585-85fb-4561d1b0f1de
        name: "Reloading the page, or opening its address elsewhere, draws the same groups."
  - key: 01a1bcf9-343a-712a-a28c-7502f6c45017
    statement:
      form: ubiquitous
      system: "Univ Explorer"
      shall: "say at the head of the Show drawer how much of the points and of the structures is drawn, with one link that turns every group on."
    criteria:
      - key: 01a1bcf9-343a-712a-a28c-7503bb8fdbb5
        name: "The summary gives, as a number on and the number in all, the scale domains, the sources and the kinds of value of the points, and the kinds of structure."
      - key: 01a1bcf9-343a-712a-a28c-75049b84e0eb
        name: "The link that shows everything appears only while at least one group is off."
      - key: 01a1bcf9-343a-712a-a28c-7505bbe87412
        name: "Following the link that shows everything turns every group on."
  - key: 01a1bcf9-343a-712a-a28c-7506ab74faa5
    statement:
      form: ubiquitous
      system: "Univ Explorer"
      shall: "list, in the Show drawer, each source of the drawn points once, in a table with a column for each scale domain."
    criteria:
      - key: 01a1bcf9-343a-712a-a28c-750761703f4d
        name: "Each scale domain heads its column with its switch and its number of points."
      - key: 01a1bcf9-343a-712a-a28c-7509e80a8d25
        name: "Each source is named on one line by its short name, with its title shown while the pointer is over it."
      - key: 01a1bd07-c9c2-7632-a4e5-d6277e9ea870
        name: "The sources are grouped by the smallest scale domain whose points they place, from the smallest scale up."
      - key: 01a1bcf9-343a-712a-a28c-750ae9ac17b6
        name: "Each source is marked in the column of each scale domain whose points it places."
      - key: 01a1bcf9-343a-712a-a28c-750c2cd7edc7
        name: "Turning a scale domain off or on hides or draws its points."
      - key: 01a1bd07-e8b7-762f-97dc-651bd7d745b2
        name: "Turning a scale domain off or on leaves every source's switch as it is."
  - key: 01a1bcf9-343a-712a-a28c-750e189adb25
    statement:
      form: ubiquitous
      system: "Univ Explorer"
      shall: "show each kind of value as a toggle that carries the mark the key gives it."
    criteria:
      - key: 01a1bcf9-343a-712a-a28c-750fb1df213e
        name: "The toggles carry ● for measured, ◐ for estimated, ○ for inferred and ◌ for reconstructed."
      - key: 01a1bcf9-343a-712a-a28c-751026f05121
        name: "A kind of value turned off is shown hollow, and its toggle is not pressed for assistive technology."
  - key: 01a1bcf9-343a-712a-a28c-7511afea1d5b
    statement:
      form: ubiquitous
      system: "Univ Explorer"
      shall: "show each kind of structure as a toggle with the colour its structures are drawn in and their number, among the kinds of its family."
    criteria:
      - key: 01a1bcf9-343a-712a-a28c-751205a93cd4
        name: "Each kind of structure's toggle carries its colour and the number of structures of the kind the release holds."
      - key: 01a1bcf9-343a-712a-a28c-7513e662d7d4
        name: "The kinds of structure are grouped by family as denser, emptier, walls and threads, distant arcs and groups, flows, and other."
      - key: 01a1bcf9-343a-712a-a28c-7514105b3d9c
        name: "A kind of structure turned off is shown hollow, and its toggle is not pressed for assistive technology."
  - key: 01a1bcf9-343a-712a-a28c-751561c4240f
    statement:
      form: event_driven
      when: "the reader asks for only one source or only one kind of structure"
      system: "Univ Explorer"
      shall: "turn every other source, or every other kind of structure, off."
    criteria:
      - key: 01a1bcf9-343a-712a-a28c-75169b137491
        name: "Choosing only a source turns it and each scale domain whose points it places on, and every other source off."
      - key: 01a1bcf9-343a-712a-a28c-75170d5cc323
        name: "Choosing only a kind of structure turns it on and every other kind of structure off."
      - key: 01a1bcf9-343a-712a-a28c-7518d12d9fa0
        name: "The choice of only one is offered on a source's or a kind's line while the pointer is over it or it has the focus."
  - key: 01a1bcf9-343a-712a-a28c-7519a1a7b52f
    statement:
      form: ubiquitous
      system: "Univ Explorer"
      shall: "offer, for the points and for the structures, one control that turns all of their groups on and one that turns them off."
    criteria:
      - key: 01a1bcf9-343a-712a-a28c-751a2eefe88f
        name: "All, for the points, turns every scale domain, source and kind of value on."
      - key: 01a1bcf9-343a-712a-a28c-751b082d1288
        name: "None, for the points, turns every scale domain off."
      - key: 01a1bcf9-343a-712a-a28c-751c56321a25
        name: "All, for the structures, turns every kind of structure on."
      - key: 01a1bcf9-343a-712a-a28c-751ddc8c2d45
        name: "None, for the structures, turns every kind of structure off."
