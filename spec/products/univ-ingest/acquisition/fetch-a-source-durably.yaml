key: 01a19f22-2ad9-716e-876f-18443b0ddcd6
slug: fetch-a-source-durably
name: "Fetch a source durably"
body: |
  Fetching a source from providers that fail intermittently, as CDS, NED and SkyServer did in the
  earlier Univ work, without losing what already arrived and without publishing a partial source.
realizes:
