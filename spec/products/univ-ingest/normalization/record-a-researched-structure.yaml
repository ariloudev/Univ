key: 01a19f22-2ad9-716e-876f-187ab1b6831a
slug: record-a-researched-structure
name: "Record a researched structure"
body: |
  Turning what papers say about a structure, such as the extent of a supercluster or the members
  of a giant arc, into a structure of the release, without a single uncited number.
realizes:
  - 01a19f1e-d177-716d-b124-3cee44add674
  - 01a19f1e-d177-716d-b124-3cf3def064d0
requirements:
  - key: 01a19f22-2ad9-716e-876f-187be2150c85
    statement:
      form: ubiquitous
      system: "Univ Ingest"
      shall: "read each researched structure from a structure file in which every number cites where it comes from."
    criteria:
      - key: 01a19f22-2ad9-716e-876f-187cf88a2254
        name: "Each number cites its paper and the sentence, table or figure it was taken from."
      - key: 01a19f22-2ad9-716e-876f-187dd6a97fba
        name: "The structure's geometry is one of the geometry kinds univ-model defines, in a named frame."
  - key: 01a19f22-2ad9-716e-876f-187e0756dd85
    statement:
      form: unwanted
      if: "a number in a structure file cites nothing"
      system: "Univ Ingest"
      shall: "refuse the structure and name the number."
    criteria:
      - key: 01a19f22-2ad9-716e-876f-187fc51a43e0
        name: "The message names the structure file, the field and the number."
  - key: 01a19f22-2ad9-716e-876f-18803a9713b5
    statement:
      form: ubiquitous
      system: "Univ Ingest"
      shall: "mark each value digitised from a figure as estimated."
    criteria:
      - key: 01a19f22-2ad9-716e-876f-18814f7bf908
        name: "A digitised value cites the figure it was read from."
  - key: 01a19f22-2ad9-716e-876f-188208f7ba13
    statement:
      form: ubiquitous
      system: "Univ Ingest"
      shall: "record, for a structure outlined from a volume grid, the grid, the threshold and the test that admitted the outline."
    criteria:
      - key: 01a19f22-2ad9-716e-876f-1883e57d3f39
        name: "The test compares the outline with the galaxy catalogues that cover it, as the earlier Univ work did for voids."
      - key: 01a19f22-2ad9-716e-876f-188469a36f95
        name: "A structure whose outline fails its test is published as a point at its published position, with the reason."
  - key: 01a1cbb8-4b9e-71c0-8bbe-c9186dc7de32
    statement:
      form: ubiquitous
      system: "Univ Ingest"
      shall: "compute each model spiral arm's path from the log-spiral parameters its structure file cites, as a spiral arm over the azimuths its fit covers and as an extrapolation beyond them."
    criteria:
      - key: 01a1cbb8-4b9e-71c0-8bbe-c919a9e453c5
        name: "A spiral arm's structure file gives the arm's kink azimuth, radius at the kink, pitch angles inside and outside the kink, width and the range of azimuth its fit covers, each cited to Table 2 of Reid et al. 2019."
      - key: 01a1cbb8-4b9e-71c0-8bbe-c91a110700f5
        name: "A spiral arm's structure file gives the Galactic Centre's distance of 8.15 kpc and the Sun's height above the Galactic plane, each cited to Reid et al. 2019."
      - key: 01a1cbb8-4b9e-71c0-8bbe-c91b11550e21
        name: "The path follows ln(R / R_kink) = -(β - β_kink) tan ψ at each degree of azimuth β, with ψ the pitch angle on β's side of the kink."
      - key: 01a1cbb8-4b9e-71c0-8bbe-c91c1ebda9f7
        name: "The path is given in heliocentric galactic Cartesian kiloparsecs, with the Sun at azimuth 0 and 8.15 kpc from the Galactic Centre, azimuth increasing toward l = 90°, and the Galactic plane below the Sun by the Sun's cited height."
      - key: 01a1cbb8-4b9e-71c0-8bbe-c91d880c4cef
        name: "A spiral arm's path spans the range of azimuth its fit covers and no more."
      - key: 01a1cbb8-4b9e-71c0-8bbe-c91edb14b44d
        name: "An extrapolation's path runs on from each end of its arm's fitted range for up to 90° of azimuth, ending where its Galactocentric radius first leaves 3 to 16 kpc, and passes through the fitted range between."
      - key: 01a1cbb8-4b9e-71c0-8bbe-c91f12de3fd5
        name: "Each point of a spiral arm's or an extrapolation's path is a reconstructed value whose derivation names the formula, the parameters and the Galactic Centre's distance it was computed from."
      - key: 01a1cbb8-4b9e-71c0-8bbe-c92011bf8744
        name: "A spiral arm and its extrapolation have the status model, and the scale domain of the Galaxy tracers."
