key: 01a19f22-2ad9-716e-876f-186219f4e104
slug: normalize-records
name: "Normalize records"
body: "Turning each source's rows into univ-model values while keeping what the source published."
realizes:
  - 01a19f1e-d177-716d-b124-3cee44add674
  - 01a19f1e-d177-716d-b124-3cf3def064d0
requirements:
  - key: 01a19f22-2ad9-716e-876f-18637db5e446
    statement:
      form: ubiquitous
      system: "Univ Ingest"
      shall: "convert each catalogue entry into univ-model values while keeping each native value."
    criteria:
      - key: 01a19f22-2ad9-716e-876f-186415c2b2be
        name: "Each position is stored in ICRS with the epoch of its source."
      - key: 01a19f22-2ad9-716e-876f-1865763fa63d
        name: "Each native value keeps its published unit beside the normalized value."
      - key: 01a19f22-2ad9-716e-876f-18663bbd5e71
        name: "Normalized values use degrees for angles, km/s for velocities, parsecs for stellar distances and megaparsecs for extragalactic ones."
      - key: 01a19f22-2ad9-716e-876f-1867aeb456fd
        name: "Each value is classified by its kind of value."
      - key: 01a1a232-7345-778b-a4c5-046f187e8323
        name: "A redshift read from a published velocity that its source definition infers, without the source stating it, to stand for a comoving distance is inferred, not measured."
      - key: 01a19f22-2ad9-716e-876f-186820f4df2c
        name: "Each uncertainty is typed as a symmetric error, an asymmetric interval, a stated interval with no probability, an upper or lower limit, a credible region, or none reported."
      - key: 01a19f22-2ad9-716e-876f-186959bf0d6e
        name: "A value published without an uncertainty is marked as having none reported, never as having zero uncertainty."
      - key: 01a1a931-2c8a-73a8-91f2-59032696dddd
        name: "An uncertainty a source states once for its whole catalogue, such as 2dFGRS's rms of 85 km/s or 2MPZ's photometric redshift scatter of 0.015, is given to each of its values as an estimated uncertainty that cites where it is stated."
      - key: 01a1aa2d-9931-7550-bba8-ae02a06fd78a
        name: "A redshift error that a source defines as a multiple of another column, such as ALFALFA's half the error on the HI line's width, is that column's value times the stated factor."
      - key: 01a1aa2d-9931-7550-bba8-ae03b8e720b0
        name: "A source read from files reads FITS binary tables or gzipped CSV tables, the latter in pieces of whole lines, so that no file is held unpacked whole."
  - key: 01a19f22-2ad9-716e-876f-186a829fb7fa
    statement:
      form: ubiquitous
      system: "Univ Ingest"
      shall: "record each distance with its kind, its measure, its method and, where it depends on one, its Hubble constant or cosmology."
    criteria:
      - key: 01a19f22-2ad9-716e-876f-186b82bcfc95
        name: "The kinds of distance are parallax, geometric or photogeometric, primary indicator, secondary indicator, spectroscopic redshift and photometric redshift."
      - key: 01a19f22-2ad9-716e-876f-186c1d4c0f38
        name: "The method names the indicator, such as Cepheids, the tip of the red giant branch, masers, type Ia supernovae, surface brightness fluctuations, Tully-Fisher or fundamental plane."
      - key: 01a19f22-2ad9-716e-876f-186d9b7a0c04
        name: "A distance published in h⁻¹ Mpc or for a stated Hubble constant keeps that constant beside its native value."
      - key: 01a19f22-2ad9-716e-876f-186e940da69e
        name: "A distance modulus is kept as published beside the distance derived from it."
      - key: 01a1a147-6018-75e1-9409-3f835cca0e82
        name: "Each distance names its measure: luminosity, comoving, Euclidean or unspecified."
      - key: 01a1a147-6018-75e1-9409-3f8400aee970
        name: "A distance derived from a distance modulus is a luminosity distance."
  - key: 01a19f22-2ad9-716e-876f-186f83aad488
    statement:
      form: ubiquitous
      system: "Univ Ingest"
      shall: "keep each redshift in the frame its source published it in and derive its value in the CMB frame."
    criteria:
      - key: 01a19f22-2ad9-716e-876f-187089f08fa0
        name: "A heliocentric redshift is kept as measured."
      - key: 01a1a931-2c8a-73a8-91f2-59042cfff012
        name: "A barycentric redshift, such as DESI's, is kept as measured and named barycentric, never relabelled heliocentric."
      - key: 01a19f22-2ad9-716e-876f-187151a4aac5
        name: "The CMB-frame redshift uses the Planck 2018 dipole of 369.82 km/s toward galactic longitude 264.021° and latitude 48.253°."
      - key: 01a19f22-2ad9-716e-876f-1872f4143cd2
        name: "The derivation is recorded with the redshift it was derived from."
  - key: 01a1a6e4-22e1-765d-b404-01f2606141e8
    statement:
      form: ubiquitous
      system: "Univ Ingest"
      shall: "keep each colour index a source publishes for a star, between the two bands the source names."
    criteria:
      - key: 01a1a6e4-22e1-765d-b404-01f30c829322
        name: "Hipparcos-2's B−V and V−I and Gaia DR3's BP−RP are kept as measured colour indices, each naming its two bands."
      - key: 01a1a6e4-22e1-765d-b404-01f45f5a703d
        name: "A colour index keeps the uncertainty its source publishes, and one published without an uncertainty is marked as having none reported."
      - key: 01a1a6e4-22e1-765d-b404-01f5d5a8d638
        name: "A colour index computed from two magnitudes a source publishes, such as the Gaia Catalogue of Nearby Stars' BP and RP, is derived and names the two magnitudes it was computed from."
  - key: 01a1c7c5-a164-7706-ad2c-c82d69fadcb8
    statement:
      form: ubiquitous
      system: "Univ Ingest"
      shall: "keep each age a source publishes for a star cluster, with the logarithm of the age as published."
    criteria:
      - key: 01a1c7c5-a164-7706-ad2c-c82eaf9e36dd
        name: "Hunt & Reffert 2023's 50th percentile of the logarithm of an open cluster's age is kept as an estimated age in years, with its 16th and 84th percentiles as a 68% credible interval."
      - key: 01a1c7c5-a164-7706-ad2c-c82fc742d77b
        name: "An age keeps its native value, the base-10 logarithm of the age in years as its source publishes it, beside its normalized value in years."
      - key: 01a1c7c5-a164-7706-ad2c-c830ff27afdf
        name: "An open cluster whose source publishes no age has none, and is not given one."
  - key: 01a1a6e4-22e1-765d-b404-01f6f668422b
    statement:
      form: ubiquitous
      system: "Univ Ingest"
      shall: "keep each spectral type a source publishes for a star as the text the source gives."
    criteria:
      - key: 01a1a6e4-22e1-765d-b404-01f71d672808
        name: "A spectral type is kept character for character as its source publishes it, with that source."
      - key: 01a1a6e4-22e1-765d-b404-01f809221737
        name: "A spectral type its source classified from a star's spectrum, such as the Hipparcos catalogue's, is measured."
      - key: 01a1a6e4-22e1-765d-b404-01f9d5d7fa2d
        name: "A spectral type a source estimated from a model fitted to low-resolution spectra, such as Gaia DR3's ESP-HS class, is estimated."
  - key: 01a19f22-2ad9-716e-876f-18734f56d5aa
    statement:
      form: unwanted
      if: "a catalogue entry fails validation"
      system: "Univ Ingest"
      shall: "leave the entry out of the release and count it under its reason."
    criteria:
      - key: 01a19f22-2ad9-716e-876f-187496ae140f
        name: "The source's provenance gives the count of entries left out for each reason."
      - key: 01a19f22-2ad9-716e-876f-18755300ea38
        name: "No entry is left out without a reason recorded."
      - key: 01a1a147-6018-75e1-9409-3f8501160747
        name: "A row whose cells are all blank is left out under the reason `blank_row`."
  - key: 01a1aa2d-9931-7550-bba8-ae0461c674ae
    statement:
      form: ubiquitous
      system: "Univ Ingest"
      shall: "leave out the rows that a source definition's rules select out, as a query's WHERE clause would for a source read whole from a file, and count them."
    criteria:
      - key: 01a1aa2d-9931-7550-bba8-ae05fcc0d255
        name: "A rule's condition tests one column with exactly one of: the cell is one of a list of values, none of a list of values, or a number below a bound."
      - key: 01a1aa2d-9931-7550-bba8-ae06fd8a5b30
        name: "A row a rule selects out of the source, such as another survey's redshift that GAMA re-serves or a star in a galaxy survey, is counted under the reason `outside_selection`, and the rule's basis says why."
      - key: 01a1aa2d-9931-7550-bba8-ae077f98b2cc
        name: "A cell too large for a double to hold exactly, such as an SDSS specObjID, is compared with a condition's values as text."
  - key: 01a19f22-2ad9-716e-876f-1876f53660fb
    statement:
      form: ubiquitous
      system: "Univ Ingest"
      shall: "fix a known defect of a source only as its source definition states the fix."
    criteria:
      - key: 01a19f22-2ad9-716e-876f-1877e0c274f2
        name: "Each fix in a source definition names the defect, the change it makes and the evidence for it."
      - key: 01a19f22-2ad9-716e-876f-187827977f54
        name: "Cosmicflows-4's SGX, SGY and SGZ columns are read as km/s, as the evidence shows, although VizieR labels them Mpc."
      - key: 01a19f22-2ad9-716e-876f-18790159a9dd
        name: "The source's provenance lists each fix applied with the number of entries it changed."
  - key: 01a1c319-7860-76e8-92ac-c601520a52af
    statement:
      form: ubiquitous
      system: "Univ Ingest"
      shall: "classify a Bailer-Jones 2021 distance as inferred where the Gaia DR3 parallax of its star is less than five times its error, and as estimated otherwise."
    criteria:
      - key: 01a1c319-7860-76e8-92ac-c6027604a178
        name: "A Bailer-Jones distance of a star whose parallax is less than five times its error is inferred."
      - key: 01a1c319-7860-76e8-92ac-c603c8d6589e
        name: "A Bailer-Jones distance of a star whose parallax is zero or negative, or that has none, is inferred."
      - key: 01a1c319-7860-76e8-92ac-c6045ac7b6f1
        name: "A Bailer-Jones distance of a star whose parallax is at least five times its error is estimated."
      - key: 01a1c319-7860-76e8-92ac-c605905af8ee
        name: "The ratio of five and its basis are stated in the ranking rule, which the release records."
      - key: 01a1c319-7860-76e8-92ac-c606e2fa0dcc
        name: "A star keeps the Gaia DR3 parallax and parallax error that its distance's kind of value rests on, as measured values."
      - key: 01a1c319-7860-76e8-92ac-c6074783ae9b
        name: "An inferred distance places its star as any other distance does, under the ranking rule's threshold for a distance too uncertain to place."
  - key: 01a1c319-7860-76e8-92ac-c608fc0fd4c3
    statement:
      form: ubiquitous
      system: "Univ Ingest"
      shall: "keep for each Galaxy tracer the kind of object it is and the distance its source publishes, with that source's uncertainty, method and kind of value."
    criteria:
      - key: 01a1c319-7860-76e8-92ac-c609c99b51a3
        name: "Each Galaxy tracer names its kind of object: open cluster, globular cluster, classical Cepheid, RR Lyrae star or star-forming region."
      - key: 01a1c319-7860-76e8-92ac-c60af84ad06b
        name: "A Cepheid or RR Lyrae star keeps its pulsation type as its source publishes it."
      - key: 01a1c319-7860-76e8-92ac-c60bab2a9a0e
        name: "A Cepheid's or RR Lyrae star's distance is an estimated primary-indicator distance whose method names the relation its source used."
      - key: 01a1c319-7860-76e8-92ac-c60c55259d8f
        name: "An open or globular cluster's distance is an estimated distance whose method names how its source derived it."
      - key: 01a1c319-7860-76e8-92ac-c60d21b0fe2e
        name: "A maser's parallax is kept as measured with its error, and a distance is derived from it only under the parallax rule of the ranking rule."
      - key: 01a1c319-7860-76e8-92ac-c60efaeb5601
        name: "A Cepheid or RR Lyrae star joins the object of its Gaia DR3 source by the source id its source gives, as a published cross-identification."
