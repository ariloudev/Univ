key: 01a19f1a-685d-7357-b67e-d658085bf5c8
slug: univ-ingest
name: "Univ Ingest"
body: |
  The command-line tool, run on the owner's machine, that downloads public sky data, normalizes
  it, resolves catalogue entries into objects, and publishes the result as a release that Univ
  Server serves.

  Ingest runs offline from the server: nothing in Univ Server fetches from a data provider. A
  release is built whole on the owner's machine and published only once it is complete.
