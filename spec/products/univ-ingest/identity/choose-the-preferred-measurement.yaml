key: 01a19f23-636e-7035-8185-ab97eb9c2fb9
slug: choose-the-preferred-measurement
name: "Choose the preferred measurement"
body: |
  Choosing which of an object's measurements places it in three dimensions. A ranking by method
  alone would misplace galaxies: at a recession velocity of 15,000 km/s a Tully-Fisher distance
  carries about 20% error, while a redshift distance, with a peculiar velocity of 300 km/s, carries
  about 2%. So the rule weighs each measurement's uncertainty first and its method second.

  A redshift distance can still be far off: near a cluster, infall moves a galaxy's redshift away
  from the Hubble flow, and close by, the peculiar velocity outweighs the recession velocity. So a
  redshift-independent distance beats a redshift distance whose uncertainty passes a threshold,
  and a distance whose uncertainty exceeds its value places nothing.
realizes:
  - 01a19f1e-d177-716d-b124-3cee44add674
  - 01a19f1e-d177-716d-b124-3cef889e66e6
requirements:
  - key: 01a19f23-636e-7035-8185-ab988f5d57b7
    statement:
      form: ubiquitous
      system: "Univ Ingest"
      shall: "choose as an object's preferred distance the measurement that ranks first by fractional distance uncertainty and method rank."
    criteria:
      - key: 01a19f23-636e-7035-8185-ab998407d632
        name: "The uncertainty of a redshift distance includes a peculiar-velocity term, 300 km/s unless the release's ranking rule sets another."
      - key: 01a1a147-6018-75e1-9409-3f77617e6ee1
        name: "Where any geometric, primary-indicator or secondary-indicator distance is a candidate, every redshift distance whose fractional uncertainty, with its peculiar-velocity term, exceeds the threshold the release's ranking rule states is set aside."
      - key: 01a1a147-6018-75e1-9409-3f788275d038
        name: "Among the remaining candidates with a published uncertainty, the one with the smallest fractional distance uncertainty leads."
      - key: 01a19f23-636e-7035-8185-ab9ac704109a
        name: "A tie is broken by method rank: geometric, then primary indicator, then secondary indicator, then spectroscopic redshift, then photometric redshift."
      - key: 01a1a147-6018-75e1-9409-3f79f4feda94
        name: "A candidate without a published uncertainty wins only if its method rank is strictly better than that of every remaining candidate with a published uncertainty."
      - key: 01a1a149-623d-7310-8064-e65204c3c532
        name: "Where no candidate without a published uncertainty wins, the leader among the candidates with a published uncertainty wins."
      - key: 01a1a149-623d-7310-8064-e653f6590128
        name: "Where more than one candidate without a published uncertainty qualifies to win, the one with the best method rank wins."
      - key: 01a1a149-623d-7310-8064-e6548a057bc6
        name: "Where qualifying candidates without a published uncertainty share the best method rank, the one whose source the ranking rule lists first wins."
      - key: 01a1a149-623d-7310-8064-e655ca08d473
        name: "A candidate published without an uncertainty is given none in the ranking, never an invented one."
      - key: 01a19f23-636e-7035-8185-ab9b3e95c24c
        name: "The ranking rule and its parameters are recorded in the release manifest."
      - key: 01a19f23-636e-7035-8185-ab9ce127e733
        name: "The object names its preferred measurement and the comparison that made it win: fractional uncertainty, the redshift threshold or method rank."
  - key: 01a19f23-636e-7035-8185-ab9dfac6edfe
    statement:
      form: ubiquitous
      system: "Univ Ingest"
      shall: "take an object's sky position from its catalogue entry with the smallest position uncertainty."
    criteria:
      - key: 01a19f23-636e-7035-8185-ab9e42fa2c14
        name: "A Gaia position is preferred over a Hipparcos one, and either over a survey position, unless a published uncertainty says otherwise."
  - key: 01a19f23-636e-7035-8185-ab9fe065861e
    statement:
      form: unwanted
      if: "an object has no distance, or its preferred distance has a fractional uncertainty above 1"
      system: "Univ Ingest"
      shall: "keep the object with its sky position alone and give it no derived three-dimensional position."
    criteria:
      - key: 01a19f23-636e-7035-8185-aba03617706c
        name: "The object can be looked up but appears in no tile and in no bounded volume query."
      - key: 01a1a147-6018-75e1-9409-3f7a2ff48aad
        name: "An object whose preferred distance has a fractional uncertainty above 1 (100%) is given no three-dimensional position, with \"distance too uncertain\" as the reason."
