key: 01a19f20-8e6c-7039-b16f-abe3447e87f6
slug: issue-and-revoke-keys
name: "Issue and revoke keys"
body: |
  The owner hands out an API key to each client application and can take it back. Owner
  operations are authenticated by the owner secret, which the Worker reads from its secrets.
realizes:
  - 01a19f1e-d177-716d-b124-3ce3944cd7e5
  - 01a19f1e-d177-716d-b124-3cfb28b1ac2c
  - 01a19f1e-d177-716d-b124-3cffdfae1655
requirements:
  - key: 01a19f20-8e6c-7039-b16f-abe4333991f2
    statement:
      form: event_driven
      when: "the owner issues an API key"
      system: "Univ Server"
      shall: "create the key with its label and quotas and return its secret once."
    criteria:
      - key: 01a19f20-8e6c-7039-b16f-abe5d0392ce2
        name: "The secret holds at least 256 bits of randomness."
      - key: 01a19f20-8e6c-7039-b16f-abe6140958c5
        name: "Only the SHA-256 of the secret is stored."
      - key: 01a19f20-8e6c-7039-b16f-abe78c0f59b1
        name: "The secret is returned in the response that issues it and in no later response."
      - key: 01a19f20-8e6c-7039-b16f-abe824aac9f3
        name: "A key issued without quotas gets the default quotas."
  - key: 01a19f20-8e6c-7039-b16f-abe9617a077f
    statement:
      form: event_driven
      when: "the owner revokes an API key"
      system: "Univ Server"
      shall: "refuse the key from the next request on."
    criteria:
      - key: 01a19f20-8e6c-7039-b16f-abeaf5bb032f
        name: "The revocation is recorded with its time."
      - key: 01a19f20-8e6c-7039-b16f-abeb18eac22e
        name: "The revoked key's public layers stay readable, and its private layers stay unreadable."
  - key: 01a19f20-8e6c-7039-b16f-abeccca54ce7
    statement:
      form: event_driven
      when: "the owner lists API keys"
      system: "Univ Server"
      shall: "return each key's label, issuance time, revocation time, quotas and usage, without its secret."
    criteria:
      - key: 01a19f20-8e6c-7039-b16f-abedaa177f5f
        name: "Usage gives the key's number of layers and its largest layer's number of items."
  - key: 01a19f20-8e6c-7039-b16f-abee0b691d4e
    statement:
      form: unwanted
      if: "a request to an owner operation lacks the owner secret or carries a wrong one"
      system: "Univ Server"
      shall: "refuse the request and change nothing."
    criteria:
      - key: 01a19f20-8e6c-7039-b16f-abefcb4ce396
        name: "The response status is 401."
