key: 01a19f20-8e6c-7039-b16f-abf782688cdf
slug: write-with-an-api-key
name: "Write with an API key"
body: "Proving which client a write comes from, so that each layer belongs to exactly one key."
realizes:
  - 01a19f1e-d177-716d-b124-3ce3944cd7e5
  - 01a19f1e-d177-716d-b124-3cfb28b1ac2c
  - 01a19f1e-d177-716d-b124-3cffdfae1655
requirements:
  - key: 01a19f20-8e6c-7039-b16f-abf8076cbedf
    statement:
      form: event_driven
      when: "a request carries an API key"
      system: "Univ Server"
      shall: "authenticate the key before handling the request."
    criteria:
      - key: 01a19f20-8e6c-7039-b16f-abf9f45a15c6
        name: "The key is read from the Authorization header as a bearer token."
      - key: 01a19f20-8e6c-7039-b16f-abfa34e30e20
        name: "The key is checked against the SHA-256 of the secret stored at its issuance."
  - key: 01a19f20-8e6c-7039-b16f-abfbfb3c07b7
    statement:
      form: unwanted
      if: "a write carries no API key, an unknown key or a revoked key"
      system: "Univ Server"
      shall: "refuse the write and store nothing."
    criteria:
      - key: 01a19f20-8e6c-7039-b16f-abfc63c9e57f
        name: "The response status is 401."
      - key: 01a19f20-8e6c-7039-b16f-abfd57ec4eda
        name: "The response does not say whether the key was unknown or revoked."
