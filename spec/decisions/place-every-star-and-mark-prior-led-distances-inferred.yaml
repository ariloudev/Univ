key: 01a1c319-7860-76e8-92ac-c5d2eaeea3ec
slug: place-every-star-and-mark-prior-led-distances-inferred
title: "Place every star, and mark distances that lean on the prior as inferred"
context: "Bailer-Jones et al. 2021 combine each Gaia parallax with a prior from a model of the Galaxy. Where the parallax is small against its error, the distance follows the prior more than the measurement, so drawing those stars draws the model's shape. Below G = 14 about 5% of Gaia DR3 sources have a parallax under five times its error, a share that grows quickly with fainter limits."
state:
  kind: accepted
  selectedOption: 01a1c319-7860-76e8-92ac-c5d5ff883ab1
  outcome: "Every star of the cut is placed. A Bailer-Jones distance resting on a parallax below five times its error is inferred rather than estimated, and the explorer draws those stars fainter and can hide them by their kind of value."
