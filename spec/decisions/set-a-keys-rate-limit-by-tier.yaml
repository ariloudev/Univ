slug: set-a-keys-rate-limit-by-tier
title: "Set a key's rate limit by tier"
context: "The owner can change a key's rate limit, but Cloudflare's rate-limiting binding fixes each limit, with a period of 10 or 60 seconds, in the Worker's configuration, one limit to a namespace."
state:
  kind: accepted
  selectedOption: 01a1a2b8-447e-752b-832a-974a73ff166f
  outcome: "Each key has one of three rate-limit tiers, each a namespace of the binding, and the owner moves a key between them."
