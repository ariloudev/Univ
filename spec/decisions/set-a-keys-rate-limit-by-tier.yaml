  - key: 01a1a2b8-447e-752b-832a-9748d1e3d3f8
    kind: local
    label: "Owner control"
    statement: "The owner can give one key a different request rate without redeploying the Worker."
  - key: 01a1a2b8-447e-752b-832a-974968581f94
    kind: local
    label: "Cheap requests"
    statement: "Counting a request adds no write to storage."
options:
  - key: 01a1a2b8-447e-752b-832a-974a73ff166f
    title: "Tiers"
    description: "A few binding namespaces at fixed rates, and a tier recorded on each key."
  - key: 01a1a2b8-447e-752b-832a-974b4f188ee5
    title: "Fixed limits"
    description: "One rate for every key and one for anonymous clients, set in the configuration only."
  - key: 01a1a2b8-447e-752b-832a-974cf390de3c
    title: "Count in storage"
    description: "Each key's requests counted per window in D1 or a Durable Object, against any rate the owner sets."
