    kind: local
    label: "One thing, one id"
    statement: "A body has one id that layers can link to."
  - key: 01a19f25-5955-701e-b3cf-dd8c498fd993
    kind: local
    label: "Effort"
    statement: "The first version stays buildable."
options:
  - key: 01a19f25-5955-701e-b3cf-dd8d24e2515f
    title: "Cross-match now"
    description: "Ingest resolves entries into objects with a method and a confidence."
  - key: 01a19f25-5955-701e-b3cf-dd8eefb4f3e4
