slug: cross-match-catalogues-in-the-first-version
title: "Cross-match catalogues in the first version"
context: "One galaxy can appear in SDSS, 2MRS, 2M++, 6dFGS and Cosmicflows-4. Without cross-matching it is counted several times and a layer cannot point at it as one thing."
state:
  kind: accepted
  selectedOption: 01a19f25-5955-701e-b3cf-dd8d24e2515f
  outcome: "Univ Ingest resolves catalogue entries into objects, and Univ Server serves one object per body."
