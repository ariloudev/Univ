    kind: cost
    statement: "Stars are served at their catalogue epoch, J2016.0 for Gaia and J1991.25 for Hipparcos, and a client wanting another epoch propagates them itself."
  - key: 01a19f26-4a07-7397-bc96-1223abfb5873
    kind: cost
    statement: "Objects carry no lookback time, and a client computes it from the redshift and the release cosmology."
  - key: 01a19f26-4a07-7397-bc96-1224bc0774b3
    kind: benefit
    statement: "Release pinning and item versions still give a record of what was published."
