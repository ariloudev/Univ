key: 01a19f25-5955-701e-b3cf-de21752217fa
slug: keep-time-in-temporal-layers
title: "Keep time in temporal layers rather than a 4D store"
context: "The owner first asked for 4D, spacetime-like storage: positions at an epoch, events in spacetime, lookback time and history. On reflection the owner dropped it, since layer items already carry time records and versions."
state:
  kind: accepted
  selectedOption: 01a19f26-4a07-7397-bc96-122035ec7352
  outcome: "Time lives in layers: items carry time records that queries filter on, and versions that stay readable by number. Reference data names each position's epoch but is not propagated in time."
drivers:
  - key: 01a19f26-4a07-7397-bc96-121e0533fd71
    kind: local
    label: "Events in time"
    statement: "Cosmic events can be placed and queried in time."
  - key: 01a19f26-4a07-7397-bc96-121f12f4121b
    kind: local
    label: "Simplicity"
    statement: "The first version carries no time machinery it does not need."
options:
  - key: 01a19f26-4a07-7397-bc96-122035ec7352
    title: "Temporal layers"
    description: "Time records and versions on layer items, with queries filtered by time records."
  - key: 01a19f26-4a07-7397-bc96-1221c0b73942
    title: "4D store"
    description: "Temporal layers plus star propagation to any epoch, lookback time on every object and as-of reads of layers at any past time."
