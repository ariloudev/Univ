    rating: supports
    rationale: "time lives in one place"
  - option: 01a19f26-4a07-7397-bc96-1221c0b73942
    driver: 01a19f26-4a07-7397-bc96-121e0533fd71
    rating: supports
    rationale: "items carry the same time records"
  - option: 01a19f26-4a07-7397-bc96-1221c0b73942
    driver: 01a19f26-4a07-7397-bc96-121f12f4121b
    rating: conflicts
    rationale: "propagation, lookback derivation and as-of reads add machinery to both products"
consequences:
