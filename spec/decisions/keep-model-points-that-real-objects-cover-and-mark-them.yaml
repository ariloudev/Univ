key: 01a213c1-93e0-7343-9f8d-9b7f788de5b5
slug: keep-model-points-that-real-objects-cover-and-mark-them
title: "Keep the model points that real objects cover, and mark them"
context: "Near the Sun, the release holds real stars and tracers where the Galaxy model also has model points. Drawn together, the two double up; with the model's points left out there, a client that hides the real stars, as the arms view does, shows a hole around the Sun."
state:
  kind: accepted
  selectedOption: 01a213c1-93e0-7343-9f8d-9b8327ffacfd
  outcome: "In each cube of 250 pc, as many of a population's model points as the cube holds real objects of that population's counterpart are marked covered, and a client draws a covered point only while the counterparts' scale domain is off."
drivers:
  - key: 01a213c1-93e0-7343-9f8d-9b801b4133ee
    kind: local
    label: "No doubling"
    statement: "Where real objects are drawn, the model does not add to them."
  - key: 01a213c1-93e0-7343-9f8d-9b8152a77b9b
    kind: local
    label: "No hole"
    statement: "Where real objects are not drawn, the model is whole."
  - key: 01a213c1-93e0-7343-9f8d-9b82918e9328
    kind: local
    label: "Simple tiles"
    statement: "The Galaxy model's tiles stay one set for every client."
options:
  - key: 01a213c1-93e0-7343-9f8d-9b8327ffacfd
    title: "Mark them covered"
    description: "Each covered model point stays in its tile with a mark; a client hides it while it draws the real objects that cover it."
  - key: 01a213c1-93e0-7343-9f8d-9b84d8303520
    title: "Leave them out"
    description: "The model holds only the points that real objects do not cover."
  - key: 01a213c1-93e0-7343-9f8d-9b850509c984
    title: "Independent layers"
    description: "The model covers the whole Galaxy on its own, and a client draws it and the real objects one over the other."
