title: "Draw the explorer with WebGL2 around Earth"
context: "The explorer draws up to three million points from parsecs to gigaparsecs, and the person moves through them with the mouse. The cosmic-newsroom experiment draws its atlas around Earth with its own WebGL2 point pass; the Univ rules keep its code apart."
