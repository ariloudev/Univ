key: 01a1c319-7860-76e8-92ac-c5da24c9d23c
slug: take-gaia-stars-to-g-14-with-the-galaxys-tracers
title: "Take Gaia DR3 stars to G < 14, with the Galaxy's tracers"
context: "The owner asked how many more Milky Way stars a release can hold, and for a much more detailed Milky Way. Since release 10, objects are sharded across eight D1 databases of 10 GB each, and release 12 holds 36.9 million objects in about 32 GB, about 0.9 KB an object, so one database no longer bounds the stars. A 1% random sample of Gaia DR3 drawn on 2026-11-10 counts 3.1 million sources below G = 12, 7.4 million below 13, 16.8 million below 14 and 36.9 million below 15. A magnitude limit shows a bubble about the Sun, giants to kiloparsecs and dwarfs to a few hundred parsecs, so the Galaxy's disk, arms, warp and halo need tracers chosen for them."
state:
  kind: accepted
  selectedOption: 01a1c319-7860-76e8-92ac-c5de07377e8b
  outcome: "Release 13 takes Gaia DR3 stars below G = 14 with their Bailer-Jones 2021 distances, beside the Gaia Catalogue of Nearby Stars and Hipparcos, and adds open and globular clusters, classical Cepheids, RR Lyrae stars, maser parallaxes and the Edenhofer 2024 dust map."
