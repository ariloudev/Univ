slug: draw-reid-2019s-spiral-arms-as-a-model-extrapolated-around-the-disk
title: "Draw Reid 2019's spiral arms as a model, extrapolated around the disk"
context: "Young tracers show the arms only within about 5 kpc of the Sun. Reid et al. 2019 (ApJ 885, 131) fit a log spiral with a kink to the maser parallaxes of each of seven arms, over the range of azimuth their masers cover, and draw the arms further in their Figure 1 by hand-adjusted extensions that their Table 2 does not give."
state:
  kind: accepted
  selectedOption: 01a1cbb8-4b9d-727f-bb23-4976708e4d5f
  outcome: "Each arm of Reid et al. 2019's Table 2 is a spiral arm structure over its fitted range and an extrapolation structure that carries the same formula up to 90° beyond each end, both of the status model."
