consequences:
  - key: 01a1cca1-1789-7424-a53b-b6d40e4c027a
    kind: cost
    statement: "The release schema moves to version 8; the releases a store holds are migrated in place, and the next release is built as a change on them."
  - key: 01a1cca1-1789-7424-a53b-b6d522e85dfa
    kind: obligation
    statement: "The gate refuses a JSON column in a table that grows with the objects, and a JSON function over a stored column outside the tables bounded by sources and structures."
  - key: 01a1cca1-1789-7424-a53b-b6d6eba41dbc
    kind: obligation
    statement: "The science checks read the tables that grow with the objects through an index, and fail a check whose query plan scans one whole."
  - key: 01a1cca1-1789-7424-a53b-b6d7c8c65034
    kind: benefit
    statement: "A maser's arm, a flag or a reference is found by an index, so checks and future API filters on them take milliseconds."
