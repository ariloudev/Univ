    driver: 01a1cca1-1789-7424-a53b-b6cea57a67e0
    rating: neutral
    rationale: "indexed only for the expressions chosen in advance"
  - option: 01a1cca1-1789-7424-a53b-b6d35ac3ea97
    driver: 01a1cca1-1789-7424-a53b-b6cfce741861
    rating: conflicts
    rationale: "each new expression needs its own index, added by judgement"
  - option: 01a1cca1-1789-7424-a53b-b6d35ac3ea97
