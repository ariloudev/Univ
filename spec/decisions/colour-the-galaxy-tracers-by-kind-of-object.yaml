key: 01a1cbb8-4b9d-727f-bb23-49695a2f5631
slug: colour-the-galaxy-tracers-by-kind-of-object
title: "Colour the Galaxy tracers by kind of object"
context: "Each Galaxy tracer is drawn in the colour of the source of its preferred distance. A tracer joined to its Gaia DR3 star is often placed by the Gaia parallax or the Bailer-Jones distance, so Cepheids, RR Lyrae stars and luminous hot stars share Gaia's colours. Release 14 already lists eight sources for seven colours, so the masers share Bailer-Jones's colour. Tiles give each point its source but not its kind of object."
state:
  kind: accepted
  selectedOption: 01a1cbb8-4b9d-727f-bb23-496dadfc9258
  outcome: "Tiles of the Galaxy tracers domain carry each point's kind of object from encoding version 4, and the explorer colours and switches the tracers by it."
