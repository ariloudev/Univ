key: 01a1a931-2c8a-73a8-91f2-58da6aab49a1
slug: add-desi-and-the-galaxy-surveys-to-release-10
title: "Add DESI DR1 and seven more galaxy surveys to release 10"
context: "The owner asked to add DESI DR1 and the COSMOS-Web groups, deferred from the first release, and to weigh 2dFGRS, GAMA, ALFALFA, the rest of BOSS and eBOSS, the photometric all-sky catalogues and Euclid. Each was read against its paper and terms on 2026-11-05. Euclid's first full data release is not public, and the COSMOS-Web groups cover 0.45 square degrees with photometric group redshifts and no stated licence. The owner accepts larger redshift errors for a more complete catalogue."
state:
  kind: accepted
  selectedOption: 01a1a931-2c8a-73a8-91f2-58ddf62e9738
  outcome: "Release 10 adds DESI DR1, the rest of SDSS DR17, 2dFGRS, GAMA DR4, ALFALFA α.100, 2MPZ and WISE × SuperCOSMOS, quasars included, while Euclid waits for its first full data release and the COSMOS-Web groups for a deep-field scale domain."
