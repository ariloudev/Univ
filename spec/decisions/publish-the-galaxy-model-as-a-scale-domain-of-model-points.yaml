key: 01a213c1-93e0-7343-9f8d-9b8834d491e0
slug: publish-the-galaxy-model-as-a-scale-domain-of-model-points
title: "Publish the Galaxy model as a scale domain of model points"
context: "Observed stars and tracers show the Milky Way only within a few kiloparsecs of the Sun, so the Galaxy does not look like a spiral galaxy from outside. A model of its whole light, from cited parameters, fills it in; the model is to be reused by another client than Univ Explorer, a separate fiction project, which wants the Galaxy as visual points: a position, a colour and a brightness for each, about 10 million in all."
state:
  kind: accepted
  selectedOption: 01a213c1-93e0-7343-9f8d-9b8ce502f902
  outcome: "Univ Ingest samples 10,000,000 model points from a cited definition into a Galaxy model scale domain, tiled in encoding version 5, and publishes the definition with the release; univ-model holds the sampler."
drivers:
  - key: 01a213c1-93e0-7343-9f8d-9b89f443d391
    kind: local
    label: "Reuse"
    statement: "Any client, not only Univ Explorer, gets the same model Galaxy from Univ Server."
  - key: 01a213c1-93e0-7343-9f8d-9b8a4d9ea3bc
    kind: local
    label: "Apart from observation"
    statement: "Model points are never taken for observed objects: they are not searched, looked up or counted as objects."
  - key: 01a213c1-93e0-7343-9f8d-9b8b2e419b6a
    kind: local
    label: "Rows at scale"
    statement: "Ten million points add no rows to the tables that grow with a release's objects."
options:
  - key: 01a213c1-93e0-7343-9f8d-9b8ce502f902
    title: "Points in a scale domain"
    description: "Univ Ingest samples the model points and tiles them as a scale domain of their own, with no object behind them, in an encoding without object ids; the definition is published beside them."
  - key: 01a213c1-93e0-7343-9f8d-9b8dd78f2926
    title: "Definition only"
    description: "The release publishes only the definition, and each client samples its own points from it."
  - key: 01a213c1-93e0-7343-9f8d-9b8eb4301a3e
    title: "Model objects"
    description: "Each model point is an object of the release, with rows in D1 like an observed star."
