key: 01a1cbb8-4b9d-727f-bb23-497b27ad83d0
slug: trace-the-spiral-arms-with-zari-2021s-luminous-hot-stars
title: "Trace the spiral arms with Zari 2021's luminous hot stars"
context: "Young open clusters show arm segments within about 3 kpc of the Sun. Hot young stars trace the arms further, as the Gaia-based maps of Poggio et al. 2021 and of Gaia Collaboration, Drimmel et al. 2023 show. Of the published Gaia samples, Zari et al. 2021 (A&A 650, A112) gives 417,535 OB and late-B to A stars brighter than M_K = 0 on VizieR, with astro-kinematic distance percentiles but no parallax errors; ALS III (Pantaleoni González et al. 2025) gives about 14,000 confirmed massive stars only through its own website, with no licence stated; Xu et al. 2021 (A&A 645, L8) gives 9,750 spectroscopic OB stars with parallaxes and no distances; the Drimmel et al. 2023 sample of about 580,000 stars is published only as its query."
state:
  kind: accepted
  selectedOption: 01a1cbb8-4b9d-727f-bb23-497fc8ee522c
  outcome: "Zari et al. 2021's filtered sample is a Galaxy tracer source of luminous hot stars, whose astro-kinematic distances are inferred and whose stars join their Gaia DR3 objects by source id."
