slug: publish-reference-data-as-immutable-releases
title: "Publish reference data as immutable, numbered releases"
context: "Layers and clients point at reference objects, so positions and ids must not shift beneath them unannounced."
state:
  kind: accepted
  selectedOption: 01a19f25-5955-701e-b3cf-dde12e103570
  outcome: "Reference data changes only by publishing a new release, and any unpruned release can be read."
drivers:
  - key: 01a19f25-5955-701e-b3cf-dddf3d2c8f89
    kind: local
    label: "Stable references"
    statement: "A link made today still means the same object later."
  - key: 01a19f25-5955-701e-b3cf-dde0a46708d8
    kind: local
    label: "Reproducible reads"
    statement: "A pinned read returns the same data every time."
options:
  - key: 01a19f25-5955-701e-b3cf-dde12e103570
    title: "Immutable releases"
    description: "Each ingest publishes a new numbered release, latest points to the newest, and ids carry across."
  - key: 01a19f25-5955-701e-b3cf-dde296662a92
    title: "Latest only"
    description: "Each ingest replaces the previous data."
