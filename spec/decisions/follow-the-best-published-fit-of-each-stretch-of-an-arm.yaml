slug: follow-the-best-published-fit-of-each-stretch-of-an-arm
title: "Follow the best published fit of each stretch of an arm"
context: "Reid et al. 2019 fit the arms only over the azimuths their masers cover, about −23° to 115°, so the far side of the Galactic Centre has no fit of theirs. A few papers reach beyond: Sanna et al. 2017 measured a maser's parallax on the far side of the Scutum-Centaurus arm, about 0.25 kpc from Reid's own fit of that arm carried on to β = −192°; Dame & Thaddeus 2011 and Sun et al. 2024 fit the outer Scutum-Centaurus arm in CO; Hyland et al. 2026 fit the Perseus arm out to β ≈ 180°; Dame & Thaddeus 2008 found the far 3-kpc arm. Others argue against a simply symmetric Galaxy: Xu et al. 2023 pair Perseus with Norma rather than with Scutum-Centaurus, and Lin et al. 2026 find the far Sagittarius and Perseus arms converging."
state:
  kind: accepted
  selectedOption: 01a213c1-93e0-7343-9f8d-9b799b06ddc7
  outcome: "Each stretch of an arm follows the fit whose fitted range covers it, Reid et al. 2019's first and then the far-side papers', and an extrapolation only where no fit covers it; the far-side papers' tracers enter the release as objects, and a science check measures how far each lies from its arm."
