key: 01a1b1a0-7c6e-703c-8f49-8a7e2f8c5737
slug: share-unchanged-rows-and-files-between-releases
title: "Share unchanged rows and files between releases"
context: "Measured on release 10, every release copies all of its rows: 37 GB of D1 across the catalogue database and seven object shards, published in 1 h 35 min after a 15 min build, so a release that adds one structure, a few kilobytes, costs the same as one that changes every object. ADR-16 keeps releases immutable, and AC-128 has two reads pinned to one release agree whatever is published later; a row that is never changed once written keeps both, whichever releases hold it."
state:
  kind: accepted
  selectedOption: 01a1b1a0-7c6e-703c-8f49-8a8204af6f25
  outcome: "Each row is held from the release that adds it until a release retires it, and each file once by its SHA-256, so a release writes, publishes and stores only what it changes."
drivers:
  - key: 01a1b1a0-7c6e-703c-8f49-8a7fe0d0f43a
    kind: local
    label: "Storage"
    statement: "Keeping several releases costs little more than the latest alone."
  - key: 01a1b1a0-7c6e-703c-8f49-8a80d43a94ba
    kind: local
    label: "Release time"
    statement: "A release that adds structures or one source is published in minutes, not hours."
  - key: 01a1b1a0-7c6e-703c-8f49-8a811cc27416
    kind: local
    label: "Pinned reads"
    statement: "A read pinned to a release returns the same data whatever is published after it."
options:
  - key: 01a1b1a0-7c6e-703c-8f49-8a8204af6f25
    title: "Shared rows and files"
    description: "A row carries the release that adds it and the release that retires it, if any; a file is stored under its SHA-256 and mapped by each release that holds it. A build compares its rows with an index of the latest release's rows by key and content hash."
  - key: 01a1b1a0-7c6e-703c-8f49-8a83d0b0b4af
    title: "A copy of every row per release"
    description: "As up to release 10: each release writes and publishes all of its rows and files under its own number."
  - key: 01a1b1a0-7c6e-703c-8f49-8a841db34162
    title: "Carry unchanged tables forward"
    description: "Rows stay per release, but a release's unchanged tables are copied inside D1 and R2 from the release before it rather than uploaded."
  - key: 01a1b1a0-7c6e-703c-8f49-8a851827ca0c
    title: "Cache the build's stages"
    description: "Keep normalized sources and the cross-match result between builds, so a build re-runs only what changed; publish and storage as before."
