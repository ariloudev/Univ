consequences:
  - key: 01a1b1a0-7c6e-703c-8f49-8a864fa9a80d
    kind: cost
    statement: "Every read of a release selects the rows valid in it, from the release that adds a row until the one that retires it, and reads a file through the release's map of its paths."
  - key: 01a1b1a0-7c6e-703c-8f49-8a87dc7ffeef
    kind: obligation
    statement: "The index of the latest release's rows by key and content hash must match the rows published, or a build writes the wrong change."
