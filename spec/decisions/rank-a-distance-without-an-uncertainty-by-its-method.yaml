key: 01a1a149-623d-7310-8064-e6497ba7827e
slug: rank-a-distance-without-an-uncertainty-by-its-method
title: "Rank a distance without an uncertainty by its method"
context: "In release 1, the rule of keeping every measurement and preferring the most precise distance ranked a distance published without an uncertainty after every distance with one. 129 objects whose UNGC indicator distances carry no published uncertainty were then placed by their redshift distances: M81 at 0.72 Mpc against its Cepheid distance of 3.63 Mpc, and Centaurus A at 11.85 Mpc against its TRGB distance of 3.75 Mpc. The owner chose method rank first on 2026-11-03."
state:
  kind: accepted
  selectedOption: 01a1a149-623d-7310-8064-e64c5e953132
  outcome: "A redshift distance above the release's threshold gives way to any indicator distance, and a distance without a published uncertainty wins by a strictly better method rank, with no uncertainty invented."
