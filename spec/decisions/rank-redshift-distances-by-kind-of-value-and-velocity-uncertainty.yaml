key: 01a1a24c-8649-746c-8af0-2d2cf7202314
slug: rank-redshift-distances-by-kind-of-value-and-velocity-uncertainty
title: "Rank redshift distances by kind of value and velocity uncertainty"
context: "Release 5 compared an object's redshift distances by fractional distance uncertainty, which always favours the higher of two conflicting redshifts, because the 300 km/s peculiar-velocity term is a smaller fraction of it. The redshift-conflicts check found 154 objects whose redshifts disagree by more than 1,000 km/s. In the worst five, NED agrees with 2MRS's lower value, yet the higher one placed the object: ESO 460-G001 at 6dFGS's 54,179 km/s against 2MRS's 7,520 km/s. 30 objects were placed by a 2M++ clone (Cln = 1, an estimated redshift copied from a neighbour) though they have a measured redshift. This refines the decision \"Rank a distance without an uncertainty by its method\" among redshift distances, and leaves its rule for a redshift distance against the other distances as it is. The owner chose on 2026-11-03."
state:
  kind: accepted
  selectedOption: 01a1a24c-8649-746c-8af0-2d2fb0acdca6
  outcome: "Among an object's redshift distances a measured redshift ranks first, then the smallest published velocity uncertainty, then method rank and source order, with none invented; only the first of them competes with the other distances, as before."
