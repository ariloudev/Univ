key: 01a1a931-2c8a-73a8-91f2-58eab95e4bc8
slug: publish-a-source-while-its-permission-is-pending
title: "Publish a source while its permission is pending"
context: "2MPZ, WISE × SuperCOSMOS and GAMA DR4 ask for citation and acknowledgement but state no terms for redistribution: the SuperCOSMOS Science Archive defers to a copyright summary it does not link, and GAMA's page speaks only of publications. Permission is asked of their providers. The owner wants them ingested by default while the answer is awaited."
