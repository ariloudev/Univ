notes: >-
  The position is Table S1's: the peak of the phase-reference maser channel on the first epoch,
  which the caption says is accurate to within a milliarcsecond. Table 1 also gives Galactic
  l and b for the source, the inputs of the distance PDFs; they are not used here. Sanna et al. give
  the parallax distance as well (abstract and Table S2, quoted in the parallax's row); the distance
  recorded is their combined Bayesian one, which rests on Table 1's priors as the parallax does not.
  The paper places the source in the Outer Scutum-Centaurus (OSC) arm, the far continuation of the
  Scutum-Centaurus arm found by Dame & Thaddeus; the BeSSeL compilation of Reid et al. lists it in their Table 1 with arm
  "OSC", the same parallax, a slightly different position and velocity, and fold the OSC into their
  Scutum-Centaurus-OSC arm. Table numbers S1 and S2 are those the arXiv text uses; its list of
  supplementary materials numbers them differently.
