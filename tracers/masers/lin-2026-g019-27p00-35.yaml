notes: >-
  A water (H2O) maser of the BeSSeL Survey's VLBA program BL312. The position is that of the
  strongest maser spot at the first epoch (Table A2), with no uncertainty given; velocity_lsr is
  Table 1's systemic velocity V*_LSR, which differs a little from the velocity of that spot's
  channel. Table 2 puts it most probably in the Perseus arm and next in the Outer arm; the
  probabilities compare its longitude, latitude and velocity with the far-side arm traces of Reid et
  al., not its parallax. The distance is Table 1's D, the one the paper adopts: the Gaussian fitted
  to the main peak of the product of the parallax likelihood and the kinematic likelihoods of its
  velocity and both proper motions. Table 1 also gives a kinematic-only distance, D_3DKD, not
  recorded. The paper prints no R0 or Θ0 for its rotation curve.
