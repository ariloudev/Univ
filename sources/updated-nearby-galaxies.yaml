id: updated-nearby-galaxies
title: "Updated Nearby Galaxy Catalog (Karachentsev et al. 2013)"
provider: vizier
access:
  method: vizier_tsv
  table: "J/AJ/145/101/catalog"
  constraints: []
  rows: 869
cuts:
  - "The query takes every row of the catalog table (ReadMe table1.dat + table2.dat merged by VizieR), 869 by the ReadMe and as served."
  - >-
    Only measured distances are taken: on rows whose f_Dist is h or h' (Hubble velocity-distance
    relation at H0 = 73 km/s/Mpc) or txt (likely proximity from texture; the ReadMe, Note (G1), says
    "One of a small number of dwarf galaxies (N=11)", read from
    http://vizier.nao.ac.jp/ftp/cats/J/AJ/145/101/ReadMe 2026-11-03, but the table as served
    marks 20 rows txt) the distance is an estimate, so it is
    dropped and the row kept, with its position, velocity and magnitude (fixes below).
  - "Dist has no uncertainty in this table; it is marked as none reported (per-measurement e_DM is in table6, not taken)."
  - >-
    a26, the "Major angular diameter" at the Holmberg isophote in the B band, in arcmin (ReadMe
    table1.dat, Note (1)), is taken under quality, as the model has no field for a size: the
    extent rule of the matching rules reads it as published, and it is blank on rows without one.
columns:
  - { column: Name, field: identifier, unit: dimensionless }
  - { column: _RAJ2000, field: right_ascension, unit: degree }
  - { column: _DEJ2000, field: declination, unit: degree }
  - { column: Dist, field: distance, unit: megaparsec }
  - { column: f_Dist, field: quality, unit: dimensionless }
  - { column: HRV, field: velocity, unit: kilometre_per_second }
  - { column: Bmag, field: magnitude, unit: magnitude }
  - { column: a26, field: quality, unit: arcminute }
frame: fk5_j2000
epoch: 2000.0
citation: >-
  Karachentsev I.D., Makarov D.I., Kaisina E.I. 2013, "Updated nearby galaxy catalog", AJ 145, 101.
  2013AJ....145..101K, doi:10.1088/0004-6256/145/4/101. VizieR catalogue J/AJ/145/101,
  doi:10.26093/cds/vizier.51450101.
reference: { bibcode: "2013AJ....145..101K", doi: "10.1088/0004-6256/145/4/101" }
terms:
  url: "https://cds.unistra.fr/vizier-org/licences_vizier.html"
  quote: >-
    The VizieR Information System provides a standardized description of astronomical catalogues,
    and generally a free access to the data contained therein, essentially dedicated to a scientific
    usage. The data retrieved with VizieR are free of usage in a scientific context; however, as it
    is the usage in scientific publication, the original authors and publication references
    including the publisher have to be explicitely cited (see section Code of conduct of scientific
    research).
  credit: >-
    This research has made use of the VizieR catalogue access tool, CDS, Strasbourg, France (DOI :
    10.26093/cds/vizier). The original description of the VizieR service was published in 2000,
    A&AS 143, 23. Cite Karachentsev, Makarov & Kaisina 2013, AJ 145, 101.
redistribution:
  status: permitted_with_credit
  review: provisional
  reasoning: >-
    CDS allows use of VizieR data in a scientific context with citation of the authors and
    publisher, and the ReadMe and landing-page metadata carry no catalogue-specific licence. The AAS
    terms were not checked, and "scientific context" is not defined for a public hobby release.
    Provisional: judged again before any public deployment.
scale_domain: nearby_galaxies
# VizieR's mirrors, checked 2026-11-04: China-VO answers like CDS; NAO's database was unreachable
# and IDIA broke off mid-answer, so they come last.
mirrors:
  - "https://vizier.cds.unistra.fr/viz-bin/asu-tsv"
  - "http://vizier.china-vo.org/viz-bin/asu-tsv"
  - "http://vizier.nao.ac.jp/viz-bin/asu-tsv"
  - "http://vizier.idia.ac.za/viz-bin/asu-tsv"
fixes:
  - defect: >-
      Dist mixes measured distances with estimates: on rows whose f_Dist is h or h' it is
      derived from the velocity by the Hubble relation at H0 = 73 km/s/Mpc, and on rows marked
      txt it is a guess from the galaxy's texture, not a measurement (110 rows as served).
    change: >-
      On those rows Dist is dropped and the entry kept: the galaxy is listed and matched by its
      position and velocity, and placed only by another source's distance or redshift.
    evidence: >-
      J/AJ/145/101 ReadMe Note (G1) (read from http://vizier.nao.ac.jp/ftp/cats/J/AJ/145/101/ReadMe,
      2026-11-03): h and h' are distances "by the Hubble velocity-distance relation at H0=73
      km/s/Mpc", and txt marks dwarfs whose "texture ... indicates their likely proximity". The
      definition keeps only measured distances; the rest of the row is as measured.
    action:
      kind: drop_when
      columns: [Dist]
      when: { column: f_Dist, is: [h, "h'", txt] }
  - defect: >-
      The Milky Way's row gives Dist = 0.01 Mpc (f_Dist geom): the Sun's distance from the
      Galactic centre rounded to the table's hundredth of a megaparsec, 10 kpc, 22% beyond the
      8.18 kpc measured.
    change: >-
      The row keeps its published Dist and gains, beside it, the geometric distance of the
      Galactic centre that GRAVITY Collaboration 2019 measured, R0 = 8178 pc with an error of
      25.6 pc (its 13 pc statistical and 22 pc systematic errors in quadrature); the entry is
      flagged with the citation. Its position, the direction of Sgr A*, is kept.
    evidence: >-
      The row as served by vizier.idia.ac.za on 2026-11-03: Name "Milky Way", _RAJ2000
      266.416667, _DEJ2000 -29.007778, Dist 0.01, f_Dist geom, HRV 0, Bmag -4.60. GRAVITY
      Collaboration, Abuter R. et al. 2019, "A geometric distance measurement to the Galactic
      Center black hole with 0.3% uncertainty", A&A 625, L10 (arXiv 1904.05721), abstract: "Our
      measurement uses the star S2 on its 16-year orbit around the massive black hole Sgr A*
      ... this yields a geometric distance estimate: R0 = 8178 +- 13(stat.) +- 22(sys.) pc."
    action:
      kind: add_distance
      key: Name
      unit: parsec
      distance_kind: geometric
      method: { other: orbit of the star S2 about Sgr A* }
      measure: euclidean
      mark:
        flag: distance_source
        cite: >-
          The Galactic centre's distance R0 = 8178 +- 13 (stat) +- 22 (sys) pc is GRAVITY
          Collaboration, Abuter R. et al. 2019, A&A 625, L10, 2019A&A...625L..10G, arXiv
          1904.05721, beside UNGC's own Dist of 0.01 Mpc
      values:
        "Milky Way": [8178.0, 25.6]
normalization:
  distances:
    - value: Dist
      by_code:
        column: f_Dist
        codes:
          TRGB: { kind: primary_indicator, method: tip_of_the_red_giant_branch }
          Cep: { kind: primary_indicator, method: cepheids }
          RR: { kind: primary_indicator, method: rr_lyrae }
          HB: { kind: primary_indicator, method: horizontal_branch }
          CMD: { kind: primary_indicator, method: { other: colour-magnitude diagram } }
          geom: { kind: geometric, method: { other: geometric determination } }
          SN: { kind: secondary_indicator, method: { other: supernova luminosity } }
          SBF: { kind: secondary_indicator, method: surface_brightness_fluctuations }
          TF: { kind: secondary_indicator, method: tully_fisher }
          FP: { kind: secondary_indicator, method: fundamental_plane }
          BS: { kind: secondary_indicator, method: { other: brightest stars } }
          PNLF: { kind: secondary_indicator, method: { other: planetary nebula luminosity function } }
          mem: { kind: secondary_indicator, method: { other: membership in a group with measured distances } }
      measure: unspecified
      kind_of_value: measured
      basis: >-
        J/AJ/145/101 ReadMe Note (G1) (read from http://vizier.nao.ac.jp/ftp/cats/J/AJ/145/101/ReadMe,
        2026-11-03) names each code's method. Resolved-star methods (TRGB, Cepheids, RR Lyrae,
        horizontal branch, CMD) are taken as primary indicators and the methods calibrated on them
        as secondary. For mem the members' methods are not given here, so the less direct kind,
        secondary, is taken. Dist has no error column in this table. The ReadMe calls Dist the
        "Distance to galaxy" without saying which distance, so its measure is unspecified; within
        the 11 Mpc of the catalogue the measures differ by less than 0.3%.
