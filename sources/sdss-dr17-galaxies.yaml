id: sdss-dr17-galaxies
title: "SDSS DR17 spectroscopic galaxies"
provider: skyserver
access:
  method: skyserver_sql
  # 17 chunks of about 65,000 rows each, far below SkyServer's silent 500,000-row cap.
  query: >-
    SELECT specObjID, ra, dec, z, zErr FROM SpecObj WHERE class = 'GALAXY' AND zWarning = 0
    AND z > 0.005 AND z < 0.35 AND (specObjID % {chunks}) = {chunk}
  chunks: 17
  count: >-
    SELECT COUNT_BIG(*) AS n FROM SpecObj WHERE class = 'GALAXY' AND zWarning = 0 AND z > 0.005
    AND z < 0.35
cuts:
  - "SpecObj, the DR17 view of science-primary spectra (sciencePrimary = 1; no QA, sky or duplicate spectra)."
  - "class = 'GALAXY' AND zWarning = 0 AND 0.005 < z < 0.35; the z > 0.005 cut also removes class GALAXY rows with negative z."
  - >-
    These cuts take ALL galaxy spectra in DR17, not the Main Galaxy Sample: the selection mixes
    SDSS-I/II Legacy, BOSS, eBOSS and SEGUE spectra (measured 2026-11-03: 1,097,303 rows; sdss
    793,076, boss 258,659, eboss 45,164, segue1 347, segue2 57), so its completeness is not that of
    any one target selection.
  - "ra/dec are fibre (plug) positions, stored to 5 decimals; z and zErr are float32."
  - "specObjID exceeds the 64-bit signed range (max 14126937860314781696 in this cut) and is kept as text."
columns:
  - { column: specObjID, field: identifier, unit: dimensionless }
  - { column: ra, field: right_ascension, unit: degree }
  - { column: dec, field: declination, unit: degree }
  - { column: z, field: redshift, unit: dimensionless }
  - { column: zErr, field: redshift_error, unit: dimensionless }
# SDSS documents its positions as J2000 and calibrated against UCAC; ICRS is inferred, not stated.
frame: icrs
epoch: 2000.0
citation: >-
  Abdurro'uf et al. 2022, "The Seventeenth Data Release of the Sloan Digital Sky Surveys: Complete
  Release of MaNGA, MaStar, and APOGEE-2 Data", ApJS 259, 35. 2022ApJS..259...35A,
  doi:10.3847/1538-4365/ac4414. Survey papers for the rows taken: York et al. 2000, AJ 120, 1579
  (2000AJ....120.1579Y); Strauss et al. 2002, AJ 124, 1810 (2002AJ....124.1810S); Gunn et al. 2006,
  AJ 131, 2332 (2006AJ....131.2332G); Smee et al. 2013, AJ 146, 32 (2013AJ....146...32S);
  Eisenstein et al. 2011, AJ 142, 72 (2011AJ....142...72E); Dawson et al. 2013, AJ 145, 10
  (2013AJ....145...10D); Dawson et al. 2016, AJ 151, 44 (2016AJ....151...44D). The SDSS bibcodes
  were constructed from Crossref-verified journal, volume and page; ADS was not reachable.
reference: { bibcode: "2022ApJS..259...35A", doi: "10.3847/1538-4365/ac4414" }
