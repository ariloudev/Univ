id: cosmicflows-4-galaxies
title: "Cosmicflows-4 galaxy distances"
provider: vizier
access:
  method: vizier_tsv
  table: "J/ApJ/944/94/table2"
  constraints: []
  rows: 55877
cuts:
  - >-
    No server-side cut: every row of table2 ("Distances of individual galaxies", ReadMe
    table2.dat), 55,877 by the ReadMe and its abstract ("distances are compiled for 55,877
    galaxies"). The groups table J/ApJ/944/94/groups is the source cosmicflows-4.
  - >-
    DM, the galaxy's own distance modulus "derived from an MCMC analysis incorporating all
    methodologies" (ReadMe Note 3), is the one distance taken. The eight per-method moduli
    (DMsnIa, DMtf, DMfp, DMsbf, DMsnII, DMtrgb, DMceph, DMmas, "after registration to a common
    scale with the MCMC analysis", Note 4) are read only to tell which methods DM combines, and
    their errors are not taken.
  - >-
    Table2 publishes no group distance, no heliocentric velocity and no Cartesian columns: its
    columns are PGC, 1PGC, T17, Vcmb, DM and e_DM, the eight per-method moduli and their errors,
    and RAdeg, DEdeg, GLON, GLAT, SGL and SGB (ReadMe, byte-by-byte description of table2.dat).
    So no SGX-like column needs a fix, and no group value sits on a galaxy's row.
  - >-
    Vcmb is the "Systemic velocity of the galaxy in the reference frame of the cosmic microwave
    background" (Note 2). It is kept as published under velocity, not read as a redshift: the
    normalizer moves only heliocentric redshifts to the CMB frame. The matching rules move it
    back to a heliocentric cz before comparing it with another source's (rules/matching.yaml,
    cmb_frame_velocities).
  - "T17, the group of Tempel et al. 2017, and GLON, GLAT, SGL and SGB are not taken."
columns:
  - { column: PGC, field: identifier, unit: dimensionless }
  - { column: 1PGC, field: group_id, unit: dimensionless }
  - { column: _RAJ2000, field: right_ascension, unit: degree }
  - { column: _DEJ2000, field: declination, unit: degree }
  - { column: Vcmb, field: velocity, unit: kilometre_per_second }
  - { column: DM, field: distance_modulus, unit: magnitude }
  - { column: e_DM, field: distance_modulus_error, unit: magnitude }
  - { column: DMsnIa, field: quality, unit: magnitude }
  - { column: DMtf, field: quality, unit: magnitude }
  - { column: DMfp, field: quality, unit: magnitude }
  - { column: DMsbf, field: quality, unit: magnitude }
  - { column: DMsnII, field: quality, unit: magnitude }
  - { column: DMtrgb, field: quality, unit: magnitude }
  - { column: DMceph, field: quality, unit: magnitude }
  - { column: DMmas, field: quality, unit: magnitude }
frame: fk5_j2000
epoch: 2000.0
citation: >-
  Tully R.B., Kourkchi E., Courtois H.M., Anand G.S., Blakeslee J.P., Brout D., de Jaeger T.,
  Dupuy A., Guinet D., Howlett C., et al. 2023, "Cosmicflows-4", ApJ 944, 94. 2023ApJ...944...94T,
  doi:10.3847/1538-4357/ac94d8. VizieR catalogue J/ApJ/944/94, table J/ApJ/944/94/table2,
  doi:10.26093/cds/vizier.19440094.
terms:
  url: "https://cds.unistra.fr/vizier-org/licences_vizier.html"
  quote: >-
    The VizieR Information System provides a standardized description of astronomical catalogues,
    and generally a free access to the data contained therein, essentially dedicated to a scientific
    usage. The data retrieved with VizieR are free of usage in a scientific context; however, as it
    is the usage in scientific publication, the original authors and publication references
    including the publisher have to be explicitely cited (see section Code of conduct of scientific
    research).
  credit: >-
    This research has made use of the VizieR catalogue access tool, CDS, Strasbourg, France (DOI :
    10.26093/cds/vizier). The original description of the VizieR service was published in 2000,
    A&AS 143, 23. Cite Tully et al. 2023, ApJ 944, 94.
redistribution:
  status: permitted_with_credit
  review: provisional
  reasoning: >-
    As for the groups table of the same catalogue (cosmicflows-4): CDS allows use of VizieR data in
    a scientific context with citation of the authors and publisher, and the ReadMe (read from
    http://vizier.nao.ac.jp/ftp/cats/J/ApJ/944/94/ReadMe, 2026-11-03) carries no
    catalogue-specific licence. The AAS and Extragalactic Distance Database terms were not checked.
    Provisional: judged again before any public deployment.
scale_domain: cosmic_web
mirrors:
  - "http://vizier.idia.ac.za/viz-bin/asu-tsv"
  - "http://vizier.nao.ac.jp/viz-bin/asu-tsv"
  - "http://vizier.china-vo.org/viz-bin/asu-tsv"
  - "https://vizier.cds.unistra.fr/viz-bin/asu-tsv"
normalization:
  distances:
    - value: DM
      error: { symmetric: e_DM }
      kind: secondary_indicator
      method:
        mixed:
          - fundamental_plane
          - tully_fisher
          - surface_brightness_fluctuations
          - type_ia_supernovae
          - type_ii_supernovae
          - tip_of_the_red_giant_branch
          - cepheids
          - masers
      measure: luminosity
      kind_of_value: measured
      basis: >-
        J/ApJ/944/94 ReadMe (read from http://vizier.nao.ac.jp/ftp/cats/J/ApJ/944/94/ReadMe,
        2026-11-03), table2: DM is the "Distance modulus, all methodologies" [18.46/39.53], Note 3:
        "Distance modulus of the galaxy derived from an MCMC analysis incorporating all
        methodologies and associated uncertainty", and e_DM the "Uncertainty in DM". Its range
        starts at the LMC's Cepheid modulus (DMceph [18.46/34.53]), so DM is on the absolute
        scale of the calibrators ("Cepheid period-luminosity relation and tip of the red giant
        branch observations ... with the geometric maser distance to NGC 4258 provide the
        absolute scaling of distances", abstract), not on a Hubble constant. Where any of the
        five methods FP, TF, SBF, SNIa or SNII contributes, the distance is taken as a secondary
        indicator, the kind of those methods; a rule below marks the rows that rest on TRGB,
        Cepheids or masers alone. A modulus gives a luminosity distance.
  rules:
    - when: { column: DMsnIa, is: [""] }
      and:
        - { column: DMtf, is: [""] }
        - { column: DMfp, is: [""] }
        - { column: DMsbf, is: [""] }
        - { column: DMsnII, is: [""] }
      distance:
        value: DM
        kind: primary_indicator
        method: { mixed: [tip_of_the_red_giant_branch, cepheids, masers] }
      basis: >-
        ReadMe table2: the eight per-method moduli are nullable ("?"); a row whose DMsnIa, DMtf,
        DMfp, DMsbf and DMsnII are all blank has DM from TRGB, Cepheid or maser moduli alone,
        the primary indicators of the abstract.
