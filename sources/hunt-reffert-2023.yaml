id: hunt-reffert-2023
title: "Hunt & Reffert 2023 open clusters"
provider: vizier
access:
  method: vizier_tsv
  table: "J/A+A/673/A114/clusters"
  constraints: ["Type=o"]
  rows: 6818
cuts:
  - >-
    Open clusters only: Type = o, 6,818 of the table's 7,167 rows as served by IDIA on 2026-11-10.
    The 228 moving groups (m) are left out, and the 121 globular clusters (g) come from the
    globular cluster source instead. The members (members.dat) are not taken.
  - >-
    dist16, dist50 and dist84 are the 16th, 50th and 84th percentiles of the maximum likelihood
    distance from the members' parallaxes, in pc (ReadMe). globalPlx flags clusters whose
    parallax zero point could not be corrected star by star.
  - >-
    logAge16, logAge50 and logAge84 are the 16th, 50th and 84th percentiles of the logarithm of
    the cluster's age in years (VizieR's column descriptions), estimated by the paper from its
    members' photometry. They are read as an estimated age with a 68% credible interval; the
    extinction (AV) and the colour-magnitude diagram class are not taken.
columns:
  - { column: Name, field: identifier, unit: dimensionless }
  - { column: RA_ICRS, field: right_ascension, unit: degree }
  - { column: DE_ICRS, field: declination, unit: degree }
  - { column: dist50, field: distance, unit: parsec }
  - { column: dist16, field: distance_low, unit: parsec }
  - { column: dist84, field: distance_high, unit: parsec }
  - { column: logAge50, field: age, unit: log_year }
  - { column: logAge16, field: age_low, unit: log_year }
  - { column: logAge84, field: age_high, unit: log_year }
  - { column: pmRA, field: proper_motion_ra, unit: milliarcsecond_per_year }
  - { column: pmDE, field: proper_motion_dec, unit: milliarcsecond_per_year }
  - { column: N, field: quality, unit: dimensionless }
  - { column: globalPlx, field: quality, unit: dimensionless }
frame: icrs
epoch: 2016.0
citation: >-
  Hunt E.L., Reffert S. 2023, "Improving the open cluster census. II. An all-sky cluster
  catalogue with Gaia DR3", A&A 673, A114. 2023A&A...673A.114H. VizieR catalogue J/A+A/673/A114.
reference: { bibcode: "2023A&A...673A.114H" }
terms:
  url: "https://cds.unistra.fr/vizier-org/licences_vizier.html"
  quote: >-
    The VizieR Information System provides a standardized description of astronomical catalogues,
    and generally a free access to the data contained therein, essentially dedicated to a scientific
    usage. The data retrieved with VizieR are free of usage in a scientific context; however, as it
    is the usage in scientific publication, the original authors and publication references
    including the publisher have to be explicitely cited (see section Code of conduct of scientific
    research).
  credit: >-
    This research has made use of the VizieR catalogue access tool, CDS, Strasbourg, France (DOI :
    10.26093/cds/vizier). The original description of the VizieR service was published in 2000,
    A&AS 143, 23. Cite Hunt & Reffert 2023, A&A 673, A114.
redistribution:
  status: permitted_with_credit
  review: provisional
  reasoning: >-
    CDS allows use of VizieR data in a scientific context with citation of the authors and
    publisher, and the ReadMe and landing-page metadata carry no catalogue-specific licence. The AAS
    terms were not checked, and "scientific context" is not defined for a public hobby release.
    Provisional: judged again before any public deployment.
scale_domain: galaxy_tracers
object_kind: open_cluster
# VizieR's mirrors, checked 2026-11-10: IDIA holds the table and answered first; CDS timed out
# from here that day; China-VO and NAO lag behind the newest catalogues.
mirrors:
  - "http://vizier.idia.ac.za/viz-bin/asu-tsv"
  - "https://vizier.cds.unistra.fr/viz-bin/asu-tsv"
  - "http://vizier.china-vo.org/viz-bin/asu-tsv"
flags:
  globalPlx:
    cite: "ReadMe of J/A+A/673/A114 (VizieR), Byte-by-byte Description of file clusters.dat, globalPlx"
    values:
      "0": "The parallax offset was corrected star by star during the distance calculation."
      "1": "A star-by-star parallax offset correction was not possible during the distance calculation."
normalization:
  distances:
    - value: dist50
      error: { credible_interval: { low: dist16, high: dist84, probability: 0.68 } }
      kind: geometric
      method: trigonometric_parallax
      measure: euclidean
      kind_of_value: estimated
      basis: >-
        J/A+A/673/A114 ReadMe: dist16, dist50 and dist84 are the "16th", "50th" and "84th
        percentile of maximum likelihood distance", computed from the Gaia DR3 parallaxes of the
        cluster's members (Ndist, "Number of stars used for distance calculation"). The
        percentiles are kept as published.
  ages:
    - value: logAge50
      error: { credible_interval: { low: logAge16, high: logAge84, probability: 0.68 } }
      kind_of_value: estimated
      basis: >-
        VizieR's column descriptions of J/A+A/673/A114/clusters (fetched 2026-11-10): logAge16,
        logAge50 and logAge84 are the "16th percentile of logarithm of cluster age", "50th
        percentile of logarithm of cluster age" and "84th percentile of logarithm of cluster
        age", in [yr]. The age is a model estimate from the members' photometry, not a direct
        measurement, so it is estimated; the percentiles are kept as published.
