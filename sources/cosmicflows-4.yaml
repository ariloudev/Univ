mirrors:
  - "https://vizier.cds.unistra.fr/viz-bin/asu-tsv"
  - "http://vizier.idia.ac.za/viz-bin/asu-tsv"
  - "http://vizier.nao.ac.jp/viz-bin/asu-tsv"
  - "http://vizier.china-vo.org/viz-bin/asu-tsv"
fixes:
  - defect: >-
      SGX, SGY and SGZ are labelled Mpc in the ReadMe and by VizieR, but hold km/s: they are the
      Local Sheet velocity Vls times the supergalactic unit vector, positions in velocity space.
    change: >-
      SGX, SGY and SGZ are read as km/s (velocity-space supergalactic Cartesian coordinates), not as
      Mpc. No distance is taken from them.
    evidence: >-
      (1) The ReadMe contradicts itself: the unit column says Mpc while the description says
      "Cartesian supergalactic coordinates of group, observed velocity units"; VizieR serves the same
      unit and description. (2) The stated SGX range [-22455/23499] cannot be Mpc when the same
      table's Dist range is [0.1/773] Mpc. (3) On 2,000 served rows (vizier.idia.ac.za, 2026-11-03)
      sqrt(SGX^2+SGY^2+SGZ^2) equals |Vls| within 2 km/s, e.g. 1PGC 12: Vls = 6669, (SGX, SGY, SGZ) =
      (1848, -6271, 1312), norm 6668; 1PGC 6830: Vls = -157, (40, 141, 56), norm 157.
