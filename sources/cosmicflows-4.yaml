    evidence: >-
      The groups row as served by vizier.nao.ac.jp on 2026-11-03: 1PGC 5064336, Ngal 2, DMzp
      20.369, DMav 0.000, e_DMav 0.000, o_DMcal 4, DMcal 20.369, e_DMzp 0.100, Dist 0.1 Mpc, Vh
      10, V3k -15, RAJ2000 266.5276, DEJ2000 -29.9245, GLON 359.2117, GLAT -0.6057: the
      direction of the Galactic centre, and a modulus averaged over four calibrator galaxies
      (o_DMcal). Its table2 members are Leo I (PGC 29488, DM 22.050, at RA 152.1166, Dec
      +12.3064) and Leo II (PGC 34176, DM 21.920, RA 168.3671, Dec +22.1527), satellites of the
      Milky Way 250 kpc away in another direction. The group's dominant galaxy is the Milky Way,
      which holds the Sun, 8.18 kpc from its centre.
    action:
      kind: drop_when
      columns: [DMzp, e_DMzp]
      when: { column: 1PGC, is: ["5064336"] }
normalization:
  redshifts:
    - column: V3k
      frame: cmb
      kind: spectroscopic
      comoving_velocity:
        from_km_s: 13000
        hubble_constant: 67.8
        omega_matter: 0.308
        basis: >-
          From 13,000 km/s up V3k is not a cz but H0 times a comoving distance, in the cosmology
          of the SDSS groups of Tempel et al. 2017 (A&A 602, A100; J/A+A/602/A100 ReadMe, Note G1:
          "the cosmology assumes H_0=67.8km/s/Mpc, Omega_m=0.308 and Omega_Lambda=0.692"), from
          which Tully et al. 2023 take their groups beyond the 2MASS groups ("If a group
          affiliation is unavailable for a galaxy within the groups described above then we opt
          for memberships in the 2017 Tempel et al. catalog", Sec. II, arXiv 2209.11238). It is
          read as the redshift whose comoving distance in that cosmology is V3k / 67.8 Mpc.
          Neither the ReadMe nor the paper says so; the evidence, from the tables served by
          vizier.idia.ac.za and vizier.nao.ac.jp on 2026-11-03: (1) 1PGC 1365066, a group of one
          table2 galaxy, has V3k = 28573 km/s (Vh 28219, fV3k 30679); its galaxy has Vcmb =
          29359, which is c z of its SDSS DR17 redshift in the CMB frame (z = 0.09663755
          heliocentric, 0.0979298 in the CMB frame); its Tempel group, T17 36422, has zcmb =
          0.09754669 and Dist.c = 421.434575 Mpc, and 67.8 x 421.434575 = 28573.5. (2) On 8,381
          groups whose dominant galaxy's T17 group is in Tempel's group table, V3k = 67.8 x
          Dist.c within the 1 km/s of rounding. (3) Over the 32,549 groups of one table2 galaxy,
          the median of V3k / Vcmb - 1 is -0.06% from 9,000 to 12,000 km/s, a cz (a comoving
          velocity would give -0.81%), then -0.59% from 12,000 to 15,000, and from 15,000 up it
          follows the comoving distance: -1.30% against -1.28% predicted (15,000-18,000 km/s),
          -1.86% against -1.76% (21,000-24,000) and -2.31% against -2.23% (27,000-30,000).
          13,000 km/s is where the median turns: a cz read below it as a comoving velocity, or
          the reverse above it, is off by at most about 1.2%, 160 km/s, under the 300 km/s
          peculiar velocity a redshift distance carries.
      basis: >-
        J/ApJ/944/94 ReadMe, table4 (read from http://vizier.nao.ac.jp/ftp/cats/J/ApJ/944/94/ReadMe,
        2026-11-03): V3k is the "Group velocity, relative to cosmic background", equal on every
        row to table3's Vcmb, "Systemic velocity of the galaxy" in the CMB frame (Note 3), and
        V3k - Vh is the CMB dipole in the group's direction (353.5 km/s for 1PGC 1365066 against
        353.0 from the Planck 2018 dipole). Tully et al. 2023 (arXiv 2209.11238, Appendix, Table
        3 columns 4-7): "Group velocities in respectively the reference frames of the Sun, the
        Local Sheet, and the cosmic microwave background. The value in column 7 is the value in
        column 6 multiplied by the cosmological curvature adjustment parameter f_i", so fV3k,
        not V3k, is the "modified" velocity with q0 and j0 (Omega_m = 0.27, Omega_Lambda =
        0.73), and is not taken. V3k is published in the CMB frame: no dipole is applied to it
        again. Below 13,000 km/s it is a cz from the members' spectra; above, see
        comoving_velocity.
  distances:
    - value: DMzp
      error: { symmetric: e_DMzp }
      kind: secondary_indicator
      method:
        mixed:
          - fundamental_plane
          - tully_fisher
          - surface_brightness_fluctuations
          - type_ia_supernovae
          - type_ii_supernovae
          - tip_of_the_red_giant_branch
          - cepheids
          - masers
      measure: luminosity
      kind_of_value: measured
      basis: >-
        ReadMe table3 Notes (1) and (2): DMzp is the group's weighted average over five methods
        (FP, TF, SBF, SNIa, SNII), DMav, "set to the scale defined by TRGB, cepheid and maser
        calibrators", so the kind is that of the five methods; where no five-method measurement
        exists DMzp is the direct calibration value, which a rule below marks. The abstract calls
        these "the measured distances". The modulus rests on the calibrators, not on a Hubble
        constant (the abstract finds the distances compatible with H0 = 74.6 km/s/Mpc). Dist,
        derived from DMzp, is a "Luminosity distance corresponding ot DMzp" (ReadMe table4).
  rules:
    - when: { column: DMav, is: ["0"] }
      and: [{ column: e_DMav, is: ["0"] }]
      distance:
        value: DMzp
        kind: primary_indicator
        method: { mixed: [tip_of_the_red_giant_branch, cepheids, masers] }
      basis: >-
        ReadMe table3 Note (1): "If column e (DMav) is blank because no five methods measurement
        is available then the direct calibration value is given." The table writes that blank
        as DMav = e_DMav = 0 (ranges [0/39.6] and [0/2.11], not marked as nullable), and DMcal is
        the "Average of all TRGB, CPLR, or MASER calibrators" (Note 4). On every one of the 228
        rows with DMav = 0 served by vizier.idia.ac.za (2026-11-03), e_DMav is 0 and DMzp equals
        DMcal, e.g. 1PGC 35: DMzp = DMcal = 29.730.
