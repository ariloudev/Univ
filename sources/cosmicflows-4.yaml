  - defect: >-
      The group of the Milky Way, 1PGC 5064336, is placed toward the Galactic centre at the
      average distance of its satellites: its DMzp of 20.369 (0.119 Mpc) is no distance of a
      group that holds the observer.
    change: >-
      On that row DMzp and e_DMzp are dropped and the entry kept, without a distance: the group
