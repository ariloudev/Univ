id: cosmicflows-4
title: "Cosmicflows-4 group distances"
provider: vizier
access:
  method: vizier_tsv
  table: "J/ApJ/944/94/groups"
  constraints: []
  rows: 38053
cuts:
  - >-
    No server-side cut: every row of the groups table (ReadMe table3.dat + table4.dat, merged by
    VizieR), 38,053 by the ReadMe and as served. The abstract says 38,065 groups; the 12-group
    difference is unexplained.
  - "The individual-galaxy table J/ApJ/944/94/table2 (55,877 galaxies) is the source cosmicflows-4-galaxies."
  - "DMzp is the group distance modulus on the scale of the TRGB, Cepheid and maser calibrators (ReadMe Note 1); Dist, derived from it, is not taken."
  - >-
    V3k, the group velocity relative to the cosmic background, is taken; Vh (relative to the Sun),
    Vls (the Local Sheet), fV3k (V3k times the curvature adjustment f) and the peculiar velocities
    are not.
columns:
  - { column: 1PGC, field: identifier, unit: dimensionless }
  - { column: _RAJ2000, field: right_ascension, unit: degree }
  - { column: _DEJ2000, field: declination, unit: degree }
  - { column: DMzp, field: distance_modulus, unit: magnitude }
  - { column: e_DMzp, field: distance_modulus_error, unit: magnitude }
  - { column: DMav, field: quality, unit: magnitude }
  - { column: e_DMav, field: quality, unit: magnitude }
  - { column: V3k, field: velocity, unit: kilometre_per_second }
  - { column: SGX, field: supergalactic_x, unit: megaparsec }
  - { column: SGY, field: supergalactic_y, unit: megaparsec }
  - { column: SGZ, field: supergalactic_z, unit: megaparsec }
frame: fk5_j2000
epoch: 2000.0
citation: >-
  Tully R.B., Kourkchi E., Courtois H.M., Anand G.S., Blakeslee J.P., Brout D., de Jaeger T.,
  Dupuy A., Guinet D., Howlett C., et al. 2023, "Cosmicflows-4", ApJ 944, 94. 2023ApJ...944...94T,
  doi:10.3847/1538-4357/ac94d8. VizieR catalogue J/ApJ/944/94, doi:10.26093/cds/vizier.19440094.
  The positions of 148 groups that the table gives wrongly are those of Kourkchi E. & Tully R.B.
  2017, "Galaxy groups within 3500 km/s", ApJ 843, 16, 2017ApJ...843...16K, VizieR catalogue
  J/ApJ/843/16 (fixes below).
terms:
  url: "https://cds.unistra.fr/vizier-org/licences_vizier.html"
  quote: >-
    The VizieR Information System provides a standardized description of astronomical catalogues,
    and generally a free access to the data contained therein, essentially dedicated to a scientific
    usage. The data retrieved with VizieR are free of usage in a scientific context; however, as it
    is the usage in scientific publication, the original authors and publication references
    including the publisher have to be explicitely cited (see section Code of conduct of scientific
    research).
  credit: >-
    This research has made use of the VizieR catalogue access tool, CDS, Strasbourg, France (DOI :
    10.26093/cds/vizier). The original description of the VizieR service was published in 2000,
    A&AS 143, 23. Cite Tully et al. 2023, ApJ 944, 94, and Kourkchi & Tully 2017, ApJ 843, 16,
    for the 148 group positions taken from it.
redistribution:
  status: permitted_with_credit
  review: provisional
  reasoning: >-
    CDS allows use of VizieR data in a scientific context with citation of the authors and
    publisher, and the ReadMe and landing-page metadata carry no catalogue-specific licence. The AAS
    and Extragalactic Distance Database terms were not checked (EDD was unreachable). Provisional:
    judged again before any public deployment.
scale_domain: cosmic_web
mirrors:
  - "https://vizier.cds.unistra.fr/viz-bin/asu-tsv"
  - "http://vizier.idia.ac.za/viz-bin/asu-tsv"
  - "http://vizier.nao.ac.jp/viz-bin/asu-tsv"
  - "http://vizier.china-vo.org/viz-bin/asu-tsv"
fixes:
  - defect: >-
      SGX, SGY and SGZ are labelled Mpc in the ReadMe and by VizieR, but hold km/s: they are the
      Local Sheet velocity Vls times the supergalactic unit vector, positions in velocity space.
    change: >-
      SGX, SGY and SGZ are read as km/s (velocity-space supergalactic Cartesian coordinates), not as
      Mpc. No distance is taken from them.
    evidence: >-
      (1) The ReadMe contradicts itself: the unit column says Mpc while the description says
      "Cartesian supergalactic coordinates of group, observed velocity units"; VizieR serves the same
      unit and description. (2) The stated SGX range [-22455/23499] cannot be Mpc when the same
      table's Dist range is [0.1/773] Mpc. (3) On 2,000 served rows (vizier.idia.ac.za, 2026-11-03)
      sqrt(SGX^2+SGY^2+SGZ^2) equals |Vls| within 2 km/s, e.g. 1PGC 12: Vls = 6669, (SGX, SGY, SGZ) =
      (1848, -6271, 1312), norm 6668; 1PGC 6830: Vls = -157, (40, 141, 56), norm 157.
    action: { kind: read_as, columns: [SGX, SGY, SGZ], unit: kilometre_per_second }
  - defect: >-
      157 group positions point away from the group in every position column of the groups
      table: RAdeg/DEdeg (served as _RAJ2000/_DEJ2000), GLON/GLAT, SGL/SGB and the SGX/SGY/SGZ
      derived from the same direction. No table2 member of these groups lies within 2 degrees of
      the group, and most lie 4-150 degrees away.
    change: >-
      For the 148 of them that share a 1PGC with the group catalogue of Kourkchi & Tully 2017
      (ApJ 843, 16; VizieR J/ApJ/843/16/table2), from which the paper builds its groups, the
      position is replaced with Kourkchi & Tully's group centre: the _RAJ2000 and _DEJ2000 that
      VizieR computes from that table's GLON and GLAT (FK5 J2000), served by vizier.idia.ac.za on
      2026-11-03 (http://vizier.idia.ac.za/viz-bin/asu-tsv?-source=J/ApJ/843/16/table2 with
      -out=PGC1,GLON,GLAT,SGLON,SGLAT and -out.add=_RAJ,_DEJ, one row for each 1PGC below). SGX,
      SGY and SGZ, the Local Sheet velocity along the wrong direction, are dropped on those rows
      rather than recomputed, as the definition does not take Vls: the group keeps its distance,
      velocity and corrected direction. The other 9 are left out under wrong_position (the next
      fix).
    evidence: >-
      (1) Tully et al. 2023 (Sec. XII) build the groups from Kourkchi & Tully 2017 first, and the
      ReadMe's Note G1 names it as the source of 1PGC. Of the 2,498 groups that share a 1PGC with
      KT17 table2, 2,399 have SGL/SGB equal to KT17's; 68 have SGL/SGB equal to KT17's GLON/GLAT
      (galactic angles written as supergalactic), e.g. 1PGC 1816: KT17 GLON/GLAT
      311.0300/-65.2643, CF4 SGL/SGB 311.0300/-65.2643, CF4 RA/Dec 79.5961/-8.3090 against its one
      table2 member at 7.4238/-51.5207 and KT17's centre 7.4237/-51.5207; 80 others differ from
      KT17 by 4-119 degrees, e.g. 1PGC 41220 (Virgo): CF4 RA/Dec 220.8243/-23.9008, KT17 centre
      187.7558/+12.4059, M49 (table2) 187.445/+8.000. (2) In every row the six angles and
      SGX/SGY/SGZ agree with each other (to 0.1 degree; SGX/SGY/SGZ to 1 degree) on the rows
      served by vizier.idia.ac.za on 2026-11-03, so VizieR computes _RAJ2000/_DEJ2000 correctly
      from RAdeg/DEdeg: the error is in the published table.
    action:
      kind: replace_by_key
      key: 1PGC
      columns: [_RAJ2000, _DEJ2000]
      drop: [SGX, SGY, SGZ]
      mark:
        flag: position_source
        cite: >-
          The position is Kourkchi & Tully 2017's group centre, not Cosmicflows-4's wrong one:
