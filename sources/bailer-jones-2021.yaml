designation:
  form: "Gaia EDR3 {identifier}"
  cite: >-
    Bailer-Jones et al. 2021, AJ 161, 147, Table 1 ('The source_id is the same as in EDR3'); the
    form is the Gaia EDR3 designation, Gaia EDR3 documentation, Datamodel description, gaia_source,
    designation ('constructed from the prefix Gaia DRx followed by a string of digits corresponding
    to source_id'; the archive's gaiaedr3.gaia_source.designation reads 'Gaia EDR3 <source_id>',
    checked 2026-11-07)
