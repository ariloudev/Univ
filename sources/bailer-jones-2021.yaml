normalization:
  distances:
    - value: r_med_geo
      error: { credible_interval: { low: r_lo_geo, high: r_hi_geo, probability: 0.68 } }
      kind: geometric
      method: bayesian_geometric
      measure: euclidean
      kind_of_value: estimated
      basis: >-
        I/352 ReadMe (read from http://vizier.nao.ac.jp/ftp/cats/I/352/ReadMe, 2026-11-03): rgeo is
        the median, b_rgeo and B_rgeo the "16th percentile" and "84th percentile of the geometric
        distance posterior"; "Geometric distances use only the EDR3 parallaxes" with a
        direction-dependent prior. Quantiles "transform invariably", so the interval is kept as
        published.
    - value: r_med_photogeo
      error: { credible_interval: { low: r_lo_photogeo, high: r_hi_photogeo, probability: 0.68 } }
      kind: photogeometric
      method: bayesian_photogeometric
      measure: euclidean
      kind_of_value: estimated
      basis: >-
        I/352 ReadMe: b_rpgeo and B_rpgeo are the "16th percentile" and "84th percentile of the
        photogeometric distance posterior"; the photogeometric distance "additionally uses the
        colour and apparent magnitude of a star".
  rules:
    - when: { column: parallax_over_error, below: 5 }
      kind_of_value: { columns: [r_med_geo, r_med_photogeo], kind: inferred }
      basis: >-
        The ranking rule's prior_led_parallax_ratio (rules/ranking.yaml), held equal to this bound by
        a test. Bailer-Jones et al. 2021 combine the parallax with a prior from a model of the
        Galaxy; below five times its error, a parallax no longer carries the distance, which then
        rests mostly on that prior. A negative or zero parallax is below the bound too. The ratio is
        gaia_source's, of the parallax as published; the zero point of about -0.017 mas
        (Lindegren et al. 2021) that Bailer-Jones et al. take off moves it by a few hundredths at
        the faint end, within the bound's own roughness.
    - when: { column: parallax_over_error, is: ["", "null", "NaN"] }
      kind_of_value: { columns: [r_med_geo, r_med_photogeo], kind: inferred }
      basis: >-
        A source with no parallax ratio has no parallax the distance could rest on, so its distance
        is the prior's alone. The archive writes a null as a blank cell in CSV; "null" and "NaN"
        are named too, should another writer give them.
