id: bailer-jones-2021
title: "Bailer-Jones et al. 2021 distances for Gaia DR3 stars (G < 14)"
provider: gaia-archive
access:
  method: tap
  # The same G < 14 selection and the same 768 random_index chunks as gaia-dr3-bright, each well
  # under the ESA archive's silent 50,000-row anonymous cap.
  query: >-
    SELECT d.source_id, d.r_med_geo, d.r_lo_geo, d.r_hi_geo, d.r_med_photogeo, d.r_lo_photogeo,
    d.r_hi_photogeo, d.flag, g.parallax_over_error FROM gaiadr3.gaia_source AS g
    JOIN external.gaiaedr3_distance AS d
    ON d.source_id = g.source_id WHERE g.phot_g_mean_mag < 14
    AND MOD(g.random_index, {chunks}) = {chunk}
  chunks: 768
  count: >-
    SELECT COUNT(*) AS n FROM gaiadr3.gaia_source AS g JOIN external.gaiaedr3_distance AS d
    ON d.source_id = g.source_id WHERE g.phot_g_mean_mag < 14
  # Each chunk runs as a job, as gaia-dr3-bright's do: a chunk of a join with gaia_source can
  # outlast the synchronous endpoint's request. Chunk 0 ran as a job in 33 s on 2026-11-10.
  run: async
cuts:
  - >-
    Inner join of external.gaiaedr3_distance to gaiadr3.gaia_source on source_id, for
    phot_g_mean_mag < 14, as gaia-dr3-bright; sources without a distance are absent. Measured
    2026-11-10 by COUNT(*) as an archive job: 16,716,140 rows, 128,016 fewer than gaia-dr3-bright's
    16,844,156.
  - "EDR3 and DR3 share an identical source list, so EDR3 source_ids join DR3 directly; they cannot be matched to DR1 or DR2 ids."
  - >-
    The distances are model-based estimates (Bayesian posterior quantiles with a Galaxy-model prior),
    not measurements: r_med_* is the median, r_lo_* and r_hi_* the 16th and 84th percentiles, kept as
    an asymmetric interval. Photogeometric distances are absent where the BP-RP colour is missing.
  - "flag is kept but not used for filtering, as its description asks; its values are decoded under flags below, from Table 2."
  - >-
    parallax_over_error is gaia_source's ratio of the Gaia DR3 parallax to its error, kept as
    published beside each distance. Where it is below the ranking rule's prior_led_parallax_ratio,
    5, or blank, both distances are inferred rather than estimated (rules below); it filters no row.
columns:
  - { column: source_id, field: identifier, unit: dimensionless }
  - { column: r_med_geo, field: distance, unit: parsec }
  - { column: r_lo_geo, field: distance_low, unit: parsec }
  - { column: r_hi_geo, field: distance_high, unit: parsec }
  - { column: r_med_photogeo, field: distance, unit: parsec }
  - { column: r_lo_photogeo, field: distance_low, unit: parsec }
  - { column: r_hi_photogeo, field: distance_high, unit: parsec }
  - { column: flag, field: quality, unit: dimensionless }
  - { column: parallax_over_error, field: quality, unit: dimensionless }
