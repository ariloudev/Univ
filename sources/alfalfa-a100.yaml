id: alfalfa-a100
title: "ALFALFA \u03b1.100 extragalactic HI source catalogue, code 1 detections"
provider: vizier
access:
  method: vizier_tsv
  table: "J/ApJ/861/49/table2"
  constraints: ["HI=1"]
  rows: 25434
cuts:
  - "J/ApJ/861/49/table2, the complete ALFALFA catalogue of 31,502 HI sources (ReadMe), cut to HI code 1."
  - >-
    The ReadMe's Note (2): code 1 is a "Source of significant S/N and high quality insuring
    reliability"; code 2 a "Source of slightly lower S/N which coincides with an optical counterpart
    of known, coincident redshift". Counted as served by vizier.nao.ac.jp on 2026-11-05: 25,434
    code 1, 6,068 code 2.
  - >-
    Positions are the "HI centroid" (ReadMe), as VizieR's _RAJ2000/_DEJ2000; the optical
    counterparts' positions (RAO/DEO) are sexagesimal, which the source reader does not take.
  - >-
    Vhel is the "Heliocentric velocity of the HI profile midpoint" (ReadMe), in km/s. Haynes et al.
    2018, Table 2, Col. 5: "Values adopt the optical convention δλ/λ, not the 'radio' one (δν/ν).
    The statistical uncertainty on cz⊙ to be adopted is half the error on the width W50 tabulated
    in Col. 6", so each Vhel's error is e_W50 / 2 (read from arxiv.org/html/1805.11499,
    2026-11-05).
  - >-
    Dist, the "Adopted distance, where applicable" (ReadMe), is not taken: it is derived from the
    velocity for most sources (Haynes et al. 2018; the method was not checked against the paper
    here), not measured; each galaxy is placed by its redshift under the release cosmology instead.
  - "logMHI (the HI mass) is not taken."
columns:
  - { column: AGC, field: identifier, unit: dimensionless }
  - { column: _RAJ2000, field: right_ascension, unit: degree }
  - { column: _DEJ2000, field: declination, unit: degree }
  - { column: Vhel, field: velocity, unit: kilometre_per_second }
  - { column: e_W50, field: velocity_error, unit: kilometre_per_second }
  - { column: HI, field: quality, unit: dimensionless }
frame: fk5_j2000
epoch: 2000.0
