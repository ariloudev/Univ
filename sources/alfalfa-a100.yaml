id: alfalfa-a100
title: "ALFALFA \u03b1.100 extragalactic HI source catalogue, code 1 detections"
provider: vizier
access:
  method: vizier_tsv
  table: "J/ApJ/861/49/table2"
  constraints: ["HI=1"]
  rows: 25434
cuts:
  - "J/ApJ/861/49/table2, the complete ALFALFA catalogue of 31,502 HI sources (ReadMe), cut to HI code 1."
  - >-
    Haynes et al. 2018: "Code 1 refers to the 25434 sources of highest quality"; code 2 sources are
    "priors" that "should not be used in statistical studies which require well-defined completeness
    limits". Counted from the file on 2026-11-05: 25,434 code 1, 6,068 code 2.
  - >-
    Positions are the HI centroids (VizieR's _RAJ2000/_DEJ2000), uncertain by about 20 arcsec; the
    optical counterparts' positions (RAO/DEO) are sexagesimal, which the source reader does not take.
  - >-
    Vhel is the "Heliocentric velocity of the HI line source ... optical convention" (cz). Its
    statistical uncertainty is half the error on W50 (Haynes et al. 2018, Section 4).
  - >-
    Dist is the catalogue's own distance: cz_cmb / H0 with H0 = 70 above 6,000 km/s and the local
    peculiar velocity model of Masters 2005 below; "Hubble distances, not co-moving or luminosity
    distances". It is an estimate from a flow model, not a measurement, and is not taken: each
    galaxy is placed by its redshift distance under the release cosmology.
  - >-
    No uncertainty is taken for Vhel: the paper's half the W50 error is a per-row derived estimate
    the source reader does not compute, so each Vhel is published with none reported.
  - "logMHI (the HI mass) is not taken."
columns:
  - { column: AGC, field: identifier, unit: dimensionless }
  - { column: _RAJ2000, field: right_ascension, unit: degree }
  - { column: _DEJ2000, field: declination, unit: degree }
  - { column: Vhel, field: velocity, unit: kilometre_per_second }
  - { column: HI, field: quality, unit: dimensionless }
frame: fk5_j2000
epoch: 2000.0
