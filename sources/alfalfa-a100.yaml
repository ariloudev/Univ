normalization:
  redshifts:
    - column: Vhel
      frame: heliocentric
      kind: spectroscopic
      basis: >-
        J/ApJ/861/49 ReadMe and Haynes et al. 2018: Vhel is the heliocentric recession velocity of
        the 21 cm HI line, in the optical convention (cz). A 21 cm line velocity is a spectroscopic
        measurement; it has no error column here.
