  Haynes M.P., Giovanelli R., Kent B.R., Adams E.A.K., Balonek T.J., Craig D.W., Fertig D., Finn
  R., Giovanardi C., Hallenbeck G., et al. 2018, "The Arecibo Legacy Fast ALFA Survey: The ALFALFA
  Extragalactic HI Source Catalog", ApJ 861, 49. 2018ApJ...861...49H, doi:10.3847/1538-4357/aac956.
  VizieR catalogue J/ApJ/861/49, doi:10.26093/cds/vizier.18610049.
reference: { bibcode: "2018ApJ...861...49H", doi: "10.3847/1538-4357/aac956" }
