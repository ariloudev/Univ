designation:
  form: "AGC {identifier}"
  cite: >-
    ReadMe of J/ApJ/861/49 (VizieR), Byte-by-byte Description of file table2.dat, AGC ('UGC/AGC
    number') and Note (1); form per the CDS Dictionary of Nomenclature of Celestial Objects (read
    via vizier.nao.ac.jp/viz-bin/Dic, 2026-11-07), acronym AGC (Arecibo General Catalog): 'AGC
    NNNNNNA'
flags:
  HI:
    cite: >-
      ReadMe of J/ApJ/861/49 (VizieR), Byte-by-byte Description of file table2.dat, HI ('HI source
      code'), Note (2)
    values:
      "1": "Source of significant S/N and high quality insuring reliability."
      "2": >-
        Source of slightly lower S/N which coincides with an optical counterpart of known,
        coincident redshift.
normalization:
  redshifts:
    - column: Vhel
      error: e_W50
      error_scale: 0.5
      frame: heliocentric
      kind: spectroscopic
      basis: >-
        J/ApJ/861/49 ReadMe: Vhel is the "Heliocentric velocity of the HI profile midpoint", in
        km/s. Haynes et al. 2018, Table 2, Col. 5: it adopts "the optical convention", so it is
        cz, and "The statistical uncertainty on cz⊙ to be adopted is half the error on the width
        W50 tabulated in Col. 6", e_W50 (read from arxiv.org/html/1805.11499, 2026-11-05).
