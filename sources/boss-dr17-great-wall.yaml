redistribution:
  status: permitted_with_credit
  review: provisional
  reasoning: >-
    SDSS states that all data in its public releases is considered in the public domain, so no
    licence condition limits copying or redistribution; credit goes to Lietzen et al. 2016 for the
    structure and to the SDSS acknowledgements and papers for the data. The older SDSS-I/II credits
    page says commercial use needs approval by the Astrophysical Research Consortium, which matters
    only for commercial use. Provisional: judged again before any public deployment.
scale_domain: cosmic_web
mirrors:
  - "https://skyserver.sdss.org/dr17/SkyServerWS/SearchTools/SqlSearch"
normalization:
  redshifts:
    - column: z
      error: zErr
      frame: heliocentric
      kind: spectroscopic
      basis: >-
        SDSS DR17 spectroscopy basics (https://www.sdss.org/dr17/spectro/spectro_basics/, read
        2026-11-03): SDSS spectra are on "heliocentric vacuum wavelengths", so z is heliocentric.
