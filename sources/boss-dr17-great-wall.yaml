id: boss-dr17-great-wall
title: "BOSS Great Wall region, SDSS DR17 spectroscopic galaxies"
provider: skyserver
access:
  method: skyserver_sql
  query: >-
    SELECT specObjID, ra, dec, z, zErr FROM SpecObj WHERE class = 'GALAXY' AND zWarning = 0
    AND ra BETWEEN 150 AND 172 AND dec BETWEEN 40 AND 60 AND z BETWEEN 0.42 AND 0.52
  chunks: 1
  count: >-
    SELECT COUNT_BIG(*) AS n FROM SpecObj WHERE class = 'GALAXY' AND zWarning = 0 AND ra BETWEEN
    150 AND 172 AND dec BETWEEN 40 AND 60 AND z BETWEEN 0.42 AND 0.52
cuts:
  - "SpecObj (science-primary spectra), class = 'GALAXY' AND zWarning = 0."
  - >-
    Box RA 150-172 deg, Dec 40-60 deg, 0.42 <= z <= 0.52: the region RA 152-170, Dec 42-58,
    z 0.43-0.51 plus a margin of 2 deg and 0.01 in z. The research gives no margin to add (that box
    already holds the members plotted in Lietzen et al. 2016 Fig. 1, about RA 154-169 and Dec 45-57,
    read off the figure, and the stated 0.45 < z < 0.5), so the default margin is used.
  - >-
    No CMASS restriction: the box also holds SDSS-I/II and eBOSS galaxies the paper did not use
    (measured in the unpadded box: boss 7,519, eboss 231, sdss 553). The paper's sample is
    survey = 'boss' AND (boss_target1 & 2) > 0 (GAL_CMASS, 6,051 in the unpadded box), applied
    after the fetch if wanted.
  - "The paper used DR12 reductions; DR17 BOSS spectra use run2d v5_13_2, so redshifts can differ slightly from the paper's."
columns:
  - { column: specObjID, field: identifier, unit: dimensionless }
  - { column: ra, field: right_ascension, unit: degree }
  - { column: dec, field: declination, unit: degree }
  - { column: z, field: redshift, unit: dimensionless }
  - { column: zErr, field: redshift_error, unit: dimensionless }
# SDSS documents its positions as J2000 and calibrated against UCAC; ICRS is inferred, not stated.
frame: icrs
epoch: 2000.0
citation: >-
  Lietzen H., Tempel E., Liivamägi L.J., et al. 2016, "Discovery of a massive supercluster system at
  z ~ 0.47", A&A 588, L4. 2016A&A...588L...4L, doi:10.1051/0004-6361/201628261, arXiv:1602.08498.
  Data: Abdurro'uf et al. 2022, ApJS 259, 35 (2022ApJS..259...35A, doi:10.3847/1538-4365/ac4414);
  Eisenstein et al. 2011, AJ 142, 72 (2011AJ....142...72E); Dawson et al. 2013, AJ 145, 10
  (2013AJ....145...10D); Smee et al. 2013, AJ 146, 32 (2013AJ....146...32S). The SDSS and Lietzen
  bibcodes were constructed from Crossref-verified journal, volume and page; ADS was not reachable.
reference: { bibcode: "2016A&A...588L...4L", doi: "10.1051/0004-6361/201628261" }
