id: gaia-dr3-bright
title: "Gaia DR3 stars (G < 14)"
provider: gaia-archive
access:
  method: tap
  # About 16.8 million rows (a 1% sample of 2026-11-10; the count is under cuts) in 768 chunks of
  # about 22,000, well under the ESA archive's silent 50,000-row anonymous cap. Until release 12
  # the cut was G < 10: 482,106 rows (measured 2026-11-03) in 16 chunks.
  query: >-
    SELECT g.source_id, g.ra, g.dec, g.ra_error, g.dec_error, g.parallax, g.parallax_error,
    g.pmra, g.pmdec, g.radial_velocity, g.radial_velocity_error, g.phot_g_mean_mag, g.bp_rp,
    a.spectraltype_esphs FROM gaiadr3.gaia_source AS g
    LEFT OUTER JOIN gaiadr3.astrophysical_parameters AS a ON a.source_id = g.source_id
    WHERE g.phot_g_mean_mag < 14 AND MOD(g.random_index, {chunks}) = {chunk}
  chunks: 768
  count: "SELECT COUNT(*) AS n FROM gaiadr3.gaia_source WHERE phot_g_mean_mag < 14"
  # Each chunk runs as a job. On 2026-11-04 a chunk with the astrophysical_parameters join
  # outlasted the synchronous endpoint's request (over three minutes, on both mirrors), while the
  # same chunk as a job at ESA completed in 11 s; without the join, a synchronous chunk took 4 s.
  run: async
cuts:
  - >-
    phot_g_mean_mag < 14, the owner's choice of 2026-11-10 (decision: take Gaia DR3 stars to G < 14,
    with the Galaxy's tracers). Measured 2026-11-10 by COUNT(*) as an archive job: 16,844,156 rows,
    about 21,900 a chunk. A 1% random sample (random_index < 18,117,098) of the same day gave
    16.84 million. Until release 12 the cut was G < 10: 482,106 rows, measured 2026-11-03.
  - "Rows with no G magnitude are excluded by the cut. These are gaia_source rows, not stars: duplicates and spurious bright sources are not removed."
  - "Gaia is incomplete at the bright end (the brightest EDR3/DR3 source is at G = 1.73, and bright stars are missing at G < 7), so the bright end is a lower bound on the true sky counts."
  - >-
    bp_rp is BP-RP as gaia_source publishes it, with no error column; it is null where BP or RP is.
    spectraltype_esphs comes from gaiadr3.astrophysical_parameters by a left join on source_id:
    ESP-HS's spectral type tag (Creevey et al. 2023, A&A 674, A26), a class letter (O to M, CSTAR)
    or "unknown", kept as published. Measured 2026-11-04 over G < 10: 481,970 rows joined, 4,109
    blank and 1,080 "unknown".
  - "parallax, pmra and pmdec are null for 2-parameter solutions; radial_velocity is null for most sources. ra_error is sigma(alpha*) = sigma(alpha) cos(dec); pmra is mu_alpha* = mu_alpha cos(dec)."
columns:
  - { column: source_id, field: identifier, unit: dimensionless }
  - { column: ra, field: right_ascension, unit: degree }
  - { column: dec, field: declination, unit: degree }
  - { column: ra_error, field: right_ascension_error, unit: milliarcsecond }
  - { column: dec_error, field: declination_error, unit: milliarcsecond }
  - { column: parallax, field: parallax, unit: milliarcsecond }
  - { column: parallax_error, field: parallax_error, unit: milliarcsecond }
  - { column: pmra, field: proper_motion_ra, unit: milliarcsecond_per_year }
  - { column: pmdec, field: proper_motion_dec, unit: milliarcsecond_per_year }
  - { column: radial_velocity, field: velocity, unit: kilometre_per_second }
  - { column: radial_velocity_error, field: velocity_error, unit: kilometre_per_second }
  - { column: phot_g_mean_mag, field: magnitude, unit: magnitude }
  - { column: bp_rp, field: colour_index, unit: magnitude }
  - { column: spectraltype_esphs, field: spectral_type, unit: dimensionless }
frame: icrs
epoch: 2016.0
citation: >-
  Gaia Collaboration, Vallenari A., Brown A.G.A., Prusti T., et al. 2023, "Gaia Data Release 3:
  Summary of the content and survey properties", A&A 674, A1. 2023A&A...674A...1G,
  doi:10.1051/0004-6361/202243940. Gaia Collaboration, Prusti T., de Bruijne J.H.J., et al. 2016,
  "The Gaia mission", A&A 595, A1. 2016A&A...595A...1G, doi:10.1051/0004-6361/201629272.
reference: { bibcode: "2023A&A...674A...1G", doi: "10.1051/0004-6361/202243940" }
