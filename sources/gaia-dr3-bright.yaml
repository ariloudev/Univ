id: gaia-dr3-bright
title: "Gaia DR3 bright stars (G < 10)"
provider: gaia-archive
access:
  method: tap
  # 482,106 rows (measured 2026-11-03) in 16 chunks of about 30,000, well under the ESA archive's
  # silent 50,000-row anonymous cap.
  query: >-
    SELECT source_id, ra, dec, ra_error, dec_error, parallax, parallax_error, pmra, pmdec,
    radial_velocity, radial_velocity_error, phot_g_mean_mag FROM gaiadr3.gaia_source
    WHERE phot_g_mean_mag < 10 AND MOD(random_index, {chunks}) = {chunk}
  chunks: 16
  count: "SELECT COUNT(*) AS n FROM gaiadr3.gaia_source WHERE phot_g_mean_mag < 10"
cuts:
  - "phot_g_mean_mag < 10 (PROVISIONAL: the owner is deciding the magnitude limit). Measured 2026-11-03: 482,106 rows."
  - "Rows with no G magnitude are excluded by the cut. These are gaia_source rows, not stars: duplicates and spurious bright sources are not removed."
  - "Gaia is incomplete at the bright end (the brightest EDR3/DR3 source is at G = 1.73, and bright stars are missing at G < 7), so the bright end is a lower bound on the true sky counts."
  - "parallax, pmra and pmdec are null for 2-parameter solutions; radial_velocity is null for most sources. ra_error is sigma(alpha*) = sigma(alpha) cos(dec); pmra is mu_alpha* = mu_alpha cos(dec)."
columns:
  - { column: source_id, field: identifier, unit: dimensionless }
  - { column: ra, field: right_ascension, unit: degree }
  - { column: dec, field: declination, unit: degree }
  - { column: ra_error, field: right_ascension_error, unit: milliarcsecond }
  - { column: dec_error, field: declination_error, unit: milliarcsecond }
  - { column: parallax, field: parallax, unit: milliarcsecond }
  - { column: parallax_error, field: parallax_error, unit: milliarcsecond }
  - { column: pmra, field: proper_motion_ra, unit: milliarcsecond_per_year }
  - { column: pmdec, field: proper_motion_dec, unit: milliarcsecond_per_year }
  - { column: radial_velocity, field: velocity, unit: kilometre_per_second }
  - { column: radial_velocity_error, field: velocity_error, unit: kilometre_per_second }
  - { column: phot_g_mean_mag, field: magnitude, unit: magnitude }
frame: icrs
epoch: 2016.0
