scale_domain: stars
mirrors:
  - "https://gea.esac.esa.int/tap-server/tap"
  - "https://gaia.ari.uni-heidelberg.de/tap"
  - "https://gaia.aip.de/tap"
designation:
  form: "Gaia DR3 {identifier}"
  cite: >-
    Gaia DR3 documentation, Datamodel description, gaia_source, designation: 'A source designation,
    unique across all Gaia Data Releases, that is constructed from the prefix Gaia DRx followed by a
    string of digits corresponding to source_id' (the archive's gaiadr3.gaia_source.designation
    reads 'Gaia DR3 <source_id>', checked 2026-11-07)
normalization:
  colours:
    - { bands: [BP, RP], column: bp_rp }
  spectral_type:
    column: spectraltype_esphs
    kind_of_value: estimated
    basis: >-
      ESP-HS assigns its spectral type tag from the BP/RP spectrum, by the module's own
      classification ahead of fitting hot-star models (Creevey et al. 2023, A&A 674, A26, the
      ESP-HS section of Gaia DR3's astrophysical parameters): a model estimate, not a
      classification of the star's spectrum by a spectroscopist, so it is estimated. The Gaia DR3
      data model gives the tag as one of O, B, A, F, G, K, M, CSTAR or unknown; "unknown" is
      where ESP-HS assigned no type, so it is read as none.
    none: [unknown]
