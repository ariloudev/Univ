id: iau-star-names
title: "IAU Catalog of Star Names (WGSN)"
provider: literature
access:
  method: repository
  path: names/iau-wgsn.yaml
  holds: star_names
cuts:
  - >-
    The 652 names of the IAU Catalog of Star Names of the IAU Working Group on Star Names (WGSN), as
    its table at exopla.net, the WGSN's own site, listed them on 2026-11-07, adopted to 2026-10-15.
    The WGSN publishes the current list only as that table, so names/iau-wgsn.yaml keeps a dated
    snapshot of it, written by scripts/snapshot-iau-names.py; an update is a new snapshot.
  - >-
    Each name keeps the star's designation, its HIP number where it has one (579 names) and its
    date of adoption. The etymology, language and image columns are not taken.
  - >-
    A name with a HIP number joins the Hipparcos star of that number. RA and Dec, in degrees, are
    the table's hidden columns, which the page says come from the WGSN's Naked Eye star Catalog
    (NEC), "compiled from SIMBAD-data": SIMBAD's ICRS positions at J2000.
  - >-
    A name with no HIP number (73) joins no star of another source and stands as an object of its
    own with its sky position and no distance. The 14 of those the table gives no position, hosts
    of named exoplanets such as WASP-121 and GJ 1214, are left out as missing their position.
columns: []
frame: icrs
epoch: 2000.0
citation: >-
  IAU Working Group on Star Names (WGSN), IAU Catalog of Star Names (CSN),
  https://exopla.net/star-names/modern-iau-star-names/, read 2026-11-07.
reference:
  none: >-
    The WGSN catalogue is a list kept on the WGSN's site rather than a paper; each name's adoption
    is announced in the WGSN bulletins and on that site.
terms:
  url: "https://exopla.net/star-names/modern-iau-star-names/"
  quote: >-
    IAU-star names are free to use and not subject to copyright or intellectual property
    licensing; they are scientific standards (like the unit of measure "meter" or "light-year"),
    belong to the public domain and are not owned by anybody (neither the IAU nor WGSN).
  credit: "Star names: IAU Catalog of Star Names, IAU Working Group on Star Names (WGSN)."
redistribution:
  status: permitted
  review: provisional
  reasoning: >-
    The WGSN states that the names belong to the public domain. Only names, designations, HIP
    numbers, adoption dates and SIMBAD positions are taken, not the etymologies. Provisional: judged
    again before any public deployment.
scale_domain: stars
mirrors: []
