redistribution:
  status: permitted_with_credit
  review: provisional
  reasoning: >-
    DESI DR1 is CC BY 4.0, which allows redistribution for any purpose, commercial included, on
    condition of citing the DR1 paper, indicating the changes made and including the
    acknowledgments; the credit does all three. Read 2026-11-05. Provisional only in that the
    Astro Data Lab acknowledgement is taken from its usual wording and was not read on its own page.
scale_domain: cosmic_web
mirrors:
  - "https://datalab.noirlab.edu/tap"
normalization:
  redshifts:
    - column: z
      error: zerr
      frame: barycentric
      kind: spectroscopic
      basis: >-
        DESI DR1 release page (https://data.desi.lbl.gov/doc/releases/dr1/, read 2026-11-05):
        "Wavelength system: vacuum barycentric", so the redshifts fitted to the spectra are relative
        to the Solar System barycentre.
