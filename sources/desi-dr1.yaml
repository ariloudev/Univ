id: desi-dr1
title: "DESI Data Release 1 redshift catalogue: galaxies and quasars"
provider: noirlab-datalab
access:
  method: tap
  # Some 15 million rows (13.1M galaxies and 1.6M quasars of the main survey, plus Survey
  # Validation) in 80 chunks of about 200,000, each run as a job at Astro Data Lab.
  query: >-
    SELECT targetid, mean_fiber_ra, mean_fiber_dec, z, zerr, spectype FROM desi_dr1.zpix
    WHERE targetid > 0 AND zcat_primary = 'true' AND zwarn = 0
    AND spectype IN ('GALAXY', 'QSO')
    AND MOD(targetid, {chunks}) = {chunk}
  chunks: 80
  count: >-
    SELECT COUNT(*) AS n FROM desi_dr1.zpix
    WHERE targetid > 0 AND zcat_primary = 'true' AND zwarn = 0
    AND spectype IN ('GALAXY', 'QSO')
  # Data Lab's synchronous endpoint did not answer a four-row query within 110 s on 2026-11-05,
  # then answered a six-row one in 2 s: a job outlasts such stalls. zcat_primary is a boolean
  # column there, compared with 'true'.
  run: async
cuts:
  - >-
    desi_dr1.zpix at NOIRLab's Astro Data Lab, its copy of DESI DR1's zall-pix redshift catalogue
    (one row per target and healpix coadd), cut to zcat_primary true (the one row of each target
    that DESI marks primary), zwarn = 0 (no warning bit set by the redshift fitter, Redrock) and
    spectype GALAXY or QSO. zpix carries no OBJTYPE column, so sky fibres are left out by zwarn,
    whose bit 0 flags a sky fibre, not by OBJTYPE.
  - >-
    The DR1 abstract (arXiv:2503.14745): "The DR1 main survey includes high-confidence redshifts for
    18.7M objects, of which 13.1M are spectroscopically classified as galaxies, 1.6M as quasars, and
    4M as stars". Stars are left out here; Survey Validation targets are kept. The count of rows this
    query takes is measured when the release is built.
  - >-
    targetid > 0: DESI gives negative TARGETIDs to fibres without a target, and MOD of a negative
    id would fall in no chunk while the count still held it.
  - >-
    zwarn = 0 is the fitter's own judgement, not a visual inspection: no further cut is made on the
    redshift range or on quasar redshifts, whose systematic errors exceed zerr (unverified for DR1).
  - >-
    Data Lab's zpix has no TARGET_RA/TARGET_DEC: positions are mean_fiber_ra/mean_fiber_dec, the mean
    position of the fibres on the target, ICRS, measured when observed (DR1: 2021 to 2022). For
    galaxies and quasars the epoch makes no difference.
  - "Redshift completeness depends on fibre assignment, which differs by target class and across the footprint."
columns:
  - { column: targetid, field: identifier, unit: dimensionless }
  - { column: mean_fiber_ra, field: right_ascension, unit: degree }
  - { column: mean_fiber_dec, field: declination, unit: degree }
  - { column: z, field: redshift, unit: dimensionless }
  - { column: zerr, field: redshift_error, unit: dimensionless }
  - { column: spectype, field: quality, unit: dimensionless }
frame: icrs
epoch: 2022.0
citation: >-
  DESI Collaboration, Abdul-Karim M., et al. 2026, "Data Release 1 of the Dark Energy
  Spectroscopic Instrument", AJ 171, 285. 2026AJ....171..285D, doi:10.3847/1538-3881/ae4c43,
  arXiv:2503.14745. Read through NOIRLab's Astro Data Lab (desi_dr1.zpix).
reference: { bibcode: "2026AJ....171..285D", doi: "10.3847/1538-3881/ae4c43" }
