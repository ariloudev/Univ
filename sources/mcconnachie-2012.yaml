id: mcconnachie-2012
title: "McConnachie 2012 Local Group and nearby dwarf galaxies"
provider: vizier
access:
  method: vizier_tsv
  table: "J/AJ/144/4/catalog"
  constraints: []
  rows: 102
cuts:
  - "No server-side cut: every row of the catalog table (ReadMe table1.dat to table5.dat merged by VizieR), 102 by the ReadMe and as served."
  - >-
    This is the 2012 published version (ReadMe dated 24-Jul-2013), not the author's continually
    updated online table.
  - "Row 1, The Galaxy, has the position of Sgr A*."
  - >-
    All distance moduli come from resolved stellar populations (ReadMe Note 7). E_ columns are the
    positive and e_ columns the negative errors; u_(m-M) flags an uncertain or fixed distance and
    f_HRV flags the velocity (e.g. r: optical and HI velocities disagree).
columns:
  - { column: Name, field: identifier, unit: dimensionless }
  - { column: _RAJ2000, field: right_ascension, unit: degree }
  - { column: _DEJ2000, field: declination, unit: degree }
  - { column: (m-M), field: distance_modulus, unit: magnitude }
  - { column: E_(m-M), field: distance_modulus_error, unit: magnitude }
  - { column: e_(m-M), field: distance_modulus_error, unit: magnitude }
  - { column: u_(m-M), field: quality, unit: dimensionless }
  - { column: D, field: distance, unit: kiloparsec }
  - { column: E_D, field: distance_error, unit: kiloparsec }
  - { column: e_D, field: distance_error, unit: kiloparsec }
  - { column: HRV, field: velocity, unit: kilometre_per_second }
  - { column: e_HRV, field: velocity_error, unit: kilometre_per_second }
  - { column: f_HRV, field: quality, unit: dimensionless }
  - { column: Vmag, field: magnitude, unit: magnitude }
frame: fk5_j2000
epoch: 2000.0
citation: >-
  McConnachie A.W. 2012, "The observed properties of dwarf galaxies in and around the Local Group",
  AJ 144, 4. 2012AJ....144....4M, doi:10.1088/0004-6256/144/1/4. VizieR catalogue J/AJ/144/4,
  doi:10.26093/cds/vizier.51440004.
reference: { bibcode: "2012AJ....144....4M", doi: "10.1088/0004-6256/144/1/4" }
terms:
  url: "https://cds.unistra.fr/vizier-org/licences_vizier.html"
  quote: >-
    The VizieR Information System provides a standardized description of astronomical catalogues,
    and generally a free access to the data contained therein, essentially dedicated to a scientific
    usage. The data retrieved with VizieR are free of usage in a scientific context; however, as it
    is the usage in scientific publication, the original authors and publication references
    including the publisher have to be explicitely cited (see section Code of conduct of scientific
    research).
  credit: >-
    This research has made use of the VizieR catalogue access tool, CDS, Strasbourg, France (DOI :
    10.26093/cds/vizier). The original description of the VizieR service was published in 2000,
    A&AS 143, 23. Cite McConnachie 2012, AJ 144, 4.
redistribution:
  status: permitted_with_credit
  review: provisional
  reasoning: >-
    CDS allows use of VizieR data in a scientific context with citation of the authors and
    publisher, and the ReadMe and landing-page metadata carry no catalogue-specific licence. The AAS
    terms were not checked, and "scientific context" is not defined for a public hobby release.
    Provisional: judged again before any public deployment.
scale_domain: nearby_galaxies
# VizieR's mirrors, checked 2026-11-04: China-VO answers like CDS; NAO's database was unreachable
# and IDIA broke off mid-answer, so they come last.
mirrors:
  - "https://vizier.cds.unistra.fr/viz-bin/asu-tsv"
  - "http://vizier.china-vo.org/viz-bin/asu-tsv"
  - "http://vizier.nao.ac.jp/viz-bin/asu-tsv"
  - "http://vizier.idia.ac.za/viz-bin/asu-tsv"
flags:
  "u_(m-M)":
    cite: >-
      ReadMe of J/AJ/144/4 (VizieR), Byte-by-byte Description of file table2.dat, u_(m-M)
      ('Uncertain or fixed distance'), Note (5)
    values:
      ":": "Uncertainty flag."
      "b": "Significant distance/velocity gradients."
      "k": "Range in distance estimates from 750 <~ D <~ 950."
      "l": "Assumed to be at M31-M33 distance."
      ":l": "Uncertainty flag; assumed to be at M31-M33 distance."
  f_HRV:
    cite: >-
      ReadMe of J/AJ/144/4 (VizieR), table2.dat, f_HRV ('Flag on HRV', [cdfmpr]); the column points
      to Note (10), which defines no letters, and its letters are those of Note (5) ('Peculiarities
      on distance/velocity')
    values:
      "c": "Corresponding to RC stars at 6 < D < 7 kpc."
      "d": "Carbon stars."
      "f": "Red giant branch stars."
      "m": "Alternative value in Gallart et al. (2001AJ....121.2572G)."
      "p": "Optical velocity suggests that Tucana is not associated with nearby HI cloud."
      "r": >-
        Optical spectroscopy suggests that HRV ~ -70 km/s; however, HI analysis by Bellazzini et al.
        (2011A&A...527A..58B) gives HRV ~ -25 km/s. No clear reason for the discrepancy currently
        exists.
normalization:
  distances:
    - value: (m-M)
      error: { asymmetric: { minus: e_(m-M), plus: E_(m-M) } }
      also_published: { value: D, error: { asymmetric: { minus: e_D, plus: E_D } } }
      kind: primary_indicator
      method:
        mixed:
          - cepheids
          - rr_lyrae
          - tip_of_the_red_giant_branch
          - horizontal_branch
          - { other: main-sequence fitting }
      measure: luminosity
      kind_of_value: measured
      basis: >-
        J/AJ/144/4 ReadMe (read from http://vizier.nao.ac.jp/ftp/cats/J/AJ/144/4/ReadMe,
        2026-11-03): (m-M) is the distance modulus (m-M)_0 and D the heliocentric distance from
        it; E_ columns are the positive and e_ the negative errors. Note (7): "All distance moduli
        are based on resolved stellar population analysis (generally Cepheid, RR Lyrae, or TRGB
        (tip of the red giant branch) measurements, but also horizontal branch level and
        main-sequence fitting)"; the table does not say which for each galaxy.
  rules:
    - when: { column: u_(m-M), is: [l, ":l"] }
      kind_of_value: { columns: [(m-M), D], kind: estimated }
      basis: >-
        ReadMe Note (5): "l = Assumed to be at M31-M33 distance", an assumed distance, not a
        measurement of the galaxy. One row (served 2026-11-03) carries ":l".
