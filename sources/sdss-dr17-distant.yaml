id: sdss-dr17-distant
title: "SDSS DR17 spectroscopic galaxies beyond z = 0.35, and quasars"
provider: skyserver
access:
  method: skyserver_sql
  # About 2.29 million rows (2026-11-05 counts below) in 40 chunks of about 57,000, far below
  # SkyServer's silent 500,000-row cap.
  query: >-
    SELECT specObjID, ra, dec, z, zErr FROM SpecObj WHERE zWarning = 0
    AND ((class = 'GALAXY' AND z >= 0.35 AND z < 1.2) OR (class = 'QSO' AND z > 0.005))
    AND (specObjID % {chunks}) = {chunk}
  chunks: 40
  count: >-
    SELECT COUNT_BIG(*) AS n FROM SpecObj WHERE zWarning = 0
    AND ((class = 'GALAXY' AND z >= 0.35 AND z < 1.2) OR (class = 'QSO' AND z > 0.005))
cuts:
  - "SpecObj, the DR17 view of science-primary spectra (sciencePrimary = 1; no QA, sky or duplicate spectra)."
  - >-
    The rest of DR17's galaxy and quasar spectroscopy beside sdss-dr17-galaxies, which takes class
    GALAXY at 0.005 < z < 0.35: here class GALAXY at 0.35 <= z < 1.2 and class QSO at z > 0.005,
    each with zWarning = 0. Counted on SkyServer 2026-11-05: GALAXY at z >= 0.35, 1,537,923 (boss
    1,123,456, eboss 348,530, sdss 65,714, segue 223), of which 5,215 lie at z >= 1.2, where the
    galaxy templates are unreliable (the largest GALAXY z is 2.0026); QSO at any z, 753,228 (boss
    297,418, eboss 370,892, sdss 82,190, segue 2,728), z from 0.0005 to 7.04.
  - >-
    CLASS comes from the pipeline's template fits. The visually inspected DR16Q quasar catalogue
    (Lyke et al. 2020) is not used; quasar redshifts are the pipeline's, and Lyman-alpha quasars
    at z > 2 carry systematic redshift errors larger than zErr.
  - "ra/dec are fibre (plug) positions, stored to 5 decimals; z and zErr are float32."
  - "specObjID exceeds the 64-bit signed range and is kept as text."
columns:
  - { column: specObjID, field: identifier, unit: dimensionless }
  - { column: ra, field: right_ascension, unit: degree }
  - { column: dec, field: declination, unit: degree }
  - { column: z, field: redshift, unit: dimensionless }
  - { column: zErr, field: redshift_error, unit: dimensionless }
# SDSS documents its positions as J2000 and calibrated against UCAC; ICRS is inferred, not stated.
frame: icrs
epoch: 2000.0
citation: >-
  Abdurro'uf et al. 2022, "The Seventeenth Data Release of the Sloan Digital Sky Surveys: Complete
  Release of MaNGA, MaStar, and APOGEE-2 Data", ApJS 259, 35. 2022ApJS..259...35A,
  doi:10.3847/1538-4365/ac4414. Survey papers for the rows taken: York et al. 2000, AJ 120, 1579
  (2000AJ....120.1579Y); Strauss et al. 2002, AJ 124, 1810 (2002AJ....124.1810S); Gunn et al. 2006,
  AJ 131, 2332 (2006AJ....131.2332G); Smee et al. 2013, AJ 146, 32 (2013AJ....146...32S);
  Eisenstein et al. 2011, AJ 142, 72 (2011AJ....142...72E); Dawson et al. 2013, AJ 145, 10
  (2013AJ....145...10D); Dawson et al. 2016, AJ 151, 44 (2016AJ....151...44D). The SDSS bibcodes
  were constructed from Crossref-verified journal, volume and page; ADS was not reachable.
reference: { bibcode: "2022ApJS..259...35A", doi: "10.3847/1538-4365/ac4414" }
