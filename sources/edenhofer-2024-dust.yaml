cuts:
  - >-
    The whole file mean_and_std_healpix.fits of Zenodo record 10.5281/zenodo.8187943 (v1.0,
    published 2023-08-01): the posterior mean and standard deviation of the dust density over the
    reconstruction's samples, on HEALPix pixels of NSIDE 256 in the NEST ordering times 516
    logarithmically spaced distance bins from 68.62 to 1,248.10 pc (the file's RADIAL PIXEL
    BOUNDARIES), the pixels in galactic coordinates about the Sun.
  - "These are reconstructed fields, not measurements: the mean and standard deviation over 12 variational posterior samples of a Gaussian-process reconstruction from distance and extinction estimates to 54 million stars derived from Gaia BP/RP spectra (the paper's abstract)."
  - >-
    Resampled by Univ Ingest onto a cube of 2,500 pc a side centred on the Sun, 250 cells of 10 pc
    along the galactic Cartesian axes: each cell holds the mean of the source's values at the
    voxel centres within it, or, where none falls, the value of the voxel holding the cell's
    centre. Cells whose centres lie nearer than 69 pc or farther than 1,250 pc hold NaN, no data.
  - "Not taken: the 2 kpc validation map, which the provider says uses less data and advises caution with; the posterior samples; the provider's own 2 pc Cartesian interpolation (15.7 GB)."
