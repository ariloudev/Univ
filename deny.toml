# cargo-deny: licences, security advisories, banned crates and crate sources.
# Run by `cargo xtask check`.

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The allow-list is policy for crates to come, so an entry no crate uses yet is not a warning.
unused-allowed-license = "allow"

# The Mozilla root certificates that reqwest's TLS verifier ships are data under the permissive
# CDLA-Permissive-2.0, which asks only that the licence text travel with the data.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[licenses.private]
# The workspace's own crates are not published.
ignore = true

[advisories]
ignore = [
    # bincode 1.3.3 is unmaintained (not vulnerable): cdshealpix 0.10.1, the CDS HEALPix crate
    # univ-ingest uses for sky coverage, depends on it without a feature to leave it out, and
    # univ-ingest never calls the cdshealpix code that serializes with it.
    { id = "RUSTSEC-2025-0141", reason = "unmaintained bincode through cdshealpix 0.10.1, unused" },
]

[bans]
wildcards = "deny"
# Path dependencies between the workspace's own unpublished crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
